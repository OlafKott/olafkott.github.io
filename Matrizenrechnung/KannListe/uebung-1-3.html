<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übung 1.3: Lösbarkeit eines LGS in Stufenform beurteilen</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11pt;
    line-height: 1.5;
    color: #1a1a1a;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
    background: #fff;
  }
  h1 {
    color: #C8102E;
    font-size: 18pt;
    border-bottom: 2px solid #C8102E;
    padding-bottom: 6px;
    margin: 0 0 12px 0;
  }
  h2 {
    color: #C8102E;
    font-size: 13pt;
    margin: 18px 0 8px 0;
  }
  .beschreibung {
    font-style: italic;
    color: #555;
    margin: 0 0 18px 0;
  }
  .aufgabe-box {
    background: #fdf2f3;
    border-left: 4px solid #C8102E;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box {
    background: #fff8e1;
    border-left: 4px solid #c79100;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box[hidden] { display: none; }
  .formel-box {
    display: inline-block;
    background: #fff8e1;
    border: 1px solid #c79100;
    color: #6d4c00;
    padding: 4px 12px;
    margin: 4px 0;
    border-radius: 3px;
    font-weight: bold;
  }
  .tr-box {
    display: inline-block;
    background: #e8f5e9;
    border: 1px solid #2e7d32;
    color: #1b5e20;
    padding: 4px 10px;
    margin: 4px 0;
    border-radius: 3px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 10pt;
    white-space: pre-line;
  }
  button {
    background: #C8102E;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 11pt;
    font-family: inherit;
    font-weight: bold;
    border-radius: 3px;
    cursor: pointer;
    margin: 4px 4px 4px 0;
  }
  button:hover { background: #a00d24; }
  button.sekundaer {
    background: #fff;
    color: #C8102E;
    border: 1.5px solid #C8102E;
  }
  button.sekundaer:hover { background: #fdf2f3; }
  .matrix {
    display: inline-grid;
    vertical-align: middle;
    padding: 2px 6px;
    border-left: 1.5px solid #1a1a1a;
    border-right: 1.5px solid #1a1a1a;
    margin: 0 2px;
    column-gap: 10px;
    row-gap: 2px;
  }
  .matrix .cell {
    text-align: center;
    padding: 0;
  }
  .matrix-wrap {
    text-align: center;
    margin: 8px 0;
  }
  .var { font-style: italic; }
  .small { font-size: 9.5pt; color: #555; }
  ol, ul { padding-left: 22px; }
  ol li, ul li { margin: 3px 0; }
  .nav {
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid #ddd;
    font-size: 10pt;
    color: #666;
  }
  .nav a {
    color: #C8102E;
    text-decoration: none;
    margin-right: 12px;
  }
  .nav a:hover { text-decoration: underline; }
  .schritt {
    margin: 6px 0;
  }
  .schritt-label {
    font-weight: bold;
    color: #C8102E;
    font-size: 10pt;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
    display: block;
    margin-bottom: 2px;
  }
  p { margin: 6px 0; }
</style>
</head>
<body>
<h1>Übung 1.3: Lösbarkeit eines LGS in Stufenform beurteilen</h1>
<p class="beschreibung">Beurteile, ob das LGS eindeutig lösbar ist, keine Lösung hat oder unendlich viele Lösungen besitzt.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // Zufällig: eindeutig, keine Lösung, oder unendlich viele
  const typ = randInt(0, 2); // 0=eindeutig, 1=keine, 2=unendlich
  let rows, antwort, begruendung;

  if (typ === 0) {
    // Eindeutige Lösung: dreieckige Matrix mit Diagonale ≠ 0
    const a = randIntExcl(-3, 3, [0]);
    const b = randInt(-3, 3);
    const c = randInt(-3, 3);
    const d = randIntExcl(-3, 3, [0]);
    const e = randInt(-3, 3);
    const f = randIntExcl(-3, 3, [0]);
    rows = [
      [fmtNum(a), fmtNum(b), fmtNum(c), '|', fmtNum(randInt(-5,5))],
      ['0',       fmtNum(d), fmtNum(e), '|', fmtNum(randInt(-5,5))],
      ['0',       '0',       fmtNum(f), '|', fmtNum(randInt(-5,5))]
    ];
    antwort = 'eindeutige Lösung';
    begruendung = 'Keine Nullzeile vorhanden, und in jeder Spalte vor dem Trennstrich gibt es eine führende Zahl ≠ 0. Damit liegt eine eindeutige Lösung vor.';
  } else if (typ === 1) {
    // Keine Lösung: Nullzeile mit rechter Seite ≠ 0
    rows = [
      [fmtNum(randIntExcl(-3,3,[0])), fmtNum(randInt(-3,3)), fmtNum(randInt(-3,3)), '|', fmtNum(randInt(-5,5))],
      ['0', fmtNum(randIntExcl(-3,3,[0])), fmtNum(randInt(-3,3)), '|', fmtNum(randInt(-5,5))],
      ['0', '0', '0', '|', fmtNum(randIntExcl(1,5,[0]))]
    ];
    antwort = 'keine Lösung';
    begruendung = 'Die letzte Zeile entspricht der Gleichung 0 = '+rows[2][4]+'. Das ist ein Widerspruch — das LGS hat keine Lösung.';
  } else {
    // Unendlich viele: Nullzeile mit rechter Seite 0
    rows = [
      [fmtNum(randIntExcl(-3,3,[0])), fmtNum(randInt(-3,3)), fmtNum(randInt(-3,3)), '|', fmtNum(randInt(-5,5))],
      ['0', fmtNum(randIntExcl(-3,3,[0])), fmtNum(randInt(-3,3)), '|', fmtNum(randInt(-5,5))],
      ['0', '0', '0', '|', '0']
    ];
    antwort = 'unendlich viele Lösungen';
    begruendung = 'Die letzte Zeile entspricht 0 = 0. Eine Variable kann frei gewählt werden (Parameter), die anderen ergeben sich daraus. Damit hat das LGS unendlich viele Lösungen.';
  }

  let html = '<p>Das folgende LGS liegt bereits in Stufenform vor:</p>';
  html += matBlock(rows);
  html += '<p>Beurteilen Sie die Lösbarkeit: <b>eindeutige Lösung</b>, <b>keine Lösung</b> oder <b>unendlich viele Lösungen</b>?</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">Antwort</span>';
  lsg += '<span class="formel-box">' + antwort + '</span></div>';
  lsg += '<div class="schritt"><span class="schritt-label">Begründung</span>'+begruendung+'</div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
</html>
