<style>

<body>
<h1>Übung 4.5: Langfristige Verteilung (iterativ)</h1>
<p class="beschreibung">Bestimme die stationäre Verteilung durch wiederholte Matrixmultiplikation.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // 2x2 stochastische Matrix mit eindeutiger stationärer Verteilung
  const a = randInt(3, 8) / 10;
  const b = randInt(3, 8) / 10;
  const M = [[a, b], [Math.round((1-a)*10)/10, Math.round((1-b)*10)/10]];
  const v0a = randInt(1, 9) / 10;
  const v0 = [v0a, Math.round((1-v0a)*10)/10];

  function pf1(x) { return (Math.round(x*10)/10).toFixed(1).replace('.', ','); }
  function pf3(x) { return (Math.round(x*1000)/1000).toFixed(3).replace('.', ','); }
  function matVec(M, v) { return [M[0][0]*v[0]+M[0][1]*v[1], M[1][0]*v[0]+M[1][1]*v[1]]; }

  // Iteriere bis Konvergenz
  const vs = [v0];
  let stabil = -1;
  for (let i = 1; i <= 30; i++) {
    vs.push(matVec(M, vs[i-1]));
    if (Math.abs(vs[i][0]-vs[i-1][0]) < 0.0005 && Math.abs(vs[i][1]-vs[i-1][1]) < 0.0005) {
      stabil = i;
      break;
    }
  }

  let html = '<p>Bestimmen Sie die <b>langfristige Verteilung</b> durch wiederholte Matrixmultiplikation.</p>';
  html += '<p>M = ' + matHTML(M.map(r=>r.map(c=>pf1(c)))) + ', &nbsp; Startverteilung <span class="var">v</span><sub>0</sub> = ' + matHTML(v0.map(x=>[pf1(x)])) + '</p>';
  html += '<p class="small">Multiplizieren Sie so oft mit M, bis sich die Werte (auf 3 Nachkommastellen gerundet) nicht mehr ändern.</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">Iteration (Auszug)</span>';
  const zeigen = [1, 2, 3, 5, 8, 12, 16, stabil < 0 ? 20 : stabil].filter(i => i < vs.length);
  for (const i of zeigen) {
    lsg += '<div><span class="var">v</span><sub>'+i+'</sub> ≈ ('+pf3(vs[i][0])+'; '+pf3(vs[i][1])+')</div>';
  }
  lsg += '</div>';

  const grenz = vs[vs.length-1];
  lsg += '<div class="schritt"><span class="schritt-label">Stationäre Verteilung</span>';
  if (stabil > 0) lsg += 'Ab <span class="var">n</span> ≈ '+stabil+' ändern sich die Werte nicht mehr (gerundet auf 3 Nachkommastellen).<br>';
  lsg += '<span class="formel-box">langfristige Verteilung ≈ ('+pf3(grenz[0])+'; '+pf3(grenz[1])+')</span></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Hinweis</span>';
  lsg += 'Die Lösung wurde durch <b>iteratives Multiplizieren</b> bestimmt, <u>nicht</u> über ein LGS.</div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
