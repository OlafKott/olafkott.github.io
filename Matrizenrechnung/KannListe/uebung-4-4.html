<body>
<h1>Übung 4.4: Vergangene Verteilung mit Inverser</h1>
<p class="beschreibung">Bestimme die Verteilung im vorhergehenden Zeitschritt mit M⁻¹ · vₙ.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // 2x2 invertierbare stochastische Matrix; konstruiere v_{n-1} ganzzahlig, daraus v_n
  // Damit v_{n-1} schöne Zahlen hat
  const a = randInt(2, 8) / 10;
  const b = randInt(2, 8) / 10;
  const M = [[a, b], [Math.round((1-a)*10)/10, Math.round((1-b)*10)/10]];
  // Wir wählen v_{n-1} mit hübschen Zehntel-Werten und berechnen v_n = M · v_{n-1}
  const vprev_a = randInt(2, 8) / 10;
  const vprev = [vprev_a, Math.round((1-vprev_a)*10)/10];
  // v_n
  const v = [M[0][0]*vprev[0]+M[0][1]*vprev[1], M[1][0]*vprev[0]+M[1][1]*vprev[1]];

  function pf1(x) { return (Math.round(x*100)/100).toFixed(2).replace('.', ','); }

  let html = '<p>Bestimmen Sie die Verteilung im <b>vorhergehenden</b> Zeitschritt.</p>';
  html += '<p>M = ' + matHTML(M.map(r=>r.map(c=>pf1(c)))) + ', &nbsp; aktuelle Verteilung <span class="var">v</span><sub><span class="var">n</span></sub> = ' + matHTML(v.map(x=>[pf1(x)])) + '</p>';
  document.getElementById('aufgabe').innerHTML = html;

  // M^-1
  const det = M[0][0]*M[1][1] - M[0][1]*M[1][0];
  const Minv = [[M[1][1]/det, -M[0][1]/det], [-M[1][0]/det, M[0][0]/det]];
  const vprev_calc = [Minv[0][0]*v[0]+Minv[0][1]*v[1], Minv[1][0]*v[0]+Minv[1][1]*v[1]];

  let lsg = '<div class="schritt"><span class="schritt-label">Formel</span>';
  lsg += '<span class="formel-box"><span class="var">v</span><sub><span class="var">n</span>−1</sub> = M<sup>−1</sup> · <span class="var">v</span><sub><span class="var">n</span></sub></span></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Schritt 1: Inverse mit CASIO</span>';
  lsg += '<span class="tr-box">MatA = M\nMatA⁻¹ → EXE</span><br>';
  lsg += 'M<sup>−1</sup> ≈ ' + matHTML(Minv.map(r=>r.map(c=>pf1(c)))) + '</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Schritt 2: Multiplikation</span>';
  lsg += '<span class="var">v</span><sub><span class="var">n</span>−1</sub> = M<sup>−1</sup> · <span class="var">v</span><sub><span class="var">n</span></sub> ≈ ' + matHTML(vprev_calc.map(x=>[pf1(x)])) + '</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Plausibilität</span>';
  const summe = vprev_calc[0] + vprev_calc[1];
  lsg += 'Summe: '+pf1(vprev_calc[0])+' + '+pf1(vprev_calc[1])+' = '+pf1(summe)+' (≈ 1) ✓<br>';
  lsg += 'Beide Komponenten ≥ 0 ✓</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Ergebnis</span>';
  lsg += '<span class="formel-box"><span class="var">v</span><sub><span class="var">n</span>−1</sub> ≈ ' + matHTML(vprev_calc.map(x=>[pf1(x)])) + '</span></div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
