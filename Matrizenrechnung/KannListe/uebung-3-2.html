<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übung 3.2: RE-Matrix berechnen</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11pt;
    line-height: 1.5;
    color: #1a1a1a;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
    background: #fff;
  }
  h1 {
    color: #C8102E;
    font-size: 18pt;
    border-bottom: 2px solid #C8102E;
    padding-bottom: 6px;
    margin: 0 0 12px 0;
  }
  h2 {
    color: #C8102E;
    font-size: 13pt;
    margin: 18px 0 8px 0;
  }
  .beschreibung {
    font-style: italic;
    color: #555;
    margin: 0 0 18px 0;
  }
  .aufgabe-box {
    background: #fdf2f3;
    border-left: 4px solid #C8102E;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box {
    background: #fff8e1;
    border-left: 4px solid #c79100;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box[hidden] { display: none; }
  .formel-box {
    display: inline-block;
    background: #fff8e1;
    border: 1px solid #c79100;
    color: #6d4c00;
    padding: 4px 12px;
    margin: 4px 0;
    border-radius: 3px;
    font-weight: bold;
  }
  .tr-box {
    display: inline-block;
    background: #e8f5e9;
    border: 1px solid #2e7d32;
    color: #1b5e20;
    padding: 4px 10px;
    margin: 4px 0;
    border-radius: 3px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 10pt;
    white-space: pre-line;
  }
  button {
    background: #C8102E;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 11pt;
    font-family: inherit;
    font-weight: bold;
    border-radius: 3px;
    cursor: pointer;
    margin: 4px 4px 4px 0;
  }
  button:hover { background: #a00d24; }
  button.sekundaer {
    background: #fff;
    color: #C8102E;
    border: 1.5px solid #C8102E;
  }
  button.sekundaer:hover { background: #fdf2f3; }
  .matrix {
    display: inline-grid;
    vertical-align: middle;
    padding: 2px 6px;
    border-left: 1.5px solid #1a1a1a;
    border-right: 1.5px solid #1a1a1a;
    margin: 0 2px;
    column-gap: 10px;
    row-gap: 2px;
  }
  .matrix .cell {
    text-align: center;
    padding: 0;
  }
  .matrix-wrap {
    text-align: center;
    margin: 8px 0;
  }
  .var { font-style: italic; }
  .small { font-size: 9.5pt; color: #555; }
  ol, ul { padding-left: 22px; }
  ol li, ul li { margin: 3px 0; }
  .nav {
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid #ddd;
    font-size: 10pt;
    color: #666;
  }
  .nav a {
    color: #C8102E;
    text-decoration: none;
    margin-right: 12px;
  }
  .nav a:hover { text-decoration: underline; }
  .schritt {
    margin: 6px 0;
  }
  .schritt-label {
    font-weight: bold;
    color: #C8102E;
    font-size: 10pt;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
    display: block;
    margin-bottom: 2px;
  }
  p { margin: 6px 0; }
</style>
</head>
<body>
<h1>Übung 3.2: RE-Matrix berechnen</h1>
<p class="beschreibung">Berechne die RE-Matrix als Produkt RZ · ZE.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // 2 R, 3 Z, 2 E. RZ: 2x3, ZE: 3x2 -> RE: 2x2
  const RZ = [[randInt(1,3), randInt(0,3), randInt(0,3)],
              [randInt(0,3), randInt(0,3), randInt(1,3)]];
  const ZE = [[randInt(1,3), randInt(0,3)],
              [randInt(0,3), randInt(1,3)],
              [randInt(0,3), randInt(0,3)]];

  // RE = RZ · ZE
  const RE = [[0,0],[0,0]];
  for (let i = 0; i < 2; i++)
    for (let j = 0; j < 2; j++)
      for (let k = 0; k < 3; k++)
        RE[i][j] += RZ[i][k]*ZE[k][j];

  let html = '<p>Berechnen Sie die RE-Matrix aus RZ und ZE.</p>';
  html += '<p>RZ = ' + matHTML(RZ.map(r=>r.map(c=>fmtNum(c)))) + ' &nbsp; (2×3)</p>';
  html += '<p>ZE = ' + matHTML(ZE.map(r=>r.map(c=>fmtNum(c)))) + ' &nbsp; (3×2)</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">Formel</span>';
  lsg += '<span class="formel-box">RE = RZ · ZE</span></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Formate prüfen</span>';
  lsg += 'RZ (2×3) · ZE (3×2) → RE (2×2). Da 3 = 3, ist die Multiplikation möglich.</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Einträge berechnen (Zeile · Spalte)</span>';
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      const parts = [];
      for (let k = 0; k < 3; k++) parts.push(fmtNum(RZ[i][k])+'·'+fmtNum(ZE[k][j]));
      lsg += '<div><span class="var">re</span><sub>'+(i+1)+','+(j+1)+'</sub> = '+parts.join(' + ')+' = '+fmtNum(RE[i][j])+'</div>';
    }
  }
  lsg += '</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Ergebnis</span>';
  lsg += '<span class="formel-box">RE = ' + matHTML(RE.map(r=>r.map(c=>fmtNum(c)))) + '</span></div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
</html>
