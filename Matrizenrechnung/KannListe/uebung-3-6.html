<style>

<body>
<h1>Übung 3.6: Fehlenden Wert in einer Matrix bestimmen</h1>
<p class="beschreibung">Bestimme die unbekannte Variable in einer Matrix aus einem bekannten Produkt.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // RZ 2x2, ZE 2x2, in RZ ist ein Eintrag durch 'a' ersetzt
  const a = randInt(1, 5); // tatsächlicher Wert
  const RZ = [[randInt(1, 4), randInt(1, 4)],
              [a, randInt(1, 4)]];   // RZ[1][0] = a
  const ZE = [[randInt(1, 4), randInt(0, 3)],
              [randInt(0, 3), randInt(1, 4)]];

  // RE = RZ · ZE; alle Einträge bekannt sind, aber eines markieren wir mit 'b'
  const RE = [[0,0],[0,0]];
  for (let i = 0; i < 2; i++)
    for (let j = 0; j < 2; j++)
      for (let k = 0; k < 2; k++)
        RE[i][j] += RZ[i][k]*ZE[k][j];
  // b ist RE[1][0] – wir geben es an, weil das von a abhängt
  const bValue = RE[1][0];

  // Aufgabe: zeige RZ mit 'a', ZE komplett, und RE mit Loch '?' bei (1,1) (das aus 'a' bestimmt wird)
  const RZ_show = RZ.map(r => r.map(c => fmtNum(c)));
  RZ_show[1][0] = '<span class="var">a</span>';

  let html = '<p>In der RZ-Matrix ist ein Eintrag unbekannt. Berechnen Sie <span class="var">a</span>, wenn der markierte Eintrag in RE = '+fmtNum(bValue)+' ist.</p>';
  html += '<p>RZ = ' + matHTML(RZ_show) + ', &nbsp; ZE = ' + matHTML(ZE.map(r=>r.map(c=>fmtNum(c)))) + '</p>';
  html += '<p class="small">Bekannt: <span class="var">re</span><sub>2,1</sub> = '+fmtNum(bValue)+'.</p>';
  document.getElementById('aufgabe').innerHTML = html;

  // Lösung: re_{2,1} = a*ze_{1,1} + RZ[1][1]*ze_{2,1} = b -> a = (b - RZ[1][1]*ze_{2,1}) / ze_{1,1}
  const ze11 = ZE[0][0], rzs = RZ[1][1], ze21 = ZE[1][0];

  let lsg = '<div class="schritt"><span class="schritt-label">Skalarprodukt für re<sub>2,1</sub></span>';
  lsg += '<span class="var">re</span><sub>2,1</sub> = <span class="var">a</span>·'+fmtNum(ze11)+' + '+fmtNum(rzs)+'·'+fmtNum(ze21)+' = '+fmtNum(bValue)+'</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Gleichung lösen</span>';
  lsg += fmtNum(ze11)+'<span class="var">a</span> + '+fmtNum(rzs*ze21)+' = '+fmtNum(bValue)+'<br>';
  lsg += fmtNum(ze11)+'<span class="var">a</span> = '+fmtNum(bValue - rzs*ze21)+'</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Ergebnis</span>';
  lsg += '<span class="formel-box"><span class="var">a</span> = '+fmtNum(a)+'</span></div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
