<style>

<body>
<h1>Übung 1.2: LGS lösen (Gauß und CASIO)</h1>
<p class="beschreibung">Löse das LGS — entweder mit dem Gauß-Verfahren oder mit dem CASIO. Die Lösung wird durch Probe in Zeile 1 verifiziert.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // Wir konstruieren eine eindeutig lösbare 3x3-Matrix mit ganzzahliger Lösung.
  // Lösung x, y, z zufällig wählen, dann LGS rückwärts aufbauen.
  const xL = randInt(-3, 4), yL = randInt(-3, 4), zL = randInt(-3, 4);
  // Drei Koeffizienten-Zeilen, jeweils ax + by + cz = d
  function row() {
    let a, b, c;
    do {
      a = randInt(-3, 3); b = randInt(-3, 3); c = randInt(-3, 3);
    } while (a === 0 && b === 0 && c === 0);
    const d = a*xL + b*yL + c*zL;
    return [a, b, c, d];
  }
  const r1 = row(), r2 = row(), r3 = row();
  // Sicherstellen: lineare Unabhängigkeit, sonst neu starten
  function det3(m) {
    return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
         - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
         + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  }
  const M = [[r1[0],r1[1],r1[2]],[r2[0],r2[1],r2[2]],[r3[0],r3[1],r3[2]]];
  if (Math.abs(det3(M)) < 0.5) { generiere(); return; }

  let html = '<p>Lösen Sie das folgende lineare Gleichungssystem.</p>';
  html += '<p>Verwenden Sie das <b>Gauß-Verfahren</b> oder den <b>CASIO</b>.</p>';
  html += '<p>Als erweiterte Koeffizientenmatrix:</p>';
  const rows = [r1, r2, r3].map(r => [fmtNum(r[0]), fmtNum(r[1]), fmtNum(r[2]), '|', fmtNum(r[3])]);
  html += matBlock(rows);
  html += '<p class="small">Tipp: Mit dem CASIO einfach Menü → Gleichung → Simult. Gleichung.</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">CASIO-Lösung</span>';
  lsg += '<span class="tr-box">Menü → Gleichung → Simult. Gleichung\n';
  lsg += 'Anzahl Unbekannte: 3\n';
  lsg += 'Koeffizienten und rechte Seite eingeben\n';
  lsg += 'EXE → Lösung ablesen</span></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Ergebnis</span>';
  lsg += '<span class="formel-box"><span class="var">x</span> = '+fmtNum(xL)+', &nbsp; <span class="var">y</span> = '+fmtNum(yL)+', &nbsp; <span class="var">z</span> = '+fmtNum(zL)+'</span></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Probe (Zeile 1)</span>';
  lsg += fmtNum(r1[0])+'·('+fmtNum(xL)+') + '+fmtNum(r1[1])+'·('+fmtNum(yL)+') + '+fmtNum(r1[2])+'·('+fmtNum(zL)+') = '+fmtNum(r1[3])+' ✓</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Hinweis zum Gauß-Verfahren</span>';
  lsg += 'Bringe die Matrix durch Zeilenumformungen (Vertauschen, Addieren von Vielfachen, Multiplikation einer Zeile mit einer Zahl ≠ 0) auf <b>Stufenform</b>. Lies dann rückwärts ab, beginnend mit der untersten Zeile.</div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
