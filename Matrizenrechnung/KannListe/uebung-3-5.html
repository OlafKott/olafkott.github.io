<body>
<h1>Übung 3.5: Fehlende Matrix mit Inverser</h1>
<p class="beschreibung">Bestimme die fehlende Matrix (RZ oder ZE) mithilfe der Inversen.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // Konstruktion: nimm 2x2 Z (invertierbar) und 2x2 X (zu bestimmen), berechne P = Z·X.
  // Gib Z und P; gesucht: X = Z^{-1} · P
  // X ganzzahlig, Z invertierbar mit Det = ±1, damit Inverse ganzzahlig
  let Z, X;
  do {
    const a = randInt(-2, 3), b = randInt(-2, 3), c = randInt(-2, 3), d = randInt(-2, 3);
    if (Math.abs(a*d - b*c) === 1) Z = [[a, b],[c, d]];
  } while (!Z);
  X = [[randInt(1, 4), randInt(0, 3)],
       [randInt(0, 3), randInt(1, 4)]];
  // P = Z · X
  const P = [[0,0],[0,0]];
  for (let i = 0; i < 2; i++)
    for (let j = 0; j < 2; j++)
      for (let k = 0; k < 2; k++)
        P[i][j] += Z[i][k]*X[k][j];

  // Wir benennen das im Sachkontext: RZ (=Z) gegeben, RE (=P) gegeben, ZE (=X) gesucht
  let html = '<p>Gegeben: RZ und RE. Bestimmen Sie die ZE-Matrix.</p>';
  html += '<p>RZ = ' + matHTML(Z.map(r=>r.map(c=>fmtNum(c)))) + ', &nbsp; RE = ' + matHTML(P.map(r=>r.map(c=>fmtNum(c)))) + '</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">Schritt 1: Gleichung umstellen</span>';
  lsg += 'Aus RE = RZ · ZE folgt durch Multiplikation mit RZ<sup>−1</sup> von links:</div>';
  lsg += '<div class="schritt"><span class="formel-box">ZE = RZ<sup>−1</sup> · RE</span></div>';

  // RZ^-1 (Det = ±1 garantiert ganzzahlig)
  const det = Z[0][0]*Z[1][1] - Z[0][1]*Z[1][0];
  const Zinv = [[Z[1][1]/det, -Z[0][1]/det], [-Z[1][0]/det, Z[0][0]/det]];

  lsg += '<div class="schritt"><span class="schritt-label">Schritt 2: Inverse mit CASIO</span>';
  lsg += '<span class="tr-box">Menü → Matrix → MatA = RZ\nMatA⁻¹ → EXE</span><br>';
  lsg += 'RZ<sup>−1</sup> = ' + matHTML(Zinv.map(r=>r.map(c=>fmtNum(c)))) + '</div>';

  lsg += '<div class="schritt"><span class="schritt-label">Schritt 3: Produkt RZ⁻¹ · RE</span>';
  lsg += '<span class="formel-box">ZE = ' + matHTML(X.map(r=>r.map(c=>fmtNum(c)))) + '</span></div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
