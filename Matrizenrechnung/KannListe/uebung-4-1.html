<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übung 4.1: Eigenschaften einer stochastischen Matrix prüfen</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11pt;
    line-height: 1.5;
    color: #1a1a1a;
    max-width: 800px;

  }
  h1 {
    color: #C8102E;

  }
  .beschreibung {
    font-style: italic;

    margin: 0 0 18px 0;
  }
  .aufgabe-box {
    background: #fdf2f3;
    border-left: 4px solid #C8102E;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box {
    background: #fff8e1;
    border-left: 4px solid #c79100;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 2px;
  }
  .loesung-box[hidden] { display: none; }
  .formel-box {
    display: inline-block;
    background: #fff8e1;

  }
  .tr-box {
    display: inline-block;
    background: #e8f5e9;
    border: 1px solid #2e7d32;
    color: #1b5e20;
    padding: 4px 10px;
    margin: 4px 0;
    border-radius: 3px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 10pt;
    white-space: pre-line;
  }
  button {
    background: #C8102E;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 11pt;

    font-weight: bold;

    cursor: pointer;

  }
  button:hover { background: #a00d24; }
  button.sekundaer {
    background: #fff;

    border: 1.5px solid #C8102E;
  }
  button.sekundaer:hover { background: #fdf2f3; }
  .matrix {
    display: inline-grid;
    vertical-align: middle;
    padding: 2px 6px;
    border-left: 1.5px solid #1a1a1a;

    column-gap: 10px;
    row-gap: 2px;
  }
  .matrix .cell {
    text-align: center;
    padding: 0;
  }
  .matrix-wrap {
    text-align: center;
    margin: 8px 0;
  }
  .var { font-style: italic; }
  .small { font-size: 9.5pt; color: #555; }
  ol, ul { padding-left: 22px; }
  ol li, ul li { margin: 3px 0; }
  .nav {
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid #ddd;

  }
  .nav a {
    color: #C8102E;

  }
  .nav a:hover { text-decoration: underline; }

    margin: 6px 0;
  }
  .schritt-label {
    font-weight: bold;
    color: #C8102E;
    font-size: 10pt;

    letter-spacing: 0.5pt;

    margin-bottom: 2px;
  }
  p { margin: 6px 0; }
</style>
</head>
<body>
<h1>Übung 4.1: Eigenschaften einer stochastischen Matrix prüfen</h1>
<p class="beschreibung">Untersuche, ob die gegebene Matrix die drei Eigenschaften einer stochastischen Matrix erfüllt.</p>

<h2>Aufgabe</h2>
<div class="aufgabe-box" id="aufgabe"></div>

<div style="margin: 12px 0;">
  <button onclick="neueAufgabe()">🎲 Neue Aufgabe</button>
  <button class="sekundaer" onclick="toggleLoesung()" id="loesung-btn">Lösung anzeigen</button>
</div>

<h2 id="loesung-h2" hidden>Lösung</h2>
<div class="loesung-box" id="loesung" hidden></div>

<div class="nav">
  <a href="index.html">← Übersicht aller Übungen</a>
</div>

<script>
// ===== Hilfsfunktionen =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randIntExcl(min, max, exclude) {
  let v;
  do { v = randInt(min, max); } while (exclude.includes(v));
  return v;
}
function matHTML(rows) {
  // Tabellenfrei: nutzt CSS-Grid in einem <span>, sodass es überall (auch in <p>) eingebettet werden kann.
  if (rows.length === 0) return '';
  const cols = rows[0].length;
  let html = '<span class="matrix" style="grid-template-columns: repeat(' + cols + ', auto);">';
  for (const r of rows) {
    for (const c of r) {
      html += '<span class="cell">' + c + '</span>';
    }
  }
  return html + '</span>';
}
function matBlock(rows) {
  // Block-Matrix (eigene Zeile, zentriert) — für alleinstehende Matrizen
  return '<div class="matrix-wrap">' + matHTML(rows) + '</div>';
}
function fmtNum(n) {
  // Deutsche Notation: Komma statt Punkt, Minuszeichen
  if (n === 0) return '0';
  const s = (Math.round(n * 1000) / 1000).toString();
  return s.replace('-', '−').replace('.', ',');
}

// ===== Aufgabenlogik (wird unten überschrieben) =====

function generiere() {
  // Erzeuge entweder eine echte stochastische Matrix oder eine, die eine Bedingung verletzt
  const typ = randInt(0, 3);  // 0=ok, 1=Spaltensumme≠1, 2=Eintrag>1, 3=nicht quadratisch
  let M, ok = true, fehler = '';
  if (typ === 3) {
    // nicht quadratisch
    M = [
      [0.5, 0.3, 0.2],
      [0.5, 0.7, 0.8]
    ];
    ok = false; fehler = 'Die Matrix ist nicht quadratisch (2×3).';
  } else if (typ === 2) {
    // Eintrag > 1
    M = [
      [0.7, 1.2],
      [0.3, -0.2]
    ];
    ok = false; fehler = 'Die Einträge müssen alle in [0; 1] liegen — hier ist 1,2 zu groß und −0,2 negativ.';
  } else if (typ === 1) {
    // Spaltensumme ≠ 1
    M = [
      [0.6, 0.3],
      [0.3, 0.4]
    ];
    ok = false; fehler = 'Die Spaltensummen müssen 1 sein. Spalte 1: 0,6 + 0,3 = 0,9 ≠ 1.';
  } else {
    // echt stochastisch
    const a = (randInt(1, 9))/10;
    const b = (randInt(1, 9))/10;
    M = [
      [a, b],
      [1-a, 1-b]
    ];
    ok = true;
  }

  function fmtP(n) { return (Math.round(n*10)/10).toString().replace('.', ','); }

  let html = '<p>Untersuchen Sie, ob die folgende Matrix eine <b>stochastische Matrix</b> ist.</p>';
  html += '<p>M = ' + matHTML(M.map(r=>r.map(c=>fmtP(c)))) + '</p>';
  document.getElementById('aufgabe').innerHTML = html;

  let lsg = '<div class="schritt"><span class="schritt-label">Drei Bedingungen prüfen</span><ol>';
  const m = M.length, n = M[0].length;
  lsg += '<li>Quadratisch? '+(m === n ? 'Ja ('+m+'×'+n+') ✓' : 'Nein ('+m+'×'+n+') ✗')+'</li>';
  let alleInBereich = true;
  for (const r of M) for (const c of r) if (c < 0 || c > 1) alleInBereich = false;
  lsg += '<li>Alle Einträge in [0; 1]? '+(alleInBereich ? 'Ja ✓' : 'Nein ✗')+'</li>';
  // Spaltensummen prüfen
  let spaltenOk = true;
  if (m === n) {
    for (let j = 0; j < n; j++) {
      let s = 0;
      for (let i = 0; i < m; i++) s += M[i][j];
      if (Math.abs(s - 1) > 0.001) spaltenOk = false;
    }
  } else spaltenOk = false;
  lsg += '<li>Jede Spaltensumme = 1? '+(spaltenOk ? 'Ja ✓' : 'Nein ✗')+'</li>';
  lsg += '</ol></div>';

  lsg += '<div class="schritt"><span class="schritt-label">Antwort</span>';
  if (ok) lsg += '<span class="formel-box">M ist eine stochastische Matrix ✓</span>';
  else lsg += '<span class="formel-box">M ist <u>keine</u> stochastische Matrix</span><br>'+fehler;
  lsg += '</div>';

  document.getElementById('loesung').innerHTML = lsg;
}


function toggleLoesung() {
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  if (l.hasAttribute('hidden')) {
    l.removeAttribute('hidden');
    h.removeAttribute('hidden');
    btn.textContent = 'Lösung ausblenden';
  } else {
    l.setAttribute('hidden', '');
    h.setAttribute('hidden', '');
    btn.textContent = 'Lösung anzeigen';
  }
}

// Bei jeder neuen Aufgabe Lösung ausblenden
function neueAufgabe() {
  generiere();
  const l = document.getElementById('loesung');
  const h = document.getElementById('loesung-h2');
  const btn = document.getElementById('loesung-btn');
  l.setAttribute('hidden', '');
  h.setAttribute('hidden', '');
  btn.textContent = 'Lösung anzeigen';
}

// Initialer Aufruf
generiere();
</script>
</body>
</html>
