function starteKonfetti() {
  const farben = ["#C8102E", "#2e7d32", "#d6a300", "#2a6fa1", "#8e44ad"];
  for (let i = 0; i < 50; i++) {
    const k = document.createElement("div");
    k.className = "konfetti";
    k.style.left = Math.random() * 100 + "vw";
    k.style.background = farben[Math.floor(Math.random() * farben.length)];
    k.style.animation = "konfettiFall " + (1.5 + Math.random()*1.5) + "s ease-in forwards";
    k.style.animationDelay = (Math.random() * 0.3) + "s";
    if (Math.random() > 0.5) { k.style.borderRadius = "50%"; }
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 3500);
  }
}
function parseKomma(s) { if (!s && s !== 0) return NaN; return parseFloat(String(s).replace(",",".")); }
function binomPdf(n, p, k) {
  let bk = 1;
  for (let i = 0; i < k; i++) bk = bk * (n - i) / (i + 1);
  return bk * Math.pow(p, k) * Math.pow(1-p, n-k);
}
function binomCdf(n, p, von, bis) {
  let s = 0;
  for (let k = von; k <= bis; k++) s += binomPdf(n, p, k);
  return s;
}

// ===== Bedingungs-Typen =====
// "le_ge": P(X ≤ k) ≥ s   ("höchstens k Treffer mit mindestens s")
// "le_le": P(X ≤ k) ≤ s   ("höchstens k Treffer mit höchstens s")
// "ge_ge": P(X ≥ k) ≥ s   ("mindestens k Treffer mit mindestens s")
// "ge_le": P(X ≥ k) ≤ s   ("mindestens k Treffer mit höchstens s")

const bedLabels = {
  "le_ge": "P(X ≤ k) ≥ s",
  "le_le": "P(X ≤ k) ≤ s",
  "ge_ge": "P(X ≥ k) ≥ s",
  "ge_le": "P(X ≥ k) ≤ s"
};

function konkretes_bedLabel(typ, k_text, s) {
  // Ersetzt k durch konkrete Zahl und s durch konkrete Schwelle
  const sStr = s.toFixed(2).replace(/0+$/,'').replace(/\.$/,'').replace(".",",");
  const map = {
    "le_ge": `P(X ≤ ${k_text}) ≥ ${sStr}`,
    "le_le": `P(X ≤ ${k_text}) ≤ ${sStr}`,
    "ge_ge": `P(X ≥ ${k_text}) ≥ ${sStr}`,
    "ge_le": `P(X ≥ ${k_text}) ≤ ${sStr}`
  };
  return map[typ];
}

// ===== Aufgaben-Pool =====

  {
    icon: "🎲", gesucht: "k",
    kontext: "Ein <b>Würfel</b> wird <b>30-mal</b> geworfen. Beobachtet wird die Anzahl der Sechsen.",

    n: 30, p: 1/6, k_im_label: "k",

// ===== State =====
let akt = null;
let auswahl_gesucht = null;
let auswahl_bed = null;
let aufgedeckt_a = false;
let aufgedeckt_b = false;

function aktivBlock(id, aktiv) {
  const el = document.getElementById(id);
  if (aktiv) el.classList.remove("disabled");
  else el.classList.add("disabled");
}

function neueAufgabe() {
  let n;
  do { n = aufgaben[Math.floor(Math.random()*aufgaben.length)]; }
  while (n === akt && aufgaben.length > 1);
  akt = n;
  
  document.getElementById("aufgabe-text").innerHTML =
    '<span class="kontext-icon">' + n.icon + '</span>' + n.kontext + '<br><br>' + n.frage_kontext;
  document.getElementById("info-box").innerHTML = n.info;
  
  // a) Auswahl reset
  auswahl_gesucht = null;
  aufgedeckt_a = false;
  document.querySelectorAll("#opt-gesucht button").forEach(b => {
    b.classList.remove("user-richtig", "user-falsch", "zeigt-richtig");
    b.disabled = false;
  });
  document.getElementById("hint-a").classList.remove("aktiv", "korrekt");
  document.getElementById("hint-a").innerHTML = "";
  
  // b) Bedingungs-Optionen vorbereiten
  rendereBedingungen();
  aktivBlock("block-b", false);
  aktivBlock("block-c", false);
  document.getElementById("hint-b").classList.remove("aktiv", "korrekt");
  document.getElementById("hint-b").innerHTML = "";
  
  // c) Reset
  document.getElementById("ein-ergebnis").value = "";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("loesungsweg").style.display = "none";
}

function rendereBedingungen() {
  const wrap = document.getElementById("opt-bed");
  // 4 Bedingungs-Optionen, abhängig vom Aufgabentyp
  // Bei "k gesucht" erscheint im Label "k"
  // Bei "n/p gesucht" erscheint die konkrete k-Zahl
  const k_text = akt.gesucht === "k" ? "k" : akt.k_fix.toString();
  const typen = ["le_ge", "le_le", "ge_ge", "ge_le"];
  wrap.innerHTML = typen.map(t =>
    `<button data-typ="${t}" onclick="wahlBed('${t}')">${konkretes_bedLabel(t, k_text, akt.schwelle)}</button>`
  ).join("");
  auswahl_bed = null;
  aufgedeckt_b = false;
  document.querySelectorAll("#opt-bed button").forEach(b => {
    b.classList.remove("user-richtig", "user-falsch", "zeigt-richtig");
    b.disabled = false;
  });
}

// === a) Wahl: was ist gesucht? ===
document.querySelectorAll("#opt-gesucht button").forEach(b => {
  b.addEventListener("click", () => {
    if (aufgedeckt_a) return;
    auswahl_gesucht = b.dataset.val;
    aufgedeckt_a = true;
    
    const richtig = auswahl_gesucht === akt.gesucht;
    
    // Buttons markieren
    document.querySelectorAll("#opt-gesucht button").forEach(btn => {
      if (btn.dataset.val === akt.gesucht) {
        btn.classList.add(richtig ? "user-richtig" : "zeigt-richtig");
      } else if (btn.dataset.val === auswahl_gesucht && !richtig) {
        btn.classList.add("user-falsch");
      }
      btn.disabled = true;
    });
    
    // Hint anzeigen
    const hint = document.getElementById("hint-a");
    hint.classList.add("aktiv");
    if (richtig) {
      hint.classList.add("korrekt");
      hint.innerHTML = `✓ <b>Richtig!</b> ${akt.erklaerung_gesucht}`;
    } else {
      hint.innerHTML = `✗ Leider falsch. Gesucht ist <b>${akt.gesucht}</b>. ${akt.erklaerung_gesucht}`;
    }
    
    // b) freischalten
    aktivBlock("block-b", true);
  });
});

// === b) Wahl: welche Bedingung? ===
function wahlBed(typ) {
  if (aufgedeckt_b) return;
  auswahl_bed = typ;
  aufgedeckt_b = true;
  
  const richtig = auswahl_bed === akt.bed_typ;
  
  // Buttons markieren
  document.querySelectorAll("#opt-bed button").forEach(btn => {
    if (btn.dataset.typ === akt.bed_typ) {
      btn.classList.add(richtig ? "user-richtig" : "zeigt-richtig");
    } else if (btn.dataset.typ === auswahl_bed && !richtig) {
      btn.classList.add("user-falsch");
    }
    btn.disabled = true;
  });
  
  // Hint
  const hint = document.getElementById("hint-b");
  hint.classList.add("aktiv");
  if (richtig) {
    hint.classList.add("korrekt");
    hint.innerHTML = `✓ <b>Richtig!</b> ${akt.erklaerung_bed}`;
  } else {
    const k_text = akt.gesucht === "k" ? "k" : akt.k_fix.toString();
    hint.innerHTML = `✗ Leider falsch. Die richtige Bedingung ist <b>${konkretes_bedLabel(akt.bed_typ, k_text, akt.schwelle)}</b>. ${akt.erklaerung_bed}`;
  }
  
  // c) freischalten + Label/Hinweis anpassen
  aktivBlock("block-c", true);
  if (akt.gesucht === "k") {
    document.getElementById("ergebnis-label").textContent = "k =";
    document.getElementById("ergebnis-hinweis").textContent = "(ganzzahliger Wert)";
  } else if (akt.gesucht === "n") {
    document.getElementById("ergebnis-label").textContent = "n =";
    document.getElementById("ergebnis-hinweis").textContent = "(ganzzahliger Wert)";
  } else if (akt.gesucht === "p") {
    document.getElementById("ergebnis-label").textContent = "p ≤";
    document.getElementById("ergebnis-hinweis").textContent = "(zwei bis drei Nachkommastellen)";
  }
}

// === Sollwert-Berechnung ===
function berechneSoll(a) {
  if (a.gesucht === "k") {
    if (a.bed_typ === "le_ge") {
      // Kleinstes k mit P(X ≤ k) ≥ s
      for (let k = 0; k <= a.n; k++) {
        if (binomCdf(a.n, a.p, 0, k) >= a.schwelle) return k;
      }
      return a.n;
    } else if (a.bed_typ === "le_le") {
      // Größtes k mit P(X ≤ k) ≤ s
      for (let k = a.n; k >= 0; k--) {
        if (binomCdf(a.n, a.p, 0, k) <= a.schwelle) return k;
      }
      return 0;
    } else if (a.bed_typ === "ge_ge") {
      // Größtes k mit P(X ≥ k) ≥ s
      for (let k = a.n; k >= 0; k--) {
        if (binomCdf(a.n, a.p, k, a.n) >= a.schwelle) return k;
      }
      return 0;
    } else if (a.bed_typ === "ge_le") {
      // Kleinstes k mit P(X ≥ k) ≤ s
      for (let k = 0; k <= a.n; k++) {
        if (binomCdf(a.n, a.p, k, a.n) <= a.schwelle) return k;
      }
      return a.n;
    }
  } else if (a.gesucht === "n") {
    // Bei n suchen wir das kleinste n, für das die Bedingung gilt
    // Wir betrachten hier den Standardfall ge_ge: P(X ≥ k_fix) ≥ s
    // Für andere Typen: analog
    for (let n = 1; n <= 5000; n++) {
      let val;
      if (a.bed_typ === "le_ge") val = binomCdf(n, a.p, 0, a.k_fix);
      else if (a.bed_typ === "le_le") val = binomCdf(n, a.p, 0, a.k_fix);
      else if (a.bed_typ === "ge_ge") val = binomCdf(n, a.p, a.k_fix, n);
      else if (a.bed_typ === "ge_le") val = binomCdf(n, a.p, a.k_fix, n);
      
      let erfuellt;
      if (a.bed_typ === "le_ge") erfuellt = val >= a.schwelle;
      else if (a.bed_typ === "le_le") erfuellt = val <= a.schwelle;
      else if (a.bed_typ === "ge_ge") erfuellt = val >= a.schwelle;
      else if (a.bed_typ === "ge_le") erfuellt = val <= a.schwelle;
      
      if (erfuellt) return n;
    }
    return 5000;
  } else if (a.gesucht === "p") {
    // Bisektion: größtes p mit Bedingung erfüllt
    // Bei le_ge: P(X ≤ k_fix) ≥ s — sinkt mit steigendem p → größtes p suchen
    let lo = 0, hi = 1;
    for (let i = 0; i < 60; i++) {
      const mid = (lo+hi)/2;
      let val;
      if (a.bed_typ === "le_ge") val = binomCdf(a.n, mid, 0, a.k_fix);
      else if (a.bed_typ === "le_le") val = binomCdf(a.n, mid, 0, a.k_fix);
      else if (a.bed_typ === "ge_ge") val = binomCdf(a.n, mid, a.k_fix, a.n);
      else if (a.bed_typ === "ge_le") val = binomCdf(a.n, mid, a.k_fix, a.n);
      
      let erfuellt;
      if (a.bed_typ === "le_ge") erfuellt = val >= a.schwelle;
      else if (a.bed_typ === "le_le") erfuellt = val <= a.schwelle;
      else if (a.bed_typ === "ge_ge") erfuellt = val >= a.schwelle;
      else if (a.bed_typ === "ge_le") erfuellt = val <= a.schwelle;
      
      if (erfuellt) lo = mid;
      else hi = mid;
    }
    return lo;
  }
  return NaN;
}

function pruefen() {
  if (!akt) return;
  const fb = document.getElementById("feedback");
  
  if (!aufgedeckt_a || !aufgedeckt_b) {
    fb.className = "feedback teilweise";
    fb.textContent = "⚠ Bitte zuerst a) und b) bearbeiten.";
    fb.style.display = "block";
    return;
  }
  
  const e = parseKomma(document.getElementById("ein-ergebnis").value);
  if (isNaN(e)) {
    fb.className = "feedback teilweise";
    fb.textContent = "⚠ Bitte das Ergebnis (c) eingeben.";
    fb.style.display = "block";
    return;
  }
  
  const soll = berechneSoll(akt);
  let rErg;
  if (akt.gesucht === "p") rErg = Math.abs(e - soll) < 0.015;
  else rErg = parseInt(e) === parseInt(soll);
  
  // a) und b) — der Schüler hat das Feedback schon bekommen, aber wir bilden die Gesamtbewertung
  const rA = auswahl_gesucht === akt.gesucht;
  const rB = auswahl_bed === akt.bed_typ;
  
  if (rA && rB && rErg) {
    fb.className = "feedback richtig";
    fb.innerHTML = "✓ Alle drei Teilaufgaben richtig!";
    fb.style.display = "block";
    starteKonfetti();
  } else if (rErg) {
    // Ergebnis stimmt, aber a) oder b) waren falsch
    fb.className = "feedback teilweise";
    fb.innerHTML = `Ergebnis ist richtig! ${rA?"":"a) ✗ &nbsp;"} ${rB?"":"b) ✗ &nbsp;"} Auch wenn du die Auswahl korrigieren musstest, hast du die Berechnung gemeistert.`;
    fb.style.display = "block";
  } else {
    fb.className = "feedback falsch";
    fb.innerHTML = `${rA?"✓":"✗"} a) &nbsp; ${rB?"✓":"✗"} b) &nbsp; ✗ c) Ergebnis stimmt nicht. Schau dir den Lösungsweg an.`;
    fb.style.display = "block";
  }
}

function zeigeLoesung() {
  if (!akt) return;
  
  // a) und b) aufdecken, falls noch nicht
  if (!aufgedeckt_a) {
    document.querySelectorAll("#opt-gesucht button").forEach(btn => {
      if (btn.dataset.val === akt.gesucht) btn.classList.add("zeigt-richtig");
      btn.disabled = true;
    });
    document.getElementById("hint-a").classList.add("aktiv");
    document.getElementById("hint-a").innerHTML = `Richtig ist: <b>${akt.gesucht}</b>. ${akt.erklaerung_gesucht}`;
    aufgedeckt_a = true;
    aktivBlock("block-b", true);
  }
  if (!aufgedeckt_b) {
    document.querySelectorAll("#opt-bed button").forEach(btn => {
      if (btn.dataset.typ === akt.bed_typ) btn.classList.add("zeigt-richtig");
      btn.disabled = true;
    });
    const k_text = akt.gesucht === "k" ? "k" : akt.k_fix.toString();
    document.getElementById("hint-b").classList.add("aktiv");
    document.getElementById("hint-b").innerHTML = `Richtig ist: <b>${konkretes_bedLabel(akt.bed_typ, k_text, akt.schwelle)}</b>. ${akt.erklaerung_bed}`;
    aufgedeckt_b = true;
    aktivBlock("block-c", true);
  }
  
  const soll = berechneSoll(akt);
  let rechnung;
  
  if (akt.gesucht === "k") {
    const ks = [];
    for (let k = Math.max(0, soll-2); k <= Math.min(akt.n, soll+2); k++) {
      let val, label;
      if (akt.bed_typ === "le_ge" || akt.bed_typ === "le_le") {
        val = binomCdf(akt.n, akt.p, 0, k); label = "P(X≤k)";
      } else {
        val = binomCdf(akt.n, akt.p, k, akt.n); label = "P(X≥k)";
      }
      ks.push({ k, val, label });
    }
    let tab = '<table style="border-collapse:collapse; margin:6px 0;"><tr><th style="border:1.5px solid #1a1a1a; background:#f5e6e8; color:#C8102E; padding:6px 12px;">k</th>';
    ks.forEach(r => { tab += `<td style="border:1.5px solid #1a1a1a; padding:6px 12px; ${r.k === soll ? 'background:#eaf5ea; font-weight:bold;' : ''}">${r.k}</td>`; });
    tab += `</tr><tr><th style="border:1.5px solid #1a1a1a; background:#f5e6e8; color:#C8102E; padding:6px 12px;">${ks[0].label}</th>`;
    ks.forEach(r => { tab += `<td style="border:1.5px solid #1a1a1a; padding:6px 12px; ${r.k === soll ? 'background:#eaf5ea; font-weight:bold;' : ''}">${r.val.toFixed(3).replace(".",",")}</td>`; });
    tab += '</tr></table>';
    rechnung = tab + `<p>Gesuchtes <b>k = ${soll}</b></p>`;
  } else if (akt.gesucht === "n") {
    const ns = [];
    for (let n = Math.max(1, soll-2); n <= soll+2; n++) {
      let val;
      if (akt.bed_typ === "le_ge" || akt.bed_typ === "le_le") val = binomCdf(n, akt.p, 0, akt.k_fix);
      else val = binomCdf(n, akt.p, akt.k_fix, n);
      ns.push({ n, val });
    }
    let tab = '<table style="border-collapse:collapse; margin:6px 0;"><tr><th style="border:1.5px solid #1a1a1a; background:#f5e6e8; color:#C8102E; padding:6px 12px;">n</th>';
    ns.forEach(r => { tab += `<td style="border:1.5px solid #1a1a1a; padding:6px 12px; ${r.n === soll ? 'background:#eaf5ea; font-weight:bold;' : ''}">${r.n}</td>`; });
    const label = (akt.bed_typ === "le_ge" || akt.bed_typ === "le_le") ? `P(X≤${akt.k_fix})` : `P(X≥${akt.k_fix})`;
    tab += `</tr><tr><th style="border:1.5px solid #1a1a1a; background:#f5e6e8; color:#C8102E; padding:6px 12px;">${label}</th>`;
    ns.forEach(r => { tab += `<td style="border:1.5px solid #1a1a1a; padding:6px 12px; ${r.n === soll ? 'background:#eaf5ea; font-weight:bold;' : ''}">${r.val.toFixed(3).replace(".",",")}</td>`; });
    tab += '</tr></table>';
    rechnung = tab + `<p>Gesuchtes <b>n = ${soll}</b></p>`;
  } else if (akt.gesucht === "p") {
    let label = (akt.bed_typ === "le_ge" || akt.bed_typ === "le_le") ? `P(X ≤ ${akt.k_fix})` : `P(X ≥ ${akt.k_fix})`;
    let probe;
    if (akt.bed_typ === "le_ge" || akt.bed_typ === "le_le") probe = binomCdf(akt.n, soll, 0, akt.k_fix);
    else probe = binomCdf(akt.n, soll, akt.k_fix, akt.n);
    rechnung = `<p>Mit numerischer Suche (Bisektion oder CAS): größtes p, sodass ${konkretes_bedLabel(akt.bed_typ, akt.k_fix, akt.schwelle)} gilt.</p>` +
      `<p>Ergebnis: <b>p ≤ ${soll.toFixed(3).replace(".",",")}</b></p>` +
      `<p style="font-size:13px; color:#666;">Probe: ${label} mit n = ${akt.n}, p = ${soll.toFixed(3).replace(".",",")} ergibt ${probe.toFixed(3).replace(".",",")} (≈ Schwelle).</p>`;
  }
  
  document.getElementById("loesungsweg").innerHTML = `
    <h3>Lösungsweg</h3>
    <p><b>a) Gesucht:</b> <b>${akt.gesucht}</b> — ${akt.erklaerung_gesucht}</p>
    <p><b>b) Bedingung:</b> <b>${konkretes_bedLabel(akt.bed_typ, akt.gesucht === "k" ? "k" : akt.k_fix, akt.schwelle)}</b> — ${akt.erklaerung_bed}</p>
    <p><b>c) Berechnung:</b></p>
    ${rechnung}
  `;
  document.getElementById("loesungsweg").style.display = "block";
}

neueAufgabe();
