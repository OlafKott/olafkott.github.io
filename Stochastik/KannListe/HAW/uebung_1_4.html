<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übung 1.4 — Mengenlehre</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; font-family: Georgia, "Times New Roman", serif;
    background: #f9f8f6; color: #1a1a1a; line-height: 1.5; min-height: 100vh; }
  .uebung-box { max-width: 820px; margin: 0 auto; background: #fff;
    border: 1px solid #d4d4d4; border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .uebung-kopf { background: #C8102E; color: #fff; padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; }
  .uebung-kopf h1 { margin: 0; font-size: 18px; font-weight: bold; }
  .uebung-kopf .nr { background: #fff; color: #C8102E; padding: 3px 10px;
    border-radius: 4px; font-weight: bold; font-size: 14px; }
  .uebung-body { padding: 22px; }
  .aufgabe { background: #fff8e1; border-left: 4px solid #d6a300;
    padding: 14px 18px; border-radius: 0 4px 4px 0; margin-bottom: 18px; }
  .aufgabe h2 { margin: 0 0 8px 0; font-size: 14px; color: #8a6800;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
  .aufgabe-text { font-size: 16px; }
  .aufgabe-text b { color: #C8102E; }
  .kontext-icon { font-size: 32px; margin-right: 10px; vertical-align: middle; }
  .info-box {
    background: #f0f7fa; border-left: 4px solid #2a6fa1;
    padding: 10px 14px; border-radius: 0 4px 4px 0;
    margin: 12px 0; font-size: 14px;
  }
  .info-box .menge { font-style: italic; }
  .frage-block { margin: 14px 0; padding: 12px 14px; background: #fafafa;
    border-radius: 4px; border: 1px solid #ececec; }
  .frage-block .frage-text { margin-bottom: 10px; font-weight: bold; }
  .eingabe-zeile { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .eingabe-zeile input {
    flex: 1; min-width: 160px; padding: 7px 10px;
    font-family: Georgia, serif; font-size: 15px;
    border: 1.5px solid #c0c0c0; border-radius: 4px; background: #fff;
  }
  .eingabe-zeile input:focus { outline: none; border-color: #C8102E;
    box-shadow: 0 0 0 2px rgba(200,16,46,0.15); }
  .menge { font-family: Georgia, serif; font-style: italic; }
  .hinweis { font-size: 13px; color: #666; margin-top: 4px; }
  .button-leiste { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { padding: 10px 20px; border: none; border-radius: 4px;
    font-family: Georgia, serif; font-size: 15px; cursor: pointer;
    transition: all 0.15s; font-weight: bold; }
  .btn-pruefen { background: #C8102E; color: #fff; }
  .btn-pruefen:hover { background: #a00d25; }
  .btn-loesung { background: #fff; color: #C8102E; border: 1.5px solid #C8102E; }
  .btn-loesung:hover { background: #fdecea; }
  .btn-neu { background: #f3f3f3; color: #1a1a1a; border: 1.5px solid #c0c0c0; }
  .btn-neu:hover { background: #e6e6e6; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 4px;
    font-weight: bold; display: none; animation: feedback-in 0.3s ease; }
  .feedback.richtig { background: #eaf5ea; color: #2e7d32; border: 1.5px solid #2e7d32; }
  .feedback.falsch { background: #fdecea; color: #C8102E; border: 1.5px solid #C8102E; }
  .feedback.teilweise { background: #fff8e1; color: #8a6800; border: 1.5px solid #d6a300; }
  @keyframes feedback-in { from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); } }
  .loesungsweg { display: none; margin-top: 16px; padding: 14px 18px;
    background: #f0f7fa; border-left: 4px solid #2a6fa1;
    border-radius: 0 4px 4px 0; animation: feedback-in 0.3s ease; }
  .loesungsweg h3 { margin: 0 0 8px 0; font-size: 14px; color: #2a6fa1;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .loesungsweg li { margin: 4px 0; }
  .konfetti { position: fixed; top: -10px; width: 8px; height: 8px;
    pointer-events: none; z-index: 9999; }
  @keyframes konfettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; } }
  .uebung-fuss { text-align: center; padding: 10px; font-size: 12px;
    color: #888; border-top: 1px solid #ececec; }
  @media (max-width: 600px) {
    .uebung-kopf h1 { font-size: 16px; }
    .uebung-body { padding: 16px; }
  }
</style>
</head>
<body>

<div class="uebung-box">
  <div class="uebung-kopf">
    <h1>1.4 — Ereignisse als Mengen</h1>
    <span class="nr">Kompetenz 1.4</span>
  </div>

  <div class="uebung-body">
    <div class="aufgabe">
      <h2>Aufgabe</h2>
      <div class="aufgabe-text" id="aufgabe-text"></div>
    </div>

    <div class="info-box" id="info-box"></div>

    <div class="frage-block">
      <div class="frage-text">a) Bestimmen Sie <span id="op-a-label">A ∪ B</span>:</div>
      <div class="eingabe-zeile">
        <span class="menge">{</span>
        <input type="text" id="ein-a" placeholder="Ergebnisse mit Komma trennen">
        <span class="menge">}</span>
      </div>
    </div>

    <div class="frage-block">
      <div class="frage-text">b) Bestimmen Sie <span id="op-b-label">A ∩ B</span>:</div>
      <div class="eingabe-zeile">
        <span class="menge">{</span>
        <input type="text" id="ein-b" placeholder="Ergebnisse mit Komma trennen">
        <span class="menge">}</span>
      </div>
    </div>

    <div class="frage-block">
      <div class="frage-text">c) Bestimmen Sie das Komplement <span class="menge">A̅</span>:</div>
      <div class="eingabe-zeile">
        <span class="menge">{</span>
        <input type="text" id="ein-c" placeholder="Ergebnisse mit Komma trennen">
        <span class="menge">}</span>
      </div>
      <div class="hinweis">Tipp: <span class="menge">A̅</span> = alle Elemente von <span class="menge">Ω</span>, die <b>nicht</b> in <span class="menge">A</span> sind.</div>
    </div>

    <div class="button-leiste">
      <button class="btn btn-pruefen" onclick="pruefen()">Prüfen</button>
      <button class="btn btn-loesung" onclick="zeigeLoesung()">Lösungsweg anzeigen</button>
      <button class="btn btn-neu" onclick="neueAufgabe()">Neue Aufgabe</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="loesungsweg" id="loesungsweg"></div>
  </div>

  <div class="uebung-fuss">RWB Berufskolleg Essen · Mathematik · Stochastik · Jahrgang 12 HAW</div>
</div>

<script>
// Aufgaben mit Ω, A, B definiert. Die App berechnet A∪B, A∩B, A̅ automatisch zur Prüfung.
const aufgaben = [
  // Würfel
  { icon: "🎲", text: "Ein <b>Würfel</b> wird einmal geworfen.",
    omega: ["1","2","3","4","5","6"],
    A: ["1","2","3"], A_def: '<b>A</b> = "Augenzahl höchstens 3"',
    B: ["2","4","6"], B_def: '<b>B</b> = "gerade Augenzahl"' },
  { icon: "🎲", text: "Ein <b>Würfel</b> wird einmal geworfen.",
    omega: ["1","2","3","4","5","6"],
    A: ["2","3","5"], A_def: '<b>A</b> = "Primzahl gewürfelt"',
    B: ["4","5","6"], B_def: '<b>B</b> = "Augenzahl mindestens 4"' },
  { icon: "🎲", text: "Ein <b>Würfel</b> wird einmal geworfen.",
    omega: ["1","2","3","4","5","6"],
    A: ["1","3","5"], A_def: '<b>A</b> = "ungerade Augenzahl"',
    B: ["5","6"],   B_def: '<b>B</b> = "Augenzahl größer als 4"' },
  // Karten (gewählte Untermenge)
  { icon: "🃏", text: "Aus einem Stapel mit den Karten <b>Bube, Dame, König, Ass</b> (in 4 Farben) wird eine Karte gezogen. Beobachtet wird der <b>Wert</b>.",
    omega: ["Bube","Dame","König","Ass"],
    A: ["Bube","Dame"], A_def: '<b>A</b> = "Bube oder Dame"',
    B: ["Dame","König","Ass"], B_def: '<b>B</b> = "Bildkarte"' },
  // Münze 2x
  { icon: "🪙", text: "Eine <b>Münze</b> wird <b>zweimal</b> geworfen. Beobachtet wird die Reihenfolge.",
    omega: ["KK","KZ","ZK","ZZ"],
    A: ["KK","KZ"], A_def: '<b>A</b> = "1. Wurf ist Kopf"',
    B: ["KK","ZK"], B_def: '<b>B</b> = "2. Wurf ist Kopf"' },
  { icon: "🪙", text: "Eine <b>Münze</b> wird <b>zweimal</b> geworfen. Beobachtet wird die Reihenfolge.",
    omega: ["KK","KZ","ZK","ZZ"],
    A: ["KZ","ZK"], A_def: '<b>A</b> = "genau einmal Kopf"',
    B: ["KK","KZ","ZK"], B_def: '<b>B</b> = "mindestens einmal Kopf"' },
  // Glücksrad 1..8
  { icon: "🎯", text: "Ein <b>Glücksrad</b> hat 8 Sektoren (1 bis 8) gleicher Größe. Beobachtet wird der angezeigte Sektor.",
    omega: ["1","2","3","4","5","6","7","8"],
    A: ["2","4","6","8"], A_def: '<b>A</b> = "gerade Zahl"',
    B: ["1","2","3","4"], B_def: '<b>B</b> = "Zahl höchstens 4"' },
  { icon: "🎯", text: "Ein <b>Glücksrad</b> hat 8 Sektoren (1 bis 8) gleicher Größe.",
    omega: ["1","2","3","4","5","6","7","8"],
    A: ["2","3","5","7"], A_def: '<b>A</b> = "Primzahl"',
    B: ["6","7","8"], B_def: '<b>B</b> = "Zahl mindestens 6"' },
];

let aktuelleAufgabe = null;

function vereinigung(A, B) {
  const s = new Set([...A, ...B]);
  return Array.from(s);
}
function schnitt(A, B) {
  const sB = new Set(B);
  return A.filter(x => sB.has(x));
}
function komplement(A, omega) {
  const sA = new Set(A);
  return omega.filter(x => !sA.has(x));
}

function neueAufgabe() {
  let neu;
  do {
    neu = aufgaben[Math.floor(Math.random() * aufgaben.length)];
  } while (neu === aktuelleAufgabe && aufgaben.length > 1);
  aktuelleAufgabe = neu;
  
  document.getElementById("aufgabe-text").innerHTML =
    '<span class="kontext-icon">' + neu.icon + '</span>' + neu.text;
  
  document.getElementById("info-box").innerHTML =
    '<div><span class="menge">Ω</span> = {' + neu.omega.join(", ") + '}</div>' +
    '<div style="margin-top:4px;">' + neu.A_def + ' &nbsp;→&nbsp; <span class="menge">A</span> = {' + neu.A.join(", ") + '}</div>' +
    '<div style="margin-top:2px;">' + neu.B_def + ' &nbsp;→&nbsp; <span class="menge">B</span> = {' + neu.B.join(", ") + '}</div>';
  
  document.getElementById("ein-a").value = "";
  document.getElementById("ein-b").value = "";
  document.getElementById("ein-c").value = "";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("loesungsweg").style.display = "none";
}

function eingabeZuMenge(s) {
  return s.split(",").map(x => x.trim()).filter(x => x.length > 0);
}
function mengenGleich(A, B) {
  if (A.length !== B.length) return false;
  const sA = new Set(A.map(s => s.toLowerCase()));
  return B.every(b => sA.has(b.toLowerCase()));
}

function pruefen() {
  if (!aktuelleAufgabe) return;
  const fb = document.getElementById("feedback");
  const a = eingabeZuMenge(document.getElementById("ein-a").value);
  const b = eingabeZuMenge(document.getElementById("ein-b").value);
  const c = eingabeZuMenge(document.getElementById("ein-c").value);
  
  const sollA = vereinigung(aktuelleAufgabe.A, aktuelleAufgabe.B);
  const sollB = schnitt(aktuelleAufgabe.A, aktuelleAufgabe.B);
  const sollC = komplement(aktuelleAufgabe.A, aktuelleAufgabe.omega);
  
  const aR = mengenGleich(a, sollA);
  const bR = mengenGleich(b, sollB);
  const cR = mengenGleich(c, sollC);
  
  if (aR && bR && cR) {
    fb.className = "feedback richtig";
    fb.innerHTML = "✓ Alles richtig!";
    fb.style.display = "block";
    starteKonfetti();
  } else {
    fb.className = "feedback falsch";
    fb.innerHTML = "a) " + (aR ? "✓" : "✗") + " &nbsp; b) " + (bR ? "✓" : "✗") + " &nbsp; c) " + (cR ? "✓" : "✗") +
      "<br><small>Schau dir den Lösungsweg an.</small>";
    fb.style.display = "block";
  }
}

function zeigeLoesung() {
  if (!aktuelleAufgabe) return;
  const sollA = vereinigung(aktuelleAufgabe.A, aktuelleAufgabe.B);
  const sollB = schnitt(aktuelleAufgabe.A, aktuelleAufgabe.B);
  const sollC = komplement(aktuelleAufgabe.A, aktuelleAufgabe.omega);
  const lw = document.getElementById("loesungsweg");
  lw.innerHTML =
    '<h3>Lösungsweg</h3>' +
    '<ul>' +
      '<li><b>a)</b> <span class="menge">A ∪ B</span> (alle Elemente, die in A <b>oder</b> B liegen): <span class="menge">{' + sollA.join(", ") + '}</span></li>' +
      '<li><b>b)</b> <span class="menge">A ∩ B</span> (alle Elemente, die <b>sowohl</b> in A <b>als auch</b> in B liegen): <span class="menge">{' + sollB.join(", ") + '}</span></li>' +
      '<li><b>c)</b> <span class="menge">A̅</span> (alle Elemente von <span class="menge">Ω</span>, die <b>nicht</b> in A liegen): <span class="menge">{' + sollC.join(", ") + '}</span></li>' +
    '</ul>';
  lw.style.display = "block";
}

function starteKonfetti() {
  const farben = ["#C8102E", "#2e7d32", "#d6a300", "#2a6fa1", "#8e44ad"];
  for (let i = 0; i < 50; i++) {
    const k = document.createElement("div");
    k.className = "konfetti";
    k.style.left = Math.random() * 100 + "vw";
    k.style.background = farben[Math.floor(Math.random() * farben.length)];
    k.style.animation = "konfettiFall " + (1.5 + Math.random()*1.5) + "s ease-in forwards";
    k.style.animationDelay = (Math.random() * 0.3) + "s";
    if (Math.random() > 0.5) { k.style.borderRadius = "50%"; }
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 3500);
  }
}

neueAufgabe();
</script>

</body>
</html>
