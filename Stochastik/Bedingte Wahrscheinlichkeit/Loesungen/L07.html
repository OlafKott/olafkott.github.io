<style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; --blau:#1D70B8; --sol:#1b4ea8; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#e9e9ec; line-height:1.6; font-size:14.5px; }
.page{ width:210mm; height:296.5mm; margin:12px auto; padding:13mm 14mm 9mm; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18);
  display:flex; flex-direction:column; overflow:hidden; }
.page-content{ flex:1; min-height:0; }
.page-header{ display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--rwb); padding-bottom:9px; margin-bottom:14px; }
.page-header h1{ font-size:21px; margin:0 0 3px; color:var(--rwb); line-height:1.25; }
.page-header .sub{ font-size:13px; color:#444; }
.page-header img.logo{ height:52px; width:auto; }
.namebar{ display:flex; gap:24px; font-size:12.5px; color:#555; margin:-4px 0 14px; }
.namebar span{ border-bottom:1px solid #999; flex:1; padding-bottom:2px; }
.sec{ background:var(--rwb); color:#fff; font-weight:bold; font-size:14.5px; padding:5px 14px; border-radius:5px; margin:4px 0 10px; }
h2.task{ color:var(--rwb); font-size:15.5px; margin:16px 0 6px; border-left:4px solid var(--rwb); padding-left:9px; line-height:1.4; }
p{ margin:0 0 7px; }
.lead{ margin:3px 0 8px; }
.ctx{ background:#FBEEF0; border-left:4px solid var(--rwb); border-radius:0 6px 6px 0; padding:9px 14px; margin:6px 0 10px; }
.method{ background:#E9F2FB; border:1px solid var(--blau); border-radius:6px; padding:9px 14px; margin:6px 0 10px; }
.method b.t{ color:var(--blau); }
.merke{ background:#fff7e0; border:1.5px solid #E0A800; border-radius:6px; padding:9px 14px; margin:6px 0 10px; }
.merke b.t{ color:#8a6500; }
.tag{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:bold; display:block; margin-bottom:2px; }
.ctx .tag{ color:var(--rwb); } .method .tag{ color:var(--blau); } .merke .tag{ color:#8a6500; }
.fx{ font-family:Cambria,'Cambria Math',Georgia,serif; font-style:italic; white-space:nowrap; }
sub{ font-size:.7em; line-height:0; vertical-align:-.25em; }
.ov{ text-decoration:overline; }
.karo{ border:1px solid #c4ccd6; border-radius:3px; background-color:#fff;
  background-image:linear-gradient(#dbe6f0 1px,transparent 1px),linear-gradient(90deg,#dbe6f0 1px,transparent 1px);
  background-size:5mm 5mm; margin:6px 0 8px; }
.lines{ margin:4px 0 8px; }
.lines .ln{ border-bottom:1px solid #bdbdbd; height:9mm; }
.ans{ display:inline-block; min-width:22mm; border-bottom:1.3px solid #888; height:15px; vertical-align:-3px; margin:0 4px; }
.twocol{ display:flex; gap:7mm; align-items:flex-start; }
.twocol>div{ flex:1; min-width:0; }
.fig{ text-align:center; margin:4px 0 6px; }
.fig .cap{ font-size:11.5px; color:#666; margin-top:2px; }
ol.st{ margin:4px 0 8px; padding-left:22px; } ol.st li{ margin:3px 0; }
ul.ab{ margin:4px 0 8px; padding-left:20px; } ul.ab li{ margin:5px 0; }
table.vft{ border-collapse:collapse; margin:6px auto; font-size:14.5px; }
table.vft th,table.vft td{ border:1.3px solid #555; width:24mm; height:10mm; text-align:center; padding:2px 4px; }
table.vft th{ background:#f3ece0; }
table.vft tr:last-child td, table.vft td:last-child{ background:#fafafa; }
table.grid{ border-collapse:collapse; width:100%; font-size:13.5px; margin:6px 0 8px; }
table.grid th,table.grid td{ border:1px solid #bfb7aa; padding:5px 7px; vertical-align:top; text-align:left; line-height:1.45; }
table.grid th{ background:#f3ece0; font-size:12.5px; }
table.grid td.e{ height:9.5mm; }
.stmt{ display:flex; gap:8px; align-items:baseline; margin:6px 0; }
.stmt .nr{ font-weight:bold; min-width:22px; }
.chk{ display:inline-block; width:4mm; height:4mm; border:1.3px solid #555; border-radius:2px; vertical-align:-2px; margin-right:4px; }
/* Fußzeile mit Lösungs-QR und Codefeld */
.page-footer{ border-top:1px solid var(--line); margin-top:8px; padding-top:6px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#888; }
.sol{ display:flex; align-items:center; gap:9px; color:#444; }
.sol a.qrlink{ display:flex; align-items:center; gap:8px; text-decoration:none; color:#444;
  border:1px solid #e3d9da; border-radius:5px; padding:3px 8px 3px 3px; background:#fdfbfb; }
.sol a.qrlink svg{ display:block; }
.sol .hit{ font-size:11px; line-height:1.35; }
.sol .hit b{ color:var(--rwb); letter-spacing:.06em; font-family:Calibri,Arial,sans-serif; }
.sol .klick{ color:var(--rwb); text-decoration:underline; }
.sol .lbl{ font-size:11px; line-height:1.35; }
.code{ display:flex; gap:4px; margin-top:3px; }
.code input{ width:7mm; height:8mm; border:1.4px solid #555; border-radius:3px; text-align:center; font:bold 15px Georgia,serif; padding:0; }
.meta{ text-align:right; line-height:1.5; }
@media print{
  body{ background:#fff; }
  .page{ box-shadow:none; margin:0; page-break-after:always; break-after:page; }
  .page:last-of-type{ page-break-after:auto; break-after:auto; }
}

/* ---------- Bruch ---------- */
.frc{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
  line-height:1.25; margin:0 3px; font-family:Cambria,'Cambria Math',Georgia,serif; font-style:italic; }
.frc .zr{ border-bottom:1.3px solid #333; padding:0 5px 2px; }
.frc .nn{ padding:3px 5px 0; }
.blk{ display:inline-block; width:30mm; height:7mm; }
.sumcard{ border:1px solid #e0c66a; border-radius:6px; padding:7px 12px; margin:6px 0; background:#fff; }

/* ---------- Eingetragene Loesung ---------- */
.ans.filled{ border-bottom-color:var(--sol); color:var(--sol); font-weight:bold; height:auto; min-height:15px; }
td.e.filled{ color:var(--sol); }
td.e.filled b{ color:var(--sol); }
.karo.filled{ height:auto; padding:6px 9px; color:var(--sol); }
.karo.filled p{ margin:0 0 5px; }
.karo.filled p:last-child{ margin-bottom:0; }
.karo.filled b{ color:var(--sol); }
.written{ color:var(--sol); border-left:3px solid #bcd0ee; background:#f6f9ff; border-radius:4px;
  padding:7px 11px; margin:4px 0 9px; line-height:1.65; }
.written b{ color:var(--sol); }
.pen{ color:var(--sol); font-weight:bold; }
.gz{ color:#1D70B8; font-weight:bold; }
.tl{ color:#C8102E; font-weight:bold; }
.chk.on{ background:var(--sol); border-color:var(--sol); color:#fff; font-size:3mm; line-height:3.6mm;
  text-align:center; font-weight:bold; }

/* ---------- Hinweis-Fenster ---------- */
.tip{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; flex:0 0 16px;
  border-radius:50%; background:var(--blau); color:#fff; font:bold 11px Calibri,Arial,sans-serif;
  font-style:normal; cursor:pointer; margin-left:5px; vertical-align:1px; position:relative; user-select:none; }
.tip:hover{ background:#14558c; }
.tip .pop{ display:none; position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
  width:78mm; max-width:78mm; background:#fff; color:var(--ink); border:1.5px solid var(--blau);
  border-radius:8px; padding:9px 13px; font:13px/1.6 Georgia,serif; font-weight:normal; text-align:left;
  box-shadow:0 5px 18px rgba(0,0,0,.2); z-index:40; cursor:auto; }
.tip .pop::after{ content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px;
  border:7px solid transparent; border-top-color:var(--blau); border-bottom:0; }
.tip:hover .pop, .tip:focus .pop, .tip.open .pop{ display:block; }
@media print{
  .tip{ background:#fff; color:var(--blau); border:1.2px solid var(--blau); }
  .tip .pop{ display:block; position:static; transform:none; width:auto; max-width:none; box-shadow:none;
    margin:5px 0 2px; background:#f3f8fd; }
  .tip .pop::after{ display:none; }
}

.lockcard p{ font-size:17px; margin:0 0 18px; }
.digits{ display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
.digits input{ width:54px; height:64px; border:2px solid #9aa0a6; border-radius:10px; font:bold 30px Georgia,serif; text-align:center; outline:none; }
.digits input:focus{ border-color:var(--rwb); box-shadow:0 0 0 3px rgba(200,16,46,.15); }
.lockcard button{ font:bold 17px Georgia,serif; background:var(--rwb); color:#fff; border:0; border-radius:999px; padding:12px 28px; cursor:pointer; }

.err{ color:var(--rwb); font-size:15px; min-height:24px; margin-top:12px; }

@keyframes sh{ 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
#out{ display:none; }
#out .page{ width:auto; max-width:210mm; height:auto; min-height:0; margin:0 auto 18px;

.solbadge{ display:inline-block; background:var(--sol); color:#fff; font:bold 11px Calibri,Arial,sans-serif;

.hint-bar{ max-width:210mm; margin:0 auto 12px; background:#e9f2fb; border:1px solid var(--blau);

.hint-bar b{ color:var(--blau); }
@media print{
  html,body{ background:#fff; }
  .wrap{ max-width:none; padding:0; }
  .hint-bar{ display:none; }
  #out .page{ width:210mm; box-shadow:none; border-radius:0; margin:0; padding:13mm 14mm 9mm; }
}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=[...document.querySelectorAll('#dg input')];
f.forEach((x,i)=>{
  x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&f[i+1])f[i+1].focus();if(f.every(y=>y.value))unlock();});
  x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&f[i-1])f[i-1].focus();if(e.key==='Enter')unlock();});
  x.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(t.length){e.preventDefault();t.split('').forEach((c,k)=>f[k]&&(f[k].value=c));if(t.length===4)unlock();}});
});
f[0].focus();
document.getElementById('go').onclick=unlock;
async function unlock(){
  const code=f.map(x=>x.value).join(''); const err=document.getElementById('err');
  if(code.length<4){err.textContent='Bitte alle 4 Ziffern eingeben.';return;}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    const out=document.getElementById('out');
    out.innerHTML='<div class="hint-bar">Die <b>blauen Eintragungen</b> sind die Lösung. Tippen Sie auf ein <b>i</b>, um eine Erklärung zu sehen.</div>'+new TextDecoder().decode(pt);
    out.style.display='block';
    document.getElementById('lock').style.display='none';
    document.title='Lösung L07';
  }catch(e){
    err.textContent='Der Code ist leider falsch. Bitte noch einmal versuchen.';
    const d=document.getElementById('dg');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    f.forEach(x=>x.value='');f[0].focus();
  }
}
/* Hinweis-Fenster: antippen zum Öffnen, Position bei Bedarf nachjustieren */
document.addEventListener('click',e=>{
  const t=e.target.closest('.tip');
  document.querySelectorAll('.tip.open').forEach(x=>{if(x!==t){x.classList.remove('open');}});
  if(!t||e.target.closest('.pop'))return;
  e.preventDefault();
  t.classList.toggle('open');
  if(t.classList.contains('open'))clamp(t);
});
document.addEventListener('mouseover',e=>{const t=e.target.closest('.tip');if(t)clamp(t);});
function clamp(t){
  const pop=t.querySelector('.pop'); if(!pop)return;
  pop.style.left='50%'; pop.style.transform='translateX(-50%)';
  const r=pop.getBoundingClientRect(), pad=10;
  if(r.left<pad) pop.style.transform=`translateX(calc(-50% + ${pad-r.left}px))`;
  else if(r.right>innerWidth-pad) pop.style.transform=`translateX(calc(-50% - ${r.right-innerWidth+pad}px))`;
}
