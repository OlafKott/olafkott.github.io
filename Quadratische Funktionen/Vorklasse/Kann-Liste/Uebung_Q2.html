<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Übungen Quadratische Funktionen</title><style>
:root{--g:#1E8449;--gd:#14603A;--soft:#EEF7F1;--line:#A9D8BA;--ok:#2E7D3A;--bad:#C8102E;--y:#D99A00}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:#1d1d1f;background:#f3f1ee;line-height:1.6;font-size:17px}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--g);padding-bottom:8px;margin-bottom:10px;gap:10px}
header h1{font-size:22px;color:var(--g);margin:0;line-height:1.25}
header .sub{font-size:14px;color:#555}
header img{height:34px}
.menu{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.menu a{font-family:Calibri,Arial,sans-serif;font-size:13px;text-decoration:none;border:1.5px solid #bbb;color:#555;border-radius:14px;padding:2px 9px;background:#fff}
.menu a.akt{border-color:var(--g);background:var(--g);color:#fff;font-weight:bold}
.karte{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:18px 20px}
.kopf2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:14px;color:#fff;background:var(--g);display:inline-block;padding:2px 10px;border-radius:4px}
.score{font-family:Calibri,Arial,sans-serif;font-size:15px;color:#555}
.score b{color:var(--g);font-size:18px}
h2{font-size:20px;color:var(--g);margin:8px 0 6px}
details.merk{background:var(--soft);border-left:5px solid var(--g);border-radius:4px;padding:6px 12px;margin:8px 0 12px;font-size:16px}
details.merk summary{cursor:pointer;color:var(--gd);font-weight:bold}
.aufg{font-size:17.5px;margin:6px 0}
.term{display:block;font-family:Cambria,Georgia,serif;font-size:21px;margin:8px 0;white-space:nowrap;overflow-x:auto}
.part{margin:10px 0;padding:8px 0;border-top:1px dashed #e4dcd0}
.num{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num input{font:inherit;font-size:18px;width:110px;padding:5px 9px;border:1.8px dashed #C9A100;background:#FFFBE6;border-radius:8px}
.num input.ok{border:2px solid var(--ok);background:#E7F4EA}.num input.falsch{border:2px solid var(--bad);background:#FBEEF0}
.num .lab{font-family:Cambria,Georgia,serif;font-size:18px}
.num .note{font-size:13px;color:#777}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.6px solid #b9b2a5;background:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
.opt.sel{border-color:#1D4ED8;background:#E9F2FB;font-weight:bold}
.opt.ok{border-color:var(--ok);background:#E7F4EA}.opt.falsch{border-color:var(--bad);background:#FBEEF0}
.errl{display:block;width:100%;font-family:Cambria,Georgia,serif;font-size:18px;margin:4px 0}
.errl .ln{display:inline-block;min-width:26px;font-family:Calibri,Arial,sans-serif;font-size:13px;color:#888}
.zu{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.zu .zl{font-family:Cambria,Georgia,serif;font-size:19px;min-width:200px}
.zu select{font:inherit;font-size:16px;padding:4px 8px;border-radius:8px;border:1.8px dashed #C9A100;background:#FFFBE6}
.zu select.ok{border:2px solid var(--ok);background:#E7F4EA}.zu select.falsch{border:2px solid var(--bad);background:#FBEEF0}
.graphs{display:flex;gap:10px;flex-wrap:wrap}
.graphs .gc{text-align:center}.graphs .gc b{display:block;color:var(--g);font-family:Calibri,Arial,sans-serif}
svg.pl{display:block;max-width:100%;height:auto}
.knoepfe{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.btn{font:inherit;font-size:16px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1.8px solid var(--g);background:#fff;color:var(--g);text-decoration:none;display:inline-block}
.btn.voll{background:var(--g);color:#fff}.btn.grau{border-color:#999;color:#555}
.box{border-radius:8px;padding:10px 14px;margin:10px 0}
.box.tipp{background:#FFF8E8;border-left:5px solid #F2B705}
.box.loes{background:#E9F2FB;border-left:5px solid #1D70B8}
.box.ok{background:#E7F4EA;border-left:5px solid var(--ok)}
.box.no{background:#FBEEF0;border-left:5px solid var(--bad)}
.box b.t{display:block;margin-bottom:2px}
.mark{font-weight:bold;font-family:Calibri,Arial,sans-serif}.mark.ok{color:var(--ok)}.mark.falsch{color:var(--bad)}
table.gl{border-collapse:collapse;margin:4px 0 4px 4px;font-family:Cambria,Georgia,serif}
table.gl td{padding:3px 3px;white-space:nowrap;vertical-align:middle}
table.gl td.l{text-align:right}table.gl td.e{text-align:center;width:18px}table.gl td.op{color:#888;padding-left:14px;font-size:15px}
.cp{color:#1D70B8;font-weight:bold}.cq{color:#E07B00;font-weight:bold}.cs{color:#E07B00;font-weight:bold}.cf{color:#1E8449;font-weight:bold}.cg{color:#1D70B8;font-weight:bold}.ch{color:#6A3FC8;font-weight:bold}
.ou{color:#6A3FC8;font-weight:bold;margin:0 14px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 2px}
.sq{display:inline-flex;align-items:stretch;vertical-align:middle}
.sq .sym{width:.62em;display:inline-block;flex:none}.sq .sym svg{width:100%;height:100%;display:block}
.sq .rad{border-top:1.5px solid currentColor;padding:2px 3px 0 2px;display:inline-flex;align-items:center}
.grau{color:#777;font-size:14px}
.foot{margin-top:14px;font-size:14px;color:#666;font-family:Calibri,Arial,sans-serif}
@media (max-width:560px){body{font-size:16px}.karte{padding:14px 12px}.term{font-size:19px}.zu .zl{min-width:0}}

il 5"], ["5.2", "Schnittpunkt, Berührpunkt oder kein Punkt?", "Teil 5"]];const MERK={"1.1": "Scheitelpunkt <span class=\"cs\">S(0 | 0)<\/span>.<br>Nach <b>oben<\/b> geöffnet.<br><b>Symmetrisch<\/b> zur y-Achse.<div class=\"klein\">Vom Scheitelpunkt: 1 nach rechts → 1 nach oben, 2 nach rechts → 4 nach oben.<\/div>", "1.2": "Die Zahl vor x² ist <b>a<\/b>. Die Zahl vor x ist <b>b<\/b>. Die Zahl ohne x ist <b>c<\/b>.<div class=\"klein\">Das Vorzeichen gehört immer dazu. Steht kein x, ist b = 0.<\/div>", "1.3": "a &gt; 0: nach <b>oben<\/b> geöffnet. a &lt; 0: nach <b>unten<\/b> geöffnet.<br>a größer als 1 (ohne Minus): <b>schmaler<\/b> (gestreckt).<br>a zwischen 0 und 1: <b>breiter<\/b> (gestaucht).<br>c: Schnittpunkt mit der <b>y-Achse<\/b> (0 | c).", "1.4": "1. Jeden x-Wert einsetzen. <b>Klammern<\/b> um negative Zahlen!<br>2. Punkte eintragen.<br>3. Mit einem <b>runden Bogen<\/b> verbinden, nicht mit dem Lineal.", "2.1": "f(x) = a(x − <b>d<\/b>)² + <b>e<\/b> → <span class=\"cs\">S(d | e)<\/span><div class=\"klein\"><span class=\"trap\">Achtung:<\/span> In der Klammer dreht sich das Vorzeichen: (x + 2) → d = −2. Bei e bleibt es.<\/div>", "2.2": "1. Scheitelpunkt <span class=\"cs\">S(d | e)<\/span> ablesen.<br>2. Vom Scheitelpunkt <b>1 nach rechts<\/b>. Wie weit nach oben/unten? Das ist <b>a<\/b>.<br>3. Einsetzen: f(x) = a(x − d)² + e.", "2.3": "1. S in die Scheitelpunktform einsetzen.<br>2. Für x und f(x) den Punkt P einsetzen.<br>3. Nach a auflösen.", "3.1": "(a + b)² = a² + <b>2ab<\/b> + b²<br>(a − b)² = a² − <b>2ab<\/b> + b²<div class=\"klein\"><span class=\"trap\">Achtung:<\/span> (x + 3)² ist <b>nicht<\/b> x² + 9. Das Mittelglied 2ab nicht vergessen!<\/div>", "3.2": "1. Klammer mit der binomischen Formel auflösen. Die große Klammer bleibt!<br>2. a mit <b>jedem<\/b> Glied malnehmen.<br>3. Zahlen zusammenfassen.", "4.1": "Geht, wenn es <b>kein Glied mit x<\/b> gibt (nur x² und eine Zahl).<br>x² allein stellen, dann Wurzel ziehen.<br>Es gibt <b>zwei<\/b> Lösungen: + und −.<div class=\"klein\">x² = −4: keine Lösung. Eine Zahl hoch 2 ist nie negativ.<\/div>", "4.2": "Vor x² muss eine <b>1<\/b> stehen. Sonst zuerst durch a teilen.<br>x₁,₂ = −<span class=\"fr\"><span><span class=\"cp\">p<\/span><\/span><span>2<\/span><\/span> ± <span class=\"sq\"><span class=\"sym\"><svg viewBox=\"0 0 12 32\" preserveAspectRatio=\"none\"><path d=\"M0.6,19 L3.4,16.5 L6.6,30.5 L11.6,0.8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/><\/svg><\/span><span class=\"rad\">(<span class=\"fr\"><span><span class=\"cp\">p<\/span><\/span><span>2<\/span><\/span>)² − <span class=\"cq\">q<\/span><\/span><\/span><div class=\"klein\">Vorzeichen von p und q mitnehmen!<\/div>", "4.3": "Unter der Wurzel steht eine …<br><b>positive<\/b> Zahl → 2 Lösungen<br><b>0<\/b> → 1 Lösung<br><b>negative<\/b> Zahl → keine Lösung", "4.4": "Nullstellen: Hier schneidet die Parabel die <b>x-Achse<\/b>.<br>Ansatz: <b>f(x) = 0<\/b>. Dann Wurzelziehen oder pq-Formel.", "5.1": "1. <b>Gleichsetzen<\/b>: f(x) = g(x).<br>2. Alles auf eine Seite: … = 0.<br>3. Lösen (Wurzel oder pq-Formel).<br>4. x-Werte in f oder g einsetzen → y-Werte.<div class=\"klein\">Bei <b>zwei Parabeln<\/b> genauso. Haben beide dasselbe x², fällt x² weg.<\/div>", "5.2": "Nach dem Gleichsetzen und der pq-Formel:<br>2 Lösungen → 2 <b>Schnittpunkte<\/b><br>1 Lösung → 1 <b>Berührpunkt<\/b><br>keine Lösung → <b>kein<\/b> gemeinsamer Punkt"};
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function fn(v){ v=Math.round(v*10000)/10000; if(Object.is(v,-0)) v=0; return String(v).replace('.',',').replace('-','−'); }
function sq(x){ return '<span class="sq">'+SQSVG+'<span class="rad">'+x+'</span></span>'; }
function fr(a,b){ return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'; }
const OR='<span class="ou">∨</span>';
function gl(rows){ return '<table class="gl">'+rows.map(r=>'<tr><td class="l">'+r[0]+'</td><td class="e">'+(r[1]===null?'':'=')+'</td><td class="r">'+(r[1]===null?'':r[1])+'</td><td class="op">'+(r[2]||'')+'</td></tr>').join('')+'</table>'; }
function par(v){ return v<0?'('+fn(v)+')':fn(v); }
// Term aus Summanden [[koeff, 'x²'|'x'|'']] in gegebener Reihenfolge
function poly(list){
  let s=''; let first=true;
  for(const [k,v] of list){ if(!k) continue;
    let mag=Math.abs(k), coef=(v&&mag===1)?'':fn(mag);
    const sign=k<0?'−':'+';
    if(first){ s+=(k<0?'−':'')+coef+v; first=false; } else s+=' '+sign+' '+coef+v; }
  return s||'0';
}
const T=(a,b,c)=>poly([[a,'x²'],[b,'x'],[c,'']]);
function inner(d){ return d===0?'x':(d>0?'x − '+fn(d):'x + '+fn(-d)); }
function spf(a,d,e){ const pre=a===1?'':(a===-1?'−':fn(a)); return pre+'('+inner(d)+')²'+(e?(e>0?' + '+fn(e):' − '+fn(-e)):''); }
function pqRows(p,q){
  const D=(p/2)*(p/2)-q, h=-p/2; const rows=[];
  rows.push(['<span class="cp">p</span>', '<span class="cp">'+fn(p)+'</span>; &nbsp; <span class="cq">q</span> = <span class="cq">'+fn(q)+'</span>']);
  rows.push(['x<sub>1,2</sub>', fn(h)+' ± '+sq(par(h)+'² '+(q<0?'+ '+fn(-q):'− '+fn(q)))]);
  rows.push(['', fn(h)+' ± '+sq(fn(D))]);
  if(D<-1e-9){ rows.push(['', null, 'Unter der Wurzel ist eine negative Zahl → keine Lösung']); return rows; }
  if(Math.abs(D)<1e-9){ rows.push(['x', fn(h), 'eine Lösung']); return rows; }
  const r=Math.sqrt(D); rows.push(['', fn(h)+' ± '+fn(r)]); rows.push(['x<sub>1</sub>', fn(h+r)+OR+'x<sub>2</sub> = '+fn(h-r)]);
  return rows;
}
// Koordinatensystem
function plot(o){
  const u=o.u||26, P=22, W=(o.x1-o.x0)*u+2*P, H=(o.y1-o.y0)*u+2*P;
  const X=x=>P+(x-o.x0)*u, Y=y=>P+(o.y1-y)*u;
  let s='<svg class="pl" viewBox="0 0 '+W+' '+H+'" width="'+(o.w||W)+'" xmlns="http://www.w3.org/2000/svg" font-family="Calibri,Arial,sans-serif"><rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  let g=''; for(let x=o.x0;x<=o.x1;x++) g+='M'+X(x)+' '+P+'V'+(H-P); for(let y=o.y0;y<=o.y1;y++) g+='M'+P+' '+Y(y)+'H'+(W-P);
  s+='<path d="'+g+'" stroke="#dbe6f0" stroke-width="1"/>';
  const ax=o.x0<=0&&o.x1>=0?X(0):X(o.x0), ay=o.y0<=0&&o.y1>=0?Y(0):Y(o.y0);
  s+='<line x1="'+(P-6)+'" y1="'+ay+'" x2="'+(W-P+10)+'" y2="'+ay+'" stroke="#333" stroke-width="1.5"/><path d="M'+(W-P+12)+','+ay+' l-8,-4 v8z" fill="#333"/>';
  s+='<line x1="'+ax+'" y1="'+(H-P+6)+'" x2="'+ax+'" y2="'+(P-10)+'" stroke="#333" stroke-width="1.5"/><path d="M'+ax+','+(P-12)+' l-4,8 h8z" fill="#333"/>';
  if(!o.nolab){ const st=(o.x1-o.x0)>12?2:1;
    for(let x=o.x0;x<=o.x1;x++) if(x&&x%st===0) s+='<text x="'+X(x)+'" y="'+(ay+14)+'" font-size="11" text-anchor="middle">'+fn(x)+'</text>';
    for(let y=o.y0;y<=o.y1;y++) if(y&&y%st===0) s+='<text x="'+(ax-5)+'" y="'+(Y(y)+4)+'" font-size="11" text-anchor="end">'+fn(y)+'</text>'; }
  s+='<clipPath id="c'+(o.id||0)+'"><rect x="'+P+'" y="'+P+'" width="'+(W-2*P)+'" height="'+(H-2*P)+'"/></clipPath>';
  for(const c of o.fns){ let d=''; for(let i=0;i<=200;i++){ const x=o.x0+(o.x1-o.x0)*i/200, y=c.f(x); d+=(i?'L':'M')+X(x).toFixed(1)+','+Y(Math.max(o.y0-5,Math.min(o.y1+5,y))).toFixed(1); }
    s+='<path d="'+d+'" fill="none" stroke="'+c.col+'" stroke-width="'+(c.w||3)+'" clip-path="url(#c'+(o.id||0)+')"/>'; }
  for(const p of (o.pts||[])) s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="'+(p[2]||'#E07B00')+'" stroke="#fff" stroke-width="1.5"/>';
  return s+'</svg>';
}

'1.1':()=>{ const xs=shuffle([-3,-2,-1,1,2,3]).slice(0,3);
  const st=pick([['Der Scheitelpunkt ist S(0 | 0).',0],['Die Normalparabel ist nach unten geöffnet.',1],['f(−2) und f(2) haben denselben Wert.',0],['Die Normalparabel ist symmetrisch zur x-Achse.',1],['Die Normalparabel geht durch den Punkt (3 | 9).',0],['Die Normalparabel geht durch den Punkt (−2 | −4).',1]]);
  return {q:'Die Normalparabel ist <span class="term">f(x) = x²</span>Berechnen Sie die Funktionswerte. Stimmt die Aussage?',

  const gr=perm.map((k,i)=>'<div class="gc">'+plot({x0:-4,x1:4,y0:-4,y1:4,u:19,w:170,fns:[{f:x=>ch[k][0]*x*x+ch[k][1],col:G}],id:'g'+i})+'<b>Bild '+L[i]+'</b></div>').join('');
  return {q:'Ordnen Sie jeder Funktion das passende Bild zu.<div class="graphs">'+gr+'</div>',

'1.4':()=>{ const a=pick([1,-1,2,-2,0.5]), b=R(-4,4), c=R(-5,5); const xs=shuffle([-3,-2,-1,0,1,2,3]).slice(0,3).sort((p,q)=>p-q); const f=x=>a*x*x+b*x+c;
  return {q:'Berechnen Sie die Werte für die Wertetabelle.<span class="term">f(x) = '+T(a,b,c)+'</span>',

'2.1':()=>{ const a=pick([1,-1,2,-2,0.5,3,-3]), d=pick([-5,-4,-3,-2,-1,1,2,3,4,5]), e=R(-6,6);
  return {q:'Lesen Sie den Scheitelpunkt ab.<span class="term">f(x) = '+spf(a,d,e)+'</span>',

  if(p.t==='err') return p.lines.map((l,li)=>{ let c=a.v===li?'sel':''; if(state.checked&&a.v===li) c+=res&&res[0]?' ok':' falsch'; if(state.sol&&li===p.a) c+=' ok';

    else if(p.t==='pts'){ const rest=p.a.map(q=>q.slice());
      for(let i=0;i<p.n;i++){ const x=parseNum(a[2*i]), y=parseNum(a[2*i+1]); const j=rest.findIndex(q=>eqs(x,q[0])&&eqs(y,q[1]));
        if(j>=0){ r[2*i]=r[2*i+1]=true; rest.splice(j,1); } else { const jx=rest.findIndex(q=>eqs(x,q[0])); r[2*i]=jx>=0; r[2*i+1]=jx>=0&&eqs(y,rest[jx][1]); } } }
    state.res[pi]=r; if(Object.values(r).some(v=>!v)||Object.keys(r).length===0) all=false; });
  state.checked=true; state.ok=all;
  if(!state.counted&&!state.sol){ score.n++; if(all) score.ok++; state.counted=true; try{ sessionStorage.setItem('ue2_'+TID,JSON.stringify(score)); }catch(e){} }
  render();
}
function render(){
  let h='<div class="kopf2"><span class="tag">Kann '+TID+' · '+tinfo[2]+'</span><span class="score">Richtig gelöst: <b>'+score.ok+'</b> von '+score.n+'</span></div>';
  h+='<h2>'+tinfo[1]+'</h2>';
  h+='<details class="merk"><summary>So geht’s (Merke)</summary>'+(MERK[TID]||'')+'</details>';
  h+='<div class="aufg">'+task.q+'</div>';
  task.parts.forEach((p,pi)=>h+='<div class="part">'+partHTML(p,pi)+'</div>');
  h+='<div class="knoepfe"><button class="btn voll" onclick="check()">Prüfen</button><button class="btn grau" onclick="state.hint=!state.hint;render()">'+(state.hint?'Tipp ausblenden':'Tipp')+'</button>'
    +'<button class="btn grau" onclick="state.sol=true;render()">Lösung zeigen</button><button class="btn" onclick="neu()">Neue Aufgabe ↻</button></div>';
  if(state.hint) h+='<div class="box tipp"><b class="t">Tipp</b>'+task.hint+'</div>';
  if(state.checked) h+=state.ok?'<div class="box ok"><b class="t">Richtig!</b>Sehr gut. Klicken Sie auf „Neue Aufgabe“ und üben Sie weiter.</div>':'<div class="box no"><b class="t">Noch nicht ganz.</b>Die roten Stellen stimmen noch nicht. Versuchen Sie es noch einmal oder nutzen Sie den Tipp.</div>';
  if(state.sol||state.ok) h+='<div class="box loes"><b class="t">Lösung</b>'+task.sol+'</div>';
  $('karte').innerHTML=h;
}
$('menu').innerHTML=TOPICS.map(t=>'<a href="?t='+t[0]+'" class="'+(t[0]===TID?'akt':'')+'" title="'+t[1]+'">'+t[0]+'</a>').join('');
document.title='Übung '+TID+': '+tinfo[1];
neu();
</script></body></html>
