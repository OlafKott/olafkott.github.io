<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Flächen berechnen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.dt{ overflow-x:auto; }
table.d{ border-collapse:collapse; font-size:16px; margin:2px 0 4px; }
table.d th, table.d td{ border:1px solid #c3c8d0; padding:4px 10px; text-align:center; min-width:40px; }
table.d th{ background:#eef0f3; font-family:Cambria,Georgia,serif; font-style:italic; }
.spalten{ font-size:13.5px; color:var(--mute); margin-top:6px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
.f label{ font-size:15px; }
.f label .z{ color:var(--mute); font-family:Cambria,Georgia,serif; font-size:14px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }

.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.plot .cv{ fill:none; stroke:#1d1d1f; stroke-width:2.2; } .plot .ar{ stroke-width:2; stroke-dasharray:6 4; fill:none; }
.plot .ml{ font:bold 13px system-ui,Arial,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ border-left:5px solid #ccc; }
.f .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.f.gl{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.f.gl > label:first-child{ min-width:150px; font-family:Cambria,Georgia,serif; font-size:16px; }
.f.gl .xin{ display:inline-flex; align-items:center; gap:6px; }
.f.gl .xin .z{ font-family:Cambria,Georgia,serif; font-size:15px; }
.f.gl .kl{ font-size:14.5px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.f.gl .kl input{ width:18px; height:18px; }
.f.gl .m{ margin-left:auto; }
.f.gl .msg{ flex-basis:100%; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.liste{ font-weight:normal; }

.f.co{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; border-left-color:#1F4E99; }
.f.co > label{ min-width:72px; }
.f.co .cos{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; font-family:Cambria,Georgia,serif; font-size:17px; }
.f.co input.ci{ width:76px; }
.f.co input.bad{ border-color:var(--no); background:#fff6f5; }
.f.co .pl{ color:var(--mute); }
.f.co .m{ margin-left:auto; }
.f.co .msg{ flex-basis:100%; }

.fen{ text-align:center; font-family:Cambria,Georgia,serif; font-size:15.5px; color:var(--mute); margin:-2px 0 6px; }
.f.co > label{ min-width:58px; }
.f.co input.ci{ width:86px; }

.int{ display:inline-flex; align-items:center; vertical-align:middle; }
.int .is{ font-family:Cambria,Georgia,serif; font-size:24px; line-height:1; font-style:italic; }
.int .lim{ display:inline-flex; flex-direction:column; justify-content:space-between; font-size:11px; line-height:1.1; height:28px; }
.f.co > label{ white-space:nowrap; }
/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

    <div class="score" id="score"></div>
    <div class="stats" id="stats"></div>
  </div>
  <p class="hinweis" id="hinweis"></p>
</div>
<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[R(0,a.length-1)];
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const deN=v=>{ let t=(Math.round(v*1e6)/1e6).toString(); return t.replace('-','−').replace('.',','); };
const de2=v=>{ const x=r2(v); return (Number.isInteger(x)?String(x):x.toFixed(2)).replace('-','−').replace('.',','); };
const ev=(P,x)=>P.reduce((s,c)=>s*x+c,0);
const der=P=>P.slice(0,-1).map((c,i)=>c*(P.length-1-i));
function polyHTML(name,P){
  const n=P.length-1; let h=`<i>${name}</i>(<i>x</i>) = `, first=true;
  P.forEach((c,i)=>{ const e=n-i; if(c===0) return;
    const s=c<0?'−':(first?'':'+'), mm=deN(Math.abs(c)), co=(mm==='1'&&e>0)?'':mm;
    const xx=e===0?'':e===1?'<i>x</i>':`<i>x</i><sup>${e}</sup>`;
    h+=(first?s:` ${s} `)+co+xx; first=false; });
  return first?h+'0':h;
}
function casPoly(P){ const n=P.length-1; let t=''; P.forEach((c,i)=>{ const e=n-i; if(c===0) return;
  t+=(c<0?'-':(t?'+':''))+(Math.abs(c)===1&&e>0?'':String(Math.abs(c)))+(e===0?'':e===1?'x':'x^'+e); }); return t; }
// alle Nullstellen eines Polynoms in [a,b] (Vorzeichenwechsel + Bisektion)
function roots(P,a,b){ const out=[], N=2000; let xp=a, yp=ev(P,a);
  for(let i=1;i<=N;i++){ const x=a+(b-a)*i/N, y=ev(P,x);
    if(yp===0) out.push(xp); else if(yp*y<0){ let l=xp,r=x; for(let k=0;k<70;k++){ const m=(l+r)/2; if(ev(P,l)*ev(P,m)<=0) r=m; else l=m; } out.push((l+r)/2); }
    xp=x; yp=y; }
  return out; }
const sub=(P,Q)=>{ const n=Math.max(P.length,Q.length), A=Array(n-P.length).fill(0).concat(P), B=Array(n-Q.length).fill(0).concat(Q); return A.map((c,i)=>c-B[i]); };
const gap=xs=>xs.every((x,i)=>i===0||x-xs[i-1]>=1);

// zufällige kubische Funktion mit drei Nullstellen
function genP(){
  for(;;){
    const a=pickR([0.25,0.5,1,-0.25,-0.5,-1]), b=R(-6,6)/2, c=R(-10,10)/2, d=R(-6,6);
    const P=[a,b,c,d], z=roots(P,-8,10);
    if(z.length!==3||!gap(z)) continue;
    const D=der(P), e=roots(D,-8,10); if(e.length!==2) continue;
    const ys=e.map(x=>ev(P,x)); if(ys.some(y=>Math.abs(y)>12||Math.abs(y)<0.8)) continue;
    if(Math.abs(d)>12) continue;
    return P;
  }
}
function fenster(xs,ys){
  const x0=Math.floor(Math.min(...xs))-1, x1=Math.ceil(Math.max(...xs))+1, y0=Math.floor(Math.min(...ys,0))-1, y1=Math.ceil(Math.max(...ys,0))+1;
  return {x0,x1,y0,y1};
}
const FTXT=w=>`Fenster: ${deN(w.x0)} ≤ <i>x</i> ≤ ${deN(w.x1)} und ${deN(w.y0)} ≤ <i>y</i> ≤ ${deN(w.y1)}`;

// ---------- Graph (erscheint mit der Lösung) ----------
const anti=P=>P.map((c,i)=>c/(P.length-i)).concat([0]);
const integ=(P,a,b)=>{ const A=anti(P); return ev(A,b)-ev(A,a); };
function plot(fs,w,pts,areas){
  const W=640, H=Math.min(460,Math.max(300,(w.y1-w.y0)*26)), pl=30, pr=22, pt=16, pb=24;
  const X=x=>pl+(x-w.x0)*(W-pl-pr)/(w.x1-w.x0), Y=y=>pt+(w.y1-y)*(H-pt-pb)/(w.y1-w.y0);
  const Yc=y=>Math.max(pt-20,Math.min(H+20,Y(y)));
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph">`;
  for(let x=Math.ceil(w.x0);x<=w.x1;x++) o+=`<line x1="${X(x)}" y1="${Y(w.y0)}" x2="${X(x)}" y2="${Y(w.y1)}" class="gl"/>`;
  for(let y=Math.ceil(w.y0);y<=w.y1;y++) o+=`<line x1="${X(w.x0)}" y1="${Y(y)}" x2="${X(w.x1)}" y2="${Y(y)}" class="gl"/>`;
  (areas||[]).forEach(A=>{ let d=''; const N=80;
    for(let i=0;i<=N;i++){ const x=A.a+(A.b-A.a)*i/N; d+=(i?'L':'M')+X(x).toFixed(1)+' '+Yc(ev(A.P,x)).toFixed(1)+' '; }
    for(let i=N;i>=0;i--){ const x=A.a+(A.b-A.a)*i/N; d+='L'+X(x).toFixed(1)+' '+Yc(ev(A.Q,x)).toFixed(1)+' '; }
    o+=`<path d="${d}Z" fill="${A.col}" fill-opacity=".28" stroke="none"/>`;
    const xm=(A.a+A.b)/2, ym=(ev(A.P,xm)+ev(A.Q,xm))/2;
    o+=`<text x="${X(xm)}" y="${Y(ym)+5}" text-anchor="middle" fill="${A.col}" class="ml">${A.lab}</text>`; });
  o+=`<line x1="${X(w.x0)}" y1="${Y(0)}" x2="${X(w.x1)+12}" y2="${Y(0)}" class="ax"/><path d="M${X(w.x1)+16} ${Y(0)} l-8 -4 v8z" class="ah"/>`;
  o+=`<line x1="${X(0)}" y1="${Y(w.y0)}" x2="${X(0)}" y2="${Y(w.y1)-10}" class="ax"/><path d="M${X(0)} ${Y(w.y1)-14} l-4 8 h8z" class="ah"/>`;
  o+=`<text x="${X(w.x1)+8}" y="${Y(0)+16}" class="al">x</text><text x="${X(0)+7}" y="${Y(w.y1)-4}" class="al">y</text>`;
  const sy=Math.max(1,Math.ceil((w.y1-w.y0)/12));
  for(let x=Math.ceil(w.x0);x<=w.x1;x++) if(x) o+=`<text x="${X(x)}" y="${Y(0)+14}" class="tl" text-anchor="middle">${String(x).replace('-','−')}</text>`;
  for(let y=Math.ceil(w.y0);y<=w.y1;y++) if(y&&y%sy===0) o+=`<text x="${X(0)-5}" y="${Y(y)+4}" class="tl" text-anchor="end">${String(y).replace('-','−')}</text>`;
  fs.forEach(F=>{ let d='',pen=false; for(let i=0;i<=400;i++){ const x=w.x0+(w.x1-w.x0)*i/400, y=ev(F.P,x);
      if(y>=w.y0-.3&&y<=w.y1+.3){ d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' '; pen=true; } else pen=false; }
    o+=`<path d="${d}" fill="none" stroke="${F.col}" stroke-width="2.2"/>`; });
  pts.forEach(p=>{ o+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.col}"/><text x="${X(p.x)+8}" y="${Y(p.y)+(p.below?18:-8)}" fill="${p.col}" class="ml">${p.lab}</text>`; });
  return o+'</svg>';
}

// ---------- Aufgaben ----------
const C={n:'#2E7D32',a1:'#1F4E99',a2:'#C25E00',a:'#C62828',i:'#8E3BA8'};
const NUM=(k,lab,soll,col)=>({k,lab,col,parts:[{k:k,soll}]});
const INTH=(a,b,t)=>`<span class="int"><span class="is">∫</span><span class="lim"><span>${deN(b)}</span><span>${deN(a)}</span></span></span>${t||' <i>f</i>(<i>x</i>)&thinsp;d<i>x</i>'}`;
const mul=(P,Q)=>{ const r=Array(P.length+Q.length-1).fill(0); P.forEach((a,i)=>Q.forEach((b,j)=>{ r[i+j]+=a*b; })); return r; };
const fromRoots=(a,rs)=>rs.reduce((P,r)=>mul(P,[1,-r]),[a]);
// kubische Funktion mit drei ganzzahligen Nullstellen (Abstand ≥ 1), gut sichtbaren Extrema
function genR(as){
  for(;;){
    const r=[R(-5,5),R(-5,5),R(-5,6)].sort((x,y)=>x-y); if(r[1]-r[0]<1||r[2]-r[1]<1||r[2]-r[0]>8) continue;
    const a=pickR(as), P=fromRoots(a,r), e=roots(der(P),-8,10); if(e.length!==2) continue;
    const ys=e.map(x=>ev(P,x)); if(ys.some(y=>Math.abs(y)>12||Math.abs(y)<0.8)) continue;
    if(Math.abs(P[3])>14) continue;
    return {P,r,e};
  }
}
const fill=(F)=>F;
function genAX(){
  const {P,r,e}=genR([0.25,0.5,1,-0.25,-0.5,-1]);
  const I1=integ(P,r[0],r[1]), I2=integ(P,r[1],r[2]), w=fenster(r.concat(e),e.map(x=>ev(P,x)).concat([P[3]]));
  return {h:"Fläche mit der x-Achse", P, w,
    auftrag:"Zeichnen Sie den Graphen im CAS. Bestimmen Sie die Nullstellen, die beiden Teilflächen <i>A</i><sub>1</sub>, <i>A</i><sub>2</sub> und die gesamte Fläche <i>A</i> zwischen dem Graphen und der <i>x</i>-Achse.",
    term:polyHTML('f',P),
    felder:r.map((x,i)=>NUM('n'+i,`<i>x</i><sub>${i+1}</sub> =`,x,C.n)).concat([NUM('a1','<i>A</i><sub>1</sub> =',Math.abs(I1),C.a1),NUM('a2','<i>A</i><sub>2</sub> =',Math.abs(I2),C.a2),NUM('a','<i>A</i> =',Math.abs(I1)+Math.abs(I2),C.a)]),
    pts:r.map((x,i)=>({x,y:0,col:C.n,lab:'x'+(i+1),below:i%2===1})),
    areas:[{P,Q:[0],a:r[0],b:r[1],col:C.a1,lab:'A1'},{P,Q:[0],a:r[1],b:r[2],col:C.a2,lab:'A2'}],
    fs:[{P,col:'#1d1d1f'}],
    hinweis:'Tipp: <span class="liste">f1(x)='+casPoly(P)+'</span> · Nullstellen: <b>menu ▸ 6 ▸ 1</b> · Teilflächen: <b>menu ▸ 6 ▸ 7: Integral</b>, Grenzen = benachbarte Nullstellen (eintippen + <b>enter</b>). Negatives Integral → Betrag nehmen.'};
}
function genIV(){
  for(;;){
    const {P,r,e}=genR([0.25,0.5,1,-0.25,-0.5,-1]);
    const z=pickR(r), a=z-R(1,3), b=z+R(1,3);
    if(r.some(x=>x!==z&&x>=a&&x<=b)) continue;
    const I=integ(P,a,b), I1=integ(P,a,z), I2=integ(P,z,b);
    const xs=r.concat(e,[a,b]), w=fenster(xs,e.map(x=>ev(P,x)).concat([P[3],ev(P,a),ev(P,b)]));
    if(w.y1-w.y0>26) continue;
    return {h:"Vorgegebenes Intervall", P, w,
      auftrag:`Zeichnen Sie den Graphen im CAS. Berechnen Sie das Integral von ${deN(a)} bis ${deN(b)}. Bestimmen Sie die Nullstelle im Intervall [${deN(a)};&nbsp;${deN(b)}] und die Fläche zwischen dem Graphen und der <i>x</i>-Achse in diesem Intervall.`,
      term:polyHTML('f',P),
      felder:[NUM('i',INTH(a,b)+' =',I,C.i),NUM('z','Nullstelle <i>x</i> =',z,C.n),NUM('a','<i>A</i> =',Math.abs(I1)+Math.abs(I2),C.a)],
      pts:[{x:z,y:0,col:C.n,lab:'x0'}],
      areas:[{P,Q:[0],a,b:z,col:C.a1,lab:'A1'},{P,Q:[0],a:z,b,col:C.a2,lab:'A2'}],
      fs:[{P,col:'#1d1d1f'}],
      hinweis:`Tipp: <b>menu ▸ 6 ▸ 7: Integral</b>, Grenzen eintippen (<b>(−)</b> für negative Zahlen). Liegt eine Nullstelle im Intervall, dort aufteilen: Integral von ${deN(a)} bis zur Nullstelle und von der Nullstelle bis ${deN(b)}, dann die Beträge addieren.`};
  }
}
function genZW(){
  for(;;){
    const a=pickR([0.5,1,-0.5,-1]);
    const f=genR([a]), s=[R(-4,4),R(-4,4),R(-4,5)].sort((x,y)=>x-y);
    if(s[1]-s[0]<1||s[2]-s[1]<1||s[2]-s[0]>7) continue;
    const D=fromRoots(a,s), G=sub(f.P,D).slice(1);           // g = f − D (höchstens 2. Grades)
    if(G.some(c=>Math.abs(c)>12)) continue;
    const ys=s.map(x=>ev(G,x)); if(ys.some(y=>Math.abs(y)>12)) continue;
    const A1=Math.abs(integ(D,s[0],s[1])), A2=Math.abs(integ(D,s[1],s[2]));
    if(A1<0.4||A2<0.4) continue;
    const yy=[]; for(let x=s[0];x<=s[2];x+=0.25){ yy.push(ev(f.P,x),ev(G,x)); }
    const w=fenster(s.concat(f.e.filter(x=>x>s[0]-2&&x<s[2]+2)),yy.concat(ys));
    if(w.y1-w.y0>26) continue;
    const gname=G.length===2||G[0]===0?'Gerade':'Parabel';
    return {h:"Zwischen zwei Graphen", P:f.P, w,
      auftrag:`Zeichnen Sie beide Graphen im CAS. Bestimmen Sie die <i>x</i>-Werte der drei Schnittpunkte (von links nach rechts), die Teilflächen <i>A</i><sub>1</sub>, <i>A</i><sub>2</sub> und die gesamte Fläche <i>A</i> zwischen den Graphen.`,
      term:polyHTML('f',f.P)+'<br>'+polyHTML('g',G[0]===0?G.slice(1):G),
      felder:s.map((x,i)=>NUM('s'+i,`<i>x</i><sub>S${i+1}</sub> =`,x,C.n)).concat([NUM('a1','<i>A</i><sub>1</sub> =',A1,C.a1),NUM('a2','<i>A</i><sub>2</sub> =',A2,C.a2),NUM('a','<i>A</i> =',A1+A2,C.a)]),
      pts:s.map((x,i)=>({x,y:ev(G,x),col:C.n,lab:'S'+(i+1),below:i%2===1})),
      areas:[{P:f.P,Q:G,a:s[0],b:s[1],col:C.a1,lab:'A1'},{P:f.P,Q:G,a:s[1],b:s[2],col:C.a2,lab:'A2'}],
      fs:[{P:f.P,col:'#1d1d1f'},{P:G,col:'#C62828'}],
      hinweis:'Tipp: <span class="liste">f1(x)='+casPoly(f.P)+'</span>, mit <b>tab</b> <span class="liste">f2(x)='+casPoly(G[0]===0?G.slice(1):G)+'</span> · Schnittpunkte: <b>menu ▸ 6 ▸ 4</b> · Teilflächen: <b>menu ▸ 6 ▸ 8: Begrenzter Bereich</b>, Grenzen = benachbarte Schnittstellen.'};
  }
}
const MODES={ax:{name:"Fläche mit der x-Achse",gen:genAX}, iv:{name:"Vorgegebenes Intervall",gen:genIV}, zw:{name:"Zwischen zwei Graphen",gen:genZW}};
const ORDER=["ax","iv","zw"];
let mode=ORDER[0], A=null, stat={a:0,r:0};

function inp(id){ return `<input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" class="ci">`; }
function neu(){
  A=MODES[mode].gen();
  document.getElementById('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  document.getElementById('h').textContent="Aufgabe: "+A.h;
  document.getElementById('auftrag').innerHTML=A.auftrag;
  document.getElementById('term').innerHTML=A.term;
  document.getElementById('fen').innerHTML=FTXT(A.w);
  document.getElementById('plot').innerHTML='';
  document.getElementById('hinweis').innerHTML=A.hinweis;
  document.getElementById('felder').innerHTML=A.felder.map(F=>
    `<div class="f co" id="f_${F.k}" style="border-left-color:${F.col}"><label><span class="dot" style="background:${F.col}"></span>${F.pt?F.lab+'(':F.lab}</label><span class="cos">`+
    (F.pt?inp('i_'+F.parts[0].k)+'<span class="pl">|</span>'+inp('i_'+F.parts[1].k)+'<span>)</span>':inp('i_'+F.parts[0].k))+
    `</span><span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
// Toleranz 0,01: das CAS zeigt 3 gültige Ziffern, beim Weiterrunden kann die letzte Stelle um 1 abweichen
const near=(a,b)=>Math.abs(a-b)<0.0105;
function check1(raw,soll){
  if(!raw.trim()) return 'leer';
  const p=parse(raw); if(!p) return 'fmt';
  if(near(p.v,soll)) return p.dec>2?'many':'ok';
  return 'no';
}
function pruefen(){
  let ok=0;
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent='';
    const r=F.parts.map(p=>check1(document.getElementById('i_'+p.k).value,p.soll));
    F.parts.forEach((p,j)=>document.getElementById('i_'+p.k).classList.toggle('bad',r[j]==='no'||r[j]==='fmt'));
    if(r.every(x=>x==='leer')) return;
    let st,t='';
    if(r.every(x=>x==='ok')) st='ok';
    else if(r.includes('fmt')){ st='fmt'; t='Bitte nur Zahlen eintragen, z. B. −1,59.'; }
    else if(r.includes('leer')){ st='no'; t='Füllen Sie beide Koordinaten aus.'; }
    else if(r.includes('many')&&!r.includes('no')){ st='fmt'; t='Der Wert stimmt – bitte auf 2 Nachkommastellen runden.'; }
    else { st='no';
      const vs=F.parts.map(p=>parse(document.getElementById('i_'+p.k).value)), sw=F.pt&&vs.every(Boolean)&&near(vs[0].v,F.parts[1].soll)&&near(vs[1].v,F.parts[0].soll);
      t= sw ? 'x und y vertauscht? Zuerst die x-Koordinate.' : F.pt ? 'Das stimmt noch nicht. Liegt genau ein Punkt im markierten Bereich? Richtiger Befehl (Maximum/Minimum)?' : 'Das stimmt noch nicht. Reihenfolge von links nach rechts? Grenzen richtig gesetzt? Bei Flächen: an Nullstellen bzw. Schnittstellen aufteilen und die Beträge addieren.'; }
    f.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
  });
  const tot=A.felder.length; stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), msg=f.querySelector('.msg');
    if(f.classList.contains('ok')) return;
    f.classList.add('show');
    msg.innerHTML='Lösung: '+(F.pt?`${F.lab}(${de2(F.parts[0].soll)} | ${de2(F.parts[1].soll)})`:de2(F.parts[0].soll));
  });
  document.getElementById('plot').innerHTML=plot(A.fs,A.w,A.pts,A.areas);
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>

</body></html>
