const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(){
  const pw=document.getElementById('pw').value.trim(), msg=document.getElementById('msg');
  if(!/^\d{4}$/.test(pw)){msg.textContent='Bitte genau vier Ziffern eingeben.';return;}
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
    document.getElementById('lock').style.display='none';
    document.getElementById('out').innerHTML=new TextDecoder().decode(pt);
  }catch(e){msg.textContent='Falscher Code – überprüfen Sie Ihre Ergebnisse.';}
}
