<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS Schritt für Schritt: Regressionsgerade</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:1000px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1 1 auto; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.tabs{ max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
main{ max-width:1000px; margin:14px auto 30px; padding:0 16px; display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

/* ---------- Rechner ---------- */
.calc{ width:330px; flex:0 0 330px; background:#E8562A; border-radius:30px; padding:0 13px; box-shadow:0 6px 22px rgba(0,0,0,.18); }
.body{ background:#2b2b2f; border-radius:22px; padding:12px 12px 16px; }
.face{ background:#151518; border-radius:14px; padding:8px 10px 10px; margin:-4px -4px 10px; }
.brand{ text-align:center; font:bold 12px Arial,sans-serif; color:#E8562A; letter-spacing:.5px; margin-bottom:6px; }
.brand b{ color:#fff; margin-left:6px; }
.scrwrap{ background:#000; border-radius:4px; padding:4px; }
.scr{ width:280px; height:210px; background:#fff; position:relative; overflow:hidden; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#000; margin:0 auto; }
.nav{ display:grid; grid-template-columns:52px 1fr 52px; gap:6px; margin-top:10px; align-items:center; }
.nav .col{ display:flex; flex-direction:column; gap:7px; }
.pad{ width:112px; height:84px; margin:0 auto; background:#3a3a3f; border-radius:20px; position:relative; }
.pad .k{ position:absolute; background:transparent; color:#aaa; font-size:10px; border:0; }
.pad .k[data-k=up]{ left:38px; top:2px; width:36px; height:20px; }
.pad .k[data-k=down]{ left:38px; bottom:2px; width:36px; height:20px; }
.pad .k[data-k=left]{ left:2px; top:28px; width:22px; height:28px; }
.pad .k[data-k=right]{ right:2px; top:28px; width:22px; height:28px; }
.pad .k[data-k=click]{ left:38px; top:24px; width:36px; height:36px; background:#4b4b52; border-radius:9px; color:#ddd; }
.k{ font:600 11px Arial,sans-serif; color:#fff; background:#4a4a50; border:0; border-radius:6px; height:24px; padding:0; cursor:default; transition:transform .15s, box-shadow .15s; }
.k.lt{ background:#8e8e95; color:#111; font-size:14px; }
.k.ctrl{ background:#D93A2B; }
.k.bk{ background:#26262a; border:1px solid #555; }
.k.hit{ box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.12); z-index:2; position:relative; }
.pad .k.hit{ position:absolute; }
.row4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0; }
.main7{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px 5px; }
.main7 .gap{ grid-column:span 1; }
.let9{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px 4px; margin-top:10px; }
.let9 .k{ height:20px; font-size:10px; }
.span2{ grid-column:span 2; } .span3{ grid-column:span 3; }

/* ---------- Bildschirm-Inhalte ---------- */
.tb{ height:16px; background:#d9dee5; display:flex; align-items:center; gap:3px; padding:0 4px; font-size:9.5px; color:#333; border-bottom:1px solid #aab3bf; }
.tb .tab{ background:#fff; border:1px solid #aab3bf; border-bottom:0; padding:0 5px; border-radius:3px 3px 0 0; height:13px; line-height:12px; margin-top:3px; }
.tb .tab.off{ background:#eef1f5; color:#777; }
.tb .sp{ flex:1; } .tb .bat{ width:16px; height:7px; border:1px solid #555; border-radius:1px; position:relative; }
.tb .bat:after{ content:""; position:absolute; left:1px; top:1px; bottom:1px; width:10px; background:#3a3; }
table.sh{ border-collapse:collapse; table-layout:fixed; width:280px; }
table.sh td{ border:1px solid #c9ced6; height:15px; padding:0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10.5px; }
table.sh td.rn{ width:16px; background:#eef1f5; color:#666; text-align:center; padding:0; font-size:9px; }
table.sh tr.hd td{ height:18px; background:#eef1f5; font-weight:bold; }
table.sh tr.hd td span{ color:#888; font-weight:normal; margin-right:4px; }
table.sh tr.fm td{ background:#f7f8fa; color:#777; font-style:italic; font-size:9px; height:13px; }
table.sh td.num{ text-align:right; }
table.sh td.cur{ outline:2px solid #000; outline-offset:-2px; }
table.sh td.good{ background:#FFF3C4; }
table.sh td.star{ background:#FFE07A; font-weight:bold; }
table.sh td.dim{ color:#aaa; text-decoration:line-through; }
.menu{ position:absolute; background:#fff; border:1px solid #6b7a8c; box-shadow:2px 2px 6px rgba(0,0,0,.3); width:178px; font-size:10.5px; }
.menu div{ padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.menu div.sel{ background:#3b78c2; color:#fff; }
.dlg{ position:absolute; left:8px; right:8px; top:22px; background:#f4f6f9; border:1px solid #6b7a8c; box-shadow:2px 2px 8px rgba(0,0,0,.35); font-size:10.5px; }
.dlg .tt{ background:#c9d3df; font-weight:bold; padding:2px 6px; }
.dlg .ff{ display:grid; grid-template-columns:112px 1fr; gap:4px 5px; padding:6px 7px 4px; align-items:center; }
.dlg .lb{ text-align:right; }
.dlg .ct{ background:#fff; border:1px solid #9aa5b3; height:15px; padding:0 4px; display:flex; justify-content:space-between; align-items:center; }
.dlg .ct.fo{ outline:2px solid #3b78c2; }
.dlg .ct.mark{ background:#FFF3C4; }
.dlg .bt{ display:flex; justify-content:flex-end; gap:6px; padding:3px 7px 6px; }
.dlg .bt span{ border:1px solid #8a95a3; background:#fff; padding:0 10px; border-radius:3px; }
.dlg .bt span.fo{ outline:2px solid #3b78c2; }
.drop{ position:absolute; background:#fff; border:1px solid #6b7a8c; font-size:10.5px; width:80px; box-shadow:2px 2px 6px rgba(0,0,0,.3); }
.drop div{ padding:0 5px; } .drop div.sel{ background:#3b78c2; color:#fff; }
.home{ padding:6px 10px; font-size:11px; }
.home h4{ margin:2px 0 3px; font-size:10px; color:#666; border-bottom:1px solid #ddd; }
.home .it{ padding:1px 6px; } .home .it.sel{ background:#3b78c2; color:#fff; }
.calcapp{ padding:4px 6px; font-size:11.5px; }
.calcapp .ln{ display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:3px 0; }
.calcapp .cur{ border:1px solid #888; height:16px; margin-top:4px; }

/* ---------- Panel ---------- */
.panel{ flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.prog{ display:flex; gap:4px; margin-bottom:12px; }
.prog i{ flex:1; height:5px; border-radius:3px; background:#e3e6eb; cursor:pointer; }
.prog i.done{ background:#9aa3b0; } .prog i.now{ background:var(--lf); }
.nr{ font-size:13px; color:var(--mute); }
.panel h2{ margin:2px 0 8px; font-size:20px; line-height:1.3; }
.panel p{ margin:0 0 10px; font-size:15.5px; }
.keys{ display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px; }
.chip{ font:600 13px Arial,sans-serif; background:#2b2b2f; color:#fff; border-radius:5px; padding:3px 9px; border:2px solid transparent; }
.chip.ctrl{ background:#D93A2B; } .chip.lt{ background:#8e8e95; color:#111; }
.chip.hit{ border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35); }
.chip.plus{ background:none; color:var(--mute); padding:3px 2px; }
.note{ background:#FFF8E8; border-left:4px solid var(--hit); border-radius:4px; padding:7px 12px; font-size:14.5px; margin:0 0 10px; }
.note b{ color:#8a5a00; }
.btns{ display:flex; gap:10px; margin-top:14px; }
.btns button{ font:inherit; font-size:16px; padding:9px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); color:#fff; border-color:var(--lf); margin-left:auto; }
.btns button:disabled{ opacity:.4; cursor:default; }
.hint{ font-size:12.5px; color:var(--mute); margin-top:10px; }
@media (max-width:380px){ .calc{ transform:scale(.92); transform-origin:top center; } }

.k{ cursor:pointer; } .k:focus{ outline:none; } .k:active{ transform:scale(.95); }
.k.good{ box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8); }
.k.bad{ box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack .35s; }
@keyframes wack{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.chip.done{ opacity:.35; }
.chip.now{ border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35); }
.chip.big{ font-size:16px; padding:4px 12px; vertical-align:middle; }
.stat{ min-height:38px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; background:var(--bg); border-radius:8px; padding:6px 12px; margin:6px 0 12px; }
.stat .ok{ color:#2E7D32; font-weight:bold; } .stat .err{ color:#C62828; font-weight:bold; }
.caret{ animation:blink 1s steps(1) infinite; font-weight:normal; } @keyframes blink{ 50%{opacity:0} }
.opt{ font-size:13.5px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:10px; }
.btns button.go{ background:var(--lf); color:#fff; border-color:var(--lf); }
#next{ margin-left:auto; }
.task{ border:1px solid var(--line); border-left:4px solid var(--lf); border-radius:8px; padding:9px 13px; margin:0 0 14px; font-size:14.5px; background:#fafbfc; }
.task b{ color:var(--lf); }
table.tt{ border-collapse:collapse; margin:7px 0 1px; font-size:14.5px; }
table.tt th, table.tt td{ border:1px solid #c3c8d0; padding:2px 9px; text-align:center; min-width:30px; background:#fff; }
table.tt th{ background:#eef0f3; font-style:italic; font-family:Cambria,Georgia,serif; }
</style></head><body>

(function(){

  const el=document.getElementById('let9'); let h='';
  rows.forEach(r=>r.forEach((c,i)=>{
    if(c==="") h+='<span></span>';
    else if(c==="␣") h+='<button class="k span3" data-k="space">␣</button>';
    else { const k=/^[a-z]$/.test(c)?c:c; h+=`<button class="k" data-k="${k}">${/^[a-z]$/.test(c)?c.toUpperCase():c}</button>`; }
  }));
  el.innerHTML=h;
})();

// ---------- Bildschirm-Bausteine ----------
const esc=s=>String(s);
function topbar(tabs,cur){
  return '<div class="tb">'+tabs.map(t=>`<span class="tab ${t===cur?'':'off'}">${t}</span>`).join('')+'<span class="sp"></span><span>RAD</span><span class="bat"></span></div>';
}
// cols: [{n:'ur', f:'', v:[..], txt:true}]  (genau 4 Spalten A–D)
function sheet(o){
  const L=["A","B","C","D"], top=o.top||0, rows=10, cols=o.cols.concat([{},{},{},{}]).slice(0,4);
  let h=topbar(o.tabs||['1.1'],o.tab||'1.1')+'<table class="sh"><tr class="hd"><td class="rn"></td>';
  cols.forEach((c,i)=>{ const cur=o.cur&&o.cur[0]===i&&o.cur[1]===-1; h+=`<td class="${cur?'cur':''}"><span>${L[i]}</span>${cur&&o.buf?o.buf+'<span class="caret">|</span>':(c.n||'')}</td>`; });
  h+='</tr><tr class="fm"><td class="rn">◆</td>'; cols.forEach(c=>h+=`<td>${c.f||''}</td>`); h+='</tr>';
  for(let r=top;r<top+rows;r++){
    const cls=(o.hl&&o.hl[r])||'';
    h+=`<tr><td class="rn">${r+1}</td>`;
    cols.forEach((c,i)=>{ let v=(c.v&&c.v[r]!==undefined)?c.v[r]:''; const cur=o.cur&&o.cur[0]===i&&o.cur[1]===r; if(cur&&o.buf) v=o.buf+'<span class="caret">|</span>';
      h+=`<td class="${c.txt?'':'num'} ${cur?'cur':''} ${c.res?cls:''}">${v}</td>`; });
    h+='</tr>';
  }
  return h+'</table>';
}

function menus(levels){ // [{items,sel}]

}

}
function hint(){
  document.querySelectorAll('.k.hit').forEach(e=>e.classList.remove('hit'));
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },900); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    const l=LBL[S.k[pos]]||(/^[a-z]$/.test(S.k[pos])?S.k[pos].toUpperCase():S.k[pos]);
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(S.k[pos],pos).replace('now','now big')}`;
  }
}
function advance(){
  const T=TRACKS[tr];
  if(st<T.steps.length-1){ st++; pos=0; render(); }
  else render();
}
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }      // ueberspringen: Ergebnis zeigen
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }
document.querySelectorAll('.calc .k').forEach(b=>b.addEventListener('click',()=>{ b.blur(); press(b.dataset.k); }));
$('next').onclick=next; $('back').onclick=back;
$('tabs').onclick=e=>{ const t=e.target.dataset.t; if(t){ tr=t; st=0; pos=0; render(); } };
$('prog').onclick=e=>{ if(e.target.dataset.i){ st=+e.target.dataset.i; pos=0; render(); } };

const KMAP={Enter:'enter',Tab:'tab',Escape:'esc',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Control:'ctrl',Home:'on',' ':'click'};
document.addEventListener('keydown',e=>{
  let k=KMAP[e.key]; if(!k && e.key.length===1 && /[0-9a-zA-Z.()]/.test(e.key)) k=e.key.toLowerCase();
  if(k){ e.preventDefault(); press(k); }
});
const h=(location.hash||'').slice(1); if(TRACKS[h]&&ORDER.includes(h)) tr=h;
render();

</script>
</body></html>
