<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Funktionswerte berechnen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.dt{ overflow-x:auto; }
table.d{ border-collapse:collapse; font-size:16px; margin:2px 0 4px; }
table.d th, table.d td{ border:1px solid #c3c8d0; padding:4px 10px; text-align:center; min-width:40px; }
table.d th{ background:#eef0f3; font-family:Cambria,Georgia,serif; font-style:italic; }
.spalten{ font-size:13.5px; color:var(--mute); margin-top:6px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
.f label{ font-size:15px; }
.f label .z{ color:var(--mute); font-family:Cambria,Georgia,serif; font-size:14px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }

.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.plot .cv{ fill:none; stroke:#1d1d1f; stroke-width:2.2; } .plot .ar{ stroke-width:2; stroke-dasharray:6 4; fill:none; }
.plot .ml{ font:bold 13px system-ui,Arial,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ border-left:5px solid #ccc; }
.f .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.f.gl{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.f.gl > label:first-child{ min-width:150px; font-family:Cambria,Georgia,serif; font-size:16px; }
.f.gl .xin{ display:inline-flex; align-items:center; gap:6px; }
.f.gl .xin .z{ font-family:Cambria,Georgia,serif; font-size:15px; }
.f.gl .kl{ font-size:14.5px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.f.gl .kl input{ width:18px; height:18px; }
.f.gl .m{ margin-left:auto; }
.f.gl .msg{ flex-basis:100%; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.liste{ font-weight:normal; }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const deN=v=>{ let t=(Math.round(v*1e6)/1e6).toString(); return t.replace('-','−').replace('.',','); };
const de2=v=>{ const x=r2(v); return (Number.isInteger(x)?String(x):x.toFixed(2)).replace('-','−').replace('.',','); };
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=R(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function termHTML(n,a,b,c){
  const co=(v,first)=>{ const s=v<0?'−':(first?'':'+'); const m=Math.abs(v); return {s, m:deN(m)}; };
  let h=`<i>${n}</i>(<i>x</i>) = `;
  const A=co(a,true); h+=(A.s?A.s:'')+(A.m==='1'?'':A.m)+'<i>x</i>²';
  if(b!==0){ const B=co(b); h+=` ${B.s} ${B.m==='1'?'':B.m}<i>x</i>`; }
  if(c!==0){ const Cc=co(c); h+=` ${Cc.s} ${Cc.m}`; }
  return h;
}
const casTerm=(a,b,c)=>{ let t=(a<0?'−':'')+Math.abs(a)+'x^2'; if(b) t+=(b<0?'−':'+')+Math.abs(b)+'x'; if(c) t+=(c<0?'−':'+')+Math.abs(c); return t; };

// ---------- Graph ----------
const COL=["#1F4E99","#2E7D32","#C25E00","#8E3BA8"];
function plot(f,name,marks,vx){
  // marks: [{x,y,col,typ:'fw'|'gl', xs:[...]}]
  let xs=[],ys=[];
  marks.forEach(m=>{ if(m.typ==='fw'){ xs.push(m.x); ys.push(m.y); } else { ys.push(m.y); (m.xs||[]).forEach(v=>xs.push(v)); } });
  xs.push(0); ys.push(0); if(vx!==undefined && Math.abs(vx)<9){ xs.push(vx); ys.push(f(vx)); }
  let x0=Math.floor(Math.min(...xs))-1, x1=Math.ceil(Math.max(...xs))+1;
  let y0=Math.floor(Math.min(...ys))-1, y1=Math.ceil(Math.max(...ys))+1;
  const W=640, H=Math.min(460,Math.max(280,(y1-y0)*30)), pl=marks.some(m=>m.typ==='gl')?96:34, pr=22, pt=16, pb=26;
  const sx=(W-pl-pr)/(x1-x0), sy=(H-pt-pb)/(y1-y0);
  const X=x=>pl+(x-x0)*sx, Y=y=>pt+(y1-y)*sy;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph von ${name}">`;
  const st=Math.max(1,Math.ceil((x1-x0)/14)), sty=Math.max(1,Math.ceil((y1-y0)/12));
  for(let x=x0;x<=x1;x++) o+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" class="gl"/>`;
  for(let y=y0;y<=y1;y++) o+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" class="gl"/>`;
  o+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)+12}" y2="${Y(0)}" class="ax"/><path d="M${X(x1)+16} ${Y(0)} l-8 -4 v8z" class="ah"/>`;
  o+=`<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)-10}" class="ax"/><path d="M${X(0)} ${Y(y1)-14} l-4 8 h8z" class="ah"/>`;
  o+=`<text x="${X(x1)+8}" y="${Y(0)+16}" class="al">x</text><text x="${X(0)+7}" y="${Y(y1)-4}" class="al">y</text>`;
  for(let x=x0;x<=x1;x++) if(x!==0&&x%st===0) o+=`<text x="${X(x)}" y="${Y(0)+14}" class="tl" text-anchor="middle">${String(x).replace('-','−')}</text>`;
  for(let y=y0;y<=y1;y++) if(y!==0&&y%sty===0) o+=`<text x="${X(0)-5}" y="${Y(y)+4}" class="tl" text-anchor="end">${String(y).replace('-','−')}</text>`;
  let d=''; const n=300; let pen=false;
  for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n, y=f(x); if(y>=y0-.2&&y<=y1+.2){ d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' '; pen=true; } else pen=false; }
  o+=`<path d="${d}" class="cv"/>`;
  marks.forEach(m=>{
    if(m.typ==='fw'){
      o+=`<line x1="${X(m.x)}" y1="${Y(0)}" x2="${X(m.x)}" y2="${Y(m.y)}" stroke="${m.col}" class="ar"/><line x1="${X(m.x)}" y1="${Y(m.y)}" x2="${X(0)}" y2="${Y(m.y)}" stroke="${m.col}" class="ar"/>`;
      o+=`<circle cx="${X(m.x)}" cy="${Y(0)}" r="4" fill="${m.col}"/><circle cx="${X(0)}" cy="${Y(m.y)}" r="4" fill="${m.col}"/>`;
      o+=`<text x="${X(m.x)}" y="${m.y>0?Y(0)+28+(m.i%2)*14:Y(0)-8-(m.i%2)*14}" fill="${m.col}" class="ml" text-anchor="middle">${m.lab}</text>`;
    } else {
      const xe=(m.xs&&m.xs.length)?m.xs[m.xs.length-1]:x1;
      o+=`<line x1="${X(0)}" y1="${Y(m.y)}" x2="${X(m.xs&&m.xs.length?xe:x1)}" y2="${Y(m.y)}" stroke="${m.col}" class="ar"/>`;
      if(m.xs&&m.xs.length&&m.xs[0]<0) o+=`<line x1="${X(0)}" y1="${Y(m.y)}" x2="${X(m.xs[0])}" y2="${Y(m.y)}" stroke="${m.col}" class="ar"/>`;
      (m.xs||[]).forEach(v=>{ o+=`<line x1="${X(v)}" y1="${Y(m.y)}" x2="${X(v)}" y2="${Y(0)}" stroke="${m.col}" class="ar"/><circle cx="${X(v)}" cy="${Y(0)}" r="4" fill="${m.col}"/>`; });
      o+=`<circle cx="${X(0)}" cy="${Y(m.y)}" r="4" fill="${m.col}"/><line x1="${pl-6}" y1="${Y(m.y)}" x2="${X(0)}" y2="${Y(m.y)}" stroke="${m.col}" stroke-width="1" stroke-dasharray="2 3"/><text x="${pl-8}" y="${Y(m.y)+4}" fill="${m.col}" class="ml" text-anchor="end">${m.lab}</text>`;
    }
  });
  return o+'</svg>';
}

// ---------- Aufgaben ----------
function genF(){
  let a; do{ a=R(-15,15)/10; }while(Math.abs(a)<0.2);
  const b=R(-8,8)/2, c=R(-10,10)/2;
  return {a,b,c,f:x=>a*x*x+b*x+c};
}
function genFW(){
  const F=genF(); let xs;
  do{ xs=shuffle(Array.from({length:23},(_,i)=>(i-8)/2)).slice(0,4).sort((p,q)=>p-q); }
  while(!xs.some(x=>!Number.isInteger(x)) || !xs.some(x=>x<0) || xs.some((x,i)=>i>0&&x-xs[i-1]<1) || xs.some(x=>Math.abs(F.f(x))>14) || xs.includes(0));
  const marks=xs.map((x,i)=>({typ:'fw',i,x,y:F.f(x),col:COL[i],lab:'x = '+deN(x)}));
  return {typ:'fw', h:"Funktionswerte berechnen", F,
    auftrag:"Speichern Sie die Funktion im CAS und berechnen Sie die Funktionswerte an den markierten Stellen.",
    term:termHTML('f',F.a,F.b,F.c), plot:plot(F.f,'f',marks,-F.b/(2*F.a)),
    felder:xs.map((x,i)=>({k:'w'+i, lab:`<i>f</i>(${deN(x)})`, col:COL[i], soll:F.f(x)})),
    hinweis:'Tipp: Mit <b>ctrl + ⊞</b> schreiben Sie <b>:=</b>, also z.&nbsp;B. <span class="liste">f(x):='+casTerm(F.a,F.b,F.c)+'</span>. Danach nur noch <span class="liste">f(2.5)</span> eintippen.'};
}
function genGL(){
  let F,xv,yv;
  do{ F=genF(); xv=-F.b/(2*F.a); yv=F.f(xv); }while(Math.abs(xv)>6||Math.abs(yv)>9);
  const dir=F.a>0?1:-1, lv=[], used=new Set();
  const nNone=Math.random()<0.5?1:0;
  while(lv.length<3-nNone){
    const y=dir*R(1,12)/2+Math.round(yv*2)/2; const d=(y-yv)/F.a;
    if(d<=0.05||used.has(y)||Math.abs(y)>12) continue;
    const s=Math.sqrt(d), x1=xv-s, x2=xv+s; if(Math.abs(x1)>9||Math.abs(x2)>9||Math.abs(x1)<0.2||Math.abs(x2)<0.2) continue;
    used.add(y); lv.push({y,xs:[x1,x2]});
  }
  if(nNone){ let y; do{ y=Math.round(yv*2)/2-dir*R(1,6)/2; }while((y-yv)/F.a>=0||used.has(y)); lv.splice(R(0,lv.length),0,{y,xs:[]}); }
  const marks=lv.map((l,i)=>({typ:'gl',y:l.y,xs:l.xs,col:COL[i],lab:'f(x) = '+deN(l.y)}));
  return {typ:'gl', h:"Gleichungen lösen", F,
    auftrag:"Lösen Sie die Gleichungen mit <b>solve</b>. Tragen Sie die kleinere Lösung bei <i>x</i>₁ ein. Gibt es keine Lösung, setzen Sie das Häkchen.",
    term:termHTML('f',F.a,F.b,F.c), plot:plot(F.f,'f',marks,xv), lv,
    felder:lv.map((l,i)=>({k:'g'+i, lab:`<i>f</i>(<i>x</i>) = ${deN(l.y)}`, col:COL[i], gl:true, xs:l.xs})),
    hinweis:'Tipp: <span class="liste">solve(f(x)='+String(lv[0].y).replace('-','−')+',x)</span>, dann <b>ctrl + enter</b> für Dezimalzahlen. <span class="liste">false</span> heißt: keine Lösung.'};
}
const MODES={fw:{name:"Funktionswerte",gen:genFW}, gl:{name:"Gleichungen",gen:genGL}};
const ORDER=["fw"];
let mode=ORDER[0], A=null, stat={a:0,r:0};

function inp(id,ph){ return `<input id="${id}" inputmode="decimal" autocomplete="off" placeholder="${ph}">`; }
function neu(){
  A=MODES[mode].gen();
  document.getElementById('tabs').innerHTML=ORDER.length<2?'':ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  document.getElementById('h').textContent="Aufgabe: "+A.h;
  document.getElementById('auftrag').innerHTML=A.auftrag;
  document.getElementById('term').innerHTML=A.term;
  document.getElementById('plot').innerHTML=A.plot;
  document.getElementById('hinweis').innerHTML=A.hinweis;
  document.getElementById('felder').innerHTML=A.felder.map(F=> F.gl ?
    `<div class="f gl" id="f_${F.k}" style="border-left-color:${F.col}"><label><span class="dot" style="background:${F.col}"></span>${F.lab}</label>
      <span class="xin"><span class="z"><i>x</i>₁ ≈</span>${inp('i_'+F.k+'a','0,00')}</span><span class="xin"><span class="z"><i>x</i>₂ ≈</span>${inp('i_'+F.k+'b','0,00')}</span>
      <label class="kl"><input type="checkbox" id="c_${F.k}"> keine Lösung</label><span class="m"></span><div class="msg"></div></div>` :
    `<div class="f" id="f_${F.k}" style="border-left-color:${F.col}"><label for="i_${F.k}"><span class="dot" style="background:${F.col}"></span>${F.lab} =</label>${inp('i_'+F.k,'0,00')}<span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function check1(raw,soll){ // -> 'ok' | 'no' | 'fmt' | 'leer' | 'many'
  if(!raw.trim()) return 'leer';
  const p=parse(raw); if(!p) return 'fmt';
  if(near(p.v,soll)) return p.dec>2?'many':'ok';
  return 'no';
}
function pruefen(){
  let ok=0;
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent='';
    let st, t='';
    if(!F.gl){
      st=check1(document.getElementById('i_'+F.k).value, F.soll);
      if(st==='leer') return;
      if(st==='fmt') t='Bitte nur eine Zahl eintragen, z. B. 3,68.';
      if(st==='many'){ st='fmt'; t='Der Wert stimmt – bitte auf 2 Nachkommastellen runden.'; }
      if(st==='no'){ const x=parseFloat(F.lab.replace(/<[^>]+>/g,'').match(/\((.*)\)/)[1].replace('−','-').replace(',','.'));
        t = near(parse(document.getElementById('i_'+F.k).value)?.v ?? NaN, A.F.f(-x)) ? 'Das ist f(−x). Prüfen Sie das Vorzeichen: Taste (−).' : 'Das stimmt noch nicht. Ist f richtig gespeichert? Haben Sie die Kommazahl mit Punkt getippt?'; }
    } else {
      const cb=document.getElementById('c_'+F.k).checked, ra=document.getElementById('i_'+F.k+'a').value, rb=document.getElementById('i_'+F.k+'b').value;
      if(!cb && !ra.trim() && !rb.trim()) return;
      if(F.xs.length===0){ st = cb && !ra.trim() && !rb.trim() ? 'ok' : 'no'; if(st==='no') t = cb ? 'Bei keiner Lösung bleiben die Felder leer.' : 'Was zeigt das CAS an? Bei false gibt es keine Lösung.'; }
      else if(cb){ st='no'; t='Diese Gleichung hat Lösungen. Das CAS zeigt zwei x-Werte mit „or“.'; }
      else {
        const sa=check1(ra,F.xs[0]), sb=check1(rb,F.xs[1]);
        if(sa==='ok'&&sb==='ok') st='ok';
        else if(sa==='fmt'||sb==='fmt'){ st='fmt'; t='Bitte nur Zahlen eintragen, z. B. −1,24.'; }
        else if(sa==='many'||sb==='many'){ st= (sa==='no'||sb==='no')?'no':'fmt'; t='Bitte auf 2 Nachkommastellen runden.'; }
        else if(check1(ra,F.xs[1])==='ok'&&check1(rb,F.xs[0])==='ok'){ st='fmt'; t='Vertauscht: Die kleinere Lösung gehört zu x₁.'; }
        else { st='no'; t= (sa==='leer'||sb==='leer') ? 'Es gibt zwei Lösungen – tragen Sie beide ein.' : 'Das stimmt noch nicht. Prüfen Sie: solve(f(x)=…,x) und ctrl + enter.'; }
      }
    }
    f.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
  });
  const tot=A.felder.length; stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), msg=f.querySelector('.msg');
    if(f.classList.contains('ok')) return;
    f.classList.add('show');
    msg.innerHTML='Lösung: '+(!F.gl ? de2(F.soll) : F.xs.length ? `<i>x</i>₁ ≈ ${de2(F.xs[0])}, <i>x</i>₂ ≈ ${de2(F.xs[1])}` : 'keine Lösung (false)');
  });
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>

</body></html>
