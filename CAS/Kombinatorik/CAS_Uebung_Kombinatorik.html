<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Kombinatorik</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 6px; }
.tipp{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 4px; }
.tipp b{ color:var(--warn); }
.f{ border:1px solid var(--line); border-left:5px solid var(--lf); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
.f .q{ font-size:15.5px; margin-bottom:8px; line-height:1.45; }
.f .q .bz{ font-weight:bold; margin-right:4px; }
.f .row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.f .term{ font-family:Cambria,Georgia,serif; font-size:19px; }
.f input.zahl{ font:inherit; font-size:16px; width:170px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f input.bad{ border-color:var(--no); background:#fff6f5; }
.mods{ display:inline-flex; gap:6px; }
.mods button{ font:600 14px system-ui,Arial,sans-serif; border:1px solid #b8bdc6; background:#fff; border-radius:6px; padding:5px 12px; cursor:pointer; }
.mods button.on{ background:var(--lf); color:#fff; border-color:var(--lf); }
.mods button.rt{ outline:3px solid var(--ok); outline-offset:1px; }
.mods button.fl{ outline:3px solid var(--no); outline-offset:1px; }
.lbl{ font-size:13.5px; color:var(--mute); }
.f .m{ font-weight:bold; font-size:20px; margin-left:auto; min-width:20px; text-align:center; }
.f.ok{ background:var(--okbg); border-left-color:var(--ok); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); border-left-color:var(--no); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ font-size:14px; margin-top:6px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:#333; }
.cmd{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 5px; white-space:nowrap; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }
/* linksbündig (Moodle-Frame) */
.top .in, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[R(0,a.length-1)];
const fak=n=>{ let r=1n; for(let i=2n;i<=BigInt(n);i++) r*=i; return r; };
const nPr=(n,k)=>fak(n)/fak(n-k), nCr=(n,k)=>fak(n)/(fak(k)*fak(n-k));
const tsd=b=>String(b).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=R(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const M={f:'n!',p:'nPr',c:'nCr'};
const cmdOf=(m,n,k)=>m==='f'?`${n}!`:`${M[m]}(${n},${k})`;
const valOf=(m,n,k)=>m==='f'?fak(n):m==='p'?nPr(n,k):nCr(n,k);

// ---------- Sachaufgaben-Vorlagen ----------
const SACH={
 f:[
  ()=>{ const n=R(4,10); return {n,t:`${n} Personen stellen sich für ein Foto in eine Reihe. Wie viele Reihenfolgen gibt es?`}; },
  ()=>{ const n=R(4,9); return {n,t:`${n} verschiedene Bücher werden nebeneinander ins Regal gestellt. Wie viele Anordnungen gibt es?`}; },
  ()=>{ const n=R(4,8); return {n,t:`Eine Lieferfahrerin hat ${n} Adressen. In welcher Reihenfolge fährt sie? Wie viele Routen gibt es?`}; },
  ()=>{ const n=R(5,10); return {n,t:`${n} Bands spielen nacheinander auf einem Festival. Wie viele Programm-Reihenfolgen gibt es?`}; }
 ],
 p:[
  ()=>{ const n=R(6,15); return {n,k:3,t:`${n} Läuferinnen starten. Wie viele Möglichkeiten gibt es für Gold, Silber und Bronze?`}; },
  ()=>{ const n=R(15,30); return {n,k:3,t:`Eine Klasse mit ${n} Personen wählt Klassensprecher/in, Stellvertretung und Kassenwart (jede Person höchstens ein Amt). Wie viele Möglichkeiten gibt es?`}; },
  ()=>{ const k=R(3,5); return {n:10,k,t:`Ein Code besteht aus ${k} <b>verschiedenen</b> Ziffern von 0 bis 9. Wie viele Codes gibt es?`}; },
  ()=>{ const n=R(8,20); return {n,k:2,t:`Ein Verein mit ${n} Mitgliedern wählt eine Vorsitzende und eine Stellvertretung. Wie viele Möglichkeiten gibt es?`}; },
  ()=>{ const n=R(8,14); return {n,k:3,t:`${n} Pferde laufen. Bei der Dreierwette tippt man die ersten drei in der richtigen Reihenfolge. Wie viele Tipps gibt es?`}; }
 ],
 c:[
  ()=>{ const n=R(8,20), k=R(2,5); return {n,k,t:`Aus ${n} Personen wird ein Team aus ${k} Personen gebildet. Wie viele Teams gibt es?`}; },
  ()=>{ const n=R(6,12); return {n,k:2,t:`${n} Personen stoßen an. Jede stößt mit jeder anderen genau einmal an. Wie oft klingen die Gläser?`}; },
  ()=>{ const n=R(8,15), k=R(2,4); return {n,k,t:`Eine Pizzeria bietet ${n} Beläge an. Sie wählen ${k} verschiedene Beläge. Wie viele Pizzen sind möglich?`}; },
  ()=>{ const n=pickR([45,49,50]), k=pickR([5,6]); return {n,k,t:`Beim Lotto „${k} aus ${n}“ kreuzt man ${k} Zahlen an. Wie viele Tipps gibt es?`}; },
  ()=>{ const n=R(10,20), k=R(3,4); return {n,k,t:`Aus ${n} Bewerbungen werden ${k} Personen zum Gespräch eingeladen. Wie viele Möglichkeiten gibt es?`}; }
 ]
};

// ---------- Aufgaben ----------
function genF(){ const a=R(3,8), b=R(9,12), s=pickR(SACH.f)();
  return [{q:`<span class="term">${a}! =</span>`,m:'f',n:a},{q:`<span class="term">${b}! =</span>`,m:'f',n:b},{q:s.t,m:'f',n:s.n,sach:1}]; }
function genP(){ const n1=R(5,9), k1=R(2,3), n2=R(10,15), k2=R(3,5), s=pickR(SACH.p)();
  return [{q:`<span class="term">nPr(${n1},&thinsp;${k1}) =</span>`,m:'p',n:n1,k:k1},{q:`<span class="term">nPr(${n2},&thinsp;${k2}) =</span>`,m:'p',n:n2,k:k2},{q:s.t,m:'p',n:s.n,k:s.k,sach:1}]; }
function genC(){ const n1=R(6,10), k1=R(2,4), n2=R(12,25), k2=R(3,6), s=pickR(SACH.c)();
  return [{q:`<span class="term">nCr(${n1},&thinsp;${k1}) =</span>`,m:'c',n:n1,k:k1},{q:`<span class="term">nCr(${n2},&thinsp;${k2}) =</span>`,m:'c',n:n2,k:k2},{q:s.t,m:'c',n:s.n,k:s.k,sach:1}]; }
function genM(){ const ms=shuffle(['f','p','c',pickR(['p','c'])]);
  return ms.map(m=>{ const s=pickR(SACH[m])(); return {q:s.t,m,n:s.n,k:s.k,sach:1,wahl:1}; }); }
const MODES={
 f:{name:"Fakultät n!",gen:genF,auftrag:"Berechnen Sie mit dem CAS.",tipp:"<b>Tipp:</b> Zahl eintippen, dann <b>menu ▸ 5: Wahrscheinlichkeit ▸ 1: Fakultät (!)</b>, dann <b>enter</b>."},
 p:{name:"Variation nPr",gen:genP,auftrag:"Berechnen Sie mit dem CAS. Bei der Sachaufgabe: Reihenfolge ist wichtig.",tipp:"<b>Tipp:</b> <b>menu ▸ 5 ▸ 2: Permutationen</b> oder <span class=\"cmd\">npr(</span> tippen. Erst <i>n</i> (zur Auswahl), dann Komma, dann <i>r</i> (ausgewählt)."},
 c:{name:"Binomialkoeffizient nCr",gen:genC,auftrag:"Berechnen Sie mit dem CAS. Bei der Sachaufgabe: Reihenfolge ist egal.",tipp:"<b>Tipp:</b> <b>menu ▸ 5 ▸ 3: Kombinationen</b> oder <span class=\"cmd\">ncr(</span> tippen. Erst <i>n</i>, dann Komma, dann <i>r</i>."},
 m:{name:"Welches Modell?",gen:genM,auftrag:"Wählen Sie bei jeder Aufgabe das passende Modell. Rechnen Sie dann mit dem CAS und tragen Sie die Anzahl ein.",tipp:"<b>Tipp:</b> Alle anordnen → <b>n!</b> · nur <i>r</i> auswählen, Reihenfolge wichtig → <b>nPr</b> · Reihenfolge egal → <b>nCr</b>"}
};
const ORDER=["f","p","c","m"];
let mode=ORDER[0], A=null, stat={a:0,r:0};
const $=id=>document.getElementById(id);

function neu(){
  A=MODES[mode].gen();
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  $('h').textContent="Aufgabe: "+MODES[mode].name;
  $('auftrag').innerHTML=MODES[mode].auftrag;
  $('tipp').innerHTML=MODES[mode].tipp;
  $('felder').innerHTML=A.map((F,i)=>`<div class="f" id="f${i}"><div class="q"><span class="bz">${'abcd'[i]})</span>${F.sach?F.q:''}</div><div class="row">`+
    (F.sach?'':F.q)+
    (F.wahl?`<span class="lbl">Modell:</span><span class="mods" id="w${i}">${['f','p','c'].map(m=>`<button type="button" data-m="${m}">${M[m]}</button>`).join('')}</span>`:'')+
    `${F.sach?'<span class="lbl">Anzahl:</span>':''}<input class="zahl" id="i${i}" inputmode="numeric" autocomplete="off" placeholder="Zahl"><span class="m"></span></div><div class="msg"></div></div>`).join('');
  document.querySelectorAll('.mods').forEach(g=>g.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); g.dataset.sel=b.dataset.m; });
  document.querySelectorAll('input.zahl').forEach(x=>x.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
  $('score').textContent='';
}
function parse(s){ s=s.trim().replace(/[\s.]/g,''); if(!/^\d+$/.test(s)) return null; return BigInt(s); }
function pruefen(){
  let ok=0;
  A.forEach((F,i)=>{
    const f=$('f'+i), m=f.querySelector('.m'), msg=f.querySelector('.msg'), inp=$('i'+i), raw=inp.value;
    f.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent=''; inp.classList.remove('bad');
    const g=f.querySelector('.mods'); if(g) g.querySelectorAll('button').forEach(b=>b.classList.remove('rt','fl'));
    const soll=valOf(F.m,F.n,F.k), wahl=g?g.dataset.sel:null;
    if(!raw.trim()&&!wahl) return;
    let st='ok', t='';
    if(F.wahl&&!wahl){ st='fmt'; t='Wählen Sie zuerst ein Modell.'; }
    else if(F.wahl&&wahl!==F.m){ st='no'; t=F.m==='f'?'Falsches Modell: Hier werden alle angeordnet.':F.m==='p'?'Falsches Modell: Tauschen Sie zwei Ausgewählte – ändert sich etwas? Dann ist die Reihenfolge wichtig.':'Falsches Modell: Tauschen Sie zwei Ausgewählte – es bleibt dasselbe. Die Reihenfolge ist egal.'; g.querySelector(`[data-m="${wahl}"]`).classList.add('fl'); }
    else if(!raw.trim()){ st='fmt'; t='Tragen Sie die Anzahl ein.'; }
    else { const v=parse(raw);
      if(v===null){ st='fmt'; t='Bitte nur ganze Zahlen eintragen.'; inp.classList.add('bad'); }
      else if(v!==soll){ st='no'; inp.classList.add('bad');
        const alt=F.k!==undefined&&(F.m==='p'?v===nCr(F.n,F.k):v===nPr(F.n,F.k));
        t= alt ? (F.m==='p'?'Das ist nCr – hier ist die Reihenfolge aber wichtig.':'Das ist nPr – hier ist die Reihenfolge aber egal.') : F.k!==undefined ? 'Das stimmt noch nicht. Haben Sie n und r richtig eingegeben (erst n, dann r)?' : 'Das stimmt noch nicht. Haben Sie die richtige Zahl vor das ! geschrieben?'; }
      if(g&&st==='ok') g.querySelector(`[data-m="${wahl}"]`).classList.add('rt'); }
    f.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
  });
  const tot=A.length; stat.a++; if(ok===tot) stat.r++;
  $('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  $('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.forEach((F,i)=>{
    const f=$('f'+i), msg=f.querySelector('.msg');
    if(f.classList.contains('ok')) return;
    f.classList.remove('no','fmt'); f.classList.add('show');
    msg.innerHTML=`Lösung: ${F.wahl?'Modell <b>'+M[F.m]+'</b> · ':''}<span class="cmd">${cmdOf(F.m,F.n,F.k)}</span> = <b>${tsd(valOf(F.m,F.n,F.k))}</b>`;
  });
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>
</body></html>
