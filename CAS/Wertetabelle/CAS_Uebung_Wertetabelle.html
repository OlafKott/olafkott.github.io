<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Wertetabelle und Graph</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.dt{ overflow-x:auto; }
table.d{ border-collapse:collapse; font-size:16px; margin:2px 0 4px; }
table.d th, table.d td{ border:1px solid #c3c8d0; padding:4px 10px; text-align:center; min-width:40px; }
table.d th{ background:#eef0f3; font-family:Cambria,Georgia,serif; font-style:italic; }
.spalten{ font-size:13.5px; color:var(--mute); margin-top:6px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
.f label{ font-size:15px; }
.f label .z{ color:var(--mute); font-family:Cambria,Georgia,serif; font-size:14px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }

.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.plot .cv{ fill:none; stroke:#1d1d1f; stroke-width:2.2; } .plot .ar{ stroke-width:2; stroke-dasharray:6 4; fill:none; }
.plot .ml{ font:bold 13px system-ui,Arial,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ border-left:5px solid #ccc; }
.f .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.f.gl{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.f.gl > label:first-child{ min-width:150px; font-family:Cambria,Georgia,serif; font-size:16px; }
.f.gl .xin{ display:inline-flex; align-items:center; gap:6px; }
.f.gl .xin .z{ font-family:Cambria,Georgia,serif; font-size:15px; }
.f.gl .kl{ font-size:14.5px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.f.gl .kl input{ width:18px; height:18px; }
.f.gl .m{ margin-left:auto; }
.f.gl .msg{ flex-basis:100%; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.liste{ font-weight:normal; }

.einst{ display:flex; gap:10px; flex-wrap:wrap; margin:2px 0 10px; }
.einst span{ background:#eef3fb; border:1px solid #c9d3e6; border-radius:999px; padding:3px 12px; font-size:14.5px; }
.einst b{ color:var(--lf); }
table.e{ border-collapse:collapse; font-size:16px; }
table.e th, table.e td{ border:1px solid #c3c8d0; padding:4px 6px; text-align:center; }
table.e th{ background:#eef0f3; font-family:Cambria,Georgia,serif; min-width:56px; }
table.e td.xv{ background:#eef0f3; font-weight:bold; font-family:Cambria,Georgia,serif; }
table.e td input{ font:inherit; font-size:15px; width:68px; padding:4px 5px; border:1px solid #b8bdc6; border-radius:5px; background:#f7f8fa; text-align:right; }
table.e td.ok input{ background:var(--okbg); border-color:var(--ok); } table.e td.no input{ background:var(--nobg); border-color:var(--no); } table.e td.fmt input{ background:var(--warnbg); border-color:#F2B705; }
table.e td .sl{ display:block; font-size:12.5px; color:var(--mute); }
.zr{ font-family:Cambria,Georgia,serif; font-size:16px; margin:12px 0 4px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.zr input{ font:inherit; width:80px; padding:4px 6px; border:1px solid #b8bdc6; border-radius:5px; background:#f7f8fa; text-align:right; }
.zr.ok input{ background:var(--okbg); border-color:var(--ok); } .zr.no input{ background:var(--nobg); border-color:var(--no); } .zr.fmt input{ background:var(--warnbg); border-color:#F2B705; }
.zr .m{ font-weight:bold; font-size:18px; margin-left:6px; } .zr.ok .m{ color:var(--ok); } .zr.no .m{ color:var(--no); } .zr.fmt .m{ color:var(--warn); }
.zr .msg{ flex-basis:100%; font-size:13.5px; color:var(--mute); } .zr.no .msg{ color:var(--no); } .zr.fmt .msg{ color:var(--warn); }
#felder{ display:block !important; }
.tmsg{ font-size:13.5px; min-height:20px; margin-top:6px; color:var(--mute); }

/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const cl=v=>Math.round(v*1e9)/1e9;
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const deN=v=>{ let t=cl(v).toString(); return t.replace('-','−').replace('.',','); };
const de2=v=>{ const x=r2(v); return (Number.isInteger(x)?String(x):x.toFixed(2).replace(/0$/,'')).replace('-','−').replace('.',','); };
// Term als HTML und als CAS-Eingabe; co = Koeffizienten [a_n … a_0]
function termHTML(n,co){
  const g=co.length-1; let h=`<i>${n}</i>(<i>x</i>) = `, first=true;
  co.forEach((c,i)=>{ if(!c) return; const p=g-i, m=Math.abs(c);
    h+= first ? (c<0?'−':'') : (c<0?' − ':' + ');
    h+= (m===1&&p>0?'':deN(m)) + (p>0?'<i>x</i>':'') + (p>1?'<sup>'+p+'</sup>':''); first=false; });
  return h;
}
function casTerm(co){
  const g=co.length-1; let t='', first=true;
  co.forEach((c,i)=>{ if(!c) return; const p=g-i, m=Math.abs(c);
    t+= first ? (c<0?'−':'') : (c<0?'−':'+');
    t+= (m===1&&p>0?'':String(m)) + (p>0?'x':'') + (p>1?(p===2?'²':'^'+p):''); first=false; });
  return t;
}
const ev=(co,x)=>co.reduce((s,c)=>s*x+c,0);

// ---------- Aufgaben ----------
function genTab(){
  let co, f, xs, start, step;
  do{
    if(Math.random()<0.5) co=[pick([-1.5,-1,-0.5,0.5,1,1.5,2]),R(-6,6)/2,R(-8,8)/2];
    else co=[pick([-0.5,-0.25,0.25,0.5]),R(-4,4)/2,R(-4,4),R(-6,6)/2];
    step=pick([1,1,0.5,0.5,0.25,2]); start=cl(R(-8,2)*Math.min(step,0.5));
    xs=Array.from({length:6},(_,i)=>cl(start+i*step));
    f=x=>ev(co,x);
  }while(xs.some(x=>Math.abs(f(x))>60) || co[0]===0);
  return {typ:'tab', h:"Wertetabelle ausfüllen", co, f, xs, start, step,
    auftrag:"Geben Sie die Funktion in Graphs ein, blenden Sie die Tabelle mit <b>ctrl + T</b> ein und stellen Sie Tabellenanfang und Tabellenschritt ein. Übertragen Sie die Werte.",
    hinweis:'Tipp: In Graphs tippen Sie hinter <span class="liste">f1(x)=</span> nur <span class="liste">'+casTerm(co)+'</span>. Einstellungen: <b>menu ▸ 2: Wertetabelle ▸ 5: Funktionseinstellungen bearbeiten</b>.'};
}
const MODES={tab:{name:"Wertetabelle ausfüllen",gen:genTab}};
const ORDER=["tab"];
let mode=ORDER[0], A=null, stat={a:0,r:0};
const $=id=>document.getElementById(id);
const inp=(id,ph)=>`<input id="${id}" inputmode="decimal" autocomplete="off" placeholder="${ph}">`;
function neu(){
  A=MODES[mode].gen();
  $('tabs').innerHTML=ORDER.length<2?'':ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  $('h').textContent="Aufgabe: "+A.h;
  $('auftrag').innerHTML=A.auftrag;
  $('term').innerHTML=termHTML('f',A.co);
  $('einst').innerHTML=`<span>Tabellenanfang: <b>${deN(A.start)}</b></span><span>Tabellenschritt: <b>${deN(A.step)}</b></span>`;
  $('hinweis').innerHTML=A.hinweis;
  if(A.typ==='tab'){
    $('round').innerHTML='<b>Wichtig:</b> Runden Sie auf <b>2 Stellen nach dem Komma</b>, z.&nbsp;B. <b>3,68</b>. Ganze Zahlen dürfen Sie ohne Komma eintragen.';
    $('felder').innerHTML='<div class="dt"><table class="e"><tr><th><i>x</i></th>'+A.xs.map(x=>`<td class="xv">${deN(x)}</td>`).join('')+'</tr><tr><th><i>f</i>(<i>x</i>)</th>'+A.xs.map((x,i)=>`<td id="c${i}">${inp('i'+i,'')}</td>`).join('')+'</tr></table></div><div class="tmsg" id="tmsg"></div>';
  }
  $('score').textContent='';
  document.querySelectorAll('#felder input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function check1(raw,soll){
  if(!raw.trim()) return 'leer';
  const p=parse(raw); if(!p) return 'fmt';
  if(near(p.v,soll)) return p.dec>2?'many':'ok';
  return 'no';
}
function pruefen(){
  let ok=0, tot;
  if(A.typ==='tab'){
    tot=A.xs.length; let t='';
    A.xs.forEach((x,i)=>{
      const c=$('c'+i); c.classList.remove('ok','no','fmt'); let st=check1($('i'+i).value,A.f(x));
      if(st==='leer') return; if(st==='many'){ st='fmt'; t='Mindestens ein Wert stimmt, ist aber nicht auf 2 Nachkommastellen gerundet.'; }
      if(st==='fmt'&&!t) t='Bitte nur Zahlen eintragen, z. B. −3,25.';
      if(st==='no'&&!t) t='Rot = falsch. Prüfen Sie Term, Tabellenanfang und Tabellenschritt.';
      c.classList.add(st); if(st==='ok') ok++;
    });
    $('tmsg').textContent=t;
  }
  stat.a++; if(ok===tot) stat.r++;
  $('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  $('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  if(A.typ==='tab'){
    A.xs.forEach((x,i)=>{ const c=$('c'+i); if(c.classList.contains('ok')) return; const s=c.querySelector('.sl'); if(s) s.textContent=de2(A.f(x)); else c.insertAdjacentHTML('beforeend','<span class="sl">'+de2(A.f(x))+'</span>'); });
  }
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>

</body></html>
