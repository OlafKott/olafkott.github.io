<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Führerschein · TI-Nspire CX CAS</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32;
       --gs:#1F4E99; --gs2:#2a62c2; --gsbg:#EEF2FA; }
*{ box-sizing:border-box; }
html{ background:var(--bg); }
body{ margin:0; min-height:100vh; background:radial-gradient(circle at 30% 0,#ffffff,var(--bg) 60%); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; overflow-x:hidden; }
button{ font-family:inherit; }

/* ================= Anleitungen (je Thema gekapselt über data-g) ================= */
/* --- grund --- */
[data-g="grund"]{--lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32;}
[data-g="grund"] *, [data-g="grund"]{box-sizing:border-box;}
[data-g="grund"] .tabs{max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap;}
[data-g="grund"] .tabs button{font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer;}
[data-g="grund"] .tabs button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
[data-g="grund"] .tabs button.fertig::after{content:" ✓"; color:var(--ab); font-weight:bold;}
[data-g="grund"] .tabs button.on.fertig::after{color:#9fe0a5;}
[data-g="grund"] .calc{width:330px; flex:0 0 330px; background:#E8562A; border-radius:30px; padding:0 13px; box-shadow:0 6px 22px rgba(0,0,0,.18);}
[data-g="grund"] .body{background:#2b2b2f; border-radius:22px; padding:12px 12px 16px;}
[data-g="grund"] .face{background:#151518; border-radius:14px; padding:8px 10px 10px; margin:-4px -4px 10px;}
[data-g="grund"] .brand{text-align:center; font:bold 12px Arial,sans-serif; color:#E8562A; letter-spacing:.5px; margin-bottom:6px;}
[data-g="grund"] .brand b{color:#fff; margin-left:6px;}
[data-g="grund"] .scrwrap{background:#000; border-radius:4px; padding:4px;}
[data-g="grund"] .scr{width:280px; height:210px; background:#fff; position:relative; overflow:hidden; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#000; margin:0 auto;}
[data-g="grund"] .nav{display:grid; grid-template-columns:52px 1fr 52px; gap:6px; margin-top:10px; align-items:center;}
[data-g="grund"] .nav .col{display:flex; flex-direction:column; gap:7px;}
[data-g="grund"] .pad{width:112px; height:84px; margin:0 auto; background:#3a3a3f; border-radius:20px; position:relative;}
[data-g="grund"] .pad .k{position:absolute; background:transparent; color:#aaa; font-size:10px; border:0;}
[data-g="grund"] .pad .k[data-k=up]{left:38px; top:2px; width:36px; height:20px;}
[data-g="grund"] .pad .k[data-k=down]{left:38px; bottom:2px; width:36px; height:20px;}
[data-g="grund"] .pad .k[data-k=left]{left:2px; top:28px; width:22px; height:28px;}
[data-g="grund"] .pad .k[data-k=right]{right:2px; top:28px; width:22px; height:28px;}
[data-g="grund"] .pad .k[data-k=click]{left:38px; top:24px; width:36px; height:36px; background:#4b4b52; border-radius:9px; color:#ddd;}
[data-g="grund"] .k{font:600 11px Arial,sans-serif; color:#fff; background:#4a4a50; border:0; border-radius:6px; height:24px; padding:0; cursor:pointer; transition:transform .15s, box-shadow .15s;}
[data-g="grund"] .k:focus{outline:none;}
[data-g="grund"] .k:active{transform:scale(.95);}
[data-g="grund"] .k.lt{background:#8e8e95; color:#111; font-size:14px;}
[data-g="grund"] .k.ctrl{background:#D93A2B;}
[data-g="grund"] .k.bk{background:#26262a; border:1px solid #555;}
[data-g="grund"] .k.hit{box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.12); z-index:2; position:relative;}
[data-g="grund"] .pad .k.hit{position:absolute;}
[data-g="grund"] .k.good{box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8);}
[data-g="grund"] .k.bad{box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack_grund .35s;}
[data-g="grund"] .k.held{box-shadow:0 0 0 3px #fff, 0 0 10px 2px rgba(255,255,255,.7);}
@keyframes wack_grund{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
[data-g="grund"] .row4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0;}
[data-g="grund"] .main7{display:grid; grid-template-columns:repeat(7,1fr); gap:6px 5px;}
[data-g="grund"] .let9{display:grid; grid-template-columns:repeat(9,1fr); gap:5px 4px; margin-top:10px;}
[data-g="grund"] .let9 .k{height:20px; font-size:10px;}
[data-g="grund"] .span2{grid-column:span 2;}
[data-g="grund"] .span3{grid-column:span 3;}
[data-g="grund"] .k sub{font-size:7px; color:#ff9c8f; display:block; line-height:1; margin-top:-1px;}
[data-g="grund"] .tb{height:16px; background:#d9dee5; display:flex; align-items:center; gap:3px; padding:0 4px; font-size:9.5px; color:#333; border-bottom:1px solid #aab3bf;}
[data-g="grund"] .tb .tab{background:#fff; border:1px solid #aab3bf; border-bottom:0; padding:0 5px; border-radius:3px 3px 0 0; height:13px; line-height:12px; margin-top:3px; white-space:nowrap;}
[data-g="grund"] .tb .tab.off{background:#eef1f5; color:#777;}
[data-g="grund"] .tb .tab.np{background:#fff4c9; border-color:#d1b24a; font-weight:bold;}
[data-g="grund"] .scr.tabhl .tb .tab.pg{background:#F2B705; color:#111; font-weight:bold; border-color:#b88a00; box-shadow:0 0 6px 1px rgba(242,183,5,.8); animation:pulse_grund 1.2s ease-in-out infinite;}
[data-g="grund"] .scr.tabhl .tb .tab.pg.off{background:#FFE9A8; color:#5a4500;}
[data-g="grund"] .tb .docn{font-weight:bold; margin-right:3px;}
[data-g="grund"] .tb .sp{flex:1;}
[data-g="grund"] .tb .bat{width:16px; height:7px; border:1px solid #555; border-radius:1px; position:relative;}
[data-g="grund"] .tb .bat:after{content:""; position:absolute; left:1px; top:1px; bottom:1px; width:10px; background:#3a3;}
[data-g="grund"] .calcapp{padding:2px 6px; font-size:11.5px; position:absolute; left:0; right:0; top:16px; bottom:0; display:flex; flex-direction:column; justify-content:flex-end;}
[data-g="grund"] .calcapp .ln{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:2px 0; min-height:19px;}
[data-g="grund"] .calcapp .ln span, [data-g="grund"] .calcapp .ln b{padding:0 2px; border-radius:2px;}
[data-g="grund"] .calcapp .ln .sel{background:#3b78c2; color:#fff;}
[data-g="grund"] .calcapp .ln b{font-weight:normal;}
[data-g="grund"] .calcapp .cur{border:1px solid #888; min-height:20px; margin:3px 0 2px; padding:1px 3px; display:flex; align-items:center;}
[data-g="grund"] .fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 1px; font-size:10px; line-height:1.1;}
[data-g="grund"] .fr > span{padding:0 2px; min-width:7px;}
[data-g="grund"] .fr > span:first-child{border-bottom:1px solid currentColor;}
[data-g="grund"] .fr > span:empty::after, [data-g="grund"] .rad:empty::after, [data-g="grund"] sup:empty::after{content:"\25A1"; color:#999;}
[data-g="grund"] .rt{white-space:nowrap;}
[data-g="grund"] .rad{border-top:1px solid currentColor; padding:0 1px;}
[data-g="grund"] .calcapp sup{font-size:8px;}
[data-g="grund"] .caret{animation:blink_grund 1s steps(1) infinite; font-weight:normal;}
@keyframes blink_grund{ 50%{opacity:0} }
[data-g="grund"] .menu{position:absolute; background:#fff; border:1px solid #6b7a8c; box-shadow:2px 2px 6px rgba(0,0,0,.3); width:178px; font-size:10.5px; z-index:3;}
[data-g="grund"] .menu div{padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
[data-g="grund"] .menu div.sel{background:#3b78c2; color:#fff;}
[data-g="grund"] .dlg{position:absolute; left:8px; right:8px; top:22px; background:#f4f6f9; border:1px solid #6b7a8c; box-shadow:2px 2px 8px rgba(0,0,0,.35); font-size:10.5px; z-index:4;}
[data-g="grund"] .dlg .tt{background:#c9d3df; font-weight:bold; padding:2px 6px;}
[data-g="grund"] .dlg .ff{display:grid; grid-template-columns:112px 1fr; gap:3px 5px; padding:5px 7px 3px; align-items:center;}
[data-g="grund"] .dlg .lb{text-align:right;}
[data-g="grund"] .dlg .ct{background:#fff; border:1px solid #9aa5b3; height:14px; padding:0 4px; display:flex; justify-content:space-between; align-items:center; font-size:10px;}
[data-g="grund"] .dlg .ct.fo{outline:2px solid #3b78c2;}
[data-g="grund"] .dlg .ct.mark{background:#FFF3C4;}
[data-g="grund"] .dlg .bt{display:flex; justify-content:flex-end; gap:5px; padding:3px 7px 6px; font-size:10px;}
[data-g="grund"] .dlg .bt span{border:1px solid #8a95a3; background:#fff; padding:0 7px; border-radius:3px;}
[data-g="grund"] .hs{position:absolute; inset:0; background:linear-gradient(#2a2f36,#14171b 70%); color:#f2f4f7; font-family:Arial,Helvetica,sans-serif;}

[data-g="grund"] .hs .hb .bt2{width:15px; height:7px; border:1px solid #cfd3d8; border-radius:1px; position:relative;}
[data-g="grund"] .hs .hb .bt2:after{content:""; position:absolute; left:1px; top:1px; bottom:1px; width:9px; background:#6ccf5a;}
[data-g="grund"] .hs .cols{display:flex; gap:10px; padding:7px 10px 0;}
[data-g="grund"] .hs .col{flex:1;}
[data-g="grund"] .hs h5{margin:0 0 3px; font-size:11.5px; font-weight:bold; color:#8fc3ff; display:flex; align-items:center; gap:5px;}
[data-g="grund"] .hs h5 i{display:inline-block; width:10px; height:11px; background:#8fc3ff; border-radius:1px; transform:skewX(-8deg);}
[data-g="grund"] .hs .it{display:flex; align-items:center; gap:5px; font-size:11px; padding:1px 3px; border-radius:2px; height:16px; white-space:nowrap;}
[data-g="grund"] .hs .it b{display:inline-block; min-width:11px; height:11px; line-height:11px; text-align:center; font-size:8.5px; background:#c9ced6; color:#1b1e22; border-radius:2px;}
[data-g="grund"] .hs .it.dim{color:#6f757d;}
[data-g="grund"] .hs .it.dim b{background:#555a61; color:#2a2d31;}
[data-g="grund"] .hs .it.sel{background:#3b78c2; color:#fff;}
[data-g="grund"] .hs .it.ziel{background:#F2B705; color:#111; font-weight:bold; box-shadow:0 0 7px 2px rgba(242,183,5,.75); animation:pulse_grund 1.2s ease-in-out infinite;}
[data-g="grund"] .hs .it.ziel b{background:#111; color:#F2B705;}
[data-g="grund"] .menu div.ziel{background:#F2B705 !important; color:#111 !important; font-weight:bold; animation:pulse_grund 1.2s ease-in-out infinite;}
@keyframes pulse_grund{ 50%{ box-shadow:0 0 2px 0 rgba(242,183,5,.3); } }
[data-g="grund"] .hs .icons{position:absolute; left:6px; right:6px; bottom:21px; display:flex; justify-content:space-between;}
[data-g="grund"] .hs .icons span{width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
[data-g="grund"] .hs .icons span.on{outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 8px 2px rgba(255,255,255,.6);}
[data-g="grund"] .hs .icons svg{width:20px; height:20px;}
[data-g="grund"] .hs .ft{position:absolute; left:0; right:0; bottom:3px; font-size:9.5px; text-align:center; font-weight:bold; white-space:nowrap; overflow:hidden;}
[data-g="grund"] table.sh{border-collapse:collapse; table-layout:fixed; width:280px;}
[data-g="grund"] table.sh td{border:1px solid #c9ced6; height:15px; padding:0 3px; font-size:10.5px;}
[data-g="grund"] table.sh td.rn{width:16px; background:#eef1f5; color:#666; text-align:center; padding:0; font-size:9px;}
[data-g="grund"] table.sh tr.hd td{height:18px; background:#eef1f5; font-weight:bold;}
[data-g="grund"] table.sh td.cur{outline:2px solid #000; outline-offset:-2px;}
[data-g="grund"] .files{padding:4px 8px; font-size:11px;}
[data-g="grund"] .files .hd{font-weight:bold; border-bottom:1px solid #ccc; padding:2px 2px; display:flex; justify-content:space-between;}
[data-g="grund"] .files .it{padding:2px 4px; display:flex; justify-content:space-between;}
[data-g="grund"] .files .it.sel{background:#3b78c2; color:#fff;}
[data-g="grund"] .pwroff{position:absolute; inset:0; background:#20242a; color:#9aa3ad; display:flex; align-items:center; justify-content:center; font-size:12px;}
[data-g="grund"] .panel{flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
[data-g="grund"] .prog{display:flex; gap:4px; margin-bottom:12px;}

[data-g="wreg"] *, [data-g="wreg"]{box-sizing:border-box;}
[data-g="wreg"] .tabs{max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap;}
[data-g="wreg"] .tabs button{font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer;}
[data-g="wreg"] .tabs button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
[data-g="wreg"] .calc{width:330px; flex:0 0 330px; background:#E8562A; border-radius:30px; padding:0 13px; box-shadow:0 6px 22px rgba(0,0,0,.18);}
[data-g="wreg"] .body{background:#2b2b2f; border-radius:22px; padding:12px 12px 16px;}
[data-g="wreg"] .face{background:#151518; border-radius:14px; padding:8px 10px 10px; margin:-4px -4px 10px;}
[data-g="wreg"] .brand{text-align:center; font:bold 12px Arial,sans-serif; color:#E8562A; letter-spacing:.5px; margin-bottom:6px;}
[data-g="wreg"] .brand b{color:#fff; margin-left:6px;}
[data-g="wreg"] .scrwrap{background:#000; border-radius:4px; padding:4px;}
[data-g="wreg"] .scr{width:280px; height:210px; background:#fff; position:relative; overflow:hidden; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#000; margin:0 auto;}
[data-g="wreg"] .nav{display:grid; grid-template-columns:52px 1fr 52px; gap:6px; margin-top:10px; align-items:center;}
[data-g="wreg"] .nav .col{display:flex; flex-direction:column; gap:7px;}
[data-g="wreg"] .pad{width:112px; height:84px; margin:0 auto; background:#3a3a3f; border-radius:20px; position:relative;}
[data-g="wreg"] .pad .k{position:absolute; background:transparent; color:#aaa; font-size:10px; border:0;}
[data-g="wreg"] .pad .k[data-k=up]{left:38px; top:2px; width:36px; height:20px;}
[data-g="wreg"] .pad .k[data-k=down]{left:38px; bottom:2px; width:36px; height:20px;}
[data-g="wreg"] .pad .k[data-k=left]{left:2px; top:28px; width:22px; height:28px;}
[data-g="wreg"] .pad .k[data-k=right]{right:2px; top:28px; width:22px; height:28px;}
[data-g="wreg"] .pad .k[data-k=click]{left:38px; top:24px; width:36px; height:36px; background:#4b4b52; border-radius:9px; color:#ddd;}
[data-g="wreg"] .k{font:600 11px Arial,sans-serif; color:#fff; background:#4a4a50; border:0; border-radius:6px; height:24px; padding:0; cursor:default; transition:transform .15s, box-shadow .15s;}
[data-g="wreg"] .k.lt{background:#8e8e95; color:#111; font-size:14px;}
[data-g="wreg"] .k.ctrl{background:#D93A2B;}
[data-g="wreg"] .k.bk{background:#26262a; border:1px solid #555;}
[data-g="wreg"] .k.hit{box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.12); z-index:2; position:relative;}
[data-g="wreg"] .pad .k.hit{position:absolute;}
[data-g="wreg"] .row4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0;}
[data-g="wreg"] .main7{display:grid; grid-template-columns:repeat(7,1fr); gap:6px 5px;}
[data-g="wreg"] .main7 .gap{grid-column:span 1;}
[data-g="wreg"] .let9{display:grid; grid-template-columns:repeat(9,1fr); gap:5px 4px; margin-top:10px;}
[data-g="wreg"] .let9 .k{height:20px; font-size:10px;}
[data-g="wreg"] .span2{grid-column:span 2;}
[data-g="wreg"] .span3{grid-column:span 3;}
[data-g="wreg"] .tb{height:16px; background:#d9dee5; display:flex; align-items:center; gap:3px; padding:0 4px; font-size:9.5px; color:#333; border-bottom:1px solid #aab3bf;}
[data-g="wreg"] .tb .tab{background:#fff; border:1px solid #aab3bf; border-bottom:0; padding:0 5px; border-radius:3px 3px 0 0; height:13px; line-height:12px; margin-top:3px;}
[data-g="wreg"] .tb .tab.off{background:#eef1f5; color:#777;}
[data-g="wreg"] .tb .sp{flex:1;}
[data-g="wreg"] .tb .bat{width:16px; height:7px; border:1px solid #555; border-radius:1px; position:relative;}
[data-g="wreg"] .tb .bat:after{content:""; position:absolute; left:1px; top:1px; bottom:1px; width:10px; background:#3a3;}
[data-g="wreg"] table.sh{border-collapse:collapse; table-layout:fixed; width:280px;}
[data-g="wreg"] table.sh td{border:1px solid #c9ced6; height:15px; padding:0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10.5px;}
[data-g="wreg"] table.sh td.rn{width:16px; background:#eef1f5; color:#666; text-align:center; padding:0; font-size:9px;}
[data-g="wreg"] table.sh tr.hd td{height:18px; background:#eef1f5; font-weight:bold;}
[data-g="wreg"] table.sh tr.hd td span{color:#888; font-weight:normal; margin-right:4px;}
[data-g="wreg"] table.sh tr.fm td{background:#f7f8fa; color:#777; font-style:italic; font-size:9px; height:13px;}
[data-g="wreg"] table.sh td.num{text-align:right;}
[data-g="wreg"] table.sh td.cur{outline:2px solid #000; outline-offset:-2px;}
[data-g="wreg"] table.sh td.good{background:#FFF3C4;}
[data-g="wreg"] table.sh td.star{background:#FFE07A; font-weight:bold;}
[data-g="wreg"] table.sh td.dim{color:#aaa; text-decoration:line-through;}
[data-g="wreg"] .menu{position:absolute; background:#fff; border:1px solid #6b7a8c; box-shadow:2px 2px 6px rgba(0,0,0,.3); width:178px; font-size:10.5px;}
[data-g="wreg"] .menu div{padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
[data-g="wreg"] .menu div.sel{background:#3b78c2; color:#fff;}
[data-g="wreg"] .dlg{position:absolute; left:8px; right:8px; top:22px; background:#f4f6f9; border:1px solid #6b7a8c; box-shadow:2px 2px 8px rgba(0,0,0,.35); font-size:10.5px;}
[data-g="wreg"] .dlg .tt{background:#c9d3df; font-weight:bold; padding:2px 6px;}
[data-g="wreg"] .dlg .ff{display:grid; grid-template-columns:112px 1fr; gap:4px 5px; padding:6px 7px 4px; align-items:center;}
[data-g="wreg"] .dlg .lb{text-align:right;}
[data-g="wreg"] .dlg .ct{background:#fff; border:1px solid #9aa5b3; height:15px; padding:0 4px; display:flex; justify-content:space-between; align-items:center;}
[data-g="wreg"] .dlg .ct.fo{outline:2px solid #3b78c2;}
[data-g="wreg"] .dlg .ct.mark{background:#FFF3C4;}
[data-g="wreg"] .dlg .bt{display:flex; justify-content:flex-end; gap:6px; padding:3px 7px 6px;}
[data-g="wreg"] .dlg .bt span{border:1px solid #8a95a3; background:#fff; padding:0 10px; border-radius:3px;}
[data-g="wreg"] .dlg .bt span.fo{outline:2px solid #3b78c2;}
[data-g="wreg"] .drop{position:absolute; background:#fff; border:1px solid #6b7a8c; font-size:10.5px; width:80px; box-shadow:2px 2px 6px rgba(0,0,0,.3);}
[data-g="wreg"] .drop div{padding:0 5px;}
[data-g="wreg"] .drop div.sel{background:#3b78c2; color:#fff;}
[data-g="wreg"] .home{padding:6px 10px; font-size:11px;}
[data-g="wreg"] .home h4{margin:2px 0 3px; font-size:10px; color:#666; border-bottom:1px solid #ddd;}
[data-g="wreg"] .home .it{padding:1px 6px;}
[data-g="wreg"] .home .it.sel{background:#3b78c2; color:#fff;}
[data-g="wreg"] .calcapp{padding:4px 6px; font-size:11.5px;}
[data-g="wreg"] .calcapp .ln{display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:3px 0;}
[data-g="wreg"] .calcapp .cur{border:1px solid #888; height:16px; margin-top:4px;}
[data-g="wreg"] .panel{flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
[data-g="wreg"] .prog{display:flex; gap:4px; margin-bottom:12px;}
[data-g="wreg"] .prog i{flex:1; height:5px; border-radius:3px; background:#e3e6eb; cursor:pointer;}
[data-g="wreg"] .prog i.done{background:#9aa3b0;}
[data-g="wreg"] .prog i.now{background:var(--lf);}
[data-g="wreg"] .nr{font-size:13px; color:var(--mute);}
[data-g="wreg"] .panel h2{margin:2px 0 8px; font-size:20px; line-height:1.3;}
[data-g="wreg"] .panel p{margin:0 0 10px; font-size:15.5px;}
[data-g="wreg"] .keys{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px;}
[data-g="wreg"] .chip{font:600 13px Arial,sans-serif; background:#2b2b2f; color:#fff; border-radius:5px; padding:3px 9px; border:2px solid transparent;}
[data-g="wreg"] .chip.ctrl{background:#D93A2B;}
[data-g="wreg"] .chip.lt{background:#8e8e95; color:#111;}
[data-g="wreg"] .chip.hit{border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35);}
[data-g="wreg"] .chip.plus{background:none; color:var(--mute); padding:3px 2px;}
[data-g="wreg"] .note{background:#FFF8E8; border-left:4px solid var(--hit); border-radius:4px; padding:7px 12px; font-size:14.5px; margin:0 0 10px;}
[data-g="wreg"] .note b{color:#8a5a00;}
[data-g="wreg"] .btns{display:flex; gap:10px; margin-top:14px;}
[data-g="wreg"] .btns button{font:inherit; font-size:16px; padding:9px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff;}
[data-g="wreg"] .btns button.go{background:var(--lf); color:#fff; border-color:var(--lf); margin-left:auto;}
[data-g="wreg"] .btns button:disabled{opacity:.4; cursor:default;}
[data-g="wreg"] .hint{font-size:12.5px; color:var(--mute); margin-top:10px;}
@media (max-width:380px){[data-g="wreg"] .calc{transform:scale(.92); transform-origin:top center;}}
[data-g="wreg"] .k{cursor:pointer;}
[data-g="wreg"] .k:focus{outline:none;}
[data-g="wreg"] .k:active{transform:scale(.95);}
[data-g="wreg"] .k.good{box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8);}
[data-g="wreg"] .k.bad{box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack_wreg .35s;}
@keyframes wack_wreg{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
[data-g="wreg"] .chip.done{opacity:.35;}
[data-g="wreg"] .chip.now{border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35);}
[data-g="wreg"] .chip.big{font-size:16px; padding:4px 12px; vertical-align:middle;}
[data-g="wreg"] .stat{min-height:38px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; background:var(--bg); border-radius:8px; padding:6px 12px; margin:6px 0 12px;}
[data-g="wreg"] .stat .ok{color:#2E7D32; font-weight:bold;}
[data-g="wreg"] .stat .err{color:#C62828; font-weight:bold;}
[data-g="wreg"] .caret{animation:blink_wreg 1s steps(1) infinite; font-weight:normal;}
@keyframes blink_wreg{ 50%{opacity:0} }
[data-g="wreg"] .opt{font-size:13.5px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:10px;}
[data-g="wreg"] .btns button.go{background:var(--lf); color:#fff; border-color:var(--lf);}
[data-g="wreg"] #next{margin-left:auto;}
[data-g="wreg"] .task{border:1px solid var(--line); border-left:4px solid var(--lf); border-radius:8px; padding:9px 13px; margin:0 0 14px; font-size:14.5px; background:#fafbfc;}
[data-g="wreg"] .task b{color:var(--lf);}
[data-g="wreg"] table.tt{border-collapse:collapse; margin:7px 0 1px; font-size:14.5px;}
[data-g="wreg"] table.tt th, [data-g="wreg"] table.tt td{border:1px solid #c3c8d0; padding:2px 9px; text-align:center; min-width:30px; background:#fff;}
[data-g="wreg"] table.tt th{background:#eef0f3; font-style:italic; font-family:Cambria,Georgia,serif;}
[data-g="wreg"] .hs{position:absolute; inset:0; background:linear-gradient(#2a2f36,#14171b 70%); color:#f2f4f7; font-family:Arial,Helvetica,sans-serif;}
[data-g="wreg"] .hs .hb{height:15px; display:flex; align-items:center; justify-content:space-between; padding:0 6px; background:linear-gradient(#4a4f57,#2c3036); border-bottom:1px solid #555;}
[data-g="wreg"] .hs .hb .bt2{width:15px; height:7px; border:1px solid #cfd3d8; border-radius:1px; position:relative;}
[data-g="wreg"] .hs .hb .bt2:after{content:""; position:absolute; left:1px; top:1px; bottom:1px; width:9px; background:#6ccf5a;}
[data-g="wreg"] .hs .cols{display:flex; gap:10px; padding:7px 10px 0;}
[data-g="wreg"] .hs .col{flex:1;}
[data-g="wreg"] .hs h5{margin:0 0 3px; font-size:11.5px; font-weight:bold; color:#8fc3ff; display:flex; align-items:center; gap:5px;}
[data-g="wreg"] .hs h5 i{display:inline-block; width:10px; height:11px; background:#8fc3ff; border-radius:1px; transform:skewX(-8deg);}
[data-g="wreg"] .hs .it{display:flex; align-items:center; gap:5px; font-size:11px; padding:1px 3px; border-radius:2px; height:16px; white-space:nowrap;}
[data-g="wreg"] .hs .it b{display:inline-block; min-width:11px; height:11px; line-height:11px; text-align:center; font-size:8.5px; background:#c9ced6; color:#1b1e22; border-radius:2px;}
[data-g="wreg"] .hs .it.dim{color:#6f757d;}
[data-g="wreg"] .hs .it.dim b{background:#555a61; color:#2a2d31;}
[data-g="wreg"] .hs .it.sel{background:#3b78c2; color:#fff;}
[data-g="wreg"] .hs .it.ziel{background:#F2B705; color:#111; font-weight:bold; box-shadow:0 0 7px 2px rgba(242,183,5,.75); animation:pulse_wreg 1.2s ease-in-out infinite;}
[data-g="wreg"] .hs .it.ziel b{background:#111; color:#F2B705;}
[data-g="wreg"] .menu div.ziel{background:#F2B705 !important; color:#111 !important; font-weight:bold; animation:pulse_wreg 1.2s ease-in-out infinite;}
@keyframes pulse_wreg{ 50%{ box-shadow:0 0 2px 0 rgba(242,183,5,.3); } }
[data-g="wreg"] .hs .icons{position:absolute; left:6px; right:6px; bottom:21px; display:flex; justify-content:space-between;}
[data-g="wreg"] .hs .icons span{width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
[data-g="wreg"] .hs .icons span.on{outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 8px 2px rgba(255,255,255,.6);}
[data-g="wreg"] .hs .icons svg{width:20px; height:20px;}
[data-g="wreg"] .hs .ft{position:absolute; left:0; right:0; bottom:3px; font-size:9.5px; text-align:center; font-weight:bold; white-space:nowrap; overflow:hidden;}
[data-g="wreg"] .pwroff{position:absolute; inset:0; background:#20242a; color:#9aa3ad; display:flex; align-items:center; justify-content:center; font-size:12px;}
[data-g="wreg"]{--ab:#2E7D32;}
[data-g="wreg"] .menu div.ziel{background:#F2B705 !important; color:#111 !important; font-weight:bold; animation:pulse_wreg 1.2s ease-in-out infinite;}
@keyframes pulse_wreg{ 50%{ box-shadow:0 0 2px 0 rgba(242,183,5,.3); } }
[data-g="wreg"] .tabs button.fertig::after{content:" ✓"; color:var(--ab); font-weight:bold;}
[data-g="wreg"] .tabs button.on.fertig::after{color:#9fe0a5;}
[data-g="wreg"] .k.held{box-shadow:0 0 0 3px #fff, 0 0 10px 2px rgba(255,255,255,.7);}
[data-g="wreg"] .prog i.abp{background:#bfe3c3;}
[data-g="wreg"] .prog i.abp.done{background:#7cbf84;}
[data-g="wreg"] .prog i.abp.now{background:var(--ab);}
[data-g="wreg"] .ab{border:2px solid var(--ab); background:#F1F8F1; border-radius:10px; padding:10px 14px 6px; margin:0 0 12px;}
[data-g="wreg"] .ab .abt{font-weight:bold; color:var(--ab); font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
[data-g="wreg"] .ab .abt span{font-size:22px;}
[data-g="wreg"] .ab ul{margin:0 0 8px; padding-left:20px; font-size:15px;}
[data-g="wreg"] .ab li{margin-bottom:3px;}
[data-g="wreg"] .ab p{font-size:14.5px;}
[data-g="wreg"] .vgl{border-collapse:collapse; font-size:15px; margin:4px 0 12px; width:100%;}
[data-g="wreg"] .vgl th, [data-g="wreg"] .vgl td{border:1px solid #cfd4dc; padding:4px 10px; text-align:left;}
[data-g="wreg"] .vgl th{background:#eef0f3;}
[data-g="wreg"] .vgl tr.best td{background:#E8F5E9; font-weight:bold; color:#1B5E20;}
[data-g="wreg"] .menu div.mehr{color:#777; font-style:italic;}
[data-g="wreg"] table.sh tr.hd td.cl{color:#888;}
[data-g="wreg"] .tabs#tabs{margin-left:0 !important; margin-right:auto !important;}

[data-g="lgs"] .panel h2{margin:2px 0 8px; font-size:20px; line-height:1.3;}

[data-g="lgs"] .keys{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px;}

/* ================= Rahmen der Moodle-Seite ================= */
.bar{ position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.02); }
.bar::before{ content:""; display:block; height:4px; background:linear-gradient(90deg,var(--gs),#5b86cf); }

/* Ansichten + Übergänge */
.view[hidden]{ display:none !important; }
.view{ transition:opacity .34s ease, transform .42s cubic-bezier(.2,.7,.2,1); }
.view.from-r{ opacity:0; transform:translateX(42px); }
.view.from-l{ opacity:0; transform:translateX(-42px); }

   ic('linear-gradient(#d6f2df,#5fbf7c)','<rect x="2.5" y="3" width="15" height="14" fill="#fff"/><path d="M2.5 7.5h15M2.5 12h15M7.5 3v14M12.5 3v14" stroke="#4a9a62" stroke-width="1"/>'),

// ---------- Aufgaben ----------
function genF(){
  let a; do{ a=R(-15,15)/10; }while(Math.abs(a)<0.2);

}
function genFW(){

  while(!xs.some(x=>!Number.isInteger(x)) || !xs.some(x=>x<0) || xs.some((x,i)=>i>0&&x-xs[i-1]<1) || xs.some(x=>Math.abs(F.f(x))>14) || xs.includes(0));
  const marks=xs.map((x,i)=>({typ:'fw',i,x,y:F.f(x),col:COL[i],lab:'x = '+deN(x)}));
  return {typ:'fw', h:"Funktionswerte berechnen", F,
    auftrag:"Speichern Sie die Funktion im CAS und berechnen Sie die Funktionswerte an den markierten Stellen.",
    term:termHTML('f',F.a,F.b,F.c), plot:plot(F.f,'f',marks,-F.b/(2*F.a)),
    felder:xs.map((x,i)=>({k:'w'+i, lab:`<i>f</i>(${deN(x)})`, col:COL[i], soll:F.f(x)})),
    hinweis:'Tipp: Mit <b>ctrl + ⊞</b> schreiben Sie <b>:=</b>, also z.&nbsp;B. <span class="liste">f(x):='+casTerm(F.a,F.b,F.c)+'</span>. Danach nur noch <span class="liste">f(2.5)</span> eintippen.'};
}
function genGL(){
  let F,xv,yv;
  do{ F=genF(); xv=-F.b/(2*F.a); yv=F.f(xv); }while(Math.abs(xv)>6||Math.abs(yv)>9);
  const dir=F.a>0?1:-1, lv=[], used=new Set();
  const nNone=Math.random()<0.5?1:0;
  while(lv.length<3-nNone){
    const y=dir*R(1,12)/2+Math.round(yv*2)/2; const d=(y-yv)/F.a;
    if(d<=0.05||used.has(y)||Math.abs(y)>12) continue;
    const s=Math.sqrt(d), x1=xv-s, x2=xv+s; if(Math.abs(x1)>9||Math.abs(x2)>9||Math.abs(x1)<0.2||Math.abs(x2)<0.2) continue;
    used.add(y); lv.push({y,xs:[x1,x2]});
  }
  if(nNone){ let y; do{ y=Math.round(yv*2)/2-dir*R(1,6)/2; }while((y-yv)/F.a>=0||used.has(y)); lv.splice(R(0,lv.length),0,{y,xs:[]}); }
  const marks=lv.map((l,i)=>({typ:'gl',y:l.y,xs:l.xs,col:COL[i],lab:'f(x) = '+deN(l.y)}));
  return {typ:'gl', h:"Gleichungen lösen", F,

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }

function check1(raw,soll){ // -> 'ok' | 'no' | 'fmt' | 'leer' | 'many'

function pruefen(){

      if(st==='fmt') t='Bitte nur eine Zahl eintragen, z. B. 3,68.';
      if(st==='many'){ st='fmt'; t='Der Wert stimmt – bitte auf 2 Nachkommastellen runden.'; }
      if(st==='no'){ const x=parseFloat(F.lab.replace(/<[^>]+>/g,'').match(/\((.*)\)/)[1].replace('−','-').replace(',','.'));
        t = near(parse(root.getElementById('i_'+F.k).value)?.v ?? NaN, A.F.f(-x)) ? 'Das ist f(−x). Prüfen Sie das Vorzeichen: Taste (−).' : 'Das stimmt noch nicht. Ist f richtig gespeichert? Haben Sie die Kommazahl mit Punkt getippt?'; }
    } else {
      const cb=root.getElementById('c_'+F.k).checked, ra=root.getElementById('i_'+F.k+'a').value, rb=root.getElementById('i_'+F.k+'b').value;
      if(!cb && !ra.trim() && !rb.trim()) return;
      if(F.xs.length===0){ st = cb && !ra.trim() && !rb.trim() ? 'ok' : 'no'; if(st==='no') t = cb ? 'Bei keiner Lösung bleiben die Felder leer.' : 'Was zeigt das CAS an? Bei false gibt es keine Lösung.'; }
      else if(cb){ st='no'; t='Diese Gleichung hat Lösungen. Das CAS zeigt zwei x-Werte mit „or“.'; }
      else {
        const sa=check1(ra,F.xs[0]), sb=check1(rb,F.xs[1]);
        if(sa==='ok'&&sb==='ok') st='ok';
        else if(sa==='fmt'||sb==='fmt'){ st='fmt'; t='Bitte nur Zahlen eintragen, z. B. −1,24.'; }
        else if(sa==='many'||sb==='many'){ st= (sa==='no'||sb==='no')?'no':'fmt'; t='Bitte auf 2 Nachkommastellen runden.'; }
        else if(check1(ra,F.xs[1])==='ok'&&check1(rb,F.xs[0])==='ok'){ st='fmt'; t='Vertauscht: Die kleinere Lösung gehört zu x₁.'; }
        else { st='no'; t= (sa==='leer'||sb==='leer') ? 'Es gibt zwei Lösungen – tragen Sie beide ein.' : 'Das stimmt noch nicht. Prüfen Sie: solve(f(x)=…,x) und ctrl + enter.'; }
      }
    }

  });
  const tot=A.felder.length; stat.a++; if(ok===tot) stat.r++;
  root.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  root.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(F=>{

  });

// ---------- Aufgaben ----------
function genF(){

 }

const VARS={2:['x','y'],3:['x','y','z'],4:['a','b','c','d']};
function det(M){ const n=M.length, A=M.map(r=>r.slice()); let d=1;
  for(let i=0;i<n;i++){ let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    if(Math.abs(A[p][i])<1e-9) return 0; if(p!==i){ [A[p],A[i]]=[A[i],A[p]]; d=-d; } d*=A[i][i];
    for(let r=i+1;r<n;r++){ const f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; } }
  return d; }
function gen(n){
  for(;;){
    const M=Array.from({length:n},()=>Array.from({length:n},()=>Math.random()<(n>2?0.18:0.05)?0:R(-5,5)||1));
    if(M.some(r=>r.filter(v=>v).length<2)) continue;
    if(Math.abs(det(M))<0.5) continue;
    const s=Array.from({length:n},()=>R(-6,9));
    const b=M.map(r=>r.reduce((a,v,j)=>a+v*s[j],0));
    if(b.some(v=>Math.abs(v)>60)) continue;
    return {n,M,s,b,v:VARS[n]};
  }
}
const mi=v=>v<0?'−'+(-v):''+v;
function eqHtml(r,b,v){
  let t=''; r.forEach((c,j)=>{ if(!c) return; const a=Math.abs(c), co=(a===1?'':a)+'<i>'+v[j]+'</i>';
    t+= t===''? (c<0?'−':'')+co : (c<0?' − ':' + ')+co; });
  return t+' = '+mi(b);
}
const MODES={2:'Zwei Unbekannte',3:'Drei Unbekannte',4:'Vier Unbekannte'};
let mode=3, A=null, stat={a:0,r:0};
function neu(){
  A=gen(mode);
  root.getElementById('tabs').innerHTML='';
  root.getElementById('h').textContent='Aufgabe: '+MODES[mode];
  root.getElementById('lgs').innerHTML='<span class="lgs">'+A.M.map((r,i)=>`<span><span class="rn">${['I','II','III','IV'][i]}</span>${eqHtml(r,A.b[i],A.v)}</span>`).join('')+'</span>';
  root.getElementById('vorlage').innerHTML=`Vorlage: menu ▸ 3 ▸ 7 ▸ 2 · Anzahl der Gleichungen <span class="liste">${mode}</span> · Variablen <span class="liste">${A.v.join(',')}</span>`;
  root.getElementById('felder').innerHTML=A.v.map((x,j)=>`<div class="f" id="f_${j}"><label for="i_${j}">${x} =</label><input id="i_${j}" inputmode="numeric" autocomplete="off"><span class="m"></span><div class="msg"></div></div>`).join('');
  root.getElementById('score').textContent='';
  root.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace('−','-').replace(',','.'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return parseFloat(s); }
function pruefen(){
  let ok=0; const vals=A.v.map((_,j)=>parse(root.getElementById('i_'+j).value));
  A.v.forEach((x,j)=>{
    const f=root.getElementById('f_'+j), m=f.querySelector('.m'), msg=f.querySelector('.msg'), raw=root.getElementById('i_'+j).value;
    f.className='f'; m.textContent=''; msg.textContent='';
    if(!raw.trim()) return;
    const v=vals[j];
    if(v===null){ f.classList.add('fmt'); m.textContent='?'; msg.textContent='Bitte nur eine ganze Zahl eintragen.'; return; }
    if(v===A.s[j]){ f.classList.add('ok'); m.textContent='✓'; ok++; return; }
    f.classList.add('no'); m.textContent='✗';
    if(A.s.includes(v)) msg.textContent='Diese Zahl gehört zu einer anderen Variablen. Reihenfolge {'+A.v.join(',')+'} beachten.';
    else if(v===-A.s[j]) msg.textContent='Vorzeichen prüfen: negative Zahlen mit der Taste (−) eintippen.';
    else msg.textContent='Das stimmt noch nicht. Prüfen Sie die Eingabe der Gleichungen.';
  });
  stat.a++; if(ok===A.n) stat.r++;
  root.getElementById('score').innerHTML= ok===A.n?`<span style="color:var(--ok)">Alles richtig! ${ok} von ${A.n}. Klicken Sie auf „Neue Aufgabe“.</span>`:`${ok} von ${A.n} richtig.`;
  root.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){ A.v.forEach((x,j)=>{ const f=root.getElementById('f_'+j); if(!f.classList.contains('ok')){ f.classList.add('show'); f.querySelector('.msg').textContent='Lösung: '+mi(A.s[j]); } }); }
root.getElementById('pruefen').onclick=pruefen;
root.getElementById('zeigen').onclick=zeigen;
root.getElementById('neu').onclick=neu;
root.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=+m; neu(); } };
const hh=(''||'').slice(1); 
neu();
 }
};

</script>
<script>
(function(){
// ---------------------------------------------------------------
//  Themen
// ---------------------------------------------------------------
const BASE='https://olafkott.github.io/CAS/';
const TOPICS=[{"id": "grund", "dir": "Grundlagen", "pdf": "Arbeitsblatt_CAS_Grundlagen.pdf", "ueb": false, "title": "Grundlagen", "sub": ""}, {"id": "stat", "dir": "Lage_und_Streuung", "pdf": "Arbeitsblatt_CAS_Lage_Streuung.pdf", "ueb": true, "title": "Lage- und Streuungs&shy;maße", "sub": ""}, {"id": "reg", "dir": "Regression", "pdf": "Arbeitsblatt_CAS_Regression.pdf", "ueb": true, "title": "Lineare Regression und Korrelation", "sub": ""}, {"id": "wreg", "dir": "Weitere_Regressionen", "pdf": "Arbeitsblatt_CAS_Weitere_Regressionen.pdf", "ueb": true, "title": "Weitere Regressionen", "sub": "quadratisch, kubisch, exponentiell"}, {"id": "funk", "dir": "Funktionswerte", "pdf": "Arbeitsblatt_CAS_Funktionswerte.pdf", "ueb": true, "title": "Funktionswerte (y&#8209;Werte) berechnen", "sub": ""}, {"id": "gl", "dir": "Gleichungen", "pdf": "Arbeitsblatt_CAS_Gleichungen.pdf", "ueb": true, "title": "Gleichungen lösen", "sub": ""}, {"id": "lgs", "dir": "LGS", "pdf": "Arbeitsblatt_CAS_LGS.pdf", "ueb": true, "title": "Lineare Gleichungs&shy;systeme lösen", "sub": ""}];
const TOP={}; TOPICS.forEach(t=>TOP[t.id]=t);
const ICO={
 tour:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="10" height="16" rx="2"/><path d="M7 6h4M7 10h.01M10 10h.01M7 13h.01M10 13h.01"/><path d="M15 9l3 3-3 3" stroke="#F2B705"/></svg>',
 pdf:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 2h7l4 4v12H5z"/><path d="M12 2v4h4M8 10h5M8 13h5" stroke-linecap="round"/></svg>',
 ueb:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l4.5 4.5L17 5"/></svg>'
};
const plain=s=>s.replace(/&shy;/g,'').replace(/&#8209;/g,'\u2011');
const pdfUrl=t=>BASE+TOP[t].dir+'/'+TOP[t].pdf;

const $=id=>document.getElementById(id);
const APP=$('app'), STAGE=$('stage'), CALCW=$('calcw'), CALC=$('calc'), SCR=$('scr'), CAP=$('cap');
const vToc=$('vToc'), vG=$('vG'), vU=$('vU');
const DUMMY=document.createElement('div');
let mode='toc', active=null;   // mode: toc | g | u

// ---------------------------------------------------------------
//  Anleitungen: je ein eigenes Panel, ein gemeinsamer Rechner
// ---------------------------------------------------------------
const PANEL={}, G={}; let measuring=false;
const PANEL_HTML='<div class="tabs" id="tabs"></div><div class="pnote" id="pnote"></div><div class="task" id="task"></div><div class="prog" id="prog"></div><div class="nr" id="nr"></div><h2 id="tt"></h2><div class="keys" id="keys"></div><div class="stat" id="stat"></div><div id="dd"></div><div class="btns"><button id="back">◀ Zurück</button><button id="skip" title="Direkt zum nächsten Schritt">Überspringen ⏭</button><button id="next">Weiter ▶</button></div>';
function scope(id){
  const on=()=>active===id&&mode==='g'&&!measuring;
  return {
    getElementById:x=> x==='scr' ? (on()?SCR:DUMMY) : PANEL[id].querySelector('#'+x),
    querySelector:s=> on()?CALC.querySelector(s):null,
    querySelectorAll:s=> on()?CALC.querySelectorAll(s):[],
    scrollTo:()=>{ if(on()) toTopOfContent(); }
  };
}
TOPICS.forEach(t=>{
  const p=document.createElement('div'); p.className='gpanel'; p.dataset.g=t.id; p.hidden=true; p.innerHTML='<div class="panel">'+PANEL_HTML+'</div>'; vG.appendChild(p); PANEL[t.id]=p;
  const g=G[t.id]=GUIDES[t.id].make(scope(t.id));
  p.querySelector('#pnote').innerHTML=GUIDES[t.id].note||'';
  if(g.ORDER.length<2) p.querySelector('#tabs').classList.add('solo');
  p.querySelector('#next').onclick=()=>g.weiter();
  p.querySelector('#skip').onclick=()=>g.fwd();
  p.querySelector('#back').onclick=()=>g.bwd();
  p.querySelector('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(b&&b.dataset.t) g.selectTrack(b.dataset.t); };
  p.querySelector('#prog').onclick=e=>{ if(e.target.dataset.i!==undefined) g.selectStep(e.target.dataset.i); };
});
CALC.querySelectorAll('.k').forEach(b=>b.addEventListener('click',()=>{ b.blur(); if(mode==='g'&&active) G[active].press(b.dataset.k); }));
document.addEventListener('keydown',e=>{
  if(mode!=='g'||!active) return;
  const tg=e.target; if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable)) return;
  if(e.altKey||e.metaKey) return;
  let k=G[active].KMAP[e.key];
  if(!k && e.key.length===1 && /[0-9a-zA-Z.()+\-*\/^,=]/.test(e.key)) k=e.key.toLowerCase();
  if(k){ e.preventDefault(); G[active].press(k); }
});

// ---------------------------------------------------------------
//  Übungen: je ein Shadow-DOM (Styles und IDs bleiben getrennt)
// ---------------------------------------------------------------
const UHOST={};
function uebung(id){
  if(UHOST[id]) return UHOST[id];
  const h=document.createElement('div'); h.className='uhost'; h.hidden=true; vU.appendChild(h);
  const r=h.attachShadow({mode:'open'});
  r.innerHTML='<style>'+UEB[id].css+'</style>'+UEB[id].html;
  UEB[id].init(r);
  return UHOST[id]=h;
}

// ---------------------------------------------------------------
//  Rechner-Display in Gliederung / Übung
// ---------------------------------------------------------------
const PREV={ grund:['n',7], stat:['a',11], reg:['r',10], wreg:['k',6], funk:['f',6], gl:['s',6], lgs:['d',9] };
function previewOf(t){
  const g=G[t]; let p=PREV[t];
  if(!p){ const tr=g.ORDER[0], S=g.TRACKS[tr].steps; let s=0; S.forEach((x,i)=>{ if(!x.ab && x.k.length) s=i; }); p=[tr,s]; }
  try{ return g.screen(p[0],p[1]); }catch(e){ return null; }
}
function showHome(){ CALCW.dataset.g='grund'; SCR.className='scr'; SCR.innerHTML=G.grund.home(''); CAP.textContent=''; }
function showPreview(t,cap){ const h=previewOf(t); if(h==null){ showHome(); return; } CALCW.dataset.g=t; SCR.className='scr'; SCR.innerHTML=h; CAP.textContent=cap||''; }
function clearKeys(){ CALC.querySelectorAll('.k.hit,.k.held,.k.good,.k.bad').forEach(e=>e.classList.remove('hit','held','good','bad')); }
function flash(){ SCR.classList.remove('flash'); void SCR.offsetWidth; SCR.classList.add('flash'); }

// ---------------------------------------------------------------
//  Gliederung aufbauen
// ---------------------------------------------------------------
$('topics').innerHTML=TOPICS.map((t,i)=>`<li class="topic" data-t="${t.id}">
    <div class="tmain"><span class="tnum">${i+1}</span><span class="ttl">${t.title}${t.sub?`<small>${t.sub}</small>`:''}</span></div>
    <div class="acts"><button class="act tour" data-go="${t.id}:g">${ICO.tour}<span>Anleitung</span></button><a class="act pdf" href="${pdfUrl(t.id)}" target="_blank" rel="noopener">${ICO.pdf}<span>Arbeitsblatt</span></a>${t.ueb?`<button class="act ueb" data-go="${t.id}:u">${ICO.ueb}<span>Übung</span></button>`:'<span class="act phold" aria-hidden="true"></span>'}</div>
  </li>`).join('');
$('topics').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; const [t,v]=b.dataset.go.split(':'); go(t,v); });
let hoverT=null;
function hov(t){ if(mode!=='toc'||t===hoverT) return; hoverT=t; if(t){ showPreview(t,'Vorschau: '+plain(TOP[t].title)); } else showHome(); flash(); }
$('topics').addEventListener('mouseover',e=>{ const li=e.target.closest('.topic'); if(li) hov(li.dataset.t); });
$('topics').addEventListener('mouseleave',()=>hov(null));
$('topics').addEventListener('focusin',e=>{ const li=e.target.closest('.topic'); if(li) hov(li.dataset.t); });

// ---------------------------------------------------------------
//  Navigation mit animiertem Übergang
// ---------------------------------------------------------------
let busy=null;
function setTitle(html){ const h=$('hT'); h.classList.add('swap'); setTimeout(()=>{ h.innerHTML=html; h.classList.remove('swap'); },170); }
function toTopOfContent(){
  const r=$('right').getBoundingClientRect(), barH=document.querySelector('.bar').offsetHeight;
  const narrow=false; // Layout bleibt nebeneinander (auf kleinen Bildschirmen verkleinert)
  const y = narrow ? window.scrollY + r.top - barH - 8 : 0;
  if(Math.abs(window.scrollY-y)>4) window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
function viewEl(m){ return m==='toc'?vToc:m==='g'?vG:vU; }
function apply(t,v){
  clearKeys();
  if(v==='toc'){ active=null; hoverT=null; }
  else{
    active=t;
    $('segPdf').href=pdfUrl(t);
    $('segU').hidden=!TOP[t].ueb;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    if(v==='g'){ Object.keys(PANEL).forEach(k=>PANEL[k].hidden=(k!==t)); }
    else{ uebung(t); Object.keys(UHOST).forEach(k=>UHOST[k].hidden=(k!==t)); }
  }
  mode=v; APP.dataset.mode=v;
  if(v==='toc') showHome();
  else if(v==='g'){ CALCW.dataset.g=t; SCR.className='scr'; CAP.textContent=''; fixHeight(t); G[t].render(); }
  else showPreview(t,'Rechnen Sie am eigenen Handheld.');
  flash();
}
// Feste Panelhöhe je Anleitung: höchster Schritt (mind. Rechnerhöhe) -> Buttonzeile bleibt an derselben Stelle
function fixHeight(t){
  const g=G[t], p=PANEL[t].querySelector('.panel'); if(!g.snap) return;
  const wasHidden=vG.hidden; vG.hidden=false;
  const s=g.snap(); measuring=true; p.style.minHeight='0px'; let mx=0;
  try{
    g.ORDER.forEach(tr=>g.TRACKS[tr].steps.forEach((x,i)=>{
      g.goto(tr,i,0); mx=Math.max(mx,p.offsetHeight);
      if(x.k.length){ g.goto(tr,i,x.k.length); mx=Math.max(mx,p.offsetHeight); }
    }));
  }finally{ measuring=false; g.restore(s); vG.hidden=wasHidden; }
  p.style.minHeight=Math.max(mx, CALC.offsetHeight)+'px';
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(mode==='g'&&active) fixHeight(active); },200); });
function title(t,v){
  if(v==='toc') return 'CAS-Führerschein<small>TI-Nspire CX CAS</small>';
  return plain(TOP[t].title)+`<small>${v==='g'?'Anleitung':'Übung'}</small>`;
}
function go(t,v,opt){
  opt=opt||{};
  if(v!=='toc'&&!TOP[t]) { t=null; v='toc'; }
  if(v==='u'&&!TOP[t].ueb) v='g';
  if(v==='toc') t=null;
  if(mode===v && active===t) return;
  const from=viewEl(mode), to=viewEl(v);
  const fwd = mode==='toc' || (mode==='g'&&v==='u');
  const instant = opt.instant || window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTitle(title(t,v));
  if(!opt.nohist){ try{ history.pushState({t,v},'', v==='toc'?location.pathname+location.search:'#'+t+(v==='u'?'-uebung':'')); }catch(e){} }
  if(busy){ clearTimeout(busy); busy=null; }
  if(instant){ [vToc,vG,vU].forEach(x=>{ x.hidden=(x!==to); x.classList.remove('from-l','from-r','to-l','to-r'); }); apply(t,v); toTopOfContent(); return; }
  // 1) Altes ausblenden
  from.classList.remove('from-l','from-r'); from.classList.add(fwd?'to-l':'to-r');
  busy=setTimeout(()=>{
    busy=null;
    [vToc,vG,vU].forEach(x=>{ if(x!==to){ x.hidden=true; x.classList.remove('to-l','to-r'); } });
    apply(t,v);
    // 2) Neues einblenden
    to.classList.remove('to-l','to-r');
    to.classList.add(fwd?'from-r':'from-l'); to.hidden=false;
    void to.offsetWidth;
    requestAnimationFrame(()=>{ to.classList.remove('from-r','from-l'); });
    toTopOfContent();
  },240);
}
$('toToc').onclick=()=>go(null,'toc');
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>go(active,b.dataset.v));
function route(opt){
  const h=decodeURIComponent((location.hash||'').slice(1)); let m=h.match(/^([a-z]+)(-uebung)?$/);
  if(m&&TOP[m[1]]) go(m[1], m[2]?'u':'g', opt); else go(null,'toc',opt);
}
window.addEventListener('popstate',()=>route({nohist:true}));

// Start
showHome();
route({nohist:true, instant:true});
// ---------- Kleine Bildschirme: ganze Ansicht verkleinern (Layout wie am PC), Zoomen per Fingergeste ----------
const FIT_W=760; let SCALE=1;
function fit(){
  const w=document.documentElement.clientWidth; let h=window.innerHeight;
  // Im Moodle-iframe ist innerHeight die Rahmenhöhe: auf Handys die echte Bildschirmhöhe je nach Ausrichtung nehmen
  const sh=Math.min(screen.width,screen.height), lh=Math.max(screen.width,screen.height);
  const landscape=(screen.orientation&&/landscape/.test(screen.orientation.type))||Math.abs(window.orientation||0)===90||screen.width>screen.height;
  if(sh<500) h=Math.min(h, landscape?sh:lh);
  // schmal (Handy hochkant): auf 760 px Layoutbreite verkleinern; niedrig (Handy quer): so weit, dass ~800 px Höhe passen
  SCALE=Math.min(1, w/FIT_W, h<600 ? h/800 : 1);
  if(SCALE<1){ APP.classList.add('scaled'); APP.style.width=(w/SCALE)+'px'; APP.style.transformOrigin='top left'; APP.style.transform='scale('+SCALE+')'; }
  else { APP.classList.remove('scaled'); APP.style.width=''; APP.style.transform=''; }
  document.body.style.height = SCALE!==1 ? (APP.offsetHeight*SCALE)+'px' : '';
}
new ResizeObserver(()=>{ if(SCALE!==1) document.body.style.height=(APP.offsetHeight*SCALE)+'px'; }).observe(APP);
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,150)); fit();
})();
</script>
