<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Funktionsscharen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1 1 300px; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.term sub{ font-size:14px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; color:#222; white-space:nowrap; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
#felder.eins{ grid-template-columns:1fr; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; border-left:5px solid #ccc; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.f input[type=text], .f input:not([type]){ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f select{ font:inherit; font-size:16px; width:120px; padding:5px 6px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.f .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.f.cond label{ font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; font-size:15px; }
/* Multiple Choice */
.mc{ grid-column:1 / -1; border:1px solid var(--line); border-left:5px solid var(--lf); border-radius:8px; padding:10px 12px; }
.mc .q{ font-size:15.5px; margin:0 0 8px; }
.mc .opts{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; }
@media (max-width:620px){ .mc .opts{ grid-template-columns:1fr; } }
.mc label.o{ display:flex; align-items:center; gap:8px; padding:5px 8px; border:1px solid #d6dae1; border-radius:6px; cursor:pointer; background:#fafbfc; }
.mc label.o input{ width:18px; height:18px; flex:0 0 18px; }
.mc label.o code{ font-family:Consolas,'Courier New',monospace; font-size:16px; }
.mc label.o.ok{ background:var(--okbg); border-color:#9ccc9f; }
.mc label.o.no{ background:var(--nobg); border-color:#e3a3a3; }
.mc label.o.sol{ outline:2px dashed var(--ok); }
.mc .why{ font-size:13.8px; margin-top:8px; display:none; }
.mc.ok .why, .mc.no .why, .mc.show .why{ display:block; }
.mc.ok{ border-left-color:var(--ok); } .mc.ok .why{ color:var(--ok); }
.mc.no{ border-left-color:var(--no); } .mc.no .why{ color:var(--no); }
.mc.show .why{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:14px; color:var(--mute); }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.plot .cv{ fill:none; stroke-width:2.6; }
.plot .ml{ font:bold 14px system-ui,Arial,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; }
/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[R(0,a.length-1)];
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const deN=v=>{ let t=(Math.round(v*1e6)/1e6).toString(); return t.replace('-','−').replace('.',','); };
const caN=v=>{ let t=(Math.round(v*1e6)/1e6).toString(); return t.replace('-','−'); };   // CAS-Schreibweise (Punkt)
const de2=v=>{ const x=r2(v); return (Number.isInteger(x)?String(x):x.toFixed(2)).replace('-','−').replace('.',','); };
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=R(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// Termbausteine: HTML (kursiv) und CAS-Eingabe
const lin=(b,v)=>b===0?'':(b<0?' − ':' + ')+(Math.abs(b)===1?'':deN(Math.abs(b)))+`<i>${v}</i>`;
const linC=(b,v)=>b===0?'':(b<0?'−':'+')+(Math.abs(b)===1?'':caN(Math.abs(b)))+v;
const con=c=>c===0?'':(c<0?' − ':' + ')+deN(Math.abs(c));
const conC=c=>c===0?'':(c<0?'−':'+')+caN(Math.abs(c));
const lead=(a,v,pw)=>(a===1?'':a===-1?'−':deN(a)+'·')+`<i>${v}</i>`+(pw?pw:'');
const leadC=(a,v,pw)=>(a===1?'':a===-1?'−':caN(a)+'·')+v+(pw?pw:'');
const FT=(t,x)=>`<i>f</i><sub>${deN(t)}</sub>(${x===undefined?'<i>x</i>':deN(x)})`;

// ---------- Funktionsscharen ----------
// jede Schar ist linear in t: f(x,t)
const WHY_TX='„tx“ ist für das CAS ein neuer Name, kein Produkt. Zwischen t und x gehört ein Malzeichen.';
const WHY_TK='„t(…)“ liest das CAS als Funktion t an einer Stelle. Vor der Klammer fehlt das Malzeichen.';
const WHY_XK='„x(…)“ liest das CAS als Funktion x an einer Stelle. Vor der Klammer fehlt das Malzeichen.';
const WHY_EQ='Mit = allein wird nichts gespeichert. Speichern geht nur mit := (ctrl + ⊞).';
const WHY_X2='„x2“ ist ein neuer Name. Die Hochzahl kommt mit der Taste x² oder ^.';
const FAMS={
 T1(){ const b=one([-5,-4,-3,-2,-1,1,2,3,4,5]), c=R(-6,6);
   return {f:(x,t)=>t*x*x+b*x+c, x0:-4, x1:4,
     html:`<i>t</i>·<i>x</i>²${lin(b,'x')}${con(c)}`, cas:`t·x^2${linC(b,'x')}${conC(c)}`,
     wrong:[{s:`tx^2${linC(b,'x')}${conC(c)}`,why:WHY_TX},{s:`t·x2${linC(b,'x')}${conC(c)}`,why:WHY_X2}]}; },
 T2(){ const h=one([-3,-2,-1,1,2,3]), k=R(-5,5), hs=(h>0?' − ':' + ')+Math.abs(h), hc=(h>0?'−':'+')+Math.abs(h);
   return {f:(x,t)=>t*(x-h)*(x-h)+k, x0:h-4, x1:h+4,
     html:`<i>t</i>·(<i>x</i>${hs})²${con(k)}`, cas:`t·(x${hc})^2${conC(k)}`,
     wrong:[{s:`t(x${hc})^2${conC(k)}`,why:WHY_TK},{s:`tx${hc}^2${conC(k)}`,why:'Ohne Klammer wird nur die Zahl quadriert – und „tx“ ist ein neuer Name.'}]}; },
 T3(){ const a=one([1,-1,0.5,2]), c=R(-6,6);
   return {f:(x,t)=>a*x*x-t*x+c, x0:-4, x1:4,
     html:`${lead(a,'x','²')} − <i>t</i>·<i>x</i>${con(c)}`, cas:`${leadC(a,'x','^2')}−t·x${conC(c)}`,
     wrong:[{s:`${leadC(a,'x','^2')}−tx${conC(c)}`,why:WHY_TX},{s:`${leadC(a,'x','2')}−t·x${conC(c)}`,why:WHY_X2}]}; },
 T4(){ const h=one([-3,-2,-1,1,2,3]), hs=(h>0?' − ':' + ')+Math.abs(h), hc=(h>0?'−':'+')+Math.abs(h);
   return {f:(x,t)=>t*x*(x-h), x0:Math.min(0,h)-3, x1:Math.max(0,h)+3, noPar:true,
     html:`<i>t</i>·<i>x</i>·(<i>x</i>${hs})`, cas:`t·x·(x${hc})`,
     wrong:[{s:`t·x(x${hc})`,why:WHY_XK},{s:`tx·(x${hc})`,why:WHY_TX}]}; },
 T5(){ const a=one([1,-1,0.5,2]), d=R(-5,5);
   return {f:(x,t)=>a*x*x*x+t*x+d, x0:-3, x1:3,
     html:`${lead(a,'x','³')} + <i>t</i>·<i>x</i>${con(d)}`, cas:`${leadC(a,'x','^3')}+t·x${conC(d)}`,
     wrong:[{s:`${leadC(a,'x','^3')}+tx${conC(d)}`,why:WHY_TX},{s:`${leadC(a,'x','3')}+t·x${conC(d)}`,why:'„x3“ ist ein neuer Name. Die Hochzahl kommt mit der Taste ^.'}]}; }
};
function fam(list){ return FAMS[one(list||Object.keys(FAMS))](); }
const termOf=S=>`<i>f<sub>t</sub></i>(<i>x</i>) = ${S.html}`;

// ---------- Graph ----------
const COL=["#1F4E99","#2E7D32","#C25E00","#8E3BA8"];
function plot(curves,x0,x1){
  let ys=[];
  curves.forEach(c=>{ for(let i=0;i<=60;i++){ const y=c.f(x0+(x1-x0)*i/60); if(Math.abs(y)<14) ys.push(y); } });
  ys.push(0);
  let y0=Math.max(-12,Math.floor(Math.min(...ys))-1), y1=Math.min(12,Math.ceil(Math.max(...ys))+1);
  if(y1-y0<6){ y0-=2; y1+=2; }
  if(x0>0) x0=-1; if(x1<0) x1=1;
  const W=640, H=Math.min(460,Math.max(300,(y1-y0)*24)), pl=34, pr=26, pt=16, pb=26;
  const sx=(W-pl-pr)/(x1-x0), sy=(H-pt-pb)/(y1-y0);
  const X=x=>pl+(x-x0)*sx, Y=y=>pt+(y1-y)*sy;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphen der Schar">`;
  const sty=Math.max(1,Math.ceil((y1-y0)/12));
  for(let x=x0;x<=x1;x++) o+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" class="gl"/>`;
  for(let y=y0;y<=y1;y++) o+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" class="gl"/>`;
  o+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)+12}" y2="${Y(0)}" class="ax"/><path d="M${X(x1)+16} ${Y(0)} l-8 -4 v8z" class="ah"/>`;
  o+=`<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)-10}" class="ax"/><path d="M${X(0)} ${Y(y1)-14} l-4 8 h8z" class="ah"/>`;
  o+=`<text x="${X(x1)+8}" y="${Y(0)+16}" class="al">x</text><text x="${X(0)+7}" y="${Y(y1)-4}" class="al">y</text>`;
  for(let x=x0;x<=x1;x++) if(x!==0) o+=`<text x="${X(x)}" y="${Y(0)+14}" class="tl" text-anchor="middle">${String(x).replace('-','−')}</text>`;
  for(let y=y0;y<=y1;y++) if(y!==0&&y%sty===0) o+=`<text x="${X(0)-5}" y="${Y(y)+4}" class="tl" text-anchor="end">${String(y).replace('-','−')}</text>`;
  o+=`<defs><clipPath id="cp"><rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1)-X(x0)}" height="${Y(y0)-Y(y1)}"/></clipPath></defs>`;
  curves.forEach((c,ci)=>{
    let d='', pen=false, lab=null;
    for(let i=0;i<=400;i++){ const x=x0+(x1-x0)*i/400, y=c.f(x);
      if(y>=y0-3&&y<=y1+3){ d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' '; pen=true; } else pen=false; }
    // Beschriftung: Punkt im Fenster, möglichst weit rechts, gestaffelt
    for(let i=400-ci*45;i>=0;i-=5){ const x=x0+(x1-x0)*i/400, y=c.f(x); if(y>y0+.6&&y<y1-.6){ lab=[X(x),Y(y)]; break; } }
    o+=`<path d="${d}" class="cv" stroke="${c.col}" clip-path="url(#cp)"/>`;
    if(lab) o+=`<circle cx="${lab[0]}" cy="${lab[1]}" r="11" fill="#fff" stroke="${c.col}" stroke-width="2"/><text x="${lab[0]}" y="${lab[1]+5}" text-anchor="middle" class="ml" fill="${c.col}" style="stroke:none">${c.name}</text>`;
  });
  return o+'</svg>';
}

// ---------- Aufgabentypen ----------
function genEin(){
  const S=fam(), k=one([-3,-2,-1,2,3,4]);
  const px=one([-2,-1,1,2,3]), t0=one([-2,-1,1,2,3]), py=S.f(px,t0);
  const generic=[{s:`f(x)=${S.cas}`,why:WHY_EQ}];
  const w=shuffle(S.wrong.slice()).concat(generic).slice(0,3);
  const q1={q:'Mit welcher Eingabe speichern Sie die Funktionsschar <b>richtig</b>?',
    opts:shuffle([{s:`f(x):=${S.cas}`,ok:true,why:'Richtig: Zwischen zwei Buchstaben und vor einer Klammer steht immer ein Malzeichen.'}]
      .concat(w.map(o=>({s:o.why===WHY_EQ?o.s:'f(x):='+o.s, ok:false, why:o.why}))))};
  const ks=caN(k);
  const q2={q:`Wie lassen Sie sich die Funktion für <i>t</i> = ${deN(k)} anzeigen?`,
    opts:shuffle([{s:`f(x)|t=${ks}`,ok:true,why:'Richtig: Der senkrechte Strich setzt den Wert für t ein (ctrl + =).'},
      {s:`f(${ks})`,ok:false,why:`f(${ks}) setzt ${deN(k)} für x ein, nicht für t.`},
      {s:`f(t=${ks})`,ok:false,why:'In die Klammer gehört der x-Wert. Der t-Wert kommt hinter den senkrechten Strich.'},
      {s:`t=${ks}|f(x)`,ok:false,why:'Die Reihenfolge stimmt nicht: zuerst der Term, dann der Strich mit dem Wert.'}])};
  const P=`P(${deN(px)} | ${deN(py)})`, pxc=caN(px), pyc=caN(py);
  const q3={q:`Für welches <i>t</i> geht der Graph durch ${P}? Welche Eingabe passt?`,
    opts:shuffle([{s:`solve(f(${pxc})=${pyc},t)`,ok:true,why:`Richtig: Bedingung f(${deN(px)}) = ${deN(py)}, gelöst nach t.`},
      {s:`solve(f(${pxc})=${pyc},x)`,ok:false,why:'Gesucht ist t – hinter das Komma gehört t, nicht x.'},
      {s:`solve(f(${pyc})=${pxc},t)`,ok:false,why:'x- und y-Wert sind vertauscht. In die Klammer kommt der x-Wert.'},
      {s:`f(${pxc})|t=${pyc}`,ok:false,why:'Damit setzen Sie t = '+deN(py)+' ein. Gelöst wird dabei nichts.'}])};
  return {typ:'ein', h:'Eingabe prüfen', S, mc:[q1,q2,q3], round:false,
    auftrag:'Wählen Sie bei jeder Frage die <b>richtige</b> CAS-Eingabe. Probieren Sie die Eingaben ruhig am Handheld aus.',
    term:termOf(S), plot:'', hinweis:'Merke: Zwischen zwei Buchstaben steht immer ein <b>×</b>. Vor einer Klammer auch – außer der Buchstabe ist eine gespeicherte Funktion wie <span class="liste">f(</span>.'};
}
function genFW(){
  const S=fam(); const used=new Set(), felder=[];
  while(felder.length<4){
    const t=one([-3,-2,-1,-0.5,0.5,1,1.5,2,3,4]), x=one([-3,-2,-1.5,-1,-0.5,0.5,1,1.5,2,2.5,3,4]);
    const key=t+'|'+x, y=S.f(x,t);
    if(used.has(key)||Math.abs(y)>500) continue; used.add(key);
    felder.push({k:'w'+felder.length, lab:FT(t,x), col:COL[felder.length], soll:y, t, x});
  }
  const e=felder[0];
  return {typ:'fw', h:'Funktionswerte berechnen', S, felder,
    auftrag:'Speichern Sie die Funktionsschar im CAS. Berechnen Sie die Funktionswerte mit dem senkrechten Strich.',
    term:termOf(S), plot:'',
    hinweis:`Tipp: <span class="liste">f(x):=${esc(S.cas)}</span> speichern. Dann z.&nbsp;B. <span class="liste">f(${caN(e.x)})|t=${caN(e.t)}</span> – in die Klammer der x-Wert, hinter den Strich der t-Wert. Kommazahlen mit Punkt, Minus mit (−).`};
}
function genPar(){
  let S, felder;
  for(let tries=0;tries<200;tries++){
    S=fam(['T1','T2','T3','T5']); felder=[]; const conds=[];
    const tA=one([-3,-2,-1,-0.5,0.5,1.5,2,3]), xA=one([-3,-2,-1,1,2,3,4]);
    conds.push({x:xA, y:S.f(xA,tA), txt:`Der Graph geht durch P(${deN(xA)} | ${deN(S.f(xA,tA))}).`, cas:`solve(f(${caN(xA)})=${caN(S.f(xA,tA))},t)`});
    const tB=one([-2,-1,0.5,1,2,4]);
    if(Math.abs(S.f(0,1)-S.f(0,0))>0.01){ const y=R(-8,12); conds.push({x:0, y, txt:`Der Graph schneidet die <i>y</i>-Achse bei <i>y</i> = ${deN(y)}.`, cas:`solve(f(0)=${caN(y)},t)`}); }
    else { const xB=one([-2,-1,1,2,3]); const y=S.f(xB,tB); conds.push({x:xB, y, txt:`Der Graph geht durch Q(${deN(xB)} | ${deN(y)}).`, cas:`solve(f(${caN(xB)})=${caN(y)},t)`}); }
    const xC=one([-3,-2,-1,1,2,3,4,5]);
    conds.push({x:xC, y:0, txt:`Der Graph hat bei <i>x</i> = ${deN(xC)} eine Nullstelle.`, cas:`solve(f(${caN(xC)})=0,t)`});
    let ok=true;
    conds.forEach((c,i)=>{ const a=S.f(c.x,1)-S.f(c.x,0); if(Math.abs(a)<0.25){ ok=false; return; }
      const t=(c.y-S.f(c.x,0))/a; if(Math.abs(t)<0.05||Math.abs(t)>40||Math.abs(c.y)>60) ok=false;
      felder.push({k:'p'+i, lab:c.txt, col:COL[i], soll:t, cond:true, cas:c.cas}); });
    if(ok && new Set(conds.map(c=>c.x)).size===3) break;
  }
  return {typ:'par', h:'Parameter bestimmen', S, felder,
    auftrag:'Stellen Sie zu jeder Bedingung eine Gleichung auf. Lösen Sie sie mit <b>solve</b> nach <b><i>t</i></b>.',
    term:termOf(S), plot:'',
    hinweis:`Tipp: „durch P(a | b)“ heißt f(a) = b, also <span class="liste">solve(f(a)=b,t)</span>. Der y-Achsenabschnitt ist f(0). Brüche mit <b>ctrl + enter</b> als Dezimalzahl anzeigen.`};
}
function genZu(){
  const S=fam(); const ts=shuffle([-2,-1,-0.5,0.5,1,2,3]).slice(0,3);
  const names=['A','B','C'];
  const curves=ts.map((t,i)=>({f:x=>S.f(x,t), col:COL[i], name:names[i], t}));
  const opts=ts.slice().sort((a,b)=>a-b);
  const felder=curves.map((c,i)=>({k:'z'+i, lab:`Graph ${c.name}`, col:c.col, soll:c.t, sel:opts}));
  return {typ:'zu', h:'Graphen zuordnen', S, felder, round:false,
    auftrag:`Die Abbildung zeigt drei Graphen der Schar für <i>t</i> ∈ {${opts.map(deN).join('; ')}}. Ordnen Sie jedem Graphen seinen Parameter zu.`,
    term:termOf(S), plot:plot(curves,S.x0,S.x1),
    hinweis:'Tipp: Berechnen Sie für jeden Parameter einen Funktionswert, z.&nbsp;B. <span class="liste">f(1)|t=2</span>, und suchen Sie den passenden Punkt im Bild.'};
}
const MODES={ein:{name:"Eingabe",gen:genEin}, fw:{name:"Funktionswerte",gen:genFW}, par:{name:"Parameter bestimmen",gen:genPar}, zu:{name:"Graphen zuordnen",gen:genZu}};
const ORDER=["ein","fw","par","zu"];
let mode=ORDER[0], A=null; const stat={a:0,r:0};

// ---------- Darstellung ----------
function inp(id,ph){ return `<input id="${id}" inputmode="decimal" autocomplete="off" placeholder="${ph}">`; }
function neu(){
  A=MODES[mode].gen();
  document.getElementById('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  document.getElementById('h').textContent="Aufgabe: "+A.h;
  document.getElementById('auftrag').innerHTML=A.auftrag;
  document.getElementById('term').innerHTML=A.term;
  document.getElementById('plot').innerHTML=A.plot;
  document.getElementById('hinweis').innerHTML=A.hinweis;
  document.getElementById('round').style.display=A.round===false?'none':'inline-block';
  const fe=document.getElementById('felder');
  fe.className=(A.typ==='par'||A.typ==='ein')?'eins':'';
  if(A.typ==='ein'){
    fe.innerHTML=A.mc.map((q,qi)=>`<div class="mc" id="q${qi}"><p class="q"><b>${qi+1}.</b> ${q.q}</p><div class="opts">`+
      q.opts.map((o,oi)=>`<label class="o" id="o${qi}_${oi}"><input type="radio" name="r${qi}" value="${oi}"><code>${esc(o.s)}</code></label>`).join('')+
      `</div><div class="why"></div></div>`).join('');
  } else {
    fe.innerHTML=A.felder.map(F=>`<div class="f ${F.cond?'cond':''}" id="f_${F.k}" style="border-left-color:${F.col}"><label for="i_${F.k}"><span class="dot" style="background:${F.col}"></span>${F.lab}${F.cond?' &nbsp;<i>t</i> ≈':(F.sel?'':' =')}</label>`+
      (F.sel?`<select id="i_${F.k}"><option value="">t = …</option>${F.sel.map(v=>`<option value="${v}">t = ${deN(v)}</option>`).join('')}</select>`:inp('i_'+F.k,'0,00'))+
      `<span class="m"></span><div class="msg"></div></div>`).join('');
    document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
  }
  document.getElementById('score').textContent='';
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function check1(raw,soll){
  if(!raw.trim()) return 'leer';
  const p=parse(raw); if(!p) return 'fmt';
  if(near(p.v,soll)) return p.dec>2?'many':'ok';
  if(Math.abs(p.v-soll)<0.0151 && !near(p.v,r2(soll))) return 'rund';
  return 'no';
}
function pruefen(){
  let ok=0, tot=0;
  if(A.typ==='ein'){
    A.mc.forEach((q,qi)=>{ tot++;
      const box=document.getElementById('q'+qi), sel=box.querySelector('input:checked'), why=box.querySelector('.why');
      box.classList.remove('ok','no','show'); box.querySelectorAll('label.o').forEach(l=>l.classList.remove('ok','no','sol'));
      if(!sel){ why.textContent=''; return; }
      const o=q.opts[+sel.value]; const lab=document.getElementById(`o${qi}_${sel.value}`);
      lab.classList.add(o.ok?'ok':'no'); box.classList.add(o.ok?'ok':'no'); why.textContent=(o.ok?'✓ ':'✗ ')+o.why; if(o.ok) ok++;
    });
  } else {
    A.felder.forEach(F=>{ tot++;
      const f=document.getElementById('f_'+F.k), m=f.querySelector('.m'), msg=f.querySelector('.msg');
      f.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent='';
      const raw=document.getElementById('i_'+F.k).value; let st, t='';
      if(F.sel){ if(raw==='') return; st= near(parseFloat(raw),F.soll)?'ok':'no'; if(st==='no') t='Passt nicht. Berechnen Sie einen Funktionswert mit dem Strich und vergleichen Sie mit dem Graphen.'; }
      else {
        st=check1(raw,F.soll);
        if(st==='leer') return;
        if(st==='fmt') t='Bitte nur eine Zahl eintragen, z. B. 3,68.';
        if(st==='many'){ st='fmt'; t='Der Wert stimmt – bitte auf 2 Nachkommastellen runden.'; }
        if(st==='rund'){ st='fmt'; t='Fast – prüfen Sie das Runden auf 2 Nachkommastellen.'; }
        if(st==='no'){
          const p=parse(raw);
          if(A.typ==='fw' && p && near(p.v,A.S.f(F.t,F.x))) t='Vertauscht: In die Klammer gehört der x-Wert, hinter den Strich der t-Wert.';
          else if(A.typ==='fw' && p && near(p.v,A.S.f(F.x,-F.t))) t='Prüfen Sie das Vorzeichen von t: Minus mit der Taste (−).';
          else if(A.typ==='fw') t='Das stimmt noch nicht. Ist f mit Malzeichen gespeichert? Kommazahl mit Punkt getippt?';
          else t='Das stimmt noch nicht. Prüfen Sie die Gleichung und lösen Sie nach t.';
        }
      }
      f.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
    });
  }
  stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  if(A.typ==='ein'){
    A.mc.forEach((q,qi)=>{ const box=document.getElementById('q'+qi); if(box.classList.contains('ok')) return;
      const oi=q.opts.findIndex(o=>o.ok); document.getElementById(`o${qi}_${oi}`).classList.add('sol');
      box.classList.add('show'); box.querySelector('.why').textContent='Lösung: '+q.opts[oi].s+' – '+q.opts[oi].why.replace(/^Richtig: /,''); });
    return;
  }
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), msg=f.querySelector('.msg');
    if(f.classList.contains('ok')) return;
    f.classList.add('show');
    msg.innerHTML='Lösung: '+(F.sel?'t = '+deN(F.soll): F.cond? `<span class="liste">${F.cas}</span> → t ≈ ${de2(F.soll)}` : `<span class="liste">f(${caN(F.x)})|t=${caN(F.t)}</span> → ${de2(F.soll)}`);
  });
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>
</body></html>
