<div class="calc ex" id="calc_dx">
    <div class="head"><div class="logo">CASIO<small>fx-991DE X</small><em>CLASSWIZ</em></div><div class="solar"></div></div>
    <div class="bezel"><div class="scr"></div></div>
    <div class="ctl">
      <div class="c"><span class="lb" style="color:var(--gold)">SHIFT</span><button class="k rd" data-k="shift"></button></div>
      <div class="c"><span class="lb" style="color:#e2476a">ALPHA</span><button class="k rd" data-k="alpha"></button></div>
      <div class="pad">
        <button class="k pk" data-k="up" style="left:50%;top:2px;translate:-50% 0">▲</button>
        <button class="k pk" data-k="down" style="left:50%;bottom:2px;translate:-50% 0">▼</button>
        <button class="k pk" data-k="left" style="left:4px;top:50%;translate:0 -50%">◀</button>
        <button class="k pk" data-k="right" style="right:4px;top:50%;translate:0 -50%">▶</button>
      </div>
      <div class="c"><span class="lb">MENU <i style="color:var(--gold);font-style:normal">SETUP</i></span><button class="k rd" data-k="menu"></button></div>
      <div class="c"><span class="lb">ON</span><button class="k rd" data-k="on"></button></div>
    </div>
    <div class="fk">
      <div class="c" style="grid-column:1"><span class="sl">QR</span><button class="k" data-k="optn">OPTN</button></div>
      <div class="c" style="grid-column:2"><span class="sl">SOLVE <i class="al">=</i></span><button class="k" data-k="calc">CALC</button></div>
      <div class="c" style="grid-column:5"><span class="sl">d/dx</span><button class="k" data-k="integ">∫<span class="bx"></span></button></div>
      <div class="c" style="grid-column:6"><span class="sl">Σ</span><button class="k it" data-k="x">x</button></div>

      <div class="c"><span class="sl"><span class="bx f"></span>▭</span><button class="k" data-k="frac"><span class="mf"><i></i><b></b><i></i></span></button></div>
      <div class="c"><span class="sl">∛</span><button class="k" data-k="sqrt">√<span class="bx"></span></button></div>
      <div class="c"><span class="sl">x³</span><button class="k it" data-k="sq">x<sup>2</sup></button></div>
      <div class="c"><span class="sl">ⁿ√</span><button class="k it" data-k="pow">x<sup><span class="bx" style="width:5px;height:5px"></span></sup></button></div>
      <div class="c"><span class="sl">10<sup>x</sup></span><button class="k" data-k="log" style="font-size:10px">log<span class="bx" style="width:5px;height:6px"></span></button></div>
      <div class="c"><span class="sl">e<sup>x</sup></span><button class="k" data-k="ln">ln</button></div>

      <div class="c"><span class="sl">log<span class="bx" style="width:4px;height:5px"></span> <i class="al">A</i></span><button class="k" data-k="neg">(−)</button></div>
      <div class="c"><span class="sl">FACT <i class="al">B</i></span><button class="k" data-k="deg" style="font-size:10px">°′″</button></div>
      <div class="c"><span class="sl">x!</span><button class="k it" data-k="inv">x<sup>−1</sup></button></div>
      <div class="c"><span class="sl">sin<sup>−1</sup></span><button class="k" data-k="sin">sin</button></div>
      <div class="c"><span class="sl">cos<sup>−1</sup></span><button class="k" data-k="cos">cos</button></div>
      <div class="c"><span class="sl">tan<sup>−1</sup></span><button class="k" data-k="tan">tan</button></div>

      <div class="c"><span class="sl">RECALL</span><button class="k" data-k="sto">STO</button></div>
      <div class="c"><span class="sl">∠</span><button class="k" data-k="eng">ENG</button></div>
      <div class="c"><span class="sl">Abs</span><button class="k" data-k="(">(</button></div>
      <div class="c"><span class="sl">,</span><button class="k" data-k=")">)</button></div>
      <div class="c"><span class="sl" style="font-size:8px">a<sup>b</sup>/c</span><button class="k" data-k="sd" style="font-size:10px">S⇔D</button></div>
      <div class="c"><span class="sl">M−</span><button class="k" data-k="mplus">M+</button></div>
    </div>
    <div class="nums">
      <div class="c"><span class="sl sm">CONST</span><button class="k w" data-k="7">7</button></div>
      <div class="c"><span class="sl sm">CONV</span><button class="k w" data-k="8">8</button></div>
      <div class="c"><span class="sl sm">RESET</span><button class="k w" data-k="9">9</button></div>
      <div class="c"><span class="sl sm">INS</span><button class="k b" data-k="del">DEL</button></div>
      <div class="c"><span class="sl sm">OFF</span><button class="k b" data-k="ac">AC</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="4">4</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="5">5</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="6">6</button></div>
      <div class="c"><span class="sl sm">nPr</span><button class="k w" data-k="*">×</button></div>
      <div class="c"><span class="sl sm">nCr</span><button class="k w" data-k="/">÷</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="1">1</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="2">2</button></div>
      <div class="c"><span class="sl"></span><button class="k w" data-k="3">3</button></div>
      <div class="c"><span class="sl sm">Pol</span><button class="k w" data-k="+">+</button></div>
      <div class="c"><span class="sl sm">Rec</span><button class="k w" data-k="-">−</button></div>
      <div class="c"><span class="sl sm">Rnd</span><button class="k w" data-k="0">0</button></div>
      <div class="c"><span class="sl sm">Ran#</span><button class="k w" data-k=",">,</button></div>
      <div class="c"><span class="sl">π</span><button class="k w" data-k="e10" style="font-size:14px">×10<sup>x</sup></button></div>
      <div class="c"><span class="sl">%</span><button class="k w" data-k="ans" style="font-size:15px">Ans</button></div>
      <div class="c"><span class="sl">≈</span><button class="k w" data-k="exe">=</button></div>
    </div>
  </div>
