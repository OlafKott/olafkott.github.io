<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-991DE CW Gleichungssysteme</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32; --gold:#d2ad5b; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:1000px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1 1 auto; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.tabs{ max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.tabs button.fertig::after{ content:" ✓"; color:var(--ab); font-weight:bold; }
.tabs button.on.fertig::after{ color:#9fe0a5; }
main{ max-width:1000px; margin:14px auto 30px; padding:0 16px; display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

/* ---------- Rechner fx-991DE CW ---------- */
.calc{ width:330px; flex:0 0 330px; background:#1b1b1e; border-radius:30px; padding:16px 14px 18px; box-shadow:0 6px 22px rgba(0,0,0,.25), inset 0 0 0 2px #2c2c31; }
.head{ display:flex; justify-content:space-between; align-items:flex-start; padding:0 6px 8px; }
.logo{ color:#e9e9ec; font:900 19px Arial,sans-serif; letter-spacing:.5px; line-height:1; }
.logo small{ display:block; font:bold 10.5px Arial,sans-serif; letter-spacing:.3px; margin-top:5px; color:#cfcfd4; }
.solar{ width:104px; height:34px; border-radius:5px; background:linear-gradient(135deg,#2a1a1a,#3a2222 60%,#2a1818); box-shadow:inset 0 0 0 1px #000; }
.bezel{ background:#232327; border-radius:10px; padding:9px 9px 6px; box-shadow:inset 0 0 0 1px #111; }
.scr{ width:280px; height:118px; margin:0 auto; background:#d3ded4; border-radius:3px; position:relative; overflow:hidden; color:#141a14; font-family:Arial,Helvetica,sans-serif; box-shadow:inset 0 0 6px rgba(0,0,0,.25); }
.cw{ text-align:right; font:12px Arial,sans-serif; letter-spacing:5px; color:#bdbdc4; margin-top:5px; padding-right:4px; }
.keys{ display:grid; grid-template-columns:repeat(6,1fr); column-gap:4px; row-gap:2px; margin-top:12px; position:relative; }
.nums{ display:grid; grid-template-columns:repeat(5,1fr); column-gap:7px; row-gap:3px; margin-top:4px; }
.c{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; z-index:1; }
.lb{ font:bold 9px Arial,sans-serif; color:#e3e3e7; height:12px; letter-spacing:.2px; white-space:nowrap; }
.sl{ font:bold 10px 'Times New Roman',Georgia,serif; color:var(--gold); height:13px; line-height:13px; white-space:nowrap; }
.sl.sm{ font:bold 9px Arial,sans-serif; }
.k{ font:600 13px Arial,sans-serif; color:#f1f1f3; background:radial-gradient(circle at 50% 35%,#55555c,#3a3a40 70%); border:0; border-radius:50%; width:34px; height:30px; padding:0; cursor:pointer; box-shadow:0 2px 0 #0b0b0d; transition:transform .15s, box-shadow .15s; display:flex; align-items:center; justify-content:center; line-height:1; }
.k:focus{ outline:none; } .k:active{ transform:scale(.95); }
.nums .k{ width:46px; height:38px; font-size:19px; border-radius:48%; }
.k.small{ width:26px; height:24px; font-size:9px; }
.k.shift{ background:radial-gradient(circle at 50% 35%,#efe3bf,#b99b55 75%); color:#3a2c0a; }
.k.ok{ background:#121214; color:#9a9aa1; font-size:11px; width:32px; height:32px; border-radius:9px; }
.k.ar{ background:#121214; color:#9a9aa1; font-size:11px; }
.k.txt{ font-size:9.5px; letter-spacing:-.2px; }
.k sup{ font-size:8px; } .nums .k sup{ font-size:10px; }
.bx{ display:inline-block; width:7px; height:8px; border:1.3px solid currentColor; border-radius:1px; vertical-align:middle; }
.bx.f{ background:currentColor; }
.mf{ display:inline-flex; flex-direction:column; align-items:center; gap:1px; }
.mf i{ display:block; width:9px; height:6px; border:1.3px solid currentColor; border-radius:1px; }
.mf b{ display:block; width:12px; height:1.3px; background:currentColor; }
.dpad{ grid-column:3/6; grid-row:1/4; position:relative; z-index:0; }
.dpad::before,.dpad::after{ content:""; position:absolute; background:#0d0d0f; border-radius:16px; }
.dpad::before{ left:31%; right:31%; top:6px; bottom:4px; }
.dpad::after{ top:36%; bottom:28%; left:2px; right:2px; }
.pg{ grid-column:6; grid-row:1/3; justify-self:center; align-self:center; width:34px; height:64px; background:#2d2d32; border-radius:17px; display:flex; flex-direction:column; justify-content:space-around; align-items:center; color:#bbb; font-size:12px; z-index:1; }
.pg .k{ width:28px; height:26px; background:transparent; box-shadow:none; color:#bbb; font-size:13px; }
.k.hit{ box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.14); z-index:3; position:relative; }
.k.good{ box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8); }
.k.bad{ box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack .35s; }
.k.held{ box-shadow:0 0 0 3px #fff, 0 0 12px 3px rgba(255,255,255,.75); }
@keyframes wack{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

.list{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 0; font-size:13.5px; }
.list .ti{ font-size:10px; font-weight:bold; padding:0 7px 1px; border-bottom:1px solid #141a14; margin-bottom:2px; }
.list div.it{ padding:1px 9px; height:19px; line-height:18px; white-space:nowrap; }
.list div.it.sel{ background:#141a14; color:#d3ded4; }
.home{ position:absolute; inset:0; padding:6px 14px 4px 8px; }
.home .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px 6px; }
.home .ic{ position:relative; height:49px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:2px 0 3px; border-radius:2px; }
.home .ic svg{ width:40px; height:17px; margin-bottom:1px; }
.home .ic .an{ font:13.5px 'Arial Narrow','Roboto Condensed',Arial,sans-serif; letter-spacing:-.3px; line-height:1.1; white-space:nowrap; }
.home .ic .bd{ position:absolute; top:3px; right:5px; width:11px; height:11px; border-radius:50%; background:#141a14; color:#d3ded4; font:bold 8.5px Arial,sans-serif; line-height:11px; text-align:center; }
.home .ic.sel{ background:#141a14; color:#d3ded4; }
.home .ic.sel .bd{ background:#d3ded4; color:#141a14; }

/* Display */
.sb{ height:13px; display:flex; align-items:center; gap:4px; padding:1px 4px 0; font:bold 9px Arial,sans-serif; }
.sb .ind{ background:#141a14; color:#d3ded4; padding:0 2px; border-radius:1px; line-height:10px; height:10px; }
.sb .ind.a{ background:#7a1a2a; }
.sb .sp{ flex:1; }
.app{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 7px 4px; display:flex; flex-direction:column; justify-content:space-between; }
.ein{ font-size:16px; min-height:30px; display:flex; align-items:center; flex-wrap:nowrap; white-space:nowrap; overflow:hidden; }
.aus{ font-size:21px; text-align:right; min-height:30px; display:flex; justify-content:flex-end; align-items:center; font-weight:bold; white-space:nowrap; gap:6px; }
.aus .lab{ font-size:17px; font-weight:normal; margin-right:auto; }
.klein{ font-size:13px; display:flex; justify-content:space-between; }
.vx{ font-family:'Times New Roman',serif; font-style:italic; font-size:18px; padding:0 1px; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:13px; line-height:1.15; }
.fr > span{ padding:0 2px; min-width:9px; }
.fr > span:first-child{ border-bottom:1.5px solid currentColor; }
.aus .fr{ font-size:15px; }
.ein sup{ font-size:11px; align-self:flex-start; margin-top:4px; }
.wz{ white-space:nowrap; } .wz .ov{ border-top:1.5px solid currentColor; padding:0 1px; margin-left:-1px; }
.caret{ display:inline-block; width:1.5px; height:18px; background:#141a14; animation:blink 1s steps(1) infinite; vertical-align:middle; margin-left:1px; } @keyframes blink{ 50%{opacity:0} }
.ziel{ outline:2.5px solid var(--hit); outline-offset:-2px; animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{ 50%{ outline-color:rgba(242,183,5,.25); } }
.offs{ position:absolute; inset:0; background:#c9d4ca; }
.lst{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:4px 9px; font:bold 16px 'Courier New',monospace; line-height:1.55; }
.lst .s{ background:#141a14; color:#d3ded4; }
.koef{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 7px 4px; display:flex; flex-direction:column; }
.koef .kt{ font-size:14px; text-align:center; font-family:'Times New Roman',serif; }
.koef table{ border-collapse:collapse; margin:3px auto 0; font-size:14px; }
.koef th{ font:italic bold 14px 'Times New Roman',serif; padding:0 10px; border-bottom:1.5px solid #141a14; }
.koef td{ text-align:center; padding:1px 8px; min-width:62px; }
.koef td.cur{ background:#141a14; color:#d3ded4; }
.koef .inp{ margin-top:auto; text-align:right; font-size:18px; font-weight:bold; min-height:24px; }


/* Gleichungssystem: Koeffizienten-Tabelle im Display */
.mat{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:1px 6px 3px; display:flex; flex-direction:column; }
.mat table{ border-collapse:collapse; margin:0 auto; font-size:14px; }
.mat th{ font:italic bold 13px 'Times New Roman',serif; padding:0 6px; border-bottom:1.5px solid #141a14; }
.mat td{ text-align:center; padding:0 5px; min-width:50px; height:19px; line-height:19px; }
.mat td.rn{ min-width:12px; font-size:11px; padding:0 3px 0 0; border-right:1px solid #141a14; }
.mat td.cur{ background:#141a14; color:#d3ded4; }
.mat.m3 table{ font-size:13px; } .mat.m3 td{ height:17px; line-height:17px; min-width:46px; }
.mat .inp{ margin-top:auto; text-align:right; font-size:17px; font-weight:bold; min-height:22px; }
.aus.meld{ font-size:19px; text-align:center; justify-content:center; line-height:1.15; white-space:normal; }
/* Panel: Gleichungssysteme und Tabellen */
table.sys{ border-collapse:collapse; font-family:Cambria,Georgia,serif; font-size:20px; line-height:1.45; }
table.sys td{ padding:0 6px 0 0; white-space:nowrap; }
table.sys td.ro{ font-family:Arial,sans-serif; font-size:13px; color:var(--mute); padding-right:12px; }
.task .term small{ display:block; }
table.ktab{ border-collapse:collapse; margin:2px 0 12px; font-size:15px; }
table.ktab th{ font:italic bold 15px 'Times New Roman',serif; padding:2px 14px; border-bottom:2px solid var(--ink); }
table.ktab td{ text-align:center; padding:2px 14px; background:#f3f5f8; border:1px solid #fff; }
table.ktab td.rn{ background:none; color:var(--mute); font-size:12px; padding:2px 8px; }
table.umf{ border-collapse:collapse; font-family:Cambria,Georgia,serif; font-size:18px; margin:2px 0 10px; }
table.umf td{ padding:2px 0; white-space:nowrap; } table.umf td.eq{ padding:2px 6px; } table.umf td.r{ padding:2px 14px 2px 0; }
table.umf .bar{ display:inline-block; border-left:2px solid #1d1d1f; padding-left:8px; color:#1F4E99; font-weight:bold; }
table.umf .rot{ color:#C62828; font-weight:bold; }

/* Panel */
.panel{ flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.prog{ display:flex; gap:4px; margin-bottom:12px; }
.prog i{ flex:1; height:5px; border-radius:3px; background:#e3e6eb; cursor:pointer; }
.prog i.done{ background:#9aa3b0; } .prog i.now{ background:var(--lf); }
.prog i.abp{ background:#bfe3c3; } .prog i.abp.done{ background:#7cbf84; } .prog i.abp.now{ background:var(--ab); }
.nr{ font-size:13px; color:var(--mute); }
.panel h2{ margin:2px 0 8px; font-size:20px; line-height:1.3; }
.panel p{ margin:0 0 10px; font-size:15.5px; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px; }
.chip{ font:600 13px Arial,sans-serif; background:#2b2b2f; color:#fff; border-radius:5px; padding:3px 9px; border:2px solid transparent; }
.chip.shift{ background:#c9a54a; color:#2b2005; }
.chip.alpha{ background:#b8324a; }
.chip.w{ background:#f1f1f3; color:#111; border-color:#c9cbd1; }
.chip.b{ background:#2463c9; }
.chip.done{ opacity:.35; }
.chip.now{ border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35); }
.chip.big{ font-size:16px; padding:4px 12px; vertical-align:middle; }
.chip sup{ font-size:9px; }
.chip i.v{ font-family:'Times New Roman',serif; font-size:15px; }
.note{ background:#FFF8E8; border-left:4px solid var(--hit); border-radius:4px; padding:7px 12px; font-size:14.5px; margin:0 0 10px; }
.note b{ color:#8a5a00; }
.stat{ min-height:38px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; background:var(--bg); border-radius:8px; padding:6px 12px; margin:6px 0 12px; }
.stat .ok{ color:#2E7D32; font-weight:bold; } .stat .err{ color:#C62828; font-weight:bold; }
.ab{ border:2px solid var(--ab); background:#F1F8F1; border-radius:10px; padding:10px 14px 6px; margin:0 0 12px; }
.ab .abt{ font-weight:bold; color:var(--ab); font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.ab .abt span{ font-size:22px; }
.ab ul{ margin:0 0 8px; padding-left:20px; font-size:15px; }
.ab li{ margin-bottom:3px; }
.ab p{ font-size:14.5px; }
.task{ border:1px solid var(--line); border-left:5px solid var(--lf); border-radius:8px; padding:6px 14px 8px; margin:0 0 12px; font-size:14.5px; background:#fafbfc; }
.task .auf{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--mute); }
.task .term{ font-family:Cambria,Georgia,serif; font-size:21px; line-height:1.6; color:var(--ink); }
.task .term small{ font-size:15px; color:var(--mute); }
.btns{ display:flex; gap:10px; margin-top:14px; }
.btns button{ font:inherit; font-size:16px; padding:9px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); color:#fff; border-color:var(--lf); }
.btns button:disabled{ opacity:.4; cursor:default; }
#next{ margin-left:auto; }
.opt{ font-size:13.5px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:10px; }
.hint{ font-size:12.5px; color:var(--mute); margin-top:10px; }
@media (max-width:380px){ .calc{ transform:scale(.92); transform-origin:top center; } }
</style></head><body>
<div class="top"><div class="in"><a href="index.html#cw" title="Übersicht" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 14px system-ui,Arial,sans-serif;color:#1F4E99;border:1px solid #c9d3e6;border-radius:999px;padding:6px 14px;background:#fff;white-space:nowrap">&#8592; Übersicht</a><h1>Schritt für Schritt: Lineare Gleichungssysteme lösen<small>CASIO fx-991DE CW · Am eigenen Rechner mitmachen · <b style="color:#2E7D32">✍</b> = Arbeitsblatt</small></h1><img src="data:image/png;base64,@@LOGO@@" alt="RWB Essen fhr"></div></div>

<main>
@@CALC_CW@@  <div class="panel">
    <div class="task" id="task"></div>
    <div class="prog" id="prog"></div>
    <div class="nr" id="nr"></div>
    <h2 id="tt"></h2>

<script>
// =====================================================================
//  HOME-Bildschirm fx-991DE CW
// =====================================================================
const T_=(t,sz)=>`<text x="17" y="12" text-anchor="middle" font-size="${sz||11}" font-weight="bold" fill="currentColor">${t}</text>`;
const ICON={
 Berechnung:'<svg viewBox="0 0 34 14"><text x="17" y="6.8" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">×÷</text><text x="17" y="14" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">+−</text></svg>',
 Statistik:'<svg viewBox="0 0 34 14"><path d="M9 1v12h17" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="7" width="2.6" height="5" fill="currentColor"/><rect x="14.5" y="3" width="2.6" height="9" fill="currentColor"/><rect x="18" y="5" width="2.6" height="7" fill="currentColor"/><rect x="21.5" y="8" width="2.6" height="4" fill="currentColor"/></svg>',
 Verteilung:'<svg viewBox="0 0 34 14"><path d="M5 13C11 13 12 2 17 2s6 11 12 11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 13V4.5h6V13" fill="currentColor" opacity=".55"/><path d="M4 13h26" stroke="currentColor" stroke-width="1"/></svg>',
 'Tabellenk.':'<svg viewBox="0 0 34 14"><rect x="9" y="1.5" width="16" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1.5" width="16" height="3" fill="currentColor"/><path d="M9 8.5h16M14.3 4.5v8.5M19.6 4.5v8.5" stroke="currentColor" stroke-width="1"/></svg>',
 'Wertetab.':'<svg viewBox="0 0 34 14"><rect x="10" y="1.5" width="14" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="10" y="1.5" width="14" height="3" fill="currentColor"/><path d="M17 4.5v8.5M10 8.5h14" stroke="currentColor" stroke-width="1"/></svg>',
 Gleichung:'<svg viewBox="0 0 34 14">'+T_('xy=0',9.5)+'<path d="M5 13.3h24" stroke="currentColor" stroke-width="1.3"/></svg>'
};
const APPS=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung"];
const zl=(lbl,ziel)=>(ziel||[]).includes(lbl)?' ziel':'';
function drawHome(S,ziel){
  return `<div class="home"><div class="grid">`+APPS.map((a,i)=>`<div class="ic${i===S.sel?' sel':''}${zl(a,ziel)}"><span class="bd">${i+1}</span>${ICON[a]}<span class="an">${a}</span></div>`).join('')+`</div></div>`;
}
function drawList(S,title,L,ziel){
  return sbar(S)+`<div class="list"><div class="ti">${title}</div>`+L.map((t,i)=>`<div class="it${i===S.sel?' sel':''}${zl(t,ziel)}">${t}</div>`).join('')+'</div>';
}
function sbar(S){ return `<div class="sb">${S.shift?'<span class="ind">S</span>':''}<span class="ind">D</span><span class="sp"></span></div>`; }

@@LGS_CORE@@// =====================================================================
//  Rechnerzustand fx-991DE CW: App Gleichung ▸ Gleichungssystem
// =====================================================================
const EQM=['Gleichungssyst.','Polynom-Gleich.','Allgemeine Lösung'];
const ANZ=['2 Unbekannte','3 Unbekannte','4 Unbekannte'];
const FMT=['Voreinstellung','Dezimal'];
function fresh(){ return {mode:'calc', sel:0, shift:false, n:2, M:newM(2), r:0, c:0, inp:[], res:null, si:0, sd:false}; }
function step(S,k){
  if(S.mode==='off'){ if(k==='on') S.mode='calc'; return; }
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='ac'){ S.mode='off'; return; } if(k==='-') k='neg'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if(k==='ok'||k==='exe'){ if(S.sel===5){ S.mode='eqmenu'; S.sel=0; } else if(S.sel===0){ S.mode='calc'; } }
     return;
   case 'eqmenu':
     if(k==='down') S.sel=Math.min(2,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if((k==='ok'||k==='exe')&&S.sel===0){ S.mode='anz'; S.sel=0; }
     return;
   case 'anz':
     if(k==='down') S.sel=Math.min(2,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if((k==='ok'||k==='exe')&&S.sel<2) startMat(S,S.sel+2);
     else if(k==='back'){ S.mode='eqmenu'; S.sel=0; }
     return;
   case 'mat': if(k==='-') k='neg'; matKey(S,k); return;
   case 'sol':
     if(k==='format'&&S.res.typ==='ok'){ S.mode='fmt'; S.sel=0; return; }
     solKey(S,k); return;
   case 'fmt':
     if(k==='down') S.sel=Math.min(1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='ok'||k==='exe'){ S.sd=S.sel===1; S.mode='sol'; }
     else if(k==='back'||k==='ac') S.mode='sol';
     return;
  }
}
function run(S,keys){ keys.forEach(k=>step(S,k)); return S; }
function draw(S,ziel){
  const Z=n=>(ziel||[]).includes(n)?' ziel':'';
  if(S.mode==='off') return '<div class="offs"></div>';
  if(S.mode==='home') return drawHome(S,ziel);
  if(S.mode==='eqmenu') return drawList(S,'Gleichung',EQM,ziel);
  if(S.mode==='anz') return drawList(S,'Anzahl Unbekannte',ANZ,ziel);
  if(S.mode==='fmt') return drawList(S,'FORMAT',FMT,ziel);
  if(S.mode==='mat') return drawMat(S,Z);
  if(S.mode==='sol') return drawSol(S,Z);

}
