<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Binomialverteilung</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; color:#222; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; border-left:5px solid #1F4E99; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }
.f label{ line-height:1.35; }
#felder.eins{ grid-template-columns:1fr; max-width:none; }
.f.iv{ grid-template-columns:auto 120px 26px; row-gap:6px; }
.f.iv .ivl{ grid-column:1 / -1; font-size:15.5px; }
.f.iv .za{ grid-column:1 / 2; display:flex; flex-wrap:wrap; gap:3px; }
.f.iv .za button{ font:inherit; font-size:14px; width:31px; height:31px; border:1.5px solid #9aa3b0; border-radius:6px; background:#fff; cursor:pointer; padding:0; }
.f.iv .za button.on{ background:#F2B705; border-color:#b88a00; font-weight:bold; }
.f.iv .za button.bad{ box-shadow:0 0 0 2px var(--no); }
.f.iv label{ display:none; }
.f.np input{ width:120px; }
.f .msg .liste{ margin-left:4px; }
/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickA=a=>a[Math.floor(Math.random()*a.length)];
const r4=v=>Math.round(v*1e4+1e-9)/1e4;
const de4=v=>r4(v).toFixed(4).replace('.',',');
const dp=p=>String(p).replace('.',',');
function binom(n,k){ let c=1; for(let i=1;i<=k;i++) c=c*(n-k+i)/i; return c; }
const pdf=(n,p,k)=>(k<0||k>n)?0:binom(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k);
const cdf=(n,p,k)=>{ let s=0; for(let i=0;i<=k;i++) s+=pdf(n,p,i); return s; };
const PX=(op,k)=>`<i>P</i>(<i>X</i> ${op} ${k})`;
const PS=[0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9];
// k-Werte, die sinnvolle Wahrscheinlichkeiten liefern
function ks(n,p,typ,anz){
  const ok=[]; for(let k=0;k<=n;k++){ const v=typ==='='?pdf(n,p,k):cdf(n,p,k); if(v>0.02&&v<0.98) ok.push(k); }
  const out=[]; while(out.length<anz && ok.length){ out.push(ok.splice(Math.floor(Math.random()*ok.length),1)[0]); }
  return out.sort((a,b)=>a-b);
}
const WEG={'=':'<b>menu</b> ▸ 5 ▸ 5 ▸ <b>D</b> Binomial Pdf: <i>n</i>, tab, <i>p</i>, tab, <i>k</i>, enter',
           '≤':'<b>menu</b> ▸ 5 ▸ 5 ▸ <b>E</b> Binomial Cdf: <i>n</i>, tab, <i>p</i>, tab, <b>0</b>, tab, <i>k</i>, enter'};
const feld=(n,p,op,k,i)=>({k:'w'+i, lab:PX(op,k), soll:op==='='?pdf(n,p,k):cdf(n,p,k), n,p,op,kk:k});

// ---------- Aufgaben ----------
function genTyp(op){
  return ()=>{
    let n,p,K;
    do{ n=pickA([8,10,12,15,20,25,30,40,50]); p=pickA(PS); K=ks(n,p,op,3); }while(K.length<3);
    return {h:op==='='?'Genau k Treffer':'Höchstens k Treffer',
      auftrag:'<i>X</i> ist binomialverteilt.<br>Berechnen Sie die Wahrscheinlichkeiten mit dem CAS.',
      term:`<i>n</i> = ${n} &nbsp;&nbsp; <i>p</i> = ${dp(p)}`,
      felder:K.map((k,i)=>feld(n,p,op,k,i)),
      hinweis:'Tipp: '+WEG[op]+'. Kommazahlen mit <b>Punkt</b> eintippen, z.&nbsp;B. 0.3'};
  };
}
// ---------- Intervalle ----------
const IV=[
  {t:k=>`weniger als ${k}`, g:(k,n)=>[0,k-1]},
  {t:k=>`höchstens ${k}`, g:(k,n)=>[0,k]},
  {t:k=>`mehr als ${k}`, g:(k,n)=>[k+1,n]},
  {t:k=>`mindestens ${k}`, g:(k,n)=>[k,n]},
  {t:(a,b)=>`zwischen ${a} und ${b}`, g:(a,b)=>[a,b], z:1},
  {t:(a,b)=>`mehr als ${a}, aber höchstens ${b}`, g:(a,b)=>[a+1,b], z:1},
  {t:(a,b)=>`mindestens ${a}, aber weniger als ${b}`, g:(a,b)=>[a,b-1], z:1},
  {t:(a,b)=>`mehr als ${a} und weniger als ${b}`, g:(a,b)=>[a+1,b-1], z:1}
];
const ivP=(n,p,a,e)=>{ let s=0; for(let i=a;i<=e;i++) s+=pdf(n,p,i); return s; };
function genIv(){
  let n,p,items;
  do{
    n=R(8,15); p=pickA(PS); items=[]; const used=new Set();
    let tries=0;
    while(items.length<3 && tries++<200){
      const ti=R(0,IV.length-1); if(used.has(ti)) continue;
      const T=IV[ti]; let a,b,g;
      if(T.z){ a=R(0,n-3); b=R(a+2,Math.min(n,a+7)); g=T.g(a,b); }
      else { a=R(1,n-1); g=T.g(a,n); }
      if(g[0]>g[1]) continue;
      const v=ivP(n,p,g[0],g[1]); if(v<0.03||v>0.97) continue;
      used.add(ti); items.push({txt:T.z?T.t(a,b):T.t(a), lo:g[0], hi:g[1], v});
    }
  }while(items.length<3);
  return {h:'Intervalle: mehr als, weniger als, zwischen …',
    auftrag:'<i>X</i> ist binomialverteilt.<br>Klicken Sie auf dem Zahlenstrahl alle Werte an, die zählen.<br>Berechnen Sie dann die Wahrscheinlichkeit mit Binomial Cdf.<br><b>Zwischen</b> heißt hier: Beide Zahlen zählen mit.',
    term:`<i>n</i> = ${n} &nbsp;&nbsp; <i>p</i> = ${dp(p)}`,
    felder:items.map((it,i)=>({k:'v'+i, iv:true, lab:'Anzahl der Treffer: <b>'+it.txt+'</b>', soll:it.v, lo:it.lo, hi:it.hi, n, p})),
    hinweis:'Tipp: '+WEG['≤'].replace('<b>0</b>','<b>untere Grenze</b>').replace('<i>k</i>, enter','<b>obere Grenze</b>, enter')+'. Bei „mehr als“ und „mindestens“ ist die obere Grenze <i>n</i>.'};
}
const MODES={g:{name:"Genau",gen:genTyp('=')}, h:{name:"Höchstens",gen:genTyp('≤')}, i:{name:"Intervalle",gen:genIv}};
const ORDER=["g","h","i"];
let mode=ORDER[0], A=null, stat={a:0,r:0};

function neu(){
  A=MODES[mode].gen();
  document.getElementById('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  document.getElementById('h').textContent="Aufgabe: "+A.h;
  document.getElementById('auftrag').innerHTML=A.auftrag;
  document.getElementById('term').innerHTML=A.term; document.getElementById('term').style.display=A.term?'block':'none';
  document.getElementById('round').innerHTML='<b>Wichtig:</b> Runden Sie auf <b>4 Stellen nach dem Komma</b>, z.&nbsp;B. <b>0,2335</b>.';
  document.getElementById('hinweis').innerHTML=A.hinweis;
  document.getElementById('felder').classList.toggle('eins',mode==='i');
  document.getElementById('felder').innerHTML=A.felder.map(F=>F.iv?
    `<div class="f iv" id="f_${F.k}"><div class="ivl">${F.lab}</div><div class="za" id="z_${F.k}">${Array.from({length:F.n+1},(_,j)=>`<button type="button" data-j="${j}">${j}</button>`).join('')}</div><label for="i_${F.k}">${PX('','…').replace(' … ','')}</label><input id="i_${F.k}" inputmode="decimal" autocomplete="off" placeholder="0,0000"><span class="m"></span><div class="msg"></div></div>`:
    `<div class="f${F.ganz||F.pw?' np':''}" id="f_${F.k}"><label for="i_${F.k}">${F.lab} ${F.ganz||F.pw?'=':'≈'}</label><input id="i_${F.k}" inputmode="decimal" autocomplete="off" placeholder="${F.ganz||F.pw?'':'0,0000'}"><span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.za button').forEach(b=>b.onclick=()=>{ b.classList.toggle('on'); });
  document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){
  s=s.trim().replace(/\s/g,'').replace(/−/g,'-').replace(',','.');
  let pc=false; if(s.endsWith('%')){ pc=true; s=s.slice(0,-1); }
  if(!/^-?\d*(\.\d+)?$/.test(s)||s===''||s==='-') return null;
  return {v:parseFloat(s), dec:(s.split('.')[1]||'').length, pc};
}
function chkIv(F,raw){
  const on=[...document.querySelectorAll('#z_'+F.k+' button')].map(b=>b.classList.contains('on'));
  const zOk=on.every((x,j)=>x===(j>=F.lo&&j<=F.hi)), zLeer=!on.some(x=>x);
  document.querySelectorAll('#z_'+F.k+' button').forEach((b,j)=>b.classList.toggle('bad', !zLeer && on[j]!==(j>=F.lo&&j<=F.hi)));
  if(!raw.trim() && zLeer) return ['leer',''];
  let pr=raw.trim()?check(Object.assign({},F,{iv:false,op:'iv'}),raw):['no','Tragen Sie noch die Wahrscheinlichkeit ein.'];
  if(pr[0]==='no' && raw.trim()){ const v=parse(raw); if(v){ const near=w=>Math.abs(v.v-w)<6e-5;
    if(near(ivP(F.n,F.p,F.lo-1,F.hi))||near(ivP(F.n,F.p,F.lo+1,F.hi))) pr=['no','Die untere Grenze stimmt nicht. Zählt die Zahl mit oder nicht?'];
    else if(near(ivP(F.n,F.p,F.lo,F.hi-1))||near(ivP(F.n,F.p,F.lo,F.hi+1))) pr=['no','Die obere Grenze stimmt nicht. Zählt die Zahl mit oder nicht?'];
    else if(near(ivP(F.n,F.p,0,F.hi))&&F.lo>0) pr=['no','Die untere Grenze ist nicht 0. Welcher Wert ist der kleinste, der zählt?'];
    else if(near(ivP(F.n,F.p,0,F.lo-1))||near(ivP(F.n,F.p,F.hi+1,F.n))) pr=['no','Das ist genau die Gegenseite. Welche Werte zählen?']; } }
  if(zLeer) return pr[0]==='ok'?['fmt','Der Wert stimmt. Klicken Sie auch die passenden Zahlen an.']:pr;
  if(!zOk) return ['no','Auf dem Zahlenstrahl stimmt etwas nicht (rot markiert).'+(pr[0]==='ok'?'':' '+pr[1])];
  return pr;
}
function check(F,raw){
  if(F.iv) return chkIv(F,raw);
  if(!raw.trim()) return ['leer',''];
  const p=parse(raw); if(!p) return ['fmt','Bitte nur eine Zahl eintragen, z. B. 0,2335.'];
  if(F.ganz) return p.v===F.soll?['ok','']:['no','Wie oft wird das Experiment wiederholt? Das ist n.'];
  if(F.pw){ const v=p.pc?p.v/100:p.v; if(Math.abs(v-F.soll)<1e-9) return ['ok',''];
    if(Math.abs(v-(1-F.soll))<1e-9) return ['no','Das ist die Gegen-Wahrscheinlichkeit. p gehört zu dem, was X zählt.'];
    return ['no','p ist die Wahrscheinlichkeit für einen Treffer, als Dezimalzahl, z. B. 0,25.']; }
  if(p.pc||p.v>1){ return ['fmt','Bitte als Dezimalzahl zwischen 0 und 1 eintragen, nicht in %.']; }
  const soll=F.soll, s4=r4(soll);
  if(Math.abs(p.v-s4)<1e-9 && p.dec<=4) return ['ok',''];
  if(Math.abs(p.v-soll)<5e-5) return ['fmt','Der Wert stimmt – bitte auf 4 Stellen nach dem Komma runden.'];
  if(p.dec<4 && Math.abs(p.v-soll)<0.006) return ['fmt','Fast – bitte genau 4 Stellen nach dem Komma angeben.'];
  const near=w=>Math.abs(p.v-w)<6e-5;
  const {n,p:pp,kk,op}=F;
  if(op==='iv') return ['no','Das stimmt noch nicht. Prüfen Sie die Grenzen. Kommazahl mit Punkt eingegeben?'];
  if(op==='=' && near(cdf(n,pp,kk))) return ['no','Das ist P(X ≤ '+kk+'). Gesucht ist genau '+kk+' → Binomial Pdf (Taste D).'];
  if(op==='≤' && near(pdf(n,pp,kk))) return ['no','Das ist P(X = '+kk+'). Gesucht ist höchstens '+kk+' → Binomial Cdf (Taste E).'];
  if(op==='≤' && near(cdf(n,pp,kk-1))) return ['no','Höchstens '+kk+' schließt '+kk+' mit ein. Obere Grenze = '+kk+'.'];
  if(op==='≤' && near(1-cdf(n,pp,kk))) return ['no','Untere Grenze 0, obere Grenze '+kk+'. Haben Sie die Grenzen vertauscht?'];
  if(near(op==='='?pdf(n,1-pp,kk):cdf(n,1-pp,kk))) return ['no','Stimmt p? Sie haben mit '+dp(Math.round((1-pp)*100)/100)+' gerechnet.'];
  return ['no','Das stimmt noch nicht. Prüfen Sie n, p und k. Kommazahl mit Punkt eingegeben?'];
}
function pruefen(){
  let ok=0;
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent='';
    const [st,t]=check(F,document.getElementById('i_'+F.k).value);
    if(st==='leer') return;
    f.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
  });
  const tot=A.felder.length; stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(F=>{
    const f=document.getElementById('f_'+F.k), msg=f.querySelector('.msg');
    if(f.classList.contains('ok')) return;
    f.classList.add('show');
    if(F.iv){ document.querySelectorAll('#z_'+F.k+' button').forEach((b,j)=>{ b.classList.remove('bad'); b.classList.toggle('on',j>=F.lo&&j<=F.hi); });
      msg.innerHTML='Lösung: untere Grenze '+F.lo+', obere Grenze '+F.hi+' → ≈ '+de4(F.soll)+' &nbsp;<span class="liste">binomCdf('+F.n+','+F.p+','+F.lo+','+F.hi+')</span>'; }
    else if(F.ganz) msg.innerHTML='Lösung: '+F.soll;
    else if(F.pw) msg.innerHTML='Lösung: '+dp(F.soll);
    else msg.innerHTML='Lösung: '+PX(F.op,F.kk)+' ≈ '+de4(F.soll)+' &nbsp;<span class="liste">'+(F.op==='='?`binomPdf(${F.n},${F.p},${F.kk})`:`binomCdf(${F.n},${F.p},0,${F.kk})`)+'</span>';
  });
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>
</body></html>
