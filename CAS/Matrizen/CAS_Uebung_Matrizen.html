<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Matrizen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 12px; }
.geg{ display:flex; flex-wrap:wrap; gap:10px 34px; align-items:center; font-family:Cambria,Georgia,serif; font-size:22px; }
.ziel{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-family:Cambria,Georgia,serif; font-size:22px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; font-size:13px; }
.vorlage{ font-size:14px; color:var(--mute); margin-top:12px; }
/* Matrix mit eckigen Klammern */
.mx{ display:inline-flex; align-items:stretch; vertical-align:middle; margin:2px 4px; }
.mx::before,.mx::after{ content:""; width:6px; border:2px solid currentColor; }
.mx::before{ border-right:0; } .mx::after{ border-left:0; }
.mx table{ border-collapse:collapse; }
.mx td{ padding:1px 9px; text-align:center; font-size:20px; line-height:1.55; min-width:30px; }
.mx.in td{ padding:4px 5px; }
.mx.in input{ font:inherit; font-size:17px; width:62px; padding:4px 6px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:center; }
.mx.in input.ok{ background:var(--okbg); border-color:var(--ok); color:var(--ok); font-weight:bold; }
.mx.in input.no{ background:var(--nobg); border-color:var(--no); color:var(--no); }
.mx.in input.fmt{ background:var(--warnbg); border-color:#F2B705; }
.mx.in input.show{ background:#eef3fb; border-color:var(--lf); color:var(--lf); }
.ein{ font:inherit; font-size:18px; width:110px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:center; }
.ein.ok{ background:var(--okbg); border-color:var(--ok); color:var(--ok); font-weight:bold; } .ein.no{ background:var(--nobg); border-color:var(--no); color:var(--no); } .ein.show{ background:#eef3fb; border-color:var(--lf); color:var(--lf); } .ein.fmt{ background:var(--warnbg); border-color:#F2B705; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:16px; line-height:1.1; }
.fr span:first-child{ border-bottom:1px solid currentColor; padding:0 2px; }
.msg{ font-size:14.5px; margin-top:10px; min-height:22px; }
.msg.no{ color:var(--no); } .msg.warn{ color:var(--warn); } .msg.ok{ color:var(--ok); font-weight:bold; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:8px; }
.hinweis{ font-size:13.5px; color:var(--mute); }
@media (max-width:520px){ .geg,.ziel{ font-size:18px; } .mx td{ font-size:17px; padding:1px 6px; min-width:22px; } .mx.in input{ width:48px; font-size:15px; } }

/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

<script>
// ---------- Rechnen mit ganzen Zahlen und Brüchen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RZ=(a,b)=>{ let v; do v=R(a,b); while(v===0); return v; };
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const Q=(p,q=1)=>{ if(q<0){p=-p;q=-q;} const g=gcd(p,q); return {p:p/g,q:q/g}; };
const mat=(r,c,f)=>Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>f(i,j)));
const rnd=(r,c,a=-5,b=6)=>mat(r,c,()=>R(a,b));
const add=(A,B,s=1)=>mat(A.length,A[0].length,(i,j)=>A[i][j]+s*B[i][j]);
const smul=(k,A)=>mat(A.length,A[0].length,(i,j)=>k*A[i][j]);
const mul=(A,B)=>mat(A.length,B[0].length,(i,j)=>A[i].reduce((s,v,t)=>s+v*B[t][j],0));
const tr=A=>mat(A[0].length,A.length,(i,j)=>A[j][i]);
function det(A){ const n=A.length; if(n===1) return A[0][0]; if(n===2) return A[0][0]*A[1][1]-A[0][1]*A[1][0];
  return A[0].reduce((s,v,j)=>s+(j%2?-1:1)*v*det(A.slice(1).map(r=>r.filter((_,k)=>k!==j))),0); }
function inv(A){ const n=A.length, d=det(A);
  return mat(n,n,(i,j)=>{ const m=A.filter((_,r)=>r!==j).map(r=>r.filter((_,k)=>k!==i)); return Q(((i+j)%2?-1:1)*(n===1?1:det(m)),d); }); }
const mi=v=>v<0?'−'+(-v):''+v;
const show=x=>typeof x==='object'?(x.q===1?mi(x.p):(x.p<0?'−':'')+`<span class="fr"><span>${Math.abs(x.p)}</span><span>${x.q}</span></span>`):mi(x);
const txt=x=>typeof x==='object'?(x.q===1?mi(x.p):mi(x.p)+'/'+x.q):mi(x);
const val=x=>typeof x==='object'?x.p/x.q:x;
const M=A=>'<span class="mx"><table>'+A.map(r=>'<tr>'+r.map(v=>`<td>${show(v)}</td>`).join('')+'</tr>').join('')+'</table></span>';
const N=(n,A)=>`<span><i>${n}</i> = ${M(A)}</span>`;

// ---------- Aufgaben ----------
function unimod(n){ // ganzzahlige Matrix mit det = ±1, damit die Inverse ganzzahlig ist
  for(;;){
    const L=mat(n,n,(i,j)=>i===j?1:(i>j?R(-2,2):0)), U=mat(n,n,(i,j)=>i===j?pick([1,-1]):(i<j?R(-2,2):0));
    const A=mul(L,U); const I=inv(A);
    if(A.flat().every(v=>Math.abs(v)<=6) && I.flat().every(x=>Math.abs(val(x))<=15) && A.flat().filter(v=>v===0).length<=n) return A;
  }
}
function invNice(){ // 2×2 mit kleiner Determinante: Brüche möglich
  for(;;){ const A=rnd(2,2,-5,6); const d=det(A); if([1,-1,2,-2,4,-4,5,-5].includes(d)) return A; }
}
function hoch(){ // höhere Potenz A^k mit kleinen Einträgen
  const n=pick([2,2,3]), k=n===2?pick([3,4,5]):pick([3,4]);
  let A,P; do{ A=rnd(n,n,-2,3); P=A; for(let i=1;i<k;i++) P=mul(P,A); } while(P.flat().some(v=>Math.abs(v)>999) || A.flat().filter(v=>v===0).length>n);
  return {t:`A<sup>${k}</sup>`, geg:[['A',A]], erg:P, store:'a', fehl:[[mat(n,n,(i,j)=>A[i][j]**k),`Nicht jeden Eintrag einzeln potenzieren! Im CAS: a^${k}.`]]};
}
const MODES={
 add:{name:'Addition & Skalar', gen(){
   const n=pick([2,3]), r=n, c=pick([n,n,3]);
   const A=rnd(r,c), B=rnd(r,c), k=pick([2,3,4,-2,-3,5]);
   return pick([
    {t:'A + B', geg:[['A',A],['B',B]], erg:add(A,B), store:'a, b'},
    {t:'A − B', geg:[['A',A],['B',B]], erg:add(A,B,-1), store:'a, b', fehl:[[add(B,A,-1),'Reihenfolge beachten: gesucht ist <i>A</i> − <i>B</i>, nicht <i>B</i> − <i>A</i>.']]},
    {t:`${mi(k)} · A`, geg:[['A',A]], erg:smul(k,A), store:'a'}
   ]); }},
 mul:{name:'Multiplikation & Potenz', gen(){
   const n=pick([2,3]); const A=rnd(n,n,-4,5), B=rnd(n,n,-4,5);
   return pick([
    {t:'A · B', geg:[['A',A],['B',B]], erg:mul(A,B), store:'a, b', fehl:[[mul(B,A),'Das ist <i>B</i> · <i>A</i>. Reihenfolge beachten: <i>A</i> · <i>B</i> ≠ <i>B</i> · <i>A</i>.'],[mat(n,n,(i,j)=>A[i][j]*B[i][j]),'Nicht Eintrag mal Eintrag! Matrixprodukt: Zeile mal Spalte – im CAS a × b.']]},
    {t:'B · A', geg:[['A',A],['B',B]], erg:mul(B,A), store:'a, b', fehl:[[mul(A,B),'Das ist <i>A</i> · <i>B</i>. Reihenfolge beachten: <i>B</i> · <i>A</i> ≠ <i>A</i> · <i>B</i>.']]},
    {t:'A²', geg:[['A',A]], erg:mul(A,A), store:'a', fehl:[[mat(n,n,(i,j)=>A[i][j]**2),'Nicht jeden Eintrag einzeln quadrieren! <i>A</i>² = <i>A</i> · <i>A</i>, im CAS a^2.']]},
    hoch()
   ]); }},
 inv:{name:'Inverse & Determinante', gen(){
   const typ=pick(['det','inv','inv']);
   if(typ==='det'){ const n=pick([2,3,3]); const A=rnd(n,n,-5,6); return {t:'det(A)', geg:[['A',A]], zahl:det(A), store:'a'}; }
   const A=Math.random()<.5?unimod(3):(Math.random()<.5?unimod(2):invNice());
   return {t:'A<sup>−1</sup>', geg:[['A',A]], erg:inv(A), store:'a'};
 }},
 tr:{name:'Transponieren', gen(){
   const r=R(2,3), c=pick([2,3,4].filter(x=>x!==r)); const A=rnd(r,c,-6,9);
   return {t:'A<sup>T</sup>', geg:[['A',A]], erg:tr(A), store:'a', dims:true};
 }}
};
const ORDER=['add','mul','inv','tr'];
const TIPS={
 add:'Matrix eingeben: menu ▸ 7 ▸ 1 ▸ 1 · speichern: ▶, dann ctrl var → <span class="liste">a</span> · rechnen: <span class="liste">a+b</span>, <span class="liste">3×a</span>',
 mul:'Malzeichen nicht vergessen: <span class="liste">a×b</span> · Potenzen: <span class="liste">a^2</span>, <span class="liste">a^5</span>',
 inv:'Determinante: <span class="liste">det(a)</span> · Inverse: <span class="liste">a^(−)1</span> – Hochzahl −1 mit der Taste (−)',
 tr:'Transponieren: <span class="liste">a</span>, dann menu ▸ 7 ▸ 2'
};
let mode=(location.hash||'').slice(1); if(!MODES[mode]) mode='add';
let A=null, stat={a:0,r:0};
const $=id=>document.getElementById(id);

function neu(){
  A=MODES[mode].gen();
  $('tabs').innerHTML=ORDER.map(m=>`<button class="${m===mode?'on':''}" data-m="${m}">${MODES[m].name}</button>`).join('');
  $('h').textContent='Aufgabe: '+MODES[mode].name;
  $('auftrag').innerHTML=`Speichern Sie ${A.geg.length>1?'die Matrizen':'die Matrix'} im CAS und berechnen Sie <b><i>${A.t}</i></b>.`;
  $('geg').innerHTML=A.geg.map(g=>N(g[0],g[1])).join('');
  $('vorlage').innerHTML=TIPS[mode];
  if(A.zahl!==undefined){
    $('ziel').innerHTML=`<span><i>${A.t}</i> =</span><input class="ein" id="z" autocomplete="off">`;
  } else {
    const r=A.erg.length, c=A.erg[0].length;
    $('ziel').innerHTML=`<span><i>${A.t}</i> =</span><span class="mx in"><table>`+A.erg.map((row,i)=>'<tr>'+row.map((_,j)=>`<td><input id="c_${i}_${j}" autocomplete="off" aria-label="Zeile ${i+1}, Spalte ${j+1}"></td>`).join('')+'</tr>').join('')+'</table></span>';
  }
  $('msg').className='msg'; $('msg').innerHTML='';
  document.querySelectorAll('#ziel input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){
  s=s.trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(',','.');
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m=s.match(/^(-?\d+)\/(-?\d+)$/); if(m && +m[2]!==0) return +m[1]/+m[2];
  return null;
}
const eq=(a,b)=>Math.abs(a-b)<1e-9;
function pruefen(){
  const msg=$('msg'); msg.className='msg'; msg.innerHTML='';
  if(A.zahl!==undefined){
    const el=$('z'), v=parse(el.value); el.className='ein';
    if(!el.value.trim()) return;
    stat.a++;
    if(v===null){ el.classList.add('fmt'); msg.className='msg warn'; msg.textContent='Bitte nur eine Zahl eintragen.'; }
    else if(eq(v,A.zahl)){ el.classList.add('ok'); msg.className='msg ok'; msg.textContent='Richtig! Klicken Sie auf „Neue Aufgabe“.'; stat.r++; }
    else { el.classList.add('no'); msg.className='msg no'; msg.innerHTML= eq(v,-A.zahl)?'Vorzeichen prüfen: negative Zahlen mit der Taste (−) eintippen.':'Das stimmt noch nicht. Prüfen Sie die Eingabe der Matrix.'; }
    show_stats(); return;
  }
  const r=A.erg.length, c=A.erg[0].length; let ok=0, leer=0, fmt=0; const ein=[];
  for(let i=0;i<r;i++){ ein.push([]); for(let j=0;j<c;j++){
    const el=$(`c_${i}_${j}`); el.className=''; const raw=el.value.trim(); const v=parse(raw); ein[i].push(v);
    if(!raw){ leer++; continue; }
    if(v===null){ el.classList.add('fmt'); fmt++; continue; }
    if(eq(v,val(A.erg[i][j]))){ el.classList.add('ok'); ok++; } else el.classList.add('no');
  } }
  if(leer===r*c) return;
  stat.a++;
  const n=r*c;
  if(ok===n){ msg.className='msg ok'; msg.textContent=`Alles richtig! ${ok} von ${n}. Klicken Sie auf „Neue Aufgabe“.`; stat.r++; show_stats(); return; }
  let hinweis='';
  for(const [W,t] of (A.fehl||[])){ if(W.every((row,i)=>row.every((x,j)=>ein[i][j]!==null&&eq(ein[i][j],val(x))))){ hinweis=t; break; } }
  if(!hinweis && A.dims){ const T=tr(A.erg); if(T.length===r && T.every((row,i)=>row.every((x,j)=>ein[i][j]!==null&&eq(ein[i][j],x)))) hinweis='Das ist wieder <i>A</i>. Beim Transponieren werden die Zeilen zu Spalten.'; }
  if(!hinweis && fmt) hinweis='Bitte nur Zahlen oder Brüche wie 3/5 eintragen.';
  if(!hinweis && leer) hinweis='Es fehlen noch Einträge.';
  msg.className='msg no'; msg.innerHTML=`${ok} von ${n} Einträgen richtig.`+(hinweis?' '+hinweis:'');
  show_stats();
}
function show_stats(){ $('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`; }
function zeigen(){
  if(A.zahl!==undefined){ const el=$('z'); if(!el.classList.contains('ok')){ el.value=txt(A.zahl); el.className='ein show'; } return; }
  A.erg.forEach((row,i)=>row.forEach((x,j)=>{ const el=$(`c_${i}_${j}`); if(!el.classList.contains('ok')){ el.value=txt(x).replace(/-/g,'−'); el.className='show'; } }));
  $('msg').className='msg'; $('msg').textContent='Lösung eingeblendet (blau).';
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
neu();
</script>
</body></html>
