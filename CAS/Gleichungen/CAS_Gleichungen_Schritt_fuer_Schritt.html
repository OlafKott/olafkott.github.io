<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS Schritt für Schritt: Gleichungen lösen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:1000px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1 1 auto; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.tabs{ max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.tabs button.fertig::after{ content:" ✓"; color:var(--ab); font-weight:bold; }
.tabs button.on.fertig::after{ color:#9fe0a5; }
main{ max-width:1000px; margin:14px auto 30px; padding:0 16px; display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

/* ---------- Rechner ---------- */
.calc{ width:330px; flex:0 0 330px; background:#E8562A; border-radius:30px; padding:0 13px; box-shadow:0 6px 22px rgba(0,0,0,.18); }
.body{ background:#2b2b2f; border-radius:22px; padding:12px 12px 16px; }
.face{ background:#151518; border-radius:14px; padding:8px 10px 10px; margin:-4px -4px 10px; }
.brand{ text-align:center; font:bold 12px Arial,sans-serif; color:#E8562A; letter-spacing:.5px; margin-bottom:6px; }
.brand b{ color:#fff; margin-left:6px; }
.scrwrap{ background:#000; border-radius:4px; padding:4px; }
.scr{ width:280px; height:210px; background:#fff; position:relative; overflow:hidden; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#000; margin:0 auto; }
.nav{ display:grid; grid-template-columns:52px 1fr 52px; gap:6px; margin-top:10px; align-items:center; }
.nav .col{ display:flex; flex-direction:column; gap:7px; }
.pad{ width:112px; height:84px; margin:0 auto; background:#3a3a3f; border-radius:20px; position:relative; }
.pad .k{ position:absolute; background:transparent; color:#aaa; font-size:10px; border:0; }
.pad .k[data-k=up]{ left:38px; top:2px; width:36px; height:20px; }
.pad .k[data-k=down]{ left:38px; bottom:2px; width:36px; height:20px; }
.pad .k[data-k=left]{ left:2px; top:28px; width:22px; height:28px; }
.pad .k[data-k=right]{ right:2px; top:28px; width:22px; height:28px; }
.pad .k[data-k=click]{ left:38px; top:24px; width:36px; height:36px; background:#4b4b52; border-radius:9px; color:#ddd; }
.k{ font:600 11px Arial,sans-serif; color:#fff; background:#4a4a50; border:0; border-radius:6px; height:24px; padding:0; cursor:pointer; transition:transform .15s, box-shadow .15s; }
.k:focus{ outline:none; } .k:active{ transform:scale(.95); }
.k.lt{ background:#8e8e95; color:#111; font-size:14px; }
.k.ctrl{ background:#D93A2B; }
.k.bk{ background:#26262a; border:1px solid #555; }
.k.hit{ box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.12); z-index:2; position:relative; }
.pad .k.hit{ position:absolute; }
.k.good{ box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8); }
.k.bad{ box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack .35s; }
.k.held{ box-shadow:0 0 0 3px #fff, 0 0 10px 2px rgba(255,255,255,.7); }
@keyframes wack{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.row4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0; }
.main7{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px 5px; }
.let9{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px 4px; margin-top:10px; }
.let9 .k{ height:20px; font-size:10px; }
.span2{ grid-column:span 2; } .span3{ grid-column:span 3; }
.k sub{ font-size:7px; color:#ff9c8f; display:block; line-height:1; margin-top:-1px; }

/* ---------- Bildschirm-Inhalte ---------- */
.tb{ height:16px; background:#d9dee5; display:flex; align-items:center; gap:3px; padding:0 4px; font-size:9.5px; color:#333; border-bottom:1px solid #aab3bf; }
.tb .tab{ background:#fff; border:1px solid #aab3bf; border-bottom:0; padding:0 5px; border-radius:3px 3px 0 0; height:13px; line-height:12px; margin-top:3px; white-space:nowrap; }
.tb .tab.off{ background:#eef1f5; color:#777; }
.tb .tab.np{ background:#fff4c9; border-color:#d1b24a; font-weight:bold; }
.scr.tabhl .tb .tab.pg{ background:#F2B705; color:#111; font-weight:bold; border-color:#b88a00; box-shadow:0 0 6px 1px rgba(242,183,5,.8); animation:pulse 1.2s ease-in-out infinite; }
.scr.tabhl .tb .tab.pg.off{ background:#FFE9A8; color:#5a4500; }
.tb .docn{ font-weight:bold; margin-right:3px; }
.tb .sp{ flex:1; } .tb .bat{ width:16px; height:7px; border:1px solid #555; border-radius:1px; position:relative; }
.tb .bat:after{ content:""; position:absolute; left:1px; top:1px; bottom:1px; width:10px; background:#3a3; }
.calcapp{ padding:2px 6px; font-size:11.5px; position:absolute; left:0; right:0; top:16px; bottom:0; display:flex; flex-direction:column; justify-content:flex-end; }
.calcapp .ln{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:2px 0; min-height:19px; }
.calcapp .ln span, .calcapp .ln b{ padding:0 2px; border-radius:2px; }
.calcapp .ln .sel{ background:#3b78c2; color:#fff; }
.calcapp .ln b{ font-weight:normal; margin-left:auto; }
.calcapp .ln b i, .calcapp .ln span i{ font-style:normal; }
.calcapp .cur{ border:1px solid #888; min-height:20px; margin:3px 0 2px; padding:1px 3px; display:flex; align-items:center; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 1px; font-size:10px; line-height:1.1; }
.fr > span{ padding:0 2px; min-width:7px; }
.fr > span:first-child{ border-bottom:1px solid currentColor; }
.fr > span:empty::after, .rad:empty::after, sup:empty::after{ content:"\25A1"; color:#999; }
.rt{ white-space:nowrap; } .rad{ border-top:1px solid currentColor; padding:0 1px; }
.calcapp sup{ font-size:8px; }
.caret{ animation:blink 1s steps(1) infinite; font-weight:normal; } @keyframes blink{ 50%{opacity:0} }
.menu{ position:absolute; background:#fff; border:1px solid #6b7a8c; box-shadow:2px 2px 6px rgba(0,0,0,.3); width:178px; font-size:10.5px; z-index:3; }
.menu div{ padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.menu div.sel{ background:#3b78c2; color:#fff; }
.dlg{ position:absolute; left:8px; right:8px; top:22px; background:#f4f6f9; border:1px solid #6b7a8c; box-shadow:2px 2px 8px rgba(0,0,0,.35); font-size:10.5px; z-index:4; }
.dlg .tt{ background:#c9d3df; font-weight:bold; padding:2px 6px; }
.dlg .ff{ display:grid; grid-template-columns:112px 1fr; gap:3px 5px; padding:5px 7px 3px; align-items:center; }
.dlg .lb{ text-align:right; }
.dlg .ct{ background:#fff; border:1px solid #9aa5b3; height:14px; padding:0 4px; display:flex; justify-content:space-between; align-items:center; font-size:10px; }
.dlg .ct.fo{ outline:2px solid #3b78c2; }
.dlg .ct.mark{ background:#FFF3C4; }
.dlg .bt{ display:flex; justify-content:flex-end; gap:5px; padding:3px 7px 6px; font-size:10px; }
.dlg .bt span{ border:1px solid #8a95a3; background:#fff; padding:0 7px; border-radius:3px; }
.hs{ position:absolute; inset:0; background:linear-gradient(#2a2f36,#14171b 70%); color:#f2f4f7; font-family:Arial,Helvetica,sans-serif; }
.hs .hb{ height:15px; display:flex; align-items:center; justify-content:space-between; padding:0 6px; background:linear-gradient(#4a4f57,#2c3036); border-bottom:1px solid #555; }
.hs .hb .bt2{ width:15px; height:7px; border:1px solid #cfd3d8; border-radius:1px; position:relative; }
.hs .hb .bt2:after{ content:""; position:absolute; left:1px; top:1px; bottom:1px; width:9px; background:#6ccf5a; }
.hs .cols{ display:flex; gap:10px; padding:7px 10px 0; }
.hs .col{ flex:1; }
.hs h5{ margin:0 0 3px; font-size:11.5px; font-weight:bold; color:#8fc3ff; display:flex; align-items:center; gap:5px; }
.hs h5 i{ display:inline-block; width:10px; height:11px; background:#8fc3ff; border-radius:1px; transform:skewX(-8deg); }
.hs .it{ display:flex; align-items:center; gap:5px; font-size:11px; padding:1px 3px; border-radius:2px; height:16px; white-space:nowrap; }
.hs .it b{ display:inline-block; min-width:11px; height:11px; line-height:11px; text-align:center; font-size:8.5px; background:#c9ced6; color:#1b1e22; border-radius:2px; }
.hs .it.dim{ color:#6f757d; } .hs .it.dim b{ background:#555a61; color:#2a2d31; }
.hs .it.sel{ background:#3b78c2; color:#fff; }
.hs .it.ziel{ background:#F2B705; color:#111; font-weight:bold; box-shadow:0 0 7px 2px rgba(242,183,5,.75); animation:pulse 1.2s ease-in-out infinite; }
.hs .it.ziel b{ background:#111; color:#F2B705; }
.menu div.ziel{ background:#F2B705 !important; color:#111 !important; font-weight:bold; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ box-shadow:0 0 2px 0 rgba(242,183,5,.3); } }
.hs .icons{ position:absolute; left:6px; right:6px; bottom:21px; display:flex; justify-content:space-between; }
.hs .icons span{ width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
.hs .icons span.on{ outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 8px 2px rgba(255,255,255,.6); }
.hs .icons svg{ width:20px; height:20px; }
.hs .ft{ position:absolute; left:0; right:0; bottom:3px; font-size:9.5px; text-align:center; font-weight:bold; white-space:nowrap; overflow:hidden; }
table.sh{ border-collapse:collapse; table-layout:fixed; width:280px; }
table.sh td{ border:1px solid #c9ced6; height:15px; padding:0 3px; font-size:10.5px; }
table.sh td.rn{ width:16px; background:#eef1f5; color:#666; text-align:center; padding:0; font-size:9px; }
table.sh tr.hd td{ height:18px; background:#eef1f5; font-weight:bold; }
table.sh td.cur{ outline:2px solid #000; outline-offset:-2px; }
.files{ padding:4px 8px; font-size:11px; }
.files .hd{ font-weight:bold; border-bottom:1px solid #ccc; padding:2px 2px; display:flex; justify-content:space-between; }
.files .it{ padding:2px 4px; display:flex; justify-content:space-between; } .files .it.sel{ background:#3b78c2; color:#fff; }
.pwroff{ position:absolute; inset:0; background:#20242a; color:#9aa3ad; display:flex; align-items:center; justify-content:center; font-size:12px; }

/* ---------- Panel ---------- */
.panel{ flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.prog{ display:flex; gap:4px; margin-bottom:12px; }
.prog i{ flex:1; height:5px; border-radius:3px; background:#e3e6eb; cursor:pointer; }
.prog i.done{ background:#9aa3b0; } .prog i.now{ background:var(--lf); }
.prog i.abp{ background:#bfe3c3; } .prog i.abp.done{ background:#7cbf84; } .prog i.abp.now{ background:var(--ab); }
.nr{ font-size:13px; color:var(--mute); }
.panel h2{ margin:2px 0 8px; font-size:20px; line-height:1.3; }
.panel p{ margin:0 0 10px; font-size:15.5px; }
.keys{ display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px; }
.chip{ font:600 13px Arial,sans-serif; background:#2b2b2f; color:#fff; border-radius:5px; padding:3px 9px; border:2px solid transparent; }
.chip.ctrl{ background:#D93A2B; } .chip.lt{ background:#8e8e95; color:#111; }
.chip.done{ opacity:.35; }
.chip.now{ border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35); }
.chip.big{ font-size:16px; padding:4px 12px; vertical-align:middle; }
.chip.plus{ background:none; color:var(--mute); padding:3px 2px; }
.note{ background:#FFF8E8; border-left:4px solid var(--hit); border-radius:4px; padding:7px 12px; font-size:14.5px; margin:0 0 10px; }
.note b{ color:#8a5a00; }
.stat{ min-height:38px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; background:var(--bg); border-radius:8px; padding:6px 12px; margin:6px 0 12px; }
.stat .ok{ color:#2E7D32; font-weight:bold; } .stat .err{ color:#C62828; font-weight:bold; }
.ab{ border:2px solid var(--ab); background:#F1F8F1; border-radius:10px; padding:10px 14px 6px; margin:0 0 12px; }
.ab .abt{ font-weight:bold; color:var(--ab); font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.ab .abt span{ font-size:22px; }
.ab ul{ margin:0 0 8px; padding-left:20px; font-size:15px; }
.ab li{ margin-bottom:3px; }
.ab p{ font-size:14.5px; }
.ab .tx{ font-family:Consolas,'Courier New',monospace; background:#e2eee3; border-radius:3px; padding:0 4px; }
.task{ border:1px solid var(--line); border-left:5px solid var(--lf); border-radius:8px; padding:6px 14px 8px; margin:0 0 12px; font-size:14.5px; background:#fafbfc; }
.task b{ color:var(--lf); }
.task .auf{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--mute); }
.task .term{ font-family:Cambria,Georgia,serif; font-size:24px; line-height:1.5; color:var(--ink); }
.task .term .fr{ font-size:20px; } .task .term .rad{ padding:0 3px; }
.cmd{ font-family:Consolas,'Courier New',monospace; font-size:21px; background:#eceef1; border-radius:4px; padding:0 6px; }
.btns{ display:flex; gap:10px; margin-top:14px; }
.btns button{ font:inherit; font-size:16px; padding:9px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); color:#fff; border-color:var(--lf); }
.btns button:disabled{ opacity:.4; cursor:default; }
#next{ margin-left:auto; }
.opt{ font-size:13.5px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:10px; }
.hint{ font-size:12.5px; color:var(--mute); margin-top:10px; }
.vgl{ border-collapse:collapse; font-size:14px; margin:4px 0 10px; width:100%; }
.vgl th,.vgl td{ border:1px solid #cfd4dc; padding:4px 8px; text-align:left; vertical-align:top; }
.vgl th{ background:#eef0f3; }
@media (max-width:380px){ .calc{ transform:scale(.92); transform-origin:top center; } }

<script>
// ---------- Buchstabentasten ----------
(function(){
  const rows=[["EE","a","b","c","d","e","f","g","?!"],["π","h","i","j","k","l","m","n","⚑"],[",","o","p","q","r","s","t","u","↵"],["","v","w","x","y","z","␣"]];
  let h='';
  rows.forEach(r=>r.forEach(c=>{
    if(c==="") h+='<span></span>';
    else if(c==="␣") h+='<button class="k span3" data-k="space">␣</button>';
    else h+=`<button class="k" data-k="${c}">${/^[a-z]$/.test(c)?c.toUpperCase():c}</button>`;
  }));
  document.getElementById('let9').innerHTML=h;
})();

// ---------- Bildschirm-Bausteine ----------
function topbar(tabs,cur,doc){
  if(tabs==='np') return '<div class="tb"><span class="tab np">Notizblock</span><span class="sp"></span><span>RAD</span><span class="bat"></span></div>';
  return '<div class="tb">'+(doc?`<span class="docn">${doc}</span>`:'')+tabs.map(t=>`<span class="tab pg ${t===cur?'':'off'}">${t}</span>`).join('')+'<span class="sp"></span><span>RAD</span><span class="bat"></span></div>';
}
function home(mark){
  const it=(k,t,dim)=>`<div class="it ${k===mark?'sel':''} ${dim?'dim':''}" data-z="${k.toLowerCase()}"><b>${k}</b>${t}</div>`;
  const ic=(bg,svg,on)=>`<span class="${on?'on':''}" style="background:${bg}"><svg viewBox="0 0 20 20">${svg}</svg></span>`;
  const W='stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"';
  const icons=[
   ic('linear-gradient(#e8e9eb,#9ea3a9)','<rect x="2" y="2" width="7" height="7" rx="1" fill="#5b6470"/><rect x="11" y="2" width="7" height="7" rx="1" fill="#5b6470"/><rect x="2" y="11" width="7" height="7" rx="1" fill="#5b6470"/><rect x="11" y="11" width="7" height="7" rx="1" fill="#5b6470"/><path d="M3.5 5.5h4M5.5 3.5v4M12.5 5.5h4M3.5 14.5h4M12.5 13.5h4M12.5 15.5h4" stroke="#fff" stroke-width="1"/>',!mark),
   ic('linear-gradient(#bfe0ff,#3d8fe0)','<path d="M3 4c3 13 11 13 14 0" '+W+'/><path d="M2 16h16M10 2v16" stroke="#fff" stroke-width=".8"/>'),
   ic('linear-gradient(#b5d4ff,#2f6fd0)','<path d="M3 17L10 3l7 14z" '+W+'/>'),
   ic('linear-gradient(#d6f2df,#5fbf7c)','<rect x="2.5" y="3" width="15" height="14" fill="#fff"/><path d="M2.5 7.5h15M2.5 12h15M7.5 3v14M12.5 3v14" stroke="#4a9a62" stroke-width="1"/>'),
   ic('linear-gradient(#ffc8ec,#d53fa7)','<rect x="3" y="10" width="3" height="7" fill="#fff"/><rect x="8.5" y="4" width="3" height="13" fill="#fff"/><rect x="14" y="7" width="3" height="10" fill="#fff"/>'),
   ic('linear-gradient(#fff3b0,#e6c13b)','<rect x="4" y="2" width="12" height="16" rx="1" fill="#fffbe6"/><path d="M6.5 7h7M6.5 10h7M6.5 13h5" stroke="#b08a10" stroke-width="1"/>'),
   ic('linear-gradient(#d4f5c9,#4fb043)','<path d="M8 2.5h4M9 2.5v5L4.5 16.5h11L11 7.5v-5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M6 14h8" stroke="#fff" stroke-width="1.5"/>')
  ].join('');
  const FT={A:'Notizblock: Berechnen',B:'Notizblock: Graph','1':'Neues Dokument','2':'Meine Dokumente','3':'Zuletzt verwendet','4':'Aktuelles Dokument','5':'Einstellungen'};
  return '<div class="hs"><div class="hb"><svg width="11" height="10" viewBox="0 0 11 10"><path d="M1 5L5.5 1 10 5M2.5 4v5h6V4" stroke="#e6e9ed" stroke-width="1.3" fill="none"/></svg><span class="bt2"></span></div>'+
   '<div class="cols"><div class="col"><h5><i></i>Notizblock</h5>'+it('A','Berechnen')+it('B','Graph')+it('C','QuickPoll',1)+'</div>'+
   '<div class="col"><h5><i></i>Dokumente</h5>'+it('1','Neues Dokument')+it('2','Meine Dokumente')+it('3','Zuletzt verw. ▸')+it('4','Aktuell')+it('5','Einstellungen')+'</div></div>'+
   `<div class="icons">${icons}</div><div class="ft">${FT[mark]||'<b>Calculator</b> zum Notizblock hinzufügen'}</div></div>`;
}
const APPS=["1: Calculator hinzufügen","2: Graphs hinzufügen","3: Geometry hinzufügen","4: Lists &amp; Spreadsheet hinzufügen","5: Data &amp; Statistics hinzufügen","6: Notes hinzufügen","7: Vernier DataQuest™ hinzufügen","8: Widget hinzufügen"];

function menus(levels){ return levels.map((m,i)=>`<div class="menu" style="left:${6+i*48}px;top:${22+i*26}px">`+m.items.map((t,j)=>`<div class="${j===m.sel?'sel':''}">${t}</div>`).join('')+'</div>').join(''); }
function sheet(tabs,cur,doc){
  let h=topbar(tabs,cur,doc)+'<table class="sh"><tr class="hd"><td class="rn"></td><td>A</td><td>B</td><td>C</td><td>D</td></tr>';
  for(let r=1;r<=10;r++) h+=`<tr><td class="rn">${r}</td><td class="${r===1?'cur':''}"></td><td></td><td></td><td></td></tr>`;
  return h+'</table>';
}
function calcApp(tabs,cur,lines,entry,o){
  o=o||{};
  return topbar(tabs,cur,o.doc)+'<div class="calcapp">'+lines.map((l,j)=>`<div class="ln"><span class="${o.sel===2*j?'sel':''}">${l[0]}</span><b class="${o.sel===2*j+1?'sel':''}">${l[1]}</b></div>`).join('')+`<div class="cur">${entry}</div></div>`;
}

const off=()=>'<div class="pwroff">Der Rechner ist aus.</div>';
const CM=["1: Aktionen","2: Zahl","3: Algebra","4: Analysis","5: Wahrscheinlichkeit","6: Statistik","7: Matrix &amp; Vektor","8: Finanzmathematik","9: Funktionen &amp; Programme"];
const AK=["1: Definieren","2: Definition abrufen","3: Variable löschen","4: a–z löschen…","5: Verlauf löschen","6: Kommentar einfügen","7: Bibliothek","8: Sperren"];

// ---------- Eingabezeile (Vorlagen: Bruch, Hochzahl, Wurzel) ----------
const SHOW={'*':'·','-':'−','neg':'−','/':'/'};
function Entry(){ this.root=[]; this.path=[{a:this.root}]; this.ctrl=false; }
Entry.prototype.top=function(){ return this.path[this.path.length-1]; };
Entry.prototype.key=function(k){
  const T=this.top();
  if(this.ctrl){ this.ctrl=false;
    if(k==='/'){ const f={t:'frac',n:[],d:[]}; T.a.push(f); this.path.push({a:f.n,f}); return; }
    if(k==='x2'){ const s={t:'sqrt',v:[]}; T.a.push(s); this.path.push({a:s.v}); return; }
    if(k==='neg'){ T.a.push('ans'); return; }
    if(k==='var'){ T.a.push('→'); return; }
    if(k==='tmpl'){ T.a.push(':='); return; }
    return;
  }
  if(k==='ctrl'){ this.ctrl=true; return; }
  if(k==='^'){ const s={t:'sup',v:[]}; T.a.push(s); this.path.push({a:s.v}); return; }
  if(k==='x2'){ T.a.push({t:'sup',v:['2']}); return; }
  if(k==='down'){ if(T.f&&T.a===T.f.n){ this.path.pop(); this.path.push({a:T.f.d,f:T.f}); } return; }
  if(k==='right'){ if(this.path.length>1) this.path.pop(); return; }
  if(k==='del'){ T.a.pop(); return; }
  if(k==='-'&&this.root.length===0){ T.a.push('ans','−'); return; }
  T.a.push(SHOW[k]||k);
};
function rnd(arr,curA,caret){
  let h=arr.map(t=>typeof t==='string'?t:
    t.t==='frac'?`<span class="fr"><span>${rnd(t.n,curA,caret)}</span><span>${rnd(t.d,curA,caret)}</span></span>`:
    t.t==='sup'?`<sup>${rnd(t.v,curA,caret)}</sup>`:
    `<span class="rt">√<span class="rad">${rnd(t.v,curA,caret)}</span></span>`).join('');
  if(caret&&arr===curA) h+='<span class="caret">|</span>';
  return h;
}
function ser(arr){ return arr.map(t=>typeof t==='string'?t:t.t==='frac'?`(${ser(t.n)})/(${ser(t.d)})`:t.t==='sup'?`^(${ser(t.v)})`:`√(${ser(t.v)})`).join(''); }
Entry.prototype.html=function(caret){ const h=rnd(this.root,this.top().a,caret!==false); return h; };

// ---------- Simulation: Ergebnisse je Schritt ----------
// offene Klammern beim enter automatisch schließen (wie am Handheld)
function closeP(arr,html){ const s=ser(arr); const n=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length; return html+')'.repeat(Math.max(0,n)); }
// simuliert Tastenfolge; res = Ergebnis(se) der enter-Taste(n)
function simR(hist,keys,res,pre){
  hist=hist.slice(); res=[].concat(res); let e=new Entry(), ri=0;
  for(const k of keys){
    if(k==='enter'){ const full=(pre||[]).concat(e.root); hist.push([closeP(full,rnd(full,null,false)), res[ri++]||'?']); e=new Entry(); pre=null; }
    else e.key(k);
  }
  return {hist,e};
}
function CS(tabs,cur,base,keys,res,o){ return i=>{ const r=simR(base,keys.slice(0,i),res); return calcApp(tabs,cur,r.hist,r.e.html(),o); }; }
const after=(base,keys,res)=>simR(base,keys,res).hist;
const pick=arr=>i=>arr[Math.max(0,Math.min(i,arr.length)-1)];
const CUR='<span class="caret">|</span>';
const F1=['1.1'], O={doc:'funk'};
const ALG=["1: Löse","2: Faktorisiere","3: Entwickle","4: Nullstellen","5: Quadratische Ergänzung","6: Numerische Lösung","7: Gleichungssystem lösen","8: Polynomwerkzeuge","9: Bruchwerkzeuge"];
const page=(hist,entry)=>calcApp(F1,'1.1',hist,entry===undefined?CUR:entry,O);

// ---------- Spur 1: Funktionen speichern ----------
const kF=["f","(","x",")","ctrl","tmpl","x","x2","-","4","x","+","1","enter"];
const kF3=["f","(","3",")","enter"], kFm2=["f","(","neg","2",")","enter"], kF15=["f","(","1",".","5",")","enter"];
const kG=["neg","0",".","5","x","x2","+","2","x","+","6","ctrl","var","g","(","x",")","enter"];
const kG4=["g","(","4",")","enter"];
const a0=[], a1=after(a0,kF,'Fertig'), a2=after(a1,kF3,'−2'), a3=after(a2,kFm2,'13'), a4=after(a3,kF15,'−2.75'), a5=after(a4,kG,'Fertig'), a6=after(a5,kG4,'6');

// ---------- Spur 2: Gleichungen lösen ----------
const s0=a1.slice();
const kS1=["f","(","x",")","=","6",",","x","enter"];
function sMenu(base,keys,res){
  const K=["menu","3","1"].concat(keys);
  return i=>{
    if(i===0) return page(base);
    if(i===1) return page(base,'')+menus([{items:CM,sel:0}]);
    if(i===2) return page(base,'')+menus([{items:CM,sel:2},{items:ALG,sel:0}]);
    const r=simR(base,keys.slice(0,i-3),res,['solve(']);
    if(i-3>=keys.length) return calcApp(F1,'1.1',r.hist,r.e.html(),O);
    const full=['solve('].concat(r.e.root);
    return calcApp(F1,'1.1',r.hist,rnd(full,r.e.top().a===r.e.root?full:r.e.top().a,true)+'<span style="color:#999">)</span>',O);
  };
}
const solveKeys=(arr)=>["s","o","l","v","e","("].concat(arr);
const kS2=solveKeys(["f","(","x",")","=","neg","2",",","x","enter"]);
const kS3=solveKeys(["3","x","-","7","=","1","1",",","x","enter"]);
const kS4=solveKeys(["f","(","x",")","=","0",",","x","enter"]);
const kS6=solveKeys(["f","(","x",")","=","neg","5",",","x","enter"]);
const R1='x=−1 <i>or</i> x=5', R2='x=1 <i>or</i> x=3', R3='x=6',
      R4='x=2−'+'<span class="rt">√<span class="rad">3</span></span>'+' <i>or</i> x=2+'+'<span class="rt">√<span class="rad">3</span></span>',
      R5='x=0.267949 <i>or</i> x=3.73205', R6='false';
const b1h=simR(s0,kS1,R1,['solve(']).hist;
const b2=after(b1h,kS2,R2), b3=after(b2,kS3,R3), b4=after(b3,kS4,R4);
const lastIn=b4[b4.length-1][0];
function s5(i){ // ▲ ▲ enter ctrl enter
  if(i===0) return page(b4);
  if(i<=2) return calcApp(F1,'1.1',b4,CUR,{doc:'funk',sel:b4.length*2-i});
  if(i<=4) return page(b4,lastIn+CUR);
  return page(b4.concat([[lastIn,R5]]));
}
const b5=b4.concat([[lastIn,R5]]);
const b6=after(b5,kS6,R6);

const AB=(nr,items)=>`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: Aufgabe ${nr}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Am eigenen Handheld rechnen, Ergebnisse eintragen, dann <b>Weiter</b>.</p></div>`;
const C=x=>`<span class="cmd">${x}</span>`;
const fx=(t)=>`<i>${t}</i>`;
const FTERM='<i>f</i>(<i>x</i>) = <i>x</i>² − 4<i>x</i> + 1';

const TRACKS={
 s:{ name:"Gleichungen lösen", start:()=>home(''), ab:1, steps:[
  {t:"Neues Dokument", a:"Neues Dokument mit Calculator-Seite", k:["1","1"], p:pick([appList(F1,'1.1',0),page([])]),
   d:"<p><b>1</b> = Neues Dokument, dann <b>1</b> = Calculator.</p>", n:"Ist schon ein Dokument offen, fragt das CAS, ob es speichern soll."},
  {t:"Erst die Funktion speichern", a:"Speichern Sie "+FTERM, k:kF, p:CS(F1,'1.1',a0,kF,'Fertig',O),
   d:"<p>Für solve brauchen wir eine Funktion. <b>ctrl + ⊞</b> (Taste rechts neben der 9) schreibt <b>:=</b>. Das CAS antwortet mit <b>Fertig</b>.</p>",
   n:"<b>:=</b> heißt „ist definiert als“. Erst der Name <b>f(x)</b>, dann der Term. <i>x</i>² mit der Taste <b>x²</b>."},
  {t:"solve über das Menü", a:"Lösen Sie "+fx('f')+"(<i>x</i>) = 6", k:["menu","3","1"].concat(kS1), p:sMenu(s0,kS1,R1),
   d:"<p><b>menu ▸ 3: Algebra ▸ 1: Löse</b> schreibt <b>solve( )</b>. Dann die Gleichung, ein <b>Komma</b> und die Variable <b>x</b>.</p>",
   n:"Das Komma ist links unten bei den Buchstabentasten. Die Klammer am Ende schließt das CAS selbst."},
  {t:"Ergebnis lesen", k:[], s:()=>page(b1h),
   d:"<p><b>or</b> heißt <b>oder</b>. Es gibt zwei Lösungen: <b><i>x</i> = −1</b> und <b><i>x</i> = 5</b>.</p><p>Probe: <i>f</i>(5) = 25 − 20 + 1 = 6 ✓</p>",
   n:"Eine Parabel trifft eine waagerechte Linie oft zweimal."},
  {t:"solve mit der Tastatur", a:"Lösen Sie "+fx('f')+"(<i>x</i>) = −2", k:kS2, p:CS(F1,'1.1',b1h,kS2,R2,O),
   d:"<p>Schneller: <b>solve(</b> mit den Buchstaben tippen. Ergebnis: <b><i>x</i> = 1 oder <i>x</i> = 3</b></p>"},
  {t:"Gleichung ohne Funktion", a:"Lösen Sie 3<i>x</i> − 7 = 11", k:kS3, p:CS(F1,'1.1',b2,kS3,R3,O),
   d:"<p>solve funktioniert mit jeder Gleichung. Ergebnis: <b><i>x</i> = 6</b></p>"},
  {t:"Lösung mit Wurzel", a:"Lösen Sie "+fx('f')+"(<i>x</i>) = 0", k:kS4, p:CS(F1,'1.1',b3,kS4,R4,O),
   d:"<p>Das CAS rechnet <b>exakt</b>: <i>x</i> = 2 − √3 oder <i>x</i> = 2 + √3</p>"},
  {t:"Als Dezimalzahl: ctrl + enter", a:"Dieselbe Gleichung als Dezimalzahl", k:["up","up","enter","ctrl","enter"], p:s5,
   d:"<p>2 × <b>▲</b> markiert die letzte Eingabe, <b>enter</b> holt sie nach unten, <b>ctrl + enter</b> rechnet dezimal.</p><p><i>x</i> ≈ 0,27 oder <i>x</i> ≈ 3,73</p>",
   n:"Auf dem Arbeitsblatt runden Sie auf zwei Nachkommastellen."},
  {t:"Keine Lösung: false", a:"Lösen Sie "+fx('f')+"(<i>x</i>) = −5", k:kS6, p:CS(F1,'1.1',b5,kS6,R6,O),
   d:"<p><b>false</b> heißt: Es gibt <b>keine Lösung</b>. Der Tiefpunkt von <i>f</i> liegt bei <i>y</i> = −3, tiefer kommt der Graph nicht.</p>"},
  {t:"Selbst rechnen", k:[], ab:1, s:()=>page(b6), d:AB(1,["a) Funktion <i>g</i> speichern und Gleichungen an den Pfeilen mit solve lösen","b) <i>g</i>(<i>x</i>) = −3 und c) <i>g</i>(<i>x</i>) = 6","Danach: Lösungscode eintragen"])}
 ]}
};

// ---------- Steuerung ----------
const ORDER=["s"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>document.getElementById(id);
const LBL={tmpl:"⊞",on:"⌂ on",doc:"doc",menu:"menu",enter:"enter",tab:"tab",ctrl:"ctrl",click:"Klick",down:"▼",up:"▲",right:"▶",left:"◀",x2:"x²",neg:"(−)",del:"del",var:"var",esc:"esc","/":"÷","*":"×","-":"−"};
const lbl=k=>LBL[k]||(/^[a-z]$/.test(k)?k.toUpperCase():k);
function chip(k,i){ const c=k==='ctrl'?'ctrl':(/^[0-9.]$/.test(k)||k==='neg'?'lt':''); const s=i<pos?'done':(i===pos?'now':''); return `<span class="chip ${c} ${s}">${lbl(k)}</span>`; }
function screenOf(t,s,i){
  const S=TRACKS[t].steps[s];
  if(S.p && (i>0 || !S.k.length)) return S.p(i);
  if(i>=S.k.length && S.s) return S.s();
  if(i>=S.k.length && S.p) return S.p(S.k.length);
  return s===0 ? TRACKS[t].start() : screenOf(t,s-1,TRACKS[t].steps[s-1].k.length);
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('keys').innerHTML=S.k.length?S.k.map(chip).join(''):(S.ab?'':'<span class="chip plus">Nur ablesen – keine Taste drücken</span>');
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  $('scr').innerHTML=screenOf(tr,st,pos);
  
  zielMarke(S.k[pos]);
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  const fin=pos>=S.k.length;
  if(last&&fin) done[tr]=true;
  $('next').className=fin?'go':'';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Überspringen';
  $('next').disabled=fin&&last&&!nextT;
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '';
  hint();
}
// Bildschirm-Eintrag markieren, den die nächste Taste auswählt
function zielMarke(k){
  if(!k || !/^[a-e0-9]$/.test(k)) return;
  const it=document.querySelector(`#scr .hs .it[data-z="${k}"]`);
  if(it){ it.classList.add('ziel'); return; }
  const ms=document.querySelectorAll('#scr .menu'); if(!ms.length) return;
  const m=ms[ms.length-1];
  [...m.children].forEach(d=>{ if(d.textContent.trim().startsWith(k+':')) d.classList.add('ziel'); });
}
function hint(){
  document.querySelectorAll('.k.hit,.k.held').forEach(e=>e.classList.remove('hit','held'));
  const S=TRACKS[tr].steps[st];
  if(pos>0&&S.k[pos-1]==='ctrl'&&pos<S.k.length){ const c=document.querySelector('.k[data-k="ctrl"]'); if(c) c.classList.add('held'); }
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },900); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(S.k[pos],pos).replace('now','now big')}`;
  }
}
function advance(){ const T=TRACKS[tr]; if(st<T.steps.length-1){ st++; pos=0; } render(); }
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }
document.querySelectorAll('.calc .k').forEach(b=>b.addEventListener('click',()=>{ b.blur(); press(b.dataset.k); }));
$('next').onclick=next; $('back').onclick=back;
$('tabs').onclick=e=>{ const t=e.target.dataset.t; if(t){ tr=t; st=0; pos=0; render(); } };
$('prog').onclick=e=>{ if(e.target.dataset.i){ st=+e.target.dataset.i; pos=0; render(); } };

const KMAP={Enter:'enter',Tab:'tab',Escape:'esc',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Control:'ctrl',Home:'on',Backspace:'del',Delete:'del',' ':'click'};
document.addEventListener('keydown',e=>{
  let k=KMAP[e.key]; if(!k && e.key.length===1 && /[0-9a-zA-Z.()+\-*\/^,=]/.test(e.key)) k=e.key.toLowerCase();
  if(k){ e.preventDefault(); press(k); }
});
const h=(location.hash||'').slice(1); if(TRACKS[h]) tr=h;
render();
</script>
</body></html>
