<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-991DE CW Ableitung</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32; --gold:#d2ad5b; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:1000px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1 1 auto; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.tabs{ max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.tabs button.fertig::after{ content:" ✓"; color:var(--ab); font-weight:bold; }
.tabs button.on.fertig::after{ color:#9fe0a5; }
main{ max-width:1000px; margin:14px auto 30px; padding:0 16px; display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

/* ---------- Rechner fx-991DE CW ---------- */
.calc{ width:330px; flex:0 0 330px; background:#1b1b1e; border-radius:30px; padding:16px 14px 18px; box-shadow:0 6px 22px rgba(0,0,0,.25), inset 0 0 0 2px #2c2c31; }
.head{ display:flex; justify-content:space-between; align-items:flex-start; padding:0 6px 8px; }
.logo{ color:#e9e9ec; font:900 19px Arial,sans-serif; letter-spacing:.5px; line-height:1; }
.logo small{ display:block; font:bold 10.5px Arial,sans-serif; letter-spacing:.3px; margin-top:5px; color:#cfcfd4; }
.solar{ width:104px; height:34px; border-radius:5px; background:linear-gradient(135deg,#2a1a1a,#3a2222 60%,#2a1818); box-shadow:inset 0 0 0 1px #000; }
.bezel{ background:#232327; border-radius:10px; padding:9px 9px 6px; box-shadow:inset 0 0 0 1px #111; }
.scr{ width:280px; height:118px; margin:0 auto; background:#d3ded4; border-radius:3px; position:relative; overflow:hidden; color:#141a14; font-family:Arial,Helvetica,sans-serif; box-shadow:inset 0 0 6px rgba(0,0,0,.25); }
.cw{ text-align:right; font:12px Arial,sans-serif; letter-spacing:5px; color:#bdbdc4; margin-top:5px; padding-right:4px; }
.keys{ display:grid; grid-template-columns:repeat(6,1fr); column-gap:4px; row-gap:2px; margin-top:12px; position:relative; }
.nums{ display:grid; grid-template-columns:repeat(5,1fr); column-gap:7px; row-gap:3px; margin-top:4px; }
.c{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; z-index:1; }
.lb{ font:bold 9px Arial,sans-serif; color:#e3e3e7; height:12px; letter-spacing:.2px; white-space:nowrap; }
.sl{ font:bold 10px 'Times New Roman',Georgia,serif; color:var(--gold); height:13px; line-height:13px; white-space:nowrap; }
.sl.sm{ font:bold 9px Arial,sans-serif; }
.k{ font:600 13px Arial,sans-serif; color:#f1f1f3; background:radial-gradient(circle at 50% 35%,#55555c,#3a3a40 70%); border:0; border-radius:50%; width:34px; height:30px; padding:0; cursor:pointer; box-shadow:0 2px 0 #0b0b0d; transition:transform .15s, box-shadow .15s; display:flex; align-items:center; justify-content:center; line-height:1; }
.k:focus{ outline:none; } .k:active{ transform:scale(.95); }
.nums .k{ width:46px; height:38px; font-size:19px; border-radius:48%; }
.k.small{ width:26px; height:24px; font-size:9px; }
.k.shift{ background:radial-gradient(circle at 50% 35%,#efe3bf,#b99b55 75%); color:#3a2c0a; }
.k.ok{ background:#121214; color:#9a9aa1; font-size:11px; width:32px; height:32px; border-radius:9px; }
.k.ar{ background:#121214; color:#9a9aa1; font-size:11px; }
.k.txt{ font-size:9.5px; letter-spacing:-.2px; }
.k sup{ font-size:8px; } .nums .k sup{ font-size:10px; }
.bx{ display:inline-block; width:7px; height:8px; border:1.3px solid currentColor; border-radius:1px; vertical-align:middle; }
.bx.f{ background:currentColor; }
.mf{ display:inline-flex; flex-direction:column; align-items:center; gap:1px; }
.mf i{ display:block; width:9px; height:6px; border:1.3px solid currentColor; border-radius:1px; }
.mf b{ display:block; width:12px; height:1.3px; background:currentColor; }
.dpad{ grid-column:3/6; grid-row:1/4; position:relative; z-index:0; }
.dpad::before,.dpad::after{ content:""; position:absolute; background:#0d0d0f; border-radius:16px; }
.dpad::before{ left:31%; right:31%; top:6px; bottom:4px; }
.dpad::after{ top:36%; bottom:28%; left:2px; right:2px; }
.pg{ grid-column:6; grid-row:1/3; justify-self:center; align-self:center; width:34px; height:64px; background:#2d2d32; border-radius:17px; display:flex; flex-direction:column; justify-content:space-around; align-items:center; color:#bbb; font-size:12px; z-index:1; }
.pg .k{ width:28px; height:26px; background:transparent; box-shadow:none; color:#bbb; font-size:13px; }
.k.hit{ box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.14); z-index:3; position:relative; }
.k.good{ box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8); }
.k.bad{ box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack .35s; }
.k.held{ box-shadow:0 0 0 3px #fff, 0 0 12px 3px rgba(255,255,255,.75); }
@keyframes wack{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

/* ---------- Display ---------- */
.sb{ height:13px; display:flex; align-items:center; gap:4px; padding:1px 4px 0; font:bold 9px Arial,sans-serif; }
.sb .ind{ background:#141a14; color:#d3ded4; padding:0 2px; border-radius:1px; line-height:10px; height:10px; }
.sb .sp{ flex:1; }
.app{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 7px 4px; display:flex; flex-direction:column; justify-content:space-between; }
.ein{ font-size:17px; min-height:34px; display:flex; align-items:center; white-space:nowrap; }
.vx{ font-family:'Times New Roman',serif; font-style:italic; font-size:19px; padding:0 1px; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:13px; line-height:1.15; }
.fr > span{ padding:0 2px; min-width:9px; }
.fr > span:first-child{ border-bottom:1.5px solid currentColor; }
.ein sup{ font-size:11px; align-self:flex-start; margin-top:4px; }
.ng{ display:inline-block; transform:scaleX(.62); margin:0 -1px; }
.caret{ display:inline-block; width:1.5px; height:18px; background:#141a14; animation:blink 1s steps(1) infinite; vertical-align:middle; margin-left:1px; } @keyframes blink{ 50%{opacity:0} }
.defl{ font-size:15px; margin-right:2px; }
.list{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 0; font-size:13.5px; }
.list .ti{ font-size:10px; font-weight:bold; padding:0 7px 1px; border-bottom:1px solid #141a14; margin-bottom:2px; }
.list div.it{ padding:1px 9px; height:19px; line-height:18px; white-space:nowrap; display:flex; justify-content:space-between; }
.list div.it.sel{ background:#141a14; color:#d3ded4; }
.list div.it .val{ min-width:60px; text-align:right; }
.ziel{ outline:2.5px solid var(--hit); outline-offset:-2px; animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{ 50%{ outline-color:rgba(242,183,5,.25); } }
.home{ position:absolute; inset:0; padding:6px 14px 4px 8px; }
.home .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px 6px; }
.home .ic{ position:relative; height:49px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:2px 0 3px; border-radius:2px; }
.home .ic svg{ width:40px; height:17px; margin-bottom:1px; }
.home .ic .an{ font:13.5px 'Arial Narrow','Roboto Condensed',Arial,sans-serif; letter-spacing:-.3px; line-height:1.1; white-space:nowrap; }
.home .ic .bd{ position:absolute; top:3px; right:5px; width:11px; height:11px; border-radius:50%; background:#141a14; color:#d3ded4; font:bold 8.5px Arial,sans-serif; line-height:11px; text-align:center; }
.home .ic.sel{ background:#141a14; color:#d3ded4; }
.home .ic.sel .bd{ background:#d3ded4; color:#141a14; }
/* Wertetabelle */
.tb{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:1px 4px 0; }
.tb table{ border-collapse:collapse; width:100%; table-layout:fixed; font-size:13px; }
.tb th{ font-size:11px; font-weight:bold; border-bottom:1.3px solid #141a14; height:14px; line-height:12px; text-align:center; }
.tb th.n,.tb td.n{ width:16px; font-size:9px; text-align:left; color:#3e4a3e; }
.tb td{ height:15px; line-height:14px; text-align:right; padding:0 5px; border-right:1px solid #8fa08f; white-space:nowrap; overflow:hidden; }
.tb td:last-child{ border-right:0; }
.tb td.cur{ background:#141a14; color:#d3ded4; }
.tb .unten{ position:absolute; left:6px; right:6px; bottom:1px; font-size:14px; line-height:17px; text-align:right; font-weight:bold; border-top:1px solid #8fa08f; height:18px; }
.tb .unten.leer{ font-size:10px; font-weight:normal; text-align:left; }

/* ---------- Panel ---------- */
.panel{ flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.prog{ display:flex; gap:4px; margin-bottom:12px; }
.prog i{ flex:1; height:5px; border-radius:3px; background:#e3e6eb; cursor:pointer; }
.prog i.done{ background:#9aa3b0; } .prog i.now{ background:var(--lf); }
.prog i.abp{ background:#bfe3c3; } .prog i.abp.done{ background:#7cbf84; } .prog i.abp.now{ background:var(--ab); }
.nr{ font-size:13px; color:var(--mute); }
.panel h2{ margin:2px 0 8px; font-size:20px; line-height:1.3; }
.panel p{ margin:0 0 10px; font-size:15.5px; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 12px; }
.chip{ font:600 13px Arial,sans-serif; background:#2b2b2f; color:#fff; border-radius:5px; padding:3px 9px; border:2px solid transparent; }
.chip.shift{ background:#c9a54a; color:#2b2005; }
.chip.done{ opacity:.35; }
.chip.now{ border-color:var(--hit); box-shadow:0 0 0 2px rgba(242,183,5,.35); }
.chip.big{ font-size:16px; padding:4px 12px; vertical-align:middle; }
.chip sup{ font-size:9px; }
.chip i.v{ font-family:'Times New Roman',serif; font-size:15px; }
.chip .bx{ width:7px; height:8px; }
.note{ background:#FFF8E8; border-left:4px solid var(--hit); border-radius:4px; padding:7px 12px; font-size:14.5px; margin:0 0 10px; }
.note b{ color:#8a5a00; }
.stat{ min-height:38px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; background:var(--bg); border-radius:8px; padding:6px 12px; margin:6px 0 12px; }
.stat .ok{ color:#2E7D32; font-weight:bold; } .stat .err{ color:#C62828; font-weight:bold; }
.ab{ border:2px solid var(--ab); background:#F1F8F1; border-radius:10px; padding:10px 14px 6px; margin:0 0 12px; }
.ab .abt{ font-weight:bold; color:var(--ab); font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.ab .abt span{ font-size:22px; }
.ab ul{ margin:0 0 8px; padding-left:20px; font-size:15px; }
.ab li{ margin-bottom:3px; }
.ab p{ font-size:14.5px; }
.task{ border:1px solid var(--line); border-left:5px solid var(--lf); border-radius:8px; padding:6px 14px 8px; margin:0 0 12px; font-size:14.5px; background:#fafbfc; }
.task .auf{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--mute); }
.task .term{ font-family:Cambria,Georgia,serif; font-size:22px; line-height:1.6; color:var(--ink); }
.task .bereich{ font-size:14.5px; color:var(--ink); }
.btns{ display:flex; gap:10px; margin-top:14px; }
.btns button{ font:inherit; font-size:16px; padding:9px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); color:#fff; border-color:var(--lf); }
.btns button:disabled{ opacity:.4; cursor:default; }
#next{ margin-left:auto; }
.opt{ font-size:13.5px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:10px; }
.hint{ font-size:12.5px; color:var(--mute); margin-top:10px; }
@media (max-width:380px){ .calc{ transform:scale(.92); transform-origin:top center; } }

/* Ableitung d/dx */
.ein.dd{ font-size:15px; overflow:hidden; }
.ein.dd .vx{ font-size:16px; }
.fr.ddx{ font-size:11px; margin:0 1px 0 0; }
.fr.ddx > span{ padding:0 1px; }
.kl{ font-size:21px; line-height:1; transform:scaleY(1.15); display:inline-block; }
.evb{ display:inline-block; width:1.3px; height:24px; background:#141a14; margin:0 1px 0 2px; vertical-align:middle; }
.evx{ font-size:11px; align-self:flex-end; margin-bottom:2px; white-space:nowrap; display:inline-flex; align-items:center; }
.evx .vx{ font-size:13px; }
.evx .caret{ height:12px; }
.ein.dd sup{ font-size:10px; }
.ein.dd sup .caret{ height:9px; }
.bx.feld{ width:9px; height:11px; border:1.2px dotted #141a14; margin:0 1px; }
.bx.sm{ width:5px; height:6px; border:1px dotted #141a14; }
.erg{ text-align:right; font-size:22px; font-weight:bold; min-height:28px; }

<script>
// =====================================================================
//  HOME-Bildschirm fx-991DE CW
// =====================================================================
const T_=(t,sz)=>`<text x="17" y="12" text-anchor="middle" font-size="${sz||11}" font-weight="bold" fill="currentColor">${t}</text>`;
const ICON={
 Berechnung:'<svg viewBox="0 0 34 14"><text x="17" y="6.8" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">×÷</text><text x="17" y="14" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">+−</text></svg>',
 Statistik:'<svg viewBox="0 0 34 14"><path d="M9 1v12h17" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="7" width="2.6" height="5" fill="currentColor"/><rect x="14.5" y="3" width="2.6" height="9" fill="currentColor"/><rect x="18" y="5" width="2.6" height="7" fill="currentColor"/><rect x="21.5" y="8" width="2.6" height="4" fill="currentColor"/></svg>',
 Verteilung:'<svg viewBox="0 0 34 14"><path d="M5 13C11 13 12 2 17 2s6 11 12 11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 13V4.5h6V13" fill="currentColor" opacity=".55"/><path d="M4 13h26" stroke="currentColor" stroke-width="1"/></svg>',
 'Tabellenk.':'<svg viewBox="0 0 34 14"><rect x="9" y="1.5" width="16" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1.5" width="16" height="3" fill="currentColor"/><path d="M9 8.5h16M14.3 4.5v8.5M19.6 4.5v8.5" stroke="currentColor" stroke-width="1"/></svg>',
 'Wertetab.':'<svg viewBox="0 0 34 14"><rect x="10" y="1.5" width="14" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="10" y="1.5" width="14" height="3" fill="currentColor"/><path d="M17 4.5v8.5M10 8.5h14" stroke="currentColor" stroke-width="1"/></svg>',
 Gleichung:'<svg viewBox="0 0 34 14">'+T_('xy=0',9.5)+'<path d="M5 13.3h24" stroke="currentColor" stroke-width="1.3"/></svg>'
};
const APPS=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung"];
function zl(lbl,ziel){ return (ziel||[]).includes(lbl)?' ziel':''; }
function drawHome(S,ziel){
  return `<div class="home"><div class="grid">`+APPS.map((a,i)=>`<div class="ic${i===S.sel?' sel':''}${zl(a,ziel)}"><span class="bd">${i+1}</span>${ICON[a]}<span class="an">${a}</span></div>`).join('')+`</div></div>`;
}
function sbar(S,extra){ return `<div class="sb">${S.shift?'<span class="ind">S</span>':''}<span class="ind">D</span><span class="sp"></span>${extra||''}</div>`; }

// =====================================================================
//  Exakte Rechnung: Polynom-Term -> Ableitung an einer Stelle
// =====================================================================
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const R=(p,q=1)=>{ if(q<0){ p=-p; q=-q; } const g=gcd(p,q); return {p:p/g,q:q/g}; };
const addR=(a,b)=>R(a.p*b.q+b.p*a.q,a.q*b.q), mulR=(a,b)=>R(a.p*b.p,a.q*b.q), negR=a=>R(-a.p,a.q);
const powR=(a,n)=>{ let r=R(1); for(let i=0;i<n;i++) r=mulR(r,a); return r; };
function numR(s){ const [i,f='']=s.split(','); return R(parseInt((i||'0')+f,10), 10**f.length); }
// Token-Liste -> Polynom {Grad: Koeffizient}
function poly(t){
  const P={}; let sign=1, c=null, deg=0, num='', inE=false, eStr='', any=false;
  const flush=()=>{ if(num){ c=c?mulR(c,numR(num)):numR(num); num=''; any=true; } };
  const endTerm=()=>{ flush(); if(any){ let k=c||R(1); if(sign<0) k=negR(k); P[deg]=P[deg]?addR(P[deg],k):k; } c=null; deg=0; any=false; };
  for(const k of t){
    if(inE){ if(/^[0-9]$/.test(k)){ eStr+=k; continue; } inE=false; deg+=Math.max(0,(parseInt(eStr||'1',10))-1); if(k==='right') continue; }
    if(/^[0-9,]$/.test(k)){ num+=k; continue; }
    if(k==='x'){ flush(); deg+=1; any=true; continue; }
    if(k==='sq'){ flush(); deg+=1; continue; }
    if(k==='pow'){ flush(); inE=true; eStr=''; continue; }
    if(k==='+'||k==='-'||k==='neg'){ const s=k==='+'?1:-1; flush(); if(any){ endTerm(); sign=s; } else sign*=s; }
  }
  if(inE){ deg+=Math.max(0,(parseInt(eStr||'1',10))-1); }
  endTerm(); return P;
}
function ableitung(t,a){ const P=poly(t); let s=R(0); for(const d in P){ const n=+d; if(n>0) s=addR(s, mulR(mulR(P[d],R(n)), powR(a,n-1))); } return s; }
const dez=r=>{ const v=r.p/r.q; return Number(v.toPrecision(10)).toString().replace('.',',').replace('-','−'); };
const TK={neg:'−','-':'−','+':'+',x:'<span class="vx">x</span>',sq:'<sup>2</sup>'};
// Term rendern, Exponent nach pow bis ▶ hochgestellt; caret = Cursor am Ende
function renderT(t,caret){
  let h='', inE=false;
  for(const k of t){
    if(inE && !/^[0-9]$/.test(k)){ h+='</sup>'; inE=false; if(k==='right') continue; }
    if(k==='pow'){ h+='<sup>'; inE=true; continue; }
    h+=TK[k]||k;
  }
  if(inE) h+=(t[t.length-1]==='pow'?'<span class="bx sm"></span>':'')+(caret?'<span class="caret"></span>':'')+'</sup>';
  else if(caret) h+='<span class="caret"></span>';
  return h;
}
const inExp=t=>{ let e=false; for(const k of t){ if(k==='pow') e=true; else if(e && !/^[0-9]$/.test(k)) e=false; } return e; };
const leer='<span class="bx feld"></span>';
function drawDD(S){
  const f=S.f.length||S.fld===0 ? renderT(S.f,S.fld===0&&!S.res) : leer;
  const a=S.a.length||S.fld===1 ? renderT(S.a,S.fld===1&&!S.res) : leer;
  return sbar(S)+`<div class="app"><div class="ein dd"><span class="fr ddx"><span>d</span><span>d<span class="vx">x</span></span></span><span class="kl">(</span>${f}<span class="kl">)</span><span class="evb"></span><span class="evx"><span class="vx">x</span>=${a}</span></div><div class="erg">${S.res?dez(S.res):''}</div></div>`;
}
// Gemeinsame Tasten im Ableitungs-Template
function ddKey(S,k){
  if(k==='exe'){ if(S.f.length&&S.a.length){ S.res=ableitung(S.f, poly(S.a)[0]||R(0)); } return true; }
  if(S.res){ // nach dem Ergebnis: ◀ = am Ende weiter bearbeiten
    if(k==='left'){ S.res=null; S.fld=1; return true; }
    if(k==='ac'){ S.mode='calc'; S.res=null; return true; }
    return true;
  }
  const T=S.fld===0?S.f:S.a;
  if(k==='right'){ if(S.fld===0&&inExp(S.f)) S.f.push('right'); else S.fld=1; return true; }
  if(k==='left'){ S.fld=0; return true; }
  if(k==='del'){ T.pop(); return true; }
  if(k==='ac'){ S.mode='calc'; return true; }
  if(/^[0-9,]$/.test(k)||['x','sq','pow','+','-','neg'].includes(k)){ if(S.fld===1&&['x','sq','pow'].includes(k)) return true; T.push(k); return true; }
  return true;
}
function newDD(S){ S.mode='dd'; S.f=[]; S.a=[]; S.fld=0; S.res=null; }
// =====================================================================
//  Rechnerzustand: App Berechnung, CATALOG ▸ Funktionsanalyse ▸ Ableitung
// =====================================================================
const CATS=["Funktionsanalyse","Wahrscheinlichkeit","Numerische Berechn.","Winkel/Koord/Sexa","Hyperbel/Trig.","Sonstige"];
const FA=["Ableitung(d/dx)","Integration(∫)","Summation(Σ)","Produkt(Π)","Rechnen mit Rest"];
function fresh(){ return {mode:'calc', sel:0, shift:false, f:[], a:[], fld:0, res:null}; }
function step(S,k){
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='-') k='neg'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if((k==='ok'||k==='exe')&&S.sel===0){ S.mode='calc'; }
     return;
   case 'calc':
     if(k==='cat'){ S.mode='cat'; S.sel=0; }
     return;
   case 'cat':
     if(k==='down') S.sel=Math.min(CATS.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'||k==='ac') S.mode='calc';
     else if((k==='ok'||k==='exe')&&S.sel===0){ S.mode='fa'; S.sel=0; }
     return;
   case 'fa':
     if(k==='down') S.sel=Math.min(FA.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'){ S.mode='cat'; S.sel=0; } else if(k==='ac') S.mode='calc';
     else if((k==='ok'||k==='exe')&&S.sel===0) newDD(S);
     return;
   case 'dd':
     ddKey(S,k); return;
  }
}
function run(S,keys){ keys.forEach(k=>step(S,k)); return S; }
function draw(S,ziel){
  if(S.mode==='calc') return sbar(S)+'<div class="app"><div class="ein"><span class="caret"></span></div><div></div></div>';
  if(S.mode==='home') return drawHome(S,ziel);
  if(S.mode==='cat'||S.mode==='fa'){
    const L=S.mode==='cat'?CATS:FA, T=S.mode==='cat'?'CATALOG':'Funktionsanalyse', off=Math.max(0,S.sel-3);
    return sbar(S)+`<div class="list"><div class="ti">${T}</div>`+L.slice(off,off+4).map((t,i)=>`<div class="it${i+off===S.sel?' sel':''}${zl(t,ziel)}"><span>${t}</span></div>`).join('')+'</div>';
  }
  if(S.mode==='dd') return drawDD(S);
  return '';
}

// =====================================================================
//  Tour-Inhalte
// =====================================================================
const AB=(nr,items)=>`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: ${nr}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Am eigenen Rechner arbeiten, Ergebnisse auf dem Blatt eintragen, dann <b>Weiter</b>.</p></div>`;
const termF=`<i>f</i>(<i>x</i>) = 0,5<i>x</i><sup>3</sup> − 2<i>x</i><sup>2</sup> + 3`;
const termG=`<i>g</i>(<i>x</i>) = −0,5<i>x</i><sup>2</sup> + 2<i>x</i> + 1`;
const B1=termF+'<div class="bereich">Gesucht: Steigung an der Stelle <i>x</i> = 2, also <i>f</i> ′(2)</div>';
const B2=termG+'<div class="bereich">Gesucht: Steigungen <i>g</i> ′(0), <i>g</i> ′(4) und <i>g</i> ′(2)</div>';
const T1=[
  {t:"App Berechnung öffnen", a:B1, k:["home","ok"], z:["Berechnung"],
   d:"<p>Drücken Sie <b>HOME</b>. Die App <b>Berechnung</b> ist schon markiert. Öffnen Sie sie mit <b>OK</b>.</p>",
   n:"Die Ableitung an einer Stelle geht auch in anderen Apps – am einfachsten ist aber <b>Berechnung</b>."},
  {t:"Ableitung aufrufen", a:B1, k:["cat","ok","ok"], z:["Funktionsanalyse","Ableitung(d/dx)"],
   d:"<p><b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>OK</b> ▸ <b>Ableitung(d/dx)</b> ▸ <b>OK</b>.</p><p>Im Display erscheint die Vorlage <b>d/dx( ▭ )|x=▭</b> mit zwei leeren Feldern.</p>"},
  {t:"Funktionsterm eingeben", a:B1, k:["0",",","5","x","pow","3","right","-","2","x","sq","+","3"],
   d:"<p>Tippen Sie den Term in das <b>erste Feld</b>.</p><p><b>x³</b>: <b>x</b>, dann die Potenz-Taste, dann <b>3</b>. Mit <b>▶</b> verlassen Sie den Exponenten wieder.</p>",
   n:"Ohne ▶ würde „− 2x² + 3“ mit in den Exponenten rutschen!"},
  {t:"Ins Feld x= wechseln", a:B1, k:["right"],
   d:"<p>Mit <b>▶</b> springt der Cursor aus der Klammer in das Feld <b>x=</b>.</p>"},
  {t:"Stelle eingeben und rechnen", a:B1, k:["2","exe"],
   d:"<p>Tippen Sie <b>2</b> und drücken Sie <b>EXE</b>.</p><p>Ergebnis: <b><i>f</i> ′(2) = −2</b>. Die Steigung ist negativ – der Graph <b>fällt</b> an der Stelle 2.</p>",
   n:"Positiv = Graph steigt · negativ = Graph fällt · 0 = waagerechte Tangente."},
  {t:"Selbst arbeiten", k:[], ab:1, d:AB("Aufgabe 1",["<b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>Ableitung(d/dx)</b>","Term eingeben ▸ <b>▶</b> ▸ Stelle eingeben ▸ <b>EXE</b>","Negative Stelle: <b>SHIFT −</b>, z. B. für <i>f</i> ′(−1)","Steigt, fällt oder waagerecht? In die Tabelle eintragen"])}
];
const T2=[
  {t:"Neu anfangen", a:B2, k:["ac","cat","ok","ok"], z:["Funktionsanalyse","Ableitung(d/dx)"],
   d:"<p><b>AC</b> löscht die alte Rechnung. Dann wieder <b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>Ableitung(d/dx)</b>.</p>"},
  {t:"Parabel eingeben", a:B2, k:["shift","-","0",",","5","x","sq","+","2","x","+","1"],
   d:"<p>Das Minus <b>am Anfang</b> ist ein Vorzeichen: <b>SHIFT</b> <b>−</b>.</p><p><b>x²</b> hat eine eigene Taste – hier brauchen Sie kein ▶.</p>"},
  {t:"Steigung an der Stelle 0", a:B2, k:["right","0","exe"],
   d:"<p><b>▶</b>, dann <b>0</b> und <b>EXE</b>.</p><p><b><i>g</i> ′(0) = 2</b>: positiv – die Parabel <b>steigt</b> bei <i>x</i> = 0.</p>"},
  {t:"Andere Stelle: Eingabe ändern", a:B2, k:["left","del","4","exe"],
   d:"<p>Sie müssen nicht alles neu tippen: <b>◀</b> holt die Eingabe zurück, der Cursor steht hinter der 0.</p><p><b>⌫</b>, dann <b>4</b> und <b>EXE</b>: <b><i>g</i> ′(4) = −2</b> – die Parabel <b>fällt</b>.</p>"},
  {t:"Waagerechte Tangente", a:B2, k:["left","del","2","exe"],
   d:"<p>Noch einmal: <b>◀</b>, <b>⌫</b>, <b>2</b>, <b>EXE</b>.</p><p><b><i>g</i> ′(2) = 0</b>: Die Tangente ist <b>waagerecht</b>. Hier liegt der Scheitelpunkt der Parabel.</p>",
   n:"Erscheint ein Bruch statt einer Dezimalzahl, schalten Sie mit <b>FORMAT</b> ▸ <b>Dezimal</b> um."},
  {t:"Selbst arbeiten", k:[], ab:1, d:AB("Aufgabe 2",["Parabel <b>g</b> einmal eingeben","Für jede Tangente nur die Stelle ändern: <b>◀</b> ▸ <b>⌫</b> ▸ neue Zahl ▸ <b>EXE</b>","Steigung <i>m</i><sub>t</sub> in die Lücke an der Tangente eintragen","Danach: Lösungscode eintragen"])}
];
const allK=a=>a.flatMap(s=>s.k);
const TRACKS={
  c:{name:"1 · Ableitung an einer Stelle", start:()=>fresh(), steps:T1},
  n:{name:"2 · Parabel: Stelle ändern", start:()=>run(fresh(),allK(T1)), steps:T2}
};

// =====================================================================
//  Steuerung
// =====================================================================
const ORDER=["c","n"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>document.getElementById(id);
const LBL={on:"ON",home:"HOME ⌂",back:"↶",ok:"OK",up:"▲",down:"▼",left:"◀",right:"▶",shift:"SHIFT",func:"FUNCTION",tools:"TOOLS",cat:"CATALOG",
 exe:"EXE",ac:"AC",del:"⌫","-":"−","+":"+",x:'<i class="v">x</i>', sq:'<span class="bx"></span><sup>2</sup>', pow:'<span class="bx"></span><sup>▫</sup>'};
const lbl=k=>LBL[k]||k;
function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); return `<span class="chip ${k==='shift'?'shift':''} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){
  const T=TRACKS[t], S=T.start();
  for(let j=0;j<s;j++) run(S,T.steps[j].k);
  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?(S.z||[]).filter(z=>z==='cell'):(S.z||[]).filter(z=>z!=='cell'));
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  if(last&&fin) done[tr]=true;
  $('next').className=fin?'go':'';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Überspringen';
  $('next').disabled=fin&&last&&!nextT;
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '';
  hint();
}
function hint(){
  document.querySelectorAll('.k.hit,.k.held').forEach(e=>e.classList.remove('hit','held'));
  const S=TRACKS[tr].steps[st];
  if(pos>0&&S.k[pos-1]==='shift'&&pos<S.k.length){ const c=document.querySelector('.k[data-k="shift"]'); if(c) c.classList.add('held'); }
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=document.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1600); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    let extra='';
    if(k==='-'&&S.k[pos]==='shift'&&S.k[pos+1]==='-') extra=' Für das Vorzeichen erst <b>SHIFT</b>, dann <b>−</b>.';
    if(k==='ok'&&S.k[pos]==='exe') extra=' Hier bestätigen Sie mit <b>EXE</b>.';
    if(k==='exe'&&S.k[pos]==='right') extra=' Erst mit <b>▶</b> ins nächste Feld wechseln.';
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(S.k[pos],pos).replace('now','now big')}${extra}`;
  }
}
function advance(){ const T=TRACKS[tr]; if(st<T.steps.length-1){ st++; pos=0; } render(); }
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }
document.querySelectorAll('.calc .k').forEach(b=>b.addEventListener('click',()=>{ b.blur(); press(b.dataset.k); }));
$('next').onclick=next; $('back').onclick=back;
$('tabs').onclick=e=>{ const t=e.target.dataset.t; if(t){ tr=t; st=0; pos=0; render(); } };
$('prog').onclick=e=>{ if(e.target.dataset.i){ st=+e.target.dataset.i; pos=0; render(); } };
const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-',x:'x',X:'x'};
document.addEventListener('keydown',e=>{
  let k=KMAP[e.key]; if(!k && /^[0-9]$/.test(e.key)) k=e.key;
  if(k){ e.preventDefault(); press(k); }
});
const h=(location.hash||'').slice(1); if(TRACKS[h]) tr=h;
render();
</script>
</body></html>
