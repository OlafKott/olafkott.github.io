<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taschenrechner-Führerschein</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ab:#2E7D32; --hit:#F2B705; }
*{ box-sizing:border-box; }
html,body{ margin:0; } html{ background:#f3f4f6; } body{ min-height:100vh; }
body{ background:radial-gradient(circle at 50% 20%,#ffffff,var(--bg) 70%); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; overflow-x:hidden; }
.stage{ max-width:1100px; margin:0; padding:14px 16px 28px; }
.bar{ display:flex; align-items:center; justify-content:space-between; min-height:52px; margin-bottom:10px; }
.back{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:22px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); visibility:hidden; opacity:0; transition:opacity .3s; }
.stage.pick .back{ visibility:visible; opacity:1; }

.wrap{ display:flex; align-items:flex-start; justify-content:flex-start; gap:28px; }
.calcs{ display:flex; justify-content:flex-start; align-items:flex-start; gap:clamp(18px,5vw,56px); flex:0 0 auto; transition:gap .6s; }
.stage.pick .calcs{ gap:0; }
.calc{ width:clamp(130px,24vw,220px); border:0; background:none; padding:0; cursor:pointer; filter:drop-shadow(0 12px 18px rgba(0,0,0,.22)); transition:transform .6s cubic-bezier(.6,.05,.25,1), opacity .45s, width .6s cubic-bezier(.6,.05,.25,1); }
.calc svg{ display:block; width:100%; height:auto; }
.calc:hover{ transform:translateY(-4px) scale(1.03); }
.calc:focus-visible{ outline:4px solid var(--hit); outline-offset:6px; border-radius:26px; }
.stage.pick .calc{ cursor:default; transform:none; }
.stage.pick-cw #dx{ transform:translateX(120%) rotate(8deg); opacity:0; width:0; pointer-events:none; }
.stage.pick-dx #cw{ transform:translateX(-120%) rotate(-8deg); opacity:0; width:0; pointer-events:none; }
.cap{ text-align:left; margin-top:10px; font:600 14px system-ui,Arial,sans-serif; color:var(--mute); }
.col{ display:flex; flex-direction:column; align-items:center; flex:0 0 auto; }
.hand{ text-align:center; margin-top:10px; }
.hand .f{ display:inline-block; font-size:32px; animation:tap 1.6s ease-in-out infinite; }
.hand .t{ display:block; margin-top:4px; font:600 15px system-ui,Arial,sans-serif; color:var(--mute); }
@keyframes tap{ 50%{ transform:translateY(-6px); } }
.stage.pick .hand{ display:none; }

.toc{ display:none; flex:1 1 auto; min-width:0; max-width:760px; flex-direction:column; gap:8px; }
.stage.pick .toc{ display:flex; animation:tocIn .5s .25s both; }
@keyframes tocIn{ from{ opacity:0; transform:translateX(30px); } to{ opacity:1; transform:none; } }
.model{ font:bold 13px system-ui,Arial,sans-serif; color:var(--mute); letter-spacing:.5px; margin:0 0 2px 4px; }
.topic{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px 8px 12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.th{ display:flex; align-items:center; gap:10px; flex:1 1 220px; min-width:0; }
.num{ flex:0 0 28px; height:28px; border-radius:50%; background:var(--lf); color:#fff; font:bold 14px Arial,sans-serif; display:flex; align-items:center; justify-content:center; }
.ttl{ font-size:16px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
.acts{ display:flex; flex-wrap:wrap; gap:6px; margin-left:0; flex:1 1 100%; }
.act{ width:122px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; text-decoration:none; color:#fff; transition:transform .15s, box-shadow .15s; }
.act:hover,.act:focus-visible{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(0,0,0,.18); outline:none; }
.act svg{ width:18px; height:18px; flex:0 0 18px; }
.act span{ font:600 13px system-ui,Arial,sans-serif; }
.act.tour{ background:linear-gradient(#2a62c2,var(--lf)); }
.act.pdf{ background:linear-gradient(#e0504a,#b8322d); }
.act.ueb{ background:linear-gradient(#3aa356,var(--ab)); }
.act.gap{ visibility:hidden; }

@media (max-width:700px){
  .wrap{ flex-direction:column; align-items:flex-start; gap:14px; }
  .stage.pick .calc{ width:110px; }
  .toc{ width:100%; }
  .acts{ width:100%; margin-left:0; }
  .act{ flex:1 1 0; width:auto; min-width:0; padding:0 4px; gap:4px; }
}
@media (max-width:380px){ .act svg{ display:none; } }
</style></head><body>
<div class="stage" id="stage">
  <div class="bar"><button class="back" id="back" aria-label="Zurück" title="Zurück">←</button></div>
  <div class="wrap">
    <div class="col">
    <div class="calcs">
      <button class="calc" id="cw" aria-label="CASIO fx-991DE CW" title="fx-991DE CW"></button>
      <button class="calc" id="dx" aria-label="CASIO fx-991DE X" title="fx-991DE X"></button>
    </div>
    <div class="hand"><span class="f" aria-hidden="true">👆</span><span class="t">Wähl deinen Taschenrechner aus.</span></div>
    </div>
    <nav class="toc" id="toc"></nav>
  </div>
</div>
<script>
// ---------- Rechner als SVG ----------
function svgCalc(type){
  const W=230,H=470; let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const cw=type==='cw';
  if(cw){
    s+=`<rect x="2" y="2" width="${W-4}" height="${H-4}" rx="30" fill="#1b1b1e" stroke="#2e2e33" stroke-width="2"/>`;
  }else{
    s+=`<rect x="2" y="2" width="${W-4}" height="${H-4}" rx="30" fill="#e8e8ec"/><rect x="9" y="9" width="${W-18}" height="${H-18}" rx="24" fill="#1e1e21"/>`;
  }
  s+=`<text x="26" y="40" font-family="Arial" font-weight="900" font-size="17" fill="#eee">CASIO</text>`;
  s+=`<text x="26" y="55" font-family="Arial" font-weight="bold" font-size="8.5" fill="#ccc">${cw?'fx-991DE CW':'fx-991DE X'}</text>`;
  if(!cw) s+=`<text x="26" y="67" font-family="Georgia" font-style="italic" font-size="8" letter-spacing="2" fill="#d94b5a">CLASSWIZ</text>`;
  s+=`<rect x="128" y="24" width="78" height="28" rx="3" fill="#3a2323"/>`;
  s+=`<rect x="22" y="76" width="186" height="78" rx="6" fill="${cw?'#232327':'#111'}"/><rect x="30" y="84" width="170" height="${cw?60:62}" rx="2" fill="#d3ded4"/>`;
  // Display-Inhalt
  const ink='#141a14', lcd='#d3ded4';
  const badge=(x,y,t,inv)=>`<circle cx="${x}" cy="${y}" r="4.2" fill="${inv?lcd:ink}"/><text x="${x}" y="${y+2.6}" text-anchor="middle" font-size="6" font-weight="bold" fill="${inv?ink:lcd}">${t}</text>`;
  if(cw){
    const cells=[["Berechnung",'<text x="0" y="-4" text-anchor="middle" font-size="8" font-weight="bold" fill="C">×÷</text><text x="0" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="C">+−</text>'],
                 ["Statistik",'<g fill="C"><rect x="-8" y="-6" width="3" height="9"/><rect x="-4" y="-9" width="3" height="12"/><rect x="0" y="-4" width="3" height="7"/><rect x="4" y="-2" width="3" height="5"/></g><path d="M-10 3h20" stroke="C" stroke-width="1"/>'],
                 ["Verteilung",'<path d="M-12 3c5 0 7-11 12-11s7 11 12 11" fill="none" stroke="C" stroke-width="1.6"/>'],
                 ["Tabellenk.",'<rect x="-9" y="-8" width="18" height="12" fill="none" stroke="C" stroke-width="1.2"/><rect x="-9" y="-8" width="18" height="3" fill="C"/><path d="M-9 -1h18M-3 -5v9M3 -5v9" stroke="C" stroke-width=".9"/>'],
                 ["Wertetab.",'<rect x="-7" y="-8" width="14" height="12" fill="none" stroke="C" stroke-width="1.2"/><rect x="-7" y="-8" width="14" height="3" fill="C"/><path d="M0 -5v9M-7 -1h14" stroke="C" stroke-width=".9"/>'],
                 ["Gleichung",'<text x="0" y="1" text-anchor="middle" font-size="8.5" font-weight="bold" fill="C">xy=0</text><path d="M-11 4h22" stroke="C" stroke-width="1.2"/>']];
    cells.forEach(([n,ic],i)=>{ const cx=58+(i%3)*57, cy=97+Math.floor(i/3)*28, sel=i===0;
      if(sel) s+=`<rect x="${cx-27}" y="${cy-11}" width="54" height="27" fill="${ink}"/>`;
      const C=sel?lcd:ink;
      s+=`<g transform="translate(${cx},${cy})">${ic.replace(/"C"/g,'"'+C+'"')}</g><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="7.6" font-family="Arial Narrow,Arial" fill="${C}">${n}</text>${badge(cx+21,cy-6,i+1,sel)}`; });
    s+=`<rect x="196" y="88" width="1.6" height="22" fill="${ink}"/>`;
    s+=`<text x="194" y="150" text-anchor="end" font-size="7" letter-spacing="2.5" fill="#bdbdc4">CLASSWIZ</text>`;
  }else{
    const ic=['<text x="0" y="-1" text-anchor="middle" font-size="7" font-weight="bold" fill="C">×÷</text><text x="0" y="6" text-anchor="middle" font-size="7" font-weight="bold" fill="C">+−</text>',
      '<rect x="-8" y="-6" width="16" height="11" fill="none" stroke="C" stroke-width="1.2"/><text x="-3.5" y="3" text-anchor="middle" font-size="7" font-weight="bold" font-style="italic" fill="C">i</text><path d="M0 4l6-8M0 4h6" stroke="C" stroke-width="1"/>',
      '<text x="0" y="-1" text-anchor="middle" font-size="5.5" font-weight="bold" fill="C">2  8</text><text x="0" y="6" text-anchor="middle" font-size="5.5" font-weight="bold" fill="C">10 16</text>',
      '<path d="M-7 -6h-2v12h2M7 -6h2v12h-2" fill="none" stroke="C" stroke-width="1.2"/><g fill="C"><rect x="-6" y="-5" width="5" height="4.5"/><rect x="1" y="-5" width="5" height="4.5"/><rect x="-6" y="0.5" width="5" height="4.5"/><rect x="1" y="0.5" width="5" height="4.5"/></g>',
      '<path d="M-5 6L4 -4M-5 6h9M-5 6v-9" fill="none" stroke="C" stroke-width="1.4"/>',
      '<g fill="C"><rect x="-7" y="-1" width="3" height="7"/><rect x="-3" y="-5" width="3" height="11"/><rect x="1" y="-2" width="3" height="8"/><rect x="5" y="1" width="3" height="5"/></g><path d="M-9 -6v12h18" fill="none" stroke="C" stroke-width="1"/>',
      '<path d="M-10 6c4 0 6-11 10-11s6 11 10 11" fill="none" stroke="C" stroke-width="1.4"/><rect x="-2" y="-2" width="4" height="8" fill="C"/>',
      '<rect x="-8" y="-5" width="16" height="11" fill="none" stroke="C" stroke-width="1.2"/><path d="M-8 -1h16M-8 2.5h16M-3 -5v11M2.5 -5v11" stroke="C" stroke-width=".8"/>'];
    ic.forEach((g,i)=>{ const cx=50+(i%4)*42, cy=99+Math.floor(i/4)*20, sel=i===0; const C=sel?lcd:ink;
      if(sel) s+=`<rect x="${cx-19}" y="${cy-9}" width="38" height="18" fill="${ink}"/>`;
      s+=`<g transform="translate(${cx},${cy})">${g.replace(/"C"/g,'"'+C+'"')}</g><rect x="${cx+11}" y="${cy+1}" width="7" height="8" fill="${sel?lcd:ink}"/><text x="${cx+14.5}" y="${cy+7.6}" text-anchor="middle" font-size="6.5" font-weight="bold" fill="${sel?ink:lcd}">${i+1}</text>`; });
    s+=`<text x="161" y="91" font-size="6" fill="${ink}">▼</text><text x="36" y="140" font-family="Courier New" font-weight="bold" font-size="12" fill="${ink}">1:Berechnungen</text>`;
  }
  // Steuerreihe
  if(cw){
    s+=`<circle cx="40" cy="178" r="9" fill="#3b3b40"/><circle cx="72" cy="178" r="11" fill="#3b3b40"/><circle cx="40" cy="206" r="11" fill="#3b3b40"/><circle cx="72" cy="206" r="11" fill="#3b3b40"/>`;
    s+=`<path d="M103 175h24v18h18v24h-18v18h-24v-18h-18v-24h18z" fill="#0d0d0f"/><circle cx="115" cy="205" r="10" fill="#1a1a1d"/>`;
    s+=`<rect x="178" y="170" width="24" height="50" rx="12" fill="#2d2d32"/>`;
    s+=`<circle cx="40" cy="240" r="11" fill="#d9bf7c"/>`;
    for(let i=1;i<6;i++) s+=`<circle cx="${40+i*32}" cy="240" r="11" fill="#3e3e44"/>`;
    for(let r=0;r<2;r++) for(let i=0;i<6;i++) s+=`<circle cx="${40+i*32}" cy="${270+r*28}" r="11" fill="#3e3e44"/>`;
    for(let r=0;r<4;r++) for(let i=0;i<5;i++) s+=`<ellipse cx="${42+i*37}" cy="${334+r*34}" rx="15" ry="13" fill="#4a4a50"/>`;
  }else{
    s+=`<circle cx="38" cy="176" r="9" fill="#bdbdc3"/><circle cx="64" cy="176" r="9" fill="#bdbdc3"/><circle cx="166" cy="176" r="9" fill="#bdbdc3"/><circle cx="192" cy="176" r="9" fill="#bdbdc3"/>`;
    s+=`<ellipse cx="115" cy="182" rx="30" ry="22" fill="#0e0e10" stroke="#38383e" stroke-width="3"/><ellipse cx="115" cy="182" rx="10" ry="8" fill="#1d1d20"/>`;
    for(let r=0;r<4;r++) for(let i=0;i<6;i++){ if(r===0&&(i===2||i===3)) continue; s+=`<rect x="${22+i*32}" y="${206+r*24}" width="26" height="15" rx="4" fill="#3a3a40"/>`; }
    for(let r=0;r<4;r++) for(let i=0;i<5;i++){ const blue=r===0&&i>2; s+=`<rect x="${22+i*38}" y="${312+r*36}" width="30" height="22" rx="5" fill="${blue?'#2a62c8':'#f3f3f5'}"/>`; }
  }
  return s+'</svg>';
}
document.getElementById('cw').innerHTML=svgCalc('cw');
document.getElementById('dx').innerHTML=svgCalc('dx');

// ---------- Symbole ----------
const IC={
 grund:`<svg viewBox="0 0 120 84"><rect x="4" y="4" width="112" height="76" rx="14" fill="#eef2fa"/><g font-family="Arial" font-weight="bold" fill="#1F4E99" text-anchor="middle"><text x="36" y="38" font-size="28">+</text><text x="84" y="38" font-size="28">−</text><text x="36" y="70" font-size="28">×</text><text x="84" y="70" font-size="28">÷</text></g></svg>`,
 stat:`<svg viewBox="0 0 120 84"><rect x="4" y="4" width="112" height="76" rx="14" fill="#eef2fa"/><g stroke="#1F4E99" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M16 42h14M90 42h14M16 32v20M104 32v20"/><rect x="30" y="26" width="60" height="32" rx="3" fill="#c9d6ee"/><path d="M58 26v32"/></g><g fill="#1F4E99"><circle cx="22" cy="70" r="3"/><circle cx="40" cy="70" r="3"/><circle cx="52" cy="70" r="3"/><circle cx="62" cy="70" r="3"/><circle cx="74" cy="70" r="3"/><circle cx="98" cy="70" r="3"/></g></svg>`,
 tour:`<svg viewBox="0 0 58 58" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="4" width="26" height="46" rx="5"/><rect x="15" y="10" width="16" height="10" rx="1.5" fill="#fff" stroke="none" opacity=".9"/><circle cx="17" cy="28" r="1.4" fill="#fff"/><circle cx="23" cy="28" r="1.4" fill="#fff"/><circle cx="29" cy="28" r="1.4" fill="#fff"/><circle cx="17" cy="35" r="1.4" fill="#fff"/><circle cx="23" cy="35" r="1.4" fill="#fff"/><circle cx="29" cy="35" r="1.4" fill="#fff"/><path d="M38 40l8 4 4-8-8-4M40 46l-4 8" stroke-width="3"/><path d="M33 22l7 13 3-6 6 1z" fill="#F2B705" stroke="#fff" stroke-width="2"/></svg>`,
 ueb:`<svg viewBox="0 0 58 58" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30l12 12 30-30"/><path d="M8 50h42" opacity=".6"/></svg>`,
 funk:`<svg viewBox="0 0 120 84"><rect x="4" y="4" width="112" height="76" rx="14" fill="#eef2fa"/><path d="M18 68h86M30 74V12" stroke="#1F4E99" stroke-width="3" stroke-linecap="round"/><path d="M38 18C50 76 74 76 90 18" fill="none" stroke="#1F4E99" stroke-width="4" stroke-linecap="round"/><path d="M78 68V44H30" fill="none" stroke="#F2B705" stroke-width="3" stroke-dasharray="5 4"/><circle cx="78" cy="44" r="4.5" fill="#F2B705"/></svg>`,
 pdf:`<svg viewBox="0 0 58 58" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"><path d="M12 4h24l12 12v38H12z"/><path d="M36 4v12h12"/><path d="M19 28h20M19 36h20M19 44h14" stroke-linecap="round"/><path d="M38 40l5 5 8-10" stroke="#9fe0a5" stroke-width="4" stroke-linecap="round"/></svg>`
};
const BASE='https://olafkott.github.io/CAS/fx991/';
const DATA={
 cw:[["grund","fx991_Grundlagen_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991_Grundlagen.pdf",null],
     ["stat","fx991_Lage_Streuung_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991_Lage_Streuung.pdf","fx991_Uebung_Lage_Streuung.html"],
     ["funk","fx991_Funktionswerte_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991_Funktionswerte.pdf","fx991_Uebung_Funktionswerte.html"]],
 dx:[["grund","fx991DEX_Grundlagen_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991DEX_Grundlagen.pdf",null],
     ["stat","fx991DEX_Lage_Streuung_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991DEX_Lage_Streuung.pdf","fx991DEX_Uebung_Lage_Streuung.html"],
     ["funk","fx991DEX_Funktionswerte_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991DEX_Funktionswerte.pdf","fx991DEX_Uebung_Funktionswerte.html"],
     ["gl","fx991DEX_Gleichungen_Schritt_fuer_Schritt.html","Arbeitsblatt_fx991DEX_Gleichungen.pdf","fx991DEX_Uebung_Gleichungen.html"]]
};
const NAME={grund:"Grundlagen",stat:"Lage- und Streuungsmaße",funk:"Funktionswerte",gl:"Gleichungen lösen"};
const stage=document.getElementById('stage'), toc=document.getElementById('toc');
function pick(m){
  toc.innerHTML=`<div class="model">${m==='cw'?'fx-991DE CW':'fx-991DE X'}</div>`+DATA[m].map(([ic,tour,pdf,ueb],i)=>`<div class="topic"><div class="th"><span class="num">${i+1}</span><span class="ttl">${NAME[ic]}</span></div>
    <div class="acts"><a class="act tour" href="${BASE+tour}" target="_blank" rel="noopener">${IC.tour}<span>Anleitung</span></a>
    <a class="act pdf" href="${BASE+pdf}" target="_blank" rel="noopener">${IC.pdf}<span>Arbeitsblatt</span></a>
    ${ueb?`<a class="act ueb" href="${BASE+ueb}" target="_blank" rel="noopener">${IC.ueb}<span>Übung</span></a>`:'<span class="act gap"></span>'}</div></div>`).join('');
  stage.className='stage pick pick-'+m;
  try{ history.replaceState(null,'','#'+m); }catch(e){}
}
function reset(){ stage.className='stage'; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
document.getElementById('cw').onclick=()=>{ if(!stage.classList.contains('pick')) pick('cw'); };
document.getElementById('dx').onclick=()=>{ if(!stage.classList.contains('pick')) pick('dx'); };
document.getElementById('back').onclick=reset;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') reset(); });
const h=location.hash.slice(1); if(DATA[h]) pick(h);
</script>
</body></html>
