<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Lineare Optimierung</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.dt{ overflow-x:auto; }
table.d{ border-collapse:collapse; font-size:16px; margin:2px 0 4px; }
table.d th, table.d td{ border:1px solid #c3c8d0; padding:4px 10px; text-align:center; min-width:40px; }
table.d th{ background:#eef0f3; font-family:Cambria,Georgia,serif; font-style:italic; }
.spalten{ font-size:13.5px; color:var(--mute); margin-top:6px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
.f label{ font-size:15px; }
.f label .z{ color:var(--mute); font-family:Cambria,Georgia,serif; font-size:14px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }

.term{ font-family:Cambria,Georgia,serif; font-size:22px; text-align:center; margin:4px 0 8px; }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.plot .cv{ fill:none; stroke:#1d1d1f; stroke-width:2.2; } .plot .ar{ stroke-width:2; stroke-dasharray:6 4; fill:none; }
.plot .ml{ font:bold 13px system-ui,Arial,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ border-left:5px solid #ccc; }
.f .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.f.gl{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.f.gl > label:first-child{ min-width:150px; font-family:Cambria,Georgia,serif; font-size:16px; }
.f.gl .xin{ display:inline-flex; align-items:center; gap:6px; }
.f.gl .xin .z{ font-family:Cambria,Georgia,serif; font-size:15px; }
.f.gl .kl{ font-size:14.5px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.f.gl .kl input{ width:18px; height:18px; }
.f.gl .m{ margin-left:auto; }
.f.gl .msg{ flex-basis:100%; }
.f label{ font-family:Cambria,Georgia,serif; font-size:16px; }
.liste{ font-weight:normal; }

.f.co{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; border-left-color:#1F4E99; }
.f.co > label{ min-width:72px; }
.f.co .cos{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; font-family:Cambria,Georgia,serif; font-size:17px; }
.f.co input.ci{ width:76px; }
.f.co input.bad{ border-color:var(--no); background:#fff6f5; }
.f.co .pl{ color:var(--mute); }
.f.co .m{ margin-left:auto; }
.f.co .msg{ flex-basis:100%; }

.fen{ text-align:center; font-family:Cambria,Georgia,serif; font-size:15.5px; color:var(--mute); margin:-2px 0 6px; }
.f.co > label{ min-width:58px; }
.f.co input.ci{ width:86px; }

.int{ display:inline-flex; align-items:center; vertical-align:middle; }
.int .is{ font-family:Cambria,Georgia,serif; font-size:24px; line-height:1; font-style:italic; }
.int .lim{ display:inline-flex; flex-direction:column; justify-content:space-between; font-size:11px; line-height:1.1; height:28px; }
.f.co > label{ white-space:nowrap; }
.restr{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px 26px; font-family:Cambria,Georgia,serif; font-size:18px; margin:4px 0 8px; }
.restr b{ font-family:system-ui,Arial,sans-serif; font-size:14px; color:var(--mute); font-weight:600; }
.var{ display:flex; flex-wrap:wrap; gap:4px 24px; margin:0 0 6px; padding:6px 12px; background:#f3f5f9; border-radius:8px; font-size:15px; }
.term{ font-weight:bold; color:var(--lf); }
table.d td.best{ background:#FDECEA; color:#C62828; font-weight:bold; }
#eck{ margin-top:8px; overflow-x:auto; }
.plot .ml{ font:bold 12px system-ui,Arial,sans-serif; }
#felder{ grid-template-columns:1fr 1fr 1fr; }
@media (max-width:760px){ #felder{ grid-template-columns:1fr; } }
.f.co input.ci{ width:96px; }
/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

    <div class="stats" id="stats"></div>
  </div>
  <p class="hinweis" id="hinweis"></p>
</div>
<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; };
const deN=v=>String(v).replace('-','−').replace('.',',');
const ROM=['I','II','III'];
function lin(a,b,c){ // a x + b y ≤ c  als HTML
  const t=(k,v)=>(k===1?'':k)+v;
  return `${t(a,'<i>x</i>')} + ${t(b,'<i>y</i>')} ≤ ${c}`;
}
function casLine(a,b,c){ const ax=(a===1?'':a)+'x'; return b===1?`${c}-${ax}`:`(${c}-${ax})/${b}`; }

// ---------- Zufallsaufgabe: Planungsvieleck mit 5 ganzzahligen Ecken, eindeutiges Maximum ----------
function genLP(){
  for(let tries=0;tries<20000;tries++){
    const A=[0,R(4,10)], B=[R(1,5),0], C=[0,0], D=[R(5,12),0];
    B[1]=R(2,A[1]-1); C[0]=R(B[0]+1,Math.min(D[0]-1,B[0]+6)); C[1]=R(1,B[1]-1);
    if(!(C[0]>B[0]&&C[0]<D[0])) continue;
    const s1=(B[1]-A[1])/B[0], s2=(C[1]-B[1])/(C[0]-B[0]), s3=(0-C[1])/(D[0]-C[0]);
    if(!(s1>s2+0.15&&s2>s3+0.15)) continue;          // konvex, deutliche Knicke
    const P=[A,B,C,D], L=[];
    let ok=true;
    for(let i=0;i<3;i++){ const p=P[i], q=P[i+1];
      let a=p[1]-q[1], b=q[0]-p[0]; const g=gcd(a,b); a/=g; b/=g; const c=a*p[0]+b*p[1];
      if(a<1||b<1||a>9||b>9||c>60) { ok=false; break; }
      L.push({a,b,c}); }
    if(!ok) continue;
    const ECK=[[0,0],A,B,C,D];
    // jede Ecke erfüllt alle Restriktionen
    if(!ECK.every(e=>L.every(l=>l.a*e[0]+l.b*e[1]<=l.c))) continue;
    // Zielfunktion Z = p x + q y mit eindeutigem Maximum (Abstand zum Zweitbesten)
    const p=5*R(2,18), q=5*R(2,18);
    const Z=ECK.map(e=>p*e[0]+q*e[1]); const srt=[...Z].sort((u,v)=>v-u);
    if(srt[0]-srt[1]<Math.max(10,srt[0]*0.03)) continue;
    const opt=Z.indexOf(srt[0]);
    if(opt<2&&Math.random()<0.7) continue;               // meist eine innere Ecke
    return {L,ECK,p,q,Z,opt};
  }
  return null;
}


// ---------- Zeichnung (erscheint mit der Lösung) ----------
const COL=['#1F4E99','#C8102E','#2E7D32'];
function plot(A){
  const xm=Math.max(...A.L.map(l=>l.c/l.a)), ym=Math.max(...A.L.map(l=>l.c/l.b));
  const w={x0:-1,x1:Math.min(Math.ceil(xm)+1,A.ECK[4][0]+5),y0:-1,y1:Math.min(Math.ceil(ym)+1,A.ECK[1][1]+5)};
  const W=640, H=Math.round(Math.min(460,Math.max(300,W*(w.y1-w.y0)/(w.x1-w.x0)))), pl=30, pr=26, pt=18, pb=26;
  const X=x=>pl+(x-w.x0)*(W-pl-pr)/(w.x1-w.x0), Y=y=>pt+(w.y1-y)*(H-pt-pb)/(w.y1-w.y0);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Planungsvieleck">`;
  for(let x=Math.ceil(w.x0);x<=w.x1;x++) o+=`<line x1="${X(x)}" y1="${Y(w.y0)}" x2="${X(x)}" y2="${Y(w.y1)}" class="gl"/>`;
  for(let y=Math.ceil(w.y0);y<=w.y1;y++) o+=`<line x1="${X(w.x0)}" y1="${Y(y)}" x2="${X(w.x1)}" y2="${Y(y)}" class="gl"/>`;
  o+=`<polygon points="${A.ECK.map(e=>X(e[0])+','+Y(e[1])).join(' ')}" fill="#9aa3b0" fill-opacity=".35"/>`;
  o+=`<line x1="${X(w.x0)}" y1="${Y(0)}" x2="${X(w.x1)+12}" y2="${Y(0)}" class="ax"/><path d="M${X(w.x1)+16} ${Y(0)} l-8 -4 v8z" class="ah"/>`;
  o+=`<line x1="${X(0)}" y1="${Y(w.y0)}" x2="${X(0)}" y2="${Y(w.y1)-10}" class="ax"/><path d="M${X(0)} ${Y(w.y1)-14} l-4 8 h8z" class="ah"/>`;
  o+=`<text x="${X(w.x1)+8}" y="${Y(0)+18}" class="al">x</text><text x="${X(0)+8}" y="${Y(w.y1)-4}" class="al">y</text>`;
  for(let x=1;x<=w.x1;x++) if(x%2===0||w.x1<=10) o+=`<text x="${X(x)}" y="${Y(0)+15}" class="tl" text-anchor="middle">${x}</text>`;
  for(let y=1;y<=w.y1;y++) if(y%2===0||w.y1<=10) o+=`<text x="${X(0)-6}" y="${Y(y)+4}" class="tl" text-anchor="end">${y}</text>`;
  o+=`<defs><clipPath id="cp"><rect x="${X(w.x0)}" y="${Y(w.y1)}" width="${X(w.x1)-X(w.x0)}" height="${Y(w.y0)-Y(w.y1)}"/></clipPath></defs><g clip-path="url(#cp)">`;
  A.L.forEach((l,i)=>{ const f=x=>(l.c-l.a*x)/l.b; o+=`<line x1="${X(w.x0)}" y1="${Y(f(w.x0))}" x2="${X(w.x1)}" y2="${Y(f(w.x1))}" stroke="${COL[i]}" stroke-width="2.2"/>`; });
  o+='</g>';
  A.L.forEach((l,i)=>{ // Beschriftung der Geraden am oberen bzw. rechten Rand
    const f=x=>(l.c-l.a*x)/l.b; let x=w.x1-0.4, y=f(x); if(y<w.y0+0.6){ y=w.y0+0.8+i*0.9; x=(l.c-l.b*y)/l.a; } if(y>w.y1-0.3){ y=w.y1-0.6; x=(l.c-l.b*y)/l.a; }
    o+=`<text x="${X(x)+6}" y="${Y(y)-6}" fill="${COL[i]}" class="ml">${ROM[l.k]}</text>`; });
  A.ECK.forEach((e,i)=>{ const best=i===A.opt;
    o+=`<circle cx="${X(e[0])}" cy="${Y(e[1])}" r="${best?7:5}" fill="${best?'#C62828':'#1d1d1f'}"/>`;
    o+=`<text x="${X(e[0])+8}" y="${Y(e[1])-8}" fill="${best?'#C62828':'#1d1d1f'}" class="ml">(${e[0]}|${e[1]}) Z=${A.Z[i]}</text>`; });
  return o+'</svg>';
}

// ---------- Aufgaben ----------
let A=null, stat={a:0,r:0}, shown=false;

function neu(){
  A=genLP(); shown=false;
  // Restriktionen in zufälliger Reihenfolge nummerieren
  const ord=[0,1,2].sort(()=>Math.random()-.5); ord.forEach((j,k)=>{ A.L[j].k=k; });
  const Ls=[...A.L].sort((u,v)=>u.k-v.k);
  
  document.getElementById('h').textContent='Aufgabe: Maximum bestimmen';
  document.getElementById('auftrag').innerHTML='Bestimmen Sie mit dem CAS das Maximum der Zielfunktion unter den Restriktionen.';
  document.getElementById('restr').innerHTML=Ls.map(l=>`<span><b>(${ROM[l.k]})</b> ${lin(l.a,l.b,l.c)}</span>`).join('')+'<span><i>x</i>, <i>y</i> ≥ 0</span>';
  document.getElementById('term').innerHTML=`Zielfunktion: <i>Z</i>(<i>x</i>,<i>y</i>) = ${A.p}<i>x</i> + ${A.q}<i>y</i> → max`;
  const xm=Math.ceil(Math.max(...A.L.map(l=>l.c/l.a))), ym=Math.ceil(Math.max(...A.L.map(l=>l.c/l.b)));
  document.getElementById('fen').innerHTML=`Fenster-Vorschlag: −1 ≤ <i>x</i> ≤ ${Math.min(xm,A.ECK[4][0]+5)} und −1 ≤ <i>y</i> ≤ ${Math.min(ym,A.ECK[1][1]+5)}`;
  document.getElementById('plot').innerHTML=''; document.getElementById('eck').innerHTML='';
  document.getElementById('hinweis').innerHTML='Tipp: Restriktionen nach <i>y</i> umstellen, z.&nbsp;B. '+Ls.map(l=>`<span class="liste">f${l.k+1}(x)=${casLine(l.a,l.b,l.c)}</span>`).join(' ')+
    ' · Ecken: <b>solve(f1(x)=f2(x),x)</b>, Nullstellen und Achsenabschnitte · Zielfunktion: <b>menu ▸ 1 ▸ 1: Definieren</b> <span class="liste">z(x,y)='+A.p+'x+'+A.q+'y</span>, dann <span class="liste">z(…,…)</span> in jeder Ecke.';
  const F=[['x','<i>x</i> =',A.ECK[A.opt][0],'#1F4E99'],['y','<i>y</i> =',A.ECK[A.opt][1],'#C25E00'],['z','<i>Z</i><sub>max</sub> =',A.Z[A.opt],'#C62828']];
  A.felder=F;
  document.getElementById('felder').innerHTML=F.map(f=>`<div class="f co" id="f_${f[0]}" style="border-left-color:${f[3]}"><label><span class="dot" style="background:${f[3]}"></span>${f[1]}</label><span class="cos"><input id="i_${f[0]}" inputmode="numeric" autocomplete="off" class="ci"></span><span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace('€','').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return parseFloat(s); }
function zeigeLoesung(){
  document.getElementById('plot').innerHTML=plot(A);
  document.getElementById('eck').innerHTML='<table class="d"><tr><th>Ecke</th>'+A.ECK.map(e=>`<td>(${e[0]} | ${e[1]})</td>`).join('')+'</tr><tr><th>Z</th>'+A.Z.map((z,i)=>`<td class="${i===A.opt?'best':''}">${z}</td>`).join('')+'</tr></table>';
}
function pruefen(){
  let r=0;
  A.felder.forEach(f=>{ const el=document.getElementById('f_'+f[0]), v=parse(document.getElementById('i_'+f[0]).value), m=el.querySelector('.m'), msg=el.querySelector('.msg');
    el.classList.remove('ok','no','fmt','show');
    if(v===null){ el.classList.add('fmt'); m.textContent='?'; msg.textContent='Bitte eine Zahl eintragen.'; return; }
    if(Math.abs(v-f[2])<1e-9){ el.classList.add('ok'); m.textContent='✓'; msg.textContent=''; r++; }
    else { el.classList.add('no'); m.textContent='✗';
      const isEck=A.ECK.some(e=>(f[0]==='x'&&e[0]===v)||(f[0]==='y'&&e[1]===v));
      msg.textContent=f[0]==='z'?(A.Z.includes(v)?'Das ist Z in einer anderen Ecke. Vergleichen Sie alle Ecken.':'Prüfen Sie die Zielfunktion und die Ecke.'):
        (isEck?'Das ist eine Ecke – aber nicht die mit dem größten Z.':'Prüfen Sie die Schnittpunkte der Randgeraden.'); }
  });
  if(!A.gezaehlt){ stat.a++; A.gezaehlt=true; } if(r===A.felder.length&&!A.geloest&&!shown){ stat.r++; A.geloest=true; }
  document.getElementById('score').innerHTML=r===A.felder.length?'<span style="color:var(--ok)">✓ Alles richtig!</span>':`${r} von ${A.felder.length} richtig.`;
  document.getElementById('stats').textContent=`Bisher: ${stat.r} von ${stat.a} Aufgaben vollständig richtig.`;
  if(r===A.felder.length) zeigeLoesung();
}
function zeigen(){
  A.felder.forEach(f=>{ const el=document.getElementById('f_'+f[0]); document.getElementById('i_'+f[0]).value=String(f[2]); el.classList.remove('ok','no','fmt'); el.classList.add('show'); el.querySelector('.m').textContent=''; el.querySelector('.msg').textContent=''; });
  zeigeLoesung(); shown=true;
  document.getElementById('score').textContent='Lösung angezeigt.';
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
neu();
</script>

</body></html>
