function step(S,k){
  if(S.mode==='off'){ if(k==='on') S.mode='calc'; return; }
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='ac'){ S.mode='off'; return; } if(k==='-') k='neg'; else if(k==='pow') k='inv'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  const up=()=>{ S.sel=Math.max(0,S.sel-1); }, dn=n=>{ S.sel=Math.min(n-1,S.sel+1); };
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if((k==='ok'||k==='exe')&&S.sel===9){ S.mode='calc'; S.line=[]; S.out=null; }
     return;
   case 'calc':
     if(k==='tools'){ S.mode='vlist'; S.sel=0; return; }
     if(k==='cat'){ S.mode='cat'; S.lvl=0; S.sel=0; return; }
     calcKey(S,k); return;
   case 'vlist':
     if(k==='up') up(); else if(k==='down') dn(4);
     else if(k==='ok'||k==='exe'){ S.v=MN[S.sel]; if(S.M[S.v]){ S.mode='vsub'; S.sel=0; } else { S.mode='size'; S.nr=2; S.nc=2; S.sel=0; } }
     else if(k==='ac'||k==='back') S.mode='calc';
     return;
   case 'vsub':
     if(k==='up') up(); else if(k==='down') dn(2);
     else if(k==='ok'||k==='exe'){ if(S.sel===0){ S.mode='size'; S.nr=2; S.nc=2; S.sel=0; } else openEd(S,S.v); }
     else if(k==='back'){ S.mode='vlist'; S.sel=MN.indexOf(S.v); } else if(k==='ac') S.mode='calc';
     return;
   case 'size':
     if(k==='up') up(); else if(k==='down') dn(3);
     else if(k==='ok'||k==='exe'){ if(S.sel===0){ S.mode='rlist'; S.sel=S.nr-1; } else if(S.sel===1){ S.mode='clist'; S.sel=S.nc-1; } else { S.M[S.v]=zeros(S.nr,S.nc); openEd(S,S.v); } }
     else if(k==='back'||k==='ac') S.mode='calc';
     return;
   case 'rlist': case 'clist':
     if(k==='up') up(); else if(k==='down') dn(4);
     else if(k==='ok'||k==='exe'){ if(S.mode==='rlist'){ S.nr=S.sel+1; S.sel=0; } else { S.nc=S.sel+1; S.sel=1; } S.mode='size'; }
     else if(k==='back'){ S.sel=S.mode==='rlist'?0:1; S.mode='size'; }
     return;
   case 'edit':
     if(k==='ac'||k==='back'){ S.mode='calc'; S.line=[]; S.out=null; return; }
     if(k==='-') k='neg';
     edKey(S,k); return;
   case 'cat': {
     const L=[CATS,CMAT,CCALC][S.lvl];
     if(k==='up') up(); else if(k==='down') dn(L.length);
     else if(k==='back'){ if(S.lvl===0) S.mode='calc'; else { S.lvl--; S.sel=S.lvl===1?5:0; } }
     else if(k==='ac') S.mode='calc';

     }

   case 'err': errKey(S,k); return;
  }
}

 exe:"EXE",ac:"AC",del:"⌫","-":"−","+":"+","*":"×","/":"÷",x:'<i class="v">x</i>',"(":"(",")":")",sq:'<span class="bx"></span><sup>2</sup>',pow:'x<sup>■</sup>'};

const AB=(nr,items)=>`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: ${nr}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Am eigenen Rechner rechnen, Ergebnisse auf dem Blatt eintragen, dann <b>Weiter</b>.</p></div>`;

function MXP(m,name,cls){

const FR=(p,q)=>(p<0?'−':'')+`<span class="frp"><span>${Math.abs(p)}</span><span>${q}</span></span>`;
const MA=[[2,1],[3,4]], MB=[[1,0],[2,-1],[3,4]];

// ---------------- Teil 1: Definieren und bearbeiten
const MAfehler=[[2,1],[3,'<b style="color:#C62828">7</b>']];
const T1=T1start().map(s=>Object.assign({a:MXP(MA,'A')},s)).concat([
  {t:"Elemente eingeben", a:MXP(MA,'A')+'<small>Wir tippen absichtlich einen Fehler: <b>7</b> statt 4.</small>', k:RK([2,1,3,7]),

  {t:"Zurück zur Rechenzeile", a:MXP(MAfehler,'A'), k:['ac'],

   n:'Ein einzelnes Feld ändern Sie immer so: <b>Matrix bearbeiten</b>, mit den Pfeilen hinspringen, neue Zahl, bestätigen.'},

   d:DEFTXT.B+`<p>Eine Matrix muss nicht quadratisch sein. <b>B</b> hat <b>3 Zeilen</b> und <b>2 Spalten</b>: eine 3×2-Matrix.</p>`},
  {t:"MatB eingeben", a:MXP(MB,'B'), k:RK([1,0,2,-1,3,4]).concat(['ac']),

   n:'Auch die <b>0</b> eintippen und bestätigen – oder mit <b>▶</b> überspringen, denn im Editor steht schon 0.'},
  {t:"Gespeicherte Matrix anzeigen", a:MXP(MB,'B'), k:kB.concat([EX]), z:['res'],
   d:`<p>So holen Sie eine Matrix in die Rechenzeile: ${mB}. Mit ${E} zeigt der Rechner die Matrix an.</p><p>Das Ergebnis-Fenster heißt <b>${MODEL==='cw'?'MatAns':'Ans'}</b> – der Rechner merkt sich das letzte Ergebnis.</p>`},
  {t:"Arbeitsblatt vorbereiten", k:[], ab:1, d:`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: Matrizen speichern</div><ul><li>Die Matrizen <b>A</b>, <b>B</b> und <b>C</b> vom Arbeitsblatt als MatA, MatB, MatC speichern: ${MOD.t.def}</li><li>Tippfehler korrigieren: ${MOD.t.edit}</li><li>Kontrolle: Matrix aufrufen und mit ${E} anzeigen</li></ul><p>Die Aufgaben auf dem Blatt kommen nach Teil 2. Jetzt <b>Weiter</b>.</p></div>`}
]);

// ---------------- Teil 2: Addition, skalare Multiplikation, Multiplikation
const T2=[
  {t:"Addition: A + A", a:AB2, k:['ac'].concat(kA,['+'],kA,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatA <b>+</b> MatA und ${E}. Die Matrizen holen Sie mit ${MODEL==='cw'?'<b>CATALOG</b> ▸ Matrix':'<b>OPTN</b>'} in die Rechenzeile.</p><p>Der Rechner addiert <b>Feld für Feld</b>: 2 + 2 = 4, 1 + 1 = 2 …</p>`+MXP([[4,2],[6,8]],'A + A'),
   n:VOR},
  {t:"Skalare Multiplikation: 2 · A", a:AB2, k:['ac','2','*'].concat(kA,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann <b>2</b> <b>×</b> MatA, ${E}.</p><p>Eine Zahl mal Matrix: <b>jedes Feld</b> wird mit 2 multipliziert. Das Ergebnis ist dasselbe wie bei A + A.</p>`+MXP([[4,2],[6,8]],'2 · A')},
  {t:"Addition geht nicht: A + B", a:AB2, k:['ac'].concat(kA,['+'],kB,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatA <b>+</b> MatB, ${E}.</p><p>Der Rechner meldet einen <b>${DIMF}</b>: A ist 2×2, B ist 3×2.</p>`,
   n:'Addieren und Subtrahieren geht nur bei Matrizen <b>gleicher Größe</b>.'},
  {t:"Multiplikation: B · A", a:AB2, k:['ac'].concat(kB,['*'],kA,[EX]), z:['res'],
   d:`<p><b>AC</b> schließt die Meldung. Dann MatB <b>×</b> MatA, ${E}.</p><p>Gerechnet wird <b>Zeile mal Spalte</b>: oben links 1 · 2 + 0 · 3 = 2.</p><p>(3×<b>2</b>) mal (<b>2</b>×2): Die inneren Zahlen sind gleich – das geht. Das Ergebnis ist 3×2.</p>`+MXP([[2,1],[1,-2],[18,19]],'B · A')},
  {t:"Andersherum geht nicht: A · B", a:AB2, k:['ac'].concat(kA,['*'],kB,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatA <b>×</b> MatB, ${E}.</p><p>Wieder ein <b>${DIMF}</b>: (2×<b>2</b>) mal (<b>3</b>×2) – die inneren Zahlen 2 und 3 passen nicht.</p>`,
   n:'Multiplizieren geht nur, wenn <b>Spaltenzahl der ersten = Zeilenzahl der zweiten</b> Matrix ist. Die Reihenfolge ist wichtig: B · A geht, A · B nicht.'},
  {t:"Meldung schließen", a:AB2, k:['ac'], d:`<p>Mit <b>AC</b> schließen Sie die Meldung.</p>`},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 1",[`Matrizen mit ${MODEL==='cw'?'<b>CATALOG</b> ▸ Matrix':'<b>OPTN</b>'} in die Rechenzeile holen`,`Rechenzeichen <b>+</b>, <b>−</b>, <b>×</b> wie gewohnt`,`Zahl mal Matrix: z. B. <b>2</b> × MatA`,`Fehlermeldung? Dann geht die Rechnung nicht – ankreuzen`])}
];

// ---------------- Teil 3: Potenzen
const T3=[
  {t:"Quadrat: A²", a:AB2, k:['ac'].concat(kA,MOD.SQ,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatA, dann ${MOD.t.sq}, dann ${E}.</p>`+MXP([[7,6],[18,19]],'A²'),
   n:'A² bedeutet <b>A · A</b> (Zeile mal Spalte) – nicht jedes Feld einzeln quadrieren! Oben links steht 7, nicht 2² = 4.'},
  {t:"Zurück: AC", a:AB2, k:['ac'], d:`<p><b>AC</b>.</p>`},
  {t:"Hoch drei: A³", a:AB2, k:A3K(), z:['res'], d:A3TXT+MXP([[32,31],[93,94]],'A³')},
  {t:"Höhere Potenzen: A⁴", a:AB2, k:['*'].concat(kA,[EX]), z:['res'],
   d:`<p>A³ steht noch im Ergebnisfenster. Drücken Sie jetzt <b>×</b>: Der Rechner schreibt automatisch <b>MatAns×</b> in die Rechenzeile. Dann MatA und ${E}.</p><p>A³ · A = <b>A⁴</b>:</p>`+MXP([[157,156],[468,469]],'A⁴'),
   n:'Für jede weitere Potenz: noch einmal <b>×</b> MatA '+E+'.'},
  {t:"B² geht nicht", a:AB2, k:['ac'].concat(kB,MOD.SQ,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatB ${MOD.t.sq} ${E}.</p><p>Der Rechner meldet einen <b>${DIMF}</b>.</p>`,
   n:'Potenzen gibt es nur bei <b>quadratischen</b> Matrizen (gleich viele Zeilen und Spalten). B ist 3×2.'},
  {t:"Meldung schließen", a:AB2, k:['ac'], d:`<p><b>AC</b>.</p>`},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 2",[`A²: MatA ${MOD.t.sq} ${E}`,`A³: MatA ${MOD.t.cube} ${E}`,`Höhere Potenzen: im Ergebnisfenster <b>×</b> MatA ${E} – so oft wie nötig`,`Brüche im Ergebnis? Als Dezimalzahl notieren`])}
];

// ---------------- Teil 4: Transponieren
const T4=[
  {t:"Transponieren: Trn(B)", a:AB2, k:['ac'].concat(MOD.TRN,kB,[')',EX]), z:['res'],
   d:`<p>Die <b>transponierte</b> Matrix B<sup>T</sup> entsteht, wenn man <b>Zeilen und Spalten tauscht</b>.</p><p><b>AC</b>, dann ${MOD.t.trn}. Der Rechner schreibt <b>Trn(</b>. Dann ${mB}, Klammer zu <b>)</b> und ${E}.</p>`+MXP([[1,2,3],[0,-1,4]],'B<sup>T</sup>'),
   n:'Aus der 3×2-Matrix wird eine <b>2×3</b>-Matrix. Die 1. Spalte von B wird die 1. Zeile von B<sup>T</sup>.'},
  {t:"Zurück: AC", a:AB2, k:['ac'], d:`<p><b>AC</b>.</p>`},
  {t:"Trn(A)", a:AB2, k:MOD.TRN.concat(kA,[')',EX]), z:['res'],
   d:`<p>Genauso für A: Trn( MatA ) ${E}.</p>`+MXP([[2,3],[1,4]],'A<sup>T</sup>')+`<p>Die Zahlen auf der Diagonale (2 und 4) bleiben stehen. Die anderen tauschen den Platz.</p>`},
  {t:"Rechnen mit Bᵀ: Bᵀ · B", a:AB2, k:['ac'].concat(MOD.TRN,kB,[')','*'],kB,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann Trn( MatB ) <b>×</b> MatB ${E}.</p><p>(2×<b>3</b>) mal (<b>3</b>×2) – das geht und ergibt eine quadratische 2×2-Matrix:</p>`+MXP([[14,10],[10,17]],'B<sup>T</sup> · B')},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 3",[`Transponieren: ${MOD.t.trn}`,`Dann die Matrix, Klammer zu <b>)</b>, ${E}`,`Größe des Ergebnisses notieren: aus m×n wird n×m`])}
];

// ---------------- Teil 5: Determinante und Inverse
const Ainv=[[FR(4,5),FR(-1,5)],[FR(-3,5),FR(2,5)]];
const T5=[
  {t:"Determinante: Det(A)", a:AB2, k:['ac'].concat(MOD.DET,kA,[')',EX]), z:['res'],
   d:`<p><b>AC</b>, dann ${MOD.t.det}. Der Rechner schreibt <b>Det(</b>. Dann ${mA}, <b>)</b> und ${E}.</p><p>Ergebnis: <b>det(A) = 5</b>. Die Determinante ist eine <b>Zahl</b>, keine Matrix.</p>`,
   n:'Zur Kontrolle (2×2): det(A) = 2 · 4 − 1 · 3 = 5. Ist det = 0, gibt es keine Inverse.'},
  {t:"Inverse: A⁻¹", a:AB2, k:['ac'].concat(kA,MOD.INV,[EX]), z:['res'],
   d:`<p><b>AC</b>, dann MatA und ${MOD.t.inv}, dann ${E}.</p>`+MXP(Ainv,'A<sup>−1</sup>')+`<p>Die Inverse enthält oft <b>Brüche</b>.</p>`,
   n:MODEL==='cw'?'Die Inverse steht im Katalog unter <b>Matrizenrechnung</b> – nicht mit ÷ rechnen!':'Für die Inverse nehmen Sie <b>x<sup>−1</sup></b> – nicht ÷!'},
  {t:"Probe: A⁻¹ · A = E", a:AB2, k:['*'].concat(kA,[EX]), z:['res'],
   d:`<p>Die Inverse steht im Ergebnisfenster. <b>×</b> MatA ${E}.</p>`+MXP([[1,0],[0,1]],'E')+`<p>Heraus kommt die <b>Einheitsmatrix E</b>: Einsen auf der Diagonale, sonst Nullen. So prüfen Sie jede Inverse.</p>`},
  {t:"Det(B) geht nicht", a:AB2, k:['ac'].concat(MOD.DET,kB,[')',EX]), z:['res'],
   d:`<p><b>AC</b>, dann Det( MatB ) ${E}.</p><p>Der Rechner meldet einen <b>${DIMF}</b>.</p>`,
   n:'Determinante und Inverse gibt es nur bei <b>quadratischen</b> Matrizen.'},
  {t:"Meldung schließen", a:AB2, k:['ac'], d:`<p><b>AC</b>.</p>`},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 4",[`Determinante: ${MOD.t.det}, Matrix, <b>)</b>, ${E}`,`Inverse: Matrix, dann ${MOD.t.inv}, ${E}`,`Fehlermeldung bei der Inverse? Dann ist det = 0`,"Danach: Lösungscode eintragen"])}
];
const TRACKS={
  d:{name:"1 · Definieren und bearbeiten", start:()=>fresh(), steps:T1},
  r:{name:"2 · Addieren und multiplizieren", start:()=>fresh(PRE), steps:T2},
  p:{name:"3 · Potenzen", start:()=>fresh(PRE), steps:T3},
  t:{name:"4 · Transponieren", start:()=>fresh(PRE), steps:T4},
  i:{name:"5 · Determinante und Inverse", start:()=>fresh(PRE), steps:T5}
};


// =====================================================================
//  Steuerung
// =====================================================================
const ORDER=["d","r","p","t","i"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>__D.getElementById(id);
const lbl=k=>LBL[k]||k;
function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); const c=k==='shift'?'shift':k==='alpha'?'alpha':(MODEL==='dx'&&(k==='ac'||k==='del'))?'b':WHITE.test(k)?'w':''; return `<span class="chip ${c} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){
  const T=TRACKS[t], S=T.start();
  for(let j=0;j<s;j++) run(S,T.steps[j].k);
  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?S.z:(S.z||[]).filter(z=>z!=='res'));
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  if(last&&fin) done[tr]=true;
  $('next').className='go';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Weiter ▶';
  $('next').disabled=fin&&last&&!nextT; { const sk=$('skip'); if(sk) sk.disabled=fin&&last&&!nextT; }
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '<span style="color:var(--mute)">Lesen – dann <b>Weiter</b>.</span>';
  hint();
}
function hint(){
  __D.querySelectorAll('.k.hit').forEach(e=>e.classList.remove('hit'));
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1400); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    const want=S.k[pos]; let extra=NEGHINT(k,want);
    if(k==='exe'&&want!=='exe') extra=` Erst die Zahl eintippen, dann mit ${E} bestätigen.`;
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(want,pos).replace('now','now big')}${extra}`;
  }
}
function advance(){ const T=TRACKS[tr]; if(st<T.steps.length-1){ st++; pos=0; } render(); }
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }

const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-','*':'*','/':'/','(':'(',')':')'};
return {
  ORDER, TRACKS, draw, fresh:(typeof fresh!=='undefined'?fresh:null), run,
  render, press, next, back, KMAP,
  selectTrack:function(t){ if(TRACKS[t]){ tr=t; st=0; pos=0; render(); } },
  selectStep:function(i){ st=+i; pos=0; render(); },
  fwd:function(){ if(lock) return; const T=TRACKS[tr], S=T.steps[st];
    if(st<T.steps.length-1){ st++; pos=0; render(); return; }
    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },
  bwd:function(){ if(lock) return; if(st>0){ st--; pos=0; } else pos=0; render(); },
  goto:function(t,s,i){ tr=t; st=s; pos=i; render(); },
  snap:function(){ return {tr,st,pos,D:Object.assign({},done)}; },
  restore:function(o){ tr=o.tr; st=o.st; pos=o.pos; Object.keys(done).forEach(k=>delete done[k]); Object.assign(done,o.D); render(); }
};
 }
};

function step(S,k){
  if(S.mode==='off'){ if(k==='on') S.mode='calc'; return; }
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='ac'){ S.mode='off'; return; } if(k==='-') k='neg'; else if(k==='pow') k='inv'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  const up=()=>{ S.sel=Math.max(0,S.sel-1); }, dn=n=>{ S.sel=Math.min(n-1,S.sel+1); };
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if((k==='ok'||k==='exe')&&S.sel===9){ S.mode='calc'; S.line=[]; S.out=null; }
     return;
   case 'calc':
     if(k==='tools'){ S.mode='vlist'; S.sel=0; return; }
     if(k==='cat'){ S.mode='cat'; S.lvl=0; S.sel=0; return; }
     calcKey(S,k); return;
   case 'vlist':
     if(k==='up') up(); else if(k==='down') dn(4);
     else if(k==='ok'||k==='exe'){ S.v=MN[S.sel]; if(S.M[S.v]){ S.mode='vsub'; S.sel=0; } else { S.mode='size'; S.nr=2; S.nc=2; S.sel=0; } }
     else if(k==='ac'||k==='back') S.mode='calc';
     return;
   case 'vsub':
     if(k==='up') up(); else if(k==='down') dn(2);
     else if(k==='ok'||k==='exe'){ if(S.sel===0){ S.mode='size'; S.nr=2; S.nc=2; S.sel=0; } else openEd(S,S.v); }
     else if(k==='back'){ S.mode='vlist'; S.sel=MN.indexOf(S.v); } else if(k==='ac') S.mode='calc';
     return;
   case 'size':
     if(k==='up') up(); else if(k==='down') dn(3);
     else if(k==='ok'||k==='exe'){ if(S.sel===0){ S.mode='rlist'; S.sel=S.nr-1; } else if(S.sel===1){ S.mode='clist'; S.sel=S.nc-1; } else { S.M[S.v]=zeros(S.nr,S.nc); openEd(S,S.v); } }
     else if(k==='back'||k==='ac') S.mode='calc';
     return;
   case 'rlist': case 'clist':
     if(k==='up') up(); else if(k==='down') dn(4);
     else if(k==='ok'||k==='exe'){ if(S.mode==='rlist'){ S.nr=S.sel+1; S.sel=0; } else { S.nc=S.sel+1; S.sel=1; } S.mode='size'; }
     else if(k==='back'){ S.sel=S.mode==='rlist'?0:1; S.mode='size'; }
     return;
   case 'edit':
     if(k==='ac'||k==='back'){ S.mode='calc'; S.line=[]; S.out=null; return; }
     if(k==='-') k='neg';
     edKey(S,k); return;
   case 'cat': {
     const L=[CATS,CMAT,CCALC][S.lvl];
     if(k==='up') up(); else if(k==='down') dn(L.length);
     else if(k==='back'){ if(S.lvl===0) S.mode='calc'; else { S.lvl--; S.sel=S.lvl===1?5:0; } }
     else if(k==='ac') S.mode='calc';
     else if(k==='ok'||k==='exe'){
       if(S.lvl===0){ if(S.sel===0){ S.lvl=1; S.sel=0; } }
       else if(S.lvl===1){ if(S.sel<4) pushTok(S,MN[S.sel]); else if(S.sel===4) pushTok(S,'Ans'); else { S.lvl=2; S.sel=0; } }
       else { const tk=['sq','cube','inv','det','trn',null,'ref','rref'][S.sel]; if(tk) pushTok(S,tk); }
     }
     return; }
   case 'res': resKey(S,k); return;
   case 'err': errKey(S,k); return;
  }
}

   d:`<p>Der Rechner rechnet nicht mit <i>x</i>, <i>y</i> und <i>z</i>, sondern nur mit den <b>Zahlen davor</b>. Jede Gleichung wird eine <b>Zeile</b>:</p>`+MXP(MA,'A','erw')+`<p>Spalte 1: Zahlen vor <i>x</i> · Spalte 2: vor <i>y</i> · Spalte 3: vor <i>z</i> · Spalte 4: <b>rechte Seite</b>.</p><p>Diese Matrix heißt <b>erweiterte Koeffizientenmatrix</b>.</p>`,
   n:'Steht keine Zahl vor der Variablen, ist es eine <b>1</b>. Bei Minus eine <b>−1</b>. Fehlt eine Variable ganz, tragen Sie <b>0</b> ein.'}
].concat(T1open.map(s=>Object.assign({a:AUFA},s))).concat([

   d:`<p>Tippen Sie <b>zeilenweise</b>: erst Gleichung I (2, 1, −1, 1), dann II, dann III. Jede Zahl mit ${E} bestätigen.</p><p>Vorzeichen mit ${MOD.t.neg}.</p>`},
  {t:"Zurück zur Rechenzeile", a:AUFA, k:['ac'],
   d:`<p>Mit <b>AC</b> verlassen Sie den Editor. Das LGS ist jetzt als <b>MatA</b> gespeichert.</p>`,
   n:`Tippfehler? ${MOD.t.edit}, mit den Pfeilen zum Feld, neue Zahl, ${E}.`},
  {t:"Arbeitsblatt vorbereiten", k:[], ab:1, d:`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: Aufgabe 1</div><ul><li>Erweiterte Matrix zu jedem LGS aufschreiben</li><li>Speichern: ${MOD.t.def}</li><li>3 Gleichungen, 3 Unbekannte → <b>3 Zeilen, 4 Spalten</b></li></ul><p>Dann <b>Weiter</b> mit Teil 2.</p></div>`}
]);

// ---------------- Teil 2: Ref
const T2=[
  {t:"Stufenform: Ref(A)", a:AUFA, k:['ac'].concat(MOD.REF,kA,[')',EX]), z:['res'],
   d:`<p><b>AC</b>, dann ${MOD.t.ref}. Der Rechner schreibt <b>Ref(</b>. Dann ${mA}, Klammer zu <b>)</b> und ${E}.</p>`+MXP(REFA,'Ref(A)','erw')+`<p>Unten links stehen nur noch <b>Nullen</b> – wie eine Treppe. Das ist die <b>Zeilenstufenform</b>. Der Rechner hat das <b>Gauß-Verfahren</b> für Sie gemacht.</p>`,
   n:VOR},
  {t:"Letzte Zeile lesen", a:MXP(REFA,'Ref(A)','erw'), k:[],
   d:`<p>Die letzte Zeile <b>0 0 1 | 3</b> bedeutet:</p><p style="font-family:Cambria,Georgia,serif;font-size:19px">0<i>x</i> + 0<i>y</i> + 1<i>z</i> = 3 &nbsp;→&nbsp; <b><i>z</i> = 3</b></p>`},
  {t:"Rückwärts einsetzen", a:MXP(REFA,'Ref(A)','erw'), k:[],
   d:`<p>Zeile 2 bedeutet: <i>y</i> + <i>z</i> = 5. Mit <i>z</i> = 3 folgt <b><i>y</i> = 2</b>.</p><p>Zeile 1 bedeutet: <i>x</i> + ${FR(1,2)}<i>y</i> − ${FR(1,2)}<i>z</i> = ${FR(1,2)}. Einsetzen: <i>x</i> + 1 − 1,5 = 0,5, also <b><i>x</i> = 1</b>.</p>`,
   n:'Die Stufenform ist <b>nicht eindeutig</b>. Der Rechner teilt jede Zeile so, dass vorne eine <b>1</b> steht. Ihre Rechnung von Hand darf andere Zahlen haben – die Lösung ist trotzdem gleich.'},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 2",[`Stufenform: ${MOD.t.ref}, Matrix, <b>)</b>, ${E}`,`Brüche genau abschreiben – oder mit ${MODEL==='cw'?'<b>FORMAT</b>':'<b>S⇔D</b>'} umschalten`,`Letzte Zeile lesen, dann rückwärts einsetzen`])}
];

// ---------------- Teil 3: Rref
const T3=[
  {t:"Reduzierte Stufenform: Rref(A)", a:AUFA, k:['ac'].concat(MOD.RREF,kA,[')',EX]), z:['res'],
   d:`<p><b>AC</b>, dann ${MOD.t.rref}. Der Rechner schreibt <b>Rref(</b>. Dann ${mA}, <b>)</b> und ${E}.</p>`+MXP(RREFA,'Rref(A)','erw')+`<p>Jetzt stehen auch <b>oberhalb</b> der Einsen Nullen. Links steht die <b>Einheitsmatrix</b>.</p>`,
   n:VOR},
  {t:"Lösung ablesen", a:MXP(RREFA,'Rref(A)','erw'), k:[],
   d:`<p>Jede Zeile ist jetzt fertig gelöst:</p><p style="font-family:Cambria,Georgia,serif;font-size:19px">1<i>x</i> = 1 &nbsp;·&nbsp; 1<i>y</i> = 2 &nbsp;·&nbsp; 1<i>z</i> = 3</p><p>Die Lösung steht in der <b>letzten Spalte</b>: <b><i>x</i> = 1, <i>y</i> = 2, <i>z</i> = 3</b>.</p>`,
   n:'<b>Ref</b> = Stufenform (dann rückwärts einsetzen). <b>Rref</b> = reduzierte Stufenform (Lösung direkt ablesen). Die reduzierte Stufenform ist <b>eindeutig</b>.'},
  {t:"Probe", a:GLA, k:[],
   d:`<p>Setzen Sie zur Kontrolle in eine Gleichung ein, z. B. II:</p><p style="font-family:Cambria,Georgia,serif;font-size:19px">1 + 3 · 2 + 2 · 3 = 13 ✓</p>`},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 3",[`Reduzierte Stufenform: ${MOD.t.rref}, Matrix, <b>)</b>, ${E}`,`Lösung aus der letzten Spalte ablesen`,`Probe in einer Gleichung`])}
];

// ---------------- Teil 4: Sonderfälle
const RREFB=[[1,0,-2,-5],[0,1,3,11],[0,0,0,0]];
const RREFB8=[[1,0,-2,0],[0,1,3,0],[0,0,0,1]];
const MB8=[[1,1,1,6],[2,1,-1,1],[3,2,0,'<b style="color:#C62828">8</b>']];
const T4=[
  {t:"Zweites LGS als MatB", a:GLB+MXP(MB,'B','erw'), k:MOD.DEF('B',3,4).concat(RK([1,1,1,6,2,1,-1,1,3,2,0,7]),['ac']), z:[],
   d:`<p>Speichern Sie das LGS als <b>MatB</b> (3 Zeilen, 4 Spalten): ${MOD.t.def}.</p><p>Bei Gleichung III fehlt <i>z</i>: dort eine <b>0</b> eintragen. Am Ende <b>AC</b>.</p>`},
  {t:"Rref(B): eine Nullzeile", a:GLB, k:MOD.RREF.concat(kB,[')',EX]), z:['res'],
   d:`<p>${MOD.t.rref}, dann ${mB}, <b>)</b> und ${E}.</p>`+MXP(RREFB,'Rref(B)','erw')+`<p>Die letzte Zeile ist <b>0 0 0 | 0</b>, also 0 = 0. Das ist immer wahr – diese Gleichung sagt nichts mehr aus.</p>`},
  {t:"Unendlich viele Lösungen", a:MXP(RREFB,'Rref(B)','erw'), k:[],
   d:`<p>Es bleiben zwei Gleichungen für drei Unbekannte: <i>z</i> ist <b>frei wählbar</b>.</p><p style="font-family:Cambria,Georgia,serif;font-size:18px"><i>x</i> − 2<i>z</i> = −5 &nbsp;→&nbsp; <i>x</i> = −5 + 2<i>z</i><br><i>y</i> + 3<i>z</i> = 11 &nbsp;→&nbsp; <i>y</i> = 11 − 3<i>z</i></p><p>Das LGS hat <b>unendlich viele Lösungen</b>, z. B. <i>z</i> = 0: (−5 | 11 | 0).</p>`,
   n:'Der Rechner meldet keinen Fehler! Sie müssen die Matrix selbst <b>lesen</b>.'},
  {t:"Rechte Seite ändern: 7 → 8", a:GLB8+MXP(MB8,'B','erw'), k:['ac'].concat(MOD.EDIT('B'),['down','down','right','right','right','8',EX,'ac']),
   d:`<p>Jetzt ändern wir in Gleichung III die rechte Seite von 7 auf <b>8</b>.</p><p>${MOD.t.edit} (MatB). Mit <b>▼ ▼</b> in Zeile 3, mit <b>▶ ▶ ▶</b> in Spalte 4. <b>8</b> und ${E}, dann <b>AC</b>.</p>`},
  {t:"Rref(B): keine Lösung", a:GLB8, k:MOD.RREF.concat(kB,[')',EX]), z:['res'],
   d:`<p>${MOD.t.rref}, ${mB}, <b>)</b>, ${E}.</p>`+MXP(RREFB8,'Rref(B)','erw')+`<p>Die letzte Zeile ist <b>0 0 0 | 1</b>, also <b>0 = 1</b>. Das ist ein <b>Widerspruch</b>.</p><p>Das LGS hat <b>keine Lösung</b>.</p>`},
  {t:"Merkregel", k:[],
   d:`<p>Schauen Sie immer auf die <b>letzte Zeile</b> von Rref:</p><ul style="font-size:15.5px;margin:0 0 10px;padding-left:20px"><li><b>0 0 1 | c</b> → genau eine Lösung</li><li><b>0 0 0 | 0</b> → unendlich viele Lösungen</li><li><b>0 0 0 | 1</b> → keine Lösung</li></ul>`,
   n:'Ein LGS mit 2 Unbekannten speichern Sie als <b>2×3</b>-Matrix. Mehr als 3 Unbekannte gehen nicht: Die Matrix darf höchstens 4 Spalten haben.'},
  {t:"Selbst rechnen", k:[], ab:1, d:AB("Aufgabe 4",[`LGS speichern, dann ${MOD.t.rref}`,`Letzte Zeile ansehen: eine, keine oder unendlich viele Lösungen?`,`Ankreuzen, Lösung notieren`,"Danach: Lösungscode eintragen"])}
];
const TRACKS={
  m:{name:"1 · LGS als Matrix speichern", start:()=>fresh(), steps:T1},
  r:{name:"2 · Ref: Stufenform", start:()=>fresh(PRE), steps:T2},
  rr:{name:"3 · Rref: Lösung ablesen", start:()=>fresh(PRE), steps:T3},
  s:{name:"4 · Keine oder unendlich viele Lösungen", start:()=>fresh(PRE), steps:T4}
};



// =====================================================================
//  Steuerung
// =====================================================================
const ORDER=["m","r","rr","s"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>__D.getElementById(id);
const lbl=k=>LBL[k]||k;
function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); const c=k==='shift'?'shift':k==='alpha'?'alpha':(MODEL==='dx'&&(k==='ac'||k==='del'))?'b':WHITE.test(k)?'w':''; return `<span class="chip ${c} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){
  const T=TRACKS[t], S=T.start();
  for(let j=0;j<s;j++) run(S,T.steps[j].k);
  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?S.z:(S.z||[]).filter(z=>z!=='res'));
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  if(last&&fin) done[tr]=true;
  $('next').className='go';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Weiter ▶';
  $('next').disabled=fin&&last&&!nextT; { const sk=$('skip'); if(sk) sk.disabled=fin&&last&&!nextT; }
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '<span style="color:var(--mute)">Lesen – dann <b>Weiter</b>.</span>';
  hint();
}
function hint(){
  __D.querySelectorAll('.k.hit').forEach(e=>e.classList.remove('hit'));
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1400); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    const want=S.k[pos]; let extra=NEGHINT(k,want);
    if(k==='exe'&&want!=='exe') extra=` Erst die Zahl eintippen, dann mit ${E} bestätigen.`;
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(want,pos).replace('now','now big')}${extra}`;
  }
}
function advance(){ const T=TRACKS[tr]; if(st<T.steps.length-1){ st++; pos=0; } render(); }
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }

const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-','*':'*','/':'/','(':'(',')':')'};
return {
  ORDER, TRACKS, draw, fresh:(typeof fresh!=='undefined'?fresh:null), run,
  render, press, next, back, KMAP,
  selectTrack:function(t){ if(TRACKS[t]){ tr=t; st=0; pos=0; render(); } },
  selectStep:function(i){ st=+i; pos=0; render(); },
  fwd:function(){ if(lock) return; const T=TRACKS[tr], S=T.steps[st];
    if(st<T.steps.length-1){ st++; pos=0; render(); return; }
    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },
  bwd:function(){ if(lock) return; if(st>0){ st--; pos=0; } else pos=0; render(); },
  goto:function(t,s,i){ tr=t; st=s; pos=i; render(); },
  snap:function(){ return {tr,st,pos,D:Object.assign({},done)}; },
  restore:function(o){ tr=o.tr; st=o.st; pos=o.pos; Object.keys(done).forEach(k=>delete done[k]); Object.assign(done,o.D); render(); }
};
 }
};

 init:function(root){

    if(p<0) continue;
    [A[r],A[p]]=[A[p],A[r]]; const pv=A[r][c];

    for(let i=r+1;i<m;i++) if(A[i][c].p!==0){ const f=A[i][c]; for(let j=0;j<n;j++) A[i][j]=qs(A[i][j],qm(f,A[r][j])); }

    for(let i=0;i<r;i++) if(A[i][c].p!==0){ const f=A[i][c]; for(let j=0;j<n;j++) A[i][j]=qs(A[i][j],qm(f,A[r][j])); } }

}

const zt=v=>{ if(v.q===1) return String(v.p).replace('-','−'); return (v.p<0?'−':'')+`<span class="frc"><span>${Math.abs(v.p)}</span><span>${v.q}</span></span>`; };
const MXv=(m,name)=>`<span class="mxw">${name?`<i>${name}</i> = `:''}<table class="mxp">`+m.map(r=>'<tr>'+r.map((v,j)=>`<td${j===r.length-1?' class="rs"':''}>${zt(v)}</td>`).join('')+'</tr>').join('')+'</table></span>';

}

const ORDER=["m","r","l","s"];
let mode=ORDER[0], AU=null, stat={a:0,r:0};
const $=id=>root.getElementById(id);

function vecHTML(n){ return '<div class="vec">'+Array.from({length:n},(_,i)=>`<div class="ein1"><span>${VN[i]} =</span>${inp('z_0_'+i)}</div>`).join('')+'</div>'; }

    s.forEach((r,i)=>{ h+='<tr>'+r.map((_,j)=>`<td${j===r.length-1?' class="rs"':''}>${inp(`z_${i}_${j}`,'k')}</td>`).join('')+'</tr>'; });

function parse(s){
  s=s.trim().replace(/\s/g,'').replace(/−/g,'-').replace(',','.');
  let m=s.match(/^(-?\d+)\/(-?\d+)$/); if(m){ const q=+m[2]; if(q===0) return null; return {v:+m[1]/q, frac:true, p:+m[1], q}; }

 init:function(root){

const WEG={
 dex:{f:'Zahl ▸ <span class="taste sh">SHIFT</span> <span class="taste"><i>x</i><sup>−1</sup></span> (x!) ▸ <span class="taste w">=</span>',

}[MODEL];
// ---------- Modus 1–3: Rechnen ----------
function genRechnen(typ){
  const z=[], seen={};
  while(z.length<3){
    let n,r,v,lab;
    if(typ==='f'){ n=R(3,13); r=0; v=fak(n); lab=`${n}!`; }
    if(typ==='p'){ n=R(5,25); r=R(2,Math.min(5,n-1)); v=per(n,r); lab=`${n} <b>P</b> ${r}`; }
    if(typ==='c'){ n=pick([R(5,20),R(5,20),R(20,49)]); r=R(2,Math.min(6,n-2)); v=kom(n,r); lab=BIN(n,r); }

    z.push({id:'z'+z.length, lab, soll:v, n, r, typ});
  }
  const txt={f:'Berechnen Sie die Fakultäten mit dem Rechner.',p:'Berechnen Sie mit dem Rechner (nPr: Reihenfolge wichtig).',c:'Berechnen Sie die Binomialkoeffizienten mit dem Rechner (Reihenfolge egal). Rechnerbefehl: n C r.'}[typ];
  return {h:{f:'Fakultät n!',p:'Variation nPr',c:'Binomialkoeffizient nCr'}[typ], auftrag:txt, weg:WEG[typ], wahl:false,
    round:'<b>Tipp:</b> Ergebnisse sind ganze Zahlen. Ohne Punkte tippen, z.&nbsp;B. <b>5040</b>.', zeilen:z};
}

const SACH=[
 ()=>{ const n=R(4,9); return {typ:'f',n,r:0,t:`${n} Personen stellen sich für ein Gruppenfoto in eine Reihe. Wie viele Reihenfolgen gibt es?`}; },

 ()=>{ const n=R(8,30); return {typ:'p',n,r:3,t:`Ein Verein hat ${n} Mitglieder. Gewählt werden Vorsitz, Stellvertretung und Kasse (jede Person höchstens ein Amt).`}; },
 ()=>{ const n=R(8,20), r=R(2,4); return {typ:'p',n,r,t:`Bei einem Wettbewerb mit ${n} Teams werden die Plätze 1 bis ${r} vergeben. Wie viele Siegerlisten sind möglich?`}; },

 ()=>{ const n=R(8,20), r=R(2,5); return {typ:'c',n,r,t:`Ein Online-Shop stellt aus ${n} Produkten ein Testpaket mit ${r} Produkten zusammen. Wie viele Pakete sind möglich?`}; },

function genSach(){

const MODES={f:{name:'n!',gen:()=>genRechnen('f')},p:{name:'nPr',gen:()=>genRechnen('p')},c:{name:'nCr',gen:()=>genRechnen('c')},s:{name:'Sachaufgaben',gen:genSach}};
const ORDER=['f','p','c'];

const $=id=>root.getElementById(id);

  return `<div class="f sach" id="f_${z.id}"><span class="lab">${String.fromCharCode(97+ +z.id.slice(1))})</span><span class="ins"><span class="stxt">${z.text}</span>

    <span class="erg">Ergebnis: <input id="i_${z.id}" inputmode="numeric" autocomplete="off" placeholder="0"></span></span><span class="m"></span><div class="msg"></div></div>`;
}
function neu(){
  A=MODES[mode].gen();
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  $('h').textContent='Aufgabe: '+A.h; $('auftrag').innerHTML=A.auftrag; $('term').innerHTML=''; $('weg').innerHTML=A.weg; $('bereich').innerHTML='';

}
function parse(s){ s=s.trim().replace(/[\s.']/g,''); if(!/^\d+$/.test(s)) return null; return parseInt(s,10); }
function pruefen(){
  let ok=0; const tot=A.zeilen.length;
  A.zeilen.forEach(z=>{
    const f=$('f_'+z.id), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'+(A.wahl?' sach':''); m.textContent=''; msg.textContent='';
    const raw=$('i_'+z.id).value;
    const sel=A.wahl?(root.querySelector(`input[name="r_${z.id}"]:checked`)||{}).value:z.typ;
    if(!raw.trim()&&!(A.wahl&&sel)) return;

      msg.textContent = z.typ==='f' ? 'Hier werden alle in eine Reihenfolge gebracht – keine Auswahl. Das ist n!.'

        : 'Die Reihenfolge ist egal – es entsteht nur eine Gruppe. Das ist nCr.';

}

    const f=$('f_'+z.id), msg=f.querySelector('.msg');

}

 }

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }

      else if(z.hi>=q.n&&near(p.v,r4(binC(q.n,q.p,z.lo-1)))) t='Das ist die Gegenwahrscheinlichkeit. Rechnen Sie 1 − P(X ≤ …).';

    }

  $('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.zeilen.forEach(z=>{

    else msg.textContent=`${z.typ==='g'?FN_G:FN_H} mit k = ${z.k}, n = ${q.n}, p = ${dz(q.p)} · Rechner: ${fmt(z.soll)}`;
  });
  $('score').textContent='';
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
neu();

 }
};

// ---------------------------------------------------------------
const PANEL={}, G={}; let measuring=false;
const PANEL_HTML='<div class="tabs" id="tabs"></div><div class="task" id="task"></div><div class="prog" id="prog"></div><div class="nr" id="nr"></div><h2 id="tt"></h2><div class="chips" id="chips"></div><div class="stat" id="stat"></div><div id="dd"></div><div class="btns"><button id="back">◀ Zurück</button><button id="skip" title="Direkt zum nächsten Schritt">Überspringen ⏭</button><button id="next" class="go">Weiter ▶</button></div>';
function scope(id){
  const on=()=>active===id&&mode==='g'&&!measuring;
  return {
    getElementById:x=> x==='scr' ? (on()?SCR:DUMMY) : PANEL[id].querySelector('#'+x),
    querySelector:s=> on()?CALC.querySelector(s):null,
    querySelectorAll:s=> on()?CALC.querySelectorAll(s):[],
    scrollTo:()=>{ if(on()) toTopOfContent(); }
  };
}
TOPICS.forEach(t=>{
  const p=document.createElement('div'); p.className='panel gpanel'; p.hidden=true; p.innerHTML=PANEL_HTML; vG.appendChild(p); PANEL[t.id]=p;
  const g=G[t.id]=GUIDES[t.id].make(scope(t.id));
  p.querySelector('#next').onclick=()=>g.weiter();
  p.querySelector('#skip').onclick=()=>g.fwd();
  p.querySelector('#back').onclick=()=>g.bwd();
  p.querySelector('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(b&&b.dataset.t) g.selectTrack(b.dataset.t); };
  p.querySelector('#prog').onclick=e=>{ if(e.target.dataset.i!==undefined) g.selectStep(e.target.dataset.i); };
});
CALC.querySelectorAll('.k').forEach(b=>b.addEventListener('click',()=>{ b.blur(); if(mode==='g'&&active) G[active].press(b.dataset.k); }));
document.addEventListener('keydown',e=>{
  if(mode!=='g'||!active) return;
  const tg=e.target; if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable)) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const KM=G[active].KMAP; let k=KM[e.key]; if(!k && /^[0-9]$/.test(e.key)) k=e.key;
  if(k){ e.preventDefault(); G[active].press(k); }
});

// ---------------------------------------------------------------
//  Übungen: je ein Shadow-DOM (Styles und IDs bleiben getrennt)
// ---------------------------------------------------------------
const UHOST={};
function uebung(id){
  if(UHOST[id]) return UHOST[id];
  const h=document.createElement('div'); h.className='uhost'; h.hidden=true; vU.appendChild(h);
  const r=h.attachShadow({mode:'open'});
  r.innerHTML='<style>'+UEB[id].css+'\n.wrap{max-width:none;margin:0;padding:0;}\n:host{container-type:inline-size;}\n@container (max-width:660px){ .grid{ grid-template-columns:1fr !important; } }</style>'+UEB[id].html;
  UEB[id].init(r);
  return UHOST[id]=h;
}

// ---------------------------------------------------------------
//  Rechner-Display in Gliederung / Übung: HOME-Menü
// ---------------------------------------------------------------
function homeScreen(sel,pulse){
  const g=G.grund; const S=g.fresh?g.fresh('home'):{mode:'home'}; S.mode='home'; S.sel=sel; S.shift=false;
  SCR.innerHTML=g.draw(S,pulse?[APPNAME[sel]]:null);
}
const APPNAME=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung"];
function clearKeys(){ CALC.querySelectorAll('.k.hit,.k.held,.k.good,.k.bad').forEach(e=>e.classList.remove('hit','held','good','bad')); }
function flash(){ SCR.classList.remove('flash'); void SCR.offsetWidth; SCR.classList.add('flash'); }

// ---------------------------------------------------------------
//  Gliederung aufbauen
// ---------------------------------------------------------------
$('topics').innerHTML=TOPICS.map((t,i)=>`<li class="topic" data-t="${t.id}">
    <div class="tmain"><span class="num">${i+1}</span><span class="ttl">${GUIDES[t.id].title}</span></div>
    <div class="acts"><button class="act tour" data-go="${t.id}:g">${ICO.tour}<span>Anleitung</span></button><a class="act pdf" href="${BASE+t.pdf}" target="_blank" rel="noopener">${ICO.pdf}<span>Arbeitsblatt</span></a><button class="act ueb" data-go="${t.id}:u">${ICO.ueb}<span>Übung</span></button></div>
  </li>`).join('');
$('topics').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; const [t,v]=b.dataset.go.split(':'); go(t,v); });
let hoverT=null;
$('topics').addEventListener('mouseover',e=>{ if(mode!=='toc') return; const li=e.target.closest('.topic'); const t=li&&li.dataset.t; if(t&&t!==hoverT){ hoverT=t; homeScreen(TOP[t].app,true); } });
$('topics').addEventListener('mouseleave',()=>{ if(mode!=='toc') return; hoverT=null; homeScreen(0,false); });
$('topics').addEventListener('focusin',e=>{ if(mode!=='toc') return; const li=e.target.closest('.topic'); if(li){ hoverT=li.dataset.t; homeScreen(TOP[hoverT].app,true); } });

// ---------------------------------------------------------------
//  Navigation mit animiertem Übergang
// ---------------------------------------------------------------
let busy=null;
function setTitle(html){ const h=$('hT'); h.classList.add('swap'); setTimeout(()=>{ h.innerHTML=html; h.classList.remove('swap'); },170); }
function toTopOfContent(){
  const r=$('right').getBoundingClientRect(), barH=document.querySelector('.bar').offsetHeight;
  const narrow=window.matchMedia('(max-width:720px)').matches;
  const y = narrow ? window.scrollY + r.top - barH - 8 : 0;
  if(Math.abs(window.scrollY-y)>4) window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
function viewEl(m){ return m==='toc'?vToc:m==='g'?vG:vU; }
function apply(t,v){
  // Inhalte der Zielansicht vorbereiten
  clearKeys();
  if(v==='toc'){ active=null; STAGE.removeAttribute('data-g'); homeScreen(0,false); hoverT=null; }
  else{
    active=t; STAGE.dataset.g=t;
    $('segPdf').href=BASE+TOP[t].pdf;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    if(v==='g'){ Object.keys(PANEL).forEach(k=>PANEL[k].hidden=(k!==t)); }
    else{ const h=uebung(t); Object.keys(UHOST).forEach(k=>UHOST[k].hidden=(k!==t)); }
  }
  mode=v; APP.dataset.mode=v;
  if(v==='g'){ fixHeight(t); G[t].render(); } else if(v==='u') homeScreen(TOP[t].app,false);
  flash();
}
// Feste Panelhöhe je Anleitung: höchster Schritt (mind. Rechnerhöhe) -> Buttonzeile bleibt an derselben Stelle
function fixHeight(t){
  const g=G[t], p=PANEL[t]; if(!g||!g.snap) return;
  const calc=CALC;
  const wasHidden=vG.hidden; vG.hidden=false;
  const s=g.snap(); measuring=true; p.style.minHeight='0px'; let mx=0;
  try{
    g.ORDER.forEach(tr=>g.TRACKS[tr].steps.forEach((x,i)=>{
      g.goto(tr,i,0); mx=Math.max(mx,p.offsetHeight);
      if(x.k.length){ g.goto(tr,i,x.k.length); mx=Math.max(mx,p.offsetHeight); }
    }));
  }finally{ measuring=false; g.restore(s); vG.hidden=wasHidden; }
  p.style.minHeight=Math.max(mx, calc.offsetHeight)+'px';
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(mode==='g'&&active) fixHeight(active); },200); });
function title(t,v){
  if(v==='toc') return 'Taschenrechner-Führerschein<small>CASIO fx-991DE CW</small>';
  return (v==='g'?GUIDES[t].title:UEB[t].title)+`<small>${v==='g'?'Anleitung':'Übung'}</small>`;
}
function go(t,v,opt){
  opt=opt||{};
  if(v!=='toc'&&!TOP[t]) { t=null; v='toc'; }
  if(v==='toc') t=null;
  if(mode===v && active===t) return;
  const from=viewEl(mode), to=viewEl(v);
  const fwd = mode==='toc' || (mode==='g'&&v==='u');
  const instant = opt.instant || window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTitle(title(t,v));
  if(!opt.nohist){ try{ history.pushState({t,v},'', v==='toc'?location.pathname+location.search:'#'+t+(v==='u'?'-uebung':'')); }catch(e){} }
  if(busy){ clearTimeout(busy); busy=null; }
  if(instant){ from.hidden=(from!==to); from.className=from.className.replace(/\b(from|to)-[lr]\b/g,'').trim(); apply(t,v); to.hidden=false; toTopOfContent(); return; }
  // 1) Altes ausblenden
  from.classList.remove('from-l','from-r'); from.classList.add(fwd?'to-l':'to-r');
  busy=setTimeout(()=>{
    busy=null;
    from.hidden=true; from.classList.remove('to-l','to-r');
    apply(t,v);
    // 2) Neues einblenden
    to.classList.add(fwd?'from-r':'from-l'); to.hidden=false;
    void to.offsetWidth;
    requestAnimationFrame(()=>{ to.classList.remove('from-r','from-l'); });
    toTopOfContent();
  },240);
}
$('toToc').onclick=()=>go(null,'toc');
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>go(active,b.dataset.v));
function route(opt){
  const h=decodeURIComponent((location.hash||'').slice(1)); let m=h.match(/^([a-z]+)(-uebung)?$/);
  if(m&&TOP[m[1]]) go(m[1], m[2]?'u':'g', opt); else go(null,'toc',opt);
}
window.addEventListener('popstate',()=>route({nohist:true}));

// Start
homeScreen(0,false);
route({nohist:true, instant:true});
// ---------- Kleine Bildschirme: ganze Ansicht verkleinern (Layout wie am PC), Zoomen per Fingergeste ----------
const FIT_W=760; let SCALE=1;
function fit(){
  const w=document.documentElement.clientWidth; let h=window.innerHeight;
  // Im Moodle-iframe ist innerHeight die Rahmenhöhe, nicht die Bildschirmhöhe: auf Handys im Querformat die kurze Bildschirmseite nehmen
  const sh=Math.min(screen.width,screen.height), lh=Math.max(screen.width,screen.height);
  const landscape=(screen.orientation&&/landscape/.test(screen.orientation.type))||Math.abs(window.orientation||0)===90||screen.width>screen.height;
  if(sh<500) h=Math.min(h, landscape?sh:lh);
  // schmal (Handy hochkant): auf 760 px Layoutbreite verkleinern; niedrig (Handy quer): so weit, dass ~800 px Höhe passen
  SCALE=Math.min(1, w/FIT_W, h<600 ? h/800 : 1);
  if(SCALE<1){ APP.classList.add('scaled'); APP.style.width=(w/SCALE)+'px'; APP.style.transformOrigin='top left'; APP.style.transform='scale('+SCALE+')'; }
  else { APP.classList.remove('scaled'); APP.style.width=''; APP.style.transform=''; }
  document.body.style.height = SCALE!==1 ? (APP.offsetHeight*SCALE)+'px' : '';
}
new ResizeObserver(()=>{ if(SCALE!==1) document.body.style.height=(APP.offsetHeight*SCALE)+'px'; }).observe(APP);
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,150)); fit();
})();
</script>
</body></html>
