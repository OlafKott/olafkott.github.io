<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taschenrechner-Führerschein · fx-991DE CW</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --hit:#F2B705; --ab:#2E7D32; --gold:#d2ad5b;
       --gs:#1F4E99; --gs2:#2a62c2; --gsbg:#EEF2FA; }
*{ box-sizing:border-box; }
html{ background:var(--bg); }
body{ margin:0; min-height:100vh; overflow-x:hidden; background:radial-gradient(circle at 30% 0,#ffffff,var(--bg) 60%); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; overflow-x:hidden; }
button{ font-family:inherit; }
/* ---------- Rechner (digital nachgebaut) – aus den Schritt-für-Schritt-Anleitungen ---------- */
.calc{ width:330px; flex:0 0 330px; background:#1b1b1e; border-radius:30px; padding:16px 14px 18px; box-shadow:0 6px 22px rgba(0,0,0,.25), inset 0 0 0 2px #2c2c31; }
.head{ display:flex; justify-content:space-between; align-items:flex-start; padding:0 6px 8px; }
.logo{ color:#e9e9ec; font:900 19px Arial,sans-serif; letter-spacing:.5px; line-height:1; }
.logo small{ display:block; font:bold 10.5px Arial,sans-serif; letter-spacing:.3px; margin-top:5px; color:#cfcfd4; }
.solar{ width:104px; height:34px; border-radius:5px; background:linear-gradient(135deg,#2a1a1a,#3a2222 60%,#2a1818); box-shadow:inset 0 0 0 1px #000; }
.bezel{ background:#232327; border-radius:10px; padding:9px 9px 6px; box-shadow:inset 0 0 0 1px #111; }
.scr{ width:280px; height:118px; margin:0 auto; background:#d3ded4; border-radius:3px; position:relative; overflow:hidden; color:#141a14; font-family:Arial,Helvetica,sans-serif; box-shadow:inset 0 0 6px rgba(0,0,0,.25); }
.cw{ text-align:right; font:12px Arial,sans-serif; letter-spacing:5px; color:#bdbdc4; margin-top:5px; padding-right:4px; }
.keys{ display:grid; grid-template-columns:repeat(6,1fr); column-gap:4px; row-gap:2px; margin-top:12px; position:relative; }
.nums{ display:grid; grid-template-columns:repeat(5,1fr); column-gap:7px; row-gap:3px; margin-top:4px; }
.c{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; z-index:1; }
.lb{ font:bold 9px Arial,sans-serif; color:#e3e3e7; height:12px; letter-spacing:.2px; white-space:nowrap; }

.k{ font:600 13px Arial,sans-serif; color:#f1f1f3; background:radial-gradient(circle at 50% 35%,#55555c,#3a3a40 70%); border:0; border-radius:50%; width:34px; height:30px; padding:0; cursor:pointer; box-shadow:0 2px 0 #0b0b0d; transition:transform .15s, box-shadow .15s; display:flex; align-items:center; justify-content:center; line-height:1; }
.k:focus{ outline:none; } .k:active{ transform:scale(.95); }
.nums .k{ width:46px; height:38px; font-size:19px; border-radius:48%; }
.k.small{ width:26px; height:24px; font-size:9px; }
.k.shift{ background:radial-gradient(circle at 50% 35%,#efe3bf,#b99b55 75%); color:#3a2c0a; }
.k.ok{ background:#121214; color:#9a9aa1; font-size:11px; width:32px; height:32px; border-radius:9px; }
.k.ar{ background:#121214; color:#9a9aa1; font-size:11px; }
.k.txt{ font-size:9.5px; letter-spacing:-.2px; }
.k sup{ font-size:8px; } .nums .k sup{ font-size:10px; }
.bx{ display:inline-block; width:7px; height:8px; border:1.3px solid currentColor; border-radius:1px; vertical-align:middle; }
.bx.f{ background:currentColor; }
.mf{ display:inline-flex; flex-direction:column; align-items:center; gap:1px; }
.mf i{ display:block; width:9px; height:6px; border:1.3px solid currentColor; border-radius:1px; } .mf i+i{ border-top-width:1.3px; }
.mf b{ display:block; width:12px; height:1.3px; background:currentColor; }
.dpad{ grid-column:3/6; grid-row:1/4; position:relative; z-index:0; }
.dpad::before,.dpad::after{ content:""; position:absolute; background:#0d0d0f; border-radius:16px; }
.dpad::before{ left:31%; right:31%; top:6px; bottom:4px; }
.dpad::after{ top:36%; bottom:28%; left:2px; right:2px; }
.pg{ grid-column:6; grid-row:1/3; justify-self:center; align-self:center; width:34px; height:64px; background:#2d2d32; border-radius:17px; display:flex; flex-direction:column; justify-content:space-around; align-items:center; color:#bbb; font-size:12px; z-index:1; }
.pg .k{ width:28px; height:26px; background:transparent; box-shadow:none; color:#bbb; font-size:13px; }
.k.hit{ box-shadow:0 0 0 3px var(--hit), 0 0 14px 3px rgba(242,183,5,.9); transform:scale(1.14); z-index:3; position:relative; }
.k.good{ box-shadow:0 0 0 3px #2E9E4F, 0 0 12px 2px rgba(46,158,79,.8); }
.k.bad{ box-shadow:0 0 0 3px #C62828, 0 0 12px 2px rgba(198,40,40,.8); animation:wack .35s; }
.k.held{ box-shadow:0 0 0 3px #fff, 0 0 12px 3px rgba(255,255,255,.75); }
@keyframes wack{ 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

/* ---------- Display-Inhalte ---------- */

.fr > span{ padding:0 2px; min-width:9px; }

.fr > span:empty::after, .rad:empty::after, sup:empty::after{ content:"\25A1"; opacity:.55; }
.rt{ white-space:nowrap; } .rad{ border-top:1.5px solid currentColor; padding:0 1px; margin-left:1px; }
.ein sup{ font-size:11px; align-self:flex-start; margin-top:2px; } .aus sup{ font-size:13px; }
.ng{ display:inline-block; transform:scaleX(.62); margin:0 -1px; }
.ein sup .caret, .fr .caret{ height:11px; }
.caret{ display:inline-block; width:1.5px; height:18px; background:#141a14; animation:blink 1s steps(1) infinite; vertical-align:middle; margin-left:1px; } @keyframes blink{ 50%{opacity:0} }
.list{ position:absolute; left:0; right:0; top:13px; bottom:0; padding:2px 0; font-size:13.5px; }

.list div.it.sel{ background:#141a14; color:#d3ded4; }

@keyframes pulse{ 50%{ outline-color:rgba(242,183,5,.25); } }
.home{ position:absolute; inset:0; padding:6px 14px 4px 8px; }
.home .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px 6px; }
.home .ic{ position:relative; height:49px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:2px 0 3px; border-radius:2px; }
.home .ic svg{ width:40px; height:17px; margin-bottom:1px; }

.home .ic .bd{ position:absolute; top:3px; right:5px; width:11px; height:11px; border-radius:50%; background:#141a14; color:#d3ded4; font:bold 8.5px Arial,sans-serif; line-height:11px; text-align:center; }
.home .ic.sel{ background:#141a14; color:#d3ded4; }
.home .ic.sel .bd{ background:#d3ded4; color:#141a14; }

.msg{ position:absolute; left:16px; right:16px; top:28px; border:1.5px solid #141a14; background:#d3ded4; padding:6px 8px; font-size:13px; text-align:center; }
.msg .bt{ display:flex; justify-content:center; gap:10px; margin-top:6px; font-size:12px; }

/* ---------- Panel ---------- */
.panel{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }

/* ================= Rahmen der Moodle-Seite ================= */
.bar{ position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.02); }
.bar::before{ content:""; display:block; height:4px; background:linear-gradient(90deg,var(--gs),#5b86cf); }
.bar .in{ max-width:1040px; height:62px; padding:0 16px; display:flex; align-items:center; gap:12px; }
.toToc{ flex:0 0 auto; max-width:0; opacity:0; overflow:hidden; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; border:1px solid #c9d3e6; background:#fff; color:var(--gs); font:600 14px system-ui,Arial,sans-serif; border-radius:999px; padding:7px 0; cursor:pointer; transition:max-width .4s cubic-bezier(.2,.7,.2,1), opacity .3s, padding .4s, margin .4s; pointer-events:none; margin-right:-12px; }

@keyframes lcd{ 0%{ filter:brightness(1); } 25%{ filter:brightness(.82) contrast(.7); } 100%{ filter:none; } }

/* Ansichten + Übergänge */
.view[hidden]{ display:none !important; }
.view{ transition:opacity .34s ease, transform .42s cubic-bezier(.2,.7,.2,1); }
.view.from-r{ opacity:0; transform:translateX(42px); }
.view.from-l{ opacity:0; transform:translateX(-42px); }
.view.to-l{ opacity:0; transform:translateX(-36px); transition-duration:.24s,.26s; }
.view.to-r{ opacity:0; transform:translateX(36px); transition-duration:.24s,.26s; }

.toc h2{ margin:2px 0 12px; font-size:21px; }

.topic{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; padding:12px 14px; }

.act:hover,.act:focus-visible{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(0,0,0,.18); outline:none; }

.act.ueb{ background:linear-gradient(#3aa356,var(--ab)); }

.gpanel{ display:flex; flex-direction:column; container-type:inline-size; }

.gpanel[hidden], .uhost[hidden]{ display:none; }
.uhost{ display:block; }

<script>
/* ===== Anleitung: grund ===== */
GUIDES["grund"]={
 title:"Grundlagen",
 css:String.raw`[data-g="grund"] .panel{ flex:1 1 360px; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
[data-g="grund"] #next{ margin-left:auto; }
@media (max-width:380px){ [data-g="grund"] .calc{ transform:scale(.92); transform-origin:top center; } }`,
 make:function(__D){

// =====================================================================
//  Eingabezeile mit Vorlagen (Bruch, Hochzahl, Wurzel)
// =====================================================================
const SHOW={'*':'×','/':'÷','-':'−','ans':'Ans'};
function Entry(root){ this.root=root||[]; this.path=[this.root]; this.meta=[null]; }
Entry.prototype.top=function(){ return this.path[this.path.length-1]; };
Entry.prototype.isEmpty=function(){ return this.root.length===0; };
Entry.prototype.key=function(k){
  const T=this.top();
  if(k==='frac'){ const f={t:'frac',n:[],d:[]}; T.push(f); this.path.push(f.n); this.meta.push(f); return; }
  if(k==='pow'){ const s={t:'sup',v:[]}; T.push(s); this.path.push(s.v); this.meta.push(s); return; }
  if(k==='sqrt'){ const s={t:'sqrt',v:[]}; T.push(s); this.path.push(s.v); this.meta.push(s); return; }
  if(k==='sq'){ T.push({t:'sup',v:['2']}); return; }
  if(k==='down'){ const m=this.meta[this.meta.length-1]; if(m&&m.t==='frac'&&T===m.n){ this.path.pop(); this.path.push(m.d); } return; }
  if(k==='right'){ if(this.path.length>1){ this.path.pop(); this.meta.pop(); } return; }
  if(k==='left'||k==='up') return;
  if(k==='del'){ T.pop(); return; }
  if(k==='neg'){ T.push('NEG'); return; }
  T.push(SHOW[k]||k);
};
Entry.prototype.clone=function(){ return new Entry(JSON.parse(JSON.stringify(this.root))); };
function tok(t){ return t==='NEG'?'<span class="ng">−</span>':t; }
function rnd(arr,curA,caret){
  let h=arr.map(t=>typeof t==='string'?tok(t):
    t.t==='frac'?`<span class="fr"><span>${rnd(t.n,curA,caret)}</span><span>${rnd(t.d,curA,caret)}</span></span>`:
    t.t==='sup'?`<sup>${rnd(t.v,curA,caret)}</sup>`:
    `<span class="rt">√<span class="rad">${rnd(t.v,curA,caret)}</span></span>`).join('');
  if(caret&&arr===curA) h+='<span class="caret"></span>';
  return h;
}
function ser(arr){ return arr.map(t=>typeof t==='string'?(t==='NEG'?'~':t):t.t==='frac'?`(${ser(t.n)})/(${ser(t.d)})`:t.t==='sup'?`^(${ser(t.v)})`:`√(${ser(t.v)})`).join(''); }
Entry.prototype.html=function(caret){ return rnd(this.root,this.top(),caret!==false); };

// =====================================================================
//  Ergebnisse (exakt = EXE, Dezimal = SHIFT EXE bzw. FORMAT ▸ Dezimal)
// =====================================================================
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const W=(a,r)=>`${a}<span class="rt">√<span class="rad">${r}</span></span>`;
const EX={
 "3,5×4":"14", "12−4×3":"0", "(12−4)×3":"24", "12×8":"96", "12×9":"108", "12×7":"84",
 "~3+5":"2", "Ans−3":"−1", "Ans÷4":"21", "100−Ans":"79",
 "(1)/(3)+(1)/(6)":F(1,2), "3÷4":F(3,4), "1÷3":F(1,3), "0,75":F(3,4),
 "7^(2)":"49", "2^(10)":"1024", "2^(3)+1":"9", "2^(3+1)":"16", "√(144)":"12", "√(8)":W(2,2),
 "~2^(2)":"−4", "(~2)^(2)":"4", "2,5×4,8":"12", "20÷2,5":"8", "A×B":"96", "(A+B)÷4":"5"
};
const AP={ "3÷4":"0,75", "1÷3":"0,3333333333", "√(8)":"2,828427125", "(1)/(3)+(1)/(6)":"0,5" };

//  Zustandsmaschine des Rechners
// =====================================================================
const OPS=['+','-','*','/','sq','pow'];
const SETM=["Recheneinstell.","Systemeinstell.","Zurücksetzen"];
const RESM=["Einstell.&Daten","Variablenspeich.","Alle initialis."];
const FMT=["Voreinstellung","Dezimal","Primfaktor","Periodendarstell."];
const APPS=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung","Ungleichung","Komplex","Basis-N","Matrix","Vektor","Verhältnis","Mathebox"];
const VARS=["A","B","C","D","E","F","x","y","z"], VSUB=["Speichern","Abrufen"];
function fresh(mode){ return {mode:mode||'calc', sel:0, entry:new Entry(), last:null, view:'input', hist:[], hidx:-1, shift:false, vars:{}, vsub:-1}; }
function evalEntry(S,approx){
  const s=ser(S.entry.root);
  const res=approx?(AP[s]||'?'):(EX[s]||'?');
  S.hist.push({h:S.entry.html(false), res, s});
  S.last=S.entry; S.entry=new Entry(); S.view='result'; S.hidx=S.hist.length-1;
}
function step(S,k){
  if(S.mode==='off'){ if(k==='on'){ S.mode='calc'; S.view=S.hist.length?'result':'input'; } return; }
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){
    S.shift=false;
    if(S.mode==='calc'){
      if(k==='ac'){ S.mode='off'; return; }
      if(k==='exe'){ evalEntry(S,true); return; }
      if(k==='-'){ if(S.view!=='input'){ S.entry=new Entry(); S.view='input'; } S.entry.key('neg'); return; }
      const VK={'4':'A','5':'B','6':'C','1':'D','2':'E','3':'F'};
      if(VK[k]){ if(S.view!=='input'){ S.entry=new Entry(); S.view='input'; } S.entry.key(VK[k]); return; }
    }
    return;
  }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if(k==='1'){ S.mode='calc'; S.entry=new Entry(); S.view='input'; }
     else if((k==='ok'||k==='exe')&&S.sel===0){ S.mode='calc'; S.entry=new Entry(); S.view='input'; }
     return;
   case 'settings': case 'reset': case 'format': {
     const L=S.mode==='settings'?SETM:S.mode==='reset'?RESM:FMT;
     if(k==='down') S.sel=Math.min(L.length-1,S.sel+1);
     else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'||k==='ac'){ S.mode=S.mode==='reset'?'settings':'calc'; S.sel=S.mode==='settings'?2:0; }
     else if(k==='ok'||k==='exe'){
       if(S.mode==='settings'&&S.sel===2){ S.mode='reset'; S.sel=0; }
       else if(S.mode==='reset'){ S.mode='confirm'; S.sel=0; }
       else if(S.mode==='format'){ const H=S.hist[S.hist.length-1]; if(S.sel===1&&H) H.res=AP[H.s]||H.res; else if(S.sel===0&&H) H.res=EX[H.s]||H.res; S.mode='calc'; S.view='result'; }
     }
     return; }
   case 'confirm':
     if(k==='ok'||k==='exe'){ S.mode='done'; S.hist=[]; S.last=null; S.entry=new Entry(); }
     else if(k==='back'){ S.mode='reset'; }
     return;
   case 'done':
     if(k==='ac'||k==='ok'||k==='back'){ S.mode='calc'; S.view='input'; }
     return;
   case 'vars':
     if(S.vsub>=0){
       if(k==='down') S.vsub=Math.min(VSUB.length-1,S.vsub+1); else if(k==='up') S.vsub=Math.max(0,S.vsub-1);
       else if(k==='back'||k==='ac') S.vsub=-1;
       else if((k==='ok'||k==='exe')&&S.vsub===0){ const H=S.hist[S.hist.length-1]; S.vars[VARS[S.sel]]=H?H.res:'0'; S.vsub=-1; }
       return;
     }
     if(k==='down') S.sel=Math.min(VARS.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='ok') S.vsub=0;
     else if(k==='ac'||k==='back'||k==='var'){ S.mode='calc'; S.entry=new Entry(); S.view='input'; }
     return;
  }
  // ---- App Berechnung ----
  if(k==='settings'){ S.mode='settings'; S.sel=0; return; }
  if(k==='var'){ S.mode='vars'; S.sel=0; S.vsub=-1; return; }
  if(k==='exe'){ if(S.view==='input') evalEntry(S,false); return; }
  if(k==='ac'){ S.entry=new Entry(); S.view='input'; return; }
  if(S.view==='history'){
    if(k==='up'){ S.hidx=Math.max(0,S.hidx-1); return; }
    if(k==='down'){ S.hidx++; if(S.hidx>=S.hist.length-1){ S.hidx=S.hist.length-1; S.view='result'; } return; }
    S.view='result';
  }
  if(S.view==='result'){
    if(k==='up'&&S.hist.length>1){ S.view='history'; S.hidx=S.hist.length-2; return; }
    if(k==='left'||k==='right'){ if(S.last){ S.entry=S.last.clone(); S.view='input'; } return; }
    if(k==='format'){ S.mode='format'; S.sel=0; return; }
    if(['up','down','ok','back','format'].includes(k)) return;
    S.entry=new Entry(); S.view='input';
    if(OPS.includes(k)) S.entry.root.push('Ans');
  }
  if(['ok','back','format','pgup','pgdn','var','func','cat','tools','x','log','sin','cos','tan','e10','on'].includes(k)) return;
  S.entry.key(k);
}
function run(S,keys){ keys.forEach(k=>step(S,k)); return S; }

const BADGE=["1","2","3","4","5","6","7","8","9","0","+","−","×"];
function sbar(S,extra){ return `<div class="sb">${S.shift?'<span class="ind">S</span>':''}<span class="ind">D</span><span class="sp"></span>${extra||''}</div>`; }
function zl(lbl,ziel){ return (ziel||[]).includes(lbl)?' ziel':''; }
function draw(S,ziel){
  if(S.mode==='off') return '<div class="offs"></div>';
  if(S.mode==='home'){
    const r0=Math.min(Math.floor(S.sel/3), Math.ceil(APPS.length/3)-2);
    const vis=APPS.map((a,i)=>[a,i]).filter(([a,i])=>Math.floor(i/3)>=r0&&Math.floor(i/3)<r0+2);
    const rows=Math.ceil(APPS.length/3), top=r0/rows*100, h=2/rows*100;
    return `<div class="home"><div class="grid">`+
      vis.map(([a,i])=>`<div class="ic${i===S.sel?' sel':''}${zl(a,ziel)}"><span class="bd">${BADGE[i]}</span>${ICON[a]}<span class="an">${a}</span></div>`).join('')+
      `</div><div class="sbar"><i style="top:${top}%;height:${h}%"></i></div></div>`;
  }
  if(['settings','reset','format'].includes(S.mode)){
    const L=S.mode==='settings'?SETM:S.mode==='reset'?RESM:FMT;
    const T=S.mode==='settings'?'SETTINGS':S.mode==='reset'?'Zurücksetzen':'FORMAT';
    return sbar(S)+`<div class="list"><div class="ti">${T}</div>`+L.map((t,i)=>`<div class="it${i===S.sel?' sel':''}${zl(t,ziel)}">${t}</div>`).join('')+'</div>';
  }
  if(S.mode==='vars'){
    if(S.vsub>=0) return sbar(S)+`<div class="list"><div class="ti">${VARS[S.sel]}=</div>`+VSUB.map((t,i)=>`<div class="it${i===S.vsub?' sel':''}${zl(t,ziel)}">${t}</div>`).join('')+'</div>';
    const o=Math.max(0,Math.min(S.sel-1,VARS.length-4));
    return sbar(S)+`<div class="list"><div class="ti">Variable</div>`+VARS.slice(o,o+4).map((v,i)=>`<div class="it${i+o===S.sel?' sel':''}${zl(v,ziel)}">${v}=${S.vars[v]||'0'}</div>`).join('')+'</div>';
  }
  if(S.mode==='confirm') return sbar(S)+`<div class="msg">Einstellungen &amp; Daten<br>zurücksetzen?<div class="bt"><span class="sel${zl('Ja',ziel)}">Ja [OK]</span><span>Abbrechen [↶]</span></div></div>`;
  if(S.mode==='done') return sbar(S)+'<div class="msg" style="top:34px"><b>Zurückgesetzt!</b><div style="font-size:11px;margin-top:4px">Weiter mit AC</div></div>';
  // Berechnung
  if(S.view==='input') return sbar(S)+`<div class="app"><div class="ein">${S.entry.html()}</div><div class="aus"></div></div>`;
  const H=S.hist[S.view==='history'?S.hidx:S.hist.length-1];
  const mark=S.view==='history'||S.hist.length>1?`<span class="histmark">${S.hidx>0?'▲':''}${S.view==='history'?'▼':''}</span>`:'';
  return sbar(S,mark)+`<div class="app"><div class="ein">${H.h}</div><div class="aus">${H.res}</div></div>`;
}

    let n; do{ n=R(3,40); }while(Number.isInteger(Math.sqrt(n)));
    const d=pick([0.5,1.5,2,2.5,3]);
    A=Math.sqrt(n)+d; aT=`<span class="wz">√<span>${n}</span></span> + ${nz(d)}`;

    const sel=[]; while(sel.length<3){ const c=pick(combos); if(!sel.includes(c)) sel.push(c); }
    auf=sel.map(([t,f])=>({t, v:f(A,B), vr:f(r2(A),r2(B))}));
    ok = auf.some(x=>r2(x.v)!==r2(x.vr)) && auf.every(x=>Math.abs(x.v)<1000);
  }

}

const MODES={r:{name:"Rechnen",gen:genR}, b:{name:"Brüche",gen:genB}, p:{name:"Potenzen & Wurzeln",gen:genP}, m:{name:"Werte speichern",gen:genM}};

  $('score').textContent='';
  root.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){
  s=s.trim().replace(/\s/g,'').replace(/,/g,'.').replace(/[−–]/g,'-');

function pruefen(){
  let ok=0, tot=A.felder.length;
  A.felder.forEach(f=>{
    const el=$('f_'+f.id), raw=$('i_'+f.id).value, m=el.querySelector('.m'), msg=el.querySelector('.msg');
    el.className='f'+(f.lab?'':' sub'); m.textContent=''; msg.textContent='';
    if(!raw.trim()) return;
    const p=parse(raw);
    const bad=(t)=>{ el.classList.add('no'); m.textContent='✗'; msg.textContent=t; };
    const fmt=(t)=>{ el.classList.add('fmt'); m.textContent='!'; msg.textContent=t; };
    if(!p) return fmt(f.art==='bruch'?'Bitte als Bruch eintragen, z. B. 3/4.':'Bitte nur eine Zahl eintragen, z. B. 3,27.');
    if(f.art==='genau'){
      if(near(p.v,f.soll,1e-7)){ el.classList.add('ok'); m.textContent='✓'; ok++; return; }

    }
    if(f.art==='bruch'){
      if(!p.bruch) return near(p.v,f.soll,1e-7)?fmt('Der Wert stimmt – tragen Sie ihn als Bruch ein, z. B. '+f.bruch+'.'):bad('Das stimmt noch nicht. Tragen Sie den exakten Bruch ein (Rechner: '+(isCW?'EXE':'=')+').');
      if(near(p.v,f.soll,1e-9)){ if(gcd(p.p,p.q)!==1) return fmt('Der Wert stimmt – der Rechner zeigt den gekürzten Bruch.'); el.classList.add('ok'); m.textContent='✓'; ok++; return; }

    }

    const soll=r2(f.soll);
    if(p.bruch) return fmt('Bitte als Dezimalzahl mit 2 Stellen nach dem Komma eintragen.');
    if(p.dec!==2){ return fmt('Bitte genau 2 Stellen nach dem Komma eintragen'+(Math.abs(p.v-f.soll)<0.01?' – der Wert selbst stimmt.':'.')); }
    if(near(p.v,soll,0.0051)){ el.classList.add('ok'); m.textContent='✓'; ok++; return; }

    return bad('Das stimmt noch nicht. Prüfen Sie die Eingabe im Display.');
  });
  stat.a++; if(ok===tot) stat.r++;
  $('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  $('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(f=>{
    const el=$('f_'+f.id), msg=el.querySelector('.msg');

  });
  $('score').textContent='';
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
neu();


 }
};

let mode=ORDER[0], A=null, stat={a:0,r:0};
function neu(){

  root.getElementById('felder').innerHTML=A.felder.map(([k,l,z,int])=>
    `<div class="f" id="f_${k}"><label for="i_${k}">${l} <span class="z">${z}</span></label><input id="i_${k}" inputmode="decimal" autocomplete="off" placeholder="${int?'z. B. 12':'0,00'}"><span class="m"></span><div class="msg"></div></div>`).join('');
  root.getElementById('score').textContent='';
  root.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function pruefen(){
  let ok=0, tot=A.felder.length;
  A.felder.forEach(([k,l,z,int])=>{
    const f=root.getElementById('f_'+k), raw=root.getElementById('i_'+k).value, m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'; m.textContent=''; msg.textContent='';
    if(!raw.trim()) return;
    const p=parse(raw);
    if(!p){ f.classList.add('fmt'); m.textContent='?'; msg.textContent='Bitte nur eine Zahl eintragen, z. B. 6,17.'; return; }
    const soll=A.wert[k];
    const richtig = int ? (p.v===soll) : near(p.v,r2(soll));
    if(!int && p.dec!==2){ f.classList.add('fmt'); m.textContent='!'; msg.textContent=`Bitte genau 2 Stellen nach dem Komma eintragen${richtig||near(p.v,soll)?' – der Wert selbst stimmt fast.':'.'}`; return; }
    if(richtig){ f.classList.add('ok'); m.textContent='✓'; ok++; return; }
    f.classList.add('no'); m.textContent='✗';
    let t='Das stimmt noch nicht.';
    if(k==='sig' && near(p.v,r2(A.extra.sx))) t='Das ist sx. Gesucht ist σx (Sigma x), zwei Zeilen darüber.';
    else if(A.typ==='hf' && A.extra.ohne && near(p.v, k==='n'?A.extra.ohne.n:r2(A.extra.ohne[k]))) t='Dieser Wert passt zu einer Rechnung ohne Häufigkeiten. Ist die Spalte Freq eingeschaltet und ausgefüllt?';
    else if(k==='R') t='Spannweite = max(x) − min(x).';

    else if(k==='n' && A.typ==='hf') t='n ist die Summe aller Häufigkeiten.';
    msg.textContent=t;
  });
  stat.a++; if(ok===tot) stat.r++;
  root.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  root.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(([k,l,z,int])=>{
    const f=root.getElementById('f_'+k), msg=f.querySelector('.msg');
    if(!f.classList.contains('ok')){ f.classList.add('show'); msg.textContent='Lösung: '+(int?A.wert[k]:de(A.wert[k])); }
  });
}
root.getElementById('pruefen').onclick=pruefen;
root.getElementById('zeigen').onclick=zeigen;
root.getElementById('neu').onclick=neu;
root.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
neu();

 }
};

const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };

function numR(s){ const [i,f='']=s.split(','); return R(parseInt((i||'0')+f,10), 10**f.length); }
function evalT(t,x){
  let total=R(0), sign=1, fs=[], num='';
  const flush=()=>{ if(num){ fs.push(numR(num)); num=''; } };
  const endTerm=()=>{ flush(); if(fs.length){ let p=fs.reduce(mulR); total=addR(total, sign<0?negR(p):p); } fs=[]; };
  for(const k of t){

    if(k==='+'||k==='-'||k==='neg'){ flush(); const s=k==='+'?1:-1; if(fs.length){ endTerm(); sign=s; } else sign*=s; }
  }

}

 html:String.raw`<div class="wrap">

  if(S.mode==='home') return drawHome(S,ziel);
  if(S.mode==='eqmenu') return drawList(S,'Gleichung',EQM,ziel);
  if(S.mode==='grad') return drawList(S,'Anzahl an Graden',GRADE,ziel);
  if(S.mode==='fmt') return drawList(S,'FORMAT',FMT,ziel);
  if(S.mode==='koef'){
    const cells=S.koef.map((v,i)=>`<td class="${i===S.cur?'cur':''}">${dec(valR(v))}</td>`).join('');
    const inp=S.inp.length?renderT(S.inp,true):(S.cur<3?dec(valR(S.koef[S.cur])):'');
    return sbar(S)+`<div class="koef"><div class="kt">${KOPF}</div><table><tr><th>a</th><th>b</th><th>c</th></tr><tr>${cells}</tr></table><div class="inp${Z('inp')}">${inp}</div></div>`;
  }
  if(S.mode==='sol'){
    const n=S.qr.sol.length, i=S.si; let lab, val;
    if(i<n){ lab=n===1?'<span class="vx">x</span>=':`<span class="vx">x</span><sub>${i+1}</sub>=`; val=solH(S.qr.sol[i],S.sd); }
    else if(i===n){ lab=`<span style="font-size:12px">x-Wert ${S.qr.max?'Max':'Min'}=</span>`; val=S.sd?dec(valR(S.qr.mid)):fmtR(S.qr.mid); }
    else { lab=`<span style="font-size:12px">y-Wert ${S.qr.max?'Max':'Min'}=</span>`; val=S.sd?dec(valR(S.qr.yS)):fmtR(S.qr.yS); }
    return sbar(S)+`<div class="app"><div class="ein" style="font-size:14px">${KOPF}</div><div class="aus${Z('res')}"><span class="lab">${lab}</span>${val}</div></div>`;
  }
  if(S.mode==='solvein') return sbar(S)+`<div class="app"><div class="ein">${renderT(S.t,true)}</div><div class="klein"><span>Gleichung eingeben</span></div><div class="aus"></div></div>`;
  if(S.mode==='svar') return sbar(S)+`<div class="list"><div class="ti">Unabh. Variable</div><div class="it sel${Z('var')}">x</div></div>`;
  if(S.mode==='sstart') return sbar(S)+`<div class="list"><div class="ti">Startwert</div><div class="it${S.scur===0?' sel':''}"><span class="vx">x</span>= ${dec(S.sx)}</div><div class="it${S.scur===1?' sel':''}${Z('ausf')}">Ausführen</div></div>`;
  if(S.mode==='sres') return sbar(S)+`<div class="app"><div class="ein">${renderT(S.t,false)}</div><div class="aus${Z('res')}"><span class="lab"><span class="vx">x</span>=</span>${dec(S.sres.x)}</div><div class="klein"><span>L−R=</span><span>${dec(S.sres.lr)}</span></div></div>`;
  return sbar(S)+`<div class="app"><div class="ein"><span class="caret"></span></div><div class="aus"></div></div>`;
}

const ORDER=["l","q","g"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>__D.getElementById(id);
const LBL={on:"ON",home:"HOME",up:"▲",down:"▼",left:"◀",right:"▶",shift:"SHIFT",ok:"OK",back:"↶",format:"FORMAT",
 exe:"EXE",ac:"AC",del:"⌫","-":"−","+":"+",x:'<i class="v">x</i>',"(":"(",")":")",sq:'<span class="bx"></span><sup>2</sup>'};
const WHITE=/^$/;
const lbl=k=>LBL[k]||k;
function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); const c=k==='shift'?'shift':k==='alpha'?'alpha':WHITE.test(k)?'w':''; return `<span class="chip ${c} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){
  const T=TRACKS[t], S=T.start();
  for(let j=0;j<s;j++) run(S,T.steps[j].k);
  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?S.z:(S.z||[]).filter(z=>z!=='res'));
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  if(last&&fin) done[tr]=true;
  $('next').className='go';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Weiter ▶';
  $('next').disabled=fin&&last&&!nextT; { const sk=$('skip'); if(sk) sk.disabled=fin&&last&&!nextT; }
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '<span style="color:var(--mute)">Lesen – dann <b>Weiter</b>.</span>';
  hint();
}
function hint(){
  __D.querySelectorAll('.k.hit').forEach(e=>e.classList.remove('hit'));
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1400); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    const want=S.k[pos]; let extra='';
    if(k==='-'&&want==='shift') extra=' Für ein Vorzeichen zuerst <b>SHIFT</b>, dann <b>−</b>.';
    if(k==='exe'&&want==='shift') extra=' Das Gleichheitszeichen der Gleichung ist <b>SHIFT</b> + <b>(</b>.';
    $('stat').innerHTML=`<span class="err">Das war nicht die richtige Taste.</span> Gesucht: ${chip(want,pos).replace('now','now big')}${extra}`;
  }
}
function advance(){ const T=TRACKS[tr]; if(st<T.steps.length-1){ st++; pos=0; } render(); }
function next(){
  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }

const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-',x:'x',X:'x','(':'(',')':')'};
return {
  ORDER, TRACKS, draw, fresh:(typeof fresh!=='undefined'?fresh:null), run,
  render, press, next, back, KMAP,
  selectTrack:function(t){ if(TRACKS[t]){ tr=t; st=0; pos=0; render(); } },
  selectStep:function(i){ st=+i; pos=0; render(); },
  fwd:function(){ if(lock) return; const T=TRACKS[tr], S=T.steps[st];
    if(st<T.steps.length-1){ st++; pos=0; render(); return; }
    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },
  bwd:function(){ if(lock) return; if(st>0){ st--; pos=0; } else pos=0; render(); },
  goto:function(t,s,i){ tr=t; st=s; pos=i; render(); },
  snap:function(){ return {tr,st,pos,D:Object.assign({},done)}; },

};
 }
};

 init:function(root){

  return {typ:'lin', h:"Lineare Gleichung", auftrag:"Lösen Sie die Gleichung mit Allgemeine Lösung.",

  const f=x=>a*x*x+b*x+c;

const MODES={lin:{name:"Lineare Gleichungen",gen:genLin}, q:{name:"Quadratische Gleichungen",gen:genQuad}, g:{name:"Gleichungen am Graphen",gen:genGraph}};

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }

  let ok=0; const tot=A.felder.length;
  A.felder.forEach(([k,l,z,int])=>{
    const f=$('f_'+k), raw=$('i_'+k).value, m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'; m.textContent=''; msg.textContent='';
    const soll=A.wert[k];

    if(Math.abs(p.v-soll)<0.06){ f.classList.add('fmt'); m.textContent='!'; msg.textContent='Fast – bitte genau auf 2 Nachkommastellen runden.'; return; }

    msg.textContent=t;
  });
  stat.a++; if(ok===tot) stat.r++;
  $('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;

 make:function(__D){

// =====================================================================
//  HOME-Bildschirm fx-991DE CW
// =====================================================================
const T_=(t,sz)=>`<text x="17" y="12" text-anchor="middle" font-size="${sz||11}" font-weight="bold" fill="currentColor">${t}</text>`;
const ICON={
 Berechnung:'<svg viewBox="0 0 34 14"><text x="17" y="6.8" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">×÷</text><text x="17" y="14" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">+−</text></svg>',
 Statistik:'<svg viewBox="0 0 34 14"><path d="M9 1v12h17" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="7" width="2.6" height="5" fill="currentColor"/><rect x="14.5" y="3" width="2.6" height="9" fill="currentColor"/><rect x="18" y="5" width="2.6" height="7" fill="currentColor"/><rect x="21.5" y="8" width="2.6" height="4" fill="currentColor"/></svg>',
 Verteilung:'<svg viewBox="0 0 34 14"><path d="M5 13C11 13 12 2 17 2s6 11 12 11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 13V4.5h6V13" fill="currentColor" opacity=".55"/><path d="M4 13h26" stroke="currentColor" stroke-width="1"/></svg>',
 'Tabellenk.':'<svg viewBox="0 0 34 14"><rect x="9" y="1.5" width="16" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1.5" width="16" height="3" fill="currentColor"/><path d="M9 8.5h16M14.3 4.5v8.5M19.6 4.5v8.5" stroke="currentColor" stroke-width="1"/></svg>',
 'Wertetab.':'<svg viewBox="0 0 34 14"><rect x="10" y="1.5" width="14" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="10" y="1.5" width="14" height="3" fill="currentColor"/><path d="M17 4.5v8.5M10 8.5h14" stroke="currentColor" stroke-width="1"/></svg>',
 Gleichung:'<svg viewBox="0 0 34 14">'+T_('xy=0',9.5)+'<path d="M5 13.3h24" stroke="currentColor" stroke-width="1.3"/></svg>'
};
const APPS=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung"];
function zl(lbl,ziel){ return (ziel||[]).includes(lbl)?' ziel':''; }
function drawHome(S,ziel){
  return `<div class="home"><div class="grid">`+APPS.map((a,i)=>`<div class="ic${i===S.sel?' sel':''}${zl(a,ziel)}"><span class="bd">${i+1}</span>${ICON[a]}<span class="an">${a}</span></div>`).join('')+`</div></div>`;
}
function sbar(S,extra){ return `<div class="sb">${S.shift?'<span class="ind">S</span>':''}<span class="ind">D</span><span class="sp"></span>${extra||''}</div>`; }

// =====================================================================
//  Exakte Rechnung mit Brüchen
// =====================================================================
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const R=(p,q=1)=>{ if(q<0){ p=-p; q=-q; } const g=gcd(p,q); return {p:p/g,q:q/g}; };
const addR=(a,b)=>R(a.p*b.q+b.p*a.q,a.q*b.q), mulR=(a,b)=>R(a.p*b.p,a.q*b.q), negR=a=>R(-a.p,a.q);
function numR(s){ const [i,f='']=s.split(','); return R(parseInt((i||'0')+f,10), 10**f.length); }
function evalT(t,x){
  let total=R(0), sign=1, fs=[], num='';
  const flush=()=>{ if(num){ fs.push(numR(num)); num=''; } };
  const endTerm=()=>{ flush(); if(fs.length){ let p=fs.reduce(mulR); total=addR(total, sign<0?negR(p):p); } fs=[]; };
  for(const k of t){
    if(/^[0-9,]$/.test(k)){ num+=k; continue; }
    if(k==='x'){ flush(); fs.push(x||R(0)); continue; }
    if(k==='sq'){ flush(); const l=fs.pop(); if(l) fs.push(mulR(l,l)); continue; }
    if(k==='+'||k==='-'||k==='neg'){ flush(); const s=k==='+'?1:-1; if(fs.length){ endTerm(); sign=s; } else sign*=s; }
  }
  endTerm(); return total;
}
const dez=r=>{ const v=r.p/r.q; return Number(v.toPrecision(10)).toString().replace('.',',').replace('-','−'); };
const TK={neg:'<span class="ng">−</span>','-':'−','+':'+',x:'<span class="vx">x</span>',sq:'<sup>2</sup>'};
const renderT=(t,caret)=>t.map(k=>TK[k]||k).join('')+(caret?'<span class="caret"></span>':'');
// Zahl-Eingabe (Tabellenbereich): Token-Liste -> rationale Zahl
const numTok=t=>evalT(t,null);

// =====================================================================
//  Rechnerzustand: App Wertetab.
// =====================================================================
const TOOLS=["Tabellentyp","f(x)/g(x) defin.","Tabellenbereich","Neu berechnen","Editieren"];
const TTYP=["f(x)/g(x)","f(x)","g(x)"];
const FMENU=["f(x)","g(x)","f(x) definieren","g(x) definieren"];
const RNAME=["Start","Ende","Schritt"];
function fresh(){ return {mode:'calc', sel:0, shift:false, typ:0, def:{f:null,g:['0',',','5','x','sq','-','3','x','+','2',',','5']},
  dEd:[], which:'f', rng:[['1'],['5'],['1']], rEd:null, rRow:0, tab:null, row:0, col:0}; }
function genTab(S){
  const st=numTok(S.rng[0]), en=numTok(S.rng[1]), sw=numTok(S.rng[2]);
  const xs=[]; let x=st;
  for(let i=0;i<45 && (x.p/x.q)<=(en.p/en.q)+1e-9;i++){ xs.push(x); x=addR(x,sw); }
  S.tab=xs; S.row=0; S.col=0;
}
function cols(S){ const c=['x']; if(S.typ!==2) c.push('f'); if(S.typ!==1) c.push('g'); return c; }
function step(S,k){
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='-') k='neg'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);
     else if((k==='ok'||k==='exe')&&S.sel===4){ S.mode='app'; }
     return;
   case 'app':
     if(k==='tools'){ S.mode='tools'; S.sel=0; return; }
     if(k==='func'){ S.mode='fmenu'; S.sel=0; return; }
     if(S.tab){ const n=cols(S).length;
       if(k==='down') S.row=Math.min(S.tab.length-1,S.row+1); else if(k==='up') S.row=Math.max(0,S.row-1);
       else if(k==='right') S.col=Math.min(n-1,S.col+1); else if(k==='left') S.col=Math.max(0,S.col-1); }
     return;
   case 'tools':
     if(k==='down') S.sel=Math.min(TOOLS.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'||k==='ac') S.mode='app';
     else if(k==='ok'||k==='exe'){
       if(S.sel===0){ S.mode='ttyp'; S.sel=S.typ; }
       else if(S.sel===2){ S.mode='range'; S.rRow=0; S.rEd=null; }
       else S.mode='app';
     }
     return;
   case 'ttyp':
     if(k==='down') S.sel=Math.min(TTYP.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'||k==='ac') S.mode='tools';
     else if(k==='ok'||k==='exe'){ S.typ=S.sel; S.tab=null; S.mode='app'; }
     return;
   case 'fmenu':
     if(k==='down') S.sel=Math.min(FMENU.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'||k==='ac') S.mode='app';
     else if((k==='ok'||k==='exe')&&S.sel>=2){ S.which=S.sel===2?'f':'g'; S.dEd=[]; S.mode='def'; }
     return;
   case 'def':
     if(k==='exe'){ S.def[S.which]=S.dEd; S.mode='app'; return; }
     if(k==='back'){ S.mode='app'; return; }
     if(k==='ac'){ S.dEd=[]; return; }
     if(k==='del'){ S.dEd.pop(); return; }
     if(/^[0-9,]$/.test(k)||['x','sq','+','-','neg'].includes(k)) S.dEd.push(k);
     return;
   case 'range':
     if(S.rRow<3){
       if(/^[0-9,]$/.test(k)||k==='neg'){ if(!S.rEd) S.rEd=[]; S.rEd.push(k); return; }
       if(k==='del'&&S.rEd){ S.rEd.pop(); return; }
       if(k==='exe'||k==='ok'){ if(S.rEd&&S.rEd.length) S.rng[S.rRow]=S.rEd; S.rEd=null; S.rRow++; return; }
       if(k==='down'){ S.rEd=null; S.rRow=Math.min(3,S.rRow+1); return; }
       if(k==='up'){ S.rEd=null; S.rRow=Math.max(0,S.rRow-1); return; }
     } else {
       if(k==='exe'||k==='ok'){ genTab(S); S.mode='app'; return; }
       if(k==='up'){ S.rRow=2; return; }
     }
     if(k==='back'||k==='ac') S.mode='app';

   case 'calc':
     return;
  }
}
function run(S,keys){ keys.forEach(k=>step(S,k)); return S; }
function cellVal(S,c,x){ if(c==='x') return dez(x); const d=S.def[c]; return d&&d.length?dez(evalT(d,x)):''; }
function drawTab(S,ziel){
  const C=cols(S), names={x:'x',f:'f(x)',g:'g(x)'};

  }

function draw(S,ziel){
  if(S.mode==='calc') return sbar(S)+'<div class="app"><div class="ein"><span class="caret"></span></div><div></div></div>';
  if(S.mode==='home') return drawHome(S,ziel);
  if(S.mode==='app') return drawTab(S,ziel);
  if(['tools','ttyp','fmenu'].includes(S.mode)){
    const L={tools:TOOLS,ttyp:TTYP,fmenu:FMENU}[S.mode], T={tools:'TOOLS',ttyp:'Tabellentyp',fmenu:'FUNCTION'}[S.mode];
    const off=Math.max(0,S.sel-3);
    return sbar(S)+`<div class="list"><div class="ti">${T}</div>`+L.slice(off,off+4).map((t,i)=>`<div class="it${i+off===S.sel?' sel':''}${zl(t,ziel)}"><span>${t}</span></div>`).join('')+'</div>';
  }
  if(S.mode==='def') return sbar(S)+`<div class="app"><div class="ein"><span class="defl"><span class="vx">${S.which}</span>(<span class="vx">x</span>)=</span>${renderT(S.dEd,true)}</div><div></div></div>`;
  if(S.mode==='range'){
    let h=sbar(S)+`<div class="list"><div class="ti">Tabellenbereich</div>`;
    RNAME.forEach((nm,i)=>{ const ed=i===S.rRow&&S.rEd; const v=ed?renderT(S.rEd,true):renderT(S.rng[i],false);
      h+=`<div class="it${i===S.rRow?' sel':''}${zl(nm,ziel)}"><span>${nm}:</span><span class="val">${v}</span></div>`; });

}

const AB=(nr,items)=>`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: ${nr}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Am eigenen Rechner arbeiten, Ergebnisse auf dem Blatt eintragen, dann <b>Weiter</b>.</p></div>`;

const T1=[

  {t:"f(x) definieren", a:B1, k:["func","down","down","ok"], z:["f(x) definieren"],

  {t:"Term eingeben und speichern", a:B1, k:["shift","-","0",",","5","x","sq","+","2","x","+","1","exe"],

  {t:"Start: −1", a:B1, k:["shift","-","1","exe"], z:["Start"],

  {t:"Ende: 5", a:B1, k:["5","exe"], z:["Ende"],

  {t:"Tabelle ablesen", a:B1, k:["right","down","down","down"], z:["cell"],

   n:"Unten im Display steht der Wert der markierten Zelle noch einmal groß."},
  {t:"Selbst arbeiten", k:[], ab:1, d:AB("Aufgabe 1",["<b>FUNCTION</b> ▸ <b>f(x) definieren</b> ▸ neuen Term eingeben ▸ <b>EXE</b>","<b>TOOLS</b> ▸ <b>Tabellenbereich</b> ▸ Start, Ende, Schritt ▸ <b>Ausführen</b>","Werte in die Tabelle übertragen – danach die zweite Tabelle mit Schrittweite 0,2"])}
];

// =====================================================================

 exe:"EXE",ac:"AC",del:"⌫","-":"−","+":"+",x:'<i class="v">x</i>', sq:'<span class="bx"></span><sup>2</sup>'};

function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); return `<span class="chip ${k==='shift'?'shift':''} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){

  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===tr?'on':''} ${done[k]?'fertig':''}" data-t="${k}">${TRACKS[k].name}</button>`).join('');
  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');
  $('nr').textContent=`${T.name} · Schritt ${st+1} von ${T.steps.length}`;
  $('tt').textContent=S.t;
  $('task').style.display=S.a?'block':'none';
  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';
  $('dd').innerHTML=(S.d||'')+(S.n?`<div class="note"><b>Hinweis:</b> ${S.n}</div>`:'');
  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?(S.z||[]).filter(z=>z==='cell'):(S.z||[]).filter(z=>z!=='cell'));
  $('back').disabled=st===0&&pos===0;
  const last=st===T.steps.length-1, nextT=ORDER[ORDER.indexOf(tr)+1];
  if(last&&fin) done[tr]=true;
  $('next').className='go';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Weiter ▶';
  $('next').disabled=fin&&last&&!nextT; { const sk=$('skip'); if(sk) sk.disabled=fin&&last&&!nextT; }
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '';
  hint();
}
function hint(){
  __D.querySelectorAll('.k.hit,.k.held').forEach(e=>e.classList.remove('hit','held'));
  const S=TRACKS[tr].steps[st];
  if(pos>0&&S.k[pos-1]==='shift'&&pos<S.k.length){ const c=__D.querySelector('.k[data-k="shift"]'); if(c) c.classList.add('held'); }
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1600); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    let extra='';
    if(k==='-'&&S.k[pos]==='shift'&&S.k[pos+1]==='-') extra=' Für das Vorzeichen erst <b>SHIFT</b>, dann <b>−</b>.';

  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); }

function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }
const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-',x:'x',X:'x'};
return {
  ORDER, TRACKS, draw, fresh:(typeof fresh!=='undefined'?fresh:null), run,
  render, press, next, back, KMAP,
  selectTrack:function(t){ if(TRACKS[t]){ tr=t; st=0; pos=0; render(); } },
  selectStep:function(i){ st=+i; pos=0; render(); },
  fwd:function(){ if(lock) return; const T=TRACKS[tr], S=T.steps[st];
    if(st<T.steps.length-1){ st++; pos=0; render(); return; }
    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },
  bwd:function(){ if(lock) return; if(st>0){ st--; pos=0; } else pos=0; render(); },
  goto:function(t,s,i){ tr=t; st=s; pos=i; render(); },
  snap:function(){ return {tr,st,pos,D:Object.assign({},done)}; },
  restore:function(o){ tr=o.tr; st=o.st; pos=o.pos; Object.keys(done).forEach(k=>delete done[k]); Object.assign(done,o.D); render(); }
};
 }
};

@media (max-width:520px){ .f{ grid-template-columns:1fr 26px; } .f .lab{ grid-column:1 / -1; } }`,
 html:String.raw`<div class="wrap">
  <div class="tabs" id="tabs"></div>

 init:function(root){

const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const de=(v,d=2)=>r2(v).toFixed(d).replace('.',',').replace('-','−');

}
const WEG={
 dex:'<span class="taste">MENU</span> <span class="taste w">9</span> ▸ Term mit <span class="taste"><i>x</i></span> eingeben ▸ <span class="taste w">=</span> ▸ Start <span class="taste w">=</span> ▸ Ende <span class="taste w">=</span> ▸ Inkre <span class="taste w">=</span> · Neue Funktion: <span class="taste b">AC</span> <span class="taste b">AC</span>, Term eingeben. Vorzeichen am Anfang mit <span class="taste">(−)</span>.',
 cw:'<span class="taste">FUNCTION</span> ▸ f(x) definieren ▸ Term <span class="taste">EXE</span> ▸ <span class="taste">TOOLS</span> ▸ Tabellenbereich ▸ Start, Ende, Schritt ▸ Ausführen <span class="taste">EXE</span> · Vorzeichen am Anfang mit <span class="taste sh">SHIFT</span> <span class="taste">−</span>.'
}[MODEL];

// ---------- Modus 1: Tabelle ausfüllen ----------
function genTab(){
  const a=pick([0.5,-0.5,0.25,-0.25,1,-1,1.5,-1.5,2,0.75]);

}

    a=pick([0.5,-0.5,1,-1,0.25,-0.25]); b=pick([-3,-2,-1.5,-1,-0.5,0.5,1,1.5,2,3]); c=pick([-4,-3.5,-3,-2.5,-2,-1.5,1.5,2,2.5,3]);

    if(ys.some(y=>Math.abs(y)<1e-9)) continue;

    round:'<b>Gesucht:</b> Zwischen welchen x-Werten der Tabelle wechselt <i>f</i>(<i>x</i>) das Vorzeichen? Dort liegen die <b>Nullstellen</b>.',
    zeilen:vw.map((i,j)=>({id:'v'+j, nr:j+1, von:xs[i-1], bis:xs[i]})), f, xs, vw};
}

const MODES={tab:{name:"Tabelle ausfüllen",gen:genTab}, vz:{name:"Vorzeichenwechsel",gen:genVz}};

const $=id=>root.getElementById(id);
function neu(){
  A=MODES[mode].gen();
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');

    `<div class="f" id="f_${z.id}"><span class="lab"><i>x</i> = ${fmt(z.x)}</span><span class="ins"><i>f</i>(${fmt(z.x)}) = <input id="i_${z.id}" inputmode="decimal" autocomplete="off" placeholder="0,00"></span><span class="m"></span><div class="msg"></div></div>`).join('');

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }

  let ok=0, tot=A.zeilen.length;

    const f=$('f_'+z.id), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'; m.textContent=''; msg.textContent='';
    if(A.typ==='vz'){

      const lo=Math.min(pa.v,pb.v), hi=Math.max(pa.v,pb.v);

  $('loes').className='loes zeig';
  $('score').textContent='';
}
$('pruefen').onclick=pruefen; $('zeigen').onclick=zeigen; $('neu').onclick=neu;
$('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
neu();

 }

 make:function(__D){

// =====================================================================
//  HOME-Bildschirm fx-991DE CW
// =====================================================================
const T_=(t,sz)=>`<text x="17" y="12" text-anchor="middle" font-size="${sz||11}" font-weight="bold" fill="currentColor">${t}</text>`;
const ICON={
 Berechnung:'<svg viewBox="0 0 34 14"><text x="17" y="6.8" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">×÷</text><text x="17" y="14" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1.5" fill="currentColor">+−</text></svg>',
 Statistik:'<svg viewBox="0 0 34 14"><path d="M9 1v12h17" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="7" width="2.6" height="5" fill="currentColor"/><rect x="14.5" y="3" width="2.6" height="9" fill="currentColor"/><rect x="18" y="5" width="2.6" height="7" fill="currentColor"/><rect x="21.5" y="8" width="2.6" height="4" fill="currentColor"/></svg>',
 Verteilung:'<svg viewBox="0 0 34 14"><path d="M5 13C11 13 12 2 17 2s6 11 12 11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 13V4.5h6V13" fill="currentColor" opacity=".55"/><path d="M4 13h26" stroke="currentColor" stroke-width="1"/></svg>',
 'Tabellenk.':'<svg viewBox="0 0 34 14"><rect x="9" y="1.5" width="16" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1.5" width="16" height="3" fill="currentColor"/><path d="M9 8.5h16M14.3 4.5v8.5M19.6 4.5v8.5" stroke="currentColor" stroke-width="1"/></svg>',
 'Wertetab.':'<svg viewBox="0 0 34 14"><rect x="10" y="1.5" width="14" height="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="10" y="1.5" width="14" height="3" fill="currentColor"/><path d="M17 4.5v8.5M10 8.5h14" stroke="currentColor" stroke-width="1"/></svg>',
 Gleichung:'<svg viewBox="0 0 34 14">'+T_('xy=0',9.5)+'<path d="M5 13.3h24" stroke="currentColor" stroke-width="1.3"/></svg>'
};
const APPS=["Berechnung","Statistik","Verteilung","Tabellenk.","Wertetab.","Gleichung"];
function zl(lbl,ziel){ return (ziel||[]).includes(lbl)?' ziel':''; }
function drawHome(S,ziel){
  return `<div class="home"><div class="grid">`+APPS.map((a,i)=>`<div class="ic${i===S.sel?' sel':''}${zl(a,ziel)}"><span class="bd">${i+1}</span>${ICON[a]}<span class="an">${a}</span></div>`).join('')+`</div></div>`;
}
function sbar(S,extra){ return `<div class="sb">${S.shift?'<span class="ind">S</span>':''}<span class="ind">D</span><span class="sp"></span>${extra||''}</div>`; }

// =====================================================================
//  Exakte Rechnung: Polynom-Term -> Ableitung an einer Stelle
// =====================================================================
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const R=(p,q=1)=>{ if(q<0){ p=-p; q=-q; } const g=gcd(p,q); return {p:p/g,q:q/g}; };
const addR=(a,b)=>R(a.p*b.q+b.p*a.q,a.q*b.q), mulR=(a,b)=>R(a.p*b.p,a.q*b.q), negR=a=>R(-a.p,a.q);
const powR=(a,n)=>{ let r=R(1); for(let i=0;i<n;i++) r=mulR(r,a); return r; };
function numR(s){ const [i,f='']=s.split(','); return R(parseInt((i||'0')+f,10), 10**f.length); }
// Token-Liste -> Polynom {Grad: Koeffizient}
function poly(t){
  const P={}; let sign=1, c=null, deg=0, num='', inE=false, eStr='', any=false;
  const flush=()=>{ if(num){ c=c?mulR(c,numR(num)):numR(num); num=''; any=true; } };
  const endTerm=()=>{ flush(); if(any){ let k=c||R(1); if(sign<0) k=negR(k); P[deg]=P[deg]?addR(P[deg],k):k; } c=null; deg=0; any=false; };
  for(const k of t){
    if(inE){ if(/^[0-9]$/.test(k)){ eStr+=k; continue; } inE=false; deg+=Math.max(0,(parseInt(eStr||'1',10))-1); if(k==='right') continue; }
    if(/^[0-9,]$/.test(k)){ num+=k; continue; }
    if(k==='x'){ flush(); deg+=1; any=true; continue; }
    if(k==='sq'){ flush(); deg+=1; continue; }
    if(k==='pow'){ flush(); inE=true; eStr=''; continue; }
    if(k==='+'||k==='-'||k==='neg'){ const s=k==='+'?1:-1; flush(); if(any){ endTerm(); sign=s; } else sign*=s; }
  }
  if(inE){ deg+=Math.max(0,(parseInt(eStr||'1',10))-1); }
  endTerm(); return P;
}
function ableitung(t,a){ const P=poly(t); let s=R(0); for(const d in P){ const n=+d; if(n>0) s=addR(s, mulR(mulR(P[d],R(n)), powR(a,n-1))); } return s; }
const dez=r=>{ const v=r.p/r.q; return Number(v.toPrecision(10)).toString().replace('.',',').replace('-','−'); };
const TK={neg:'−','-':'−','+':'+',x:'<span class="vx">x</span>',sq:'<sup>2</sup>'};
// Term rendern, Exponent nach pow bis ▶ hochgestellt; caret = Cursor am Ende
function renderT(t,caret){
  let h='', inE=false;
  for(const k of t){
    if(inE && !/^[0-9]$/.test(k)){ h+='</sup>'; inE=false; if(k==='right') continue; }
    if(k==='pow'){ h+='<sup>'; inE=true; continue; }
    h+=TK[k]||k;
  }
  if(inE) h+=(t[t.length-1]==='pow'?'<span class="bx sm"></span>':'')+(caret?'<span class="caret"></span>':'')+'</sup>';
  else if(caret) h+='<span class="caret"></span>';
  return h;
}
const inExp=t=>{ let e=false; for(const k of t){ if(k==='pow') e=true; else if(e && !/^[0-9]$/.test(k)) e=false; } return e; };
const leer='<span class="bx feld"></span>';
function drawDD(S){
  const f=S.f.length||S.fld===0 ? renderT(S.f,S.fld===0&&!S.res) : leer;
  const a=S.a.length||S.fld===1 ? renderT(S.a,S.fld===1&&!S.res) : leer;
  return sbar(S)+`<div class="app"><div class="ein dd"><span class="fr ddx"><span>d</span><span>d<span class="vx">x</span></span></span><span class="kl">(</span>${f}<span class="kl">)</span><span class="evb"></span><span class="evx"><span class="vx">x</span>=${a}</span></div><div class="erg">${S.res?dez(S.res):''}</div></div>`;
}
// Gemeinsame Tasten im Ableitungs-Template
function ddKey(S,k){
  if(k==='exe'){ if(S.f.length&&S.a.length){ S.res=ableitung(S.f, poly(S.a)[0]||R(0)); } return true; }
  if(S.res){ // nach dem Ergebnis: ◀ = am Ende weiter bearbeiten
    if(k==='left'){ S.res=null; S.fld=1; return true; }
    if(k==='ac'){ S.mode='calc'; S.res=null; return true; }

  }
  const T=S.fld===0?S.f:S.a;
  if(k==='right'){ if(S.fld===0&&inExp(S.f)) S.f.push('right'); else S.fld=1; return true; }
  if(k==='left'){ S.fld=0; return true; }
  if(k==='del'){ T.pop(); return true; }
  if(k==='ac'){ S.mode='calc'; return true; }
  if(/^[0-9,]$/.test(k)||['x','sq','pow','+','-','neg'].includes(k)){ if(S.fld===1&&['x','sq','pow'].includes(k)) return true; T.push(k); return true; }
  return true;
}
function newDD(S){ S.mode='dd'; S.f=[]; S.a=[]; S.fld=0; S.res=null; }
// =====================================================================
//  Rechnerzustand: App Berechnung, CATALOG ▸ Funktionsanalyse ▸ Ableitung
// =====================================================================
const CATS=["Funktionsanalyse","Wahrscheinlichkeit","Numerische Berechn.","Winkel/Koord/Sexa","Hyperbel/Trig.","Sonstige"];
const FA=["Ableitung(d/dx)","Integration(∫)","Summation(Σ)","Produkt(Π)","Rechnen mit Rest"];
function fresh(){ return {mode:'calc', sel:0, shift:false, f:[], a:[], fld:0, res:null}; }
function step(S,k){
  if(k==='shift'){ S.shift=!S.shift; return; }
  if(S.shift){ S.shift=false; if(k==='-') k='neg'; else return; }
  if(k==='home'){ S.mode='home'; S.sel=0; return; }
  switch(S.mode){
   case 'home':
     if(k==='right') S.sel=Math.min(APPS.length-1,S.sel+1); else if(k==='left') S.sel=Math.max(0,S.sel-1);
     else if(k==='down') S.sel=Math.min(APPS.length-1,S.sel+3); else if(k==='up') S.sel=Math.max(0,S.sel-3);

     return;

     if(k==='cat'){ S.mode='cat'; S.sel=0; }
     return;
   case 'cat':

     else if(k==='back'||k==='ac') S.mode='calc';
     else if((k==='ok'||k==='exe')&&S.sel===0){ S.mode='fa'; S.sel=0; }
     return;
   case 'fa':
     if(k==='down') S.sel=Math.min(FA.length-1,S.sel+1); else if(k==='up') S.sel=Math.max(0,S.sel-1);
     else if(k==='back'){ S.mode='cat'; S.sel=0; } else if(k==='ac') S.mode='calc';
     else if((k==='ok'||k==='exe')&&S.sel===0) newDD(S);

   case 'dd':

function draw(S,ziel){

    return sbar(S)+`<div class="list"><div class="ti">${T}</div>`+L.slice(off,off+4).map((t,i)=>`<div class="it${i+off===S.sel?' sel':''}${zl(t,ziel)}"><span>${t}</span></div>`).join('')+'</div>';
  }

}

// =====================================================================
//  Tour-Inhalte
// =====================================================================
const AB=(nr,items)=>`<div class="ab"><div class="abt"><span>✍</span> Arbeitsblatt: ${nr}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Am eigenen Rechner arbeiten, Ergebnisse auf dem Blatt eintragen, dann <b>Weiter</b>.</p></div>`;
const termF=`<i>f</i>(<i>x</i>) = 0,5<i>x</i><sup>3</sup> − 2<i>x</i><sup>2</sup> + 3`;
const termG=`<i>g</i>(<i>x</i>) = −0,5<i>x</i><sup>2</sup> + 2<i>x</i> + 1`;
const B1=termF+'<div class="bereich">Gesucht: Steigung an der Stelle <i>x</i> = 2, also <i>f</i> ′(2)</div>';
const B2=termG+'<div class="bereich">Gesucht: Steigungen <i>g</i> ′(0), <i>g</i> ′(4) und <i>g</i> ′(2)</div>';
const T1=[
  {t:"App Berechnung öffnen", a:B1, k:["home","ok"], z:["Berechnung"],
   d:"<p>Drücken Sie <b>HOME</b>. Die App <b>Berechnung</b> ist schon markiert. Öffnen Sie sie mit <b>OK</b>.</p>",
   n:"Die Ableitung an einer Stelle geht auch in anderen Apps – am einfachsten ist aber <b>Berechnung</b>."},
  {t:"Ableitung aufrufen", a:B1, k:["cat","ok","ok"], z:["Funktionsanalyse","Ableitung(d/dx)"],
   d:"<p><b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>OK</b> ▸ <b>Ableitung(d/dx)</b> ▸ <b>OK</b>.</p><p>Im Display erscheint die Vorlage <b>d/dx( ▭ )|x=▭</b> mit zwei leeren Feldern.</p>"},
  {t:"Funktionsterm eingeben", a:B1, k:["0",",","5","x","pow","3","right","-","2","x","sq","+","3"],
   d:"<p>Tippen Sie den Term in das <b>erste Feld</b>.</p><p><b>x³</b>: <b>x</b>, dann die Potenz-Taste, dann <b>3</b>. Mit <b>▶</b> verlassen Sie den Exponenten wieder.</p>",
   n:"Ohne ▶ würde „− 2x² + 3“ mit in den Exponenten rutschen!"},
  {t:"Ins Feld x= wechseln", a:B1, k:["right"],
   d:"<p>Mit <b>▶</b> springt der Cursor aus der Klammer in das Feld <b>x=</b>.</p>"},
  {t:"Stelle eingeben und rechnen", a:B1, k:["2","exe"],
   d:"<p>Tippen Sie <b>2</b> und drücken Sie <b>EXE</b>.</p><p>Ergebnis: <b><i>f</i> ′(2) = −2</b>. Die Steigung ist negativ – der Graph <b>fällt</b> an der Stelle 2.</p>",
   n:"Positiv = Graph steigt · negativ = Graph fällt · 0 = waagerechte Tangente."},
  {t:"Selbst arbeiten", k:[], ab:1, d:AB("Aufgabe 1",["<b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>Ableitung(d/dx)</b>","Term eingeben ▸ <b>▶</b> ▸ Stelle eingeben ▸ <b>EXE</b>","Negative Stelle: <b>SHIFT −</b>, z. B. für <i>f</i> ′(−1)","Steigt, fällt oder waagerecht? In die Tabelle eintragen"])}
];
const T2=[
  {t:"Neu anfangen", a:B2, k:["ac","cat","ok","ok"], z:["Funktionsanalyse","Ableitung(d/dx)"],
   d:"<p><b>AC</b> löscht die alte Rechnung. Dann wieder <b>CATALOG</b> ▸ <b>Funktionsanalyse</b> ▸ <b>Ableitung(d/dx)</b>.</p>"},
  {t:"Parabel eingeben", a:B2, k:["shift","-","0",",","5","x","sq","+","2","x","+","1"],
   d:"<p>Das Minus <b>am Anfang</b> ist ein Vorzeichen: <b>SHIFT</b> <b>−</b>.</p><p><b>x²</b> hat eine eigene Taste – hier brauchen Sie kein ▶.</p>"},
  {t:"Steigung an der Stelle 0", a:B2, k:["right","0","exe"],
   d:"<p><b>▶</b>, dann <b>0</b> und <b>EXE</b>.</p><p><b><i>g</i> ′(0) = 2</b>: positiv – die Parabel <b>steigt</b> bei <i>x</i> = 0.</p>"},
  {t:"Andere Stelle: Eingabe ändern", a:B2, k:["left","del","4","exe"],
   d:"<p>Sie müssen nicht alles neu tippen: <b>◀</b> holt die Eingabe zurück, der Cursor steht hinter der 0.</p><p><b>⌫</b>, dann <b>4</b> und <b>EXE</b>: <b><i>g</i> ′(4) = −2</b> – die Parabel <b>fällt</b>.</p>"},
  {t:"Waagerechte Tangente", a:B2, k:["left","del","2","exe"],
   d:"<p>Noch einmal: <b>◀</b>, <b>⌫</b>, <b>2</b>, <b>EXE</b>.</p><p><b><i>g</i> ′(2) = 0</b>: Die Tangente ist <b>waagerecht</b>. Hier liegt der Scheitelpunkt der Parabel.</p>",
   n:"Erscheint ein Bruch statt einer Dezimalzahl, schalten Sie mit <b>FORMAT</b> ▸ <b>Dezimal</b> um."},
  {t:"Selbst arbeiten", k:[], ab:1, d:AB("Aufgabe 2",["Parabel <b>g</b> einmal eingeben","Für jede Tangente nur die Stelle ändern: <b>◀</b> ▸ <b>⌫</b> ▸ neue Zahl ▸ <b>EXE</b>","Steigung <i>m</i><sub>t</sub> in die Lücke an der Tangente eintragen","Danach: Lösungscode eintragen"])}
];
const allK=a=>a.flatMap(s=>s.k);
const TRACKS={
  c:{name:"1 · Ableitung an einer Stelle", start:()=>fresh(), steps:T1},
  n:{name:"2 · Parabel: Stelle ändern", start:()=>run(fresh(),allK(T1)), steps:T2}
};

// =====================================================================
//  Steuerung
// =====================================================================
const ORDER=["c","n"];
let tr=ORDER[0], st=0, pos=0, lock=false; const done={};
const $=id=>__D.getElementById(id);
const LBL={on:"ON",home:"HOME ⌂",back:"↶",ok:"OK",up:"▲",down:"▼",left:"◀",right:"▶",shift:"SHIFT",func:"FUNCTION",tools:"TOOLS",cat:"CATALOG",
 exe:"EXE",ac:"AC",del:"⌫","-":"−","+":"+",x:'<i class="v">x</i>', sq:'<span class="bx"></span><sup>2</sup>', pow:'<span class="bx"></span><sup>▫</sup>'};
const lbl=k=>LBL[k]||k;
function chip(k,i){ const s=i<pos?'done':(i===pos?'now':''); return `<span class="chip ${k==='shift'?'shift':''} ${s}">${lbl(k)}</span>`; }
function stateAt(t,s,i){
  const T=TRACKS[t], S=T.start();
  for(let j=0;j<s;j++) run(S,T.steps[j].k);
  return run(S,T.steps[s].k.slice(0,i));
}
function render(){
  const T=TRACKS[tr], S=T.steps[st];

  $('prog').innerHTML=T.steps.map((x,i)=>`<i class="${x.ab?'abp ':''}${i<st?'done':i===st?'now':''}" data-i="${i}"></i>`).join('');

  $('tt').textContent=S.t;

  $('task').innerHTML=S.a?`<div class="auf">Aufgabe</div><div class="term">${S.a}</div>`:'';
  $('chips').innerHTML=S.k.length?S.k.map(chip).join(''):'';

  const fin=pos>=S.k.length;
  $('scr').innerHTML=draw(stateAt(tr,st,pos), fin?(S.z||[]).filter(z=>z==='cell'):(S.z||[]).filter(z=>z!=='cell'));
  $('back').disabled=st===0&&pos===0;

  if(last&&fin) done[tr]=true;
  $('next').className='go';
  $('next').textContent=fin ? (last ? (nextT?`Weiter mit ${TRACKS[nextT].name} ▶`:'Fertig ✓') : 'Weiter ▶') : 'Weiter ▶';
  $('next').disabled=fin&&last&&!nextT; { const sk=$('skip'); if(sk) sk.disabled=fin&&last&&!nextT; }
  $('stat').style.display=S.ab?'none':'flex';
  $('stat').innerHTML=S.k.length? (fin?'<span class="ok">✓ Richtig!</span>':`Drücken Sie jetzt: ${chip(S.k[pos],pos).replace('now','now big')}`) : '';
  hint();
}
function hint(){
  __D.querySelectorAll('.k.hit,.k.held').forEach(e=>e.classList.remove('hit','held'));
  const S=TRACKS[tr].steps[st];
  if(pos>0&&S.k[pos-1]==='shift'&&pos<S.k.length){ const c=__D.querySelector('.k[data-k="shift"]'); if(c) c.classList.add('held'); }
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(S.k[pos])}"]`); if(el) el.classList.add('hit');
}
function press(k){
  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();

    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },

 }

 html:String.raw`<div class="wrap">

const MODES={abl:{name:"Ableitung berechnen",gen:genAbl}, deut:{name:"Steigt oder fällt?",gen:genDeut}, tan:{name:"Tangentensteigung",gen:genTan}};

    (A.typ==='deut'?` <select id="s_${z.id}" style="font:inherit;font-family:system-ui,Arial,sans-serif;font-size:15px;padding:4px 6px;border:1px solid #b8bdc6;border-radius:6px;background:#f7f8fa">${VERL.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`:'')+

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function pruefen(){
  let ok=0, tot=A.zeilen.length;
  A.zeilen.forEach(z=>{
    const f=$('f_'+z.id), m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'; m.textContent=''; msg.textContent='';
    const raw=$('i_'+z.id).value;
    if(!raw.trim()) return;
    const p=parse(raw);

        if(sv!==verl(z.soll)){ f.classList.add('no'); m.textContent='✗'; msg.textContent='Der Wert stimmt, aber die Deutung nicht: positiv = steigt, negativ = fällt, 0 = waagerecht.'; return; }
      }

  if(lock) return;
  const S=TRACKS[tr].steps[st];
  if(pos>=S.k.length) return;
  const el=__D.querySelector(`.k[data-k="${CSS.escape(k)}"]`);
  if(k===S.k[pos]){
    pos++; if(el){ el.classList.add('good'); setTimeout(()=>el.classList.remove('good'),220); }
    render();
    if(pos>=S.k.length){ lock=true; setTimeout(()=>{ lock=false; advance(); },1600); }
  } else {
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),450); }
    let extra='';
    if(k==='exe'&&S.k[pos]==='shift') extra=' Für die Dezimalzahl erst <b>SHIFT</b>, dann <b>EXE</b> (≈).';
    if(k==='right'&&S.k[pos]==='down') extra=' Zur unteren Grenze geht es mit <b>▼</b>.';
    if(k==='right'&&S.k[pos]==='up') extra=' Zur oberen Grenze geht es mit <b>▲</b>.';
    if(k==='-'&&S.k[pos]==='shift'&&S.k[pos+1]==='-') extra=' Für das Vorzeichen erst <b>SHIFT</b>, dann <b>−</b>.';

  const T=TRACKS[tr], S=T.steps[st];
  if(pos<S.k.length){ pos=S.k.length; render(); return; }
  if(st<T.steps.length-1){ st++; pos=0; render(); return; }
  const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); }
}
function back(){ if(pos>0){ pos=0; } else if(st>0){ st--; pos=0; } render(); }
const KMAP={Enter:'exe',Escape:'ac',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'del',Delete:'del','.':',',',':',','+':'+','-':'-',x:'x',X:'x'};
return {
  ORDER, TRACKS, draw, fresh:(typeof fresh!=='undefined'?fresh:null), run,
  render, press, next, back, KMAP,
  selectTrack:function(t){ if(TRACKS[t]){ tr=t; st=0; pos=0; render(); } },
  selectStep:function(i){ st=+i; pos=0; render(); },
  fwd:function(){ if(lock) return; const T=TRACKS[tr], S=T.steps[st];
    if(st<T.steps.length-1){ st++; pos=0; render(); return; }
    const n=ORDER[ORDER.indexOf(tr)+1]; if(n){ tr=n; st=0; pos=0; render(); __D.scrollTo({top:0,behavior:'smooth'}); return; }
    if(pos<S.k.length){ pos=S.k.length; render(); } },
  weiter:function(){ if(lock) return; const S=TRACKS[tr].steps[st]; if(pos<S.k.length) press(S.k[pos]); else this.fwd(); },
  bwd:function(){ if(lock) return; if(st>0){ st--; pos=0; } else pos=0; render(); },
  goto:function(t,s,i){ tr=t; st=s; pos=i; render(); },
  snap:function(){ return {tr,st,pos,D:Object.assign({},done)}; },
  restore:function(o){ tr=o.tr; st=o.st; pos=o.pos; Object.keys(done).forEach(k=>delete done[k]); Object.assign(done,o.D); render(); }
};
 }
};

 html:String.raw`<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <h2 id="h"></h2>
    <p class="auftrag" id="auftrag"></p>
    <div class="term" id="term"></div>

  </div>
  <div class="card">
    <div class="round" id="round"></div>
    <div class="rows" id="felder"></div>

      <button class="go" id="pruefen">Prüfen</button>

 init:function(root){

const MODEL='cw';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const de=(v,d=2)=>{ const x=r2(v); return (Math.abs(x)<1e-9?0:x).toFixed(d).replace('.',',').replace('-','−'); };
const fmt=v=>String(Number(v.toPrecision(10))).replace('.',',').replace('-','−');
// Polynom c=[c3,c2,c1,c0]
function termHTML(c,name){
  const pw=['<i>x</i><sup>3</sup>','<i>x</i><sup>2</sup>','<i>x</i>',''];
  let s='', first=true;
  c.forEach((v,i)=>{ if(!v) return; const a=Math.abs(v);
    const coef=(a===1&&i<3)?'':fmt(a);
    s+= first ? (v<0?'−':'')+coef+pw[i] : (v<0?' − ':' + ')+coef+pw[i]; first=false; });
  return (name?`<i>${name}</i>(<i>x</i>) = `:'')+(s||'0');
}
const val=(c,x)=>((c[0]*x+c[1])*x+c[2])*x+c[3];
const F=(c,x)=>c[0]*x**4/4+c[1]*x**3/3+c[2]*x*x/2+c[3]*x;

const LIM=v=>typeof v==='number'?fmt(v):v;
const INT=(a,b,f,k)=>`<span class="int${k?' k':''}"><span class="s">∫</span><span class="lm"><span>${LIM(b)}</span><span>${LIM(a)}</span></span><span>${f}&nbsp;d<i>x</i></span></span>`;
const WEG={
 dex:'<span class="taste">MENU</span> <span class="taste w">1</span> ▸ <span class="taste">∫▢</span> ▸ Funktion ▸ <span class="taste">▶</span> untere Grenze ▸ <span class="taste">▶</span> obere Grenze ▸ <span class="taste sh">SHIFT</span> <span class="taste w">=</span> (≈) · Vorzeichen mit <span class="taste">(−)</span>, <i>x</i>³ mit <span class="taste sh">SHIFT</span> <span class="taste"><i>x</i>²</span>.',
 cw:'<span class="taste">CATALOG</span> ▸ Funktionsanalyse ▸ Integration(∫) ▸ Funktion ▸ <span class="taste">▼</span> untere Grenze ▸ <span class="taste">▲</span> obere Grenze ▸ <span class="taste sh">SHIFT</span> <span class="taste">EXE</span> (≈) · Vorzeichen mit <span class="taste sh">SHIFT</span> <span class="taste">−</span>.'
}[MODEL];
const NEG=MODEL==='dex'?'(−)':'SHIFT −';

// ---------- Modus 1: Integral berechnen ----------
function genInt(){
  let c,a,b,v;
  for(let n=0;n<300;n++){
    const kub=Math.random()<0.35;
    c=[kub?pick([0.5,-0.5,1,-1,0.25]):0, pick([0.5,-0.5,1,-1,1.5,-1.5,2,-2,0.3,-0.3,3]), pick([0,1,-1,2,-2,3,-3,4,-4,0.5]), pick([0,1,2,3,4,5,-1,-2,-3,6])];
    a=pick([-2,-1,0,0,1,1,2]); b=a+pick([1,2,2,3,3,4]);
    v=integ(c,a,b);
    if(Math.abs(v)>0.05 && Math.abs(v)<150) break;
  }

    show:INT(a,b,'('+termHTML(c)+')'),
    round:'<b>Wichtig:</b> Ergebnis auf <b>2 Stellen nach dem Komma</b> runden, z.&nbsp;B. <b>6,33</b> oder <b>−4,00</b>.',
    zeilen:[{id:'i0', lab:'Ergebnis', vor:INT(a,b,'('+termHTML(c)+')',1)+' =', soll:v, swap:-v}], c, a, b};
}
const MODES={int:{name:"Integral berechnen",gen:genInt}};
const ORDER=["int"];
let mode=ORDER[0], A=null, stat={a:0,r:0};
const $=id=>root.getElementById(id);
function neu(){
  A=MODES[mode].gen();
  $('tabs').style.display=ORDER.length>1?'flex':'none';
  $('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  $('h').textContent="Aufgabe: "+A.h; $('auftrag').innerHTML=A.auftrag; $('term').innerHTML=A.show; $('weg').innerHTML=WEG;

function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }

 }

const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };

  const n=M.length, A=M.map(r=>r.slice()); let row=0;
  for(let col=0;col<n;col++){
    let p=-1; for(let i=row;i<n;i++) if(A[i][col].p!==0){ p=i; break; }
    if(p<0) continue;
    [A[row],A[p]]=[A[p],A[row]];

    for(let j=col;j<=n;j++) A[row][j]=divR(A[row][j],pv);

    row++;

}

    const t=T[i];
    if(t===undefined) throw 'syntax';
    if(/^[0-9,]$/.test(t)){ let n=''; while(i<T.length&&/^[0-9,]$/.test(T[i])) n+=T[i++]; return {s:numR(n)}; }
    if('ABCD'.includes(t)&&t.length===1){ i++; if(!S.M[t]) throw 'math'; return {m:S.M[t]}; }
    if(t==='Ans'){ i++; if(!S.Ans) throw 'math'; return {m:S.Ans}; }
    if(t==='('||t==='det'||t==='trn'){ i++; const v=expr(); if(peek()===')') i++; else if(i<T.length) throw 'syntax';
      if(t==='det'){ if(!v.m) throw 'math'; return {s:mDet(v.m)}; }
      if(t==='trn'){ if(!v.m) throw 'math'; return {m:mTrn(v.m)}; }
      return v; }
    throw 'syntax';
  }
  function post(){ let v=prim(); while(['sq','cube','inv'].includes(peek())){ const t=T[i++];
      if(t==='inv') v=vInv(v); else { const w=vMul(v,v); v=t==='sq'?w:vMul(w,v); } } return v; }
  function fac(){ if(peek()==='neg'){ i++; return vMul({s:R(-1)},fac()); } return post(); }
  function term(){ let v=fac(); while(peek()==='*'||peek()==='/'){ const o=T[i++]; const w=fac(); v=o==='*'?vMul(v,w):vDiv(v,w); } return v; }
  function expr(){ let v=term(); while(peek()==='+'||peek()==='-'){ const o=T[i++]; v=vAdd(v,term(),o==='-'?-1:1); } return v; }
  const v=expr(); if(i<T.length) throw 'syntax'; return v;
}

function fresh(pre){

    line:[], out:null, err:null, v:'A', nr:2, nc:2, r:0, c:0, inp:[], page:0, pur:'def', lvl:0, back:'calc'};

function openEd(S,v){ S.v=v; S.mode='edit'; S.r=0; S.c=0; S.inp=[]; }
function edKey(S,k){
  const m=S.M[S.v], R_=m.length, C_=m[0].length;
  if(k==='exe'){ if(S.inp.length){ m[S.r][S.c]=koefR(S.inp); S.inp=[]; if(S.c<C_-1) S.c++; else if(S.r<R_-1){ S.r++; S.c=0; } } return; }
  if(k==='del'){ S.inp.pop(); return; }
  if(k==='left'){ S.inp=[]; if(S.c>0) S.c--; return; }
  if(k==='right'){ S.inp=[]; if(S.c<C_-1) S.c++; return; }
  if(k==='up'){ S.inp=[]; if(S.r>0) S.r--; return; }
  if(k==='down'){ S.inp=[]; if(S.r<R_-1) S.r++; return; }
  if(/^[0-9,]$/.test(k)||k==='neg') S.inp.push(k);
}
function pushTok(S,t){ if(S.out!==null){ S.line=[]; S.out=null; } S.line.push(t); S.mode='calc'; }
function calcKey(S,k){
  if(k==='ac'){ S.line=[]; S.out=null; return true; }
  if(k==='del'){ if(S.out===null) S.line.pop(); return true; }
  if(k==='exe'){
    if(!S.line.length) return true;
    try{ const v=evalTok(S.line,S);
      if(v.m){ S.Ans=v.m; S.mode='res'; S.out=null; } else { S.out=fmtR(v.s); }
    }catch(e){ S.err=(e==='dim'?'dim':e==='syntax'?'syn':'math'); S.mode='err'; }
    return true;
  }
  if(/^[0-9,]$/.test(k)||['+','-','*','/','(',')','neg','sq','cube','inv'].includes(k)){ pushTok(S,k); return true; }
  return false;
}
function resKey(S,k){
  if(['+','-','*','/'].includes(k)){ S.mode='calc'; S.line=['Ans',k]; S.out=null; return; }
  if(k==='ac'||k==='back'){ S.mode='calc'; S.line=[]; S.out=null; }
}
function errKey(S,k){ if(k==='ac'||k==='back'||k==='left'||k==='right'){ S.mode='calc'; S.line=[]; S.out=null; S.err=null; } }
