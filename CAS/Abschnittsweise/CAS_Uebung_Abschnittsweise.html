<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Abschnittsweise definierte Funktionen</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.term{ font-family:Cambria,Georgia,serif; font-size:21px; margin:4px 0 8px; display:flex; justify-content:center; }
.pwt{ display:inline-flex; align-items:center; }
.pwt .br{ font-size:2.3em; line-height:1; font-weight:200; margin:0 3px 0 5px; transform:scaleY(1.05); }
.pwt .br.b3{ font-size:3.3em; transform:scaleY(1.1); }
.pwt table{ border-collapse:collapse; font-size:.88em; }
.pwt td{ padding:0 4px; white-space:nowrap; line-height:1.35; }
.pwt td.tf{ padding-right:14px; }
.pwt td.w{ color:var(--mute); font-size:.85em; padding-right:3px; }
.fen{ text-align:center; font-family:Cambria,Georgia,serif; font-size:15.5px; color:var(--mute); margin:-2px 0 6px; }
.plot svg{ width:100%; height:auto; display:block; max-width:640px; margin:0 auto; }
.plot .gl{ stroke:#e1e4e9; stroke-width:1; } .plot .ax{ stroke:#222; stroke-width:1.4; } .plot .ah{ fill:#222; }
.plot .al{ font:italic 15px Cambria,Georgia,serif; } .plot .tl{ font:11px system-ui,Arial,sans-serif; fill:#555; }
.legende{ text-align:center; font-size:13.5px; color:var(--mute); margin-top:4px; }
#felder{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ #felder{ grid-template-columns:1fr; } }
.f{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:6px 8px; border-radius:8px; border-left:5px solid #1F4E99; }
.f > label{ font-family:Cambria,Georgia,serif; font-size:17px; min-width:70px; }
.f input.ci{ font:inherit; font-size:16px; width:96px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f input.bad{ border-color:var(--no); background:#fff6f5; }
.f .m{ margin-left:auto; font-weight:bold; font-size:18px; text-align:center; min-width:20px; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ flex-basis:100%; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.f.sp{ grid-column:1 / -1; border-left-color:#8E3BA8; }
.f.sp > label{ min-width:150px; font-size:16px; }
.f .kl{ font-size:15px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; margin-right:8px; }
.f .kl input{ width:18px; height:18px; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; color:#222; }

/* linksbündig (Moodle-Frame) */
.top .in, body > main, body > .tabs, .tabs#tabs, body > .wrap{ margin-left:0 !important; margin-right:auto !important; }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[R(0,a.length-1)];
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const deN=v=>{ let t=(Math.round(v*1e6)/1e6).toString(); return t.replace('-','−').replace('.',','); };
const de2=v=>{ const x=r2(v); return (Number.isInteger(x)?String(x):x.toFixed(2)).replace('-','−').replace('.',','); };
const ev=(P,x)=>P.reduce((s,c)=>s*x+c,0);
function polyHTML(P){
  const n=P.length-1; let h='', first=true;
  P.forEach((c,i)=>{ const e=n-i; if(c===0) return;
    const s=c<0?'−':(first?'':'+'), mm=deN(Math.abs(c)), co=(mm==='1'&&e>0)?'':mm;
    const xx=e===0?'':e===1?'<i>x</i>':`<i>x</i><sup>${e}</sup>`;
    h+=(first?s:` ${s} `)+co+xx; first=false; });
  return first?'0':h;
}
function casPoly(P){ const n=P.length-1; let t=''; P.forEach((c,i)=>{ const e=n-i; if(c===0) return;
  t+=(c<0?'-':(t?'+':''))+(Math.abs(c)===1&&e>0?'':String(Math.abs(c)))+(e===0?'':e===1?'x':'x^'+e); }); return t||'0'; }
const OPS={'<':'&lt;','<=':'≤','>':'&gt;','>=':'≥'};
const OPC={'<':'<','<=':'≤','>':'>','>=':'≥'};

// ---------- zufällige Abschnitte ----------
function piece(kind,b){
  if(kind==='c') return [R(-3,5)];
  if(kind==='l') return [pickR([-2,-1,-0.5,0.5,1,2]), R(-4,5)];
  const a=pickR([-1,-0.5,0.5,1]), h=R(b-3,b+3), k=R(-3,4);
  return [a,-2*a*h,a*h*h+k];
}
function fix(P,x,y){ const Q=P.slice(); Q[Q.length-1]+=y-ev(P,x); Q[Q.length-1]=Math.round(Q[Q.length-1]*100)/100; return Q; }
// Funktionsobjekt: B = Grenzen, P = Terme, L[i] = true, wenn die Grenze B[i] zum linken Teil gehört (≤)
function val(F,x){ for(let i=0;i<F.B.length;i++){ const b=F.B[i]; if(x<b||(x===b&&F.L[i])) return ev(F.P[i],x); } return ev(F.P[F.P.length-1],x); }
function lim(F,i,side){ return ev(F.P[side==='l'?i:i+1],F.B[i]); }
function condHTML(F,i){
  const X='<i>x</i>', n=F.P.length;
  const lo=i>0?`${deN(F.B[i-1])} ${F.L[i-1]?OPS['<']:'≤'} ${X}`:'', hi=i<n-1?`${F.L[i]?'≤':OPS['<']} ${deN(F.B[i])}`:'';
  if(i===0) return `${X} ${hi}`;
  if(i===n-1) return `${X} ${F.L[i-1]?OPS['>']:'≥'} ${deN(F.B[i-1])}`;
  return `${lo} ${hi}`;
}
function condCAS(F,i){
  const n=F.P.length;
  if(i===0) return `x${F.L[0]?'≤':'<'}${deN(F.B[0])}`;
  if(i===n-1) return `x${F.L[i-1]?'>':'≥'}${deN(F.B[i-1])}`;
  return `${deN(F.B[i-1])}${F.L[i-1]?'<':'≤'}x${F.L[i]?'≤':'<'}${deN(F.B[i])}`;
}
function termHTML(F){
  const rows=F.P.map((P,i)=>`<tr><td class="tf">${polyHTML(P)}</td><td class="w">für</td><td>${condHTML(F,i)}</td></tr>`).join('');
  return `<i>f</i>(<i>x</i>) = <span class="pwt"><span class="br ${F.P.length>2?'b3':''}">{</span><table>${rows}</table></span>`;
}
function make(n){
  for(let tries=0;tries<500;tries++){
    const B= n===2 ? [R(-2,3)] : (()=>{ const a=R(-3,0); return [a,a+R(2,4)]; })();
    const L=B.map(()=>Math.random()<0.5);
    const kinds= n===2 ? [pickR(['l','l','q','c']),pickR(['l','q','l'])] : [pickR(['l','c']),pickR(['c','l']),pickR(['l','c','l'])];
    if(kinds.every(k=>k==='c')) continue;
    const P=kinds.map((k,i)=>piece(k,B[Math.min(i,B.length-1)]));
    const J=B.map(()=>Math.random()<0.5);
    for(let i=0;i<B.length;i++){ if(!J[i]) P[i+1]=fix(P[i+1],B[i],ev(P[i],B[i])); }
    const F={B,L,P,J};
    let ok=true;
    for(let i=0;i<B.length;i++){ const d=Math.abs(lim(F,i,'l')-lim(F,i,'r')); if(J[i]&&d<1) ok=false; if(!J[i]&&d>1e-9) ok=false; }
    if(n===3&&P[1].length===1&&J.every(x=>!x)&&Math.random()<0.3) ok=false;
    const x0=B[0]-4, x1=B[B.length-1]+4; let ys=[];
    for(let x=x0;x<=x1;x+=0.25) ys.push(val(F,x));
    if(ys.some(y=>Math.abs(y)>9)) ok=false;
    if(P.some(Q=>Q.some(c=>Math.abs(c)>20))) ok=false;
    if(!ok) continue;
    // abgefragte Stellen: je ein Wert pro Abschnitt und alle Grenzen
    const b0=B[0], bl=B[B.length-1];
    const xs= n===2 ? [b0-R(2,3), b0, b0+pickR([0.5,1.5,2.5]), b0+R(3,4)] : [b0-R(1,3), b0, Math.round((b0+bl))/2, bl, bl+R(1,3)];
    xs.sort((a,b)=>a-b);
    const u=[...new Set(xs)];
    const w={x0:Math.floor(x0),x1:Math.ceil(x1),y0:Math.min(-1,Math.floor(Math.min(...ys))-1),y1:Math.max(1,Math.ceil(Math.max(...ys))+1)};
    return {F,xs:u,w};
  }
}

// ---------- Graph (erscheint mit der Lösung) ----------
function plot(A){
  const F=A.F, w=A.w, Wd=640, H=Math.min(460,Math.max(300,(w.y1-w.y0)*30)), pl=30, pr=22, pt=16, pb=24;
  const X=x=>pl+(x-w.x0)*(Wd-pl-pr)/(w.x1-w.x0), Y=y=>pt+(w.y1-y)*(H-pt-pb)/(w.y1-w.y0);
  let o=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Graph">`;
  for(let x=Math.ceil(w.x0);x<=w.x1;x++) o+=`<line x1="${X(x)}" y1="${Y(w.y0)}" x2="${X(x)}" y2="${Y(w.y1)}" class="gl"/>`;
  for(let y=Math.ceil(w.y0);y<=w.y1;y++) o+=`<line x1="${X(w.x0)}" y1="${Y(y)}" x2="${X(w.x1)}" y2="${Y(y)}" class="gl"/>`;
  o+=`<line x1="${X(w.x0)}" y1="${Y(0)}" x2="${X(w.x1)+12}" y2="${Y(0)}" class="ax"/><path d="M${X(w.x1)+16} ${Y(0)} l-8 -4 v8z" class="ah"/>`;
  o+=`<line x1="${X(0)}" y1="${Y(w.y0)}" x2="${X(0)}" y2="${Y(w.y1)-10}" class="ax"/><path d="M${X(0)} ${Y(w.y1)-14} l-4 8 h8z" class="ah"/>`;
  o+=`<text x="${X(w.x1)+8}" y="${Y(0)+16}" class="al">x</text><text x="${X(0)+7}" y="${Y(w.y1)-4}" class="al">y</text>`;
  for(let x=Math.ceil(w.x0);x<=w.x1;x++) if(x) o+=`<text x="${X(x)}" y="${Y(0)+14}" class="tl" text-anchor="middle">${String(x).replace('-','−')}</text>`;
  for(let y=Math.ceil(w.y0);y<=w.y1;y++) if(y) o+=`<text x="${X(0)-5}" y="${Y(y)+4}" class="tl" text-anchor="end">${String(y).replace('-','−')}</text>`;
  const cols=['#1F4E99','#2E7D32','#C25E00'];
  F.P.forEach((P,i)=>{ const a=i===0?w.x0:F.B[i-1], b=i===F.P.length-1?w.x1:F.B[i]; let d='';
    for(let k=0;k<=300;k++){ const x=a+(b-a)*k/300; d+=(k?'L':'M')+X(x).toFixed(1)+' '+Y(ev(P,x)).toFixed(1)+' '; }
    o+=`<path d="${d}" fill="none" stroke="${cols[i]}" stroke-width="2.6"/>`; });
  F.B.forEach((b,i)=>{
    const yl=lim(F,i,'l'), yr=lim(F,i,'r');
    if(Math.abs(yl-yr)<1e-9){ o+=`<circle cx="${X(b)}" cy="${Y(yl)}" r="5" fill="#1d1d1f"/>`; return; }
    o+=`<circle cx="${X(b)}" cy="${Y(yl)}" r="5.5" fill="${F.L[i]?cols[i]:'#fff'}" stroke="${cols[i]}" stroke-width="2.4"/>`;
    o+=`<circle cx="${X(b)}" cy="${Y(yr)}" r="5.5" fill="${F.L[i]?'#fff':cols[i+1]}" stroke="${cols[i+1]}" stroke-width="2.4"/>`;
  });
  return o+'</svg><div class="legende">● gehört zum Graphen &nbsp;·&nbsp; ○ gehört nicht dazu</div>';
}

// ---------- Aufgaben ----------
const MODES={zwei:{name:"Zwei Abschnitte",n:2}, drei:{name:"Drei Abschnitte",n:3}};
const ORDER=["zwei","drei"];
let mode=ORDER[0], A=null, stat={a:0,r:0};
function inp(id){ return `<input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" class="ci">`; }
function neu(){
  const n=MODES[mode].n; A=make(n);
  const F=A.F;
  A.felder=A.xs.map((x,j)=>({k:'v'+j, lab:`<i>f</i>(${deN(x)}) =`, soll:val(F,x)})).concat(F.B.map((b,i)=>({k:'s'+i, sp:true, lab:`Bei <i>x</i> = ${deN(b)}:`, soll:F.J[i]})));
  document.getElementById('tabs').innerHTML=ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join('');
  document.getElementById('h').textContent="Aufgabe: "+MODES[mode].name;
  document.getElementById('auftrag').innerHTML="Geben Sie die Funktion im CAS ein und zeichnen Sie den Graphen. Berechnen Sie die Funktionswerte. Entscheiden Sie an jeder Grenze: Macht der Graph einen Sprung?";
  document.getElementById('term').innerHTML=termHTML(F);
  document.getElementById('fen').innerHTML=`Fenster: ${deN(A.w.x0)} ≤ <i>x</i> ≤ ${deN(A.w.x1)} und ${deN(A.w.y0)} ≤ <i>y</i> ≤ ${deN(A.w.y1)}`;
  document.getElementById('plot').innerHTML='';
  document.getElementById('hinweis').innerHTML='Tipp: <b>⊞</b> ▸ '+(n===2?'<b>Stückweise (2 Teile)</b>':'<b>Stückweise (n Teile)</b>, Anzahl <b>3</b>')+' · Felder: '+F.P.map((P,i)=>`<span class="liste">${casPoly(P)}</span> , <span class="liste">${condCAS(F,i)}</span>`).join(' · ')+' · Zeichen &lt; ≤ &gt; ≥ mit <b>ctrl =</b> · Funktionswerte auf einer Calculator-Seite mit <span class="liste">f1(…)</span>.';
  document.getElementById('felder').innerHTML=A.felder.map(f=> f.sp ?
    `<div class="f sp" id="f_${f.k}"><label>${f.lab}</label><label class="kl"><input type="radio" name="r_${f.k}" value="1"> Sprung</label><label class="kl"><input type="radio" name="r_${f.k}" value="0"> kein Sprung</label><span class="m"></span><div class="msg"></div></div>` :
    `<div class="f" id="f_${f.k}"><label>${f.lab}</label>${inp('i_'+f.k)}<span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.f input.ci').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.').replace('−','-'); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0105;
function pruefen(){
  let ok=0;
  A.felder.forEach(f=>{
    const el=document.getElementById('f_'+f.k), m=el.querySelector('.m'), msg=el.querySelector('.msg');
    el.classList.remove('ok','no','fmt','show'); m.textContent=''; msg.textContent='';
    let st=null, t='';
    if(f.sp){
      const r=el.querySelector('input[type=radio]:checked'); if(!r) return;
      if((r.value==='1')===f.soll) st='ok'; else { st='no'; t='Vergleichen Sie die Werte links und rechts der Grenze. Sind sie gleich, gibt es keinen Sprung.'; }
    } else {
      const i=document.getElementById('i_'+f.k), raw=i.value; i.classList.remove('bad');
      if(!raw.trim()) return;
      const p=parse(raw);
      if(!p){ st='fmt'; t='Bitte nur Zahlen eintragen, z. B. −1,5.'; }
      else if(near(p.v,f.soll)){ if(p.dec>2){ st='fmt'; t='Der Wert stimmt – bitte auf 2 Nachkommastellen runden.'; } else st='ok'; }
      else { st='no'; i.classList.add('bad'); t='Das stimmt noch nicht. Welcher Abschnitt gilt für diesen x-Wert? An einer Grenze entscheidet das Zeichen (≤ oder <).'; }
    }
    el.classList.add(st); m.textContent= st==='ok'?'✓':st==='fmt'?'!':'✗'; msg.textContent=t; if(st==='ok') ok++;
  });
  const tot=A.felder.length; stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  const F=A.F;
  A.felder.forEach(f=>{
    const el=document.getElementById('f_'+f.k), msg=el.querySelector('.msg');
    if(el.classList.contains('ok')) return;
    el.classList.add('show');
    if(f.sp){ const i=+f.k.slice(1); msg.innerHTML=`Lösung: ${f.soll?'Sprung':'kein Sprung'} – links ${de2(lim(F,i,'l'))}, rechts ${de2(lim(F,i,'r'))}`; }
    else msg.innerHTML='Lösung: '+de2(f.soll);
  });
  document.getElementById('plot').innerHTML=plot(A);
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const hh=(location.hash||'').slice(1); if(MODES[hh]) mode=hh;
neu();
</script>

</body></html>
