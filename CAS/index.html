<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Führerschein</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ab:#2E7D32; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{ background:radial-gradient(circle at 50% 30%,#ffffff,var(--bg) 70%); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; overflow-x:hidden; }
.stage{ position:relative; max-width:1100px; min-height:100vh; margin:0 auto; padding:24px 16px; display:flex; align-items:center; gap:56px; }
.logo{ position:absolute; right:20px; top:18px; height:28px; opacity:.9; }
.calc{ flex:0 0 270px; width:270px; filter:drop-shadow(0 14px 22px rgba(0,0,0,.22)); animation:in .7s cubic-bezier(.6,.05,.25,1) both; }
.calc svg{ display:block; width:100%; height:auto; }
@keyframes in{ from{ opacity:0; transform:translateX(-40px); } }
.toc{ flex:1 1 auto; max-width:760px; display:flex; flex-direction:column; gap:8px; animation:in .6s .25s cubic-bezier(.6,.05,.25,1) both; }
h1{ font-size:24px; color:var(--lf); margin:0 0 2px 4px; }
.model{ font:bold 13px system-ui,Arial,sans-serif; color:var(--mute); letter-spacing:.5px; margin:0 0 8px 4px; }
.topic{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; row-gap:8px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px 8px 12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.th{ display:flex; align-items:center; gap:10px; flex:1 1 230px; min-width:0; }
.num{ flex:0 0 28px; height:28px; border-radius:50%; background:var(--lf); color:#fff; font:bold 14px Arial,sans-serif; display:flex; align-items:center; justify-content:center; }
.th b{ font-size:16px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; hyphens:auto; }
.acts{ display:flex; gap:6px; margin-left:auto; }
.act{ width:122px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 11px; text-decoration:none; color:#fff; transition:transform .15s, box-shadow .15s; }
.act:hover,.act:focus-visible{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.18); outline:none; }
.act svg{ width:18px; height:18px; }
.act span{ font:600 13px system-ui,Arial,sans-serif; }
.act.tour{ background:linear-gradient(#2a62c2,var(--lf)); }
.act.pdf{ background:linear-gradient(#e0504a,#b8322d); }
.act.ueb{ background:linear-gradient(#3aa356,var(--ab)); }
.act.gap{ visibility:hidden; }
@media (max-width:820px){
  .stage{ flex-direction:column; gap:24px; padding-top:64px; justify-content:flex-start; }
  .calc{ flex:none; width:170px; }
  .toc{ width:100%; }
  .th{ flex:1 1 100%; }
  .acts{ width:100%; margin-left:0; }
  .act{ flex:1 1 0; min-width:0; width:auto; padding:0 4px; gap:4px; }
}
@media (max-width:380px){ .act svg{ display:none; } .act span{ font-size:12.5px; } }
</style></head><body>

// ---------- TI-Nspire CX CAS als SVG ----------
function svgNspire(){
  const W=330,H=640; let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="30" fill="#E8562A"/><rect x="13" y="0" width="${W-26}" height="${H}" rx="22" fill="#2a2a2f"/>`;
  s+=`<rect x="21" y="8" width="${W-42}" height="352" rx="18" fill="#1d1d21"/>`;
  s+=`<text x="${W/2}" y="29" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing=".5" fill="#E8562A">TI-Nspire CX <tspan fill="#fff">CAS</tspan></text>`;
  // Bildschirm: Startseite
  s+=`<rect x="31" y="38" width="268" height="214" rx="3" fill="#0e0e10"/><rect x="35" y="42" width="260" height="206" fill="#2f3542"/>`;
  s+=`<rect x="35" y="42" width="260" height="18" fill="#1e2330"/><text x="42" y="55" font-size="10" fill="#e6eaf2">Startseite</text><rect x="268" y="47" width="18" height="8" rx="1.5" fill="none" stroke="#9fd18b" stroke-width="1.2"/><rect x="270" y="49" width="12" height="4" fill="#9fd18b"/>`;
  const L=[["A","Berechnen","#4b8be0"],["B","Graphs","#e05a4b"],["C","Geometry","#5bb562"],["D","Lists & Spreadsheet","#e0a64b"],["E","Data & Statistics","#9a6be0"],["F","Notes","#4bc0c8"],["G","Vernier DataQuest","#c86a4b"]];
  L.forEach(([k,t,c],i)=>{ const y=78+i*21, sel=i===0;
    if(sel) s+=`<rect x="40" y="${y-12}" width="140" height="18" rx="3" fill="#F2B705"/>`;
    s+=`<rect x="45" y="${y-9}" width="12" height="12" rx="2" fill="${c}"/><text x="62" y="${y+1}" font-size="10" fill="${sel?'#1d1d1f':'#e6eaf2'}"><tspan font-weight="bold">${k}</tspan> ${t}</text>`; });
  s+=`<path d="M186 66v170" stroke="#4a5163" stroke-width="1"/>`;
  ['1 Neues Dokument','2 Mein Dokument','3 Durchsuchen','4 Zuletzt','5 Einstellungen','6 Hilfe'].forEach((t,i)=>s+=`<text x="194" y="${79+i*21}" font-size="9" fill="#b4bccc">${t}</text>`);
  // Steuerbereich
  const key=(x,y,w,h,t,f='#e9e9ec',c='#1d1d1f',fs=11,r=9)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/><text x="${x+w/2}" y="${y+h/2+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="${c}">${t}</text>`;
  [["esc",266],["✎",297],["tab",328]].forEach(([t,y])=>s+=key(31,y,52,24,t,'#2c2c31','#fff',11,12).replace('<rect','<rect stroke="#5a5a60" stroke-width="1"'));
  [["⌂ on",266],["doc ▸",297],["menu",328]].forEach(([t,y])=>s+=key(247,y,52,24,t,'#2c2c31','#fff',11,12).replace('<rect','<rect stroke="#5a5a60" stroke-width="1"'));
  s+=`<rect x="109" y="266" width="112" height="84" rx="16" fill="#47474d"/><rect x="147" y="290" width="36" height="36" rx="8" fill="#5a5a60"/><circle cx="165" cy="308" r="2.5" fill="#ccc"/>`;
  s+=`<g fill="#aaa" font-size="11" text-anchor="middle"><text x="165" y="282">▲</text><text x="165" y="345">▼</text><text x="121" y="312">◀</text><text x="209" y="312">▶</text></g>`;
  // Tastenfeld
  s+=key(25,371,64,24,"ctrl",'#D93A2B','#fff',12,7)+key(97,371,64,24,"⇧ shift",'#47474d','#fff',12,7)+key(169,371,64,24,"var",'#47474d','#fff',12,7)+key(241,371,64,24,"del",'#47474d','#fff',12,7);
  const rows=[["=","trig","7","8","9","⊞","📖"],["^","x²","4","5","6","×","÷"],["eˣ","10ˣ","1","2","3","+","−"],["(",")","0",".","(−)","enter"]];
  rows.forEach((r,ri)=>{ const y=404+ri*30; let x=25;
    r.forEach((t,i)=>{ const num=/^[0-9.]$/.test(t)||(ri===3&&i===2); const w=t==="enter"?76:35;
      s+=key(x,y,w,23,t,num?'#c8c8cc':'#47474d',num?'#1d1d1f':'#fff',t.length>3?10:12,6); x+=w+6; }); });
  const al=[["EE","A","B","C","D","E","F","G","?!"],["π","H","I","J","K","L","M","N","⚑"],[",","O","P","Q","R","S","T","U","↵"],["","V","W","X","Y","Z","␣"]];
  al.forEach((r,ri)=>{ const y=527+ri*25; let x=25;
    r.forEach((t,i)=>{ const w=t==="␣"?90:27; if(t) s+=key(x,y,w,19,t,'#47474d','#fff',10,6); x+=w+4.4; }); });
  return s+'</svg>';
}
