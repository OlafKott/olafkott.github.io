<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit-Aufgabe zum Stundenbeginn – Vertiefung der Differentialrechnung</title>
<style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --mut:#6B6B6B; --line:#d9d2c5; --gruen:#1B5E20;
       --dred:#B00020; --creme:#F6F1EA; --blau:#E9F2FB; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Calibri,Candara,Segoe UI,Arial,sans-serif; color:var(--ink); background:#eef0f2;
      line-height:1.45; font-size:17px; }
.wrap{ max-width:1400px; margin:0 auto; padding:14px; }

/* Kopfzeile */
.kopf{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
       background:#fff; border-bottom:3px solid var(--rwb); border-radius:8px 8px 0 0; padding:12px 18px; }
.kopf h1{ font-size:26px; margin:0 0 2px; color:var(--rwb); }
.kopf .sub{ font-size:14px; color:#555; }
.kopf img{ height:52px; width:auto; }

.layout{ display:flex; gap:14px; align-items:flex-start; margin-top:14px; }

/* Aufgabenliste */
.liste{ flex:0 0 300px; background:#fff; border-radius:8px; padding:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.liste h2{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut);
           margin:10px 6px 6px; }
.liste h2:first-child{ margin-top:2px; }
.item{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
       border:1px solid transparent; border-radius:6px; padding:7px 9px; background:none;
       font-family:inherit; font-size:15.5px; color:var(--ink); }
.item:hover{ background:#f4f6f8; }
.item.aktiv{ background:#FBEEF0; border-color:var(--rwb); font-weight:bold; }
.item .n{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:#eceff2; color:#555;
          font-size:12.5px; font-weight:bold; text-align:center; line-height:24px; }
.item.aktiv .n{ background:var(--rwb); color:#fff; }
.item.fertig .n{ background:#2E7D32; color:#fff; }
.item .tx{ flex:1; min-width:0; }
.listfuss{ font-size:12.5px; color:var(--mut); padding:8px 8px 2px; border-top:1px solid #eceff2; margin-top:8px; }
.listfuss button{ background:none; border:none; color:var(--rwb); cursor:pointer; font:inherit;
                  font-size:12.5px; padding:0; text-decoration:underline; }

/* Aufgabenkarte */
.buehne{ flex:1; min-width:0; background:#fff; border-radius:8px; padding:20px 24px 18px;
         box-shadow:0 1px 4px rgba(0,0,0,.08); font-size:calc(17px * var(--zoom,1)); }
.akopf{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        border-bottom:2px solid var(--rwb); padding-bottom:8px; margin-bottom:14px; }
.akopf .nr{ background:var(--rwb); color:#fff; font-weight:bold; font-size:15px; width:30px; height:30px;
            border-radius:50%; text-align:center; line-height:30px; }
.akopf .thema{ font-size:19px; font-weight:bold; letter-spacing:.03em; text-transform:uppercase;
               color:var(--rwb); flex:1; min-width:180px; }
.badge{ font-size:13px; font-weight:bold; border-radius:12px; padding:3px 12px; white-space:nowrap; }
.b-format{ background:var(--creme); color:#5a4a33; border:1px solid var(--line); }
.cas-ohne{ background:#F3F3F3; color:#4a4a4a; border:1px solid #c9c9c9; }
.cas-kontrolle{ background:#FFF4D6; color:#6b4e00; border:1px solid #E3B341; }
.cas-mit{ background:var(--blau); color:#1D70B8; border:1px solid #1D70B8; }

.frage{ font-size:1.35em; margin:0 0 10px; }
.fx{ font-family:Cambria,Georgia,serif; }
.t1{ color:var(--gruen); } .t2{ color:var(--dred); } .t3{ color:#1D70B8; }
.fzeile{ font-family:Cambria,Georgia,serif; font-size:1.55em; margin:12px 0 14px; padding-left:18px; }

.pwwrap{ margin:12px 0 14px; padding-left:18px; white-space:nowrap; }
.pwwrap .fname{ vertical-align:middle; margin-right:6px; font-size:1.5em; }
table.pw{ display:inline-table; border-collapse:collapse; vertical-align:middle; }
table.pw td{ padding:3px 0; vertical-align:middle; white-space:nowrap; }
table.pw.pw3 td.brace{ font-size:4.6em; }
table.pw td.brace{ font:200 3.1em/1 Georgia,serif; color:var(--ink); padding-right:12px; text-align:center; }
table.pw td.term{ font-family:Cambria,Georgia,serif; font-size:1.5em; padding-right:26px; }
table.pw td.cond{ font-size:1.1em; color:#555; }

.lgs{ margin:12px 0 14px; padding-left:18px; font-size:1.4em; font-family:Cambria,Georgia,serif; }
.lgs .rn{ display:inline-block; width:34px; color:#999; font-size:.75em; font-family:Calibri,Arial,sans-serif; }

/* Multiple Choice */
.opts{ display:flex; flex-direction:column; gap:9px; margin:14px 0 4px; }
.opts.grid{ flex-direction:row; flex-wrap:wrap; }
.opt{ display:flex; align-items:center; gap:12px; border:1.5px solid #d7dce2; border-radius:8px;
      padding:11px 16px; cursor:pointer; background:#fff; font:inherit; font-size:1.15em;
      color:var(--ink); text-align:left; }
.opts.grid .opt{ flex:1 1 210px; flex-direction:column; align-items:stretch; }
.opt:hover{ border-color:#b6bec7; }
.opt .lab{ flex:0 0 auto; width:27px; height:27px; border-radius:50%; background:#eceff2; color:#555;
           font-weight:bold; font-size:14px; text-align:center; line-height:27px; }
.opt.markiert{ background:#f2f5f8; border-color:#9aa5b1; }
.opt.richtig{ border-color:#2E7D32; background:#EEF6EE; }
.opt.richtig .lab{ background:#2E7D32; color:#fff; }
.opt .glab{ font-weight:bold; font-size:15px; color:#555; margin-bottom:4px; }

/* Zuordnen */
.zu{ display:flex; gap:22px; flex-wrap:wrap; margin:14px 0 4px; }
.zusp{ flex:1 1 320px; display:flex; flex-direction:column; gap:9px; }
.zuel{ display:flex; align-items:center; gap:12px; border:1.5px solid #d7dce2; border-radius:8px;
       padding:10px 14px; font-size:1.12em; }
.zuel .lab{ flex:0 0 auto; width:27px; height:27px; border-radius:50%; background:var(--rwb); color:#fff;
            font-weight:bold; font-size:14px; text-align:center; line-height:27px; }
.zusp.rechts .zuel .lab{ background:#4a5560; }

/* Grafiken */
.gsvg{ width:100%; max-width:270px; height:auto; background:#fff; border:1px solid #e2e6ea; border-radius:6px; }
.gpaar{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin:10px 0 4px; }
.gbox{ text-align:center; }
.glab{ font-weight:bold; font-size:15px; color:#555; margin-bottom:4px; }
.ghinweis{ font-family:Cambria,Georgia,serif; font-size:1.4em; }
.hinw{ font-size:1.05em; color:var(--mut); margin-top:10px; }

/* Steuerleiste */
.steuer{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
         border-top:1px solid #eceff2; margin-top:18px; padding-top:14px; }
.timer{ display:flex; align-items:center; gap:10px; background:var(--creme); border:1px solid var(--line);
        border-radius:28px; padding:5px 10px 5px 14px; }
.tdisp{ font-size:34px; font-weight:bold; min-width:110px; text-align:center; font-variant-numeric:tabular-nums;
        letter-spacing:.02em; }
.timer.laeuft .tdisp{ color:var(--gruen); }
.timer.aus .tdisp{ color:var(--rwb); font-size:26px; }
button.b{ font:inherit; font-size:16px; cursor:pointer; border-radius:20px; border:1.5px solid var(--rwb);
          background:#fff; color:var(--rwb); padding:8px 18px; }
button.b:hover{ background:var(--rwb); color:#fff; }
button.b.stark{ background:var(--rwb); color:#fff; }
button.b.stark:hover{ background:#a50d26; border-color:#a50d26; }
button.klein{ font-size:14px; padding:6px 12px; border-color:#c3c9d0; color:#4a5560; }
button.klein:hover{ background:#4a5560; border-color:#4a5560; }
.rechtsraum{ margin-left:auto; display:flex; align-items:center; gap:8px; }

.loesung{ display:none; border-left:5px solid #2E7D32; background:#EEF6EE; border-radius:0 8px 8px 0;
          padding:14px 18px; margin-top:16px; font-size:1.12em; }
.loesung.zeigen{ display:block; }
.loesung .ltag{ display:block; font-size:13px; font-weight:bold; letter-spacing:.08em; text-transform:uppercase;
                color:#2E7D32; margin-bottom:6px; }

.fuss{ font-size:12.5px; color:var(--mut); text-align:center; margin:14px 0 4px; }
.tasten{ font-size:12.5px; color:var(--mut); margin-top:6px; }
kbd{ background:#fff; border:1px solid #c9ced4; border-bottom-width:2px; border-radius:4px;
     padding:1px 6px; font-family:inherit; font-size:12px; }

@media (max-width:900px){
  .layout{ flex-direction:column; }
  .liste{ flex:1 1 auto; width:100%; }
  .buehne{ width:100%; }
}
@media print{
  .liste,.steuer,.fuss,.tasten{ display:none !important; }
  body{ background:#fff; }
  .buehne{ box-shadow:none; }
}
</style></head><body>

<script>
var AUFGABEN = [{"gruppe": "Stetigkeit &amp; Differenzierbarkeit", "thema": "Stetigkeit prüfen", "format": "rechnen", "cas": "ohne", "frage": "Untersuche, ob <span class=\"fx\">f</span> an der Nahtstelle <span class=\"fx\">x = 2</span> stetig ist.", "body": "<div class=\"pwwrap\"><span class=\"fx fname\">f(x) =</span><table class=\"pw\"><tr><td class=\"brace\" rowspan=\"2\">{</td><td class=\"term t1\">x&sup2; &minus; 1</td><td class=\"cond\">für x &le; 2</td></tr><tr><td class=\"term t2\">2x &minus; 1</td><td class=\"cond\">für x &gt; 2</td></tr></table></div>", "loesung": "<b>1.</b> Linker Term: <span class=\"fx t1\">f<sub>1</sub>(2) = 2&sup2; &minus; 1 = 3</span><br><b>2.</b> Rechter Term: <span class=\"fx t2\">f<sub>2</sub>(2) = 2&middot;2 &minus; 1 = 3</span><br><b>3.</b> Beide Werte stimmen überein &rArr; <b>f ist an der Stelle x = 2 stetig.</b>", "nr": 1}, {"gruppe": "Stetigkeit &amp; Differenzierbarkeit", "thema": "Stetigkeit &middot; Parameter", "format": "mc", "cas": "ohne", "frage": "Die Funktion hat <b>zwei</b> Nahtstellen. Für welchen Wert von <span class=\"fx\">a</span> ist <span class=\"fx\">f</span> überall stetig?", "body": "<div class=\"pwwrap\"><span class=\"fx fname\">f(x) =</span><table class=\"pw pw3\"><tr><td class=\"brace\" rowspan=\"3\">{</td><td class=\"term t1\">x&sup2;</td><td class=\"cond\">für x &lt; 2</td></tr><tr><td class=\"term t2\">a&middot;x &minus; 2</td><td class=\"cond\">für 2 &le; x &le; 5</td></tr><tr><td class=\"term t3\">13</td><td class=\"cond\">für x &gt; 5</td></tr></table></div>", "optionen": ["<span class=\"fx\">a = 2</span>", "<span class=\"fx\">a = 3</span>", "<span class=\"fx\">a = 4</span>", "<span class=\"fx\">a = 6</span>"], "richtig": 1, "loesung": "<b>Nahtstelle x = 2:</b> <span class=\"fx t1\">f<sub>1</sub>(2) = 4</span>, <span class=\"fx t2\">f<sub>2</sub>(2) = 2a &minus; 2</span> &rArr; <span class=\"fx\">2a &minus; 2 = 4 &rArr; 2a = 6 &rArr; a = 3</span><br><b>Nahtstelle x = 5:</b> <span class=\"fx t2\">f<sub>2</sub>(5) = 5a &minus; 2</span>, <span class=\"fx t3\">f<sub>3</sub>(5) = 13</span> &rArr; <span class=\"fx\">5a &minus; 2 = 13 &rArr; a = 3</span> ✓<br>Beide Nahtstellen liefern denselben Wert &rArr; <b>a = 3</b> (mittlerer Abschnitt: <span class=\"fx t2\">f<sub>2</sub>(x) = 3x &minus; 2</span>).<br><i>Wichtig: Es müssen <b>beide</b> Nahtstellen geprüft werden – nur wenn beide denselben Wert ergeben, ist f überall stetig. Typische Fehler: a = 2 (das &minus;2 vergessen), a = 6 (nicht durch 2 geteilt), a = 4 (den Funktionswert 4 direkt als a genommen).</i>", "nr": 2}, {"gruppe": "Stetigkeit &amp; Differenzierbarkeit", "thema": "Stetigkeit &middot; drei Teilfunktionen", "format": "rechnen", "cas": "mit", "frage": "Die Funktion hat <b>zwei</b> Nahtstellen. Bestimme <span class=\"fx\">a</span> und <span class=\"fx\">b</span> so, dass <span class=\"fx\">f</span> überall stetig ist. Löse das entstehende Gleichungssystem mit dem CAS.", "body": "<div class=\"pwwrap\"><span class=\"fx fname\">f(x) =</span><table class=\"pw pw3\"><tr><td class=\"brace\" rowspan=\"3\">{</td><td class=\"term t1\">x&sup2;</td><td class=\"cond\">für x &lt; 1</td></tr><tr><td class=\"term t2\">a&middot;x + b</td><td class=\"cond\">für 1 &le; x &le; 3</td></tr><tr><td class=\"term t3\">15 &minus; 2x</td><td class=\"cond\">für x &gt; 3</td></tr></table></div>", "loesung": "<b>Nahtstelle x = 1:</b> <span class=\"fx t1\">f<sub>1</sub>(1) = 1</span> und <span class=\"fx t2\">f<sub>2</sub>(1) = a + b</span> &rArr; <span class=\"fx\">a + b = 1</span><br><b>Nahtstelle x = 3:</b> <span class=\"fx t2\">f<sub>2</sub>(3) = 3a + b</span> und <span class=\"fx t3\">f<sub>3</sub>(3) = 15 &minus; 6 = 9</span> &rArr; <span class=\"fx\">3a + b = 9</span><br><b>CAS:</b> <span class=\"fx\">solve(a + b = 1 and 3a + b = 9, {a, b})</span> &rArr; <b><span class=\"fx\">a = 4</span>, <span class=\"fx\">b = &minus;3</span></b><br>Der mittlere Abschnitt lautet also <span class=\"fx t2\">f<sub>2</sub>(x) = 4x &minus; 3</span>.<br><i>Kontrolle: 4&middot;1 &minus; 3 = 1 ✓ &nbsp;und&nbsp; 4&middot;3 &minus; 3 = 9 ✓</i>", "nr": 3}, {"gruppe": "Stetigkeit &amp; Differenzierbarkeit", "thema": "Graphen zuordnen", "format": "zuordnen", "cas": "ohne", "frage": "Ordne jedem Graphen die passende Aussage über die Nahtstelle zu.", "links": [{"lab": "A", "html": "<svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" class=\"gsvg\"><defs><marker id=\"m1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#1d1d1f\"/></marker></defs><line x1=\"26.5\" y1=\"10\" x2=\"26.5\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"67.6\" y1=\"10\" x2=\"67.6\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"108.8\" y1=\"10\" x2=\"108.8\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"150.0\" y1=\"10\" x2=\"150.0\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"191.2\" y1=\"10\" x2=\"191.2\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"232.4\" y1=\"10\" x2=\"232.4\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"273.5\" y1=\"10\" x2=\"273.5\" y2=\"230\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"217.1\" x2=\"290\" y2=\"217.1\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"184.7\" x2=\"290\" y2=\"184.7\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"152.4\" x2=\"290\" y2=\"152.4\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"120.0\" x2=\"290\" y2=\"120.0\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"87.6\" x2=\"290\" y2=\"87.6\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"55.3\" x2=\"290\" y2=\"55.3\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"22.9\" x2=\"290\" y2=\"22.9\" stroke=\"#e4ebf3\"/><line x1=\"10\" y1=\"120.0\" x2=\"292\" y2=\"120.0\" stroke=\"#1d1d1f\" stroke-width=\"1.5\" marker-end=\"url(#m1)\"/><line x1=\"150.0\" y1=\"230\" x2=\"150.0\" y2=\"8\" stroke=\"#1d1d1f\" stroke-width=\"1.5\" marker-end=\"url(#m1)\"/><polyline points=\"42.9,68.2 44.5,69.4 46.0,70.6 47.5,71.8 49.1,73.0 50.6,74.2 52.1,75.4 53.6,76.6 55.2,77.8 56.7,79.1 58.2,80.3 59.8,81.5 61.3,82 var idx = 0, timerId = null, rest = 300, fertig = {};

var FORMAT = { rechnen:'Rechnen', mc:'Multiple Choice', zuordnen:'Zuordnen', erklaeren:'Erklären &amp; Begründen' };
var CAS = { ohne:['ohne CAS','cas-ohne'], kontrolle:['CAS nur zur Kontrolle','cas-kontrolle'], mit:['mit CAS','cas-mit'] };
var HINWEIS = {
  rechnen:'Rechenweg auf dem Blatt notieren.',
  mc:'Kurz überlegen, dann gemeinsam abstimmen.',
  zuordnen:'Zuordnung auf dem Blatt notieren, z.&nbsp;B. A &rarr; 2.',
  erklaeren:'Antwort in ein bis zwei Sätzen aufschreiben.'
};

function speichern(){ try{ localStorage.setItem('fitAufgabenFertig', JSON.stringify(fertig)); }catch(e){} }
function laden(){ try{ fertig = JSON.parse(localStorage.getItem('fitAufgabenFertig')||'{}')||{}; }catch(e){ fertig={}; } }

function listeBauen(){
  var el = document.getElementById('liste'), html = '', gruppe = null;
  AUFGABEN.forEach(function(a, i){
    if(a.gruppe !== gruppe){ gruppe = a.gruppe; html += '<h2>'+gruppe+'</h2>'; }
    html += '<button class="item" data-i="'+i+'"><span class="n">'+a.nr+'</span>'+
            '<span class="tx">'+a.thema+'</span></button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.item').forEach(function(b){
    b.addEventListener('click', function(){ zeige(parseInt(b.dataset.i,10)); });
  });
}

function listeAktualisieren(){
  document.querySelectorAll('#liste .item').forEach(function(b){
    var i = parseInt(b.dataset.i,10);
    b.classList.toggle('aktiv', i === idx);
    b.classList.toggle('fertig', !!fertig[AUFGABEN[i].nr]);
  });
}

function zeige(i){
  idx = (i + AUFGABEN.length) % AUFGABEN.length;
  var a = AUFGABEN[idx], cas = CAS[a.cas];
  var h = '<div class="akopf"><span class="nr">'+a.nr+'</span>'+
          '<span class="thema">'+a.thema+'</span>'+
          '<span class="badge b-format">'+FORMAT[a.format]+'</span>'+
          '<span class="badge '+cas[1]+'">'+cas[0]+'</span></div>'+
          '<div class="frage">'+a.frage+'</div>'+ (a.body || '');

  if(a.format === 'mc'){
    h += '<div class="opts'+(a.optionen_grid?' grid':'')+'">';
    a.optionen.forEach(function(o, k){
      h += '<button class="opt" data-k="'+k+'"><span class="lab">'+'ABCD'[k]+'</span><span>'+o+'</span></button>';
    });
    h += '</div>';
  }
  if(a.format === 'zuordnen'){
    h += '<div class="zu"><div class="zusp">';
    a.links.forEach(function(o){ h += '<div class="zuel"><span class="lab">'+o.lab+'</span><span>'+o.html+'</span></div>'; });
    h += '</div><div class="zusp rechts">';
    a.rechts.forEach(function(o){ h += '<div class="zuel"><span class="lab">'+o.lab+'</span><span>'+o.html+'</span></div>'; });
    h += '</div></div>';
  }
  h += '<div class="hinw">'+HINWEIS[a.format]+'</div>';
  h += '<div class="steuer">'+
       '<div class="timer" id="timer"><button class="b" id="tStart">&#9654; Start</button>'+
       '<span class="tdisp" id="tDisp">05:00</span>'+
       '<button class="b klein" id="tReset" title="Zurücksetzen">&#8635;</button></div>'+
       '<button class="b stark" id="bLoesung">Lösung anzeigen</button>'+
       '<div class="rechtsraum">'+
       '<button class="b klein" id="bZurueck">&#8592; vorherige</button>'+
       '<button class="b klein" id="bWeiter">nächste &#8594;</button>'+
       '<button class="b klein" id="bZoomM" title="Schrift kleiner">A&minus;</button>'+
       '<button class="b klein" id="bZoomP" title="Schrift größer">A+</button>'+
       '<button class="b klein" id="bVoll" title="Vollbild">&#9974; Vollbild</button>'+
       '</div></div>'+
       '<div class="loesung" id="loesung"><span class="ltag">Lösung</span>'+a.loesung+'</div>';

  document.getElementById('buehne').innerHTML = h;

  document.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){ b.classList.toggle('markiert'); });
  });
  document.getElementById('bLoesung').addEventListener('click', loesungUmschalten);
  document.getElementById('bWeiter').addEventListener('click', function(){ zeige(idx+1); });
  document.getElementById('bZurueck').addEventListener('click', function(){ zeige(idx-1); });
  document.getElementById('tStart').addEventListener('click', timerUmschalten);
  document.getElementById('tReset').addEventListener('click', timerZuruecksetzen);
  document.getElementById('bZoomP').addEventListener('click', function(){ zoom(0.1); });
  document.getElementById('bZoomM').addEventListener('click', function(){ zoom(-0.1); });
  document.getElementById('bVoll').addEventListener('click', vollbild);

  timerZuruecksetzen();
  listeAktualisieren();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function loesungUmschalten(){
  var l = document.getElementById('loesung'), b = document.getElementById('bLoesung');
  var offen = l.classList.toggle('zeigen');
  b.textContent = offen ? 'Lösung ausblenden' : 'Lösung anzeigen';
  if(offen){
    var a = AUFGABEN[idx];
    if(a.format === 'mc'){
      var opt = document.querySelectorAll('.opt')[a.richtig];
      if(opt){ opt.classList.add('richtig'); }
    }
    fertig[a.nr] = true; speichern(); listeAktualisieren();
  }
}

/* ---- Timer ---- */
function zeitZeigen(){
  var m = Math.floor(rest/60), s = rest%60;
  document.getElementById('tDisp').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function piep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.5].forEach(function(t){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.12;
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.35);
    });
  }catch(e){}
}
function timerStopp(){
  clearInterval(timerId); timerId = null;
  var box = document.getElementById('timer');
  if(box){ box.classList.remove('laeuft'); }
  var b = document.getElementById('tStart');
  if(b){ b.innerHTML = '&#9654; Start'; }
}
function timerUmschalten(){
  if(timerId){ timerStopp(); return; }
  if(rest <= 0){ rest = 300; }
  var box = document.getElementById('timer');
  box.classList.remove('aus'); box.classList.add('laeuft');
  document.getElementById('tStart').innerHTML = '&#10073;&#10073; Pause';
  zeitZeigen();
  timerId = setInterval(function(){
    rest--; zeitZeigen();
    if(rest <= 0){
      timerStopp();
      document.getElementById('timer').classList.add('aus');
      document.getElementById('tDisp').textContent = 'Zeit um!';
      piep();
    }
  }, 1000);
}
function timerZuruecksetzen(){
  timerStopp(); rest = 300;
  var box = document.getElementById('timer');
  if(box){ box.classList.remove('aus'); }
  zeitZeigen();
}

/* ---- Darstellung ---- */
function zoom(d){
  var b = document.getElementById('buehne');
  var z = parseFloat(b.style.getPropertyValue('--zoom') || '1') + d;
  z = Math.min(1.8, Math.max(0.8, z));
  b.style.setProperty('--zoom', z);
}
function vollbild(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA'){ return; }
  if(e.code === 'Space'){ e.preventDefault(); timerUmschalten(); }
  else if(e.key === 'l' || e.key === 'L'){ loesungUmschalten(); }
  else if(e.key === 'ArrowRight'){ zeige(idx+1); }
  else if(e.key === 'ArrowLeft'){ zeige(idx-1); }
});

document.getElementById('bReset').addEventListener('click', function(){
  fertig = {}; speichern(); listeAktualisieren();
});

laden();
listeBauen();
zeige(0);
</script>
</body></html>
