<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ökonomische Anwendungen – Arbeitsblätter</title>
<style>
:root{ --rwb:#C90046; --dark:#A30038; --ink:#2B2E33; --mut:#6E7378; --line:#E3E7EC; --bg:#FAFBFC; }
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{background:#EDF0F3; font-family:Carlito,Calibri,'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--ink);}
.wrap{max-width:1180px; margin:0 auto; padding:18px;}
.card{background:#fff; border-radius:16px; padding:26px 30px 30px; box-shadow:0 2px 14px rgba(20,40,60,.10);}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
h1{margin:0; font-size:44px; line-height:1.1; color:var(--rwb); letter-spacing:-.4px;}
h1 .sq{display:inline-block; width:12px; height:12px; background:var(--rwb); margin-left:12px;}
.logo{height:56px; width:auto;}
.rule{position:relative; height:5px; margin:16px 0 22px;}
.rule::before{content:""; position:absolute; left:0; right:0; top:2px; height:1.4px; background:var(--line);}
.rule::after{content:""; position:absolute; left:0; top:0; width:150px; height:5px; border-radius:3px; background:var(--rwb);}
.board{background:var(--bg); border:1.2px solid var(--line); border-radius:20px; padding:30px 26px; display:grid; grid-template-columns:1fr 90px 1fr; align-items:center;}
.station{display:flex; flex-direction:column; align-items:center; text-decoration:none; color:inherit; border-radius:16px; padding:14px 10px 18px; transition:transform .2s ease;}
.station:hover, .station:focus-visible{transform:translateY(-4px); outline:none;}
.head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.num{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:24px; border:4px solid var(--rwb); color:var(--rwb); background:#fff; flex:0 0 52px;}
.s2 .num{background:var(--rwb); color:#fff;}
.ttl{font-size:22px; font-weight:700; line-height:1.2;}
.sub{font-size:15px; color:var(--mut); margin-top:2px;}
.stack{position:relative; width:300px; height:424px; margin:6px 0 4px;}
.pg{position:absolute; top:0; left:0; width:300px; height:auto; border-radius:4px; background:#fff; box-shadow:0 3px 14px rgba(28,39,51,.18); border:1px solid #dde2e7; transition:transform .25s ease;}
.p1{transform:translate(18px,14px) rotate(2.2deg);} .p2{transform:translate(34px,26px) rotate(4.2deg);}
.station:hover .p1{transform:translate(30px,10px) rotate(4deg);} .station:hover .p2{transform:translate(56px,18px) rotate(7.5deg);}
.badge{position:absolute; right:-14px; top:-12px; z-index:5; background:var(--rwb); color:#fff; font-size:13.5px; font-weight:700; border-radius:14px; padding:4px 11px; box-shadow:0 2px 6px rgba(0,0,0,.18);}
.open{margin-top:30px; display:inline-flex; align-items:center; gap:8px; font-size:17px; font-weight:700; color:#fff; background:var(--rwb); border-radius:9px; padding:10px 20px; box-shadow:0 2px 8px rgba(201,0,70,.25);}
.station:hover .open{background:var(--dark);}
.pdf{margin-top:10px; font-size:14.5px; color:var(--mut);}
.pdf a{color:var(--rwb); font-weight:700; text-decoration:none;} .pdf a:hover{text-decoration:underline;}
.arrow{display:flex; align-items:center; justify-content:center; height:100%;}
.arrow svg{width:80px; height:auto;}
@media (max-width:860px){
  .board{grid-template-columns:1fr; padding:20px 12px;}
  .arrow svg{transform:rotate(90deg); width:56px; margin:4px 0;}
  h1{font-size:32px;} .logo{height:44px;}
  .stack{width:240px; height:340px;} .pg{width:240px;}
}
@page{size:A4 landscape; margin:8mm;}
@media print{ body{background:#fff;} .card{box-shadow:none;} .open,.pdf{display:none;} }
</style></head><body>
