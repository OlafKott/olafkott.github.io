<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lösung – Vorbereitung Extremwertaufgaben</title><style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; --blau:#1D70B8; --gruen:#2E7D32; }
*{ box-sizing:border-box; }
body{ margin:0; padding:24px 16px 60px; font-family:Cambria,Georgia,'Times New Roman',serif;
  color:var(--ink); background:#F6F1EA; line-height:1.65; }
.wrap{ max-width:880px; margin:0 auto; background:#fff; border-radius:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.10); padding:26px 30px 34px; }
header.top{ display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:3px solid var(--rwb); padding-bottom:12px; margin-bottom:22px; gap:16px; }
header.top h1{ font-family:Calibri,Arial,sans-serif; font-size:24px; margin:0 0 4px; color:var(--rwb); }
header.top .sub{ font-size:14px; color:#444; }
header.top img{ height:58px; width:auto; }
.gate{ text-align:center; padding:26px 10px 10px; }
.gate p{ font-size:16px; margin:0 0 18px; }
.gate input{ font-family:Calibri,Arial,sans-serif; font-size:30px; letter-spacing:.5em;
  text-align:center; width:210px; padding:10px 6px 10px 18px; border:2px solid #c9c1b4; border-radius:8px; }
.gate input:focus{ outline:none; border-color:var(--rwb); }
.gate button{ display:block; margin:16px auto 0; font-family:Calibri,Arial,sans-serif; font-size:17px;
  font-weight:bold; color:#fff; background:var(--rwb); border:0; border-radius:8px; padding:11px 30px; cursor:pointer; }
.gate .msg{ min-height:24px; margin-top:14px; color:var(--rwb); font-size:15px; }
.step{ display:grid; grid-template-columns:34px 1fr; gap:0 14px; align-items:start;
  border-top:1px solid var(--line); padding:13px 0; }
.step:first-of-type{ border-top:0; }
.step .nr{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:17px; color:var(--rwb);
  background:#FBEEF0; border-radius:50%; width:34px; height:34px; line-height:34px; text-align:center; }
.step.opt .nr{ color:#6B6B6B; background:#f0efed; }
.step h3{ font-family:Calibri,Arial,sans-serif; font-size:15px; margin:6px 0 4px; color:#3a3a3a; font-weight:bold; }
.step.opt h3{ color:#6B6B6B; }
.math{ font-family:Cambria,Georgia,serif; font-size:17px; margin:4px 0; }
.math i{ font-style:italic; }
.note{ font-size:13.5px; color:#6B6B6B; }
.answer{ background:#EAF4EA; border-left:5px solid var(--gruen); border-radius:0 6px 6px 0;
  padding:14px 18px; margin:22px 0 6px; font-size:16px; }
.answer b{ color:#1B5E20; }
figure.sk{ margin:6px 0 2px; }
figure.sk svg{ max-width:300px; width:100%; height:auto; }
.back{ margin-top:26px; font-size:13px; color:#8a8a8a; text-align:center; }

const b2b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pruefe(){
  const el=document.getElementById('pin'), msg=document.getElementById('msg');
  const v=(el.value||'').trim();
  if(!/^\d{4}$/.test(v)){ msg.textContent='Bitte gib genau vier Ziffern ein.'; return; }
  msg.textContent='';
  try{
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(v),
                     'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
                  {name:'PBKDF2', salt:b2b(SALT), iterations:250000, hash:'SHA-256'},
                  basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const klar = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2b(IV)}, key, b2b(CT));
    const ziel = document.getElementById('loesung');
    ziel.innerHTML = new TextDecoder().decode(klar);
    document.getElementById('gate').hidden = true;
    ziel.hidden = false;
  }catch(e){
    msg.textContent='Der Code stimmt nicht. Versuch es noch einmal.'; el.select();
  }
}
document.getElementById('go').addEventListener('click', pruefe);
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') pruefe(); });
document.getElementById('pin').focus();
