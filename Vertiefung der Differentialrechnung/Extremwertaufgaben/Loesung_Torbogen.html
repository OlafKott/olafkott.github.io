<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&ouml;sung &ndash; Aufgabe 4 &ndash; Der Torbogen</title><style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; --blau:#1D70B8; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Cambria,Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.5; }
.page{ width:210mm; min-height:calc(297mm - 28mm); margin:10px auto; padding:13mm;
  background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); display:flex; flex-direction:column; }
.page-content{ flex:1; }
.page-header{ display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:3px solid var(--rwb); padding-bottom:8px; margin-bottom:9px; break-after:avoid; }
.page-header h1{ font-family:Calibri,Arial,sans-serif; font-size:20px; margin:0 0 3px; color:var(--rwb); }
.page-header .sub{ font-size:12.5px; color:#444; }
.page-header img.logo{ height:56px; width:auto; }
.namebar{ display:flex; gap:22px; font-size:12px; color:#555; margin:0 0 8px; }
.namebar span{ border-bottom:1px solid #999; flex:1; padding-bottom:2px; }
.ctx{ display:flex; gap:14px; align-items:center; background:#FBEEF0; border-left:4px solid var(--rwb);
  border-radius:0 4px 4px 0; padding:8px 12px; margin:0 0 9px; font-size:13.2px; line-height:1.55; }
.ctx .txt{ flex:1; }
.ctx img{ max-width:40mm; max-height:30mm; width:auto; height:auto; display:block; border-radius:4px; }
.paar{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
.paar img{ max-width:26mm; max-height:26mm; }
.paar .pf{ font-size:15px; color:#a89a86; line-height:1; }
.ctxsvg{ flex:0 0 auto; width:40mm; }
.ctxsvg svg{ width:100%; height:auto; display:block; }
.ctx .ph{ width:40mm; height:30mm; border:1px dashed #d8b8bf; border-radius:4px; }
.fx{ font-family:Cambria,Georgia,serif; font-style:italic; }
.grid{ display:flex; gap:9px; align-items:flex-start; }
.col{ flex:1; display:flex; flex-direction:column; gap:6px; }
.s{ border:1px solid var(--line); border-radius:5px; padding:5px 7px 6px; }
.s.opt{ background:#fbfaf8; border-style:dashed; }
.s .h{ font-size:11.5px; color:#3a3a3a; margin-bottom:3px; line-height:1.3; }
.s .h b{ font-family:Calibri,Arial,sans-serif; color:var(--rwb); font-size:12.5px; margin-right:4px; }
.s.opt .h, .s.opt .h b{ color:#6B6B6B; }
.karo{ border:1px solid #c4ccd6; border-radius:3px; background-color:#fff; overflow:hidden;
  background-image: linear-gradient(#dbe6f0 1px, transparent 1px), linear-gradient(90deg,#dbe6f0 1px, transparent 1px);
  background-size:5mm 5mm; }
.gfx{ border:1px solid #c4ccd6; border-radius:3px; background:#fff; text-align:center; padding:1px 0; }
.gfx svg{ width:100%; max-width:74mm; height:auto; }
.antw{ border:1px solid var(--line); border-radius:5px; padding:4px 7px 5px; margin-top:6px; }
.antw .h{ font-size:11.5px; color:#3a3a3a; margin-bottom:2px; }
.antw .h b{ font-family:Calibri,Arial,sans-serif; color:var(--rwb); font-size:12.5px; }
.antw .ln{ border-bottom:1px solid #b9b9b9; height:17px; }
.leiste{ display:flex; gap:9px; margin-top:7px; }
.box{ flex:1; display:flex; gap:11px; align-items:center; border-radius:0 4px 4px 0;
  padding:6px 10px; font-size:11.8px; line-height:1.38; }
.box.tipp{ background:#E9F2FB; border-left:4px solid var(--blau); }
.box.loes{ background:#FBEEF0; border-left:4px solid var(--rwb); }
.box .txt{ flex:1; }
.box b.tit{ font-family:Calibri,Arial,sans-serif; display:block; margin-bottom:1px; }
.box.tipp b.tit{ color:var(--blau); }
.box.loes b.tit{ color:var(--rwb); }
.box a{ display:block; text-decoration:none; }
.box img{ width:21mm; height:21mm; display:block; border:1px solid #dcd3d5; border-radius:3px; background:#fff; }
.pin{ display:flex; align-items:center; gap:5px; margin-top:5px; }
.pin span{ font-family:Calibri,Arial,sans-serif; font-size:11.5px; color:#555; }
.pin i{ display:block; width:8mm; height:8.5mm; border:1.3px solid #b3a99a; border-radius:3px; background:#fff; }
.fill{ font-family:Cambria,Georgia,serif; font-size:12.2px; line-height:1.55; color:#1D4E89;
  padding:2px 5px 3px; }
.fill i{ font-style:italic; }
.fill b{ color:#123B6B; }
.fill .k{ color:#7b8ba0; font-size:11px; }
.fill p{ margin:0 0 1px; }
.loesungs-hinweis{ background:#EAF4EA; border-left:4px solid #2E7D32; border-radius:0 4px 4px 0;
  padding:7px 12px; margin:0 0 9px; font-size:12.5px; }
.loesungs-hinweis b{ color:#1B5E20; font-family:Calibri,Arial,sans-serif; }
.page-footer{ border-top:1px solid var(--line); margin-top:8px; padding-top:6px;
  display:flex; justify-content:space-between; font-size:10.5px; color:#888; }
@media print{ body{ background:#fff; } .page{ box-shadow:none; margin:0; } }
@page{ size:A4; margin:0; }
@media screen and (max-width:760px){
  body{ padding:0; }
  .page{ width:auto; min-height:0; padding:14px 12px 20px; margin:0; box-shadow:none; }
  .grid{ flex-direction:column; }
  .ctx{ flex-direction:column; align-items:flex-start; }
  .ctx img{ max-width:60vw; max-height:none; margin-top:6px; }
  .leiste{ flex-direction:column; }
  .karo{ min-height:0 !important; height:auto !important; }
}

.gate{ max-width:520px; margin:26px auto 10px; text-align:center; font-family:Cambria,Georgia,serif; }
.gate p{ font-size:15px; margin:0 0 16px; line-height:1.55; }
.gate input{ font-family:Calibri,Arial,sans-serif; font-size:28px; letter-spacing:.5em;
  text-align:center; width:200px; padding:9px 6px 9px 18px; border:2px solid #c9c1b4; border-radius:8px; }
.gate input:focus{ outline:none; border-color:#C8102E; }
.gate button{ display:block; margin:14px auto 0; font-family:Calibri,Arial,sans-serif; font-size:16px;
  font-weight:bold; color:#fff; background:#C8102E; border:0; border-radius:8px; padding:10px 28px; cursor:pointer; }
.gate .msg{ min-height:22px; margin-top:12px; color:#C8102E; font-size:14px; }
</style></head><body><div style="font-family:Cambria,Georgia,serif;padding:18px 14px 0"><div class="gate" id="gate">

const b2b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pruefe(){
  const el=document.getElementById('pin'), msg=document.getElementById('msg');
  const v=(el.value||'').trim();
  if(!/^\d{4}$/.test(v)){ msg.textContent='Bitte gib genau vier Ziffern ein.'; return; }
  msg.textContent='';
  try{
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
                  {name:'PBKDF2', salt:b2b(SALT), iterations:250000, hash:'SHA-256'},
                  basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const klar = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2b(IV)}, key, b2b(CT));
    const ziel = document.getElementById('loesung');
    ziel.innerHTML = new TextDecoder().decode(klar);
    document.getElementById('gate').hidden = true;
    ziel.hidden = false;
  }catch(e){
    msg.textContent='Der Code stimmt nicht. Versuch es noch einmal.'; el.select();
  }
}
document.getElementById('go').addEventListener('click', pruefe);
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') pruefe(); });
document.getElementById('pin').focus();
</script></div><div id="loesung" hidden></div></body></html>
