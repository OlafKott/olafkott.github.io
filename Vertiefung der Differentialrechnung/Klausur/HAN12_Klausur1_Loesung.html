<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&ouml;sung &ndash; 1. Klausur Differentialrechnung HAN 12</title>
<style>
:root{ --rwb:#c8102e; --ink:#17336b; --grey:#5b6270; --pt:#2e7d32; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:#eee; font-family:Carlito,Calibri,'Segoe UI',Arial,sans-serif; color:#1d1d1f; }
.page{ width:210mm; height:297mm; margin:8mm auto; background:#fff; padding:11mm 15mm 9mm 17mm;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.15); }
@media print{ body{ background:#fff; } .page{ margin:0; box-shadow:none; break-after:page; page-break-after:always; }
  .page:last-of-type{ break-after:auto; page-break-after:auto; } }
@page{ size:A4; margin:0; }
.lh{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2.5px solid var(--rwb); padding-bottom:2.2mm; margin-bottom:4mm; }
.lh .t{ font-family:'Liberation Serif',Georgia,serif; font-weight:bold; color:var(--rwb); font-size:15.5pt; }
.lh .s{ font-size:10pt; color:#555; margin-top:0.6mm; }
.lh .rgt{ display:flex; align-items:center; gap:3mm; }
.lh img{ height:12mm; }
.lh .badge{ background:var(--rwb); color:#fff; font-weight:bold; font-size:11pt; border-radius:4px; padding:1mm 3mm; letter-spacing:.04em; }
.content{ flex:1; }
footer{ border-top:1px solid #d9d2c5; padding-top:1.6mm; display:flex; justify-content:space-between; font-size:8.6pt; color:#888; }

.blk{ display:flow-root; }
.teil{ background:var(--rwb); color:#fff; font-family:'Liberation Serif',Georgia,serif; font-weight:bold; font-size:13pt; border-radius:5px; padding:1.8mm 4mm; margin:1mm 0 3mm; display:flex; justify-content:space-between; }
.teil span{ font-family:Carlito,sans-serif; font-weight:normal; font-size:11pt; }
.auf{ background:#fbeaec; border-left:4px solid var(--rwb); padding:1.6mm 4mm; margin:2mm 0 2mm; display:flex; justify-content:space-between; align-items:baseline; }
.auf h2{ margin:0; font-family:'Liberation Serif',Georgia,serif; color:var(--rwb); font-size:14pt; }
.auf span{ color:#555; font-size:11pt; }
.given{ font-size:11pt; color:#333; background:#f7f7f4; border:1px solid #e3e0d6; border-radius:5px; padding:1.6mm 3.5mm; margin:0 0 2.5mm; line-height:1.55; }
.ta{ display:flex; gap:3mm; align-items:baseline; margin:3.2mm 0 1.2mm; }
.ta .l{ font-weight:bold; font-size:12.5pt; color:#1d1d1f; min-width:7mm; }
.ta .x{ flex:1; font-size:11.3pt; color:#333; font-style:italic; }
.ta .pp{ font-weight:bold; font-size:11pt; color:#333; white-space:nowrap; }
.st{ display:flex; gap:3mm; align-items:flex-start; margin:0.8mm 0 0.8mm 10mm; }
.st .bd{ flex:1; }
.st .pt{ flex:0 0 11mm; text-align:right; font-weight:bold; color:var(--pt); font-size:10.5pt; padding-top:1mm; }
.tx{ font-size:11.3pt; line-height:1.5; color:#222; }
.tx b.k{ color:#17336b; }
.m{ font-family:'Liberation Serif',Cambria,Georgia,serif; color:var(--ink); font-size:12.3pt; }
.m i{ font-style:italic; }
table.eq{ border-collapse:collapse; font-family:'Liberation Serif',Cambria,Georgia,serif; color:var(--ink); font-size:12.3pt; margin:0.6mm 0 0.6mm 4mm; }
table.eq td{ padding:0.75mm 1.1mm; vertical-align:middle; white-space:nowrap; }
table.eq td.l{ text-align:right; }
table.eq td.r{ text-align:center; width:6mm; }
table.eq td.rh{ text-align:left; }
table.eq td.op{ font-family:Carlito,sans-serif; color:var(--grey); font-size:10.8pt; padding-left:6mm; }
table.eq td.ar{ color:var(--grey); padding-right:2mm; }
.ans{ margin:0.6mm 0 0.2mm 4mm; border-left:3px solid #2e7d32; background:#eef7ef; padding:1.2mm 3mm; font-size:11.3pt; }
.ans b{ color:#1b5e20; }
.note{ margin:1mm 0 0.6mm 10mm; font-size:10.3pt; color:#555; background:#f6f6f6; border-radius:4px; padding:1.2mm 3mm; line-height:1.45; }
.note b{ color:#444; }
.fig{ text-align:center; margin:1mm 0; }
.res{ display:inline-block; border:1.4px solid var(--ink); border-radius:3px; padding:0 2mm; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; line-height:1.18; }
.fr > span:first-child{ border-bottom:1.1px solid currentColor; padding:0 3px 1px; }
.fr > span:last-child{ padding:1px 3px 0; }
.rt{ display:inline-flex; align-items:stretch; vertical-align:middle; margin:0 1px; }
.rt .sg{ position:relative; width:0.6em; flex:0 0 0.6em; }
.rt .sg svg{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }
.rt .r{ border-top:1.1px solid currentColor; padding:1px 2px 0 2px; }
.pw{ display:inline-flex; align-items:center; vertical-align:middle; }
.pw .br{ font-size:30pt; line-height:1; margin:0 2mm 0 1mm; font-weight:200; }
.pw table td{ padding:0.2mm 2mm; white-space:nowrap; }
.two{ display:flex; gap:6mm; }

#lock { max-width: 520px; margin: 40px auto; background: #fff; border-top: 6px solid #c8102e; border-radius: 10px; padding: 20px 22px;
  box-shadow: 0 1px 6px rgba(0,0,0,.12); font-family: "Liberation Serif", "Times New Roman", serif; }
#lock h1 { color: #c8102e; font-size: 1.45em; margin: 0 0 4px 0; }
#lock input { font-size: 1.6em; letter-spacing: .4em; width: 6.5em; padding: 8px 10px; text-align: center; border: 1px solid #c4c4c8; border-radius: 8px; background: #f4f4f5; }
#lock button { font-size: 1.05em; padding: 10px 18px; border: 0; border-radius: 8px; background: #c8102e; color: #fff; cursor: pointer; }
#out { transform-origin: top left; }
@media print { #lock { display: none; } }
</style></head>
