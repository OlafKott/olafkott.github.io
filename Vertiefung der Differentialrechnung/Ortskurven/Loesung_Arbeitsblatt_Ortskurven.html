<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&ouml;sung &ndash; Arbeitsblatt Ortskurven</title>
<style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.6; }
#tor{ max-width:150mm; margin:24px auto; background:#fff; border:1.6px solid var(--rwb);
      border-radius:10px; padding:26px 26px 30px; box-shadow:0 2px 10px rgba(0,0,0,.14); text-align:center; }
#tor img.logo{ height:40px; width:auto; margin-bottom:10px; }
#tor h1{ font-size:21px; color:var(--rwb); margin:0 0 4px; }
#tor .sub{ font-size:13.5px; color:#444; margin-bottom:16px; }
#tor p.hin{ font-size:14px; margin:0 0 14px; }
#tor .felder{ display:flex; gap:10px; justify-content:center; margin:0 0 6px; }
#tor input{ width:52px; height:62px; text-align:center; font-size:28px; font-weight:bold;
            font-family:Calibri,Arial,sans-serif; color:var(--ink); border:1.6px solid #8e877a; border-radius:8px; background:#fff; }
#tor input:focus{ outline:none; border-color:var(--rwb); box-shadow:0 0 0 3px rgba(200,16,46,.18); }
#tor button{ margin-top:14px; font-family:Calibri,Arial,sans-serif; font-size:15px; font-weight:bold; color:#fff;
             background:var(--rwb); border:1.6px solid var(--rwb); border-radius:7px; padding:10px 22px; cursor:pointer; }
#tor button:disabled{ opacity:.6; cursor:default; }
#tor .fehler{ color:var(--rwb); font-size:13.5px; min-height:20px; margin-top:8px; font-weight:bold; }
#tor .fuss{ font-size:11.5px; color:#8a8478; margin-top:16px; }
@media print{ #tor{ display:none !important; } }
</style></head>

  var felder=['z1','z2','z3','z4'].map(function(i){ return document.getElementById(i); }),
      fehler=document.getElementById('fehler'), knopf=document.getElementById('oeffnen');
  function bytes(b64){ var s=atob(b64), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  function leeren(t){ fehler.textContent=t; felder.forEach(function(f){ f.value=''; }); felder[0].focus(); }
  function pruefen(){
    var code=felder.map(function(f){ return f.value.trim(); }).join('');
    if(code.length!==4){ fehler.textContent='Bitte alle vier Ziffern eintragen.'; return; }
