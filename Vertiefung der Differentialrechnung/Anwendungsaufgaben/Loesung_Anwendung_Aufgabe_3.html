<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lösung – Aufgabe 3</title><style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; --blau:#1D70B8; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Cambria,Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.5; }
.page{ width:210mm; min-height:calc(297mm - 28mm); margin:10px auto; padding:13mm;
  background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); display:flex; flex-direction:column; }
.page-content{ flex:1; }
.page-header{ display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:3px solid var(--rwb); padding-bottom:8px; margin-bottom:9px; break-after:avoid; }
.page-header h1{ font-family:Calibri,Arial,sans-serif; font-size:20px; margin:0 0 3px; color:var(--rwb); }
.page-header .sub{ font-size:12.5px; color:#444; }
.page-header img.logo{ height:56px; width:auto; }
.namebar{ display:flex; gap:22px; font-size:12px; color:#555; margin:0 0 8px; }
.namebar span{ border-bottom:1px solid #999; flex:1; padding-bottom:2px; }
.ctx{ background:#FBEEF0; border-left:4px solid var(--rwb); border-radius:0 4px 4px 0; padding:7px 12px; margin:0 0 8px; font-size:13.2px; line-height:1.55; }
.fxline{ font-family:Cambria,Georgia,serif; font-size:15px; margin:3px 0 4px 26px; }
h2.task{ display:flex; align-items:center; gap:8px; font-family:Calibri,Arial,sans-serif; color:var(--rwb); font-size:16px; margin:10px 0 5px; border-left:4px solid var(--rwb); padding-left:8px; break-after:avoid; }
h2.task .tn{ background:var(--rwb); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
.lvl{ margin-left:auto; font-size:11px; font-weight:bold; color:#fff; border-radius:10px; padding:2px 12px; }
.lvl.leicht{ background:#2E9E4F; } .lvl.mittel{ background:#F2B705; color:#3a2e00; } .lvl.schwer{ background:#D6232E; }
.lead{ font-size:13.2px; margin:4px 0 4px; line-height:1.55; }
.hint{ font-size:12px; color:#6b6b6b; font-style:italic; }
.karo{ border:1px solid #c4ccd6; border-radius:3px; background-color:#fff; overflow:hidden; margin:3px 0 6px;
  background-image: linear-gradient(#dbe6f0 1px, transparent 1px), linear-gradient(90deg,#dbe6f0 1px, transparent 1px);
  background-size:5mm 5mm; }
.gfx{ border:1px solid #c4ccd6; border-radius:3px; background:#fff; padding:2px 4px; margin:4px 0 6px; }
.lines{ margin:2px 0 6px; }
.lines .ln{ border-bottom:1px solid #b9b9b9; height:8mm; }
.lines.filled{ border-bottom:1px solid #b9b9b9; }
.ans{ display:inline-block; border-bottom:1.3px solid #888; text-align:center; font-family:Cambria,Georgia,serif; color:#1D4E89; font-weight:bold; line-height:1.2; }
table.wt{ border-collapse:collapse; width:100%; table-layout:fixed; font-family:Cambria,Georgia,serif; font-size:13px; margin:4px 0 6px; }
table.wt th,table.wt td{ border:1px solid #9aa5b1; height:8.5mm; text-align:center; padding:0 2px; }
table.wt th{ background:#F6F1EA; width:20mm; font-weight:normal; }
table.wt td.xh{ background:#FBF8F3; font-weight:bold; }
table.wt td{ color:#1D4E89; font-weight:bold; }
table.wt td.xh{ color:var(--ink); }
.fr{ display:inline-block; vertical-align:middle; text-align:center; line-height:1.15; margin:0 2px; font-size:.95em; }
.fr span{ display:block; padding:0 3px; }
.fr span:first-child{ border-bottom:1.2px solid currentColor; }
.fill{ font-family:Cambria,Georgia,serif; font-size:12.6px; line-height:1.75; color:#1D4E89; padding:3px 7px 4px; }
.fill .k{ color:#7b8ba0; font-size:11px; }
.leiste{ display:flex; gap:9px; margin-top:6px; }
.box{ flex:1; display:flex; gap:11px; align-items:center; border-radius:0 4px 4px 0; padding:6px 10px; font-size:11.8px; line-height:1.38; }
.box.tipp{ background:#E9F2FB; border-left:4px solid var(--blau); }
.box.loes{ background:#FBEEF0; border-left:4px solid var(--rwb); }
.box .txt{ flex:1; }
.box b.tit{ font-family:Calibri,Arial,sans-serif; display:block; margin-bottom:1px; font-size:13px; }
.box.tipp b.tit{ color:var(--blau); } .box.loes b.tit{ color:var(--rwb); }
.box a{ display:block; text-decoration:none; }
.box img{ width:24mm; height:24mm; display:block; border:1px solid #dcd3d5; border-radius:3px; background:#fff; }
.pin{ display:flex; align-items:center; gap:5px; margin-top:5px; }
.pin span{ font-family:Calibri,Arial,sans-serif; font-size:11.5px; color:#555; }
.pin i{ display:flex; align-items:center; justify-content:center; width:8mm; height:8.5mm; border:1.3px solid #b3a99a; border-radius:3px; background:#fff; font-style:normal; font-weight:bold; font-size:16px; color:#1D4E89; }
.leiste.top{ margin:0 0 8px; }
.trow{ display:flex; gap:8px; align-items:flex-start; }
.trow .tmain{ flex:1; min-width:0; }
.tipq{ flex:0 0 46mm; display:flex; gap:6px; align-items:center; background:#E9F2FB; border-left:4px solid var(--blau); border-radius:0 4px 4px 0; padding:4px 6px; margin:3px 0 4px; font-size:10.8px; line-height:1.3; }
.tipq .txt{ flex:1; } .tipq b{ display:block; font-family:Calibri,Arial,sans-serif; color:var(--blau); font-size:12.5px; }
.tipq a{ display:block; } .tipq img{ width:19mm; height:19mm; display:block; border:1px solid #dcd3d5; border-radius:3px; background:#fff; }
.leiste.top .box{ padding:4px 9px; font-size:11px; }
.leiste.top .box img{ width:19mm; height:19mm; }
.karo.pre{ padding:3mm 3mm 2mm; }
.prer{ display:flex; align-items:center; gap:6px; min-height:12mm; font-family:Cambria,Georgia,serif; font-size:14px; }
.prer .pl{ white-space:nowrap; }
.prer .pa{ color:#1D4E89; font-weight:bold; }
.loesungs-hinweis{ background:#EAF4EA; border-left:4px solid #2E7D32; border-radius:0 4px 4px 0; padding:6px 12px; margin:0 0 8px; font-size:12.5px; }
.loesungs-hinweis b{ color:#1B5E20; font-family:Calibri,Arial,sans-serif; }
.page-footer{ border-top:1px solid var(--line); margin-top:8px; padding-top:6px; display:flex; justify-content:space-between; font-size:10.5px; color:#888; }
@media print{ body{ background:#fff; } .page{ box-shadow:none; margin:0; height:297mm; min-height:0; overflow:hidden; break-after:page; page-break-after:always; display:block; position:relative; } .page-footer{ position:absolute; left:13mm; right:13mm; bottom:13mm; margin:0; } .page:last-of-type{ break-after:auto; page-break-after:auto; } }
@page{ size:A4; margin:0; }
@media screen and (max-width:760px){
  .page{ width:auto; min-height:0; padding:14px 12px 20px; margin:0; box-shadow:none; }
  .leiste{ flex-direction:column; }
  table.wt{ font-size:11px; }
}

.gate{ max-width:520px; margin:26px auto 10px; text-align:center; font-family:Cambria,Georgia,serif; }
.gate h1{ font-family:Calibri,Arial,sans-serif; color:#C8102E; font-size:22px; margin:0 0 10px; }
.gate p{ font-size:15px; margin:0 0 16px; line-height:1.55; }
.gate input{ font-family:Calibri,Arial,sans-serif; font-size:28px; letter-spacing:.5em; text-align:center; width:200px; padding:9px 6px 9px 18px; border:2px solid #c9c1b4; border-radius:8px; }
.gate input:focus{ outline:none; border-color:#C8102E; }
.gate button{ display:block; margin:14px auto 0; font-family:Calibri,Arial,sans-serif; font-size:16px; font-weight:bold; color:#fff; background:#C8102E; border:0; border-radius:8px; padding:10px 28px; cursor:pointer; }
.gate .msg{ min-height:22px; margin-top:12px; color:#C8102E; font-size:14px; }

.sb{ margin:0 0 7px; }
.sbh{ font-family:Calibri,Arial,sans-serif; font-weight:bold; color:#C8102E; font-size:14.5px; border-left:4px solid #C8102E; padding-left:8px; margin:9px 0 4px; }
.sbh b{ color:#C8102E; }
.cond{ font-size:13px; margin:2px 0 3px 4px; color:#333; }
.seq{ display:grid; grid-template-columns:max-content max-content max-content 1fr; column-gap:8px; row-gap:3px; align-items:center; margin:2px 0 4px 14px; font-family:Cambria,Georgia,serif; font-size:13.5px; }
.seq .l{ text-align:right; white-space:nowrap; } .seq .e{ text-align:center; } .seq .r{ white-space:nowrap; }
.seq .o{ color:#1D70B8; font-size:12px; padding-left:14px; white-space:nowrap; }
.seq .st{ grid-column:1 / span 4; font-size:12.3px; color:#333; padding:1px 0; }
.sres{ margin:4px 0 2px; background:#EAF5EA; border:1.5px solid #2E7D32; border-radius:5px; padding:3px 10px; font-family:Calibri,Arial,sans-serif; font-size:13.5px; color:#1B5E20; }
.sp{ font-size:13px; line-height:1.6; margin:2px 0 4px 4px; }
.k{ font-family:Consolas,'Courier New',monospace; font-size:11.5px; color:#555; }
.two2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
table.bt{ border-collapse:collapse; width:100%; font-size:12.5px; margin:3px 0 4px; }
table.bt th, table.bt td{ border:1px solid #d9d2c5; padding:3px 7px; text-align:left; }
table.bt th{ background:#F6F1EA; font-family:Calibri,Arial,sans-serif; }

.box.intro{ margin:0 0 6px; } .box.intro .txt{ font-size:12.3px; line-height:1.5; }
.ctx .unit{ display:block; font-size:12px; color:#555; margin-top:2px; }
.pw{ display:flex; align-items:center; gap:6px; margin:4px 0 2px 22px; font-family:Cambria,Georgia,serif; font-size:15px; }
.pw table{ border-collapse:collapse; } .pw td{ padding:1px 6px; line-height:1.45; }
.pw td.pt{ font-weight:bold; white-space:nowrap; } .pw td.pd{ color:#333; white-space:nowrap; }
.brace{ display:block; }
ol.tl{ list-style:none; margin:4px 0 6px; padding:0 0 0 4px; font-size:13.2px; line-height:1.55; }
ol.tl li{ margin:0 0 4px; padding-left:22px; text-indent:-22px; }
ol.tl li b{ display:inline-block; width:22px; text-indent:0; }
ul.facts{ margin:4px 0 0; padding-left:20px; } ul.facts li{ margin:1px 0; }
.leiste .box.loes{ flex:1.35; }
.box.ue{ background:#EAF5EA; border-left:4px solid #2E7D32; } .box.ue b.tit{ color:#1B5E20; }
.knobel h2.task .star{ margin-left:auto; font-size:12px; color:#fff; background:#8a6d3b; border-radius:10px; padding:2px 10px; }
.box.wk{ background:#F6F1EA; border-left:4px solid #8a6d3b; } .box.wk b.tit{ color:#6b4f1d; }
.leiste .box img{ width:21mm; height:21mm; }
.leiste{ margin:4px 0 2px; } .leiste .box{ padding:4px 9px; font-size:11.2px; line-height:1.32; }
.leiste .pin{ margin-top:3px; } .leiste .pin i{ width:7mm; height:7.5mm; }
.ctx{ font-size:12.8px; padding:6px 11px; margin:0 0 5px; }
ol.tl{ font-size:12.9px; line-height:1.5; margin:2px 0 4px; } ol.tl li{ margin:0 0 2px; }
h2.task{ margin-top:12px; }
</style></head><body>

const b2b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pruefe(){
  const el=document.getElementById('pin'), msg=document.getElementById('msg');
  const v=(el.value||'').trim();
  if(!/^\d{4}$/.test(v)){ msg.textContent='Bitte gib genau vier Ziffern ein.'; return; }
  msg.textContent='';
  try{
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2b(SALT), iterations:250000, hash:'SHA-256'}, basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const klar = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2b(IV)}, key, b2b(CT));
    const ziel = document.getElementById('loesung');
    ziel.innerHTML = new TextDecoder().decode(klar);
    document.getElementById('gate').hidden = true; ziel.hidden = false;
  }catch(e){ msg.textContent='Der Code stimmt nicht. Prüfe deine Ergebnisse noch einmal.'; el.select(); }
}
document.getElementById('go').addEventListener('click', pruefe);
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') pruefe(); });
document.getElementById('pin').focus();
</script></div><div id="loesung" hidden></div>
