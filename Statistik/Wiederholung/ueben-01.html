<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brüche kürzen und erweitern</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#f2f4f7;color:#1d1d1f;line-height:1.55;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
header{background:#C8102E;color:#fff;padding:16px 0 14px;margin-bottom:18px}
header .wrap{padding-bottom:0}
.knr{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
h1{font-size:22px;margin:2px 0 0;line-height:1.25}
.karte{background:#fff;border-radius:12px;padding:16px 18px;margin:14px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.09)}
h2{font-size:17px;margin:0 0 8px;color:#C8102E}
h2.b{color:#1D70B8}
p{margin:8px 0}
.regel{background:#FBEEF0;border-left:4px solid #C8102E;border-radius:0 8px 8px 0;
  padding:12px 14px;margin:12px 0}
.bsp{background:#F4F9FE;border-left:4px solid #1D70B8;border-radius:0 8px 8px 0;
  padding:12px 14px;margin:12px 0}
.bsp b,.regel b{color:#1D70B8}
.regel b{color:#C8102E}
.schritt{margin:7px 0 7px 2px;padding-left:24px;position:relative}
.schritt::before{content:attr(data-n);position:absolute;left:0;top:2px;background:#1D70B8;
  color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;
  text-align:center;line-height:18px}
.mrk{background:#fff3cd;padding:0 3px;border-radius:3px}
.br{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  margin:0 3px;line-height:1.15}
.br>span:first-child{padding:0 4px}
.br>span:last-child{padding:0 4px;border-top:2px solid currentColor}
.rechnung{font-size:19px;margin:10px 0}
.frage{font-size:21px;margin:4px 0 14px;min-height:34px}
.felder{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 16px;font-size:20px}
input[type=text],input[type=number]{font-size:20px;padding:10px 12px;width:96px;border:2px solid #c9cfd6;
  border-radius:8px;font-family:inherit;text-align:center;background:#fff}
input:focus{outline:none;border-color:#1D70B8}
.brf{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.brf .bal{width:96px;height:2px;background:#1d1d1f}
button{font-family:inherit;font-size:17px;font-weight:600;padding:13px 22px;border-radius:9px;
  border:0;cursor:pointer;margin:4px 6px 4px 0}
.bp{background:#C8102E;color:#fff}
.bn{background:#e8ebef;color:#1d1d1f}
button:disabled{opacity:.45;cursor:default}
.rueck{margin:12px 0 0;padding:0;border-radius:9px;font-size:16px}
.rueck.ok{background:#E6F4EA;border-left:4px solid #1E7B3C;padding:12px 14px}
.rueck.no{background:#FDECEC;border-left:4px solid #C8102E;padding:12px 14px}
.zaehler{font-size:14px;color:#6b7280;margin-top:14px}
.wahl{display:flex;gap:10px;flex-wrap:wrap}
.wahl button{min-width:74px;font-size:22px;background:#fff;border:2px solid #c9cfd6}
.wahl button.sel{border-color:#1D70B8;background:#EAF3FB}
a.link{display:inline-block;margin-top:6px;color:#1D70B8;font-weight:600;text-decoration:none}
a.link:hover{text-decoration:underline}
.fuss{text-align:center;font-size:14px;color:#6b7280;margin-top:26px}
svg{max-width:100%;height:auto}
table.t{border-collapse:collapse;margin:6px 0;font-size:18px}
table.t td,table.t th{border:1px solid #c9cfd6;padding:8px 12px;text-align:center}
table.t th{background:#f3ece0}
</style></head><body>
<header><div class="wrap"><div class="knr">Aufgabe 1 &middot; Üben</div><h1>Brüche kürzen und erweitern</h1></div></header>
<div class="wrap">
<div class="karte">
<h2 class="b">Übungsaufgabe</h2>
<p style="color:#6b7280;font-size:15px;margin-top:0">Trage Zähler und Nenner in die beiden Felder ein.</p>
<div class="frage" id="frage"></div>
<div class="felder" id="felder"></div>
<button class="bp" id="bp" onclick="pruefen()">Prüfen</button>
<button class="bn" onclick="neueAufgabe()">Nächste Aufgabe</button>
<div class="rueck" id="rueck"></div>
<div class="zaehler" id="zaehler">Richtig: 0 von 0</div>
</div>
<div class="karte"><p style="margin:0">Du kommst nicht weiter?
<a class="link" href="tipp-01.html">Zum Tipp für Aufgabe 1 &rarr;</a></p></div>
<div class="karte" style="text-align:center"><a class="link" href="index.html">&larr; Übersicht aller Aufgaben</a></div>
<div class="fuss">Fit für die Statistik &middot; RWB Essen</div>
</div>
<script>
function zuf(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function wahl(a){return a[zuf(0,a.length-1)];}
function ggt(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function kgv(a,b){return a*b/ggt(a,b);}
function kuerze(z,n){var g=ggt(z,n);z/=g;n/=g;if(n<0){z=-z;n=-n;}return [z,n];}
function br(z,n){return '<span class="br"><span>'+z+'</span><span>'+n+'</span></span>';}
function mz(x){return String(x).replace('.',',').replace('-','\u2212');}
function rd(x,k){var p=Math.pow(10,k);return Math.round(x*p+(x>=0?1e-9:-1e-9))/p;}
function fix(x,k){return mz(x.toFixed(k));}
function feldZ(id,ph){return '<input type="text" inputmode="decimal" id="'+id+'" placeholder="'+(ph||'')+'">';}
function feldBr(idz,idn){return '<span class="brf">'+feldZ(idz)+'<span class="bal"></span>'+feldZ(idn)+'</span>';}
function lies(id){var e=document.getElementById(id);if(!e)return null;
  var v=e.value.trim().replace(',','.').replace('\u2212','-');if(v==='')return null;
  var x=Number(v);return isNaN(x)?null:x;}
function brStatus(idz,idn,z,n){
  var a=lies(idz),b=lies(idn);
  if(a===null||b===null)return 'leer';
  if(b===0||Math.abs(a/b-z/n)>1e-9)return 'falsch';
  if(ggt(a,b)!==1||b<0)return 'unkuerz';
  return 'ok';}
function dezTeil(z,n){
  var vor=Math.floor(z/n),r=z%n,nach='',pos={},per='';
  while(r!==0){
    if(pos[r]!==undefined){per=nach.slice(pos[r]);nach=nach.slice(0,pos[r]);break;}
    pos[r]=nach.length;r*=10;nach+=String(Math.floor(r/n));r=r%n;
    if(nach.length>24)break;}
  return {vor:vor,nach:nach,per:per};}
function zeigeDez(z,n){var d=dezTeil(z,n);
  if(d.nach===''&&d.per==='')return mz(d.vor);
  var s=mz(d.vor)+','+d.nach;
  if(d.per!=='')s+='<span style="border-top:2px solid currentColor">'+d.per+'</span>';
  return s;}

var A=null,richtig=0,gesamt=0;
function neueAufgabe(){
  A=erzeuge();
  document.getElementById('frage').innerHTML=A.frage;
  document.getElementById('felder').innerHTML=A.felder;
  var r=document.getElementById('rueck');r.className='rueck';r.innerHTML='';
  document.getElementById('bp').disabled=false;
  if(A.nachBau)A.nachBau();
  var f=document.querySelector('#felder input');if(f)f.focus();
}
function pruefen(){
  if(document.getElementById('bp').disabled)return;
  var ok=A.pruefe();
  if(ok===null){
    var r0=document.getElementById('rueck');r0.className='rueck no';
    r0.innerHTML='<b>Da fehlt noch etwas.</b> Trage bitte eine Zahl ein.';return;}
  gesamt++;if(ok)richtig++;
  var r=document.getElementById('rueck');
  r.className='rueck '+(ok?'ok':'no');
  r.innerHTML=(ok?'<b>Richtig!</b> ':'<b>Noch nicht. </b>')+A.loesung();
  document.getElementById('bp').disabled=true;
  document.getElementById('zaehler').textContent='Richtig: '+richtig+' von '+gesamt;
}
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();
    if(document.getElementById('bp').disabled)neueAufgabe();else pruefen();}});

function erzeuge(){
  var hinw='';
  if(zuf(0,1)===0){
    var n=wahl([2,3,4,5,6,7,8,9,10,12]),z=zuf(1,3*n),k=kuerze(z,n);
    while(k[1]===1){z=zuf(1,3*n);k=kuerze(z,n);}
    z=k[0];n=k[1];
    var f=zuf(2,9),Z=z*f,N=n*f;
    return {frage:'Kürze so weit wie möglich:<br>'+br(Z,N)+' = ?',
      antw:[z,n],
      felder:feldBr('a','b'),
      pruefe:function(){var s=brStatus('a','b',z,n);if(s==='leer')return null;
        hinw=(s==='unkuerz')?' <b>Der Wert stimmt – aber kürze noch vollständig.</b>':'';
        return s==='ok';},
      loesung:function(){return 'Zähler und Nenner durch <b>'+f+'</b> teilen: '
        +br(Z,N)+' = '+br(z,n)+hinw;}};
  }
  var n2=wahl([3,4,5,6,7,8,9,10]),z2=zuf(1,n2-1);
  var k2=kuerze(z2,n2);z2=k2[0];n2=k2[1];
  var g=zuf(2,9),N2=n2*g,Z2=z2*g;
  return {frage:'Erweitere auf den Nenner <b>'+N2+'</b>:<br>'+br(z2,n2)+' = '
      +br('<span style="color:#1D70B8">?</span>',N2),
    antw:[Z2],
    felder:'<span style="font-size:20px">Zähler:</span>'+feldZ('a'),
    pruefe:function(){var v=lies('a');if(v===null)return null;return Math.abs(v-Z2)<1e-9;},
    loesung:function(){return 'Der Nenner wurde mit <b>'+g+'</b> multipliziert ('+N2+' : '+n2+' = '+g
      +'), also auch der Zähler: '+z2+' · '+g+' = <b>'+Z2+'</b>. &nbsp; '+br(z2,n2)+' = '+br(Z2,N2);}};
}
neueAufgabe();</script>
</body></html>
