let akt = -1;
function parseKomma(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/\s/g, "").replace(/[%°€g]/g, "").replace("−", "-").replace(",", ".");
  if (s === "" || !/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
function neueAufgabe() {
  let n;
  do { n = Math.floor(Math.random() * AUFGABEN.length); } while (n === akt && AUFGABEN.length > 1);
  akt = n;
  const a = AUFGABEN[akt];
  document.getElementById("aufgabe-text").innerHTML = a.kontext;
  const ib = document.getElementById("info-box");
  ib.innerHTML = a.info || ""; ib.style.display = a.info ? "block" : "none";
  const box = document.getElementById("felder"); box.innerHTML = "";
  a.felder.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "frage-block";
    let feld;
    if (f.typ === "wahl") {
      feld = '<select id="ein-' + i + '"><option value="">– bitte wählen –</option>' +
        f.optionen.map(o => '<option>' + o + '</option>').join("") + '</select>';
    } else {
      feld = '<input type="text" inputmode="decimal" autocomplete="off" id="ein-' + i + '">';
    }
    d.innerHTML = '<label for="ein-' + i + '">' + f.label + '</label>' + feld +
      '<span class="einheit">' + (f.einheit || "") + '</span><span class="marke" id="mk-' + i + '"></span>';
    box.appendChild(d);
  });
  const fb = document.getElementById("feedback"); fb.style.display = "none";
  const lw = document.getElementById("loesungsweg"); lw.style.display = "none"; lw.innerHTML = "";
}
function pruefen() {
  const a = AUFGABEN[akt]; let richtig = 0, leer = 0;
  a.felder.forEach((f, i) => {
    const el = document.getElementById("ein-" + i), mk = document.getElementById("mk-" + i);
    let ok = false;
    if (f.typ === "wahl") { if (el.value === "") leer++; ok = el.value === f.ans; }
    else { const e = parseKomma(el.value); if (isNaN(e)) leer++; ok = !isNaN(e) && Math.abs(e - f.ans) <= f.tol + 1e-9; }
    mk.textContent = ok ? "✓" : "✗"; mk.className = "marke " + (ok ? "ok" : "no");
    if (ok) richtig++;
  });
  const fb = document.getElementById("feedback"), n = a.felder.length;
  if (richtig === n) { fb.className = "feedback richtig"; fb.textContent = "✓ Alles richtig – super!"; starteKonfetti(); }
  else if (leer === n) { fb.className = "feedback teilweise"; fb.textContent = "Bitte füllen Sie zuerst die Felder aus."; }
  else { fb.className = "feedback falsch"; fb.textContent = richtig + " von " + n + " richtig. Prüfen Sie die Felder mit ✗."; }
  fb.style.display = "block";
}
function zeigeLoesung() {
  const lw = document.getElementById("loesungsweg");
  lw.innerHTML = "<h3>Lösungsweg</h3>" + AUFGABEN[akt].loesung; lw.style.display = "block";
}
function starteKonfetti() {
  const farben = ["#C8102E", "#2e7d32", "#d6a300", "#2a6fa1", "#8e44ad"];
  for (let i = 0; i < 50; i++) {
    const k = document.createElement("div"); k.className = "konfetti";
    k.style.left = Math.random() * 100 + "vw";
    k.style.background = farben[Math.floor(Math.random() * farben.length)];
    k.style.animation = "konfettiFall " + (1.5 + Math.random() * 1.5) + "s ease-in forwards";
    k.style.animationDelay = (Math.random() * .3) + "s";
    if (Math.random() > .5) k.style.borderRadius = "50%";
    document.body.appendChild(k); setTimeout(() => k.remove(), 3500);
  }
}
