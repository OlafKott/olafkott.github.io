<title>Lösung – 1. Klausur Statistik HAN</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #e9e9ec; font-family: "Liberation Serif", "Times New Roman", Times, serif; color: #1a1a1a; font-size: 11.5pt; line-height: 1.5; }
.page { width: 210mm; height: 297mm; margin: 8mm auto; background: #fff; padding: 12mm 15mm 9mm 17mm; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.15); break-after: page; page-break-after: always; }
.page:last-child { break-after: auto; page-break-after: auto; }
@media print { body { background: #fff; } .page { margin: 0; box-shadow: none; } }
.content { flex: 1; }
.red { color: #1f5fa6; }
p { margin: 0 0 0.6mm 0; }
b { font-weight: bold; }

/* Kopf Seite 1 */
.hd1 { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.2px solid #1f5fa6; padding-bottom: 3mm; }
.hd1 h1 { font-size: 19pt; color: #1f5fa6; margin: 0 0 1mm 0; line-height: 1.2; }
.hd1 .sub { color: #444; font-size: 10.5pt; }
.hd1 img { height: 17mm; }
.namerow { display: flex; gap: 8mm; margin: 4mm 0 4mm 0; }
.namerow div { flex: 1; border-bottom: 1.2px solid #888; color: #555; font-size: 10.5pt; padding-bottom: 0.5mm; }
.hint { border: 1.3px solid #2a6fb0; background: #eaf2fb; border-radius: 6px; padding: 2.5mm 4mm; font-size: 11pt; margin-bottom: 4mm; }
.hint .t { color: #1f6fb5; font-weight: bold; }

/* Kopf Folgeseiten */
.hd2 { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.2px solid #1f5fa6; padding-bottom: 2mm; margin-bottom: 4mm; }
.hd2 .t { font-size: 13pt; color: #1f5fa6; font-weight: bold; line-height: 1.2; }
.hd2 .s { font-size: 10pt; color: #555; }
.hd2 .nf { display: flex; gap: 4mm; font-size: 10pt; color: #555; }
.hd2 .nf div { border-bottom: 1.2px solid #888; padding-bottom: 0.3mm; }

/* Aufgabenkopf */
.task { display: flex; align-items: center; justify-content: space-between; background: #e6eef8; border-left: 5px solid #1f5fa6; padding: 1.6mm 3mm 1.6mm 3.5mm; margin: 0 0 2.5mm 0; }
.task h2 { margin: 0; font-size: 13.5pt; color: #1f5fa6; line-height: 1.3; }
.task h2 span { margin-left: 2.5mm; }
.tot { display: flex; align-items: center; gap: 1.5mm; color: #555; font-size: 11pt; white-space: nowrap; }
.tot .f { width: 17mm; height: 7.5mm; border: 1.3px solid #999; border-radius: 2.5mm; background: #fff; }

/* Teilaufgaben */
.q { margin: 3mm 0 1.5mm 0; }
.q .l { font-weight: bold; }
.pt { font-weight: bold; color: #333; }
.ind { padding-left: 5.5mm; }

/* Schreibfelder mit Punktefeld */
.arow { display: flex; gap: 3mm; align-items: flex-end; margin-bottom: 2mm; }
.wbox { flex: 1; border: 1px solid #c4cedb; border-radius: 6px; background-color: #fff;
  background-image: linear-gradient(#dfe7f1 1px, transparent 1px), linear-gradient(90deg, #dfe7f1 1px, transparent 1px);
  background-size: 5mm 5mm; background-position: -1px -1px; position: relative; }
.wbox .lbl { position: absolute; top: 0.8mm; left: 2mm; font-size: 9pt; color: #777; background: rgba(255,255,255,.85); padding: 0 1mm; }
.pbox { width: 26mm; display: flex; align-items: center; gap: 1.2mm; color: #555; font-size: 10pt; white-space: nowrap; }
.pbox .f { width: 13mm; height: 7mm; border: 1.2px solid #999; border-radius: 2.2mm; background: #fff; }

/* Tabellen */
table.tb { border-collapse: collapse; font-family: Carlito, Calibri, "Liberation Sans", Arial, sans-serif; font-size: 10.5pt; }
.tb th, .tb td { border: 1px solid #9a8f80; padding: 1.2mm 1.6mm; text-align: center; vertical-align: middle; line-height: 1.25; }
.tb th { background: #f5f0e8; font-weight: bold; }
.tb td.l, .tb th.l { text-align: left; }
.tb .fc { height: 8mm; border: 1.1px solid #999; border-radius: 2.2mm; background: #fff; }
.tb td.grey { background: #ececec; }
.cb { display: inline-block; width: 4.4mm; height: 4.4mm; border: 1.3px solid #444; border-radius: 1.2mm; vertical-align: -0.8mm; background: #fff; }
.chk { display: flex; gap: 12mm; margin: 1mm 0 2mm 0.5mm; }
.chk span.o { display: inline-flex; align-items: center; gap: 2mm; }

.data { border: 1px solid #c9c2b6; background: #fbfaf7; border-radius: 6px; padding: 2.5mm 4mm; margin: 1.5mm 0 2mm 0; }
.card { border: 1px solid #c9c2b6; background: #fbfaf7; border-radius: 6px; padding: 2.5mm 3.5mm; }
.card .h { color: #1f5fa6; font-weight: bold; margin-bottom: 1mm; }
.sent { display: flex; align-items: center; gap: 2mm; margin: 5mm 0; }
.sent .f { width: 17mm; height: 8mm; border: 1.2px solid #999; border-radius: 2.2mm; background: #fff; }

footer { display: flex; justify-content: space-between; border-top: 1px solid #ccc; padding-top: 1.5mm; font-size: 8.5pt; color: #777; }

/* Bewertung (grün) */
.gtask { display: flex; align-items: center; background: #e8f5e9; border-left: 5px solid #2e7d32; padding: 1.6mm 3.5mm; margin: 0 0 3mm 0; }
.gtask h2 { margin: 0; font-size: 13.5pt; color: #2e7d32; }
.tb td.gs, .tb th.gs { background: #e8f5e9; }
.gbox { border: 1.4px solid #2e7d32; border-radius: 7px; padding: 2.5mm 4mm; }
.gbox .h { color: #2e7d32; font-weight: bold; }
.line { border-bottom: 1px solid #999; height: 8mm; }
.code { display: inline-flex; gap: 2mm; vertical-align: middle; }
.code span { width: 8mm; height: 10mm; border: 1.2px solid #777; border-radius: 2.2mm; display: inline-block; background: #fff; }

/* Einfache Sprache: Teilaufgaben */
.st { display: grid; grid-template-columns: 7mm 1fr; margin: 5mm 0 1mm 4mm; }
.st .lt { font-weight: bold; }
.st .tx { min-width: 0; }
.st .sb { margin-top: 2mm; }
.task.cont { justify-content: flex-start; }
.tb th.sm { font-size: 9.5pt; }
.note { font-size: 9.5pt; color: #666; margin: 5mm 0 1mm 11mm; }
.intro { display: flex; gap: 6mm; align-items: center; border: 1px solid #c9c2b6; background: #fbfaf7; border-radius: 6px; padding: 3mm 4mm; margin-bottom: 4mm; }
.intro .itx { flex: 1; }
.intro .ih { color: #1f5fa6; font-weight: bold; font-size: 12.5pt; margin-bottom: 1mm; }
.intro img { width: 62mm; border-radius: 4px; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 1mm; line-height: 1.35; }
.frac > span:first-child { border-bottom: 1.2px solid #000; padding: 0 1.5mm; }
.opts { display: flex; flex-direction: column; gap: 2mm; }
.opt { display: flex; align-items: center; gap: 3mm; border: 1px solid #c9c2b6; background: #fbfaf7; border-radius: 6px; padding: 1.5mm 3mm; font-size: 12pt; }
.fc { border: 1.1px solid #999; border-radius: 2.2mm; background: #fff; }
.claim { border: 1px solid #c9c2b6; background: #fbfaf7; border-radius: 6px; padding: 2mm 3mm 0.5mm 3mm; margin-bottom: 2.5mm; }
.claim .wbox { background-color: #fff; }
/* Aufgabe 1: Art und Skala getrennt */
.tb th.art { background: #e3edf8; }
.tb th.sk { background: #fbeedd; }
.tb td.artc { background: #f7faff; }
.tb td.skc { background: #fffaf3; }
.tb .gap { border: none !important; background: transparent !important; }
/* Musterlösung */
.ans { font-family: Carlito, Calibri, sans-serif; font-style: italic; color: #1d4ed8; font-size: 11pt; }
.ansbox { font-family: Carlito, Calibri, sans-serif; font-style: italic; color: #1d4ed8; font-size: 10.5pt; line-height: 1.4; padding: 5.4mm 3mm 1mm 3mm; }
.ansbox .frac > span:first-child { border-bottom-color: #1d4ed8; }
.fc { display: flex; align-items: center; justify-content: center; }
.cb.x { color: #1d4ed8; font-family: Carlito, sans-serif; font-weight: bold; font-size: 12pt; line-height: 4mm; text-align: center; }
.solbadge { display: inline-block; background: #1d4ed8; color: #fff; font-size: 0.6em; padding: 0.5mm 2.5mm; border-radius: 2mm; vertical-align: middle; font-family: Carlito, sans-serif; }

.sqrt { display: inline-flex; align-items: flex-start; white-space: nowrap; }
.sqrt .rad { font-style: normal; font-size: 1.15em; line-height: 1; margin-right: -0.5px; }
.sqrt .rc { border-top: 1.2px solid currentColor; padding: 0 1.5px; margin-top: 0.12em; line-height: 1.15; }

.pbox .f, .tot .f { display: flex; align-items: center; justify-content: center; }
.pv { font-family: Carlito, sans-serif; font-weight: bold; color: #2e7d32; font-size: 11pt; }

.pp { color: #2e7d32; font-style: normal; font-weight: bold; font-size: 8.5pt; white-space: nowrap; }

.teil { display:flex; justify-content:space-between; align-items:center; background:#1f5fa6; color:#fff; border-radius:6px; padding:2mm 4mm; margin:0 0 3.5mm 0; }
.teil .n { font-weight:bold; font-size:13pt; }
.teil .e { font-size:10.5pt; }
.merk { border:1.3px solid #2a6fb0; background:#eaf2fb; border-radius:6px; padding:2mm 4mm; margin:1.5mm 0 2mm 0; font-size:11pt; }
.merk .t { color:#1f6fb5; font-weight:bold; }
.lz { display:inline-flex; align-items:center; justify-content:center; min-width:20mm; height:7.5mm; border:1.1px solid #999; border-radius:2.2mm; background:#fff; vertical-align:middle; margin:0 1mm; padding:0 1.5mm; }
.frame { line-height:2.3; }
.info { font-family: Carlito, Calibri, sans-serif; font-style: normal; color:#6b7280; font-size:9.5pt; }
.tb td.y { font-size:10pt; }
.small { font-size:10pt; color:#555; }

.hint2 { border:1.3px solid #2a6fb0; background:#eaf2fb; border-radius:8px; padding:2.6mm 4mm 2.4mm 4mm; margin-bottom:4mm; font-size:11pt; }
.hint2 .t { color:#1f6fb5; font-weight:bold; font-size:12pt; margin-bottom:1.5mm; }
.tiles { display:flex; gap:3mm; margin:0 0 1.6mm 0; }
.tile { flex:1; background:#fff; border:1px solid #9cc0e4; border-left:4px solid #1f6fb5; border-radius:6px; padding:1.4mm 3mm; display:flex; justify-content:space-between; align-items:center; }
.tile .k { font-weight:bold; color:#1f6fb5; }
.tile .m { color:#444; font-size:10.5pt; }
.tile .v { font-weight:bold; white-space:nowrap; }
.cas { background:#fff7e0; border:1px solid #e6c36a; border-radius:6px; padding:1.4mm 3mm; margin:0 0 2mm 0; font-size:10.8pt; }
ul.dash { list-style:none; margin:0; padding:0; }
ul.dash li { position:relative; padding-left:5mm; margin:0.5mm 0; }
ul.dash li::before { content:"–"; position:absolute; left:0.5mm; color:#1f6fb5; font-weight:bold; }

.hint2 ul.dash { columns:2; column-gap:7mm; font-size:10.5pt; }
.hint2 ul.dash li { break-inside:avoid; }
.eqr { display:flex; align-items:center; gap:2.5mm; margin:2.5mm 0; }
.eqr .lh { width:11mm; text-align:right; font-size:12.5pt; white-space:nowrap; }
.eqr .eq { font-size:12.5pt; }
.intro.c { padding:2.5mm 4mm; margin-bottom:3.5mm; }

#lock { max-width: 520px; margin: 40px auto; background: #fff; border-top: 6px solid #1f5fa6; border-radius: 10px; padding: 20px 22px;
  box-shadow: 0 1px 6px rgba(0,0,0,.12); font-family: "Liberation Serif", "Times New Roman", serif; }
#lock h1 { color: #1f5fa6; font-size: 1.45em; margin: 0 0 4px 0; }
#lock input { font-size: 1.6em; letter-spacing: .4em; width: 6.5em; padding: 8px 10px; text-align: center; border: 1px solid #c4c4c8; border-radius: 8px; background: #f4f4f5; }
#lock button { font-size: 1.05em; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f5fa6; color: #fff; cursor: pointer; }
#out { transform-origin: top left; }
@media print { #lock { display: none; } }

const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openIt(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u(D.i)}, key, u(D.d)));

function fit() {
  const out = document.getElementById('out');
  const pageW = 210 * 96 / 25.4 + 16;           // Seitenbreite in px + Rand
  const z = Math.min(1, window.innerWidth / pageW);
  out.style.zoom = z;
}
window.addEventListener('resize', fit);
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('c').value.trim();
  const msg = document.getElementById('msg');
  if (!/^[0-9]{4}$/.test(code)) { msg.style.color = '#1f5fa6'; msg.textContent = 'Bitte genau 4 Ziffern eingeben.'; return; }
  msg.style.color = '#555'; msg.textContent = 'Prüfe Code …';
  try {
    document.getElementById('out').innerHTML = await openIt(code);
    document.getElementById('lock').style.display = 'none';
    fit();
  } catch (err) {
    msg.style.color = '#1f5fa6'; msg.textContent = 'Der Code ist falsch. Bitte noch einmal versuchen.';
  }
});
