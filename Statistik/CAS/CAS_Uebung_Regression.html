<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS-Übung: Regressionsgerade</title>
<style>
:root{ --lf:#1F4E99; --ink:#1d1d1f; --mute:#5b6270; --line:#dde1e7; --bg:#f3f4f6; --ok:#2E7D32; --okbg:#E8F5E9; --no:#C62828; --nobg:#FDECEA; --warn:#8a5a00; --warnbg:#FFF8E8; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5; }
.top{ background:#fff; border-bottom:1px solid var(--line); }
.top .in{ max-width:860px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; }
.top h1{ font-size:20px; margin:0; color:var(--lf); flex:1; }
.top h1 small{ display:block; font-size:13px; color:var(--mute); font-weight:normal; }
.top img{ height:28px; }
.wrap{ max-width:860px; margin:16px auto 40px; padding:0 16px; }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.tabs button{ font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.card h2{ margin:0 0 6px; font-size:18px; }
.auftrag{ font-size:15.5px; margin:0 0 10px; }
.round{ display:inline-block; background:var(--warnbg); border-left:4px solid #F2B705; padding:4px 10px; border-radius:4px; font-size:14.5px; margin:2px 0 12px; }
.round b{ color:var(--warn); }
.dt{ overflow-x:auto; }
table.d{ border-collapse:collapse; font-size:16px; margin:2px 0 4px; }
table.d th, table.d td{ border:1px solid #c3c8d0; padding:4px 10px; text-align:center; min-width:40px; }
table.d th{ background:#eef0f3; font-family:Cambria,Georgia,serif; font-style:italic; }
.spalten{ font-size:13.5px; color:var(--mute); margin-top:6px; }
.liste{ font-family:Consolas,'Courier New',monospace; background:#eceef1; border-radius:3px; padding:0 4px; font-weight:bold; color:#222; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }
.f{ display:grid; grid-template-columns:1fr 120px 26px; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
.f label{ font-size:15px; }
.f label .z{ color:var(--mute); font-family:Cambria,Georgia,serif; font-size:14px; }
.f input{ font:inherit; font-size:16px; width:120px; padding:5px 8px; border:1px solid #b8bdc6; border-radius:6px; background:#f7f8fa; text-align:right; }
.f .m{ font-weight:bold; font-size:18px; text-align:center; }
.f.ok{ background:var(--okbg); } .f.ok .m{ color:var(--ok); }
.f.no{ background:var(--nobg); } .f.no .m{ color:var(--no); }
.f.fmt{ background:var(--warnbg); } .f.fmt .m{ color:var(--warn); }
.f .msg{ grid-column:1 / -1; font-size:13.5px; display:none; }
.f.no .msg, .f.fmt .msg, .f.show .msg{ display:block; }
.f.no .msg{ color:var(--no); } .f.fmt .msg{ color:var(--warn); } .f.show .msg{ color:var(--mute); }
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btns button{ font:inherit; font-size:15.5px; padding:9px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
.btns button.go{ background:var(--lf); border-color:var(--lf); color:#fff; }
.score{ font-size:16px; font-weight:bold; margin-top:12px; min-height:24px; }
.stats{ font-size:13.5px; color:var(--mute); margin-top:4px; }
.hinweis{ font-size:13.5px; color:var(--mute); }
</style></head><body>

<script>
// ---------- Hilfen ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const r2=v=>{ const s=v<0?-1:1; return s*Math.round(Math.abs(v)*100+1e-7)/100; };
const de=(v,d=2)=>r2(v).toFixed(d).replace('.',',');
const deRaw=v=>String(v).replace('.',',');
const med=a=>{ const s=[...a].sort((x,y)=>x-y), n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; };
function kenn(v){ // wie TI-Nspire: Quartile = Median der unteren/oberen Haelfte ohne Median
  const s=[...v].sort((x,y)=>x-y), n=s.length, h=Math.floor(n/2);
  const mean=s.reduce((a,b)=>a+b,0)/n, ss=s.reduce((a,b)=>a+(b-mean)**2,0);
  const q1=med(s.slice(0,h)), q3=med(s.slice(h+n%2));
  return {n, mean, min:s[0], q1, med:med(s), q3, max:s[n-1], R:s[n-1]-s[0], IQR:q3-q1, sig:Math.sqrt(ss/n), sx:Math.sqrt(ss/(n-1))};
}
const LAGE=[["n","Anzahl der Werte","n",true],["mean","Arithmetisches Mittel","x̄"],["min","Minimum","MinX"],["q1","Unteres Quartil","Q₁X"],["med","Median","MedianX"],["q3","Oberes Quartil","Q₃X"],["max","Maximum","MaxX"],["R","Spannweite","MaxX − MinX"],["IQR","Quartilsabstand","Q₃X − Q₁X"],["sig","Standardabweichung","σx"]];

// ---------- Aufgaben erzeugen ----------
function genUr(){
  const n=R(8,13); const v=Array.from({length:n},()=>R(1,20));
  const k=kenn(v);
  return {typ:'ur', h:"Urliste", auftrag:"Bestimmen Sie mit dem CAS die Lage- und Streuungsmaße dieser Urliste.",
    daten:'<table class="d"><tr>'+v.map(x=>`<td>${x}</td>`).join('')+'</tr></table>',
    spalten:'Werte in Spalte A · X1-Liste <span class="liste">a[]</span> · Häufigkeitsliste <span class="liste">1</span>',
    felder:LAGE, wert:k, extra:{sx:k.sx}};
}
function genHf(){
  const m=R(5,6), st=R(1,8), step=[1,1,2,5][R(0,3)];
  const xi=Array.from({length:m},(_,i)=>st+i*step), hi=xi.map(()=>R(1,9));
  const v=xi.flatMap((x,i)=>Array(hi[i]).fill(x)); const k=kenn(v), kf=kenn(xi);
  return {typ:'hf', h:"Häufigkeitstabelle", auftrag:"Bestimmen Sie mit dem CAS die Lage- und Streuungsmaße dieser Häufigkeitstabelle.",
    daten:'<table class="d"><tr><th>x<sub>i</sub></th>'+xi.map(x=>`<td>${x}</td>`).join('')+'</tr><tr><th>h<sub>i</sub></th>'+hi.map(x=>`<td>${x}</td>`).join('')+'</tr></table>',
    spalten:'x<sub>i</sub> in Spalte A, h<sub>i</sub> in Spalte B · X1-Liste <span class="liste">a[]</span> · Häufigkeitsliste <span class="liste">b[]</span>',
    felder:LAGE, wert:k, extra:{sx:k.sx, ohne:kf}};
}
function genReg(){
  const n=R(6,8), st=R(0,3), step=[1,1,2][R(0,2)];
  const sign=Math.random()<0.25?-1:1, m=sign*R(5,30)/10, b=R(-20,60)/10;
  const x=Array.from({length:n},(_,i)=>st+i*step);
  const y=x.map(xx=>Math.round((m*xx+b+(Math.random()-0.5)*1.6*Math.max(1,Math.abs(m)/1.5))*10)/10);
  const mx=x.reduce((a,c)=>a+c,0)/n, my=y.reduce((a,c)=>a+c,0)/n;
  let sxy=0,sxx=0,syy=0; x.forEach((xx,i)=>{ sxy+=(xx-mx)*(y[i]-my); sxx+=(xx-mx)**2; syy+=(y[i]-my)**2; });
  const M=sxy/sxx, B=my-M*mx, r=sxy/Math.sqrt(sxx*syy), x0=x[n-1]+step*R(2,4);
  return {typ:'reg', h:"Regressionsgerade", auftrag:`Bestimmen Sie mit dem CAS die Regressionsgerade und berechnen Sie die Prognose für <i>x</i> = ${x0}.`,
    daten:'<table class="d"><tr><th>x</th>'+x.map(v=>`<td>${deRaw(v)}</td>`).join('')+'</tr><tr><th>y</th>'+y.map(v=>`<td>${v.toFixed(1).replace('.',',')}</td>`).join('')+'</tr></table>',
    spalten:'x-Werte in Spalte A, y-Werte in Spalte B · X-Liste <span class="liste">a[]</span> · Y-Liste <span class="liste">b[]</span> · Kommazahlen mit Punkt eintippen',
    felder:[["m","Steigung","m"],["b","y-Achsenabschnitt","b"],["r","Korrelationskoeffizient","r"],["p",`Prognose für x = ${x0}`,`y(${x0})`]],
    wert:{m:M,b:B,r:r,p:M*x0+B}, extra:{r2:r*r, p2:r2(M)*x0+r2(B)}};
}
const MODES={ur:{name:"Urliste",gen:genUr}, hf:{name:"Häufigkeitstabelle",gen:genHf}, reg:{name:"Regression",gen:genReg}};
const ORDER=["reg"];
let mode=ORDER[0], A=null, stat={a:0,r:0};

// ---------- Anzeige ----------
function neu(){
  A=MODES[mode].gen();
  document.getElementById('tabs').innerHTML=ORDER.length>1?ORDER.map(k=>`<button class="${k===mode?'on':''}" data-m="${k}">${MODES[k].name}</button>`).join(''):'';
  document.getElementById('h').textContent="Aufgabe: "+A.h;
  document.getElementById('auftrag').innerHTML=A.auftrag;
  document.getElementById('daten').innerHTML=A.daten;
  document.getElementById('spalten').innerHTML=A.spalten;
  document.getElementById('felder').innerHTML=A.felder.map(([k,l,z,int])=>
    `<div class="f" id="f_${k}"><label for="i_${k}">${l} <span class="z">${z}</span></label><input id="i_${k}" inputmode="decimal" autocomplete="off" placeholder="${int?'z. B. 12':'0,00'}"><span class="m"></span><div class="msg"></div></div>`).join('');
  document.getElementById('score').textContent='';
  document.querySelectorAll('.f input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') pruefen(); }));
}
function parse(s){ s=s.trim().replace(/\s/g,'').replace(',','.'); if(!/^[-−]?\d+(\.\d+)?$/.test(s)) return null; return {v:parseFloat(s.replace('−','-')), dec:(s.split('.')[1]||'').length}; }
const near=(a,b)=>Math.abs(a-b)<0.0051;
function pruefen(){
  let ok=0, tot=A.felder.length;
  A.felder.forEach(([k,l,z,int])=>{
    const f=document.getElementById('f_'+k), raw=document.getElementById('i_'+k).value, m=f.querySelector('.m'), msg=f.querySelector('.msg');
    f.className='f'; m.textContent=''; msg.textContent='';
    if(!raw.trim()){ return; }
    const p=parse(raw);
    if(!p){ f.classList.add('fmt'); m.textContent='?'; msg.textContent='Bitte nur eine Zahl eintragen, z. B. 6,17.'; return; }
    const soll=A.wert[k];
    const richtig = int ? (p.v===soll) : (near(p.v,r2(soll)) || (k==='p' && near(p.v,r2(A.extra.p2))));
    if(!int && p.dec!==2){
      f.classList.add('fmt'); m.textContent='!';
      msg.textContent=`Bitte genau 2 Stellen nach dem Komma eintragen${richtig||near(p.v,soll)?' – der Wert selbst stimmt fast.':'.'}`; return;
    }
    if(richtig){ f.classList.add('ok'); m.textContent='✓'; ok++; return; }
    f.classList.add('no'); m.textContent='✗';
    let t='Das stimmt noch nicht.';
    if(k==='sig' && near(p.v,r2(A.extra.sx))) t='Das ist sx. Gesucht ist σx (Sigma x), die Zeile darunter.';
    else if(A.typ==='hf' && A.extra.ohne && near(p.v, k==='n'?A.extra.ohne.n:r2(A.extra.ohne[k]))) t='Dieser Wert passt zu einer Rechnung ohne Häufigkeitsliste. Wählen Sie bei „Häufigkeitsliste“ b[].';
    else if(k==='r' && near(p.v,r2(A.extra.r2))) t='Das ist r². Gesucht ist r, die Zeile darunter.';
    else if(k==='R') t='Spannweite = MaxX − MinX.';
    else if(k==='IQR') t='Quartilsabstand = Q₃X − Q₁X.';
    else if(k==='m'||k==='b') t='Prüfen Sie X-Liste a[] und Y-Liste b[] und ob alle Werte richtig eingetippt sind.';
    else if(k==='p') t='Setzen Sie den x-Wert in y = m·x + b ein (oder f1(x) auf einer Calculator-Seite).';
    msg.textContent=t;
  });
  stat.a++; if(ok===tot) stat.r++;
  document.getElementById('score').innerHTML = ok===tot ? `<span style="color:var(--ok)">Alles richtig! ${ok} von ${tot}. Klicken Sie auf „Neue Aufgabe“.</span>` : `${ok} von ${tot} richtig.`;
  document.getElementById('stats').textContent=`Geprüft: ${stat.a} · komplett richtig: ${stat.r}`;
}
function zeigen(){
  A.felder.forEach(([k,l,z,int])=>{
    const f=document.getElementById('f_'+k), msg=f.querySelector('.msg');
    if(!f.classList.contains('ok')){ f.classList.add('show'); msg.textContent='Lösung: '+(int?A.wert[k]:de(A.wert[k])); }
  });
}
document.getElementById('pruefen').onclick=pruefen;
document.getElementById('zeigen').onclick=zeigen;
document.getElementById('neu').onclick=neu;
document.getElementById('tabs').onclick=e=>{ const m=e.target.dataset.m; if(m){ mode=m; neu(); } };
const h=(location.hash||'').slice(1); if(MODES[h]&&ORDER.includes(h)) mode=h;
neu();
</script>
</body></html>
