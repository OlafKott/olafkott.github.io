<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>L&ouml;sung &ndash; Vorbereitung Boxplot</title><style>
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
     background:#eef1f4; color:#1d1d1f;}
.wrap{max-width:1180px; margin:0 auto; padding:18px 18px 46px;}
header{background:#C8102E; color:#fff; border-radius:14px; padding:14px 20px; margin-bottom:14px;
       display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;}
header h1{margin:0; font-size:22px;}
header .sub{font-size:14.5px; opacity:.92;}
.tabs{display:flex; gap:8px; flex-wrap:wrap;}
.tab{background:rgba(255,255,255,.18); color:#fff; border:2px solid rgba(255,255,255,.5);
     border-radius:10px; padding:7px 15px; font-size:15px; font-weight:700; cursor:pointer;}
.tab.an{background:#fff; color:#C8102E; border-color:#fff;}
section{background:#fff; border-radius:14px; padding:16px 20px 20px; margin-bottom:14px;
        box-shadow:0 1px 4px rgba(20,40,60,.08);}
.schritt{font-size:20px; font-weight:700; color:#C8102E; margin:0 0 2px;}
.erkl{font-size:16.5px; color:#333; min-height:52px; margin:0 0 10px; line-height:1.6;}
.erkl b{color:#C8102E;}
.reihe{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px;}
.zelle{width:52px; text-align:center; border:2px solid #cfd6dd; border-radius:8px; padding:7px 0;
        font-size:19px; font-weight:600; background:#F7F9FB; transition:all .18s;}
.zelle .rang{display:block; font-size:10.5px; font-weight:400; color:#8a8478; margin-top:2px;}
.zelle.med{border-color:#C8102E; background:#FDE4EA; color:#C8102E;}
.zelle.q1, .zelle.q3{border-color:#1D70B8; background:#E4EFFA; color:#1D70B8;}
.zelle.unten{background:#F2F6FA;}
.zelle.oben{background:#F2F6FA;}
.zelle.blass{opacity:.32;}
svg{display:block; width:100%; height:auto; margin-top:6px;}
.steuer{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px;}
button.nav{font-family:inherit; font-size:17px; font-weight:700; border-radius:10px;
           padding:12px 26px; border:2px solid #C8102E; background:#C8102E; color:#fff;
           cursor:pointer;}
button.nav.sek{background:#fff; color:#C8102E;}
button.nav:disabled{opacity:.35; cursor:default;}
.punkte{display:flex; gap:7px; margin-left:auto;}
.punkt{width:12px; height:12px; border-radius:50%; background:#d3dae1;}
.punkt.an{background:#C8102E;}
.kennz{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.kbox{border:2px solid #cfd6dd; border-radius:10px; padding:8px 16px; font-size:16px;
      background:#F7F9FB;}
.kbox b{display:block; font-size:12.5px; color:#777; font-weight:600;}
.kbox span{font-size:21px; font-weight:700;}
.hinweis{font-size:14.5px; color:#666; margin-top:10px;}
@media (max-width:640px){ .zelle{width:42px; font-size:17px;} header h1{font-size:19px;} }
</style></head><body><div class="wrap"><header><div><h1>L&ouml;sung zur Vorbereitung</h1><div class="sub">Boxplot &middot; vier Aufgaben Schritt f&uuml;r Schritt</div></div><div class="tabs"><button class="tab">Aufgabe 1</button><button class="tab">Aufgabe 2</button><button class="tab">Aufgabe 3</button><button class="tab">Aufgabe 4</button></div></header><section><div class="schritt" id="titel"></div><div style="font-size:15px;color:#777;margin-bottom:8px" id="sname"></div><div class="erkl" id="erkl"></div><div class="reihe" id="reihe"></div><div id="plot"></div><div class="kennz" id="kennz"></div><div class="steuer"><button class="nav sek" id="zurueck">&larr; Zur&uuml;ck</button><button class="nav" id="weiter">Weiter &rarr;</button><div class="punkte"><div class="punkt"></div><div class="punkt"></div><div class="punkt"></div><div class="punkt"></div><div class="punkt"></div><div class="punkt"></div><div class="punkt"></div></div></div><div class="hinweis">Mit den Pfeiltasten oder der Leertaste k&ouml;nnen Sie ebenfalls weiterklicken.</div></section></div><script>var ROT='#C8102E'; var BLAU='#1D70B8';

var AUF = [{"nr": 1, "daten": [9, 3, 14, 5, 17, 8, 5, 11, 2, 16, 6, 13, 10]}, {"nr": 2, "daten": [6, 12, 4, 9, 15, 7, 11, 3, 8, 13, 5, 10, 16, 9]}, {"nr": 3, "daten": [11, 4, 7, 15, 9, 6, 13, 8, 18, 5, 10, 12, 7, 14, 9]}, {"nr": 4, "daten": [10, 5, 13, 8, 16, 6, 11, 14, 4, 9, 12, 7, 15, 9, 3, 11]}];
var SCHRITT = [["Die Daten", "So stehen die Zahlen auf dem Blatt &ndash; ungeordnet."], ["Die Rangliste", "Zuerst ordnen wir die Zahlen der Gr&ouml;&szlig;e nach."], ["Der Median", ""], ["Das untere Quartil", ""], ["Das obere Quartil", ""], ["Minimum und Maximum", "Die Antennen gehen bis zum kleinsten und zum gr&ouml;&szlig;ten Wert."], ["Fertig", "Alle f&uuml;nf Kennzahlen auf einen Blick."]];
var akt = 0, schritt = 0;

function medOf(a){
  var m = a.length;
  return m % 2 ? a[(m-1)/2] : (a[m/2-1] + a[m/2]) / 2;
}
function kennzahlen(s){
  var n = s.length, k = {};
  k.med = medOf(s);
  k.unten = n % 2 ? s.slice(0, (n-1)/2) : s.slice(0, n/2);
  k.oben  = n % 2 ? s.slice((n+1)/2)    : s.slice(n/2);
  k.q1 = medOf(k.unten); k.q3 = medOf(k.oben);
  k.min = s[0]; k.max = s[n-1];
  k.iMed = n % 2 ? [(n-1)/2] : [n/2-1, n/2];
  k.iUnten = []; for (var i=0;i<k.unten.length;i++) k.iUnten.push(i);
  var off = n - k.oben.length;
  k.iOben = []; for (var j=0;j<k.oben.length;j++) k.iOben.push(off+j);
  var L = k.unten.length;
  k.iQ1 = L % 2 ? [(L-1)/2] : [L/2-1, L/2];
  var O = k.oben.length;
  k.iQ3 = (O % 2 ? [(O-1)/2] : [O/2-1, O/2]).map(function(i){ return off + i; });
  return k;
}
function z(v){ return String(v).replace('.', ','); }

function X(v){ return 60 + v * (700 - 60) / 20; }

function plot(k, bis){
  var y = 58, h = 46, o = [];
  o.push('<svg viewBox="0 0 740 130" xmlns="http://www.w3.org/2000/svg">');
  for (var v = 0; v <= 20; v += 2){
    o.push('<line x1="'+X(v)+'" y1="10" x2="'+X(v)+'" y2="96" stroke="#edf0f3" stroke-width="1"/>');
  }
  o.push('<line x1="50" y1="104" x2="714" y2="104" stroke="#333" stroke-width="1.6"/>');
  o.push('<polygon points="722,104 712,99 712,109" fill="#333"/>');
  for (var w = 0; w <= 20; w++){
    var gr = (w % 2 === 0);
    o.push('<line x1="'+X(w)+'" y1="'+(104-(gr?6:3))+'" x2="'+X(w)+'" y2="'+(104+(gr?6:3))+'" stroke="#333" stroke-width="1"/>');
    if (gr) o.push('<text x="'+X(w)+'" y="122" text-anchor="middle" font-size="12" fill="#555">'+w+'</text>');
  }
  if (bis >= 4){
    o.push('<rect x="'+X(k.q1)+'" y="'+(y-h/2)+'" width="'+(X(k.q3)-X(k.q1))+'" height="'+h+'" fill="#E4EFFA" stroke="'+BLAU+'" stroke-width="2.5"/>');
  } else if (bis === 3){
    o.push('<line x1="'+X(k.q1)+'" y1="'+(y-h/2)+'" x2="'+X(k.q1)+'" y2="'+(y+h/2)+'" stroke="'+BLAU+'" stroke-width="2.5"/>');
  }
  if (bis >= 5){
    o.push('<line x1="'+X(k.min)+'" y1="'+y+'" x2="'+X(k.q1)+'" y2="'+y+'" stroke="'+BLAU+'" stroke-width="2"/>');
    o.push('<line x1="'+X(k.q3)+'" y1="'+y+'" x2="'+X(k.max)+'" y2="'+y+'" stroke="'+BLAU+'" stroke-width="2"/>');
    [k.min, k.max].forEach(function(v){
      o.push('<line x1="'+X(v)+'" y1="'+(y-h/2)+'" x2="'+X(v)+'" y2="'+(y+h/2)+'" stroke="'+BLAU+'" stroke-width="2"/>');
    });
  }
  if (bis >= 2){
    o.push('<line x1="'+X(k.med)+'" y1="'+(y-h/2)+'" x2="'+X(k.med)+'" y2="'+(y+h/2)+'" stroke="'+ROT+'" stroke-width="3.5"/>');
    o.push('<text x="'+X(k.med)+'" y="'+(y-h/2-8)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+ROT+'">'+z(k.med)+'</text>');
  }
  if (bis >= 3) o.push('<text x="'+X(k.q1)+'" y="'+(y+h/2+16)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+BLAU+'">'+z(k.q1)+'</text>');
  if (bis >= 4) o.push('<text x="'+X(k.q3)+'" y="'+(y+h/2+16)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+BLAU+'">'+z(k.q3)+'</text>');
  if (bis >= 5){
    o.push('<text x="'+X(k.min)+'" y="'+(y-h/2-8)+'" text-anchor="middle" font-size="12.5" fill="#555">'+z(k.min)+'</text>');
    o.push('<text x="'+X(k.max)+'" y="'+(y-h/2-8)+'" text-anchor="middle" font-size="12.5" fill="#555">'+z(k.max)+'</text>');
  }
  o.push('</svg>');
  return o.join('');
}

function zeichne(){
  var a = AUF[akt], s = a.daten.slice().sort(function(x,y){ return x-y; });
  var k = kennzahlen(s), n = s.length;
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('an', i===akt); });
  document.getElementById('titel').innerHTML = 'Aufgabe ' + a.nr + ' <span class="sub">&middot; ' + n + ' Werte</span>';
  document.getElementById('sname').innerHTML = SCHRITT[schritt][0];

  var txt = SCHRITT[schritt][1];
  if (schritt === 2){
    txt = n % 2
      ? 'Bei <b>' + n + '</b> Werten ist die Anzahl <b>ungerade</b>. Genau ein Wert steht in der Mitte: Platz ' + ((n+1)/2) + '. Der Median ist <b>' + z(k.med) + '</b>.'
      : 'Bei <b>' + n + '</b> Werten ist die Anzahl <b>gerade</b>. Zwei Werte stehen in der Mitte: Platz ' + (n/2) + ' und ' + (n/2+1) + '. Der Median liegt dazwischen: (' + z(s[n/2-1]) + ' + ' + z(s[n/2]) + ') : 2 = <b>' + z(k.med) + '</b>.';
  }
  if (schritt === 3){
    var L = k.unten.length;
    txt = 'Die <b>untere H&auml;lfte</b> hat ' + L + ' Werte' + (n % 2 ? ' (der Median z&auml;hlt nicht mit)' : '') + '. '
      + (L % 2
        ? 'Ihr mittlerer Wert ist das untere Quartil: <b>' + z(k.q1) + '</b>.'
        : 'Ihre beiden mittleren Werte sind ' + z(k.unten[L/2-1]) + ' und ' + z(k.unten[L/2]) + '. Das untere Quartil ist <b>' + z(k.q1) + '</b>.');
  }
  if (schritt === 4){
    var O = k.oben.length;
    txt = 'Die <b>obere H&auml;lfte</b> hat ' + O + ' Werte. '
      + (O % 2
        ? 'Ihr mittlerer Wert ist das obere Quartil: <b>' + z(k.q3) + '</b>.'
        : 'Ihre beiden mittleren Werte sind ' + z(k.oben[O/2-1]) + ' und ' + z(k.oben[O/2]) + '. Das obere Quartil ist <b>' + z(k.q3) + '</b>.');
  }
  document.getElementById('erkl').innerHTML = txt;

  var reihe = document.getElementById('reihe');
  reihe.innerHTML = '';
  var werte = (schritt === 0) ? a.daten : s;
  werte.forEach(function(v, i){
    var d = document.createElement('div');
    d.className = 'zelle';
    if (schritt >= 1){
      if (schritt === 3 && k.iUnten.indexOf(i) < 0 && k.iMed.indexOf(i) < 0) d.classList.add('blass');
      if (schritt === 4 && k.iOben.indexOf(i) < 0 && k.iMed.indexOf(i) < 0) d.classList.add('blass');
      if (schritt === 3 && k.iUnten.indexOf(i) >= 0) d.classList.add('unten');
      if (schritt === 4 && k.iOben.indexOf(i) >= 0) d.classList.add('oben');
      if (schritt >= 2 && k.iMed.indexOf(i) >= 0) d.classList.add('med');
      if (schritt >= 3 && k.iQ1.indexOf(i) >= 0) d.classList.add('q1');
      if (schritt >= 4 && k.iQ3.indexOf(i) >= 0) d.classList.add('q3');
    }
    d.innerHTML = v + (schritt >= 1 ? '<span class="rang">' + (i+1) + '</span>' : '<span class="rang">&nbsp;</span>');
    reihe.appendChild(d);
  });

  document.getElementById('plot').innerHTML = (schritt >= 2) ? plot(k, schritt) : '';
  var kz = document.getElementById('kennz');
  if (schritt >= 6){
    kz.innerHTML = [['Minimum', k.min], ['unteres Quartil', k.q1], ['Median', k.med],
                    ['oberes Quartil', k.q3], ['Maximum', k.max],
                    ['Quartilsabstand', k.q3 - k.q1]]
      .map(function(p){ return '<div class="kbox"><b>' + p[0] + '</b><span>' + z(p[1]) + '</span></div>'; })
      .join('');
  } else { kz.innerHTML = ''; }

  document.querySelectorAll('.punkt').forEach(function(p,i){ p.classList.toggle('an', i <= schritt); });
  document.getElementById('zurueck').disabled = (schritt === 0);
  document.getElementById('weiter').disabled = (schritt === SCHRITT.length - 1);
}

document.getElementById('weiter').addEventListener('click', function(){
  if (schritt < SCHRITT.length - 1){ schritt++; zeichne(); }
});
document.getElementById('zurueck').addEventListener('click', function(){
  if (schritt > 0){ schritt--; zeichne(); }
});
document.querySelectorAll('.tab').forEach(function(t, i){
  t.addEventListener('click', function(){ akt = i; schritt = 0; zeichne(); });
});
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('weiter').click(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('zurueck').click(); }
});
zeichne();
</script></body></html>
