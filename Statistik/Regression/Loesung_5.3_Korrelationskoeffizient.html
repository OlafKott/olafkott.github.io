<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lösung 5.3 – Korrelationskoeffizient</title><style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; --blue:#1D70B8; --ok:#2E7D32; --sol:#C8102E; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.6; font-size:13.6px; }
.page{ width:210mm; height:297mm; margin:10px auto; padding:13mm 14mm 10mm; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18);
       display:flex; flex-direction:column; overflow:hidden; }
.page-content{ flex:1 1 auto; }
.page-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--rwb); padding-bottom:8px; margin-bottom:10px; }
.page-header h1{ font-size:20px; margin:0 0 2px; color:var(--rwb); line-height:1.25; }
.page-header .sub{ font-size:12.5px; color:#444; }
.page-header img{ height:36px; width:auto; }
.namebar{ display:flex; gap:22px; font-size:12px; color:#555; margin:-2px 0 10px; }
.namebar span{ border-bottom:1px solid #999; flex:1; padding-bottom:2px; }
.page-footer{ border-top:1px solid var(--line); margin-top:8px; padding-top:5px; display:flex; justify-content:space-between; font-size:10.5px; color:#888; }
h2.task{ color:var(--rwb); font-size:14.5px; margin:12px 0 4px; border-left:4px solid var(--rwb); padding-left:9px; line-height:1.35; break-after:avoid; }
p{ margin:3px 0 6px; }
.ctx{ background:#FBEEF0; border-left:4px solid var(--rwb); border-radius:4px; padding:7px 12px; margin:4px 0 8px; }
.mail{ border:1px solid #cfcfcf; border-radius:8px; overflow:hidden; margin:2px 0 8px; }
.mail .mh{ background:#f4f4f6; border-bottom:1px solid #ddd; padding:4px 12px; font-family:Calibri,Arial,sans-serif; font-size:11.5px; color:#444; line-height:1.5; }
.mail .mh b{ display:inline-block; width:52px; color:#888; font-weight:400; }
.mail .mb{ padding:6px 12px; }
.merke{ background:#E9F2FB; border:1px solid var(--blue); border-radius:6px; padding:7px 12px; margin:6px 0 8px; break-inside:avoid; }
.merke b.t{ color:var(--blue); display:block; font-family:Calibri,Arial,sans-serif; font-size:13px; margin-bottom:1px; }
.merke ul{ margin:2px 0 0; padding-left:18px; } .merke li{ margin:1px 0; }
.tip{ font-family:Calibri,Arial,sans-serif; font-size:12px; color:#555; }
.eb{ display:inline-block; min-width:12mm; height:7.2mm; line-height:7.2mm; padding:0 4px; vertical-align:middle; text-align:center;
     border:1px solid #cfd4da; background:#EEF0F3; border-radius:5px; margin:0 2px; font-family:Georgia,serif; }
.eb.w{ min-width:42mm; } .eb.xw{ min-width:120mm; text-align:left; } .eb.s{ min-width:9mm; }
.sol .eb{ color:var(--sol); font-weight:bold; }
.ck{ display:inline-block; width:4.2mm; height:4.2mm; border:1.4px solid #555; border-radius:2px; vertical-align:-0.6mm; margin-right:5px; position:relative; }
.sol .ck.on::after{ content:"✗"; position:absolute; left:0.2mm; top:-2.3mm; font-size:16px; color:var(--sol); font-weight:bold; }
.opts{ display:flex; flex-wrap:wrap; gap:6px 22px; margin:3px 0 4px; }
.lines{ margin:3px 0; }
.lines div{ border-bottom:1px solid #b9b9b9; height:9.5mm; color:var(--sol); font-weight:bold; font-size:13px; padding-top:2mm; }
table.dt{ border-collapse:collapse; font-size:13px; margin:4px 0; }
table.dt th,table.dt td{ border:1px solid var(--line); padding:2px 6px; text-align:center; height:8mm; }
table.dt th{ background:#F6F1EA; font-family:Calibri,Arial,sans-serif; }
table.dt td:first-child,table.dt th:first-child{ text-align:left; }
table.dt.tight th,table.dt.tight td{ height:6.1mm; padding:0 6px; line-height:1.3; }
table.dt.tight td .eb{ height:5.2mm; line-height:5.2mm; }
table.dt tr.out td{ background:#FBEEF0; }
table.dt tr.sum td{ background:#FFF1D6; font-weight:bold; border-top:2px solid var(--ink); }
table.dt td .eb{ min-width:15mm; height:6.4mm; line-height:6.4mm; }
table.h th{ text-align:left; } table.h td{ min-width:11mm; }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; line-height:1.15; }
.fr .nu{ border-bottom:1.4px solid currentColor; padding:0 3px 2px; }
.fr .de{ padding:2px 3px 0; }
.calc{ display:grid; grid-template-columns:max-content max-content auto; column-gap:8px; row-gap:9px; align-items:center; margin:4px 0 6px 6mm; }
.calc .l{ text-align:right; white-space:nowrap; } .calc .r{ white-space:nowrap; }
.calc4{ grid-template-columns:max-content max-content max-content max-content; }
.calc4 .op{ white-space:nowrap; padding-left:5mm; }
.fehler{ display:none; }
.sol .fehler{ display:block; border-left:4px solid #E0A800; background:#FFF8E1; border-radius:4px; padding:5px 10px; margin:4px 0 8px; font-size:12.5px; }
.sol .fehler b{ color:#8a5a00; }
.sol .qrcol{ display:none!important; }
.solnote{ display:none; } .sol .solnote{ display:inline; color:var(--sol); font-size:12px; font-family:Calibri,Arial,sans-serif; }
.two{ display:flex; gap:6mm; align-items:flex-start; }
svg.grid{ display:block; margin:2px auto; }
.mini4{ display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; margin:4px 0; }
.mini4 > div{ text-align:center; font-size:13px; }
@page{ size:A4; margin:0; }
@media print{ body{ background:#fff; } .page{ margin:0; box-shadow:none; page-break-after:always; break-after:page; } .page:last-child{ page-break-after:auto; } }

function tryCode(c){const raw=atob(D);const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i)^((c.charCodeAt(i%4)*31+i*7+(i>>8)*13)&255);
 const t=new TextDecoder().decode(u);return t.startsWith('OK::')?t.slice(4):null;}
function go(){const c=document.getElementById('code').value.trim();const r=c.length===4?tryCode(c):null;
 if(r){document.getElementById('gate').remove();document.getElementById('content').innerHTML=r;}
 else{document.getElementById('msg').textContent='Der Code ist falsch.';}}
document.getElementById('go').onclick=go;document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script></body></html>
