  /* ---------- 1 Terminwächter ---------- */
  const termin = seite("termin", "Terminwächter", "Zeitplan und Fortschrittsliste", `
    <div class="auftrag"><p>Sie behalten die Deadlines im Blick. Erinnern Sie die Gruppe <b>zwei Tage vor</b> jeder Deadline.</p>
      <p>Tragen Sie jede Woche ein, wie weit jedes Mitglied ist.</p><p>Am <b>Ende jeder Stunde</b> fragen Sie: Schaffen wir es bis Freitag? Wenn nicht, legen Sie gemeinsam fest, <b>bis wohin</b> jeder <b>zu Hause</b> weiterarbeitet. Fragen klären Sie in der nächsten Stunde.</p></div>
    <h2>Zeitplan</h2>
    <table class="eng"><tr><th style="width:20%"></th>${K.map(k => `<th class="mitte">Kapitel ${k.nr}</th>`).join("")}</tr><tr><td>fertig bis</td>${K.map(k => `<td class="mitte"><b>${k.deadline}</b></td>`).join("")}</tr><tr><td>erinnert am</td>${K.map(() => `<td style="height:7mm"></td>`).join("")}</tr></table>
    <h2>Fortschrittsliste</h2>
    <table><tr><th>Name</th>${K.map(k => `<th class="mitte">Kap. ${k.nr}</th>`).join("")}</tr>
      ${rep(n, () => `<tr><td class="leer"></td>${K.map(() => `<td></td>`).join("")}</tr>`)}

    <h2>Heft des Heftprüfers</h2>
    <table><tr>${K.map(k => `<th class="mitte">Kap. ${k.nr}</th>`).join("")}</tr>
      <tr>${K.map(() => `<td class="leer mitte klein">geprüft am</td>`).join("")}</tr></table>`);

  /* ---------- 2 Heftprüfer ---------- */

    "Alle Aufgaben bearbeitet",
    "Rechenweg vollständig",
    "Lösungscode stimmt",
    "Ordentlich und lesbar",

  const heft = seite("heft", "Heftprüfer", "Checkliste für die Hefte", `

  /* ---------- 3 Erklär-Checker ---------- */
  const erkl = n < 4 ? "" : seite("erkl", "Erklär-Checker", "Erklär-Protokoll", `

      <p>Hakt es? Dann erklären Sie die Aufgabe gemeinsam neu.</p></div>
    <h2>Fragen, die Sie stellen können</h2>
    <div class="box" style="margin-top:0">„Warum machst du diesen Schritt?“ &nbsp;·&nbsp; „Woher weißt du das?“ &nbsp;·&nbsp; „Was bedeutet das Ergebnis?“<br>

    <h2>Protokoll</h2>
    <table><tr><th style="width:9%">Kap.</th><th style="width:15%">Datum</th><th style="width:22%">Wer erklärt?</th><th>Welche Aufgabe?</th><th class="mitte" style="width:13%">sitzt ✓</th><th class="mitte" style="width:15%">nochmal ↻</th></tr>

    </table>`);

  /* ---------- 5 Fehlerdetektiv (nur 5er-Gruppe) ---------- */
  const fehler = seite("fehl", "Fehlerdetektiv", "Fehlerliste", `
    <div class="auftrag"><p>Sammeln Sie jeden Fehler, den Ihre Gruppe findet – beim Lösungscode, beim Heftprüfer oder beim Erklären. Namen schreiben Sie <b>nicht</b> auf.</p>

    <table>${rep(3, i => `<tr><td class="mitte" style="width:7%;height:11mm">${i + 1}</td><td></td></tr>`)}</table>`);

  document.getElementById("app").innerHTML = termin + heft + erkl + kund + (n >= 5 ? fehler : "");
