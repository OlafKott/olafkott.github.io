<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e8e8e8; font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #1c1c1c;
       font-size: 11pt; line-height: 1.5; }
.seite { width: 210mm; height: 297mm; overflow: hidden; margin: 0 auto 8mm; background: #fff; padding: 14mm 15mm;
         display: flex; flex-direction: column; }
.seite + .seite { break-before: page; page-break-before: always; }
.page-container { min-height: calc(297mm - 28mm); display: flex; flex-direction: column; }
.page-content { flex: 1; }
.page-footer { display: flex; justify-content: space-between; font-size: 8.5pt; color: #6b6b6b;
               border-top: 0.3mm solid #c9c9c9; padding-top: 2mm; margin-top: 4mm; }

.kopf { display: flex; align-items: center; gap: 6mm; border-bottom: 0.8mm solid var(--c); padding-bottom: 3mm; }
.kopf img { height: 12mm; }
.kopf .tx { flex: 1; }
.kopf .rolle { font-size: 9pt; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.kopf h1 { margin: 0; font-size: 17pt; line-height: 1.2; }
.meta { display: flex; gap: 8mm; margin: 3.5mm 0 4mm; font-size: 10pt; }
.meta span { flex: 1; border-bottom: 0.3mm solid #999; padding-bottom: .5mm; }
.meta b { color: #444; }

.auftrag { background: var(--bg); border-left: 1.4mm solid var(--c); padding: 2.5mm 4mm; margin-bottom: 5mm; }
.auftrag p { margin: 0 0 1mm; } .auftrag p:last-child { margin: 0; }
h2 { font-size: 12.5pt; margin: 5mm 0 2mm; color: var(--c); }

table { width: 100%; border-collapse: collapse; font-size: 10pt; }
th, td { border: 0.3mm solid #8a8a8a; padding: 1.6mm 2mm; vertical-align: top; text-align: left; }
th { background: var(--bg); font-weight: bold; }
td.leer { height: 10mm; }
td.mitte, th.mitte { text-align: center; vertical-align: middle; }
.klein { font-size: 9pt; color: #555; }
.legende { font-size: 9.5pt; margin-top: 2mm; color: #333; }
.box { border: 0.4mm solid #8a8a8a; border-radius: 1.5mm; padding: 2.5mm 4mm; margin-top: 4mm; }
.zeile { border-bottom: 0.3mm solid #aaa; height: 9mm; }
.leiter { display: flex; gap: 3mm; margin: 2mm 0 4mm; }
.leiter div { flex: 1; border: 0.4mm solid var(--c); border-radius: 1.5mm; padding: 2mm 3mm; font-size: 10pt; }
.leiter b { color: var(--c); }
.kapitelblock { break-inside: avoid; margin-bottom: 2mm; }
.kapitelblock h2 { margin: 2.2mm 0 1mm; font-size: 11.5pt; }
table.eng td, table.eng th { padding: 0.6mm 2mm; line-height: 1.35; }


@media print { body { background: #fff; } .seite { margin: 0; } }
</style>

    <table>${rep(3, i => `<tr><td class="mitte" style="width:7%;height:11mm">${i + 1}</td><td></td></tr>`)}</table>`);

  document.getElementById("app").innerHTML = termin + heft + erkl + kund + (n >= 5 ? fehler : "");
})();
</script>
</body>
