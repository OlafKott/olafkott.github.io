#app{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:1em;gap:.9em}
.top{flex:0 0 auto;display:flex;justify-content:center}
.logo{background:#fff;border:.18em solid var(--ink);border-radius:.7em;box-shadow:.25em .25em 0 var(--ink);padding:.35em .8em}
.logo img{height:2.6em;display:block}
#grid{flex:0 0 auto;display:grid;gap:.9em;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;align-items:start;max-width:72em;width:100%;margin:0 auto}
body.p #grid{grid-template-columns:1fr}
.card{background:#fff;border:.2em solid var(--ink);border-radius:1em;box-shadow:.32em .32em 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:.5em;padding:.35em .8em;background:var(--rwb);color:#fff;border-bottom:.2em solid var(--ink);font-weight:800;font-size:1.25em}
.hd .dt{margin-left:auto;font-weight:700;font-size:.8em;background:#fff;color:var(--rwb);border:.12em solid var(--ink);border-radius:1em;padding:.05em .6em}
.card.locked .hd{background:#56657a}.card.locked .hd .dt{color:#56657a}
.bd{padding:.3em .8em .5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:.8em;padding:.3em 0;border-bottom:.08em dashed #c6d8ec;font-size:1.1em}
.row:last-child{border-bottom:0}
.code{font:800 1.35em 'Courier New',monospace;letter-spacing:.14em;background:#FFF4D6;border:.14em solid var(--ink);border-radius:.4em;padding:.02em .45em;box-shadow:.12em .12em 0 var(--ink);white-space:nowrap}
.card.locked .code{background:#eee;color:#888}
.tm{display:flex;align-items:center;justify-content:center;gap:.4em;margin:.35em 0 .1em;padding:.25em .6em;background:#FFF4D6;border:.14em solid var(--ink);border-radius:.6em;box-shadow:.12em .12em 0 var(--ink);font-weight:800;font-size:1.15em;color:var(--rwb)}
.tm span{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
#grid>.card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - .45em)}

const D=[{"t": "Woche 1", "d": "Fr 13.11. · 13 Uhr", "u": "2026-11-13T12:00:00Z", "c": [["Wiederholung Grundlagen", "==gHWFEQ"], ["Übung Grundlagen, Seite 1", "==AGQJEQ"], ["Übung Grundlagen, Seite 2", "==gHQN0R"], ["Übung Grundlagen, Seite 3", "==AHSNEQ"]]}, {"t": "Woche 2", "d": "Fr 20.11. · 13 Uhr", "u": "2026-11-20T12:00:00Z", "c": [["CAS 3.1 · Gleichungen", "==QHTFEQ"], ["Wertetabellen, Seite 1", "==gHQVUR"], ["Wertetabellen, Seite 2", "==wHSRkS"], ["CAS 2.2 · Wertetabelle", "==AGWBUQ"]]}, {"t": "Woche 3", "d": "Fr 27.11. · 13 Uhr", "u": "2026-11-27T12:00:00Z", "c": [["Aufstellen (Gauß)", "==AHQVkR"], ["CAS 3.2 · LGS", "==gGRJEQ"]]}, {"t": "Woche 4", "d": "Fr 4.12. · 13 Uhr", "u": "2026-12-04T12:00:00Z", "c": [["Anwendung 1 · Anhalteweg", "==gHW9EQ"], ["Anwendung 2 · Wasserstrahl", "==QFTR0R"]]}, {"t": "Woche 5", "d": "Fr 11.12. · 13 Uhr", "u": "2026-12-11T12:00:00Z", "c": [["Anwendung 3 · Stromleitung", "==AHXNEQ"]]}],S="rwb-han11-q2";
const dec=x=>{const b=atob(x.split('').reverse().join(''));let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b.charCodeAt(i)^S.charCodeAt(i%S.length));return s;};
let off=0;const now=()=>Date.now()+off;
async function sync(){try{const r=await fetch(location.href.split('#')[0].split('?')[0]+'?t='+Date.now(),{method:'HEAD',cache:'no-store'});const d=Date.parse(r.headers.get('Date'));if(!isNaN(d))off=d-Date.now();}catch(e){}}
const st=D.map(()=>null);
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (d?d+' Tg. ':'')+p(h)+':'+p(m)+':'+p(x);}
function render(){const g=document.getElementById('grid'),t=now();let ch=false;
 const nx=D.findIndex(w=>t<Date.parse(w.u));
 D.forEach((w,i)=>{const open=t>=Date.parse(w.u),k=(open?'o':'l')+(i===nx?'n':'');if(st[i]===k)return;st[i]=k;ch=true;let c=document.getElementById('w'+i);
  if(!c){c=document.createElement('div');c.id='w'+i;g.appendChild(c);}
  c.className='card'+(open?'':' locked')+(i===nx?' next':'');
  c.innerHTML='<div class="hd"><span>'+(open?'🔓':'🔒')+'</span><span>'+w.t+'</span><span class="dt">'+w.d+'</span></div><div class="bd">'+
   w.c.map(([n,x])=>'<div class="row"><span>'+n+'</span><span class="code">'+(open?dec(x):'••••')+'</span></div>').join('')+
   (i===nx?'<div class="tm">⏱ <span data-cd>00 Tg. 00:00:00</span></div>':'')+'</div>';});
 if(ch)fit();
 if(nx>=0){const e=document.querySelector('#w'+nx+' [data-cd]');if(e)e.textContent=fmt(Date.parse(D[nx].u)-t);}}
function fit(){const A=document.getElementById('app'),G=document.getElementById('grid'),W=innerWidth,H=innerHeight;
 document.body.classList.toggle('p',W/H<0.85);
 let lo=6,hi=60;for(let k=0;k<18;k++){const m=(lo+hi)/2;A.style.fontSize=m+'px';
  const r=G.getBoundingClientRect(),t=A.querySelector('.top').getBoundingClientRect();const ok=t.top>=0&&r.bottom<=H-m*0.9&&A.scrollWidth<=W+1&&[...G.children].every(c=>c.scrollWidth<=c.clientWidth+1&&c.scrollHeight<=c.clientHeight+1);
  if(ok)lo=m;else hi=m;}
 A.style.fontSize=lo+'px';}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
render();fit();sync().then(render);setInterval(render,1000);setInterval(sync,300000);
