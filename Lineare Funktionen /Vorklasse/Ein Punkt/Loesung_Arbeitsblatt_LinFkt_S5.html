var MARKER = "RWB-OK:";

function entschluessele(code){
  var roh = atob(PAKET);
  var aus = "";
  for (var i = 0; i < roh.length; i++) {
    aus += String.fromCharCode(roh.charCodeAt(i) ^ code.charCodeAt(i % code.length));
  }
  try { return decodeURIComponent(escape(aus)); } catch (e) { return ""; }
}

function oeffnen(){
  var code = document.getElementById("code").value.trim();
  if (code.length !== 4) { melde("Bitte vier Ziffern eingeben."); return; }
  var text = entschluessele(code);
  if (text.indexOf(MARKER) !== 0) { melde("Der Code stimmt nicht."); return; }
  document.getElementById("tor").remove();
  document.open();
  document.write(text.slice(MARKER.length));
  document.close();
}

function melde(t){
  document.getElementById("fehler").textContent = t;
  var e = document.getElementById("code");
  e.className = "no"; e.select();
}

document.getElementById("btn").addEventListener("click", oeffnen);
document.getElementById("code").addEventListener("keydown", function(e){
  document.getElementById("fehler").textContent = "";
  this.className = "";
  if (e.key === "Enter") oeffnen();
});
document.getElementById("code").focus();
</script>
