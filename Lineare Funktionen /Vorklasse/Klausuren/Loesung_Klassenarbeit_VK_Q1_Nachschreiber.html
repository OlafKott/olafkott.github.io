<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lösung Nachschreiber VK Q1</title><style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.5; font-size:14px; }
.page{ width:210mm; min-height:297mm; margin:10px auto; padding:13mm 14mm 10mm;
  background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); display:flex; flex-direction:column; }
.page-content{ flex:1 0 auto; }
.page-header{ display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:3px solid var(--rwb); padding-bottom:9px; margin-bottom:12px;
  break-inside:avoid; page-break-inside:avoid; break-after:avoid; page-break-after:avoid; }
.page-header h1{ font-size:20px; margin:0 0 3px; color:var(--rwb); line-height:1.25; }
.page-header .sub{ font-size:13px; color:#444; }
.page-header img.logo{ height:52px; width:auto; margin-left:12px; }
.namebar{ display:flex; gap:24px; font-size:12.5px; color:#555; margin:-2px 0 12px; }
.namebar span{ border-bottom:1px solid #999; flex:1; padding-bottom:2px; }
.page-footer{ border-top:1px solid var(--line); margin-top:8px; padding-top:7px;
  display:flex; justify-content:space-between; font-size:11px; color:#888; flex:0 0 auto; }
.hinweis{ background:#E9F2FB; border:1px solid #1D70B8; border-radius:6px; padding:7px 12px; font-size:13px; margin:0 0 6px; }
.hinweis b{ color:#1D70B8; }
h2.task{ color:var(--rwb); font-size:15.5px; margin:10px 0 3px; border-left:4px solid var(--rwb); padding-left:9px;
  break-after:avoid; page-break-after:avoid; }
h2.task .pts{ float:right; font-size:12.5px; color:#555; font-weight:normal; }
h2.task .pbx{ display:inline-block; width:12mm; height:6mm; border:1px solid #999; border-radius:2mm; vertical-align:middle; margin-right:2px; }
.lead{ margin:4px 0 6px; }
.small{ font-size:12px; color:#666; }
.pp{ font-size:12px; color:#777; white-space:nowrap; }
.fterm{ font-family:Cambria,Georgia,serif; font-size:16px; margin:2px 0 6px 18px; white-space:nowrap; }
.frac{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:0.8em; line-height:1.15; margin:0 1px; }
.frac > span:first-child{ border-bottom:1px solid currentColor; padding:0 2px; }
.karo{ border:1px solid #c4ccd6; border-radius:3px; background-color:#fff;
  background-image:linear-gradient(#dbe6f0 1px, transparent 1px), linear-gradient(90deg,#dbe6f0 1px, transparent 1px);
  background-size:5mm 5mm; margin:4px 0 6px; break-inside:avoid; page-break-inside:avoid; }
.lines{ margin:2px 0 6px; }
.lines .ln{ border-bottom:1px solid #b9b9b9; }
.bx{ display:inline-block; height:7mm; border:1.3px solid #888; border-radius:2mm; vertical-align:middle; background:#fff; }
.bx.in{ width:14mm; min-width:14mm; height:7mm; }
.tri{ display:flex; gap:5mm; margin-top:4px; }
.tri .col{ flex:1; border:1px solid var(--line); border-radius:6px; padding:6px 8px 2px; background:#fcfbf9; display:flex; flex-direction:column; }
.clab{ font-weight:bold; color:var(--rwb); font-size:13.5px; margin-bottom:3px; }
.cbody{ height:39mm; display:flex; align-items:center; justify-content:center; }
.sit{ font-size:15px; text-align:center; padding:0 4px; line-height:1.5; }
.chk{ font-size:13px; margin:4px 0 0; white-space:nowrap; }
.cb{ display:inline-block; width:4.2mm; height:4.2mm; border:1.3px solid #555; border-radius:1mm; vertical-align:-0.8mm; margin-right:4px; background:#fff; }
table.wt{ border-collapse:collapse; font-family:Calibri,Arial,sans-serif; }
table.wt th, table.wt td{ border:1px solid #8e877a; padding:2px 7px; text-align:center; font-size:14px; }
table.wt th{ background:#f4efe6; }
table.wt.big{ margin:2px 0 6px 18px; }
table.wt.big th{ min-width:16mm; }
table.wt.big td{ min-width:17mm; height:8.5mm; padding:1mm 1.5mm; font-size:15px; }
.duo{ display:flex; gap:6mm; align-items:flex-start; margin-top:2px; }
.duo .right{ flex:1; }
.ctx{ background:#FBEEF0; border-left:4px solid var(--rwb); border-radius:4px; padding:6px 12px; margin:4px 0 6px; font-size:13.5px; line-height:1.5; }
.two{ display:flex; gap:6mm; }
.two > div{ flex:1; }
.bewertung{ border:1.5px solid var(--rwb); border-radius:6px; padding:5px 10px 4px; margin-top:6px; break-inside:avoid; page-break-inside:avoid; }
table.pt, table.nt{ border-collapse:collapse; font-family:Calibri,Arial,sans-serif; font-size:12.5px; }
table.pt{ width:100%; margin-bottom:6px; }
table.pt th, table.pt td, table.nt th, table.nt td{ border:1px solid #c9bfb0; padding:2px 6px; text-align:center; }
table.pt th, table.nt th{ background:#f4efe6; text-align:left; width:26mm; }
table.pt tr:last-child td{ height:7mm; }
.antw{ font-size:12.5px; color:#555; margin-top:-2px; }
table.pt td.sum{ font-weight:bold; background:#fbf3f4; }
.notewrap{ display:flex; gap:5mm; align-items:stretch; }
table.nt{ flex:1; }
.notefeld{ width:30mm; border:1.5px solid var(--rwb); border-radius:5px; text-align:center; padding:2px; display:flex; flex-direction:column; }
.nlab{ font-weight:bold; color:var(--rwb); font-size:12.5px; }
.nbox{ flex:1; }
.sig{ margin-top:0.5mm; font-size:12px; color:#555; }
.sig span{ display:block; border-bottom:1px solid #999; width:100mm; padding-bottom:2px; }

.sl p{ margin:0 0 1px; }
.notenblock{ display:flex; gap:8mm; margin-top:8px; align-items:flex-start; }
table.ntf{ border-collapse:collapse; font-family:Calibri,Arial,sans-serif; font-size:14px; width:70mm; }
table.ntf th, table.ntf td{ border:1px solid #c9bfb0; padding:3px 8px; text-align:center; height:8mm; }
table.ntf th{ background:#f4efe6; }
table.ntf td.gn{ font-weight:bold; width:16mm; }
table.ntf tr.g2 td, table.ntf tr.g4 td, table.ntf tr.g6 td{ background:#faf7f2; }
.rechts{ flex:1; display:flex; flex-direction:column; gap:8mm; }
.notefeld.big{ width:100%; height:38mm; }
.notefeld.big .nlab{ font-size:15px; padding-top:3px; }
.bem .nlab{ font-weight:bold; color:var(--rwb); font-size:13px; }
.sit2{ border:1px solid var(--line); border-radius:6px; padding:5px 9px 6px; background:#fcfbf9; margin:3px 0 4px; }
.sit2 p.eq{ margin-top:5px; }
table.nt{ width:100%; margin-top:5px; }
.notewrap table.pt{ flex:1; margin:0; }
.trow{ display:flex; align-items:center; gap:4mm; margin:2px 0 6px; }
.trow .fterm{ margin:0 0 0 6px; min-width:31mm; }
.trow table.wt.big td{ min-width:14mm; width:14mm; }
.trow table.wt.big th{ min-width:13mm; }
.trow .bx.in{ width:11.5mm; min-width:11.5mm; }
.trow table.wt.big{ margin:0; }
.sl{ margin:3px 0 5px; }
.hinweis p{ margin:1px 0; }
.ctxwrap{ display:flex; gap:4mm; align-items:stretch; margin:4px 0 6px; }
.ctxwrap .ctx{ flex:1; margin:0; }
.ctx p{ margin:0 0 2px; }
img.bild{ width:37mm; height:auto; object-fit:cover; border-radius:5px; border:1px solid #e3d9da; align-self:center; }
table.gl{ border-collapse:collapse; margin:0 0 1mm; }
table.gl td{ padding:0 2px; line-height:5mm; white-space:nowrap; vertical-align:middle; }
table.gl td.l{ text-align:right; } table.gl td.e{ text-align:center; width:14px; }
table.gl td.r{ text-align:left; } table.gl td.op{ color:#7a7a7a; padding-left:10px; font-size:12.5px; }
.hand{ color:#1D4ED8; font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive; }
.karo > .hand{ display:block; padding:1.5mm 3mm; font-size:14px; line-height:5mm; }
.karo .hl{ margin:0; line-height:5mm; }
.cols{ display:flex; gap:10mm; align-items:flex-start; }
.ln{ display:flex; align-items:flex-end; }
.ln > .hand{ padding:0 0 1px 2mm; font-size:13px; }
.bx{ text-align:center; }
.bx > .hand{ display:inline-block; padding:0 2mm; line-height:6.5mm; font-size:15px; }
.cb{ position:relative; }
.cb > .hand{ position:absolute; left:0; right:0; top:-1.6mm; text-align:center; font-size:17px; font-weight:bold; }
.sol{ cursor:pointer; transition:filter .25s; }
.sol:not(.show){ filter:blur(5px); }
.cb > .sol:not(.show){ filter:none; color:transparent; background:#c9d8f3; border-radius:1mm; top:0; bottom:0; }
.svgsol:not(.show){ opacity:0; }
.loesbox{ display:flex; gap:4mm; border:1.5px solid var(--rwb); border-radius:6px; padding:3mm; align-items:center; }
.ltx p{ margin:0; font-size:12.5px; line-height:1.45; }
.codefeld{ margin-top:2.5mm; display:flex; align-items:center; gap:1.6mm; font-size:13px; font-weight:bold; }
.cbx{ display:inline-block; width:7mm; height:8.5mm; border:1.3px solid #888; border-radius:2mm; background:#fff; }
@media print{ .sol{ filter:none !important; } .svgsol{ opacity:1 !important; } .toolbar{ display:none !important; } }
@media print{
  body{ background:#fff; }
  .page{ height:297mm; min-height:297mm; margin:0; box-shadow:none; overflow:hidden;
         break-inside:avoid; page-break-inside:avoid; }
  .page + .page{ break-before:page; page-break-before:always; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
@page{ size:A4 portrait; margin:0; }

#lock{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.lcard{ background:#fff; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.18); padding:26px 28px; max-width:380px; width:100%; text-align:center; border-top:5px solid var(--rwb); }
.lcard img{ height:44px; }
.lcard h1{ color:var(--rwb); font-size:20px; margin:12px 0 4px; }
.lcard p{ margin:4px 0; font-size:15px; }
#code{ font-size:28px; letter-spacing:12px; text-align:center; width:170px; padding:8px 4px 8px 16px; border:2px solid #999; border-radius:8px; margin:14px 0 10px; font-family:Calibri,Arial,sans-serif; }
#code:focus{ outline:none; border-color:var(--rwb); }
.btn{ background:var(--rwb); color:#fff; border:none; border-radius:7px; padding:10px 22px; font-size:15px; cursor:pointer; font-family:Georgia,serif; }
.btn.alt{ background:#fff; color:var(--rwb); border:1.5px solid var(--rwb); }
#err{ color:var(--rwb); font-weight:bold; min-height:1.4em; }
.toolbar{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:2px solid var(--rwb); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
.toolbar .tip{ font-size:13.5px; color:#444; flex-basis:100%; text-align:center; }
#content{ padding:6px 0 20px; }

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(){
  const code=document.getElementById('code').value.trim(), err=document.getElementById('err');
  if(!/^\d{4}$/.test(code)){ err.textContent='Bitte 4 Ziffern eingeben.'; return; }
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    fit();
  }catch(e){ err.textContent='Der Code ist falsch.'; }
}
function fit(){ const w=document.documentElement.clientWidth, pw=794+20;
  document.getElementById('content').style.zoom = w<pw ? (w/pw).toFixed(3) : 1; }
window.addEventListener('resize',fit);
document.getElementById('go').onclick=open_;
document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') open_(); });
document.getElementById('content').addEventListener('click',e=>{
  const ch=e.target.closest('.chk'); if(ch){ const ss=ch.querySelectorAll('.sol'); const on=[...ss].some(x=>!x.classList.contains('show')); ss.forEach(x=>x.classList.toggle('show',on)); return; }
  const s=e.target.closest('.sol:not(.svgsol)'); if(s){ s.classList.toggle('show'); return; }
  const cs=e.target.closest('.cs'); if(cs){ const gs=cs.querySelectorAll('.svgsol'); const on=[...gs].some(g=>!g.classList.contains('show')); gs.forEach(g=>g.classList.toggle('show',on)); }
});
document.getElementById('all').onclick=()=>document.querySelectorAll('#content .sol').forEach(x=>x.classList.add('show'));
document.getElementById('none').onclick=()=>document.querySelectorAll('#content .sol').forEach(x=>x.classList.remove('show'));
</script></body></html>
