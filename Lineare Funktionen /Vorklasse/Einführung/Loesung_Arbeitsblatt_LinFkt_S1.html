<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&ouml;sung &ndash; Arbeitsblatt &ndash; Lineare Funktionen, Stunde 1</title>
<style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#d9d2c5; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#eee; line-height:1.6; }

.page{ width:210mm; min-height:calc(297mm - 28mm); margin:10px auto; padding:14mm;
       background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); display:flex; flex-direction:column; }
.page-content{ flex:1 0 auto; }

.page-header{ display:table; width:100%; border-bottom:3px solid var(--rwb);
              padding-bottom:9px; margin-bottom:12px;
              break-inside:avoid; page-break-inside:avoid; break-after:avoid; page-break-after:avoid; }
.page-header .ht{ display:table-cell; vertical-align:top; }
.page-header .hl{ display:table-cell; vertical-align:top; text-align:right; width:30mm;
                  white-space:nowrap; }
.page-header h1{ font-size:21px; margin:0 0 3px; color:var(--rwb); line-height:1.25; }
.page-header .sub{ font-size:13px; color:#444; }
.page-header img.logo{ height:34px; width:auto; }

.namebar{ display:table; width:100%; border-spacing:0; table-layout:fixed; font-size:12.5px;
           color:#555; margin:0 0 12px; }
.namebar span{ display:table-cell; width:33%; padding:0 6mm 2px 0; }
.namebar span i{ font-style:normal; display:block; border-bottom:1px solid #999; padding-bottom:2px; }

.page-footer{ border-top:1px solid var(--line); margin-top:12px; padding-top:7px;
              display:table; width:100%; font-size:11px; color:#888; flex:0 0 auto; }
.page-footer span{ display:table-cell; }
.page-footer span:last-child{ text-align:right; }

h2.task{ color:var(--rwb); font-size:15px; margin:10px 0 4px;
         border-left:4px solid var(--rwb); padding-left:9px; line-height:1.35;
         break-after:avoid; page-break-after:avoid; }
h2.task:first-child{ margin-top:2px; }
.satz{ margin:0; font-size:13.4px; }
.lead{ margin:3px 0 6px; font-size:13.4px; }
.lead b{ color:#1d1d1f; }

.sec{ background:var(--rwb); color:#fff; font-weight:bold; font-size:14px;
      padding:4px 14px; border-radius:5px; margin:10px 0 8px;
      break-after:avoid; page-break-after:avoid; }

.method{ background:#E9F2FB; border:1px solid #1D70B8; border-radius:6px;
         padding:7px 13px; margin:6px 0 9px; font-size:13.4px;
         break-inside:avoid; page-break-inside:avoid; }
.method b.t{ color:#1D70B8; display:block; margin-bottom:2px; font-size:14px; }
.method .st{ display:inline-block; background:#1D70B8; color:#fff; border-radius:50%;
             width:18px; height:18px; text-align:center; font-weight:bold; font-size:12px;
             line-height:18px; margin-right:5px; font-family:Calibri,Arial,sans-serif; }
.tip{ background:#FFF8E8; border-left:4px solid #F2B705; border-radius:4px;
      padding:6px 13px; margin:6px 0 9px; font-size:13.2px;
      break-inside:avoid; page-break-inside:avoid; }
.tip b.t{ color:#8a5a00; display:block; margin-bottom:2px; }

.karo{ border:1px solid #c4ccd6; border-radius:3px; background-color:#fff;
       background-image: linear-gradient(#dbe6f0 1px, transparent 1px),
                         linear-gradient(90deg,#dbe6f0 1px, transparent 1px);
       background-size:5mm 5mm; margin:6px 0 8px; }
.linien{ margin:5px 0 8px; border:1px solid #b9b2a5; border-radius:1.8mm;
         background:#f7f5f2; padding:0 3mm; break-inside:avoid; page-break-inside:avoid; }
.linien div{ border-bottom:1px dotted #c3bcae; height:8.4mm; }
.linien div:last-child{ border-bottom:none; }
.linien.eng div{ height:6.9mm; }

.kbox{ display:inline-block; width:4.6mm; height:4.6mm; border:1px solid #8e877a;
       border-radius:1mm; background:#fff; vertical-align:-1mm; margin:0 1.8mm 0 0; }
.wahl{ font-size:13.4px; margin:3px 0 5px; }
.wahl .opt{ margin-right:8mm; white-space:nowrap; }
.wahl.gestapelt .opt{ display:block; margin:0 0 2px; }
.badge{ display:inline-block; font-family:Calibri,Arial,sans-serif; font-size:11.5px;
        font-weight:bold; border-radius:4px; padding:2px 9px; letter-spacing:.02em; }
.badge.ja{ background:#E7F4EA; color:#2E7D3A; border:1.2px solid #2E7D3A; }
.badge.nein{ background:#FBEEF0; color:#C8102E; border:1.2px solid #C8102E; }
table.pf{ border-collapse:collapse; width:100%; margin:4px 0 6px; table-layout:fixed;
          break-inside:avoid; page-break-inside:avoid; }
table.pf th{ border:1px solid #8e877a; background:#efeae1; font-size:13.5px; padding:4px 6px; }
table.pf td{ border:1px solid #8e877a; padding:4px; text-align:center; vertical-align:top; }
table.pf td.bsp{ background:#f7f5f2; font-size:12.5px; font-weight:bold; padding:3px; }
.loes{ color:#C8102E; }
.loes b{ color:#C8102E; }
.zitat{ font-size:13.2px; line-height:1.5; border-left:3px solid var(--line); padding-left:8px;
        margin:2px 0 3px; font-style:italic; min-height:11mm; }

table.wt{ border-collapse:collapse; font-family:Calibri,Arial,sans-serif; margin:5px 0; }
table.wt th,table.wt td{ border:0.9px solid #8e877a; padding:4px 3px; text-align:center;
                         width:13mm; font-size:13px; }
table.wt th.lbl{ background:#f4efe6; text-align:right; padding:4px 7px; width:30mm;
                 white-space:nowrap; font-size:11.5px; }
table.wt td.fill{ height:9mm; background:#f7f5f2; }

.spalten{ display:table; width:100%; border-spacing:0; table-layout:fixed;
           break-inside:avoid; page-break-inside:avoid; }
.spalte{ display:table-cell; vertical-align:top; }
.spalte > *{ margin-right:5mm; }
.spalte:last-child > *{ margin-right:0; }
.sptitel{ color:var(--rwb); font-weight:bold; font-size:13px; margin:0 0 3px; }

.grafik{ text-align:center; }
.grafik svg{ display:block; margin:0 auto; border:1px solid #ead7da; border-radius:4px; background:#fff; }

.qrlink{ display:inline-block; text-decoration:none; color:inherit; }
.videozeile{ display:table; width:100%; border:1.6px solid var(--rwb);
             border-radius:8px; background:#fff; padding:7px 12px; margin:6px 0 8px;
             break-inside:avoid; page-break-inside:avoid; }
.videozeile > div{ display:table-cell; vertical-align:middle; }
.videozeile > div:first-child{ width:22mm; }
.videozeile img{ width:20mm; height:20mm; display:block; }
.videozeile .vt{ font-size:13px; line-height:1.6; }
.videozeile .vt b{ color:var(--rwb); font-size:14px; }
.videozeile .vt .url{ font-size:11px; color:#777; text-decoration:none; }

@media print{
  body{ background:#fff; }
  .page{ height:297mm; min-height:297mm; margin:0; padding:13mm 14mm 10mm;
         box-shadow:none; overflow:hidden; break-inside:avoid; page-break-inside:avoid; }
  .page + .page{ break-before:page; page-break-before:always; }
  .page:last-of-type{ break-after:auto; page-break-after:auto; }
  a{ color:inherit; }
}

.loeskasten{ border:1.6px solid var(--rwb); border-radius:8px; background:#fdf6f7;
   padding:6px 11px 7px; margin:8px 0 0; break-inside:avoid; page-break-inside:avoid;
   display:table; width:100%; }
.loeskasten > div{ display:table-cell; vertical-align:middle; }
.loeskasten > div:first-child{ width:19mm; }
.loeskasten img{ width:17mm; height:17mm; display:block; }
.loeskasten .vt{ font-size:12.2px; line-height:1.5; padding-left:6px; }
.loeskasten .vt b{ color:var(--rwb); font-size:13px; }
.codefeld{ display:inline-block; margin-left:2mm; }
.codefeld span{ display:inline-block; width:7mm; height:8mm; border:1.4px solid #8e877a;
   border-radius:1.4mm; background:#fff; margin-right:1.6mm; vertical-align:-2mm; }
@media screen and (max-width:760px){
  .page{ width:auto; max-width:100%; min-height:0; margin:0; padding:14px 12px; box-shadow:none; }
  body{ background:#fff; font-size:16px; }
  .page-header h1{ font-size:19px; }
  table.wt th, table.wt td{ width:auto; font-size:12px; padding:3px 2px; }
  table.wt th.lbl{ width:auto; font-size:11px; padding:3px 5px; }
  .spalte{ display:block; width:100% !important; }
  .spalte > *{ margin-right:0; }
}
@page{ size:A4 portrait; margin:0; }

#tor{ max-width:150mm; margin:24px auto; background:#fff; border:1.6px solid var(--rwb);
      border-radius:10px; padding:26px 26px 30px; box-shadow:0 2px 10px rgba(0,0,0,.14);
      text-align:center; }
#tor img.logo{ height:34px; width:auto; margin-bottom:10px; }
#tor h1{ font-size:21px; color:var(--rwb); margin:0 0 4px; }
#tor .sub{ font-size:13.5px; color:#444; margin-bottom:16px; }
#tor p.hin{ font-size:14px; margin:0 0 14px; }
#tor .felder{ display:flex; gap:10px; justify-content:center; margin:0 0 6px; }
#tor input{ width:52px; height:62px; text-align:center; font-size:28px; font-weight:bold;
            font-family:Calibri,Arial,sans-serif; color:var(--ink);
            border:1.6px solid #8e877a; border-radius:8px; background:#fff; }
#tor input:focus{ outline:none; border-color:var(--rwb); box-shadow:0 0 0 3px rgba(200,16,46,.18); }
#tor button{ margin-top:14px; font-family:Calibri,Arial,sans-serif; font-size:15px;
             font-weight:bold; color:#fff; background:var(--rwb); border:1.6px solid var(--rwb);
             border-radius:7px; padding:10px 22px; cursor:pointer; }
#tor .fehler{ color:var(--rwb); font-size:13.5px; min-height:20px; margin-top:8px; font-weight:bold; }
#tor .fuss{ font-size:11.5px; color:#8a8478; margin-top:16px; }
@media print{ #tor{ display:none !important; } }
</style></head><body>
