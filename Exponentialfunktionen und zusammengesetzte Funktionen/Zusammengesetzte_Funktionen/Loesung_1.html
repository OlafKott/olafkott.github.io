<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lösung Seite 1 · Verkettung von Funktionen</title><style>.logo{height:44px;width:auto;display:block}
.m{font-family:Cambria,Caladea,Georgia,serif;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.12;font-size:.86em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px 1px}.fr .de{padding:1px 3px 0}
.vb{color:#1D3FD0}
.mx{display:inline-grid;grid-template-columns:30px 14px repeat(3,var(--cw)) 22px var(--cw) 14px auto;grid-template-rows:auto repeat(3,var(--rh));align-items:center;font-family:Cambria,Caladea,Georgia,serif;font-size:var(--mfs,24px);color:#1d1d1f;vertical-align:middle}
.mx .mh{color:#E07B00;font-family:Calibri,Carlito,Arial,sans-serif;font-weight:bold;font-style:italic;font-size:.74em;text-align:center;line-height:1.2}
.mx .ml{grid-column:1;color:#9a9a9a;font-family:Calibri,Carlito,Arial,sans-serif;font-size:.58em;font-weight:bold;text-align:right;padding-right:6px}
.mx .pl,.mx .pr{align-self:stretch;height:100%}.mx .pl svg,.mx .pr svg{display:block;width:100%;height:100%}
.mx .bar{align-self:stretch;justify-self:center;width:0;border-left:2px solid #1d1d1f;margin:5px 0}
.mx .mc{text-align:center;white-space:nowrap}
.mx .v{position:relative;display:inline-block}
.mx .sp{position:absolute;left:80%;top:-.66em;font-family:Calibri,Carlito,Arial,sans-serif;font-size:.6em;color:#E07B00;font-weight:bold;white-space:nowrap}
.mx .sp .fr{font-size:.8em}
.mx .z .v{color:#D32F2F}
.mx .ma{position:relative;align-self:stretch;width:var(--aw,200px)}
.mx .af{position:absolute;left:0;display:flex;align-items:center;white-space:nowrap;font-size:.86em}
.mx .aplus{position:absolute;left:27px;color:#E07B00;font-weight:bold;font-family:Calibri,Carlito,Arial,sans-serif;font-size:.95em;line-height:28px}
.bx{display:inline-block;border:2px solid;border-radius:6px;padding:0 .2em;line-height:1.15;margin:0 1px}
.bx.o{border-color:#E8A15A;background:#FDEBD9}.bx.g{border-color:#5DB85F;background:#DDF3DD}.bx.p{border-color:#D63AC8;background:#F9DDF6}
.mred{color:#D32F2F;font-weight:bold}
.eq{display:inline-grid;grid-template-columns:auto auto auto auto auto;column-gap:10px;row-gap:5px;align-items:center;font-family:Cambria,Caladea,Georgia,serif;font-size:var(--efs,22px)}
.eq .er{display:contents}
.eq .lb{font-family:Calibri,Carlito,Arial,sans-serif;font-weight:bold;text-decoration:underline;text-underline-offset:4px;padding-right:4px;white-space:nowrap}
.eq .lb.rl{text-decoration:none;color:#9a9a9a}
.eq .l{text-align:right;white-space:nowrap}.eq .e{text-align:center}.eq .r{white-space:nowrap}
.eq .op{color:#1D70B8;padding-left:12px;white-space:nowrap}
.eq .un{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.lgs{display:inline-grid;grid-template-columns:repeat(8,auto);column-gap:9px;row-gap:6px;align-items:center;font-family:Cambria,Caladea,Georgia,serif;font-size:var(--efs,22px)}
.lgs .lr{display:contents}.lgs .lr>span{text-align:right;white-space:nowrap}
.lgs .lb{font-family:Calibri,Carlito,Arial,sans-serif;font-weight:bold;color:#9a9a9a;font-size:.72em}
.lgs .lr>span:nth-child(3),.lgs .lr>span:nth-child(5),.lgs .lr>span:nth-child(7){text-align:center}

.cx{color:#E07B00;font-weight:bold}.cy{color:#2E7D32;font-weight:bold}
.pbk{display:inline-grid;grid-template-columns:auto auto auto auto auto;column-gap:10px;row-gap:4px;align-items:center;font-family:Cambria,Caladea,Georgia,serif;font-size:var(--efs,22px)}
.pbk .pr{display:contents}
.pbk .pc{white-space:nowrap;padding-right:14px}
.pbk .pl2{font-family:Cambria,Caladea,Georgia,serif;font-weight:bold;padding-left:14px;white-space:nowrap}
.ub{position:relative;display:inline-block}
.ub .brc{position:absolute;left:-2px;right:-2px;top:96%;display:flex;flex-direction:column;align-items:center;line-height:1}
.ub .brc svg{width:100%;height:12px;display:block}
.ub .brt{color:#C80046;font-weight:bold;font-size:.9em;margin-top:2px}
.pbk .l{text-align:right;white-space:nowrap}.pbk .r{white-space:nowrap}
.pbk .pbsp{grid-column:1/-1;height:10px}

:root{--rwb:#C80046;--ink:#1d1d1f;--ok:#2E7D32;--bad:#B00020;--blue:#1D70B8}
*{box-sizing:border-box}
body{margin:0;background:#f1f1f1;font-family:Calibri,Carlito,Arial,sans-serif;color:var(--ink);line-height:1.55;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--rwb);background:#f1f1f1;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px;color:var(--rwb);font-family:Georgia,serif;line-height:1.25}
.top .logo{height:38px}
.wrap{max-width:900px;margin:0 auto;padding:12px 10px 90px}
.card{background:#fff;border:1px solid #d9d2c5;border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h3{margin:0 0 8px;color:var(--rwb);font-size:18px}
.scroll{overflow-x:auto;padding-bottom:4px}
input.gp{font-family:Cambria,Caladea,Georgia,serif;font-size:18px;height:34px;padding:1px 3px;border:2px dashed #999;border-radius:8px;text-align:center;background:#fff;vertical-align:middle}
input.gp:focus{outline:none;border-style:solid;border-color:var(--blue)}
input.gp.ok{border:2px solid var(--ok);background:#EAF5EA}input.gp.bad{border:2px solid var(--bad);background:#FDECEA}
.eq{--efs:19px;row-gap:8px}
.pbk{--efs:18px;row-gap:6px}
.mx{--mfs:19px}

.mx{--mfs:21px;--aw:180px}
.lock{max-width:470px;margin:30px auto;background:#fff;border:1px solid #d9d2c5;border-radius:14px;padding:22px 24px;text-align:center}
.lock h2{margin:0 0 6px;color:var(--rwb);font-family:Georgia,serif;font-size:24px}
.lock p{font-size:17px;margin:6px 0 12px}
.lock ol{text-align:left;font-size:16px;line-height:1.6;margin:8px 0 16px;padding-left:22px}
.digits{display:flex;gap:12px;justify-content:center;margin:10px 0 14px}
.digits input{width:56px;height:66px;font-size:32px;text-align:center;border:2px dashed #999;border-radius:10px;font-family:Cambria,Caladea,Georgia,serif}
.digits input:focus{outline:none;border-color:var(--rwb);border-style:solid}
.lock button{font-family:inherit;font-size:19px;font-weight:bold;background:var(--rwb);color:#fff;border:none;border-radius:8px;padding:10px 30px;cursor:pointer}
.msg{min-height:1.6em;font-weight:bold;margin-top:10px;font-size:17px;color:var(--bad)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sol h2{margin:0 0 4px;color:var(--rwb);font-family:Georgia,serif;font-size:22px}
.sol .pts{font-size:19px;margin-bottom:6px}
.stephd{font-weight:bold;font-size:17px;color:var(--rwb);margin:14px 0 6px;border-left:4px solid var(--rwb);padding-left:8px}
.pts{display:flex;flex-wrap:wrap;gap:8px 28px}
.pts>div>b{display:block;font-size:16px;color:#555;margin-bottom:2px}
.eq.small{--efs:18px}
.mseq{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-left:4px}
.mseq .down{font-size:26px;padding-left:150px;line-height:1.1}
.eq.bs{display:grid;width:max-content;margin:0 0 12px;--efs:20px}
.hint1{background:#FFF8E8;border:1.5px dashed #E0A800;border-radius:8px;padding:6px 12px;font-size:16px;margin:6px 0}
.resbox{display:inline-block;margin:8px 0 2px;padding:8px 16px;border:2px solid var(--ok);background:#EAF5EA;border-radius:8px;font-family:Cambria,Caladea,Georgia,serif;font-size:21px;font-weight:bold}

.ca{color:#1D5FC8;font-weight:bold}.ci{color:#D32F2F;font-weight:bold}
.bga{background:#E3ECFA;border-radius:6px;padding:0 4px}.bgi{background:#FBE3E3;border-radius:6px;padding:0 4px}
sup{font-size:.68em;line-height:0;position:relative;vertical-align:baseline;top:-.55em}
.sq{display:inline-flex;align-items:stretch;white-space:nowrap;margin:0 .06em;line-height:1.15}
.sq .sqs{align-self:stretch;flex:none;width:.6em;height:auto;overflow:visible;display:block;margin:.0375em 0 .25em}
.sq .sqs path{fill:none;stroke:currentColor;stroke-width:.075em;stroke-linejoin:round;stroke-linecap:butt;vector-effect:non-scaling-stroke}
.sq .sqb{align-self:baseline;border-top:.075em solid currentColor;padding:.12em .14em 0 .08em;line-height:1.15}

.lw{color:#1B5E20;background:#EAF5EA;border:1.5px solid #8CC68E;border-radius:6px;padding:0 6px;font-weight:bold;font-family:Cambria,Caladea,Georgia,serif}
.card .sub{font-weight:bold;color:#444;margin:10px 0 2px}
.given{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;margin:4px 0}
.hint2{font-size:15px;color:#555}
.codebox{background:#FBE4EC;border:1.8px solid #C80046;border-radius:10px;padding:8px 12px;font-size:16px}
table.zt{width:100%;border-collapse:collapse;font-size:16px}
table.zt td,table.zt th{border:1px solid #E8C9D5;padding:6px 8px;text-align:left}
table.zt th{background:#FBE4EC;color:#9E0037}
table.zt td.f{font-family:Cambria,Caladea,Georgia,serif;font-size:18px;white-space:nowrap}
.scroll{overflow-x:auto}
svg.plot{width:100%;max-width:380px;height:auto;display:block;margin:6px 0;border:1px solid #e3e3e3;border-radius:6px}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ins=[...document.querySelectorAll('#digits input')];
ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{ el.value=el.value.replace(/\D/g,'').slice(-1); if(el.value&&i<3) ins[i+1].focus(); if(ins.every(x=>x.value)) tryOpen(); });
  el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value&&i>0) ins[i-1].focus(); if(e.key==='Enter') tryOpen(); });
});
document.getElementById('open').onclick=tryOpen;
async function tryOpen(){
  const code=ins.map(x=>x.value).join(''), msg=document.getElementById('msg');
  if(code.length<4){ msg.textContent='Bitte alle 4 Ziffern eintragen.'; return; }
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)},key,u8(DATA.ct));
    document.getElementById('lock').remove();
    document.getElementById('out').innerHTML=new TextDecoder().decode(pt);
  }catch(e){
    msg.textContent='Der Code stimmt noch nicht. Prüfe deine Ergebnisse.';
    const l=document.getElementById('lock'); l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake');
  }
}
