<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktive Kann-Liste – Exponentialfunktionen und zusammengesetzte Funktionen (HAN)</title>
<style>
:root{ --rwb:#C8102E; --ink:#1d1d1f; --line:#e3b7be; --soft:#fdf6f7; --g:#2E7D3A; --y:#D99A00; --r:#C8102E; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:Georgia,'Times New Roman',serif; color:var(--ink); background:#f3f1ee; line-height:1.6; font-size:17px; }
.wrap{ max-width:760px; margin:0 auto; padding:14px 14px 40px; }
header.kopf{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--rwb); padding-bottom:8px; margin-bottom:12px; }
header.kopf h1{ font-size:22px; color:var(--rwb); margin:0; line-height:1.25; }
header.kopf .sub{ font-size:14px; color:#555; }
header.kopf img{ height:34px; }
.prog{ display:flex; gap:4px; flex-wrap:wrap; margin:6px 0 14px; }
.prog button{ width:30px; height:30px; border-radius:50%; border:1.6px solid #bbb; background:#fff; font-size:10.5px;
  font-family:Calibri,Arial,sans-serif; cursor:pointer; color:#555; padding:0; }
.prog button.akt{ border-color:var(--rwb); border-width:2.5px; color:var(--rwb); font-weight:bold; }
.prog button.g{ background:var(--g); border-color:var(--g); color:#fff; }
.prog button.y{ background:var(--y); border-color:var(--y); color:#fff; }
.prog button.r{ background:var(--r); border-color:var(--r); color:#fff; }
.prog button.sum{ width:auto; border-radius:15px; padding:0 10px; }
.karte{ background:#fff; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.12); padding:18px 20px; }
.sec{ font-size:14px; color:#fff; background:var(--rwb); display:inline-block; padding:2px 10px; border-radius:4px; margin-bottom:10px; }
.kann{ background:var(--soft); border-left:5px solid var(--rwb); padding:10px 14px; border-radius:4px; font-size:18px; margin-bottom:16px; }
.kann .nr{ color:var(--rwb); font-weight:bold; margin-right:6px; }
h2{ font-size:17px; color:var(--rwb); margin:14px 0 6px; }
.aufg{ margin:4px 0; }
.term{ margin:4px 0; } .term.gross{ font-size:20px; margin:8px 0; }
.medien{ margin:6px 0 10px; }
.medien svg{ max-width:100%; height:auto; }
.duo{ display:flex; gap:16px; flex-wrap:wrap; }
.trio{ display:flex; gap:10px; flex-wrap:wrap; }
.gcap{ text-align:center; } .gcap svg{ width:190px; } .duo svg{ width:240px; } .medien > svg{ width:300px; } .gcap b{ display:block; color:var(--rwb); font-size:14px; }
.part{ margin:10px 0; padding:8px 0; border-top:1px dashed #e4dcd0; }
.part .q{ margin-bottom:5px; }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{ border:1.6px solid #b9b2a5; background:#fff; border-radius:8px; padding:7px 14px; font:inherit; font-size:16px; cursor:pointer; }
.opt.sel{ border-color:#1D4ED8; background:#E9F2FB; font-weight:bold; }
.opt.ok{ border-color:var(--g); background:#E7F4EA; }
.opt.falsch{ border-color:var(--r); background:#FBEEF0; }
.num{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.num input{ font:inherit; font-size:18px; width:120px; padding:6px 10px; border:1.8px solid #b9b2a5; border-radius:8px; }
.num input.ok{ border-color:var(--g); background:#E7F4EA; } .num input.falsch{ border-color:var(--r); background:#FBEEF0; }
.num .note{ font-size:13px; color:#777; }
.mark{ font-weight:bold; font-family:Calibri,Arial,sans-serif; }
.mark.ok{ color:var(--g); } .mark.falsch{ color:var(--r); }
.knoepfe{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px; }
.btn{ font:inherit; font-size:16px; border-radius:8px; padding:8px 16px; cursor:pointer; border:1.8px solid var(--rwb); background:#fff; color:var(--rwb); text-decoration:none; display:inline-block; }
.btn.voll{ background:var(--rwb); color:#fff; }
.btn.grau{ border-color:#999; color:#555; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn:focus-visible,.opt:focus-visible,.amp button:focus-visible,.prog button:focus-visible{ outline:3px solid #1D4ED8; outline-offset:2px; }
.box{ border-radius:8px; padding:10px 14px; margin:10px 0; }
.box.tipp{ background:#FFF8E8; border-left:5px solid #F2B705; }
.box.loes{ background:#E9F2FB; border-left:5px solid #1D70B8; }
.box.erg-ok{ background:#E7F4EA; border-left:5px solid var(--g); }
.box.erg-no{ background:#FBEEF0; border-left:5px solid var(--r); }
.box b.t{ display:block; margin-bottom:2px; }
.amp{ display:flex; gap:10px; flex-wrap:wrap; }
.amp button{ flex:1 1 170px; font:inherit; font-size:15.5px; border-radius:10px; padding:10px; background:#fff; cursor:pointer; border:2px solid; display:flex; align-items:center; gap:9px; text-align:left; }
.amp .dot{ width:22px; height:22px; border-radius:50%; border:2.5px solid; flex:0 0 auto; }
.amp .g{ border-color:var(--g); } .amp .y{ border-color:var(--y); } .amp .r{ border-color:var(--r); }
.amp button.g.sel{ background:#E7F4EA; } .amp button.y.sel{ background:#FFF4D6; } .amp button.r.sel{ background:#FBEEF0; }
.amp button.sel .dot.g{ background:var(--g); } .amp button.sel .dot.y{ background:var(--y); } .amp button.sel .dot.r{ background:var(--r); }
.uebung{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.nav{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
table.wt{ border-collapse:collapse; font-family:Calibri,Arial,sans-serif; margin:4px 0; }
table.wt th,table.wt td{ border:1px solid #8e877a; padding:3px 10px; text-align:center; }
table.wt th{ background:#f4efe6; }
table.gl{ border-collapse:collapse; margin:4px 0 4px 4px; }
table.gl td{ padding:0 3px; white-space:nowrap; }
table.gl td.l{ text-align:right; } table.gl td.e{ text-align:center; width:16px; }
table.gl td.op{ color:#777; padding-left:12px; font-size:14px; }
.cm{ color:#1D4ED8; font-weight:bold; } .cb{ color:#C8102E; font-weight:bold; }
.cx{ color:#15803D; font-weight:bold; } .cy{ color:#C2410C; font-weight:bold; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.9em; line-height:1.2; margin:0 2px; }
.fr > span:first-child{ border-bottom:1px solid currentColor; padding:0 2px; }
.grau{ color:#666; font-size:.93em; }
.gridbox{ touch-action:manipulation; }
.gridbox svg{ max-width:100%; height:auto; cursor:crosshair; border:1px solid #e4dcd0; border-radius:6px; background:#fff; }
.hinweis{ font-size:14px; color:#666; }
/* Zusammenfassung */
.zahlen{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 14px; }
.zahlen div{ flex:1 1 120px; border-radius:10px; padding:10px; text-align:center; color:#fff; font-size:15px; }
.zahlen b{ display:block; font-size:28px; }
table.sum{ width:100%; border-collapse:collapse; font-size:15px; }
table.sum th{ background:#f7e4e7; color:var(--rwb); text-align:left; padding:5px 7px; border:1px solid var(--line); }
table.sum td{ border:1px solid var(--line); padding:6px 7px; vertical-align:top; }
table.sum td.nr{ color:var(--rwb); font-weight:bold; white-space:nowrap; }
.pill{ display:inline-block; border-radius:10px; padding:1px 9px; color:#fff; font-size:13px; font-family:Calibri,Arial,sans-serif; white-space:nowrap; }
.pill.g{ background:var(--g); } .pill.y{ background:var(--y); } .pill.r{ background:var(--r); } .pill.n{ background:#aaa; }
.namefeld input{ font:inherit; padding:6px 10px; border:1.8px solid #b9b2a5; border-radius:8px; width:260px; max-width:100%; }
.intro p{ margin:6px 0; }
@media print{
  body{ background:#fff; font-size:12.5px; } .wrap{ max-width:none; padding:0 8mm; }
  .prog,.nav,.knoepfe,.noprint{ display:none !important; }
  .karte{ box-shadow:none; padding:0; }
  table.sum{ font-size:11.5px; } table.sum tr{ break-inside:avoid; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  a{ color:inherit; }
}
@page{ size:A4 portrait; margin:12mm 0; }
@media (max-width:560px){ body{ font-size:16px; } .karte{ padding:14px 12px; } header.kopf h1{ font-size:19px; } .prog button{ width:26px; height:26px; font-size:9.5px; } }

.var{ font-style:italic; }
.frac{ display:inline-block; vertical-align:middle; text-align:center; line-height:1.15; margin:0 2px; font-size:.92em; }
.frac > .z{ display:block; border-bottom:1px solid currentColor; padding:0 3px; }
.frac > .n{ display:block; padding:0 3px; }
.medien{ overflow-x:auto; }
.medien > svg{ width:100%; max-width:480px; }
table.dat{ border-collapse:collapse; margin:6px 0; font-size:15px; }
table.dat th, table.dat td{ border:1px solid #c4a8ad; padding:3px 9px; text-align:center; }
table.dat th{ background:#f5e6e8; color:#8b0b20; }
table.dat.quer td{ min-width:36px; }
table.dat th.nrk{ background:#fafafa; color:#888; font-weight:normal; font-size:12px; }
table.dat td.mark{ background:#e3f1e3; font-weight:bold; }
.klein{ font-size:13px; color:#555; }
.box.loes{ overflow-x:auto; }
.box.loes p{ margin:5px 0; }

.wurzel{ display:inline-flex; align-items:stretch; vertical-align:middle; line-height:1.15; }
.wurzel > .wz{ display:inline-block; width:0.6em; flex:0 0 auto; }
.wurzel > .wz svg{ width:100%; height:100%; display:block; overflow:visible; }
.wurzel > .radikand{ border-top:1.1px solid currentColor; padding:1px 2px 0 0.2em; margin-left:-0.7px; }
.achtung{ color:#8b0b20; }
.medien > svg{ width:100%; max-width:300px; }
</style></head>

function parseNum(v){
  if(v==null) return NaN; v=String(v).trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/,/g,'.').replace('½','0.5');
  if(!v) return NaN;
  if(v.includes('/')){ const [a,b]=v.split('/'); const x=parseFloat(a), y=parseFloat(b); return (isFinite(x)&&isFinite(y)&&y!==0)&&/^-?[\d.]+$/.test(a)&&/^-?[\d.]+$/.test(b)?x/y:NaN; }
  return /^-?\d*\.?\d+$/.test(v)?parseFloat(v):NaN;
}

function renderProg(){

  if(s.hint) h+=`<div class="box tipp"><b class="t">Tipp</b>${it.hint}</div>`;
  if(s.checked) h+= s.ok ? `<div class="box erg-ok"><b class="t">Richtig!</b>Gut gemacht.</div>`
                         : `<div class="box erg-no"><b class="t">Noch nicht ganz.</b>Die markierten Stellen stimmen noch nicht. Versuchen Sie es noch einmal oder nutzen Sie den Tipp.</div>`;
  if(s.solShown || s.ok) h+=`<div class="box loes"><b class="t">Lösung</b>${it.sol}</div>`;
  h+=`<h2>Wie sicher sind Sie?</h2><div class="amp">`+['g','y','r'].map(k=>`<button class="${k} ${s.amp===k?'sel':''}" onclick="setAmp('${k}')"><span class="dot ${k}"></span><span><b>${AMPK[k]}</b><br>${AMP[k]}</span></button>`).join('')+`</div>`;
  if(s.amp) h+=uebungBox(it,s);
  h+=`<div class="nav"><button class="btn" onclick="go(${S.idx-1})">‹ Zurück</button>
      <button class="btn voll" id="weiter" onclick="weiter()">${S.idx===ITEMS.length-1?'Zur Zusammenfassung ›':'Nächste Kann-Aufgabe ›'}</button></div>
      <div class="hinweis" id="wh" style="text-align:right;min-height:1.4em"></div>`;
  $('karte').innerHTML=h;
  if(it.parts.some(p=>p.t==='grid')) it.parts.forEach((p,pi)=>{ if(p.t==='grid') drawGrid(it,p,pi,s); });
}
function uebungBox(it,s){
  const txt = s.amp==='g' ? 'Prima! Wenn Sie möchten, können Sie trotzdem weiterüben.'
            : 'Üben Sie dieses Thema jetzt gezielt. Das Material öffnet sich in einem neuen Tab – danach geht es hier weiter.';
  const cls = s.amp==='g'?'erg-ok':(s.amp==='y'?'tipp':'erg-no');
  if(!it.url) return `<div class="box ${cls}"><b class="t">Weiterüben</b>Notieren Sie sich die Nummer ${it.nr}.</div>`;
  return `<div class="box ${cls}"><div class="uebung"><div><b class="t">Weiterüben</b>${txt}</div>
     <a class="btn ${s.amp==='g'?'':'voll'}" href="${it.url}" target="_blank" rel="noopener">${it.ulabel} ↗</a></div></div>`;
}
function partHTML(it,p,pi,s){
  const a=s.ans[pi]; const res=(s.res||{})[pi];
  const mark = res===undefined||!s.checked ? '' : (res?'<span class="mark ok">✓</span>':'<span class="mark falsch">✗</span>');
  if(p.t==='mc'){
    return `<div class="q">${p.q} ${mark}</div><div class="opts">`+p.opts.map((o,oi)=>{
      let c=a===oi?'sel':''; if(s.checked&&a===oi) c+= res?' ok':' falsch'; if((s.solShown)&&oi===p.a) c+=' ok';
      return `<button class="opt ${c}" onclick="pick(${pi},${oi})">${o}</button>`}).join('')+`</div>`;
  }
  if(p.t==='multi'){
    const arr=a||[];
    return `<div class="q">Mehrere Antworten möglich: ${mark}</div><div class="opts">`+p.opts.map((o,oi)=>{
      let c=arr.includes(oi)?'sel':''; if(s.solShown&&p.a.includes(oi)) c+=' ok';
      return `<button class="opt ${c}" onclick="toggleMulti(${pi},${oi})">${arr.includes(oi)?'☑':'☐'} ${o}</button>`}).join('')+`</div>`;
  }
  if(p.t==='num'){
    const cls= s.checked&&res!==undefined ? (res?'ok':'falsch'):'';
    return `<label class="num"><span>${p.q}</span><input inputmode="decimal" autocomplete="off" class="${cls}" value="${a??''}" oninput="setNum(${pi},this.value)" onkeydown="if(event.key==='Enter')check()"> ${mark} ${p.note?`<span class="note">(${p.note})</span>`:''}</label>`;
  }
  if(p.t==='grid'){
    return `<div class="q">Ihre Punkte: <span id="gp${pi}">${(a||[]).map(q=>'('+String(q[0]).replace('-','−')+' | '+String(q[1]).replace('-','−')+')').join(' und ')||'noch keine'}</span> ${mark}
      <button class="btn grau" style="padding:3px 10px;font-size:14px;margin-left:6px" onclick="gridReset(${pi})">Punkte löschen</button></div><div class="gridbox" id="g${pi}"></div>`;
  }
}
function pick(pi,oi){ const s=st(ITEMS[S.idx].nr); s.ans[pi]=oi; s.checked=false; save(); render(); }
function toggleMulti(pi,oi){ const s=st(ITEMS[S.idx].nr); const a=s.ans[pi]||[]; const i=a.indexOf(oi); if(i>=0)a.splice(i,1); else a.push(oi); s.ans[pi]=a; s.checked=false; save(); render(); }
function setNum(pi,v){ const s=st(ITEMS[S.idx].nr); s.ans[pi]=v; save(); }
function toggleHint(){ const s=st(ITEMS[S.idx].nr); s.hint=!s.hint; save(); render(); }
function showSol(){ const s=st(ITEMS[S.idx].nr); s.solShown=true; if(s.ok===null) s.ok=false; save(); render(); }
function setAmp(k){ const s=st(ITEMS[S.idx].nr); s.amp=k; save(); render(); }
function weiter(){ const s=st(ITEMS[S.idx].nr); if(!s.amp){ $('wh').textContent='Bitte wählen Sie zuerst eine Ampelfarbe.'; return; } go(S.idx+1); }
function check(){
  const it=ITEMS[S.idx], s=st(it.nr); s.res={}; let all=true;
  it.parts.forEach((p,pi)=>{
    const a=s.ans[pi]; let r=false;
    if(p.t==='mc') r= a===p.a;
    else if(p.t==='multi') r= Array.isArray(a) && a.length===p.a.length && p.a.every(x=>a.includes(x));
    else if(p.t==='num'){ const v=parseNum(a); r= isFinite(v) && Math.abs(v-p.a)<=(p.tol||1e-6)+1e-9; }
    else if(p.t==='grid'){ r= Array.isArray(a)&&a.length===2 && a.every(q=>Math.abs(p.m*q[0]+p.b-q[1])<1e-9) && (a[0][0]!==a[1][0]); }
    s.res[pi]=r; if(!r) all=false;
  });
  s.checked=true; s.tries++;
  if(s.firstOk===undefined) s.firstOk=all;
  if(!s.solShown) s.ok=all; else s.ok = s.ok || all;
  if(all) s.solvedSelf = !s.solShown;
  save(); render();
}
/* Gitter zum Zeichnen */
function drawGrid(it,p,pi,s){
  const u=38, pad=22, W=(p.xmax-p.xmin)*u+2*pad+10, H=(p.ymax-p.ymin)*u+2*pad;
  const X=x=>pad+(x-p.xmin)*u, Y=y=>pad+(p.ymax-y)*u;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:Georgia,serif">
   <defs><marker id="gar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.5 L0,7 Z" fill="#333"/></marker></defs>`;
  for(let x=p.xmin;x<=p.xmax;x++) g+=`<line x1="${X(x)}" y1="${Y(p.ymax)}" x2="${X(x)}" y2="${Y(p.ymin)}" stroke="#dbe6f0"/>`;
  for(let y=p.ymin;y<=p.ymax;y++) g+=`<line x1="${X(p.xmin)}" y1="${Y(y)}" x2="${X(p.xmax)}" y2="${Y(y)}" stroke="#dbe6f0"/>`;
  g+=`<line x1="${X(p.xmin)}" y1="${Y(0)}" x2="${X(p.xmax)+14}" y2="${Y(0)}" stroke="#333" stroke-width="1.4" marker-end="url(#gar)"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(p.ymin)}" x2="${X(0)}" y2="${Y(p.ymax)-14}" stroke="#333" stroke-width="1.4" marker-end="url(#gar)"/>`;
  g+=`<text x="${X(p.xmax)+10}" y="${Y(0)+18}" font-size="15" font-style="italic">x</text><text x="${X(0)+8}" y="${Y(p.ymax)-4}" font-size="15" font-style="italic">y</text>`;
  for(let x=p.xmin;x<=p.xmax;x++) if(x) g+=`<text x="${X(x)}" y="${Y(0)+16}" font-size="12" text-anchor="middle">${x<0?'−'+(-x):x}</text>`;
  for(let y=p.ymin;y<=p.ymax;y++) if(y) g+=`<text x="${X(0)-6}" y="${Y(y)+4}" font-size="12" text-anchor="end">${y<0?'−'+(-y):y}</text>`;
  const a=s.ans[pi]||[];
  const lineThrough=(x1,y1,x2,y2,col,dash)=>{ const m=(y2-y1)/(x2-x1), b=y1-m*x1; const pts=[];
     [p.xmin,p.xmax].forEach(x=>{const y=m*x+b; if(y>=p.ymin-1e-9&&y<=p.ymax+1e-9) pts.push([x,y]);});
     if(m) [p.ymin,p.ymax].forEach(y=>{const x=(y-b)/m; if(x>=p.xmin&&x<=p.xmax) pts.push([x,y]);});
     pts.sort((q,r)=>q[0]-r[0]); if(pts.length<2) return '';
     const A=pts[0],Bp=pts[pts.length-1];
     return `<line x1="${X(A[0])}" y1="${Y(A[1])}" x2="${X(Bp[0])}" y2="${Y(Bp[1])}" stroke="${col}" stroke-width="2.6" ${dash?'stroke-dasharray="7 5"':''}/>`; };
  if(s.solShown){ g+=lineThrough(0,p.b,4,p.b+4*p.m,'#2E7D3A',true); }
  if(a.length===2 && a[0][0]!==a[1][0]) g+=lineThrough(a[0][0],a[0][1],a[1][0],a[1][1],'#1D4ED8',false);
  a.forEach(q=>{ g+=`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="6" fill="#C2410C" stroke="#fff" stroke-width="1.5"/>`; });
  g+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="gc${pi}"/></svg>`;
  const box=$('g'+pi); box.innerHTML=g;
  if(s.solShown) box.insertAdjacentHTML('beforeend','<div class="hinweis">Grün gestrichelt: die richtige Gerade.</div>');
  const svg=box.querySelector('svg');
  svg.addEventListener('click',ev=>{
    const r=svg.getBoundingClientRect(); const sx=(ev.clientX-r.left)*W/r.width, sy=(ev.clientY-r.top)*H/r.height;
    const x=Math.round((sx-pad)/u+p.xmin), y=Math.round(p.ymax-(sy-pad)/u);
    if(x<p.xmin||x>p.xmax||y<p.ymin||y>p.ymax) return;
    let arr=s.ans[pi]||[]; const k=arr.findIndex(q=>q[0]===x&&q[1]===y);
    if(k>=0) arr.splice(k,1); else { if(arr.length>=2) arr.shift(); arr.push([x,y]); }
    s.ans[pi]=arr; s.checked=false; save(); render();
  });
}
function gridReset(pi){ const s=st(ITEMS[S.idx].nr); s.ans[pi]=[]; s.checked=false; save(); render(); }

function renderIntro(){
  $('karte').innerHTML=`<div class="intro">
   <div class="kann" style="margin-bottom:10px"><b>Was kann ich schon – was muss ich noch üben?</b></div>
   <p>Diese Kann-Liste führt Sie durch alle <b>${ITEMS.length} Themen</b>: von der natürlichen Exponentialfunktion über zusammengesetzte Funktionen und die Ableitungsregeln bis zur Kurvendiskussion.</p>
   <p>Auf jeder Seite sehen Sie:</p>
   <p>1. was Sie können sollen („Ich kann …“),<br>2. eine <b>kurze Aufgabe</b> dazu – mit Tipp und Lösung, wenn Sie nicht weiterkommen,<br>3. die <b>Ampel</b>: Wie sicher sind Sie? <span class="pill g">grün</span> <span class="pill y">gelb</span> <span class="pill r">rot</span><br>4. einen Link zum passenden <b>Material</b>.</p>
   <p>Am Ende bekommen Sie eine <b>Zusammenfassung</b>, die Sie ausdrucken oder als PDF speichern können.</p>
   <p class="namefeld" style="margin-top:12px"><label>Ihr Name (für die Zusammenfassung):<br><input value="${S.name||''}" oninput="S.name=this.value;save()"></label></p>
   <p class="hinweis">Ihre Antworten werden nur auf diesem Gerät im Browser gespeichert.</p>
   <div class="nav"><span></span><button class="btn voll" onclick="go(0)">${Object.keys(S.st).length?'Weitermachen':'Los geht’s'} ›</button></div></div>`;
}
function renderSummary(){
  const c={g:0,y:0,r:0,n:0}; let right=0;
  ITEMS.forEach(it=>{ const s=S.st[it.nr]||{}; c[s.amp||'n']++; if(s.ok&&!s.solShown) right++; });
  let h=`<h2 style="margin-top:0;font-size:20px">Zusammenfassung${S.name?' – '+S.name.replace(/</g,'&lt;'):''}</h2>
   <div class="grau">Stand: ${new Date().toLocaleDateString('de-DE')} · Kurz-Checks selbst gelöst: ${right} von ${ITEMS.length}</div>
   <div class="zahlen"><div style="background:var(--g)"><b>${c.g}</b>sicher</div><div style="background:var(--y)"><b>${c.y}</b>unsicher</div><div style="background:var(--r)"><b>${c.r}</b>noch nicht</div>${c.n?`<div style="background:#aaa"><b>${c.n}</b>nicht bewertet</div>`:''}</div>`;
  const offen=ITEMS.filter(it=>{const a=(S.st[it.nr]||{}).amp; return a==='r'||a==='y';}).sort((a,b)=>((S.st[a.nr].amp==='r')?0:1)-((S.st[b.nr].amp==='r')?0:1));
  if(offen.length){
    h+=`<h2>Das übe ich als Nächstes</h2><p class="grau">Zuerst die roten, dann die gelben Themen.</p><table class="sum"><tr><th>Nr.</th><th>Ich kann …</th><th>Ampel</th><th class="noprint">Material</th></tr>`;
    offen.forEach(it=>{ const s=S.st[it.nr];
      h+=`<tr><td class="nr">${it.nr}</td><td>${it.kurz}</td><td><span class="pill ${s.amp}">${AMPK[s.amp]}</span></td><td class="noprint">${it.url?`<a href="${it.url}" target="_blank" rel="noopener">${it.ulabel}</a>`:''}</td></tr>`; });
    h+='</table>';
  } else if(!c.n) h+=`<div class="box erg-ok"><b class="t">Stark!</b>Sie haben alle Themen mit grün bewertet. Wiederholen Sie trotzdem vor der Klausur ein paar Übungen.</div>`;
  h+=`<h2>Alle Themen im Überblick</h2><table class="sum"><tr><th>Nr.</th><th>Ich kann …</th><th>Kurz-Check</th><th>Ampel</th></tr>`;
  ITEMS.forEach((it,i)=>{ const s=S.st[it.nr]||{};
    const chk = s.ok&&!s.solShown ? '<span class="pill g">✓ gelöst</span>' : (s.solShown? '<span class="pill n">Lösung angesehen</span>' : (s.checked? '<span class="pill r">✗ nicht gelöst</span>':'<span class="pill n">offen</span>'));
    h+=`<tr><td class="nr"><a href="#" onclick="go(${i});return false" style="color:inherit">${it.nr}</a></td><td>${it.kurz}</td><td>${chk}</td><td>${s.amp?`<span class="pill ${s.amp}">${AMPK[s.amp]}</span>`:'<span class="pill n">–</span>'}</td></tr>`; });
  h+=`</table><div class="knoepfe"><button class="btn voll" onclick="window.print()">Drucken / als PDF speichern</button>
      <button class="btn grau" onclick="go(0)">Von vorne durchgehen</button>
      <button class="btn grau" onclick="if(confirm('Alle Antworten löschen?')){S={idx:-1,name:S.name,st:{}};save();render();}">Alles zurücksetzen</button></div>`;
  $('karte').innerHTML=h;
}
render();
</script></body></html>
