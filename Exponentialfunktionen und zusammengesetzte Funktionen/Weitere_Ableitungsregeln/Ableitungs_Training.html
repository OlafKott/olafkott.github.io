<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>🎯 Ableitungs-Training</title><style>
:root{--rwb:#C80046;--ink:#1d1d1f;--ok:#2E7D32;--bad:#B00020;--blue:#1D70B8}
*{box-sizing:border-box}
body{margin:0;background:#f1f1f1;font-family:Calibri,Carlito,Arial,sans-serif;color:var(--ink);line-height:1.6;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--rwb);background:#f1f1f1;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px;color:var(--rwb);font-family:Georgia,serif;line-height:1.25}
.top .logo{height:38px;width:auto;display:block}
.wrap{max-width:900px;margin:0 auto;padding:12px 10px 90px}
.card{background:#fff;border:1px solid #d9d2c5;border-radius:12px;padding:12px 16px;margin:0 0 12px}
.card h3{margin:0 0 8px;color:var(--rwb);font-size:19px;display:flex;align-items:center;gap:9px}
.card h3 .n{background:var(--rwb);color:#fff;border-radius:50%;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.m{font-family:Cambria,Caladea,Georgia,serif;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.12;font-size:.86em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px 1px}.fr .de{padding:1px 3px 0}
.gi{background:#CFEBC8;border-radius:5px;padding:0 3px}
.go{background:#FBDDBB;border-radius:5px;padding:0 3px}
.cu{color:#1D70B8;font-weight:bold}.cv{color:#7B3FA0;font-weight:bold}
.scroll{overflow-x:auto;padding-bottom:4px}
.eq{display:inline-grid;grid-template-columns:auto auto auto auto;column-gap:10px;row-gap:8px;align-items:center;font-family:Cambria,Caladea,Georgia,serif;font-size:20px;margin:6px 0}
.eq>.l{text-align:right;white-space:nowrap}.eq>.e{text-align:center}.eq>.r{white-space:nowrap}
.eq>.op{color:#1D70B8;padding-left:12px;white-space:nowrap;font-family:Calibri,Carlito,Arial,sans-serif;font-size:17px}
.stephd{font-weight:bold;font-size:17px;color:var(--rwb);margin:14px 0 6px;border-left:4px solid var(--rwb);padding-left:8px}
.resbox{display:inline-block;margin:8px 0 2px;padding:6px 14px;border:2px solid var(--ok);background:#EAF5EA;border-radius:8px;font-family:Cambria,Caladea,Georgia,serif;font-size:20px;font-weight:bold}
.hint1{background:#FFF8E8;border:1.5px dashed #E0A800;border-radius:8px;padding:6px 12px;font-size:17px;margin:8px 0}
.merk{background:#F1F8F0;border:2px solid #2E7D32;border-radius:10px;padding:8px 14px;margin:8px 0}
.merk b.t{color:#2E7D32}
.zus{background:#F6F0FA;border:2px dashed #7B3FA0;border-radius:10px;padding:8px 14px;margin:8px 0}
.zus b.t{color:#7B3FA0}
input.gp{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;height:38px;width:70px;padding:1px 3px;border:2px dashed #999;border-radius:8px;text-align:center;background:#fff;vertical-align:middle}
input.gp.wide{width:120px}
input.gp:focus{outline:none;border-style:solid;border-color:var(--blue)}
input.gp.ok{border:2px solid var(--ok);background:#EAF5EA}input.gp.bad{border:2px solid var(--bad);background:#FDECEA}
button.pr{font-family:inherit;font-size:18px;font-weight:bold;background:var(--rwb);color:#fff;border:none;border-radius:8px;padding:9px 24px;cursor:pointer}
button.sec{font-family:inherit;font-size:17px;font-weight:bold;background:#fff;color:#555;border:1.5px solid #bbb;border-radius:8px;padding:8px 18px;cursor:pointer}
.fb{font-weight:bold;margin-top:8px;min-height:1.4em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.info{color:#666}
.sheetimg{display:block;width:100%;max-width:640px;margin:8px auto;border:1px solid #ccc;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
svg.plot{width:100%;max-width:520px;height:auto;display:block;margin:6px auto;background:#fff;border:1px solid #e4dcdf;border-radius:8px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{font-family:inherit;font-size:16px;font-weight:bold;border:1.5px solid #C80046;background:#fff;color:#C80046;border-radius:20px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:#C80046;color:#fff}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h4{margin:0 0 6px;font-size:16px;color:#666;text-align:center}
.it{display:block;width:100%;margin:0 0 10px;min-height:58px;font-family:Cambria,Caladea,Georgia,serif;font-size:21px;background:#fff;border:2px solid #d9d2c5;border-radius:10px;cursor:pointer;padding:6px 8px}
.it.sel{border-color:#1D70B8;background:#EEF5FC;box-shadow:0 0 0 3px #cfe2f6}
.it.done{border-color:#2E7D32;background:#EAF5EA;cursor:default;opacity:.75}
.it.err{animation:err .5s;border-color:#B00020;background:#FDECEA}
@keyframes err{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.it sup{font-size:.68em}
.stat{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin:6px 0 10px}
.done-msg{display:none;text-align:center;font-size:20px}
.done-msg.on{display:block}

ORK5CYII=" alt="rwb. ahr."></div><div class="wrap"><div class="hint1">Tippe eine Funktion an und dann die passende Ableitung. Richtige Paare werden grün. Rechne im Heft mit, wenn du unsicher bist.</div><div class="tabs" id="tabs"></div><div class="card"><div class="stat"><span id="rd"></span><span id="fe" style="color:#B00020"></span></div><div class="board" id="board"><div class="col" id="L"></div><div class="col" id="R"></div></div><div class="done-msg" id="msg"><p id="msgt"></p><button class="pr" id="nx" onclick="weiter()">Weiter</button></div></div></div><script>
const ST={"1": ["Die e-Funktion ableiten", [[["4e<sup>x</sup>", "4e<sup>x</sup>"], ["e<sup>x</sup> + x²", "e<sup>x</sup> + 2x"], ["3x − e<sup>x</sup>", "3 − e<sup>x</sup>"], ["e³ + e<sup>x</sup>", "e<sup>x</sup>"]], [["x⁴ − 2e<sup>x</sup>", "4x³ − 2e<sup>x</sup>"], ["e · x + 1", "e"], ["0,5e<sup>x</sup> + 5", "0,5e<sup>x</sup>"], ["−e<sup>x</sup> + x", "−e<sup>x</sup> + 1"]], [["2e<sup>x</sup> + x³", "2e<sup>x</sup> + 3x²"], ["6x − e<sup>x</sup>", "6 − e<sup>x</sup>"], ["e² · x²", "2e² · x"], ["e<sup>x</sup> − 7x", "e<sup>x</sup> − 7"]]]], "2": ["Die Kettenregel", [[["e<sup>2x</sup>", "2e<sup>2x</sup>"], ["e<sup>−x</sup>", "−e<sup>−x</sup>"], ["e<sup>0,5x</sup>", "0,5e<sup>0,5x</sup>"], ["e<sup>3x</sup>", "3e<sup>3x</sup>"]], [["3e<sup>4x</sup>", "12e<sup>4x</sup>"], ["−2e<sup>−3x</sup>", "6e<sup>−3x</sup>"], ["4e<sup>0,5x + 1</sup>", "2e<sup>0,5x + 1</sup>"], ["10e<sup>−0,1x</sup>", "−e<sup>−0,1x</sup>"]], [["(2x + 1)³", "6(2x + 1)²"], ["(5x − 2)²", "10(5x − 2)"], ["5e<sup>2x − 1</sup>", "10e<sup>2x − 1</sup>"], ["0,5e<sup>2x</sup>", "e<sup>2x</sup>"]]]], "3": ["Die Produktregel", [[["x · e<sup>x</sup>", "e<sup>x</sup> · (x + 1)"], ["x · e<sup>−x</sup>", "e<sup>−x</sup> · (1 − x)"], ["2x · e<sup>x</sup>", "e<sup>x</sup> · (2x + 2)"], ["x² · e<sup>x</sup>", "e<sup>x</sup> · (x² + 2x)"]], [["(x + 3) · e<sup>x</sup>", "e<sup>x</sup> · (x + 4)"], ["(x − 1) · e<sup>−x</sup>", "e<sup>−x</sup> · (2 − x)"], ["x · e<sup>2x</sup>", "e<sup>2x</sup> · (2x + 1)"], ["4x · e<sup>−0,5x</sup>", "e<sup>−0,5x</sup> · (4 − 2x)"]], [["x² · e<sup>−x</sup>", "e<sup>−x</sup> · (2x − x²)"], ["(2x − 4) · e<sup>0,5x</sup>", "x · e<sup>0,5x</sup>"], ["(x + 1) · e<sup>2x</sup>", "e<sup>2x</sup> · (2x + 3)"], ["x³ · e<sup>x</sup>", "e<sup>x</sup> · (x³ + 3x²)"]]]]};
let stufe=+(new URLSearchParams(location.search).get('stufe')||1); if(!ST[stufe]) stufe=1;
let runde=0, sel=null, fehler=0, ok=0;
const $=s=>document.querySelector(s);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tabs(){ $('#tabs').innerHTML=Object.keys(ST).map(k=>`<button class="${+k===stufe?'on':''}" onclick="setSt(${k})">Stufe ${k}: ${ST[k][0]}</button>`).join(''); }
function setSt(k){ stufe=k; runde=0; fehler=0; history.replaceState(null,'','?stufe='+k); tabs(); load(); }
function load(){ const P=ST[stufe][1][runde]; ok=0; sel=null;
  $('#rd').textContent='Runde '+(runde+1)+' von '+ST[stufe][1].length; $('#fe').textContent='Fehlversuche: '+fehler;
  const L=shuffle(P.map((p,i)=>[p[0],i])); let R; do{ R=shuffle(P.map((p,i)=>[p[1],i])); }while(R.some((r,k)=>r[1]===L[k][1]));
  $('#L').innerHTML='<h4>Funktion f(x)</h4>'+L.map(([h,i])=>`<button class="it" data-s="L" data-i="${i}">${h}</button>`).join('');
  $('#R').innerHTML='<h4>Ableitung f′(x)</h4>'+R.map(([h,i])=>`<button class="it" data-s="R" data-i="${i}">${h}</button>`).join('');
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>pick(b)); $('#msg').classList.remove('on'); $('#board').style.display=''; }
function pick(b){ if(b.classList.contains('done')) return;
  if(!sel||sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
  if(sel.dataset.i===b.dataset.i){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel=null; ok++;
    if(ok===4){ setTimeout(()=>{ $('#board').style.display='none'; const last=runde===ST[stufe][1].length-1;
      $('#msgt').innerHTML=last?`🎉 <b>Stufe ${stufe} geschafft!</b> Fehlversuche: ${fehler}`:'✅ <b>Runde geschafft!</b>';
      $('#nx').textContent=last?(ST[stufe+1]?'Weiter zu Stufe '+(stufe+1)+' ▶':'Nochmal von vorne ↺'):'Nächste Runde ▶'; $('#msg').classList.add('on'); },500); } }
  else { fehler++; $('#fe').textContent='Fehlversuche: '+fehler; [sel,b].forEach(x=>{ x.classList.remove('err'); void x.offsetWidth; x.classList.add('err'); }); sel.classList.remove('sel'); sel=null; } }
function weiter(){ if(runde<ST[stufe][1].length-1){ runde++; load(); } else if(ST[stufe+1]) setSt(stufe+1); else setSt(1); }
tabs(); load();
