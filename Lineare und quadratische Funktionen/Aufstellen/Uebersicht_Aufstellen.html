<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufstellen von Funktionen</title><style>
:root{ --rwb:#C80046; --ink:#1d1d1f; }
*{ box-sizing:border-box; }
body{ margin:0; background:#f1f1f1; font-family:Calibri,Carlito,Arial,sans-serif; color:var(--ink); }
.top{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 22px; border-bottom:3px solid var(--rwb); }
.top h1{ margin:0; font-family:Georgia,serif; color:var(--rwb); font-size:26px; line-height:1.2; }
.top p{ margin:2px 0 0; color:#555; font-size:16px; }
.top img{ height:44px; }
.wrap{ max-width:820px; margin:0 auto; padding:22px 16px 50px; }
.step{ position:relative; background:#fff; border:1px solid #e3d8dc; border-radius:16px; padding:14px 16px 18px; }
.step h2{ margin:0 0 12px; display:flex; align-items:center; gap:10px; font-size:20px; color:var(--rwb); }
.step h2 .n{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:var(--rwb); color:#fff; font-size:18px; }
.row{ display:flex; gap:16px; justify-content:center; align-items:stretch; flex-wrap:wrap; }
.plus{ align-self:center; font-size:30px; font-weight:bold; color:var(--rwb); }
.node{ flex:1 1 300px; max-width:360px; display:flex; flex-direction:column; text-decoration:none; color:inherit; background:#fff; border:2px solid var(--rwb); border-radius:14px; overflow:hidden; box-shadow:0 3px 0 #9E0037; transition:transform .15s, box-shadow .15s; }
a.node:hover, a.node:focus-visible{ transform:translateY(-3px); box-shadow:0 7px 0 #9E0037; outline:none; }
a.node:active{ transform:translateY(1px); box-shadow:0 1px 0 #9E0037; }
.node .img svg{ display:block; width:100%; height:auto; border-bottom:2px solid var(--rwb); }
.node .txt{ padding:10px 14px 12px; display:flex; flex-direction:column; gap:2px; }
.node .txt b{ font-size:21px; font-family:Georgia,serif; color:var(--rwb); }
.node .txt span{ font-size:16px; color:#444; }
.node .txt em{ font-style:normal; font-weight:bold; color:var(--rwb); margin-top:6px; font-size:16px; }
@media (max-width:560px){ .plus{ width:100%; text-align:center; margin:-6px 0; } .top h1{ font-size:21px; } }
</style></head><body>
