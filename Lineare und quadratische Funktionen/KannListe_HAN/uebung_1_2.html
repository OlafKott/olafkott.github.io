<!DOCTYPE html>

<head>

<title>Übung 1.2 – Gerade aus dem Graphen</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 16px; font-family: Georgia, "Times New Roman", serif;
  background: #f9f8f6; color: #1a1a1a; line-height: 1.5; min-height: 100vh; }
.uebung-box { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid #d4d4d4;
  border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.zurueck { max-width: 820px; margin: 0 auto 10px auto; font-size: 14px; }
.zurueck a { color: #C8102E; text-decoration: none; }
.uebung-kopf { background: #C8102E; color: #fff; padding: 14px 22px; display: flex;
  justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.uebung-kopf h1 { margin: 0; font-size: 19px; }
.uebung-kopf .nr { background: #fff; color: #C8102E; padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; }
.uebung-body { padding: 22px; }
.aufgabe { background: #fff8e1; border-left: 4px solid #d6a300; padding: 14px 18px; border-radius: 0 4px 4px 0; margin-bottom: 16px; }
.aufgabe h2 { margin: 0 0 6px 0; font-size: 14px; color: #8a6800; text-transform: uppercase; letter-spacing: .5px; }
.aufgabe-text { font-size: 16px; }
.info-box { margin: 0 0 16px 0; overflow-x: auto; } .info-box svg, .loesungsweg svg { max-width: 100%; height: auto; }
table.dat { border-collapse: collapse; margin: 6px 0; font-size: 15px; }
table.dat th, table.dat td { border: 1px solid #c4a8ad; padding: 4px 10px; text-align: center; }
table.dat th { background: #f5e6e8; color: #8b0b20; }
table.dat.quer td { min-width: 38px; }
table.dat th.nrk { background: #fafafa; color: #888; font-weight: normal; font-size: 12px; }
table.dat td.mark { background: #e3f1e3; font-weight: bold; }
.klein { font-size: 13px; color: #555; }
.frage-block { margin: 10px 0; padding: 10px 14px; background: #fafafa; border-radius: 4px; border: 1px solid #ececec;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.frage-block label { flex: 1 1 260px; }
.frage-block input, .frage-block select { padding: 7px 10px; font-family: Georgia, serif; font-size: 15px;
  border: 1.5px solid #c0c0c0; border-radius: 6px; background: #f6f6f6; }
.frage-block input { width: 130px; }
.frage-block select { min-width: 160px; max-width: 100%; }
.frage-block input:focus, .frage-block select:focus { outline: none; border-color: #C8102E; background: #fff; box-shadow: 0 0 0 2px rgba(200,16,46,.15); }
.einheit { color: #555; min-width: 30px; }
.marke { font-weight: bold; width: 22px; text-align: center; font-size: 18px; }
.marke.ok { color: #2e7d32; } .marke.no { color: #C8102E; }
.hinweis { font-size: 13px; color: #666; margin-top: 6px; }
.button-leiste { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { padding: 10px 20px; border: none; border-radius: 4px; font-family: Georgia, serif; font-size: 15px; cursor: pointer; font-weight: bold; }
.btn-pruefen { background: #C8102E; color: #fff; } .btn-pruefen:hover { background: #a00d25; }
.btn-loesung { background: #fff; color: #C8102E; border: 1.5px solid #C8102E; } .btn-loesung:hover { background: #fdecea; }
.btn-neu { background: #f3f3f3; color: #1a1a1a; border: 1.5px solid #c0c0c0; } .btn-neu:hover { background: #e6e6e6; }
.feedback { margin-top: 16px; padding: 12px 16px; border-radius: 4px; font-weight: bold; display: none; }
.feedback.richtig { background: #eaf5ea; color: #2e7d32; border: 1.5px solid #2e7d32; }
.feedback.falsch { background: #fdecea; color: #C8102E; border: 1.5px solid #C8102E; }
.feedback.teilweise { background: #fff8e1; color: #8a6800; border: 1.5px solid #d6a300; }
.loesungsweg { display: none; margin-top: 16px; padding: 14px 18px; background: #f0f7fa; border-left: 4px solid #2a6fa1; border-radius: 0 4px 4px 0; overflow-x: auto; }
.loesungsweg h3 { margin: 0 0 8px 0; font-size: 14px; color: #2a6fa1; text-transform: uppercase; letter-spacing: .5px; }
.loesungsweg p { margin: 6px 0; }
.konfetti { position: fixed; top: -10px; width: 8px; height: 8px; pointer-events: none; z-index: 9999; }
@keyframes konfettiFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
.uebung-fuss { display: flex; justify-content: space-between; align-items: center; padding: 10px 22px; font-size: 12px; color: #888; border-top: 1px solid #ececec; }
.uebung-fuss img { height: 26px; }

.var { font-style: italic; }
.frac { display: inline-block; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 1px; }
.frac > .z { display: block; border-bottom: 1px solid currentColor; padding: 0 3px; }
.frac > .n { display: block; padding: 0 3px; }
.wurzel { display: inline-flex; align-items: stretch; vertical-align: middle; line-height: 1.15; }
.wurzel > .wz { display: inline-block; width: 0.6em; flex: 0 0 auto; }
.wurzel > .wz svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wurzel > .radikand { border-top: 1.1px solid #1a1a1a; padding: 1px 2px 0 1px; margin-left: -1px; }

@media (max-width: 600px) { .uebung-kopf h1 { font-size: 16px; } .uebung-body { padding: 14px; } .frage-block label { flex-basis: 100%; } }
.wurzel > .radikand { padding: 1px 2px 0 0.2em !important; margin-left: -0.7px !important; border-top-width: 1.1px; }
.loesungsweg table td { vertical-align: middle; }
.achtung { color:#8b0b20; }
.frage-block label { line-height:1.4; }
</style>
</head>

let akt = -1;
function parseKomma(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/\s/g, "").replace(/[%°€g]/g, "").replace("−", "-").replace(",", ".");
  if (s === "" || !/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
function neueAufgabe() {
  let n;
  do { n = Math.floor(Math.random() * AUFGABEN.length); } while (n === akt && AUFGABEN.length > 1);
  akt = n;
  const a = AUFGABEN[akt];
  document.getElementById("aufgabe-text").innerHTML = a.kontext;
  const ib = document.getElementById("info-box");
  ib.innerHTML = a.info || ""; ib.style.display = a.info ? "block" : "none";
  const box = document.getElementById("felder"); box.innerHTML = "";
  a.felder.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "frage-block";
    let feld;
    if (f.typ === "wahl") {
      feld = '<select id="ein-' + i + '"><option value="">– bitte wählen –</option>' +
        f.optionen.map(o => '<option>' + o + '</option>').join("") + '</select>';
    } else {
      feld = '<input type="text" inputmode="decimal" autocomplete="off" id="ein-' + i + '">';
    }
    d.innerHTML = '<label for="ein-' + i + '">' + f.label + '</label>' + feld +
      '<span class="einheit">' + (f.einheit || "") + '</span><span class="marke" id="mk-' + i + '"></span>';
    box.appendChild(d);
  });
  const fb = document.getElementById("feedback"); fb.style.display = "none";
  const lw = document.getElementById("loesungsweg"); lw.style.display = "none"; lw.innerHTML = "";
}
function pruefen() {
  const a = AUFGABEN[akt]; let richtig = 0, leer = 0;
  a.felder.forEach((f, i) => {
    const el = document.getElementById("ein-" + i), mk = document.getElementById("mk-" + i);
    let ok = false;
    if (f.typ === "wahl") { if (el.value === "") leer++; ok = el.value === f.ans; }
    else { const e = parseKomma(el.value); if (isNaN(e)) leer++; ok = !isNaN(e) && Math.abs(e - f.ans) <= f.tol + 1e-9; }
    mk.textContent = ok ? "✓" : "✗"; mk.className = "marke " + (ok ? "ok" : "no");
    if (ok) richtig++;
  });
  const fb = document.getElementById("feedback"), n = a.felder.length;
  if (richtig === n) { fb.className = "feedback richtig"; fb.textContent = "✓ Alles richtig – super!"; starteKonfetti(); }
  else if (leer === n) { fb.className = "feedback teilweise"; fb.textContent = "Bitte füllen Sie zuerst die Felder aus."; }
  else { fb.className = "feedback falsch"; fb.textContent = richtig + " von " + n + " richtig. Prüfen Sie die Felder mit ✗."; }
  fb.style.display = "block";
}
function zeigeLoesung() {
  const lw = document.getElementById("loesungsweg");

}
function starteKonfetti() {
  const farben = ["#C8102E", "#2e7d32", "#d6a300", "#2a6fa1", "#8e44ad"];
  for (let i = 0; i < 50; i++) {
    const k = document.createElement("div"); k.className = "konfetti";

    document.body.appendChild(k); setTimeout(() => k.remove(), 3500);
  }
}
