<style>
:root{ --rwb:#C80046; --ink:#1d1d1f; --ok:#2E7D32; --bad:#B00020; }
*{ box-sizing:border-box; }
body{ margin:0; background:#f1f1f1; font-family:Georgia,serif; color:var(--ink); line-height:1.55; }
.top{ display:flex; justify-content:space-between; align-items:center; padding:12px 22px; border-bottom:3px solid var(--rwb); background:#f1f1f1; position:sticky; top:0; z-index:5; }
.top h1{ margin:0; font-size:22px; color:var(--rwb); } .top img{ height:40px; }
.wrap{ max-width:1100px; margin:0 auto; padding:18px 16px 40px; }
.lock{ max-width:460px; margin:40px auto; background:#fff; border:1px solid #d9d2c5; border-radius:14px; padding:24px 26px; text-align:center; font-family:Calibri,Arial,sans-serif; }
.lock h2{ margin:0 0 6px; color:var(--rwb); font-family:Georgia,serif; font-size:24px; }
.lock p{ font-size:17px; margin:6px 0 14px; }
.lock ol{ text-align:left; font-size:15.5px; line-height:1.6; margin:8px 0 16px; padding-left:22px; }
.digits{ display:flex; gap:12px; justify-content:center; margin:10px 0 14px; }
.digits input{ width:56px; height:66px; font-size:32px; text-align:center; border:2px dashed #999; border-radius:10px; font-family:Cambria,Georgia,serif; }
.digits input:focus{ outline:none; border-color:var(--rwb); border-style:solid; }
.lock button{ font-family:Calibri,Arial,sans-serif; font-size:19px; font-weight:bold; background:var(--rwb); color:#fff; border:none; border-radius:8px; padding:10px 30px; cursor:pointer; }
.msg{ min-height:1.6em; font-weight:bold; margin-top:10px; font-size:17px; } .msg.bad{ color:var(--bad); }
.shake{ animation:shake .35s; } @keyframes shake{ 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
.card{ background:#fff; border:1px solid #d9d2c5; border-radius:10px; padding:12px 16px; font-size:17px; }
.card.wide{ grid-column:1 / -1; }
.card h3{ margin:0 0 6px; font-family:Calibri,Arial,sans-serif; font-size:18px; display:flex; align-items:center; gap:8px; }
.nr{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--rwb); color:#fff; font-size:15px; }
.sol{ color:var(--ok); font-weight:bold; }
.note{ font-family:Calibri,Arial,sans-serif; font-size:15px; color:#666; font-style:italic; }
.m{ font-family:Cambria,Georgia,serif; white-space:nowrap; }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; line-height:1.15; }
.fr .nu{ border-bottom:1.5px solid currentColor; padding:0 3px 1px; } .fr .de{ padding:1px 3px 0; }
.sq{ display:inline-flex; align-items:stretch; white-space:nowrap; vertical-align:middle; margin:0 2px; }
.sq .sym{ display:block; width:11px; flex:0 0 11px; } .sq .sym svg{ display:block; width:100%; height:100%; overflow:visible; }
.sq .rad{ display:inline-flex; align-items:center; border-top:1.5px solid currentColor; padding:3px 4px 1px 3px; }
.eq{ display:grid; grid-template-columns:max-content max-content max-content 1fr; column-gap:10px; row-gap:6px; margin:6px 0 10px 12px; font-family:Cambria,Georgia,serif; font-size:18px; align-items:center; }
.eq .er{ display:contents; } .eq .l{ text-align:right; white-space:nowrap; } .eq .r{ white-space:nowrap; }
.eq .op{ color:#1D70B8; font-size:16px; padding-left:16px; }
.lt{ width:100%; border-collapse:collapse; font-size:16px; } .lt th{ background:#FBEAF0; color:#9E0037; padding:5px 8px; border:1px solid #e6c9d3; font-family:Calibri,Arial,sans-serif; } .lt td{ border:1px solid #e3ddd3; padding:5px 8px; }
.stephd{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:16.5px; color:#C80046; margin:12px 0 2px; }
.sheet{ padding:8px; } .sheet img{ width:100%; display:block; border:1px solid #ddd; border-radius:4px; }
.sheet .cap{ font-family:Calibri,Arial,sans-serif; font-size:15px; color:#666; margin:0 0 6px; }
.gsvg svg{ max-width:520px; margin:0 auto; display:block; }

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ins=[...document.querySelectorAll('#digits input')];
ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{ el.value=el.value.replace(/\D/g,'').slice(-1); if(el.value&&i<3) ins[i+1].focus(); if(ins.every(x=>x.value)) tryOpen(); });
  el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value&&i>0) ins[i-1].focus(); if(e.key==='Enter') tryOpen(); });
});
document.getElementById('open').onclick=tryOpen;
async function tryOpen(){
  const code=ins.map(x=>x.value).join(''), msg=document.getElementById('msg');
  if(code.length<4){ msg.className='msg bad'; msg.textContent='Bitte alle 4 Ziffern eintragen.'; return; }
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)},key,u8(DATA.ct));
    document.getElementById('lock').remove();
    document.getElementById('out').innerHTML=new TextDecoder().decode(pt);
  }catch(e){
    msg.className='msg bad'; msg.textContent='Der Code stimmt noch nicht. Prüfe deine Ergebnisse.';
    const d=document.getElementById('digits'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  }
}
ins[0].focus();
</script>
