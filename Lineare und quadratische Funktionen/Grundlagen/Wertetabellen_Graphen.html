<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Wertetabellen und Graphen</title>
<style>
:root{ --rwb:#C80046; --rwb-l:#FBEAF0; --ink:#1d1d1f; --ok:#2E7D32; --bad:#B00020; --blue:#1D70B8; --mut:#6B6B6B; --line:#d9d2c5; --cf:#6A5ACD; --cg:#C0392B; --bg:#f1f1f1; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); }
body{ font-family:Georgia,'Times New Roman',serif; color:var(--ink); line-height:1.5; touch-action:manipulation; -webkit-text-size-adjust:100%; }
#app{ position:fixed; left:0; top:0; width:1280px; height:800px; transform-origin:0 0; display:flex; flex-direction:column; background:var(--bg); }

/* Kopfzeile: Fortschritt + Logo */
.top{ height:66px; flex:0 0 66px; display:flex; align-items:center; gap:18px; padding:0 26px; border-bottom:3px solid var(--rwb); }
.prog{ flex:1; display:flex; gap:5px; }
.seg{ flex:1; cursor:pointer; padding:4px 0; min-width:0; }
.seg .bar{ height:9px; border-radius:5px; background:#dcdcdc; overflow:hidden; }
.seg .bar i{ display:block; height:100%; width:0; background:var(--rwb); transition:width .3s; }
.seg .lab{ font-family:Calibri,Arial,sans-serif; font-size:13px; font-weight:bold; color:#8a8a8a; text-align:center; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg.done .bar{ background:#eaa3bd; } .seg.done .bar i{ width:100%; }
.seg.done .lab{ color:var(--rwb); }
.seg.now .lab{ color:var(--rwb); text-decoration:underline; text-underline-offset:3px; }
.seg.ok .lab::after{ content:" ✓"; }
.top img{ height:44px; width:auto; display:block; }

/* Bühne */
.stage{ flex:1; position:relative; overflow:hidden; }
.slide{ position:absolute; inset:0; padding:16px 30px 10px; display:none; flex-direction:column; }
.slide.on{ display:flex; animation:fade .3s ease; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.hid{ visibility:hidden; opacity:0; }

h2.th{ display:flex; align-items:center; gap:12px; margin:0 0 12px; font-size:25px; color:var(--rwb); line-height:1.25; }
h2.th .no{ background:var(--rwb); color:#fff; font-family:Calibri,Arial,sans-serif; border-radius:50%; min-width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; padding:0 8px; }
h2.th small{ font-family:Calibri,Arial,sans-serif; font-size:16px; color:var(--mut); font-weight:normal; margin-left:4px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:10px; }

/* Fußzeile */
.bot{ height:66px; flex:0 0 66px; display:flex; align-items:center; gap:12px; padding:0 26px; border-top:1px solid #ddd; font-family:Calibri,Arial,sans-serif; }
.bot .info{ color:#888; font-size:13.5px; }
.bot .sp{ flex:1; }
.bot .cnt{ color:var(--mut); font-size:15px; margin-right:6px; }
.bot button{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:19px; padding:10px 26px; border-radius:8px; cursor:pointer; border:2px solid var(--rwb); min-height:48px; }
#bPrev{ background:#fff; color:var(--rwb); } #bNext{ background:var(--rwb); color:#fff; min-width:150px; }
#bFull{ background:#fff; color:#666; border:1.5px solid #bbb; font-size:14px; padding:6px 12px; min-height:36px; }
button:disabled{ opacity:.35; cursor:default; }
#bNext.pulse{ animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(200,0,70,.5);} 50%{ box-shadow:0 0 0 10px rgba(200,0,70,0);} }

/* allgemeine Elemente */
.m{ font-family:Cambria,Georgia,serif; white-space:nowrap; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 4px; }
button.pr,button.sec{ font-family:Calibri,Arial,sans-serif; font-size:17px; font-weight:bold; padding:9px 20px; border-radius:7px; cursor:pointer; border:1.8px solid var(--rwb); min-height:44px; }
button.pr{ background:var(--rwb); color:#fff; } button.sec{ background:#fff; color:var(--rwb); }
.fb{ font-family:Calibri,Arial,sans-serif; font-size:18px; font-weight:bold; line-height:1.5; min-height:1.5em; }
.fb.ok{ color:var(--ok); } .fb.bad{ color:var(--bad); } .fb.info{ color:var(--blue); }
svg.plot{ width:100%; height:auto; display:block; background:#fff; border:1px solid #ead7da; border-radius:8px; font-family:Georgia,serif; }
.cf{ color:var(--cf); font-weight:bold; } .cg{ color:var(--cg); font-weight:bold; }
.abnote{ font-family:Calibri,Arial,sans-serif; font-size:17px; background:#FFF8E8; border:1.5px dashed #E0A800; border-radius:8px; padding:8px 14px; }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; line-height:1.15; font-family:Cambria,Georgia,serif; }
.fr .nu{ border-bottom:1.6px solid currentColor; padding:0 4px 1px; }
.fr .de{ padding:1px 4px 0; }
.sq{ display:inline-flex; align-items:stretch; white-space:nowrap; vertical-align:middle; margin:0 2px 0 3px; }
.sq .sym{ display:block; width:12px; flex:0 0 12px; }
.sq .sym svg{ display:block; width:100%; height:100%; overflow:visible; }
.sq .rad{ display:inline-flex; align-items:center; border-top:1.6px solid currentColor; padding:3px 4px 1px 3px; }

/* Start */
.startgrid{ flex:1; display:grid; grid-template-columns:430px 1fr; gap:40px; align-items:center; min-height:0; }
.abprev{ display:flex; flex-direction:column; align-items:center; gap:16px; text-decoration:none; color:inherit; padding:34px 0 0; }
.abprev .stack{ position:relative; width:300px; margin-right:70px; }
.abprev .pg{ display:block; position:relative; transition:transform .3s ease; }
.abprev .pg.back{ position:absolute; inset:0; transform:translate(62px,-28px) rotate(4deg); }
.abprev .pg.front{ z-index:2; }
.abprev:hover .pg.back{ transform:translate(105px,-20px) rotate(7deg); }
.abprev img{ display:block; width:100%; height:auto; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); border-radius:2px; }
.abprev .pl{ position:absolute; top:8px; right:8px; font-family:Calibri,Arial,sans-serif; font-size:13px; font-weight:bold; background:var(--rwb); color:#fff; border-radius:10px; padding:1px 9px; }
.abprev .open{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:17px; background:var(--rwb); color:#fff; border-radius:22px; padding:9px 22px; }
.startr h1{ font-size:46px; color:var(--rwb); margin:0 0 18px; }
.abhint{ display:flex; gap:14px; align-items:flex-start; background:#FFF8E8; border:1.5px dashed #E0A800; border-radius:10px; padding:12px 16px; font-family:Calibri,Arial,sans-serif; font-size:18px; line-height:1.55; margin-bottom:16px; }
.abhint .ico{ font-size:30px; line-height:1; }
.how{ padding:12px 18px; border-top:5px solid var(--rwb); font-family:Calibri,Arial,sans-serif; font-size:18px; line-height:1.6; margin-bottom:22px; }
.how h4{ margin:0 0 4px; color:var(--rwb); font-size:19px; }
.bigbtn{ font-size:22px !important; padding:13px 38px !important; border-radius:32px !important; }

/* Quizfrage */
.qnum{ font-family:Calibri,Arial,sans-serif; font-size:16px; font-weight:bold; color:var(--mut); margin-bottom:4px; }
.qbody{ flex:1; min-height:0; }
.qbody.single{ max-width:980px; }
.qbody.withg{ display:grid; grid-template-columns:560px 1fr; gap:30px; align-items:start; }
.q{ font-size:25px; margin:4px 0 12px; font-weight:bold; line-height:1.4; }
.opt{ display:flex; align-items:center; gap:14px; padding:9px 16px; border:2px solid var(--line); border-radius:9px; margin:9px 0; cursor:pointer; background:#fff; font-size:21px; min-height:58px; }
.opt .mk{ flex:0 0 22px; height:22px; border:2px solid #999; border-radius:50%; }
.opt .lt{ font-family:Calibri,Arial,sans-serif; font-weight:bold; color:var(--mut); width:20px; }
.opt.sel{ border-color:var(--blue); background:#EEF5FC; } .opt.sel .mk{ border-color:var(--blue); background:var(--blue); box-shadow:inset 0 0 0 4px #fff; }
.opt.right{ border-color:var(--ok); background:#EAF5EA; } .opt.right .mk{ border-color:var(--ok); background:var(--ok); box-shadow:inset 0 0 0 4px #fff; }
.opt.wrong{ border-color:var(--bad); background:#FDECEA; }
.opt.locked{ cursor:default; }

/* Erklärung */
h2.eh{ display:flex; align-items:center; gap:12px; margin:0 0 12px; font-size:25px; color:var(--ok); }
h2.eh .eb{ font-family:Calibri,Arial,sans-serif; background:var(--ok); color:#fff; border-radius:8px; padding:3px 12px; font-size:18px; }
.ecols{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:30px; align-items:start; }
.ecols.rev{ grid-template-columns:600px minmax(0,1fr); }
.ecols.full{ grid-template-columns:1fr; }
.etext{ font-size:19.5px; line-height:1.65; background:#F2F8F2; border-left:5px solid var(--ok); border-radius:6px; padding:12px 18px; }
.evis{ display:flex; gap:18px; }
.evis .cap{ font-family:Calibri,Arial,sans-serif; font-size:16px; text-align:center; margin-bottom:4px; }
.evis .fx{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:24px; text-align:center; margin-top:6px; }
.evis .vcap{ font-family:Cambria,Georgia,serif; font-size:16.5px; text-align:center; margin-top:5px; }
.eslide .abnote{ margin-top:16px; }
.eslide .ecols{ flex:0 0 auto; }
.fbox{ display:flex; flex-direction:column; gap:12px; width:470px; }
.fbox > div{ padding:10px 16px; font-size:18px; line-height:1.7; }
.fbox h5{ margin:0 0 2px; font-family:Calibri,Arial,sans-serif; font-size:18px; color:var(--rwb); }
.zoomctl{ display:flex; align-items:center; gap:10px; font-family:Calibri,Arial,sans-serif; font-size:17px; background:#F6F1EA; border-radius:8px; padding:8px 14px; margin-top:10px; }
.zoomctl input[type=range]{ flex:1; accent-color:var(--rwb); height:34px; }
.zoomctl span{ color:var(--mut); font-size:15px; }
.zoomctl button{ padding:6px 14px !important; min-height:38px !important; font-size:16px !important; }

/* Präsentationsteile */
.tcols{ flex:1; min-height:0; display:grid; grid-template-columns:610px minmax(0,1fr); gap:30px; align-items:start; }
.say{ font-size:19.5px; line-height:1.6; margin:0 0 14px; padding:4px 0 4px 16px; border-left:4px solid #e6d9c6; }
.res{ margin:12px 0 4px; padding:10px 16px; border:2px solid var(--ok); background:#EAF5EA; border-radius:8px; font-family:Calibri,Arial,sans-serif; font-size:19px; font-weight:bold; color:#1B5E20; }
.res .m{ font-size:22px; }
.warn{ background:#FFF4D6; border:1px solid #E0A800; border-radius:8px; padding:10px 16px; font-size:18.5px; line-height:1.6; }
.warn b.t{ color:#7a5600; display:block; font-family:Calibri,Arial,sans-serif; }
.eq{ display:grid; grid-template-columns:max-content max-content max-content 1fr; column-gap:12px; row-gap:9px; margin:4px 0 10px 18px; font-family:Cambria,Georgia,serif; font-size:22px; align-items:center; }
.eq .er{ display:contents; }
.eq .l{ text-align:right; white-space:nowrap; } .eq .e{ text-align:center; } .eq .r{ white-space:nowrap; }
.eq .op{ color:var(--blue); font-size:18px; padding-left:22px; white-space:nowrap; }
.shd{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:19px; color:var(--rwb); margin:12px 0 4px; }
.shd .m{ color:var(--ink); }
.side{ font-family:Calibri,Arial,sans-serif; font-size:17.5px; background:#F4F8FC; border:1.6px dashed #8fb3d9; border-radius:9px; padding:10px 16px; color:#21456b; line-height:1.75; margin-bottom:12px; }
.side b.t{ display:block; color:var(--blue); }
.side .m{ font-size:20px; color:var(--ink); }
.ccols{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:30px; align-items:start; }
.task{ border:2px solid var(--rwb); border-radius:10px; padding:12px 18px; background:#fff; }
.task .tt{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:19px; color:var(--rwb); margin-bottom:4px; }
.task .ti{ font-family:Calibri,Arial,sans-serif; font-size:17px; line-height:1.55; }
.inrow{ font-family:Cambria,Georgia,serif; font-size:24px; margin:10px 0 4px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
input.num{ width:100px; font-family:Cambria,Georgia,serif; font-size:22px; padding:5px 6px; border:2px solid #aaa; border-radius:7px; text-align:center; }
input.num.ok{ border-color:var(--ok); background:#EAF5EA; } input.num.bad{ border-color:var(--bad); background:#FDECEA; }
.preview{ font-family:Cambria,Georgia,serif; font-size:20px; color:#444; }
.tip{ display:none; font-family:Calibri,Arial,sans-serif; font-size:17px; background:#FFF8E8; border-left:5px solid #F2B705; border-radius:5px; padding:8px 14px; margin-top:8px; line-height:1.6; }
.tip.show{ display:block; }
.tip .eq{ font-size:19px; margin:4px 0 4px 0; row-gap:5px; }
.task + .abnote{ margin-top:12px; }

/* Abschluss */
table.ov{ border-collapse:collapse; width:100%; font-size:19px; background:#fff; }
table.ov th,table.ov td{ border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:middle; }
table.ov th{ background:#F6F1EA; font-family:Calibri,Arial,sans-serif; }
.score{ font-family:Calibri,Arial,sans-serif; font-size:21px; font-weight:bold; color:var(--rwb); margin:0 0 10px; }

/* Hochformat-Hinweis */
#rot{ display:none; position:fixed; inset:0; z-index:99; background:rgba(255,255,255,.96); align-items:center; justify-content:center; text-align:center; font-family:Calibri,Arial,sans-serif; font-size:24px; color:var(--rwb); padding:30px; }
@media (orientation:portrait) and (max-width:1100px){ #rot{ display:flex; } }

/* Arbeitsblatt-Hinweis blinkt beim Erscheinen */
.abnote.blink{ animation:abblink .7s ease-in-out 4; }
@keyframes abblink{ 0%,100%{ background:#FFF8E8; box-shadow:0 0 0 0 rgba(224,168,0,0); } 50%{ background:#FFD96A; box-shadow:0 0 0 6px rgba(224,168,0,.35); } }
.abnote{ position:relative; }
/* Tipp-Karten */
.tipcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:16px; }
.tipcard{ background:#fff; border:2px solid var(--rwb); border-radius:12px; padding:14px; display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit; }
.tipcard svg,.tipcard img{ width:118px; height:118px; flex:0 0 118px; }
.tipcard h4{ margin:0 0 4px; font-family:Calibri,Arial,sans-serif; font-size:20px; color:var(--rwb); }
.tipcard p{ margin:0 0 8px; font-family:Calibri,Arial,sans-serif; font-size:16px; line-height:1.45; }
.tipcard .go{ display:inline-block; font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:16px; background:var(--rwb); color:#fff; border-radius:16px; padding:5px 14px; }
.ecols .card h5{ margin:0 0 2px; font-family:Calibri,Arial,sans-serif; font-size:18px; color:var(--rwb); }
.ecols .card{ padding:10px 16px; font-size:18px; line-height:1.7; }
.etext .eq{ margin-left:6px; }
.etext .shd{ margin-top:8px; }

/* Schrittweise Erklärungen */
.vs{ display:inline-grid; } .vs>*{ grid-area:1/1; } .l .vs{ justify-items:end; } .r .vs,.op .vs{ justify-items:start; }
.flash{ animation:flash .6s ease-in-out 3; border-radius:5px; }
@keyframes flash{ 50%{ background:#FFE066; box-shadow:0 0 0 5px #FFE066; } }
svg .flash{ animation:sflash .6s ease-in-out 3; }
@keyframes sflash{ 50%{ opacity:.12; } }
.opc{ color:var(--blue); font-weight:bold; }
.add{ color:var(--blue); font-weight:bold; }
.grp{ background:#FFE9C7; outline:2px solid #E07B00; border-radius:5px; padding:0 3px; }
.del{ color:#9a9a9a; text-decoration:line-through; text-decoration-color:#B00020; text-decoration-thickness:3px; }
.rs{ background:#DDF0DD; outline:2px solid #2E7D32; border-radius:5px; padding:0 3px; }
.mnote{ display:grid; font-family:Calibri,Arial,sans-serif; font-size:17.5px; line-height:1.45; background:#EEF5FC; border-left:5px solid var(--blue); border-radius:6px; padding:7px 12px; margin:2px 0 10px; color:#1b3d63; }
.mnote>*{ grid-area:1/1; }
.etext.st > div{ margin:0 0 9px; }
.etext.st{ font-size:18.5px; line-height:1.55; }
.big{ font-size:25px; }
.meq{ row-gap:6px; margin-bottom:6px; }

.grp2{ background:#DCEBFA; outline:2px solid #1D70B8; border-radius:5px; padding:0 3px; }

.aslider{ margin-top:10px; padding:6px 16px 10px; }
.aslider .arow{ display:flex; align-items:center; gap:16px; }
.aslider input[type=range]{ flex:1; accent-color:var(--rwb); height:34px; }
.nlsvg{ width:100%; height:auto; display:block; margin-top:4px; overflow:visible; }
.astat{ font-family:Calibri,Arial,sans-serif; font-size:18px; background:#F6F1EA; border-radius:6px; padding:6px 12px; margin-top:6px; min-height:2.2em; }

.bincard > div{ margin:12px 0 4px; font-size:17.5px; }
.bincard h5{ margin-bottom:6px !important; }
.bincard .bex{ display:block; margin:4px 0 6px 18px; font-size:16.5px; color:#444; line-height:1.6; }
.bincard .m{ font-size:19px; }

/* Steigungsdreieck wird gezeichnet */
line.draw{ stroke-dasharray:1; stroke-dashoffset:0; }
g[data-s]:not(.go) line.draw{ stroke-dashoffset:1; }
g[data-s].go line.draw{ stroke-dashoffset:1; animation:drawln .7s ease-in-out forwards; animation-delay:var(--d,0s); }
@keyframes drawln{ to{ stroke-dashoffset:0; } }
g[data-s]:not(.go) g.late{ opacity:0; }
g[data-s].go g.late{ opacity:0; animation:latein .3s ease forwards; animation-delay:var(--d,0s); }
@keyframes latein{ to{ opacity:1; } }

/* Anschlussfrage */
.angrid{ display:grid; grid-template-columns:minmax(0,1fr) 560px; gap:26px; align-items:start; }
.anq{ font-weight:bold; font-size:24px; color:var(--rwb); background:#fff; border:2.5px solid var(--rwb); border-radius:10px; padding:8px 14px; margin:4px 0 10px; }
.plan{ display:grid; grid-template-columns:1fr 34px 1fr 34px 1fr; gap:8px; align-items:stretch; margin-top:8px; }
.plancard{ position:relative; background:#fff; border:2.5px solid var(--pc); border-radius:12px; padding:10px 14px 10px 54px; font-family:Calibri,Arial,sans-serif; }
.plancard .pn{ position:absolute; left:12px; top:10px; width:32px; height:32px; border-radius:50%; background:var(--pc); color:#fff; font-weight:bold; font-size:18px; display:flex; align-items:center; justify-content:center; }
.plancard h4{ margin:0 0 2px; font-size:19px; color:var(--pc); }
.plancard .pf{ font-size:19px; margin:2px 0 4px; }
.plancard p{ margin:0; font-size:16px; line-height:1.45; }
.plancard .pref{ margin-top:4px; font-size:14px; color:#777; font-style:italic; }
.parr{ display:flex; align-items:center; justify-content:center; font-size:30px; color:#999; }

.pqeq{ font-size:20px; row-gap:5px; margin:6px 0 6px 4px; }
.pqeq .op{ font-size:16px; padding-left:16px; }

.stephd{ font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:18px; color:var(--rwb); margin:2px 0 2px; }

.problem{ background:#FDECEA; border:2px solid #B00020; border-radius:8px; padding:6px 12px; color:#7a0016; font-size:19px; }
.plancard p.sub{ line-height:1.55; }

.abprev .pg.back2{ position:absolute; inset:0; transform:translate(118px,-50px) rotate(8deg); }
.abprev:hover .pg.back2{ transform:translate(180px,-38px) rotate(12deg); }
.abprev .stack{ margin-right:120px !important; }

.lgrow{ display:flex; align-items:center; gap:12px; }
.lgk{ display:inline-block; color:#fff; font-family:Calibri,Arial,sans-serif; font-weight:bold; font-size:16px; border-radius:6px; padding:2px 10px; min-width:84px; text-align:center; }
.rad-hl{ background:#FFF1C9; border-radius:4px; padding:0 3px; }
.uegrid{ display:grid; grid-template-columns:1fr 470px; gap:40px; align-items:center; flex:1; min-height:0; }
.uelist{ font-family:Calibri,Arial,sans-serif; font-size:18px; line-height:1.55; padding:10px 18px; }
.uelist li{ margin:3px 0; }

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(v,d=2)=>{const r=Math.round(v*10**d)/10**d; return (Object.is(r,-0)?0:r).toLocaleString('de-DE',{maximumFractionDigits:d});};
const FR=(a,b)=>`<span class="fr"><span class="nu">${a}</span><span class="de">${b}</span></span>`;
const SQSVG='<span class="sym"><svg viewBox="0 0 12 32" preserveAspectRatio="none"><path d="M0.6,19 L3.4,16.5 L6.6,30.5 L11.6,0.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></span>';
const SQ=x=>`<span class="sq">${SQSVG}<span class="rad">${x}</span></span>`;
function expandMath(el){ let h=el.innerHTML, prev;
  h=h.replace(/FR\{([^{}|]*)\|([^{}]*)\}/g,(m,a,b)=>FR(a,b));
  do{ prev=h; h=h.replace(/SQ\{([^{}]*)\}/g,(m,a)=>SQ(a)); }while(h!==prev); el.innerHTML=h; }
$$('section.slide').forEach(expandMath);

/* ---------- Bühne skalieren (wie PowerPoint im Vollbild) ---------- */
const app=$('#app');
// Feste Höhe 800, Breite passt sich dem Bildschirm an (1280–1500) – immer Querformat
function fit(){ const W=window.innerWidth, H=window.innerHeight, cw=Math.round(Math.min(1500,Math.max(1280,800*W/H)));
  app.style.width=cw+'px'; const s=Math.min(W/cw,H/800);
  app.style.transform=`translate(${(W-cw*s)/2}px,${(H-800*s)/2}px) scale(${s})`; }
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,300)); fit();
function toggleFull(){ const d=document, e=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
  else { const r=e.requestFullscreen||e.webkitRequestFullscreen; if(r) r.call(e); } }
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)) $('#bFull').style.display='none';

/* ---------- Funktionen ---------- */
const f=x=>0.25*(x+6)**2-7, g=x=>-3.75*x-4.5, h=x=>-1.5*x+2, p=x=>0.5*(x-2)**2-3;
const CF='#6A5ACD', CG='#C0392B', CH='#1D70B8', CP='#E07B00', GR='#2E7D32', OR='#E07B00', RW='#C80046';

let pid=0;
function Plot(hostId,o){
  const host=document.getElementById(hostId);
  const W=o.W||640,H=o.H||460,L=o.L??44,R=o.R??28,T=o.T??22,B=o.B??28;
  const {xmin,xmax,ymin,ymax}=o, id='pl'+(++pid);
  const sx=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R), sy=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="plot"><defs><clipPath id="${id}c"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath><marker id="${id}a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker></defs><g stroke="#ece4e0" stroke-width="1">`;
  for(let x=Math.ceil(xmin/o.xg)*o.xg;x<=xmax+1e-9;x+=o.xg) s+=`<line x1="${sx(x)}" y1="${T}" x2="${sx(x)}" y2="${H-B}"/>`;
  for(let y=Math.ceil(ymin/o.yg)*o.yg;y<=ymax+1e-9;y+=o.yg) s+=`<line x1="${L}" y1="${sy(y)}" x2="${W-R}" y2="${sy(y)}"/>`;
  s+='</g>';
  const y0=sy(0), x0=sx(0);
  s+=`<line x1="${L}" y1="${y0}" x2="${W-R+16}" y2="${y0}" stroke="#333" stroke-width="1.5" marker-end="url(#${id}a)"/>`;
  s+=`<line x1="${x0}" y1="${H-B}" x2="${x0}" y2="${T-12}" stroke="#333" stroke-width="1.5" marker-end="url(#${id}a)"/>`;
  s+='<g font-size="15" fill="#333">';
  for(let x=Math.ceil(xmin/o.xt)*o.xt;x<=xmax+1e-9;x+=o.xt){ if(Math.abs(x)<1e-9) continue; s+=`<line x1="${sx(x)}" y1="${y0-3}" x2="${sx(x)}" y2="${y0+3}" stroke="#333"/><text x="${sx(x)}" y="${y0+16}" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">${fmt(x)}</text>`; }
  for(let y=Math.ceil(ymin/o.yt)*o.yt;y<=ymax+1e-9;y+=o.yt){ if(Math.abs(y)<1e-9) continue; s+=`<line x1="${x0-3}" y1="${sy(y)}" x2="${x0+3}" y2="${sy(y)}" stroke="#333"/><text x="${x0-6}" y="${sy(y)+4}" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="3">${fmt(y)}</text>`; }
  s+=`<text x="${x0-6}" y="${y0+16}" text-anchor="end">0</text>`;
  s+=`<text x="${W-R+12}" y="${y0-8}" text-anchor="end" font-style="italic">x</text><text x="${x0+9}" y="${T-2}" font-style="italic">y</text></g>`;

  errs:{'-2':{'1':'Setze −2 in Klammern ein: 3 − (−2).<br>Minus vor der Klammer dreht das Vorzeichen: 3 + 2.','-5':'Setze −2 in Klammern ein: 3 − (−2) = 3 + 2.'},'2':{'5':'Hier ist x = 2 positiv: 3 − 2.','-1':'Rechne 3 − 2.'}},
  rule:'Setze negative Zahlen immer in Klammern ein.<br>− (−2) = + 2.',win:{xmin:-3.6,xmax:3.6,ymin:-1.6,ymax:6.6}});
/* ---------------------------------------------------------- Quadratische Funktion: Beispiel */
{ const xs=[-2,-1,0,1,2,3,4], f=x=>x*x-2*x-3;
  const calcs=xs.map((x,i)=>`<div class="cr" data-s="${i+2}">f(${fm(x)}) = ${P_(x)}² − 2 · ${P_(x)} − 3 = ${fm(x*x)} ${-2*x<0?'−':'+'} ${fm(Math.abs(2*x))} − 3 = <b>${fm(f(x))}</b></div>`).join('');
  slide('quad','q1',`<h2 class="th"><span class="no">2</span>Beispiel: Wertetabelle einer Parabel</h2>
  <div class="ecols"><div class="etext st compact" style="font-size:18px">
   <div><span class="m" style="font-size:24px">f(x) = x² − 2x − 3</span></div>
   <div data-s="1">Setze wieder jeden x-Wert ein.<br>Achtung: ${NB('(−2)² = (−2) · (−2) = 4')}.</div>
   ${T(xs,xs.map(f),{cell:xs.map((x,i)=>({s:i+2}))})}
   <div class="calc" style="font-size:18.5px">${calcs}</div>
   <div data-s="9">Die Punkte liegen auf einer ${NB('Parabel')}.<br>Verbinde sie freihand mit einer runden Kurve.</div>
   <div data-s="10" class="rule"><b class="t">Kontrolle</b>Die Werte sind spiegelbildlich zum Scheitelpunkt S(1 | −4).<br>5, 0, −3, <b>−4</b>, −3, 0, 5</div>
  </div><div class="evis"><div style="width:520px"><div id="gq1"></div></div></div></div>`);
}
/* ---------------------------------------------------------- Rechenaufgaben quadratisch */
CQ('quad','ge3',{q:qcalc,fx:'x² + 1',fn:x=>x*x+1,xs:[-2,-1,0,1,2],ask:[-2,-1],
  way:['<span class="neg">(−2)</span>² + 1 = <b class="rightc">4</b> + 1 = <b>5</b>','<span class="neg">(−1)</span>² + 1 = <b class="rightc">1</b> + 1 = <b>2</b>'],
  errs:{'-2':{'-3':'(−2)² = (−2) · (−2) = +4.<br>Ein Quadrat ist nie negativ.'},'-1':{'0':'(−1)² = (−1) · (−1) = +1.'}},
  rule:'Setze die negative Zahl in Klammern: (−2)².<br>(−2)² = (−2) · (−2) = 4.<br>Ein Quadrat ist nie negativ.',win:{xmin:-3.6,xmax:3.6,ymin:-1.6,ymax:7.6}});
CQ('quad','ge4',{q:qcalc,fx:'−x² + 4',fn:x=>-x*x+4,xs:[-2,-1,0,1,2],ask:[-1,-2],
  way:['−<span class="neg">(−1)</span>² + 4 = −(1) + 4 = <b class="rightc">−1</b> + 4 = <b>3</b>','−<span class="neg">(−2)</span>² + 4 = −(4) + 4 = <b class="rightc">−4</b> + 4 = <b>0</b>'],
  errs:{'-1':{'5':'Erst quadrieren: (−1)² = 1.<br>Dann das Minus davor: −1.'},'-2':{'8':'Erst quadrieren: (−2)² = 4.<br>Dann das Minus davor: −4.'}},
  rule:'Erst quadrieren, dann das Minus vor dem x² beachten.<br>−(−1)² = −(1) = −1.',win:{xmin:-3.6,xmax:3.6,ymin:-2.6,ymax:5.6}});
CQ('quad','ge5',{q:qcalc,fx:'x² + 2x',fn:x=>x*x+2*x,xs:[-3,-2,-1,0,1],ask:[-3,-1],
  way:['<span class="neg">(−3)</span>² + 2 · <span class="neg">(−3)</span> = 9 <b class="rightc">− 6</b> = <b>3</b>','<span class="neg">(−1)</span>² + 2 · <span class="neg">(−1)</span> = 1 <b class="rightc">− 2</b> = <b>−1</b>'],
  errs:{'-3':{'15':'Setze −3 auch bei 2x ein: 2 · (−3) = −6.','-15':'(−3)² = 9, nicht −9.<br>Und 2 · (−3) = −6.','-3':'(−3)² = 9, nicht −9.'},'-1':{'3':'2 · (−1) = −2.','-3':'(−1)² = +1.'}},
  rule:'Setze x <b>überall</b> mit Klammern ein – auch bei 2x.<br>(−3)² = 9 und 2 · (−3) = −6.',win:{xmin:-4.6,xmax:2.6,ymin:-2.6,ymax:5.6}});
/* ---------------------------------------------------------- Graph zeichnen */
const zz=[[-2,5],[-1,0],[0,-3],[1,-4],[2,-3],[3,0],[4,5]], fz=x=>x*x-2*x-3, WZ={xmin:-3.2,xmax:5.2,ymin:-5.2,ymax:7.2,xg:1,yg:1,xt:2,yt:2};
const variants={
  zig(P){ P.fg.insertAdjacentHTML('beforeend',`<polyline points="${zz.map(([x,y])=>P.sx(x)+','+P.sy(y)).join(' ')}" fill="none" stroke="${CF}" stroke-width="3"/>`); },
  ok(P){ P.fn(fz,CF,3); },
  tip(P){ P.fn(x=>Math.abs(x-1)<1.6?-4+1.6*Math.abs(x-1):fz(x),CF,3); },
  stop(P){ P.fg.insertAdjacentHTML('beforeend',`<path d="${P.path(fz,-2,4)}" fill="none" stroke="${CF}" stroke-width="3"/>`); }};
const mini=(id,v)=>{ const P=Plot(id,{...WZ,W:260,H:250,L:18,R:20,T:18,B:18}); variants[v](P); P.layer(0,zz.map(([x,y])=>P.pt(x,y,'#333',4)).join('')); };
question('quad',{q:'Welcher Graph von f(x) = x² − 2x − 3 ist <b>richtig</b> gezeichnet?',grid:1,
  opts:[{h:'<div class="optg" id="oz1"></div>',fb:'Hier sind die Punkte mit geraden Strichen verbunden. Eine Parabel ist aber rund.'},
        {h:'<div class="optg" id="oz2"></div>',fb:'Hier hat die Parabel unten eine Spitze. Eine Parabel ist auch am Scheitelpunkt rund.'},
        {h:'<div class="optg" id="oz3"></div>',ok:1},
        {h:'<div class="optg" id="oz4"></div>',fb:'Hier hört der Graph am letzten Punkt auf. Er geht aber weiter.'}],
  E:()=>`<div class="mini4">
   <div class="mc4 bad" data-s="1"><div id="mz1"></div><b style="color:#B00020">✗ Zickzack</b>Nie mit dem Lineal von Punkt zu Punkt.</div>
   <div class="mc4 bad" data-s="2"><div id="mz2"></div><b style="color:#B00020">✗ Spitze</b>Unten am Scheitelpunkt ist die Parabel rund.</div>
   <div class="mc4 bad" data-s="3"><div id="mz4"></div><b style="color:#B00020">✗ hört auf</b>Der Graph geht über die Punkte hinaus weiter.</div>
   <div class="mc4 good" data-s="4"><div id="mz3"></div><b style="color:#2E7D32">✓ richtig</b>Rund, glatt und über die Punkte hinaus.</div></div>`,
  draw(){ mini('oz1','zig'); mini('oz2','tip'); mini('oz3','ok'); mini('oz4','stop'); mini('mz1','zig'); mini('mz2','tip'); mini('mz3','ok'); mini('mz4','stop'); }});

/* ---------------------------------------------------------- Folien erzeugen */
const anchor=$('#anchor'); window.answered=Array(NQ).fill(false);
SEQ.forEach(it=>{
  if(it.t==='s'){ const s=document.createElement('section'); s.className='slide'; s.dataset.g=it.g; s.id=it.id; s.innerHTML=it.html; anchor.before(s); return; }
  const Q=it.Q, i=Q.i, qs=document.createElement('section'); qs.className='slide qslide'; qs.dataset.g=it.g; qs.dataset.q=i;
  if(Q.calc){
    const tab=`<table class="wtab qtab"><tr><th>x</th>${Q.xs.map(x=>`<td>${fm(x)}</td>`).join('')}</tr><tr><th>f(x)</th>${Q.xs.map(x=>Q.ask.includes(x)?`<td class="inp"><input class="tin" data-x="${x}" inputmode="decimal" autocomplete="off"></td>`:`<td>${fm(Q.fn(x))}</td>`).join('')}</tr></table>`;
    qs.innerHTML=`<div class="qnum">Frage ${i+1} von ${NQ}</div><div class="qbody single" style="max-width:1100px"><div class="q">${Q.q}</div>
     <div class="m" style="font-size:25px;margin:4px 0 6px">f(x) = ${Q.fx}</div>${tab}
     <div class="btns"><button class="pr" data-a="chk">Prüfen</button><button class="sec" data-a="sol" style="display:none">Lösung zeigen</button></div><div class="fb"></div></div>`;
  } else {
  const opts=Q.opts.map((o,j)=>`<div class="opt" data-j="${j}"><span class="mk"></span><span class="lt">${'ABCD'[j]}</span><span>${o.h}</span></div>`).join('');
  qs.innerHTML=`<div class="qnum">Frage ${i+1} von ${NQ}</div><div class="qbody single" style="max-width:1100px"><div class="q">${Q.q}</div>${Q.pre||''}<div class="mc${Q.grid?' grid4':''}">${opts}</div>
   <div class="btns"><button class="pr" data-a="chk">Prüfen</button><button class="sec" data-a="sol" style="display:none">Lösung zeigen</button></div><div class="fb"></div></div>`;
  }
  anchor.before(qs);
  const es=document.createElement('section'); es.className='slide eslide'; es.dataset.g=it.g; es.id='e'+(i+1);
  es.innerHTML=`<h2 class="eh"><span class="eb">Erklärung</span>zu Frage ${i+1} <small style="font-family:Calibri,Arial,sans-serif;font-size:15px;color:#777;font-weight:normal;margin-left:8px">Tippe auf weiter ▶ – Schritt für Schritt</small></h2>${Q.E()}`;
  anchor.before(es);
  const fb=$('.fb',qs), bChk=$('[data-a=chk]',qs), bSol=$('[data-a=sol]',qs);
  if(Q.calc){
    const ins=$$('input.tin',qs);
    ins.forEach((el,k)=>{ el.addEventListener('input',()=>el.classList.remove('ok','bad'));
      el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(k<ins.length-1&&!ins[k+1].value) ins[k+1].focus(); else bChk.click(); } }); });
    const finish=won=>{ answered[i]=true; ins.forEach(el=>{ el.value=fm(Q.fn(+el.dataset.x)); el.classList.remove('bad'); el.classList.add('ok'); el.disabled=true; });
      bChk.style.display='none'; bSol.style.display='none'; fb.className='fb ok'; fb.innerHTML=(won?'Richtig! ':'')+'Tippe auf <b>weiter ▶</b>. Dann siehst du den Rechenweg.'; updateBar(); };
    bChk.onclick=()=>{ if(ins.some(el=>!el.value.trim())){ fb.className='fb bad'; fb.textContent='Trage zuerst alle Werte ein.'; return; }
      const msgs=[]; let all=true;
      ins.forEach(el=>{ const x=+el.dataset.x, v=num(el.value), sol=Q.fn(x), ok=Math.abs(v-sol)<1e-9; el.classList.remove('ok','bad'); el.classList.add(ok?'ok':'bad');
        if(!ok){ all=false; const h=(Q.errs[String(x)]||{})[String(v)]; msgs.push(`<b>Bei x = ${fm(x)}:</b> ${h||'Rechne noch einmal. Setze '+fm(x)+' in Klammern ein.'}`); } });
      if(all){ finish(true); return; }
      fb.className='fb bad'; fb.innerHTML='Noch nicht ganz richtig.<br>'+msgs.join('<br>')+'<br>Verbessere den roten Wert.'; bSol.style.display=''; };
    bSol.onclick=()=>finish(false);
    return;
  }
  const optEls=$$('.opt',qs);
  optEls.forEach(o=>o.onclick=()=>{ if(answered[i]) return; optEls.forEach(x=>x.classList.remove('right','wrong','sel')); o.classList.add('sel'); fb.textContent=''; fb.className='fb'; });
  const finish=won=>{ answered[i]=true; optEls.forEach((o,j)=>{ o.classList.add('locked'); o.classList.remove('wrong','sel'); if(Q.opts[j].ok) o.classList.add('right'); });
    bChk.style.display='none'; bSol.style.display='none'; fb.className='fb ok'; fb.innerHTML=(won?'Richtig! ':'')+'Tippe auf <b>weiter ▶</b>. Dann siehst du die Erklärung.'; updateBar(); };
  bChk.onclick=()=>{ const s=optEls.find(o=>o.classList.contains('sel'));
    if(!s){ fb.className='fb bad'; fb.textContent='Wähle zuerst eine Antwort.'; return; }
    const j=+s.dataset.j; if(Q.opts[j].ok){ finish(true); return; }
    s.classList.remove('sel'); s.classList.add('wrong'); fb.className='fb bad'; fb.innerHTML='Leider nicht richtig. '+Q.opts[j].fb+'<br>Versuche es noch einmal.'; bSol.style.display=''; };
  bSol.onclick=()=>finish(false);
});

/* ---------------------------------------------------------- Grafiken */
{ const P=Plot('pStart',{W:520,H:470,xmin:-3.6,xmax:4.6,ymin:-5.2,ymax:6.2,xg:1,yg:1,xt:1,yt:1}); P.fn(x=>x*x-2*x-3,CF,3.5); P.fn(x=>2*x-1,CH,3.5);
  P.layer(0,[-2,-1,0,1,2,3,4].map(x=>P.pt(x,x*x-2*x-3,CF,6)).join('')+[-1,0,1,2,3].map(x=>P.pt(x,2*x-1,CH,6)).join('')); }
{ const P=Plot('gl1',{W:560,H:520,xmin:-3.6,xmax:3.6,ymin:-6.6,ymax:4.6,xg:1,yg:1,xt:1,yt:1});
  [-2,-1,0,1,2].forEach((x,i)=>P.layer(i+2,P.pt(x,2*x-1,CH,8)+P.txt(x,2*x-1,`(${fm(x)} | ${fm(2*x-1)})`,CH,x<0?-12:12,x<0?-10:22,x<0?'end':'start',15)));
  P.layer(7,`<path d="${P.path(x=>2*x-1,-3.6,3.6)}" fill="none" stroke="${CH}" stroke-width="3"/>`); }
{ const P=Plot('gq1',{W:520,H:540,xmin:-3.2,xmax:5.2,ymin:-5.2,ymax:7.2,xg:1,yg:1,xt:1,yt:1});
  [-2,-1,0,1,2,3,4].forEach((x,i)=>P.layer(i+2,P.pt(x,x*x-2*x-3,CF,8)));
  P.layer(9,`<path d="${P.path(x=>x*x-2*x-3,-3.2,5.2)}" fill="none" stroke="${CF}" stroke-width="3"/>`);
  P.layer(10,P.ln(1,-5.2,1,7.2,RW,2,'7 5')+P.txt(1,-4,'S(1 | −4)',RW,12,22,'start',16)); }
SEQ.forEach(it=>{ if(it.t==='q'&&it.Q.draw) it.Q.draw(); });

initDeck([['start','Start'],['lin','Lineare Funktionen'],['quad','Quadratische Funktionen']]);
</script>
