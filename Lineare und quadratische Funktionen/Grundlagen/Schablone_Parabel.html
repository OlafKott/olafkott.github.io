<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schablone · Übung 5</title><style>
:root{ --rwb:#C80046; --ink:#1d1d1f; --ok:#2E7D32; --bad:#B00020; --blue:#1D70B8; }
*{ box-sizing:border-box; }
body{ margin:0; background:#f1f1f1; font-family:Calibri,Carlito,Arial,sans-serif; color:var(--ink); line-height:1.5; font-size:18px; }
.top{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 18px; border-bottom:3px solid var(--rwb); background:#f1f1f1; }
.top h1{ margin:0; font-size:21px; color:var(--rwb); font-family:Georgia,serif; line-height:1.25; } .top img{ height:38px; }
.wrap{ max-width:900px; margin:0 auto; padding:12px 12px 90px; }
.pick{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.pick .grp{ width:100%; font-weight:bold; color:#9E0037; font-size:16px; margin-top:4px; }
.pick button{ font:inherit; font-weight:bold; font-size:19px; min-width:52px; padding:6px 12px; border-radius:10px; border:2px solid var(--rwb); background:#fff; color:var(--rwb); cursor:pointer; }
.pick button.on{ background:var(--rwb); color:#fff; }
.card{ background:#fff; border:1px solid #d9d2c5; border-radius:12px; padding:12px 16px; margin:12px 0; overflow-x:auto; }
.task{ border:2px solid var(--rwb); }
.task .fx{ font-family:Cambria,Georgia,serif; font-size:21px; }
.task svg{ display:block; width:100%; max-width:340px; margin:6px auto 0; }
.eq{ display:grid; grid-template-columns:max-content max-content max-content max-content; column-gap:10px; row-gap:12px; align-items:center; font-family:Cambria,Georgia,serif; font-size:20px; }
.eq .er{ display:contents; } .eq .l{ text-align:right; white-space:nowrap; } .eq .r{ white-space:nowrap; } .eq .op{ color:var(--blue); padding-left:14px; white-space:nowrap; }
.eq .gap{ grid-column:1 / -1; height:6px; }
.ln{ font-family:Cambria,Georgia,serif; font-size:20px; white-space:nowrap; margin:4px 0 14px; }
input.in{ font-family:Cambria,Georgia,serif; font-size:19px; width:2.7em; height:38px; text-align:center; border:2px dashed #8a8a8a; border-radius:9px; background:#fafafa; padding:0 3px; vertical-align:middle; margin:0 1px; color:inherit; }
.op input.in{ color:var(--blue); }
input.in:focus{ outline:none; border-color:var(--rwb); border-style:solid; background:#fff; }
input.in.ok{ border:2px solid var(--ok); background:#eaf6ea; color:var(--ok); }
input.in.bad{ border:2px solid var(--bad); background:#fdecee; color:var(--bad); }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; line-height:1.15; }
.fr .nu{ border-bottom:1.5px solid currentColor; padding:0 3px 2px; } .fr .de{ padding:2px 3px 0; }
.sq{ display:inline-flex; align-items:stretch; vertical-align:middle; } .sq .sym{ font-size:1.5em; line-height:1.5; } .sq .rad{ border-top:1.5px solid currentColor; padding:3px 2px 0; }
.bar{ position:fixed; left:0; right:0; bottom:0; background:rgba(241,241,241,.96); border-top:1px solid #d9d2c5; padding:10px; text-align:center; }
.bar button{ font:inherit; font-weight:bold; font-size:20px; background:var(--rwb); color:#fff; border:none; border-radius:10px; padding:10px 46px; cursor:pointer; }
#sheet{ display:none; }
@media (max-width:560px){ .eq{ font-size:18px; column-gap:6px; } input.in{ font-size:17px; width:2.4em; height:34px; } .ln{ font-size:18px; } }
</style></head><body>

 <div class="card"><div class="pick"><button onclick="pick(0)">a)</button><button onclick="pick(1)">b)</button><button onclick="pick(2)">c)</button><button onclick="pick(3)">d)</button></div></div>
 <div class="card task" id="task" style="display:none"></div>

</div>
<div class="bar" style="display:none"><button onclick="check()">Prüfen</button></div>
<script>
const $=s=>document.querySelector(s);
const R=x=>Math.round(x*1e6)/1e6;
const F=n=>{ n=R(n); const s=String(Math.abs(n)).replace('.',','); return (n<0?'−':'')+s; };
const FR=(a,b)=>`<span class="fr"><span class="nu">${a}</span><span class="de">${b}</span></span>`;
const SQ=x=>`<span class="sq"><span class="sym">√</span><span class="rad">${x}</span></span>`;
const near=(a,b)=>a!==null&&isFinite(a)&&isFinite(b)&&Math.abs(a-b)<1e-6;
function num(s){
  s=(s||'').trim().replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  if(s==='-') return -1; if(s==='+') return 1;
  const m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/); if(m) return (+m[1])/(+m[2]);
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? +s : NaN;
}
const inp=k=>`<input class="in" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
const eq=rows=>'<div class="eq">'+rows.map(r=>r==='gap'?'<div class="gap"></div>':`<div class="er"><span class="l">${r[0]}</span><span class="e">${r.length>1?'=':''}</span><span class="r">${r[1]||''}</span><span class="op">${r[2]?'| '+r[2]:''}</span></div>`).join('')+'</div>';
let T=null;
function pick(i){
  T=TASKS[i];
  document.querySelectorAll('.pick button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#task').innerHTML=HEAD(T); $('#sheet').innerHTML=SHEET(T);
  $('#task').style.display=$('#sheet').style.display='block'; $('.bar').style.display='block';
  document.querySelectorAll('#sheet input.in').forEach(el=>{
    el.addEventListener('input',()=>el.classList.remove('ok','bad'));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  });
}
function check(){
  const els=[...document.querySelectorAll('#sheet input.in')], v={};
  els.forEach(el=>{ v[el.dataset.k]=el.value.trim()===''?null:num(el.value); });
  const res=CHECK(T,v);
  els.forEach(el=>{ el.classList.remove('ok','bad'); const k=el.dataset.k; if(v[k]===null) return;
    el.classList.add(res[k]===true?'ok':'bad'); });
}


const TASKS=[[1,-2,-3,[-6,3,-4,6],[0,1]],[-1,1,4,[-3,5,-3,6],[0,3]],[0.5,3,-2,[-2,7,-3,6],[1,0]],[2,-1,2,[-4,3,-2,8],[0,4]]]
  .map((t,i)=>({l:'abcd'[i],a:t[0],d:t[1],e:t[2],w:t[3],P:t[4]}));
const f=(T,x)=>T.a*(x-T.d)**2+T.e;
function plot(T){
  const [x0,x1,y0,y1]=T.w, Wp=420, L=14,Rr=22,Tp=18,B=14, Hp=Math.round(Tp+B+(y1-y0)*(Wp-L-Rr)/(x1-x0));
  const sx=x=>L+(x-x0)/(x1-x0)*(Wp-L-Rr), sy=y=>Tp+(y1-y)/(y1-y0)*(Hp-Tp-B);
  let s=`<svg viewBox="0 0 ${Wp} ${Hp}"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#222"/></marker><clipPath id="cl"><rect x="${L}" y="${Tp}" width="${Wp-L-Rr}" height="${Hp-Tp-B}"/></clipPath></defs><g stroke="#c9d6c9" stroke-width="0.8">`;
  for(let x=x0;x<=x1;x++) s+=`<line x1="${sx(x)}" y1="${Tp}" x2="${sx(x)}" y2="${Hp-B}"/>`;
  for(let y=y0;y<=y1;y++) s+=`<line x1="${L}" y1="${sy(y)}" x2="${Wp-Rr}" y2="${sy(y)}"/>`;
  s+=`</g><line x1="${L}" y1="${sy(0)}" x2="${Wp-Rr+14}" y2="${sy(0)}" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/><line x1="${sx(0)}" y1="${Hp-B}" x2="${sx(0)}" y2="${Tp-12}" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/><g font-size="12" font-family="Calibri,Arial,sans-serif" fill="#222">`;
  for(let x=x0+1;x<x1;x++) if(x) s+=`<text x="${sx(x)}" y="${sy(0)+14}" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">${F(x)}</text>`;
  for(let y=y0+1;y<y1;y++) if(y) s+=`<text x="${sx(0)-5}" y="${sy(y)+4}" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="3">${F(y)}</text>`;
  s+=`<text x="${sx(0)-5}" y="${sy(0)+14}" text-anchor="end">0</text><text x="${Wp-Rr+8}" y="${sy(0)-7}" font-style="italic" font-size="14">x</text><text x="${sx(0)+7}" y="${Tp-3}" font-style="italic" font-size="14">y</text></g>`;
  let p=''; for(let i=0;i<=400;i++){ const x=x0+(x1-x0)*i/400, y=Math.max(y0-5,Math.min(y1+5,f(T,x))); p+=(i?' L':'M')+sx(x).toFixed(1)+','+sy(y).toFixed(1); }
  return s+`<g clip-path="url(#cl)"><path d="${p}" fill="none" stroke="#6A5ACD" stroke-width="2.6"/></g></svg>`;
}

  ['',`${inp('A2')}x² ${inp('B2')}x ${inp('C2')}`]
]);
function CHECK(T,v){
  const r={};
  const pOk=v.px!==null&&v.py!==null&&Number.isInteger(R(v.px))&&!near(v.px,T.d)&&near(f(T,v.px),v.py);
  r.px=pOk||(v.px!==null&&v.py===null&&Number.isInteger(R(v.px))&&!near(v.px,T.d)&&isFinite(f(T,v.px))&&v.px>=T.w[0]&&v.px<=T.w[1]&&f(T,v.px)>=T.w[2]&&f(T,v.px)<=T.w[3]);
  r.py=pOk;
  const [px,py]=pOk?[v.px,v.py]:T.P, K=(px-T.d)**2, a=T.a, d=T.d, e=T.e;
  const t={d,e,py1:py,px1:px,md1:-d,e1:e,py2:py,K,e2:e,o1:-e,L:py-e,K2:K,o2:K,a,
           a1:a,md3:-d,e3:e,a2:a,B:-2*d,C:d*d,e4:e,A1:a,B1:-2*a*d,C1:a*d*d,e5:e,A2:a,B2:-2*a*d,C2:a*d*d+e};
  for(const k in t) r[k]=near(v[k],t[k]); return r;
}
