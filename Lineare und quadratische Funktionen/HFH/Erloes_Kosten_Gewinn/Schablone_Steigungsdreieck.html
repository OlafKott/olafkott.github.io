<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schablone · Steigungs-Dreieck und Gerade</title><style>
:root{--rwb:#C80046;--ink:#1d1d1f;--ok:#2E7D32;--bad:#B00020;--blue:#1D70B8}
*{box-sizing:border-box}
body{margin:0;background:#f1f1f1;font-family:Calibri,Carlito,Arial,sans-serif;color:var(--ink);line-height:1.5;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:3px solid var(--rwb);background:#f1f1f1;position:sticky;top:0;z-index:3}
.top h1{margin:0;font-size:21px;color:var(--rwb);font-family:Georgia,serif;line-height:1.25}.top img{height:34px}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 60px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:inherit;font-weight:bold;font-size:18px;padding:6px 14px;border-radius:10px;border:2px solid var(--rwb);background:#fff;color:var(--rwb);cursor:pointer}
.pick button.on{background:var(--rwb);color:#fff}
.card{background:#fff;border:1px solid #d9d2c5;border-radius:12px;padding:12px 16px;margin:12px 0;overflow-x:auto}
.card h2{margin:0 0 6px;font-size:20px;color:var(--rwb)}
.say{font-size:17px;color:#444;margin:0 0 8px}
.fn{font-family:Cambria,Georgia,serif;font-size:20px;font-weight:bold;margin:10px 0 4px}
table{border-collapse:collapse;margin:2px 0 8px}
td,th{border:1px solid #aaa;padding:3px 4px;text-align:center;font-family:Cambria,Georgia,serif;font-size:18px;min-width:56px}
th{background:#f3f3f3}
input.in{width:62px;font:inherit;font-size:18px;text-align:center;border:2px dashed #999;border-radius:7px;padding:2px 2px;background:#fff}
input.in.ok{border:2px solid var(--ok);background:#EAF5EA}input.in.bad{border:2px solid var(--bad);background:#FDECEA}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:Cambria,Georgia,serif;font-size:20px;margin:6px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btns button{font:inherit;font-weight:bold;font-size:18px;padding:8px 18px;border-radius:9px;border:2px solid var(--rwb);cursor:pointer;background:var(--rwb);color:#fff}
.btns button.sec{background:#fff;color:var(--rwb)}
.fb{font-weight:bold;margin-top:8px;min-height:1.4em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.graph{display:none;margin-top:10px}.graph svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;background:#fff}
.hint{background:#FFF8E8;border:1.5px dashed #E0A800;border-radius:8px;padding:6px 12px;font-size:16px;margin:8px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 2px}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 2px}.fr .de{padding:0 2px}
</style></head><body>

"title": "Achsen mit anderen Schritten", "say": "Trage deine Ergebnisse ein.", "parts": [{"type": "val", "label": "1 Kästchen nach rechts =", "v": 2, "unit": "ME"}, {"type": "val", "label": "1 Kästchen nach oben =", "v": 10, "unit": "GE"}, {"type": "val", "label": "Fixkosten =", "v": 30, "unit": "GE"}, {"type": "eq", "name": "E", "col": "#2E7D32", "m": 8, "b": 0}, {"type": "eq", "name": "K", "col": "#6A3FC8", "m": 5, "b": 30}, {"type": "val", "label": "BEP: x =", "v": 10, "unit": "ME"}, {"type": "val", "label": "BEP: y =", "v": 80, "unit": "GE"}], "svg": null}];
const $=s=>document.querySelector(s);
function num(s){ s=(s||'').trim().replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  const m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/); if(m) return (+m[1])/(+m[2]);
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)?+s:NaN; }
const near=(a,b)=>isFinite(a)&&Math.abs(a-b)<1e-6;
const F=v=>{ v=Math.round(v*1e6)/1e6; return String(Math.abs(v)).replace('.',',').replace(/^/, v<0?'−':''); };
const inp=(k)=>`<input class="in" data-k="${k}" autocomplete="off" inputmode="decimal">`;
let T=null;
function body(t){
  let h=`<h2>Aufgabe ${t.nr}: ${t.title}</h2><p class="say">${t.say}</p>`;
  t.parts.forEach((p,pi)=>{
    if(p.type==='table'){
      h+=`<div class="fn" style="color:${p.col}">${p.label}</div><table><tr><th>x</th>`;
      if(p.xs) h+=p.xs.map(x=>`<td>${F(x)}</td>`).join('')+'</tr><tr><th>y</th>'+p.xs.map((x,i)=>`<td>${inp(pi+'_y'+i)}</td>`).join('');
      else { h+=[0,1,2,3].map(i=>`<td>${inp(pi+'_x'+i)}</td>`).join('')+'</tr><tr><th>y</th>'+[0,1,2,3].map(i=>`<td>${inp(pi+'_y'+i)}</td>`).join(''); }
      h+='</tr></table>';
    } else if(p.type==='eq'){
      h+=`<div class="row"><b style="color:${p.col}">${p.name}(x) =</b> ${inp(pi+'_m')} · x + ${inp(pi+'_b')}</div>`;
    } else if(p.type==='val'){
      h+=`<div class="row">${p.label} ${inp(pi+'_v')} ${p.unit||''}</div>`;
    } else if(p.type==='note'){
      h+=`<div class="hint">${p.html}</div>`;
    }
  });
  h+=`<div class="btns"><button onclick="check()">Prüfen</button>${t.svg?'<button class="sec" onclick="showG()">Graph zeigen</button>':''}</div><div class="fb" id="fb"></div>`;
  if(t.svg) h+=`<div class="graph" id="gr"><p class="say">So sieht der richtige Graph aus. Vergleiche mit deinem Blatt.</p>${t.svg}</div>`;
  return h;
}
function pick(i){ T=TASKS[i]; document.querySelectorAll('.pick button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#task').innerHTML=body(T); $('#task').style.display='block';
  document.querySelectorAll('#task input.in').forEach(el=>{ el.addEventListener('input',()=>el.classList.remove('ok','bad'));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); }); });
  history.replaceState(null,'','#a'+T.nr); }
function showG(){ const g=$('#gr'); g.style.display=g.style.display==='block'?'none':'block'; }
function check(){
  const v=k=>{ const el=document.querySelector(`#task input[data-k="${k}"]`); return el?el.value.trim():''; };
  const mark=(k,ok)=>{ const el=document.querySelector(`#task input[data-k="${k}"]`); if(el&&el.value.trim()!=='') el.classList.add(ok?'ok':'bad'); };
  let all=true, any=false;
  T.parts.forEach((p,pi)=>{
    const f=x=>p.m*x+p.b;
    if(p.type==='table'){
      if(p.xs) p.xs.forEach((x,i)=>{ const s=v(pi+'_y'+i); if(s===''){all=false;return;} any=true; const ok=near(num(s),f(x)); mark(pi+'_y'+i,ok); if(!ok) all=false; });
      else { let n=0; [0,1,2,3].forEach(i=>{ const sx=v(pi+'_x'+i), sy=v(pi+'_y'+i); if(sx===''&&sy==='') return; any=true;
        const x=num(sx); const ok=isFinite(x)&&near(num(sy),f(x)); mark(pi+'_x'+i,isFinite(x)); mark(pi+'_y'+i,ok); if(ok) n++; else all=false; });
        if(n<3) all=false; }
    } else if(p.type==='eq'){
      const sm=v(pi+'_m'), sb=v(pi+'_b'); if(sm===''||sb===''){ all=false; }
      if(sm!==''){ any=true; const ok=near(num(sm),p.m); mark(pi+'_m',ok); if(!ok) all=false; }
      if(sb!==''){ any=true; const ok=near(num(sb),p.b); mark(pi+'_b',ok); if(!ok) all=false; }
    } else if(p.type==='val'){
      const s=v(pi+'_v'); if(s===''){ all=false; return; } any=true; const ok=near(num(s),p.v); mark(pi+'_v',ok); if(!ok) all=false;
    }
  });
  const fb=$('#fb');
  if(!any){ fb.className='fb'; fb.textContent='Trage zuerst deine Ergebnisse ein.'; return; }
  if(all){ fb.className='fb ok'; fb.textContent='Super! Alles ist richtig.'+(T.svg?' Vergleiche jetzt noch deinen Graphen.':''); }
  else { fb.className='fb bad'; fb.textContent='Rote Felder stimmen noch nicht. Rechne noch einmal nach.'; }
}
document.querySelectorAll('.pick button').forEach((b,i)=>b.onclick=()=>pick(i));
const h=(location.hash||'').match(/^#a(\d+)$/); if(h){ const i=TASKS.findIndex(t=>t.nr==+h[1]); if(i>=0) pick(i); }
</script></body></html>
